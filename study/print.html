, "title": "雲端數據收集與平台設計：資料交換格式、資料庫設計", "short": "雲端資料＋資料庫", "lectureChars": 5148, "checks": [{"ref": "考科二 2-2", "opts": ["CSV 只能表示平面表格，最不適合表達這種巢狀與陣列結構", "CSV 檔案最小，所以最適合任何結構", "JSON 不支援陣列，因此不能用", "XML 不能表示巢狀結構"], "exp": "CSV 只有平面表格，沒有巢狀結構；JSON 原生支援物件與陣列，是 REST API 與 MQTT 酬載的常見選擇；XML 也能以樹狀表示巢狀，只是較冗長。", "stem": "某裝置要上傳的資料包含巢狀的 `location`（lat、lng）物件，以及長度不固定的 `tags` 陣列。若只能在 JSON、XML、CSV 中選擇，下列哪一個說法最正確？", "ans": 0, "id": "d10c1", "n": 1, "stemH": "某裝置要上傳的資料包含巢狀的 <code>location<\/code>（lat、lng）物件，以及長度不固定的 <code>tags<\/code> 陣列。若只能在 JSON、XML、CSV 中選擇，下列哪一個說法最正確？", "optsH": ["CSV 只能表示平面表格，最不適合表達這種巢狀與陣列結構", "CSV 檔案最小，所以最適合任何結構", "JSON 不支援陣列，因此不能用", "XML 不能表示巢狀結構"], "expH": "<span class=\"gl\" data-g=\"253\" tabindex=\"0\" role=\"button\">CSV<\/span> 只有平面表格，沒有巢狀結構；<span class=\"gl\" data-g=\"251\" tabindex=\"0\" role=\"button\">JSON<\/span> 原生支援物件與陣列，是 <span class=\"gl\" data-g=\"186\" tabindex=\"0\" role=\"button\">REST API<\/span> 與 <span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span> 酬載的常見選擇；<span class=\"gl\" data-g=\"213\" tabindex=\"0\" role=\"button\">XML<\/span> 也能以<span class=\"gl\" data-g=\"382\" tabindex=\"0\" role=\"button\">樹狀<\/span>表示巢狀，只是較冗長。"}, {"ref": "考科二 2-2", "opts": ["命令與資料分開，例如 `site1/dev01/cmd` 與 `site1/dev01/data`", "Topic 改成以 `/` 開頭", "Topic 中加入空白字元以便閱讀", "全部改用 `#` 發布訊息"], "exp": "講義的 Topic 設計原則：用 / 由大到小分層、區分大小寫、不要以 / 開頭或含空白，而且「命令與資料分開」。# 是訂閱用的萬用字元，不是拿來發布的主題。", "stem": "某團隊把「雲端下發的控制命令」與「裝置上傳的感測資料」都發布到同一個 Topic `site1/dev01`，結果裝置常把自己上傳的資料誤當成命令。依講義的 Topic 設計原則，最好的改善是？", "ans": 0, "id": "d10c2", "n": 2, "stemH": "某團隊把「雲端下發的控制命令」與「裝置上傳的感測資料」都發布到同一個 Topic <code>site1/dev01<\/code>，結果裝置常把自己上傳的資料誤當成命令。依講義的 Topic 設計原則，最好的改善是？", "optsH": ["命令與資料分開，例如 <code>site1/dev01/cmd<\/code> 與 <code>site1/dev01/data<\/code>", "Topic 改成以 <code>/<\/code> 開頭", "Topic 中加入空白字元以便閱讀", "全部改用 <code>#<\/code> 發布訊息"], "expH": "講義的 <span class=\"gl\" data-g=\"177\" tabindex=\"0\" role=\"button\">Topic<\/span> 設計原則：用 / 由大到小分層、區分大小寫、不要以 / 開頭或含空白，而且「命令與資料分開」。# 是訂閱用的萬用字元，不是拿來發布的主題。"}, {"ref": "考科二 2-2", "opts": ["索引能加快查詢，但會增加寫入成本與儲存空間", "索引能同時讓查詢與寫入都變快，沒有任何代價", "索引就是主鍵，一張表只能有一個", "建索引會刪除重複資料，等同正規化"], "exp": "講義：索引（Index）加快查詢，但會增加寫入成本與空間。索引不等於主鍵；也不是正規化。IoT 寫入量大的表，要衡量索引數量。", "stem": "DBA 在 readings 表的 `ts`（時間戳）欄位建立索引後，「查詢某段時間的讀值」明顯變快。關於索引，下列敘述何者正確？", "ans": 0, "id": "d10c3", "n": 3, "stemH": "DBA 在 readings 表的 <code>ts<\/code>（時間戳）欄位建立索引後，「查詢某段時間的讀值」明顯變快。關於索引，下列敘述何者正確？", "optsH": ["索引能加快查詢，但會增加寫入成本與儲存空間", "索引能同時讓查詢與寫入都變快，沒有任何代價", "索引就是主鍵，一張表只能有一個", "建索引會刪除重複資料，等同正規化"], "expH": "講義：<span class=\"gl\" data-g=\"245\" tabindex=\"0\" role=\"button\">索引<\/span>（Index）加快查詢，但會增加寫入成本與空間。索引不等於<span class=\"gl\" data-g=\"242\" tabindex=\"0\" role=\"button\">主鍵<\/span>；也不是<span class=\"gl\" data-g=\"32\" tabindex=\"0\" role=\"button\">正規化<\/span>。<span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">IoT<\/span> 寫入量大的表，要衡量索引數量。"}, {"ref": "考科二 2-2", "opts": ["文件型 NoSQL（如 MongoDB）", "固定綱要的關聯式資料庫", "圖形資料庫（如 Neo4j）", "只用 Excel 試算表"], "exp": "文件型資料庫存 JSON 類文件、綱要彈性，講義的 IoT 用途正是「不同型號裝置欄位不一的資料」。關聯式資料庫是固定綱要；圖形資料庫用於設備拓樸與關聯分析。", "stem": "某平台接入數十種型號的裝置，每種型號上傳的欄位差異很大，而且常常新增欄位。若希望不必每次都修改資料表綱要（Schema），依講義最適合的資料庫類型是？", "ans": 0, "id": "d10c4", "n": 4, "stemH": "某平台接入數十種型號的裝置，每種型號上傳的欄位差異很大，而且常常新增欄位。若希望不必每次都修改資料表綱要（Schema），依講義最適合的資料庫類型是？", "optsH": ["文件型 NoSQL（如 MongoDB）", "固定綱要的關聯式資料庫", "圖形資料庫（如 Neo4j）", "只用 Excel 試算表"], "expH": "文件型資料庫存 <span class=\"gl\" data-g=\"251\" tabindex=\"0\" role=\"button\">JSON<\/span> 類文件、<span class=\"gl\" data-g=\"246\" tabindex=\"0\" role=\"button\">綱要<\/span>彈性，講義的 <span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">IoT<\/span> 用途正是「不同型號裝置欄位不一的資料」。<span class=\"gl\" data-g=\"235\" tabindex=\"0\" role=\"button\">關聯式資料庫<\/span>是固定綱要；圖形資料庫用於設備<span class=\"gl\" data-g=\"382\" tabindex=\"0\" role=\"button\">拓樸<\/span>與關聯分析。"}], "lecture": "<blockquote>\n<p><strong>📌 考科二說明<\/strong>：本日內容依簡章評鑑內容 2-2「<span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>環境數據收集與平台設計」與能力指標 1「軟體設計基礎（雲端資料交換格式、資料庫設計基礎）」撰寫；考科二無官方學習指引，內容皆為一般技術知識（標「補充」）。<\/p>\n<\/blockquote>\n<h3>今天要搞懂的 5 件事<\/h3>\n<ol>\n<li>雲端數據收集的流程：裝置 → 傳輸 → 接收（<span class=\"gl\" data-g=\"176\" tabindex=\"0\" role=\"button\">Broker<\/span>／<span class=\"gl\" data-g=\"187\" tabindex=\"0\" role=\"button\">API<\/span>）→ 處理 → 儲存 → 視覺化與應用。<\/li>\n<li><span class=\"gl\" data-g=\"251\" tabindex=\"0\" role=\"button\">JSON<\/span>、<span class=\"gl\" data-g=\"213\" tabindex=\"0\" role=\"button\">XML<\/span>、<span class=\"gl\" data-g=\"253\" tabindex=\"0\" role=\"button\">CSV<\/span> 的語法與優缺點，能看懂並找出格式錯誤。<\/li>\n<li><span class=\"gl\" data-g=\"186\" tabindex=\"0\" role=\"button\">REST API<\/span> 的 <span class=\"gl\" data-g=\"106\" tabindex=\"0\" role=\"button\">HTTP<\/span> 方法與<span class=\"gl\" data-g=\"190\" tabindex=\"0\" role=\"button\">狀態碼<\/span>；<span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span> <span class=\"gl\" data-g=\"177\" tabindex=\"0\" role=\"button\">Topic<\/span> 的命名設計。<\/li>\n<li><span class=\"gl\" data-g=\"235\" tabindex=\"0\" role=\"button\">關聯式資料庫<\/span>設計：資料表、<span class=\"gl\" data-g=\"242\" tabindex=\"0\" role=\"button\">主鍵<\/span>、<span class=\"gl\" data-g=\"243\" tabindex=\"0\" role=\"button\">外鍵<\/span>、<span class=\"gl\" data-g=\"32\" tabindex=\"0\" role=\"button\">正規化<\/span>（<span class=\"gl\" data-g=\"244\" tabindex=\"0\" role=\"button\">1NF<\/span>～3NF）、基本 <span class=\"gl\" data-g=\"240\" tabindex=\"0\" role=\"button\">SQL<\/span>。<\/li>\n<li><span class=\"gl\" data-g=\"236\" tabindex=\"0\" role=\"button\">NoSQL<\/span> 與<span class=\"gl\" data-g=\"247\" tabindex=\"0\" role=\"button\">時序資料庫<\/span>的特性，以及 <span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">IoT<\/span> 資料該存哪裡。<\/li>\n<\/ol>\n<h2>1. 雲端數據收集與平台架構 <span class=\"ref\">考科二 2-2<\/span><span class=\"supp\">補充（能力指標 1）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>階段<\/th>\n<th>做什麼<\/th>\n<th>常見技術<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>擷取<\/td>\n<td>裝置讀取感測值、加上<span class=\"gl\" data-g=\"266\" tabindex=\"0\" role=\"button\">時間戳<\/span>與裝置 ID<\/td>\n<td><span class=\"gl\" data-g=\"57\" tabindex=\"0\" role=\"button\">MCU<\/span>、<span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span><\/td>\n<\/tr>\n<tr>\n<td>傳輸<\/td>\n<td>送到<span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span><\/td>\n<td><span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span>、<span class=\"gl\" data-g=\"106\" tabindex=\"0\" role=\"button\">HTTP<\/span>/<span class=\"gl\" data-g=\"186\" tabindex=\"0\" role=\"button\">REST<\/span>、<span class=\"gl\" data-g=\"173\" tabindex=\"0\" role=\"button\">CoAP<\/span>、<span class=\"gl\" data-g=\"184\" tabindex=\"0\" role=\"button\">WebSocket<\/span><\/td>\n<\/tr>\n<tr>\n<td>接收<\/td>\n<td>接入與驗證裝置<\/td>\n<td>MQTT <span class=\"gl\" data-g=\"176\" tabindex=\"0\" role=\"button\">Broker<\/span>、<span class=\"gl\" data-g=\"261\" tabindex=\"0\" role=\"button\">API Gateway<\/span>、<span class=\"gl\" data-g=\"264\" tabindex=\"0\" role=\"button\">IoT 平台<\/span>（如 AWS IoT Core、Azure IoT Hub）<\/td>\n<\/tr>\n<tr>\n<td>處理<\/td>\n<td>清洗、轉換、規則判斷、告警；即時串流或批次<\/td>\n<td><span class=\"gl\" data-g=\"265\" tabindex=\"0\" role=\"button\">規則引擎<\/span>、串流處理、<span class=\"gl\" data-g=\"262\" tabindex=\"0\" role=\"button\">Node-RED<\/span><\/td>\n<\/tr>\n<tr>\n<td>儲存<\/td>\n<td>依資料特性選資料庫<\/td>\n<td>關聯式、<span class=\"gl\" data-g=\"236\" tabindex=\"0\" role=\"button\">NoSQL<\/span>、<span class=\"gl\" data-g=\"247\" tabindex=\"0\" role=\"button\">時序資料庫<\/span>、<span class=\"gl\" data-g=\"249\" tabindex=\"0\" role=\"button\">物件儲存<\/span><\/td>\n<\/tr>\n<tr>\n<td>應用<\/td>\n<td>視覺化、分析、<span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span>、對外 <span class=\"gl\" data-g=\"187\" tabindex=\"0\" role=\"button\">API<\/span><\/td>\n<td><span class=\"gl\" data-g=\"263\" tabindex=\"0\" role=\"button\">Grafana<\/span> 等<span class=\"gl\" data-g=\"91\" tabindex=\"0\" role=\"button\">儀表板<\/span>、報表、App<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>平台設計考量<\/strong>：<strong>可擴充性<\/strong>（裝置數量成長，水平擴充）、<strong>可靠性<\/strong>（斷線重傳、資料不遺失）、<strong>即時性<\/strong>、<strong>資安<\/strong>（裝置認證、加密、權限）、<strong>成本<\/strong>（傳輸與儲存費用）、<strong>資料保存政策<\/strong>（原始資料保留多久、舊資料<span class=\"gl\" data-g=\"248\" tabindex=\"0\" role=\"button\">降採樣<\/span>彙總）、<strong>裝置管理<\/strong>（註冊、狀態、<span class=\"gl\" data-g=\"168\" tabindex=\"0\" role=\"button\">OTA<\/span>）。<\/p>\n<blockquote>\n<p><strong>💡 例子（資料量估算）<\/strong>：1000 台裝置、每 10 秒上傳一筆、每筆 200 bytes → 每天 1000×8640×200 ≈ 1.7 GB。這類估算決定要不要在邊緣先彙整，以及資料庫與費用的規劃。<\/p>\n<\/blockquote>\n<h2>2. 資料交換格式：JSON、XML、CSV <span class=\"ref\">考科二 2-2<\/span><span class=\"supp\">補充（能力指標 1：雲端資料交換格式）<\/span><\/h2>\n<p><strong><span class=\"gl\" data-g=\"251\" tabindex=\"0\" role=\"button\">JSON<\/span>（JavaScript Object Notation）<\/strong><\/p>\n<pre><code class=\"language-json\">{\n  &quot;deviceId&quot;: &quot;TH-001&quot;,\n  &quot;ts&quot;: &quot;2026-10-27T08:30:00+08:00&quot;,\n  &quot;temp&quot;: 26.5,\n  &quot;online&quot;: true,\n  &quot;tags&quot;: [&quot;lineA&quot;, &quot;zone3&quot;],\n  &quot;location&quot;: {&quot;lat&quot;: 25.03, &quot;lng&quot;: 121.56}\n}\n<\/code><\/pre>\n<ul>\n<li>物件 <code>{ }<\/code> 由「鍵：值」組成；陣列 <code>[ ]<\/code>；<strong>鍵必須用雙引號<\/strong>；字串用雙引號（不能用單引號）。<\/li>\n<li>值的型別：字串、數字、布林（true／false）、null、物件、陣列。<\/li>\n<li><strong>不允許註解、不允許最後一個元素後面多逗號<\/strong>。<\/li>\n<\/ul>\n<p><strong><span class=\"gl\" data-g=\"213\" tabindex=\"0\" role=\"button\">XML<\/span>（eXtensible Markup Language）<\/strong><\/p>\n<pre><code class=\"language-xml\">&lt;reading deviceId=&quot;TH-001&quot;&gt;\n  &lt;ts&gt;2026-10-27T08:30:00+08:00&lt;/ts&gt;\n  &lt;temp unit=&quot;C&quot;&gt;26.5&lt;/temp&gt;\n&lt;/reading&gt;\n<\/code><\/pre>\n<ul>\n<li>標籤成對、<strong>區分大小寫<\/strong>、正確巢狀、<strong>只有一個根元素<\/strong>、屬性值加引號 → 稱為「格式良好（well-formed）」。<\/li>\n<li>可用 XSD／DTD 驗證結構；有命名空間；較冗長。<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>比較<\/th>\n<th>JSON<\/th>\n<th>XML<\/th>\n<th><span class=\"gl\" data-g=\"253\" tabindex=\"0\" role=\"button\">CSV<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>可讀性<\/td>\n<td>高、簡潔<\/td>\n<td>高但冗長<\/td>\n<td>高（表格）<\/td>\n<\/tr>\n<tr>\n<td>檔案大小<\/td>\n<td>小<\/td>\n<td>大（標籤重複）<\/td>\n<td>最小<\/td>\n<\/tr>\n<tr>\n<td>結構<\/td>\n<td>巢狀物件與陣列<\/td>\n<td><span class=\"gl\" data-g=\"382\" tabindex=\"0\" role=\"button\">樹狀<\/span>、屬性、命名空間<\/td>\n<td>只有平面表格<\/td>\n<\/tr>\n<tr>\n<td>結構驗證<\/td>\n<td>JSON <span class=\"gl\" data-g=\"246\" tabindex=\"0\" role=\"button\">Schema<\/span><\/td>\n<td>XSD／DTD<\/td>\n<td>無標準<\/td>\n<\/tr>\n<tr>\n<td>典型用途<\/td>\n<td><span class=\"gl\" data-g=\"186\" tabindex=\"0\" role=\"button\">REST API<\/span>、<span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span> 酬載、<span class=\"gl\" data-g=\"236\" tabindex=\"0\" role=\"button\">NoSQL<\/span> 文件<\/td>\n<td>舊系統、設定檔、SOAP、<span class=\"gl\" data-g=\"209\" tabindex=\"0\" role=\"button\">OPC UA<\/span>／<span class=\"gl\" data-g=\"212\" tabindex=\"0\" role=\"button\">MTConnect<\/span> <span class=\"gl\" data-g=\"210\" tabindex=\"0\" role=\"button\">資訊模型<\/span><\/td>\n<td>匯出報表、批次資料<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：JSON 的 <code>true<\/code>、<code>null<\/code> 不加引號；加了引號就變成字串 <code>\"true\"<\/code>。另有二進位格式（如 <strong><span class=\"gl\" data-g=\"254\" tabindex=\"0\" role=\"button\">CBOR<\/span>、Protocol Buffers<\/strong>）比 JSON 更省<span class=\"gl\" data-g=\"48\" tabindex=\"0\" role=\"button\">頻寬<\/span>，適合資源受限裝置。<\/p>\n<\/blockquote>\n<div class=\"cp\" id=\"cp_d10c1\" data-ans=\"0\"><div class=\"cph\">🧩 隨堂小測 1<span class=\"ref\">考科二 2-2<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">某裝置要上傳的資料包含巢狀的 <code>location<\/code>（lat、lng）物件，以及長度不固定的 <code>tags<\/code> 陣列。若只能在 JSON、XML、CSV 中選擇，下列哪一個說法最正確？<\/div><button class=\"opt cpo\" data-k=\"0\">A. CSV 只能表示平面表格，最不適合表達這種巢狀與陣列結構<\/button><button class=\"opt cpo\" data-k=\"1\">B. CSV 檔案最小，所以最適合任何結構<\/button><button class=\"opt cpo\" data-k=\"2\">C. JSON 不支援陣列，因此不能用<\/button><button class=\"opt cpo\" data-k=\"3\">D. XML 不能表示巢狀結構<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div><span class=\"gl\" data-g=\"253\" tabindex=\"0\" role=\"button\">CSV<\/span> 只有平面表格，沒有巢狀結構；<span class=\"gl\" data-g=\"251\" tabindex=\"0\" role=\"button\">JSON<\/span> 原生支援物件與陣列，是 <span class=\"gl\" data-g=\"186\" tabindex=\"0\" role=\"button\">REST API<\/span> 與 <span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span> 酬載的常見選擇；<span class=\"gl\" data-g=\"213\" tabindex=\"0\" role=\"button\">XML<\/span> 也能以<span class=\"gl\" data-g=\"382\" tabindex=\"0\" role=\"button\">樹狀<\/span>表示巢狀，只是較冗長。<\/div><\/div><\/div>\n<h2>3. API 與 Topic 設計 <span class=\"ref\">考科二 2-2<\/span><span class=\"supp\">補充（能力指標 1）<\/span><\/h2>\n<p><strong><span class=\"gl\" data-g=\"186\" tabindex=\"0\" role=\"button\">REST API<\/span> 的 <span class=\"gl\" data-g=\"106\" tabindex=\"0\" role=\"button\">HTTP<\/span> 方法<\/strong>（對資源做 <span class=\"gl\" data-g=\"189\" tabindex=\"0\" role=\"button\">CRUD<\/span>）：<\/p>\n<table>\n<thead>\n<tr>\n<th>方法<\/th>\n<th>動作<\/th>\n<th>例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>GET<\/td>\n<td>讀取（Read）<\/td>\n<td><code>GET /devices/TH-001/readings<\/code><\/td>\n<\/tr>\n<tr>\n<td>POST<\/td>\n<td>新增（Create）<\/td>\n<td><code>POST /devices/TH-001/readings<\/code><\/td>\n<\/tr>\n<tr>\n<td>PUT／PATCH<\/td>\n<td>整筆更新／部分更新（Update）<\/td>\n<td><code>PATCH /devices/TH-001<\/code><\/td>\n<\/tr>\n<tr>\n<td>DELETE<\/td>\n<td>刪除（Delete）<\/td>\n<td><code>DELETE /devices/TH-001<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong><span class=\"gl\" data-g=\"190\" tabindex=\"0\" role=\"button\">狀態碼<\/span><\/strong>：2xx 成功（200 OK、201 Created）；4xx 用戶端錯誤（400 格式錯誤、401 未認證、403 無權限、404 找不到）；5xx 伺服器錯誤（500、503）。<\/p>\n<p><strong><span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span> <span class=\"gl\" data-g=\"177\" tabindex=\"0\" role=\"button\">Topic<\/span> 設計<\/strong>：用 <code>/<\/code> 分層，從大到小，例如 <code>factoryA/line1/machine05/temp<\/code>；<code>+<\/code> 匹配單一層、<code>#<\/code> 匹配其下所有層（只能放最後）；Topic <strong>區分大小寫<\/strong>、不要以 <code>/<\/code> 開頭或含空白；<strong>命令與資料分開<\/strong>（如 <code>.../cmd<\/code> 與 <code>.../data<\/code>）。<\/p>\n<div class=\"cp\" id=\"cp_d10c2\" data-ans=\"0\"><div class=\"cph\">🧩 隨堂小測 2<span class=\"ref\">考科二 2-2<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">某團隊把「雲端下發的控制命令」與「裝置上傳的感測資料」都發布到同一個 Topic <code>site1/dev01<\/code>，結果裝置常把自己上傳的資料誤當成命令。依講義的 Topic 設計原則，最好的改善是？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 命令與資料分開，例如 <code>site1/dev01/cmd<\/code> 與 <code>site1/dev01/data<\/code><\/button><button class=\"opt cpo\" data-k=\"1\">B. Topic 改成以 <code>/<\/code> 開頭<\/button><button class=\"opt cpo\" data-k=\"2\">C. Topic 中加入空白字元以便閱讀<\/button><button class=\"opt cpo\" data-k=\"3\">D. 全部改用 <code>#<\/code> 發布訊息<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div>講義的 <span class=\"gl\" data-g=\"177\" tabindex=\"0\" role=\"button\">Topic<\/span> 設計原則：用 / 由大到小分層、區分大小寫、不要以 / 開頭或含空白，而且「命令與資料分開」。# 是訂閱用的萬用字元，不是拿來發布的主題。<\/div><\/div><\/div>\n<h2>4. 關聯式資料庫設計 <span class=\"ref\">考科二 2-2<\/span><span class=\"supp\">補充（能力指標 1：資料庫設計基礎）<\/span><\/h2>\n<ul>\n<li>**資料表（Table）**由欄位（Column）與資料列（Row／Record）組成。<\/li>\n<li><strong><span class=\"gl\" data-g=\"242\" tabindex=\"0\" role=\"button\">主鍵<\/span>（Primary Key, PK）<\/strong>：唯一識別每一列、不可重複、不可為空值。<\/li>\n<li><strong><span class=\"gl\" data-g=\"243\" tabindex=\"0\" role=\"button\">外鍵<\/span>（Foreign Key, FK）<\/strong>：參照另一張表的主鍵，建立關聯並維持<strong>參照<span class=\"gl\" data-g=\"267\" tabindex=\"0\" role=\"button\">完整性<\/span><\/strong>。<\/li>\n<li><strong>關聯類型<\/strong>：一對一、一對多（一台裝置有多筆讀值）、多對多（需中介表）。<\/li>\n<li><strong><span class=\"gl\" data-g=\"245\" tabindex=\"0\" role=\"button\">索引<\/span>（Index）<\/strong>：加快查詢，但會增加寫入成本與空間。<\/li>\n<\/ul>\n<p><strong><span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">IoT<\/span> 範例設計<\/strong>：<\/p>\n<table>\n<thead>\n<tr>\n<th>devices<\/th>\n<th>readings<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>device_id (PK)<\/strong>、name、location、model<\/td>\n<td><strong>reading_id (PK)<\/strong>、device_id (<strong>FK<\/strong>)、ts、temp、humidity<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong><span class=\"gl\" data-g=\"32\" tabindex=\"0\" role=\"button\">正規化<\/span>（Normalization）<\/strong>：減少重複資料與更新異常。<\/p>\n<table>\n<thead>\n<tr>\n<th>正規化<\/th>\n<th>要求<\/th>\n<th>反例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"244\" tabindex=\"0\" role=\"button\">1NF<\/span><\/strong><\/td>\n<td>每個欄位都是<strong>不可再分的單一值<\/strong>（無重複群組）<\/td>\n<td>一個欄位存 \"26.5,27.0,26.8\"<\/td>\n<\/tr>\n<tr>\n<td><strong>2NF<\/strong><\/td>\n<td>符合 1NF，且非鍵欄位<strong>完全依賴整個主鍵<\/strong>（消除部分相依）<\/td>\n<td>主鍵為（訂單號＋產品號），卻存「客戶名稱」只依賴訂單號<\/td>\n<\/tr>\n<tr>\n<td><strong>3NF<\/strong><\/td>\n<td>符合 2NF，且<strong>消除遞移相依<\/strong>（非鍵欄位不依賴其他非鍵欄位）<\/td>\n<td>readings 表裡存 device 的「安裝地點」<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>基本 <span class=\"gl\" data-g=\"240\" tabindex=\"0\" role=\"button\">SQL<\/span><\/strong>：<\/p>\n<pre><code class=\"language-sql\">SELECT device_id, AVG(temp) FROM readings\nWHERE ts &gt;= '2026-10-27' GROUP BY device_id;\nINSERT INTO readings (device_id, ts, temp) VALUES ('TH-001', '2026-10-27 08:30', 26.5);\nUPDATE devices SET location = 'B棟' WHERE device_id = 'TH-001';\nDELETE FROM readings WHERE ts &lt; '2025-01-01';\n<\/code><\/pre>\n<ul>\n<li>SQL <span class=\"gl\" data-g=\"10\" tabindex=\"0\" role=\"button\">分類<\/span>：<strong><span class=\"gl\" data-g=\"241\" tabindex=\"0\" role=\"button\">DDL<\/span><\/strong> 定義結構（CREATE、ALTER、DROP）；<strong>DML<\/strong> 操作資料（SELECT、INSERT、UPDATE、DELETE）；<strong>DCL<\/strong> 權限（GRANT、REVOKE）。<\/li>\n<li><strong>交易的 <span class=\"gl\" data-g=\"237\" tabindex=\"0\" role=\"button\">ACID<\/span><\/strong>：原子性（全做或全不做）、一致性、隔離性、持久性。<\/li>\n<\/ul>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：<code>UPDATE<\/code>／<code>DELETE<\/code> 忘記加 <code>WHERE<\/code> 會影響整張表。<code>DROP TABLE<\/code> 是刪掉整張表（結構＋資料），<code>DELETE<\/code> 只刪資料列。<\/p>\n<\/blockquote>\n<div class=\"cp\" id=\"cp_d10c3\" data-ans=\"0\"><div class=\"cph\">🧩 隨堂小測 3<span class=\"ref\">考科二 2-2<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">DBA 在 readings 表的 <code>ts<\/code>（時間戳）欄位建立索引後，「查詢某段時間的讀值」明顯變快。關於索引，下列敘述何者正確？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 索引能加快查詢，但會增加寫入成本與儲存空間<\/button><button class=\"opt cpo\" data-k=\"1\">B. 索引能同時讓查詢與寫入都變快，沒有任何代價<\/button><button class=\"opt cpo\" data-k=\"2\">C. 索引就是主鍵，一張表只能有一個<\/button><button class=\"opt cpo\" data-k=\"3\">D. 建索引會刪除重複資料，等同正規化<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div>講義：<span class=\"gl\" data-g=\"245\" tabindex=\"0\" role=\"button\">索引<\/span>（Index）加快查詢，但會增加寫入成本與空間。索引不等於<span class=\"gl\" data-g=\"242\" tabindex=\"0\" role=\"button\">主鍵<\/span>；也不是<span class=\"gl\" data-g=\"32\" tabindex=\"0\" role=\"button\">正規化<\/span>。<span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">IoT<\/span> 寫入量大的表，要衡量索引數量。<\/div><\/div><\/div>\n<h2>5. NoSQL 與時序資料庫 <span class=\"ref\">考科二 2-2<\/span><span class=\"supp\">補充（能力指標 1：資料庫設計基礎）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>類型<\/th>\n<th>特性<\/th>\n<th>例子<\/th>\n<th><span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">IoT<\/span> 用途<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>關聯式 <span class=\"gl\" data-g=\"235\" tabindex=\"0\" role=\"button\">RDBMS<\/span><\/td>\n<td>固定<span class=\"gl\" data-g=\"246\" tabindex=\"0\" role=\"button\">綱要<\/span>（Schema）、<span class=\"gl\" data-g=\"240\" tabindex=\"0\" role=\"button\">SQL<\/span>、<span class=\"gl\" data-g=\"237\" tabindex=\"0\" role=\"button\">ACID<\/span>、JOIN<\/td>\n<td>MySQL、PostgreSQL、SQL Server<\/td>\n<td>裝置清單、使用者、工單等結構化主資料<\/td>\n<\/tr>\n<tr>\n<td>文件型 Document<\/td>\n<td>存 <span class=\"gl\" data-g=\"251\" tabindex=\"0\" role=\"button\">JSON<\/span> 類文件、綱要彈性<\/td>\n<td>MongoDB<\/td>\n<td>不同型號裝置欄位不一的資料<\/td>\n<\/tr>\n<tr>\n<td>鍵值型 Key-Value<\/td>\n<td>以鍵快速存取<\/td>\n<td><span class=\"gl\" data-g=\"239\" tabindex=\"0\" role=\"button\">Redis<\/span><\/td>\n<td>裝置最新狀態、快取、Session<\/td>\n<\/tr>\n<tr>\n<td>寬欄型 Wide-Column<\/td>\n<td>大量寫入、水平擴充<\/td>\n<td>Cassandra、HBase<\/td>\n<td>海量感測資料<\/td>\n<\/tr>\n<tr>\n<td>圖形 Graph<\/td>\n<td>節點與關係<\/td>\n<td>Neo4j<\/td>\n<td>設備<span class=\"gl\" data-g=\"382\" tabindex=\"0\" role=\"button\">拓樸<\/span>、關聯分析<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"247\" tabindex=\"0\" role=\"button\">時序資料庫<\/span> TSDB<\/strong><\/td>\n<td>以<strong><span class=\"gl\" data-g=\"266\" tabindex=\"0\" role=\"button\">時間戳<\/span><\/strong>為主軸、高速寫入、時間區間查詢、<strong><span class=\"gl\" data-g=\"248\" tabindex=\"0\" role=\"button\">降採樣<\/span><\/strong>與<strong>保存政策<\/strong>、壓縮<\/td>\n<td>InfluxDB、TimescaleDB<\/td>\n<td><strong>感測讀值、設備監控<\/strong>（最典型）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><span class=\"gl\" data-g=\"236\" tabindex=\"0\" role=\"button\">NoSQL<\/span> 多數以<strong>水平擴充<\/strong>與高可用為優先，常採<strong><span class=\"gl\" data-g=\"238\" tabindex=\"0\" role=\"button\">最終一致性<\/span>（BASE）<\/strong>；關聯式重視強一致與 ACID。<\/li>\n<li>常見混合設計：<strong>主資料放關聯式、感測讀值放時序資料庫、最新狀態放快取、原始檔案（影像）放<span class=\"gl\" data-g=\"249\" tabindex=\"0\" role=\"button\">物件儲存<\/span><\/strong>。<\/li>\n<\/ul>\n<div class=\"cp\" id=\"cp_d10c4\" data-ans=\"0\"><div class=\"cph\">🧩 隨堂小測 4<span class=\"ref\">考科二 2-2<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">某平台接入數十種型號的裝置，每種型號上傳的欄位差異很大，而且常常新增欄位。若希望不必每次都修改資料表綱要（Schema），依講義最適合的資料庫類型是？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 文件型 NoSQL（如 MongoDB）<\/button><button class=\"opt cpo\" data-k=\"1\">B. 固定綱要的關聯式資料庫<\/button><button class=\"opt cpo\" data-k=\"2\">C. 圖形資料庫（如 Neo4j）<\/button><button class=\"opt cpo\" data-k=\"3\">D. 只用 Excel 試算表<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div>文件型資料庫存 <span class=\"gl\" data-g=\"251\" tabindex=\"0\" role=\"button\">JSON<\/span> 類文件、<span class=\"gl\" data-g=\"246\" tabindex=\"0\" role=\"button\">綱要<\/span>彈性，講義的 <span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">IoT<\/span> 用途正是「不同型號裝置欄位不一的資料」。<span class=\"gl\" data-g=\"235\" tabindex=\"0\" role=\"button\">關聯式資料庫<\/span>是固定綱要；圖形資料庫用於設備<span class=\"gl\" data-g=\"382\" tabindex=\"0\" role=\"button\">拓樸<\/span>與關聯分析。<\/div><\/div><\/div>\n<h3>今日 30 秒回顧<\/h3>\n<p>擷取→傳輸→接收→處理→儲存→應用｜JSON：鍵用雙引號、無註解、無尾逗號、true/null 不加引號｜<span class=\"gl\" data-g=\"213\" tabindex=\"0\" role=\"button\">XML<\/span>：成對、大小寫、單一根＝well-formed｜<span class=\"gl\" data-g=\"253\" tabindex=\"0\" role=\"button\">CSV<\/span> 只能平面｜GET 讀、POST 新增、PUT/PATCH 改、DELETE 刪；201 Created、401 未認證、403 無權限、404 找不到｜<span class=\"gl\" data-g=\"177\" tabindex=\"0\" role=\"button\">Topic<\/span> 由大到小、+ 單層、# 多層｜<span class=\"gl\" data-g=\"242\" tabindex=\"0\" role=\"button\">PK<\/span> 唯一非空、<span class=\"gl\" data-g=\"243\" tabindex=\"0\" role=\"button\">FK<\/span> 參照｜<span class=\"gl\" data-g=\"244\" tabindex=\"0\" role=\"button\">1NF<\/span> 單一值、2NF 去部分相依、3NF 去遞移相依｜<span class=\"gl\" data-g=\"241\" tabindex=\"0\" role=\"button\">DDL<\/span>／DML／DCL｜ACID｜感測讀值→時序資料庫。<\/p>", "audio": {"src": "audio/d10.mp3?v=2", "dur": 577}, "questions": [{"id": "d10q1", "n": 1, "opts": ["{'deviceId': 'TH-001', 'temp': 26.5}", "{\"deviceId\": \"TH-001\", \"temp\": 26.5,}", "{deviceId: \"TH-001\", temp: 26.5}", "{\"deviceId\": \"TH-001\", \"temp\": 26.5, \"online\": true}"], "exp": "JSON 的鍵與字串都必須用雙引號，A 用單引號、C 鍵沒加引號都不合法；B 最後多了一個逗號（尾逗號）也不合法。D 的 true 是布林值，不加引號是正確的。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "下列哪一段是「合法」的 JSON 資料？", "ref": "考科二 2-2", "src": "能力指標 1（雲端資料交換格式）", "ans": 3, "stemH": "下列哪一段是「合法」的 JSON 資料？", "optsH": ["{&#x27;deviceId&#x27;: &#x27;TH-001&#x27;, &#x27;temp&#x27;: 26.5}", "{&quot;deviceId&quot;: &quot;TH-001&quot;, &quot;temp&quot;: 26.5,}", "{deviceId: &quot;TH-001&quot;, temp: 26.5}", "{&quot;deviceId&quot;: &quot;TH-001&quot;, &quot;temp&quot;: 26.5, &quot;online&quot;: true}"], "expH": "<span class=\"gl\" data-g=\"251\" tabindex=\"0\" role=\"button\">JSON<\/span> 的鍵與字串都必須用雙引號，A 用單引號、C 鍵沒加引號都不合法；B 最後多了一個逗號（尾逗號）也不合法。D 的 true 是布林值，不加引號是正確的。"}, {"id": "d10q2", "n": 2, "opts": ["標籤名稱區分大小寫，`<Temp>` 與 `<temp>` 不同", "一份格式良好（well-formed）的 XML 文件可以有多個根元素", "可用 XSD 或 DTD 驗證文件結構", "相同資料以 XML 表示通常比 JSON 冗長"], "exp": "格式良好的 XML 必須只有一個根元素，且標籤成對、正確巢狀、屬性值加引號。A、C、D 皆正確。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "關於 XML 的敘述，下列何者「不」正確？", "ref": "考科二 2-2", "src": "能力指標 1（雲端資料交換格式）", "ans": 1, "stemH": "關於 XML 的敘述，下列何者「不」正確？", "optsH": ["標籤名稱區分大小寫，<code>&lt;Temp&gt;<\/code> 與 <code>&lt;temp&gt;<\/code> 不同", "一份格式良好（well-formed）的 XML 文件可以有多個根元素", "可用 XSD 或 DTD 驗證文件結構", "相同資料以 XML 表示通常比 JSON 冗長"], "expH": "格式良好的 <span class=\"gl\" data-g=\"213\" tabindex=\"0\" role=\"button\">XML<\/span> 必須只有一個根元素，且標籤成對、正確巢狀、屬性值加引號。A、C、D 皆正確。"}, {"id": "d10q3", "n": 3, "opts": ["帶有完整命名空間的 XML", "以 Base64 編碼的點陣圖片", "CBOR 或 Protocol Buffers 等二進位序列化格式", "加上大量縮排與註解的文字設定檔"], "exp": "CBOR（常與 CoAP 搭配）與 Protocol Buffers 是二進位格式，比 JSON、XML 更精簡，適合低頻寬、低功耗裝置。XML 冗長；圖片與帶註解的文字檔都不符需求。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某資源受限的電池型感測器要經低頻寬網路傳送資料，希望酬載愈小愈好，同時仍保有結構化的鍵值資料。下列哪一種格式最適合？", "ref": "考科二 2-2", "src": "能力指標 1（雲端資料交換格式）", "ans": 2, "stemH": "某資源受限的電池型感測器要經低頻寬網路傳送資料，希望酬載愈小愈好，同時仍保有結構化的鍵值資料。下列哪一種格式最適合？", "optsH": ["帶有完整命名空間的 XML", "以 Base64 編碼的點陣圖片", "CBOR 或 Protocol Buffers 等二進位序列化格式", "加上大量縮排與註解的文字設定檔"], "expH": "<span class=\"gl\" data-g=\"254\" tabindex=\"0\" role=\"button\">CBOR<\/span>（常與 <span class=\"gl\" data-g=\"173\" tabindex=\"0\" role=\"button\">CoAP<\/span> 搭配）與 Protocol Buffers 是二進位格式，比 <span class=\"gl\" data-g=\"251\" tabindex=\"0\" role=\"button\">JSON<\/span>、<span class=\"gl\" data-g=\"213\" tabindex=\"0\" role=\"button\">XML<\/span> 更精簡，適合低<span class=\"gl\" data-g=\"48\" tabindex=\"0\" role=\"button\">頻寬<\/span>、低功耗裝置。XML 冗長；圖片與帶註解的文字檔都不符需求。"}, {"id": "d10q4", "n": 4, "opts": ["POST，201 Created", "GET，404 Not Found", "DELETE，200 OK", "PUT，500 Internal Server Erro ": "能力指標 1（資料庫設計基礎）", "ans": 0, "stemH": "資料表 <code>readings<\/code> 中除了 device_id 之外，每一筆讀值都重複存放該裝置的「安裝地點」與「型號」。當裝置搬遷時，需更新成千上萬筆資料。這違反了哪一個正規化原則？應如何改善？", "optsH": ["第三正規化（存在遞移相依）；把裝置資訊移到 devices 表，readings 只保留 device_id 外鍵", "第一正規化；把地點拆成多個欄位", "第二正規化；刪除主鍵", "不違反任何原則；這是最佳設計"], "expH": "地點與型號依賴的是 device_id（非鍵欄位），而不是 reading_id，形成「reading_id → device_id → 地點」的遞移相依，違反 <span class=\"gl\" data-g=\"244\" tabindex=\"0\" role=\"button\">3NF<\/span>，會造成更新異常。拆到 devices 表即可。"}, {"id": "d10q10", "n": 10, "opts": ["SELECT", "INSERT", "CREATE TABLE", "GRANT"], "exp": "DDL 定義資料結構：CREATE、ALTER、DROP。SELECT、INSERT、UPDATE、DELETE 屬 DML（資料操作）；GRANT、REVOKE 屬 DCL（權限控制）。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "下列哪一個 SQL 指令屬於資料定義語言（DDL）？", "ref": "考科二 2-2", "src": "能力指標 1（資料庫設計基礎）", "ans": 2, "stemH": "下列哪一個 SQL 指令屬於資料定義語言（DDL）？", "optsH": ["SELECT", "INSERT", "CREATE TABLE", "GRANT"], "expH": "<span class=\"gl\" data-g=\"241\" tabindex=\"0\" role=\"button\">DDL<\/span> 定義資料結構：CREATE、ALTER、DROP。SELECT、INSERT、UPDATE、DELETE 屬 DML（資料操作）；GRANT、REVOKE 屬 DCL（權限控制）。"}, {"id": "d10q11", "n": 11, "opts": ["圖形資料庫", "時序資料庫（如 InfluxDB、TimescaleDB）", "只用試算表檔案存放", "純鍵值快取，不做持久化"], "exp": "時序資料庫以時間戳為主軸，支援高速寫入、時間區間聚合查詢、降採樣與保存政策，是感測資料的典型選擇。圖形資料庫適合關係分析；試算表無法承受大量寫入；快取不適合長期保存。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某平台要儲存數萬支感測器每秒產生的讀值，查詢多為「某裝置過去 24 小時的平均值」，且舊資料需自動降採樣與到期刪除。最適合的資料庫類型是？", "ref": "考科二 2-2", "src": "能力指標 1（資料庫設計基礎）", "ans": 1, "stemH": "某平台要儲存數萬支感測器每秒產生的讀值，查詢多為「某裝置過去 24 小時的平均值」，且舊資料需自動降採樣與到期刪除。最適合的資料庫類型是？", "optsH": ["圖形資料庫", "時序資料庫（如 InfluxDB、TimescaleDB）", "只用試算表檔案存放", "純鍵值快取，不做持久化"], "expH": "<span class=\"gl\" data-g=\"247\" tabindex=\"0\" role=\"button\">時序資料庫<\/span>以<span class=\"gl\" data-g=\"266\" tabindex=\"0\" role=\"button\">時間戳<\/span>為主軸，支援高速寫入、時間區間聚合查詢、<span class=\"gl\" data-g=\"248\" tabindex=\"0\" role=\"button\">降採樣<\/span>與保存政策，是感測資料的典型選擇。圖形資料庫適合關係分析；試算表無法承受大量寫入；<span class=\"gl\" data-g=\"239\" tabindex=\"0\" role=\"button\">快取<\/span>不適合長期保存。"}, {"id": "d10q12", "n": 12, "opts" "d11c2", "n": 2, "stemH": "現場觀察發現，作業員每次換刀都要走到 20 公尺外的工具櫃找扳手，還常要彎腰翻找。依精實生產的七大浪費，這主要屬於哪一種？", "optsH": ["過量生產", "動作", "庫存", "過度加工"], "expH": "作業員多餘的走動、彎腰、找工具＝動作浪費（可用 <span class=\"gl\" data-g=\"461\" tabindex=\"0\" role=\"button\">5S<\/span> 的整頓改善）。過量生產是做太多太早；庫存是物料堆積；過度加工是超出客戶需求的加工或檢驗。"}, {"ref": "考科二 2-3", "opts": ["防呆（Poka-yoke）", "JIT 及時生產", "價值流圖（VSM）", "TPM 全員生產保養"], "exp": "防呆是「從設計上讓錯誤不可能發生或立即被發現」。JIT 是在需要時生產需要的量；VSM 是畫出物流與資訊流找浪費；TPM 是全員參與的設備保養。", "stem": "組裝站常有作業員把零件方向裝反。工程師把治具改成「零件方向放反就根本放不進去」，從此不再發生。這是哪一種精實手法？", "ans": 0, "id": "d11c3", "n": 3, "stemH": "組裝站常有作業員把零件方向裝反。工程師把治具改成「零件方向放反就根本放不進去」，從此不再發生。這是哪一種精實手法？", "optsH": ["防呆（Poka-yoke）", "JIT 及時生產", "價值流圖（VSM）", "TPM 全員生產保養"], "expH": "<span class=\"gl\" data-g=\"460\" tabindex=\"0\" role=\"button\">防呆<\/span>是「從設計上讓錯誤不可能發生或立即被發現」。<span class=\"gl\" data-g=\"457\" tabindex=\"0\" role=\"button\">JIT<\/span> 是在需要時生產需要的量；<span class=\"gl\" data-g=\"464\" tabindex=\"0\" role=\"button\">VSM<\/span> 是畫出物流與資訊流找浪費；<span class=\"gl\" data-g=\"463\" tabindex=\"0\" role=\"button\">TPM<\/span> 是全員參與的設備保養。"}], "lecture": "<blockquote>\n<p><strong>📌 考科二說明<\/strong>：本日內容依簡章評鑑內容 2-3「智慧製造流程優化與成本控制」撰寫。簡章 3 項能力指標未逐字列出此主題，因此以評鑑內容標題為範圍，聚焦「用 <span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">IoT<\/span> 資料改善製程與控制成本」所需的通用管理與工程知識；考科二無官方學習指引，內容皆標「補充」。<\/p>\n<\/blockquote>\n<h3>今天要搞懂的 5 件事<\/h3>\n<ol>\n<li><span class=\"gl\" data-g=\"451\" tabindex=\"0\" role=\"button\">OEE<\/span>＝<span class=\"gl\" data-g=\"452\" tabindex=\"0\" role=\"button\">可用率<\/span> × 效能 × 品質，會算、會判斷哪一種損失屬於哪一項。<\/li>\n<li><span class=\"gl\" data-g=\"454\" tabindex=\"0\" role=\"button\">精實生產<\/span>：<span class=\"gl\" data-g=\"455\" tabindex=\"0\" role=\"button\">七大浪費<\/span>、<span class=\"gl\" data-g=\"457\" tabindex=\"0\" role=\"button\">JIT<\/span>、<span class=\"gl\" data-g=\"458\" tabindex=\"0\" role=\"button\">看板<\/span>、<span class=\"gl\" data-g=\"461\" tabindex=\"0\" role=\"button\">5S<\/span>、<span class=\"gl\" data-g=\"460\" tabindex=\"0\" role=\"button\">防呆<\/span>、<span class=\"gl\" data-g=\"462\" tabindex=\"0\" role=\"button\">SMED<\/span>、<span class=\"gl\" data-g=\"281\" tabindex=\"0\" role=\"button\">TPM<\/span>。<\/li>\n<li>製造資訊系統分層（<span class=\"gl\" data-g=\"466\" tabindex=\"0\" role=\"button\">ISA-95<\/span>）：<span class=\"gl\" data-g=\"67\" tabindex=\"0\" role=\"button\">ERP<\/span>、<span class=\"gl\" data-g=\"66\" tabindex=\"0\" role=\"button\">MES<\/span>、<span class=\"gl\" data-g=\"65\" tabindex=\"0\" role=\"button\">SCADA<\/span>／<span class=\"gl\" data-g=\"64\" tabindex=\"0\" role=\"button\">HMI<\/span>、<span class=\"gl\" data-g=\"68\" tabindex=\"0\" role=\"button\">PLC<\/span> 各管什麼。<\/li>\n<li>流程改善工具：<span class=\"gl\" data-g=\"467\" tabindex=\"0\" role=\"button\">PDCA<\/span>、<span class=\"gl\" data-g=\"468\" tabindex=\"0\" role=\"button\">DMAIC<\/span>、<span class=\"gl\" data-g=\"469\" tabindex=\"0\" role=\"button\">SPC<\/span> <span class=\"gl\" data-g=\"470\" tabindex=\"0\" role=\"button\">管制圖<\/span>、<span class=\"gl\" data-g=\"471\" tabindex=\"0\" role=\"button\">魚骨圖<\/span>、<span class=\"gl\" data-g=\"472\" tabindex=\"0\" role=\"button\">柏拉圖<\/span>、<span class=\"gl\" data-g=\"473\" tabindex=\"0\" role=\"button\">瓶頸<\/span>與<span class=\"gl\" data-g=\"474\" tabindex=\"0\" role=\"button\">節拍時間<\/span>。<\/li>\n<li>成本控制：固定／<span class=\"gl\" data-g=\"476\" tabindex=\"0\" role=\"button\">變動成本<\/span>、<span class=\"gl\" data-g=\"478\" tabindex=\"0\" role=\"button\">CAPEX<\/span>／<span class=\"gl\" data-g=\"479\" tabindex=\"0\" role=\"button\">OPEX<\/span>、<span class=\"gl\" data-g=\"480\" tabindex=\"0\" role=\"button\">TCO<\/span>、<span class=\"gl\" data-g=\"481\" tabindex=\"0\" role=\"button\">ROI<\/span> 與<span class=\"gl\" data-g=\"482\" tabindex=\"0\" role=\"button\">回收期<\/span>，以及 <span class=\"gl\" data-g=\"1\" tabindex=\"0\" role=\"button\">AIoT<\/span> 如何降成本。<\/li>\n<\/ol>\n<h2>1. 智慧製造與 AIoT 的角色 <span class=\"ref\">考科二 2-3<\/span><span class=\"supp\">補充（依簡章評鑑內容 2-3）<\/span><\/h2>\n<ul>\n<li><strong>智慧製造<\/strong>：以設備聯網、資料分析與自動化，讓工廠從「事後處理」走向「即時可視、可預測、可自主調整」。常見概念：<span class=\"gl\" data-g=\"88\" tabindex=\"0\" role=\"button\">工業 4.0<\/span>、<strong><span class=\"gl\" data-g=\"87\" tabindex=\"0\" role=\"button\">虛實整合系統<\/span>（CPS）<\/strong>、<strong><span class=\"gl\" data-g=\"86\" tabindex=\"0\" role=\"button\">數位雙生<\/span>（Digital Twin，實體設備在虛擬世界的即時對應模型，可模擬與預測）<\/strong>。<\/li>\n<li><strong>演進階段（記法）<\/strong>：<strong>看得見<\/strong>（設備聯網、即時<span class=\"gl\" data-g=\"458\" tabindex=\"0\" role=\"button\">看板<\/span>）→ <strong>看得懂<\/strong>（分析原因）→ <strong>預測得到<\/strong>（<span class=\"gl\" data-g=\"74\" tabindex=\"0\" role=\"button\">預測性維護<\/span>、品質預測）→ <strong>自主調整<\/strong>（自動調參、最佳化排程）。<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th><span class=\"gl\" data-g=\"1\" tabindex=\"0\" role=\"button\">AIoT<\/span> 應用<\/th>\n<th>改善的對象<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>設備聯網＋即時 <span class=\"gl\" data-g=\"451\" tabindex=\"0\" role=\"button\">OEE<\/span> 看板<\/td>\n<td>停機、小停機看得見，縮短反應時間<\/td>\n<\/tr>\n<tr>\n<td>預測性維護（震動、電流、溫度）<\/td>\n<td>減少非計畫停機（<span class=\"gl\" data-g=\"452\" tabindex=\"0\" role=\"button\">可用率<\/span>）與維修成本<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span> 視覺檢測（<span class=\"gl\" data-g=\"71\" tabindex=\"0\" role=\"button\">AOI<\/span>）<\/td>\n<td>降低不良與漏檢（品質）、減少人工檢驗成本<\/td>\n<\/tr>\n<tr>\n<td>能耗監控與需量管理<\/td>\n<td>降低電費、碳排<\/td>\n<\/tr>\n<tr>\n<td>製程參數監控與 <span class=\"gl\" data-g=\"469\" tabindex=\"0\" role=\"button\">SPC<\/span><\/td>\n<td>及早發現製程偏移，減少報廢<\/td>\n<\/tr>\n<tr>\n<td>排程最佳化、數位雙生模擬<\/td>\n<td>縮短換線與等待，提高產能<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. OEE 設備綜合效率 <span class=\"ref\">考科二 2-3<\/span><span class=\"supp\">補充（依簡章評鑑內容 2-3）<\/span><\/h2>\n<p><strong><span class=\"gl\" data-g=\"451\" tabindex=\"0\" role=\"button\">OEE<\/span>＝<span class=\"gl\" data-g=\"452\" tabindex=\"0\" role=\"button\">可用率<\/span>（Availability）× 效能（Performance）× 品質（Quality，良率）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>指標<\/th>\n<th>公式<\/th>\n<th>對應的「<span class=\"gl\" data-g=\"453\" tabindex=\"0\" role=\"button\">六大損失<\/span>」<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>可用率<\/td>\n<td>實際運轉時間 ÷ 計畫生產時間<\/td>\n<td>① 故障停機 ② 換線、調整（換模）<\/td>\n<\/tr>\n<tr>\n<td>效能<\/td>\n<td>（理想<span class=\"gl\" data-g=\"475\" tabindex=\"0\" role=\"button\">週期時間<\/span> × 總產出數）÷ 實際運轉時間<\/td>\n<td>③ 小停機、空轉 ④ 速度降低<\/td>\n<\/tr>\n<tr>\n<td>品質<\/td>\n<td>良品數 ÷ 總產出數<\/td>\n<td>⑤ 製程不良與重工 ⑥ 開機（啟動）損失<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 計算例<\/strong>：計畫生產 600 分鐘，停機 60 分鐘 → 運轉 540 分鐘，<strong>可用率＝540÷600＝90 %<\/strong>。理想週期時間 0.6 分鐘／件，實際產出 720 件 → 理想需要 432 分鐘，<strong>效能＝432÷540＝80 %<\/strong>。良品 684 件 → <strong>品質＝684÷720＝95 %<\/strong>。<strong>OEE＝0.9×0.8×0.95＝68.4 %<\/strong>。驗算：良品數 × 理想週期時間 ÷ 計畫時間＝684×0.6÷600＝68.4 % ✔。<\/p>\n<p><strong>⚠️ 易混淆<\/strong>：「機台在跑但跑得比標準慢」是<strong>效能<\/strong>損失，不是可用率；「停下來換模」是<strong>可用率<\/strong>損失；「做出不良品」是<strong>品質<\/strong>損失。業界常引用「世界級 OEE 約 85 %」作為參考目標（經驗值，非標準規定）。<\/p>\n<\/blockquote>\n<div class=\"cp\" id=\"cp_d11c1\" data-ans=\"2\"><div class=\"cph\">🧩 隨堂小測 1<span class=\"ref\">考科二 2-3<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">射出成型機每天早上開機後，前 30 模因溫度尚未穩定而做出不良品，必須報廢。依講義的 OEE「六大損失」，這屬於哪一項？會直接降低 OEE 的哪一個因子？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 換線調整；可用率<\/button><button class=\"opt cpo\" data-k=\"1\">B. 速度降低；效能<\/button><button class=\"opt cpo\" data-k=\"2\">C. 開機（啟動）損失；品質<\/button><button class=\"opt cpo\" data-k=\"3\">D. 小停機；效能<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div><span class=\"gl\" data-g=\"453\" tabindex=\"0\" role=\"button\">六大損失<\/span>中，「製程不良與重工」與「開機（啟動）損失」都歸在品質因子。換線調整、故障停機扣<span class=\"gl\" data-g=\"452\" tabindex=\"0\" role=\"button\">可用率<\/span>；小停機、速度降低扣效能。<\/div><\/div><\/div>\n<h2>3. 精實生產（Lean）與現場改善 <span class=\"ref\">考科二 2-3<\/span><span class=\"supp\">補充（依簡章評鑑內容 2-3）<\/span><\/h2>\n<p><strong><span class=\"gl\" data-g=\"455\" tabindex=\"0\" role=\"button\">七大浪費<\/span><\/strong>（源自豐田生產方式）：<\/p>\n<table>\n<thead>\n<tr>\n<th>浪費<\/th>\n<th>例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>過量生產<\/td>\n<td>做得比需求多、比需求早（被視為最嚴重，會引發其他浪費）<\/td>\n<\/tr>\n<tr>\n<td>庫存<\/td>\n<td>原料、<span class=\"gl\" data-g=\"456\" tabindex=\"0\" role=\"button\">在製品<\/span>（WIP）、成品堆積，占空間與資金<\/td>\n<\/tr>\n<tr>\n<td>搬運<\/td>\n<td>不必要的物料移動<\/td>\n<\/tr>\n<tr>\n<td>等待<\/td>\n<td>人或機器等料、等指令、等維修<\/td>\n<\/tr>\n<tr>\n<td>動作<\/td>\n<td>作業員多餘的走動、彎腰、找工具<\/td>\n<\/tr>\n<tr>\n<td>過度加工<\/td>\n<td>超出客戶需求的加工或檢驗<\/td>\n<\/tr>\n<tr>\n<td>不良（瑕疵）<\/td>\n<td>報廢、重工、客訴<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>（有些教材另加第八種「未善用員工的才能」。）<\/p>\n<table>\n<thead>\n<tr>\n<th><span class=\"gl\" data-g=\"454\" tabindex=\"0\" role=\"button\">精實<\/span>工具<\/th>\n<th>意義<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"457\" tabindex=\"0\" role=\"button\">JIT<\/span> 及時生產<\/strong><\/td>\n<td>在需要的時候、生產需要的數量<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"458\" tabindex=\"0\" role=\"button\">看板<\/span>（Kanban）<\/strong><\/td>\n<td>以卡片或訊號實現<strong>拉式（Pull）生產<\/strong>，由後工序向前工序領料<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"459\" tabindex=\"0\" role=\"button\">自働化<\/span>（Jidoka）／安燈（Andon）<\/strong><\/td>\n<td>異常時自動停機並亮燈通知，不讓不良流到下一站<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"460\" tabindex=\"0\" role=\"button\">防呆<\/span>（Poka-yoke）<\/strong><\/td>\n<td>設計上讓錯誤不可能發生或立即被發現<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"461\" tabindex=\"0\" role=\"button\">5S<\/span><\/strong><\/td>\n<td>整理（區分要與不要）、整頓（定位）、清掃、清潔（維持制度化）、素養（養成習慣）<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"462\" tabindex=\"0\" role=\"button\">SMED<\/span> 快速換模<\/strong><\/td>\n<td>把換線工作盡量改為機台運轉中就能準備（外部作業），縮短換線時間<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"463\" tabindex=\"0\" role=\"button\">TPM<\/span> 全員生產保養<\/strong><\/td>\n<td>全員參與、作業員自主保養，目標零故障<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"464\" tabindex=\"0\" role=\"button\">價值流圖<\/span>（VSM）<\/strong><\/td>\n<td>畫出從原料到交貨的物流與資訊流，找出浪費<\/td>\n<\/tr>\n<tr>\n<td><strong>改善（<span class=\"gl\" data-g=\"465\" tabindex=\"0\" role=\"button\">Kaizen<\/span>）<\/strong><\/td>\n<td>持續的小幅改善<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"cp\" id=\"cp_d11c2\" data-ans=\"1\"><div class=\"cph\">🧩 隨堂小測 2<span class=\"ref\">考科二 2-3<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">現場觀察發現，作業員每次換刀都要走到 20 公尺外的工具櫃找扳手，還常要彎腰翻找。依精實生產的七大浪費，這主要屬於哪一種？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 過量生產<\/button><button class=\"opt cpo\" data-k=\"1\">B. 動作<\/button><button class=\"opt cpo\" data-k=\"2\">C. 庫存<\/button><button class=\"opt cpo\" data-k=\"3\">D. 過度加工<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div>作業員多餘的走動、彎腰、找工具＝動作浪費（可用 <span class=\"gl\" data-g=\"461\" tabindex=\"0\" role=\"button\">5S<\/span> 的整頓改善）。過量生產是做太多太早；庫存是物料堆積；過度加工是超出客戶需求的加工或檢驗。<\/div><\/div><\/div>\n<div class=\"cp\" id=\"cp_d11c3\" data-ans=\"0\"><div class=\"cph\">🧩 隨堂小測 3<span class=\"ref\">考科二 2-3<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">組裝站常有作業員把零件方向裝反。工程師把治具改成「零件方向放反就根本放不進去」，從此不再發生。這是哪一種精實手法？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 防呆（Poka-yoke）<\/button><button class=\"opt cpo\" data-k=\"1\">B. JIT 及時生產<\/button><button class=\"opt cpo\" data-k=\"2\">C. 價值流圖（VSM）<\/button><button class=\"opt cpo\" data-k=\"3\">D. TPM 全員生產保養<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div><span class=\"gl\" data-g=\"460\" tabindex=\"0\" role=\"button\">防呆<\/span>是「從設計上讓錯誤不可能發生或立即被發現」。<span class=\"gl\" data-g=\"457\" tabindex=\"0\" role=\"button\">JIT<\/span> 是在需要時生產需要的量；<span class=\"gl\" data-g=\"464\" tabindex=\"0\" role=\"button\">VSM<\/span> 是畫出物流與資訊流找浪費；<span class=\"gl\" data-g=\"463\" tabindex=\"0\" role=\"button\">TPM<\/span> 是全員參與的設備保養。<\/div><\/div><\/div>\n<h2>4. 製造資訊系統分層（ISA-95） <span class=\"ref\">考科二 2-3<\/span><span class=\"supp\">補充（依簡章評鑑內容 2-3）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th><span class=\"gl\" data-g=\"466\" tabindex=\"0\" role=\"button\">ISA-95<\/span> 層級<\/th>\n<th>系統<\/th>\n<th>時間尺度<\/th>\n<th>負責<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Level 4 企業<\/td>\n<td><strong><span class=\"gl\" data-g=\"67\" tabindex=\"0\" role=\"button\">ERP<\/span><\/strong><\/td>\n<td>月、週、日<\/td>\n<td>訂單、採購、庫存、財務、主生產計畫<\/td>\n<\/tr>\n<tr>\n<td>Level 3 製造營運<\/td>\n<td><strong><span class=\"gl\" data-g=\"66\" tabindex=\"0\" role=\"button\">MES<\/span><\/strong><\/td>\n<td>日、班、時<\/td>\n<td>派工、生產追蹤與履歷、品質、<span class=\"gl\" data-g=\"456\" tabindex=\"0\" role=\"button\">在製品<\/span>、績效（<span class=\"gl\" data-g=\"451\" tabindex=\"0\" role=\"button\">OEE<\/span>）<\/td>\n<\/tr>\n<tr>\n<td>Level 2 監控<\/td>\n<td><strong><span class=\"gl\" data-g=\"65\" tabindex=\"0\" role=\"button\">SCADA<\/span>、<span class=\"gl\" data-g=\"64\" tabindex=\"0\" role=\"button\">HMI<\/span><\/strong><\/td>\n<td>分、秒<\/td>\n<td>監看、警報、操作<\/td>\n<\/tr>\n<tr>\n<td>Level 1 控制與感測<\/td>\n<td><strong><span class=\"gl\" data-g=\"68\" tabindex=\"0\" role=\"button\">PLC<\/span><\/strong>、<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>、<span class=\"gl\" data-g=\"69\" tabindex=\"0\" role=\"button\">致動器<\/span><\/td>\n<td>秒、毫秒<\/td>\n<td>即時控制與量測<\/td>\n<\/tr>\n<tr>\n<td>Level 0<\/td>\n<td>實體製程<\/td>\n<td>—<\/td>\n<td>實際生產<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">IoT<\/span> 資料由下往上整合（例如以 <span class=\"gl\" data-g=\"209\" tabindex=\"0\" role=\"button\">OPC UA<\/span> 從 PLC 取值送到 MES），讓 ERP 的計畫與現場實績能即時對齊。<\/p>\n<h2>5. 流程優化方法與品質工具 <span class=\"ref\">考科二 2-3<\/span><span class=\"supp\">補充（依簡章評鑑內容 2-3）<\/span><\/h2>\n<ul>\n<li><strong><span class=\"gl\" data-g=\"467\" tabindex=\"0\" role=\"button\">PDCA<\/span><\/strong>：計畫（Plan）→ 執行（Do）→ 檢查（Check）→ 行動（Act），持續循環改善。<\/li>\n<li><strong><span class=\"gl\" data-g=\"468\" tabindex=\"0\" role=\"button\">DMAIC<\/span><\/strong>（六標準差）：定義（Define）→ 量測（Measure）→ 分析（Analyze）→ 改善（Improve）→ 管制（Control）。<\/li>\n<li><strong><span class=\"gl\" data-g=\"469\" tabindex=\"0\" role=\"button\">SPC<\/span> 統計製程管制<\/strong>：以<strong><span class=\"gl\" data-g=\"470\" tabindex=\"0\" role=\"button\">管制圖<\/span><\/strong>監控製程，中心線為平均值，<strong>管制上下限常取平均值 ± 3 個標準差<\/strong>；點超出管制界限或出現連續偏向一側等異常樣式時，代表有特殊原因需要處理。<\/li>\n<li><strong><span class=\"gl\" data-g=\"471\" tabindex=\"0\" role=\"button\">魚骨圖<\/span>（特性要因圖）<\/strong>：從<strong>人、機、料、法、環<\/strong>（4M1E，有時加「測」）找原因。<\/li>\n<li><strong><span class=\"gl\" data-g=\"472\" tabindex=\"0\" role=\"button\">柏拉圖<\/span>（Pareto）<\/strong>：把問題依發生次數由大到小排列，找出造成約 80 % 問題的少數關鍵原因（80／20 法則）。<\/li>\n<li><strong><span class=\"gl\" data-g=\"473\" tabindex=\"0\" role=\"button\">瓶頸<\/span>（限制理論 TOC）<\/strong>：整條產線的產出由**最慢的站（瓶頸）**決定，改善非瓶頸站無法提高總產出。<\/li>\n<li><strong><span class=\"gl\" data-g=\"474\" tabindex=\"0\" role=\"button\">節拍時間<\/span>（Takt Time）＝可用生產時間 ÷ 客戶需求量<\/strong>：例如每日可用 450 分鐘、需求 900 件 → 每 0.5 分鐘（30 秒）要完成一件。若某站**<span class=\"gl\" data-g=\"475\" tabindex=\"0\" role=\"button\">週期時間<\/span>（Cycle Time）**大於節拍時間，就跟不上需求。<\/li>\n<\/ul>\n<h2>6. 成本控制與投資評估 <span class=\"ref\">考科二 2-3<\/span><span class=\"supp\">補充（依簡章評鑑內容 2-3）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>概念<\/th>\n<th>說明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"476\" tabindex=\"0\" role=\"button\">固定成本<\/span>／變動成本<\/td>\n<td>廠房折舊、租金不隨產量變動；材料、計件工資隨產量變動<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"477\" tabindex=\"0\" role=\"button\">損益平衡點<\/span>（數量）<\/td>\n<td>固定成本 ÷（單價 − 單位變動成本）<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"478\" tabindex=\"0\" role=\"button\">CAPEX<\/span> 資本支出<\/strong><\/td>\n<td>一次性購置：設備、伺服器、<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>硬體（分年折舊）<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"479\" tabindex=\"0\" role=\"button\">OPEX<\/span> 營運支出<\/strong><\/td>\n<td>持續性費用：<span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>訂閱、電信費、維護人力、電費<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"480\" tabindex=\"0\" role=\"button\">TCO<\/span> 總擁有成本<\/strong><\/td>\n<td>購置＋建置整合＋維運＋能源＋教育訓練＋汰換，<strong>不只看採購價<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"481\" tabindex=\"0\" role=\"button\">ROI<\/span> 投資報酬率<\/strong><\/td>\n<td>（效益 − 成本）÷ 成本 × 100 %<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"482\" tabindex=\"0\" role=\"button\">回收期<\/span>（Payback）<\/td>\n<td>初始投資 ÷ 每年淨效益<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"483\" tabindex=\"0\" role=\"button\">品質成本<\/span><\/td>\n<td>預防成本、鑑定成本、內部失敗（報廢、重工）、外部失敗（退貨、保固、商譽）；<strong>愈早預防通常總成本愈低<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 計算例<\/strong>：導入<span class=\"gl\" data-g=\"74\" tabindex=\"0\" role=\"button\">預測性維護<\/span>投資 200 萬元，每年減少停機與維修損失 80 萬元 → <strong>回收期＝200÷80＝2.5 年<\/strong>；三年總效益 240 萬，<strong>三年 ROI＝（240−200）÷200＝20 %<\/strong>。<\/p>\n<p><strong>⚠️ 易混淆<\/strong>：把自建伺服器改成雲端訂閱，是把 <strong>CAPEX 轉成 OPEX<\/strong>，初期投資降低，但長期總成本要用 TCO 比較，不一定比較便宜。<\/p>\n<\/blockquote>\n<h3>今日 30 秒回顧<\/h3>\n<p><span class=\"gl\" data-g=\"451\" tabindex=\"0\" role=\"button\">OEE<\/span>＝<span class=\"gl\" data-g=\"452\" tabindex=\"0\" role=\"button\">可用率<\/span>×效能×品質；停機換模→可用率、變慢小停→效能、不良啟動→品質｜<span class=\"gl\" data-g=\"455\" tabindex=\"0\" role=\"button\">七大浪費<\/span>：過量、庫存、搬運、等待、動作、過度加工、不良｜<span class=\"gl\" data-g=\"457\" tabindex=\"0\" role=\"button\">JIT<\/span>、<span class=\"gl\" data-g=\"458\" tabindex=\"0\" role=\"button\">看板<\/span>＝拉式、<span class=\"gl\" data-g=\"459\" tabindex=\"0\" role=\"button\">Jidoka<\/span>／安燈、<span class=\"gl\" data-g=\"460\" tabindex=\"0\" role=\"button\">防呆<\/span>、<span class=\"gl\" data-g=\"461\" tabindex=\"0\" role=\"button\">5S<\/span>、<span class=\"gl\" data-g=\"462\" tabindex=\"0\" role=\"button\">SMED<\/span>、<span class=\"gl\" data-g=\"463\" tabindex=\"0\" role=\"button\">TPM<\/span>｜<span class=\"gl\" data-g=\"466\" tabindex=\"0\" role=\"button\">ISA-95<\/span>：<span class=\"gl\" data-g=\"67\" tabindex=\"0\" role=\"button\">ERP<\/span>(L4)→<span class=\"gl\" data-g=\"66\" tabindex=\"0\" role=\"button\">MES<\/span>(L3)→<span class=\"gl\" data-g=\"65\" tabindex=\"0\" role=\"button\">SCADA<\/span>/<span class=\"gl\" data-g=\"64\" tabindex=\"0\" role=\"button\">HMI<\/span>(L2)→<span class=\"gl\" data-g=\"68\" tabindex=\"0\" role=\"button\">PLC<\/span>(L1)｜<span class=\"gl\" data-g=\"467\" tabindex=\"0\" role=\"button\">PDCA<\/span>、<span class=\"gl\" data-g=\"468\" tabindex=\"0\" role=\"button\">DMAIC<\/span>、<span class=\"gl\" data-g=\"470\" tabindex=\"0\" role=\"button\">管制圖<\/span> ±3σ、魚骨 <span class=\"gl\" data-g=\"471\" tabindex=\"0\" role=\"button\">4M1E<\/span>、<span class=\"gl\" data-g=\"472\" tabindex=\"0\" role=\"button\">柏拉圖<\/span> 80/20、<span class=\"gl\" data-g=\"473\" tabindex=\"0\" role=\"button\">瓶頸<\/span>決定產出、節拍＝可用時間÷需求｜CAPEX 一次、OPEX 持續、TCO 全生命<span class=\"gl\" data-g=\"368\" tabindex=\"0\" role=\"button\">週期<\/span>、ROI＝(效益−成本)÷成本、回收期＝投資÷年效益。<\/p>", "audio": {"src": "audio/d11.mp3?v=2", "dur": 633}, "questions": [{"id": "d11q1", "n": 1, "opts": ["60.8 %", "64.0 %", "76.0 %", "95.0 %"], "exp": "可用率＝400÷500＝80 %；效能＝（1×320）÷400＝80 %；品質＝304÷320＝95 %。OEE＝0.8×0.8×0.95＝60.8 %。驗算：良品 304 × 1 分 ÷ 500 分＝60.8 %。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某機台計畫生產時間 500 分鐘，停機 100 分鐘；理想週期時間 1 分鐘／件，實際產出 320 件，其中良品 304 件。其 OEE 約為多少？", "ref": "考科二 2-3", "src": "依簡章評鑑內容 2-3", "ans": 0, "stemH": "某機台計畫生產時間 500 分鐘，停機 100 分鐘；理想週期時間 1 分鐘／件，實際產出 320 件，其中良品 304 件。其 OEE 約為多少？", "optsH": ["60.8 %", "64.0 %", "76.0 %", "95.0 %"], "expH": "<span class=\"gl\" data-g=\"452\" tabindex=\"0\" role=\"button\">可用率<\/span>＝400÷500＝80 %；效能＝（1×320）÷400＝80 %；品質＝304÷320＝95 %。<span class=\"gl\" data-g=\"451\" tabindex=\"0\" role=\"button\">OEE<\/span>＝0.8×0.8×0.95＝60.8 %。驗算：良品 304 × 1 分 ÷ 500 分＝60.8 %。"}, {"id": "d11q2", "n": 2, "opts": ["可用率（Availability）", "不影響 OEE", "品質 gl\" data-g=\"36\" tabindex=\"0\" role=\"button\">FP32<\/span>→INT8）、<span class=\"gl\" data-g=\"35\" tabindex=\"0\" role=\"button\">剪枝<\/span>｜<span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>訓練、<span class=\"gl\" data-g=\"45\" tabindex=\"0\" role=\"button\">邊緣推論<\/span>、<span class=\"gl\" data-g=\"50\" tabindex=\"0\" role=\"button\">聯合學習<\/span>只傳參數｜<span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span> 是輔助，<span class=\"gl\" data-g=\"82\" tabindex=\"0\" role=\"button\">PbD<\/span> 在<span class=\"gl\" data-g=\"44\" tabindex=\"0\" role=\"button\">邊緣端<\/span><span class=\"gl\" data-g=\"305\" tabindex=\"0\" role=\"button\">去識別化<\/span>。<\/p>\n<h2>總整理：AIoT 應用案例 <span class=\"ref\">考科一 1.2<\/span><span class=\"pg\">指引 p.3-18～3-22<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"76\" tabindex=\"0\" role=\"button\">Diagnosis<\/span>（<span class=\"gl\" data-g=\"10\" tabindex=\"0\" role=\"button\">分類<\/span>，現況）vs <span class=\"gl\" data-g=\"77\" tabindex=\"0\" role=\"button\">Prognosis<\/span>（<span class=\"gl\" data-g=\"11\" tabindex=\"0\" role=\"button\">迴歸<\/span>，<span class=\"gl\" data-g=\"78\" tabindex=\"0\" role=\"button\">RUL<\/span>）｜<span class=\"gl\" data-g=\"79\" tabindex=\"0\" role=\"button\">感測融合<\/span>提升<span class=\"gl\" data-g=\"80\" tabindex=\"0\" role=\"button\">強健性<\/span>｜<span class=\"gl\" data-g=\"81\" tabindex=\"0\" role=\"button\">四位一體<\/span>：感知、通訊、智慧、安全｜異質 <span class=\"gl\" data-g=\"68\" tabindex=\"0\" role=\"button\">PLC<\/span> → <span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span>＋<span class=\"gl\" data-g=\"209\" tabindex=\"0\" role=\"button\">OPC UA<\/span>｜大面積農業 → <span class=\"gl\" data-g=\"157\" tabindex=\"0\" role=\"button\">LoRa<\/span>＋<span class=\"gl\" data-g=\"49\" tabindex=\"0\" role=\"button\">端雲協作<\/span>。<\/p>\n<h2>總整理：物聯網架構 <span class=\"ref\">考科一 2.1<\/span><span class=\"pg\">指引 p.4-1～4-21<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"93\" tabindex=\"0\" role=\"button\">感知層<\/span>、<span class=\"gl\" data-g=\"94\" tabindex=\"0\" role=\"button\">網路層<\/span>、<span class=\"gl\" data-g=\"95\" tabindex=\"0\" role=\"button\">應用層<\/span>｜<span class=\"gl\" data-g=\"98\" tabindex=\"0\" role=\"button\">OSI<\/span>「應表會傳網鏈實」；<span class=\"gl\" data-g=\"99\" tabindex=\"0\" role=\"button\">TCP/IP 四層<\/span>｜超音波測距、<span class=\"gl\" data-g=\"335\" tabindex=\"0\" role=\"button\">PIR<\/span> 測移動、<span class=\"gl\" data-g=\"336\" tabindex=\"0\" role=\"button\">DHT11<\/span> 溫濕度、<span class=\"gl\" data-g=\"340\" tabindex=\"0\" role=\"button\">MQ 系列<\/span>測氣體。<\/p>\n<h2>總整理：無線與應用層協定 <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-26～4-42<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"124\" tabindex=\"0\" role=\"button\">RFID<\/span>／<span class=\"gl\" data-g=\"128\" tabindex=\"0\" role=\"button\">NFC<\/span>（約 10 cm）／<span class=\"gl\" data-g=\"139\" tabindex=\"0\" role=\"button\">BLE<\/span>／<span class=\"gl\" data-g=\"146\" tabindex=\"0\" role=\"button\">Zigbee<\/span>（<span class=\"gl\" data-g=\"149\" tabindex=\"0\" role=\"button\">網狀<\/span>）／<span class=\"gl\" data-g=\"131\" tabindex=\"0\" role=\"button\">Wi-Fi<\/span>／<span class=\"gl\" data-g=\"157\" tabindex=\"0\" role=\"button\">LoRa<\/span>、<span class=\"gl\" data-g=\"156\" tabindex=\"0\" role=\"button\">NB-IoT<\/span>（<span class=\"gl\" data-g=\"155\" tabindex=\"0\" role=\"button\">LPWAN<\/span>）／<span class=\"gl\" data-g=\"161\" tabindex=\"0\" role=\"button\">4G<\/span>、<span class=\"gl\" data-g=\"162\" tabindex=\"0\" role=\"button\">5G<\/span>（<span class=\"gl\" data-g=\"163\" tabindex=\"0\" role=\"button\">eMBB<\/span>、<span class=\"gl\" data-g=\"165\" tabindex=\"0\" role=\"button\">URLLC<\/span>、<span class=\"gl\" data-g=\"164\" tabindex=\"0\" role=\"button\">mMTC<\/span>）｜<span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span>＝<span class=\"gl\" data-g=\"100\" tabindex=\"0\" role=\"button\">TCP<\/span>＋<span class=\"gl\" data-g=\"174\" tabindex=\"0\" role=\"button\">發布訂閱<\/span>；<span class=\"gl\" data-g=\"173\" tabindex=\"0\" role=\"button\">CoAP<\/span>＝<span class=\"gl\" data-g=\"101\" tabindex=\"0\" role=\"button\">UDP<\/span>＋<span class=\"gl\" data-g=\"186\" tabindex=\"0\" role=\"button\">REST<\/span>；<span class=\"gl\" data-g=\"106\" tabindex=\"0\" role=\"button\">HTTP<\/span> 請求回應；<span class=\"gl\" data-g=\"184\" tabindex=\"0\" role=\"button\">WebSocket<\/span> 雙向。<\/p>\n<h2>總整理：工業通訊與網路 <span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-47～4-68<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"100\" tabindex=\"0\" role=\"button\">TCP<\/span> 可靠、<span class=\"gl\" data-g=\"101\" tabindex=\"0\" role=\"button\">UDP<\/span> 快｜<span class=\"gl\" data-g=\"178\" tabindex=\"0\" role=\"button\">QoS<\/span> 0 最多一次、1 至少一次、2 恰好一次｜<span class=\"gl\" data-g=\"193\" tabindex=\"0\" role=\"button\">Modbus<\/span> <span class=\"gl\" data-g=\"207\" tabindex=\"0\" role=\"button\">主從<\/span>、RTU／TCP（502）｜<span class=\"gl\" data-g=\"209\" tabindex=\"0\" role=\"button\">OPC UA<\/span> 跨平台、<span class=\"gl\" data-g=\"210\" tabindex=\"0\" role=\"button\">資訊模型<\/span>、內建安全｜<span class=\"gl\" data-g=\"212\" tabindex=\"0\" role=\"button\">MTConnect<\/span> 唯讀、<span class=\"gl\" data-g=\"213\" tabindex=\"0\" role=\"button\">XML<\/span>、工具機｜<span class=\"gl\" data-g=\"186\" tabindex=\"0\" role=\"button\">REST<\/span> 無狀態。<\/p>\n<div class=\"cp\" id=\"cp_d13c1\" data-ans=\"0\"><div class=\"cph\">🧩 隨堂小測 1<span class=\"ref\">考科一 2.3<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">工廠網管要在防火牆上，只開放 SCADA 伺服器連到產線 PLC 的 Modbus TCP 連線。依講義，Modbus TCP 常用的埠號是？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 502<\/button><button class=\"opt cpo\" data-k=\"1\">B. 1883<\/button><button class=\"opt cpo\" data-k=\"2\">C. 8883<\/button><button class=\"opt cpo\" data-k=\"3\">D. 80<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div><span class=\"gl\" data-g=\"196\" tabindex=\"0\" role=\"button\">Modbus TCP<\/span> 常用 502 埠。1883 是 <span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span>、8883 是 MQTT over <span class=\"gl\" data-g=\"182\" tabindex=\"0\" role=\"button\">TLS<\/span>、80 是 <span class=\"gl\" data-g=\"106\" tabindex=\"0\" role=\"button\">HTTP<\/span>。另外要記得 <span class=\"gl\" data-g=\"193\" tabindex=\"0\" role=\"button\">Modbus<\/span> 本身沒有加密與身分驗證，所以更需要用<span class=\"gl\" data-g=\"294\" tabindex=\"0\" role=\"button\">防火牆<\/span>限制來源。<\/div><\/div><\/div>\n<h2>總整理：中介軟體與平台 <span class=\"ref\">考科一 2.4<\/span><span class=\"pg\">指引 p.4-73～4-79<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"228\" tabindex=\"0\" role=\"button\">IaaS<\/span>（硬體）／<span class=\"gl\" data-g=\"229\" tabindex=\"0\" role=\"button\">PaaS<\/span>（平台＋執行環境＋DB）／<span class=\"gl\" data-g=\"230\" tabindex=\"0\" role=\"button\">SaaS<\/span>（軟體）｜<span class=\"gl\" data-g=\"44\" tabindex=\"0\" role=\"button\">邊緣運算<\/span>降<span class=\"gl\" data-g=\"47\" tabindex=\"0\" role=\"button\">延遲<\/span>、省<span class=\"gl\" data-g=\"48\" tabindex=\"0\" role=\"button\">頻寬<\/span>｜<span class=\"gl\" data-g=\"219\" tabindex=\"0\" role=\"button\">中介軟體<\/span>＝裝置與應用之間的抽象層。<\/p>\n<h2>總整理：資安與隱私 <span class=\"ref\">考科一 2.5<\/span><span class=\"pg\">指引 p.4-85～4-90<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"267\" tabindex=\"0\" role=\"button\">CIA<\/span>｜對稱／非對稱；<span class=\"gl\" data-g=\"270\" tabindex=\"0\" role=\"button\">私鑰<\/span>簽、公鑰驗＝不可否認｜<span class=\"gl\" data-g=\"275\" tabindex=\"0\" role=\"button\">雜湊<\/span>＝完整性｜<span class=\"gl\" data-g=\"289\" tabindex=\"0\" role=\"button\">DDoS<\/span>（<span class=\"gl\" data-g=\"290\" tabindex=\"0\" role=\"button\">Mirai<\/span>）｜<span class=\"gl\" data-g=\"305\" tabindex=\"0\" role=\"button\">去識別化<\/span>、<span class=\"gl\" data-g=\"314\" tabindex=\"0\" role=\"button\">最小權限<\/span>。<\/p>\n<h2>總整理：感測技術 <span class=\"ref\">考科一 3.1<\/span><span class=\"pg\">指引 p.5-1～5-10<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"323\" tabindex=\"0\" role=\"button\">靈敏度<\/span>、<span class=\"gl\" data-g=\"322\" tabindex=\"0\" role=\"button\">解析度<\/span>、<span class=\"gl\" data-g=\"324\" tabindex=\"0\" role=\"button\">準確度<\/span> vs <span class=\"gl\" data-g=\"325\" tabindex=\"0\" role=\"button\">精密度<\/span>、<span class=\"gl\" data-g=\"328\" tabindex=\"0\" role=\"button\">遲滯<\/span>、<span class=\"gl\" data-g=\"327\" tabindex=\"0\" role=\"button\">線性度<\/span>｜<span class=\"gl\" data-g=\"347\" tabindex=\"0\" role=\"button\">熱電偶<\/span>（席貝克、<span class=\"gl\" data-g=\"350\" tabindex=\"0\" role=\"button\">冷點補償<\/span>）、<span class=\"gl\" data-g=\"345\" tabindex=\"0\" role=\"button\">RTD<\/span>（<span class=\"gl\" data-g=\"346\" tabindex=\"0\" role=\"button\">Pt100<\/span>）、<span class=\"gl\" data-g=\"342\" tabindex=\"0\" role=\"button\">NTC<\/span>／<span class=\"gl\" data-g=\"343\" tabindex=\"0\" role=\"button\">PTC<\/span>｜壓電、<span class=\"gl\" data-g=\"353\" tabindex=\"0\" role=\"button\">應變規<\/span>、光電｜<span class=\"gl\" data-g=\"320\" tabindex=\"0\" role=\"button\">ADC<\/span>：2ⁿ 階。<\/p>\n<h2>總整理：訊號與通訊 <span class=\"ref\">考科一 3.2<\/span><span class=\"pg\">指引 p.5-15～5-24<\/span><\/h2>\n<p>類比 vs 數位｜<span class=\"gl\" data-g=\"371\" tabindex=\"0\" role=\"button\">單工<\/span>、半雙工、全雙工｜<span class=\"gl\" data-g=\"369\" tabindex=\"0\" role=\"button\">串列<\/span> vs 並列；同步（有<span class=\"gl\" data-g=\"388\" tabindex=\"0\" role=\"button\">時脈<\/span>）vs <span class=\"gl\" data-g=\"372\" tabindex=\"0\" role=\"button\">非同步<\/span>｜<span class=\"gl\" data-g=\"384\" tabindex=\"0\" role=\"button\">UART<\/span>（TX/RX）、<span class=\"gl\" data-g=\"385\" tabindex=\"0\" role=\"button\">I²C<\/span>（SDA/SCL、位址、上拉）、<span class=\"gl\" data-g=\"386\" tabindex=\"0\" role=\"button\">SPI<\/span>（4 線、<span class=\"gl\" data-g=\"387\" tabindex=\"0\" role=\"button\">CS<\/span>、全雙工）｜<span class=\"gl\" data-g=\"377\" tabindex=\"0\" role=\"button\">AM<\/span>／FM／PM（類比調變），<span class=\"gl\" data-g=\"378\" tabindex=\"0\" role=\"button\">ASK<\/span>／FSK／PSK（數位資料→<span class=\"gl\" data-g=\"318\" tabindex=\"0\" role=\"button\">類比訊號<\/span>）。<\/p>\n<h2>總整理：系統元件與架構 <span class=\"ref\">考科二 1-1<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<p>感→控→動＋通→雲→用｜<span class=\"gl\" data-g=\"57\" tabindex=\"0\" role=\"button\">MCU<\/span>／<span class=\"gl\" data-g=\"59\" tabindex=\"0\" role=\"button\">SBC<\/span>／<span class=\"gl\" data-g=\"68\" tabindex=\"0\" role=\"button\">PLC<\/span> 選用｜端－邊－雲；<span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span>協定轉換與斷線暫存｜<span class=\"gl\" data-g=\"64\" tabindex=\"0\" role=\"button\">HMI<\/span>、<span class=\"gl\" data-g=\"65\" tabindex=\"0\" role=\"button\">SCADA<\/span>、<span class=\"gl\" data-g=\"66\" tabindex=\"0\" role=\"button\">MES<\/span>、<span class=\"gl\" data-g=\"67\" tabindex=\"0\" role=\"button\">ERP<\/span>。<\/p>\n<h2>總整理：故障判斷與排除 <span class=\"ref\">考科二 1-2<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<p>先現象、由簡入繁、分層、二分、一次改一個、做紀錄｜電表（電流串聯、電壓並聯、電阻斷電）、<span class=\"gl\" data-g=\"425\" tabindex=\"0\" role=\"button\">示波器<\/span>、<span class=\"gl\" data-g=\"426\" tabindex=\"0\" role=\"button\">邏輯分析儀<\/span>、<span class=\"gl\" data-g=\"428\" tabindex=\"0\" role=\"button\">ping<\/span>｜<span class=\"gl\" data-g=\"413\" tabindex=\"0\" role=\"button\">看門狗<\/span>、<span class=\"gl\" data-g=\"430\" tabindex=\"0\" role=\"button\">NTP<\/span>、2.4 GHz。<\/p>\n<h2>總整理：物聯網資訊安全 <span class=\"ref\">考科二 1-3<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<p>唯一密碼｜<span class=\"gl\" data-g=\"182\" tabindex=\"0\" role=\"button\">TLS<\/span> 8883、<span class=\"gl\" data-g=\"183\" tabindex=\"0\" role=\"button\">DTLS<\/span>｜<span class=\"gl\" data-g=\"298\" tabindex=\"0\" role=\"button\">Secure Boot<\/span>＋<span class=\"gl\" data-g=\"277\" tabindex=\"0\" role=\"button\">簽章<\/span> <span class=\"gl\" data-g=\"168\" tabindex=\"0\" role=\"button\">OTA<\/span>｜<span class=\"gl\" data-g=\"282\" tabindex=\"0\" role=\"button\">mTLS<\/span>、<span class=\"gl\" data-g=\"279\" tabindex=\"0\" role=\"button\">X.509<\/span>｜<span class=\"gl\" data-g=\"314\" tabindex=\"0\" role=\"button\">最小權限<\/span> <span class=\"gl\" data-g=\"313\" tabindex=\"0\" role=\"button\">ACL<\/span>、分<span class=\"gl\" data-g=\"293\" tabindex=\"0\" role=\"button\">網段<\/span>｜<span class=\"gl\" data-g=\"310\" tabindex=\"0\" role=\"button\">重放攻擊<\/span>用 <span class=\"gl\" data-g=\"311\" tabindex=\"0\" role=\"button\">nonce<\/span>／<span class=\"gl\" data-g=\"266\" tabindex=\"0\" role=\"button\">時間戳<\/span>｜個資：最小化、同意、限期刪除。<\/p>\n<h2>總整理：硬體設計基礎 <span class=\"ref\">考科二 2-1<\/span><span class=\"supp\">補充（能力指標 2）<\/span><\/h2>\n<p>上拉／下拉、<span class=\"gl\" data-g=\"391\" tabindex=\"0\" role=\"button\">去彈跳<\/span>｜<span class=\"gl\" data-g=\"320\" tabindex=\"0\" role=\"button\">ADC<\/span>、<span class=\"gl\" data-g=\"400\" tabindex=\"0\" role=\"button\">PWM<\/span>｜<span class=\"gl\" data-g=\"402\" tabindex=\"0\" role=\"button\">電晶體<\/span>、<span class=\"gl\" data-g=\"403\" tabindex=\"0\" role=\"button\">MOSFET<\/span>、<span class=\"gl\" data-g=\"404\" tabindex=\"0\" role=\"button\">繼電器<\/span>、<span class=\"gl\" data-g=\"405\" tabindex=\"0\" role=\"button\">SSR<\/span>、<span class=\"gl\" data-g=\"406\" tabindex=\"0\" role=\"button\">H 橋<\/span>｜<span class=\"gl\" data-g=\"407\" tabindex=\"0\" role=\"button\">飛輪二極體<\/span>、<span class=\"gl\" data-g=\"410\" tabindex=\"0\" role=\"button\">光耦合器<\/span>｜<span class=\"gl\" data-g=\"411\" tabindex=\"0\" role=\"button\">中斷<\/span>、<span class=\"gl\" data-g=\"413\" tabindex=\"0\" role=\"button\">看門狗<\/span>｜<span class=\"gl\" data-g=\"201\" tabindex=\"0\" role=\"button\">RS-232<\/span> vs <span class=\"gl\" data-g=\"202\" tabindex=\"0\" role=\"button\">RS-485<\/span>、<span class=\"gl\" data-g=\"416\" tabindex=\"0\" role=\"button\">4–20 mA<\/span>｜<span class=\"gl\" data-g=\"440\" tabindex=\"0\" role=\"button\">開源硬體<\/span>：<span class=\"gl\" data-g=\"441\" tabindex=\"0\" role=\"button\">CERN OHL<\/span>、TAPR、<span class=\"gl\" data-g=\"442\" tabindex=\"0\" role=\"button\">CC BY-SA<\/span>，商標除外。<\/p>\n<h2>總整理：雲端數據收集與平台設計 <span class=\"ref\">考科二 2-2<\/span><span class=\"supp\">補充（能力指標 1）<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"251\" tabindex=\"0\" role=\"button\">JSON<\/span>／<span class=\"gl\" data-g=\"213\" tabindex=\"0\" role=\"button\">XML<\/span>／<span class=\"gl\" data-g=\"253\" tabindex=\"0\" role=\"button\">CSV<\/span>／<span class=\"gl\" data-g=\"254\" tabindex=\"0\" role=\"button\">CBOR<\/span>｜<span class=\"gl\" data-g=\"186\" tabindex=\"0\" role=\"button\">REST<\/span> 方法與<span class=\"gl\" data-g=\"190\" tabindex=\"0\" role=\"button\">狀態碼<\/span>｜<span class=\"gl\" data-g=\"177\" tabindex=\"0\" role=\"button\">Topic<\/span> 設計｜<span class=\"gl\" data-g=\"242\" tabindex=\"0\" role=\"button\">PK<\/span>、<span class=\"gl\" data-g=\"243\" tabindex=\"0\" role=\"button\">FK<\/span>、<span class=\"gl\" data-g=\"244\" tabindex=\"0\" role=\"button\">1NF<\/span>～3NF、<span class=\"gl\" data-g=\"241\" tabindex=\"0\" role=\"button\">DDL<\/span>／DML／DCL、<span class=\"gl\" data-g=\"237\" tabindex=\"0\" role=\"button\">ACID<\/span>｜<span class=\"gl\" data-g=\"247\" tabindex=\"0\" role=\"button\">時序資料庫<\/span>、鍵值<span class=\"gl\" data-g=\"239\" tabindex=\"0\" role=\"button\">快取<\/span>｜<span class=\"gl\" data-g=\"444\" tabindex=\"0\" role=\"button\">GPL<\/span>、<span class=\"gl\" data-g=\"445\" tabindex=\"0\" role=\"button\">LGPL<\/span>、<span class=\"gl\" data-g=\"447\" tabindex=\"0\" role=\"button\">MIT<\/span>、<span class=\"gl\" data-g=\"448\" tabindex=\"0\" role=\"button\">BSD<\/span>、<span class=\"gl\" data-g=\"449\" tabindex=\"0\" role=\"button\">Apache 2.0<\/span>、<span class=\"gl\" data-g=\"450\" tabindex=\"0\" role=\"button\">AGPL<\/span>。<\/p>\n<h2>總整理：智慧製造流程優化與成本控制 <span class=\"ref\">考科二 2-3<\/span><span class=\"supp\">補充（依簡章評鑑內容 2-3）<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"451\" tabindex=\"0\" role=\"button\">OEE<\/span> 與<span class=\"gl\" data-g=\"453\" tabindex=\"0\" \">C. 3,000 台<\/button><button class=\"opt cpo\" data-k=\"3\">D. 6,000 台<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div><span class=\"gl\" data-g=\"477\" tabindex=\"0\" role=\"button\">損益平衡點<\/span>（數量）＝<span class=\"gl\" data-g=\"476\" tabindex=\"0\" role=\"button\">固定成本<\/span> ÷（單價 − 單位變動成本）＝6,000,000 ÷（5,000 − 3,000）＝3,000 台。<\/div><\/div><\/div>", "audio": {"src": "audio/d13.mp3?v=2", "dur": 577}, "questions": [{"id": "d13q1", "n": 1, "opts": ["把推論改回雲端並每秒上傳原始影像", "增加模型的層數", "改用更高解析度的輸入影像", "把模型量化為 INT8"], "exp": "量化（FP32 → INT8）可縮小模型、加快推論、降低功耗，是邊緣部署的常見做法；其餘選項都會增加運算量或頻寬。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某 AIoT 專案要把在雲端訓練好的 FP32 影像模型部署到記憶體有限的邊緣裝置，並希望推論更快、更省電。下列哪一種做法最直接？", "ref": "考科一 1.1", "src": "指引 p.3-5", "ans": 3, "stemH": "某 AIoT 專案要把在雲端訓練好的 FP32 影像模型部署到記憶體有限的邊緣裝置，並希望推論更快、更省電。下列哪一種做法最直接？", "optsH": ["把推論改回雲端並每秒上傳原始影像", "增加模型的層數", "改用更高解析度的輸入影像", "把模型量化為 INT8"], "expH": "<span class=\"gl\" data-g=\"34\" tabindex=\"0\" role=\"button\">量化<\/span>（<span class=\"gl\" data-g=\"36\" tabindex=\"0\" role=\"button\">FP32<\/span> → INT8）可縮小模型、加快<span class=\"gl\" data-g=\"29\" tabindex=\"0\" role=\"button\">推論<\/span>、降低功耗，是邊緣部署的常見做法；其餘選項都會增加運算量或<span class=\"gl\" data-g=\"48\" tabindex=\"0\" role=\"button\">頻寬<\/span>。"}, {"id": "d13q2", "n": 2, "opts": ["診斷（Diagnosis），屬分類問題", "生成問題", "分群問題", "預後（Prognosis），屬迴歸問題"], "exp": "預後（Prognosis）預測未來，輸出連續的剩餘時間，屬迴歸；診斷判斷目前的故障類別，屬分類。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "在預測性維護中，「估計設備還能正常運轉多久（剩餘使用壽命 RUL）」屬於哪一類任務？", "ref": "考科一 1.2", "src": "指引 p.3-18", "ans": 3, "stemH": "在預測性維護中，「估計設備還能正常運轉多久（剩餘使用壽命 RUL）」屬於哪一類任務？", "optsH": ["診斷（Diagnosis），屬分類問題", "生成問題", "分群問題", "預後（Prognosis），屬迴歸問題"], "expH": "預後（<span class=\"gl\" data-g=\"77\" tabindex=\"0\" role=\"button\">Prognosis<\/span>）預測未來，輸出連續的剩餘時間，屬<span class=\"gl\" data-g=\"11\" tabindex=\"0\" role=\"button\">迴歸<\/span>；診斷判斷目前的故障類別，屬<span class=\"gl\" data-g=\"10\" tabindex=\"0\" role=\"button\">分類<\/span>。"}, {"id": "d13q3", "n": 3, "opts": ["FTP", "SMTP", "MQTT", "Telnet"], "exp": "MQTT 為輕量級發布／訂閱協定，透過 Broker 讓發布者與訂閱者解耦，適合低頻寬、不穩定網路的 IoT 裝置。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某裝置需要經常主動推送少量資料，且網路不穩、頻寬有限，希望以發布／訂閱模式與多個應用程式解耦。最適合的通訊協定是？", "ref": "考科一 2.2", "src": "指引 p.4-40", "ans": 2, "stemH": "某裝置需要經常主動推送少量資料，且網路不穩、頻寬有限，希望以發布／訂閱模式與多個應用程式解耦。最適合的通訊協定是？", "optsH": ["FTP", "SMTP", "MQTT", "Telnet"], "expH": "<span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span> 為輕量級<span class=\"gl\" data-g=\"174\" tabindex=\"0\" role=\"button\">發布／訂閱<\/span>協定，透過 <span class=\"gl\" data-g=\"176\" tabindex=\"0\" role=\"button\">Broker<\/span> 讓發布者與訂閱者<span class=\"gl\" data-g=\"221\" tabindex=\"0\" role=\"button\">解耦<\/span>，適合低<span class=\"gl\" data-g=\"48\" tabindex=\"0\" role=\"button\">頻寬<\/span>、不穩定網路的 <span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">IoT<\/span> 裝置。"}, {"id": "d13q4", "n": 4, "opts": ["QoS 0", "QoS 1", "QoS 2", "QoS 3"], "exp": "QoS 0 最多一次、QoS 1 至少一次（可能重複）、QoS 2 恰好一次（四次交握，開銷最大）。MQTT 沒有 QoS 3。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "MQTT 的 QoS 等級中，保證訊息「恰好送達一次（Exactly once）」的是？", "ref": "考科一 2.3", "src": "指引 p.4-62", "ans": 2, "stemH": "MQTT 的 QoS 等級中，保證訊息「恰好送達一次（Exactly once）」的是？", "optsH": ["QoS 0", "QoS 1", "QoS 2", "QoS 3"], "expH": "<span class=\"gl\" data-g=\"178\" tabindex=\"0\" role=\"button\">QoS<\/span> 0 最多一次、QoS 1 至少一次（可能重複）、QoS 2 恰好一次（四次交握，開銷最大）。<span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span> 沒有 QoS 3。"}, {"id": "d13q5", "n": 5, "opts": ["以 A 的私鑰對合約雜湊值做數位簽章", "以 B 的私鑰加密合約", "以 A 的公鑰加密合約", "直接以明文傳送"], "exp": "數位簽章以傳送者私鑰簽署、接收者以其公鑰驗證，可確認來源、完整性與不可否認性。A 不會有 B 的私鑰；以 A 的公鑰加密無法證明來源。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "A 要傳送合約給 B，並讓 B 能確認合約確實由 A 發出且未被竄改。A 應如何處理？", "ref": "考科一 2.5", "src": "指引 p.4-85", "ans": 0, "stemH": "A 要傳送合約給 B，並讓 B 能確認合約確實由 A 發出且未被竄改。A 應如何處理？", "optsH": ["以 A 的私鑰對合約雜湊值做數位簽章", "以 B 的私鑰加密合約", "以 A 的公鑰加密合約", "直接以明文傳送"], "expH": "<span class=\"gl\" data-g=\"277\" tabindex=\"0\" role=\"button\">數位簽章<\/span>以傳送者<span c ）決定角度。"}, {"id": "d13q11", "n": 11, "opts": ["裝置清單與使用者帳號 → 關聯式資料庫", "每秒大量的感測讀值 → 時序資料庫", "裝置最新狀態快取 → 鍵值型資料庫", "每秒寫入數萬筆讀值 → 存在單一 CSV 檔並以人工合併"], "exp": "單一 CSV 檔無法承受高頻寫入，也難以查詢與並行存取。A、B、C 是常見的混合儲存設計。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "在 IoT 平台中，下列哪一種資料儲存的對應「最不」恰當？", "ref": "考科二 2-2", "src": "能力指標 1（資料庫設計基礎）", "ans": 3, "stemH": "在 IoT 平台中，下列哪一種資料儲存的對應「最不」恰當？", "optsH": ["裝置清單與使用者帳號 → 關聯式資料庫", "每秒大量的感測讀值 → 時序資料庫", "裝置最新狀態快取 → 鍵值型資料庫", "每秒寫入數萬筆讀值 → 存在單一 CSV 檔並以人工合併"], "expH": "單一 <span class=\"gl\" data-g=\"253\" tabindex=\"0\" role=\"button\">CSV<\/span> 檔無法承受高頻寫入，也難以查詢與並行存取。A、B、C 是常見的混合儲存設計。"}, {"id": "d13q12", "n": 12, "opts": ["以 AI 視覺檢測與製程參數監控，及早發現並減少不良品", "縮短換模時間", "減少故障停機", "提高售價"], "exp": "品質＝良品數÷總產出數，減少不良與重工可直接提升品質因子。縮短換模與減少停機改善的是可用率；售價與 OEE 無關。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "若想提升 OEE 中的「品質」因子，下列哪一項 AIoT 應用最直接？", "ref": "考科二 2-3", "src": "依簡章評鑑內容 2-3", "ans": 0, "stemH": "若想提升 OEE 中的「品質」因子，下列哪一項 AIoT 應用最直接？", "optsH": ["以 AI 視覺檢測與製程參數監控，及早發現並減少不良品", "縮短換模時間", "減少故障停機", "提高售價"], "expH": "品質＝良品數÷總產出數，減少不良與重工可直接提升品質因子。縮短換模與減少停機改善的是<span class=\"gl\" data-g=\"452\" tabindex=\"0\" role=\"button\">可用率<\/span>；售價與 <span class=\"gl\" data-g=\"451\" tabindex=\"0\" role=\"button\">OEE<\/span> 無關。"}], "gloss": [244, 416, 162, 461, 237, 313, 320, 450, 0, 1, 449, 378, 264, 139, 176, 448, 478, 254, 442, 441, 267, 17, 173, 253, 241, 289, 336, 468, 183, 45, 163, 67, 54, 108, 26, 444, 52, 406, 64, 106, 190, 228, 36, 92, 466, 385, 459, 457, 251, 445, 157, 155, 19, 161, 57, 66, 290, 447, 164, 193, 196, 403, 340, 172, 212, 282, 156, 128, 311, 53, 342, 430, 451, 209, 479, 98, 168, 229, 82, 467, 428, 335, 68, 346, 343, 400, 178, 186, 124, 18, 481, 201, 202, 345, 78, 230, 65, 298, 462, 109, 469, 386, 405, 480, 100, 99, 112, 182, 177, 463, 384, 101, 165, 184, 131, 279, 213, 146, 455, 389, 278, 219, 411, 369, 207, 242, 433, 77, 410, 453, 350, 12, 10, 35, 381, 401, 391, 305, 452, 483, 371, 59, 81, 482, 476, 123, 243, 417, 47, 80, 7, 239, 70, 79, 93, 95, 353, 29, 477, 76, 277, 247, 388, 266, 314, 472, 347, 387, 473, 13, 174, 5, 458, 413, 425, 49, 325, 324, 149, 94, 293, 327, 404, 50, 322, 221, 377, 210, 11, 383, 368, 328, 46, 44, 426, 310, 34, 440, 96, 235, 460, 294, 437, 275, 225, 402, 323, 372, 270, 6, 299, 74, 48, 318, 407, 375]}], "glossary": [{"term": "AI", "aliases": ["人工智慧", "Artificial Intelligence"], "cat": "AI", "exp": "讓電腦做出「像人一樣判斷」的技術總稱，例如看影像判斷有沒有瑕疵、聽聲音判斷馬達是否異常。在 AIoT 裡，AI 負責把感測資料變成「判斷與決策」。", "vs": "AI ⊃ 機器學習 ⊃ 深度學習：AI 是最大的圈，機器學習是其中「從資料學規則」的方法，深度學習又是機器學習裡用多層類神經網路的那一支。", "days": [1, 2, 4, 6, 7, 8, 9, 10, 11, 12, 13]}, {"term": "AIoT", "aliases": ["人工智慧物聯網"], "cat": "AI", "exp": "AI＋IoT：物聯網負責「感測與連線」收集資料，AI 負責「分析與判斷」。例：工廠馬達裝震動感測器（IoT），AI 判斷快壞了就提前通知維修。", "days": [1, 2, 4, 6, 7, 11, 13]}, {"term": "機器學習", "aliases": ["ML", "Machine Learning"], "cat": "AI", "exp": "不是由人寫死規則，而是讓電腦「看很多資料自己找出規律」，再用來判斷新資料。例：餵它一年份的馬達震動與故障紀錄，它學會分辨正常與異常。", "days": [1, 4, 6, 7]}, {"term": "深度學習", "aliases": ["DL", "Deep Learning"], "cat": "AI", "exp": "機器學習的一個分支，使用很多層的類神經網路，能自動從影像、聲音、震動等原始資料中找出特徵，不必人工先挑特徵。代價是需要大量資料與算力。", "days": [1, 6, 8]}, {"term": "類神經網路", "aliases": ["ANN", "Artificial Neural Network", "神經網路"], "cat": "AI", "exp": "模仿人腦神經元連結方式的數學模型：資料從輸入層經過多個隱藏層運算到輸出層，每條連線有一個「權重」，訓練就是調整這些權重。深度學習的基礎。", "days": [1, 6]}, {"term": "監督式學習", "aliases": ["Supervised Learning", "Supervised", "監督式"], "cat": "AI", "exp": "訓練資料「有標準答案（標籤）」的學習方式，像老師拿著解答教學生。例：每張產品照片都標好「良品／瑕疵」，模型學會自己分辨。任務分成分類與迴歸。", "vs": "監督式＝有標籤；非監督式＝沒標籤、自己找相似群組；強化學習＝沒有標準答案，靠試錯拿獎勵。", "days": [1, 6, 13]}, {"term": "非監督式學習", "aliases": ["Unsupervised Learning", "Unsupervised", "非監督式"], "cat": "AI", "exp": "訓練資料「沒有標準答案」，讓模型自己找出資料的結構，例如把相似的運轉狀態歸成一群（分群），或用正常資料畫出邊界、抓出不像正常的點（異常偵測）。", "days": [1, 6, 13]}, {"term": "強化學習", "aliases": ["RL", "Reinforcement Learning", "Reinforcement"], "cat": "AI", "exp": "讓一個「代理人（Agent）」在環境中反覆嘗試，做對給獎勵、做錯給懲罰，慢慢學會最好的策略，像訓練寵物。例：空調系統自己摸索在舒適前提下最省電的控制方式。因為要試錯，必須先設安全邊界。", "days": [1, 6, 13]}, {"term": "代理人", "aliases": ["Agent"], "cat": "AI", "exp": "強化學習裡「做決定並採取行動」的那個角色，例如控制空調的程式；它觀察環境、做動作、收到獎勵或懲罰後調整策略。（在 MTConnect 中 Agent 另指「代理器」，意思不同。）", "days": [1, 3]}, {"term": "特徵與標籤", "aliases": ["Feature", "Label", "特徵（Feature）", "標籤（Label）"], "cat": "AI", "exp": "特徵＝模型拿來判斷的輸入資訊（例如震動振幅、溫度）；標籤＝這筆資料的正確答案（例如「正常」或「軸承故障」）。有標籤才能做監督式學習。", "days": [1]}, {"term": "分類", "aliases": ["Classification"], "cat": "AI", "exp": "監督式學習任務，輸出是「離散的類別」。例：判斷產品是良品還是瑕疵品、馬達是正常／軸承故障／不平衡。", "vs": "分類輸出類別（是哪一種）；迴歸輸出連續數值（多少）。", "days": [1, 5, 6, 10, 13]}, {"term": "迴歸", "aliases": ["Regression"], "cat": "AI", "exp": "監督式學習任務，輸出是「連續的數值」。例：預測明天耗電幾度、馬達還能用幾天（RUL）、溫度趨勢。", "vs": "迴歸＝預測數字；分類＝預測類別。迴歸是監督式，不是非監督式。", "days": [1, 6, 13]}, {"term": "分群", "aliases": ["Clustering"], "cat": "AI", "exp": "非監督式學習任務：沒有標準答案，只把「彼此相似」的資料自動歸在同一群。例：把機台運轉狀態自動分成幾種模式。", "vs": "分群（非監督，沒答案）≠ 分類（監督，有答案）。", "days": [1, 4, 5, 6, 13]}, {"term": "異常偵測", "aliases": ["Anomaly Detection"], "cat": "AI", "exp": "先用大量「正常」資料學出正常長什麼樣子，再把偏離正常太多的資料標為異常。工廠故障樣本很少時特別好用，但要搭配門檻設定避免誤報。", "days": [1, 6, 13]}, {"term": "時間序列", "aliases": ["Time-series", "時序資料"], "cat": "AI", "exp": "依時間先後排列的一串資料，例如馬達每秒上千筆的震動值、每分鐘一筆的溫度。前後資料有關聯，常用 RNN／LSTM 分析，存放常用時序資料庫。", "days": [1, 6]}, {"term": "類別不平衡", "aliases": ["Imbalanced Data"], "cat": "AI", "exp": "某一類資料遠多於另一類，例如正常資料一百萬筆、故障只有 30 筆。模型容易「全部猜正常」也有很高準確率，所以要特別處理或改用異常偵測。", "days": [1]}, {"term": "資料缺失", "aliases": ["Missing Data"], "cat": "AI", "exp": "資料中有空洞，例如感測器斷線、受干擾導致某段時間沒有值。訓練前要先補值或剔除，屬於資料前處理的工作。", "days": [1]}, {"term": "CNN", "aliases": ["卷積神經網路", "Convolutional Neural Network"], "cat": "AI", "exp": "擅長處理「空間結構」資料（影像）的深度學習模型。它用小濾波器在圖片上滑動，抓出邊緣、刮痕等局部特徵。工廠 AOI 瑕疵檢測最常用。", "vs": "CNN 看空間（影像）；RNN／LSTM 看時間（連續訊號）。", "days": [1, 6, 13]}, {"term": "RNN", "aliases": ["循環神經網路", "Recurrent Neural Network"], "cat": "AI", "exp": "擅長處理「時間序列」的深度學習模型：每一步的輸出同時參考現在的輸入和之前的狀態（有記憶）。例：看一連串震動值判斷設備健康。缺點是序列太長時前面的資訊會被遺忘（梯度消失）。", "days": [1, 6, 13]}, {"term": "LSTM", "aliases": ["長短期記憶", "Long Short-Term Memory"], "cat": "AI", "exp": "RNN 的改良版，加入「門控結構」決定哪些資訊要記住、哪些要忘掉，因此能處理更長的時間序列，例如長時間的電流趨勢。", "vs": "LSTM 與 GRU 都是有門控的 RNN；GRU 門比較少、結構較簡單。", "days": [1, 6, 13]}, {"term": "門控結構", "aliases": ["門控", "Gate", "閘門機制"], "cat": "AI", "exp": "LSTM／GRU 內部的「小開關」，用數值 0～1 控制資訊要通過多少：遺忘門決定丟掉舊記憶、輸入門決定寫入新資訊、輸出門決定輸出多少。目的是改善 RNN 長序列記不住的問題。", "days": [1]}, {"term": "梯度消失", "aliases": ["Vanishing Gradient"], "cat": "AI", "exp": "訓練深層或很長的網路時，用來調整權重的「梯度」一路往前傳會越乘越小，最後前面幾層幾乎學不到東西。這是一般 RNN 記不住長序列的原因，LSTM／GRU 用門控結構改善。", "days": []}, {"term": "GRU", "aliases": ["門控循環單元", "Gated Recurrent Unit"], "cat": "AI", "exp": "另一種有門控結構的 RNN 改良版，概念與 LSTM 類似但門比較少、運算較輕。考試重點仍在 RNN／LSTM，知道 GRU 屬同一家族即可。", "days": []}, {"term": "梯度", "aliases": ["Gradient"], "cat": "AI", "exp": "訓練模型時，告訴我們「權重往哪個方向調、調多少，誤差會變小」的數值。聯合學習上傳的就是權重或梯度這類模型更新，而不是原始資料。", "days": [1]}, {"term": "權重", "aliases": ["Weight"], "cat": "AI", "exp": "類神經網路中每條連線的係數，也就是模型「學到的知識」。訓練＝反覆調整權重；量化就是把權重從 32 位元浮點數改成 8 位元整數來縮小模型。", "days": [1, 6, 9]}, {"term": "反向傳播", "aliases": ["Backpropagation"], "cat": "AI", "exp": "訓練類神經網路的核心演算法：先算出輸出的誤差，再從最後一層往前一層層計算每個權重該怎麼調整。需要大量浮點運算，所以訓練多在雲端 GPU 進行，而不是在 NPU 上。", "days": [1, 6]}, {"term": "GAN", "aliases": ["生成對抗網路", "Generative Adversarial Network"], "cat": "AI", "exp": "由「生成器」與「判別器」互相對抗訓練的模型，主要用途是「生成新的資料」，例如產生逼真的瑕疵影像來擴充訓練資料。", "days": [1, 6, 13]}, {"term": "隨機森林", "aliases": ["Random Forest"], "cat": "AI", "exp": "由很多棵決策樹投票的傳統機器學習方法，常用於分類與迴歸。它不是深度學習（沒有多層類神經網路）。", "days": [1, 6]}, {"term": "模型訓練", "aliases": ["Model Training"], "cat": "AI", "exp": "用大量資料反覆調整模型權重，讓它學會規律的過程。很吃算力，通常在雲端或 GPU 工作站做，資料會切成訓練集、驗證集、測試集。", "vs": "訓練＝學習（重、在雲端）；推論＝考試作答（輕、可在邊緣）。", "days": [1, 6, 8]}, {"term": "推論", "aliases": ["Inference", "模型推論"], "cat": "AI", "exp": "把訓練好的模型拿來「對新資料做判斷」，例如攝影機拍到一張新照片，模型判斷有沒有瑕疵。運算量比訓練小很多，可以放在邊緣裝置或 NPU 上即時執行。", "days": [1, 6, 8, 13]}, {"term": "訓練集", "aliases": ["驗證集", "測試集", "Training Set"], "cat": "AI", "exp": "資料通常切三份：訓練集用來學、驗證集用來調參數與挑模型、測試集留到最後評估真實表現。就像課本練習、模擬考、正式考試要分開。", "days": [1]}, {"term": "資料前處理", "aliases": ["Data Preprocessing", "訊號調理", "Signal Conditioning"], "cat": "AI", "exp": "把原始資料整理乾淨再給模型：濾波去雜訊、處理異常值、正規化、對齊取樣率等。硬體上的「訊號調理」則指放大、濾波等讓感測訊號適合 ADC 讀取的電路。", "days": [1, 8, 12]}, {"term": "正規化", "aliases": ["Normalization"], "cat": "AI", "exp": "這個詞在本講義有兩種意思：① AI 資料前處理：把不同範圍的數值縮放到相近尺度（例如都變成 0～1），讓模型好學；② 資料庫設計：把資料表拆分以減少重複與更新異常（1NF、2NF、3NF）。看上下文判斷。", "days": [1, 10, 12]}, {"term": "模型壓縮", "aliases": ["Model Compression", "輕量化"], "cat": "AI", "exp": "把訓練好的大模型變小、變快，才能放進 MCU、邊緣閘道器等資源有限的裝置。常見方法是量化與剪枝。增加網路層數不是壓縮，反而更重。", "days": [1, 7]}, {"term": "量化", "aliases": ["Quantization"], "cat": "AI", "exp": "把模型參數從 32 位元浮點數（FP32）改成 8 位元整數（INT8）等較低精度表示，模型檔案與記憶體大約縮小到 1/4，執行更快更省電，精確度略降。", "vs": "AI 的「量化」是降低模型數字精度；ADC 的「量化」是把類比電壓切成數位階數，兩者是不同層面的事。", "days": [1, 6, 13]}, {"term": "剪枝", "aliases": ["Pruning"], "cat": "AI", "exp": "把模型中影響很小的連線或神經元剪掉，讓模型變小變快，就像修剪樹枝。與量化並列為常見的模型壓縮方法。", "days": [1, 13]}, {"term": "INT8", "aliases": ["FP32", "8 位元整數"], "cat": "AI", "exp": "FP32＝32 位元浮點數，精確但占空間；INT8＝8 位元整數，只有 256 種值但小又快。量化通常就是 FP32 → INT8，NPU 特別擅長跑 INT8 模型。", "days": [1, 6, 13]}, {"term": "模型格式", "aliases": ["Model Format"], "cat": "AI", "exp": "模型結構與權重存成檔案的格式，例如 ONNX、TensorFlow、PyTorch 的格式。AIoT 工程師關心的是能否穩定部署到不同硬體、方便轉換與更新版本。", "days": [1]}, {"term": "ONNX", "aliases": ["Open Neural Network Exchange"], "cat": "AI", "exp": "開放的模型交換格式，讓不同框架訓練出的模型可以轉成同一種格式，再部署到各家硬體的推論引擎上，像是 AI 模型界的「通用檔案格式」。", "days": [1]}, {"term": "TensorFlow", "aliases": ["PyTorch"], "cat": "AI", "exp": "TensorFlow 與 PyTorch 是兩個最常見的深度學習開發框架（寫程式訓練模型的工具），各有自己的模型存檔格式。", "days": [1]}, {"term": "推論引擎", "aliases": ["Inference Engine"], "cat": "AI", "exp": "在實際硬體上「執行模型」的軟體元件，負責把模型運算對應到 CPU、GPU 或 NPU 等加速器，確保推論夠快、夠即時。", "days": [1]}, {"term": "生成式 AI", "aliases": ["GenAI", "Generative AI"], "cat": "AI", "exp": "能「產生新內容」（文字、圖片、摘要）的 AI，例如聊天機器人。在 AIoT 中適合做告警說明、狀態摘要、操作建議等決策輔助，不直接控制設備。", "days": [1]}, {"term": "SLM", "aliases": ["小型語言模型", "Small Language Model"], "cat": "AI", "exp": "參數量較小、可以在邊緣裝置上執行的語言模型。用途是把推論結果轉成人看得懂的摘要與建議，補強人機互動，而不是取代感測與預測模型，也不直接介入控制邏輯。", "days": [1]}, {"term": "TinyML", "aliases": ["微型機器學習"], "cat": "AI", "exp": "把機器學習模型壓縮到能在 MCU 這類極低功耗、只有 KB 級記憶體的小晶片上執行推論的做法。例：ESP32 等級的晶片直接聽聲音判斷馬達異常，不用連雲端。概念上就是「Edge AI 做到最小的裝置上」。", "days": []}, {"term": "邊緣運算", "aliases": ["Edge Computing", "邊緣端"], "cat": "AI", "exp": "把運算放在「靠近資料產生的地方」（設備旁的閘道器、工業電腦），而不是全部丟到遠端雲端。好處是延遲低、省頻寬、資料不必離開現場。", "vs": "邊緣＝靠近現場；雲端＝遠端資料中心。邊緣運算不是「移到雲端」。", "days": [1, 2, 6, 7, 8, 9, 12, 13]}, {"term": "Edge AI", "aliases": ["邊緣 AI", "邊緣推論", "Edge Inference"], "cat": "AI", "exp": "在邊緣裝置上直接執行 AI 推論，只把結果或特徵上傳。三大理由：低延遲（即時告警）、省頻寬（不傳整段影像）、隱私（敏感影像留在現場）。", "days": [1, 2, 8, 13]}, {"term": "邊緣裝置", "aliases": ["Edge Device"], "cat": "AI", "exp": "位在現場、靠近感測器的運算設備，例如邊緣閘道器、工業電腦、AI 攝影機、帶 NPU 的開發板。", "days": [1, 6, 13]}, {"term": "延遲", "aliases": ["Latency"], "cat": "網路通訊", "exp": "資料從送出到收到（或下指令到動作）所花的時間。安全告警、機器手臂控制都需要很低的延遲，這是把運算放在邊緣的重要原因。", "vs": "延遲是「多快到」；頻寬是「一次能送多少」。", "days": [1, 2, 3, 4, 5, 6, 7, 8, 9, 12, 13]}, {"term": "頻寬", "aliases": ["Bandwidth"], "cat": "網路通訊", "exp": "傳輸管道每秒能送多少資料（例如 100 Mbps），像水管的粗細。另一個意思是訊號最高與最低頻率的差（單位 Hz）。影像串流很吃頻寬。", "days": [1, 2, 3, 5, 6, 7, 8, 9, 10, 12, 13]}, {"term": "端雲協作", "aliases": ["Edge–Cloud Collaboration", "邊雲協作"], "cat": "AI", "exp": "雲端和邊緣分工合作的架構，典型是「訓練在雲端、推論在邊緣」：雲端用大量歷史資料訓練並更新模型，邊緣負責即時判斷，網路斷了也能運作。", "days": [1, 6, 13]}, {"term": "聯合學習", "aliases": ["Federated Learning", "FL", "聯邦學習"], "cat": "AI", "exp": "各工廠或裝置用自己的資料在本地訓練，只把「模型更新參數」上傳雲端合併，原始資料不離開本地。適合醫療、跨公司製造等資料敏感的場合。", "days": [1, 6, 13]}, {"term": "CPU", "aliases": ["中央處理器", "Central Processing Unit"], "cat": "硬體", "exp": "電腦的「大腦」，什麼都能算，擅長依序處理各種指令、跑作業系統與 I/O。只用 CPU 跑 AI 常常太慢或太耗電，所以會搭配加速器。", "vs": "CPU 是一個運算核心；MCU 是把 CPU＋記憶體＋I/O 做在同一顆晶片上的小系統；MPU 是強力處理器但要外接記憶體。", "days": [1, 6, 8, 9, 12]}, {"term": "GPU", "aliases": ["圖形處理器", "Graphics Processing Unit"], "cat": "硬體", "exp": "原本用來畫圖的晶片，有大量小核心可同時平行運算，很適合 AI 訓練與多路影像分析。缺點是功耗高，多用在雲端、工作站或工業電腦。", "vs": "GPU＝力氣大吃電多（訓練、推論都可）；NPU＝推論專用超省電；FPGA＝可改線路、低延遲但開發難。", "days": [1, 6, 12, 13]}, {"term": "NPU", "aliases": ["神經網路處理器", "Neural Processing Unit"], "cat": "硬體", "exp": "專為深度學習「推論」設計的晶片（常做成 ASIC），針對矩陣與卷積運算最佳化，低功耗、擅長跑 INT8 量化模
