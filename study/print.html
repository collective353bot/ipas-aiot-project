。依講義的 MQTT／HTTP／CoAP 比較表，這兩項需求最典型對應哪一種協定？", "ans": 0, "id": "d3c1", "n": 1, "stemH": "某閘道器每季需要從伺服器下載一個約 2 MB 的韌體更新檔，同時也提供一個給工程師用瀏覽器查看設定的 Web 介面。依講義的 MQTT／HTTP／CoAP 比較表，這兩項需求最典型對應哪一種協定？", "optsH": ["HTTP/HTTPS", "CoAP", "MQTT QoS 0", "Modbus RTU"], "expH": "比較表中 <span class=\"gl\" data-g=\"106\" tabindex=\"0\" role=\"button\">HTTP<\/span>/<span class=\"gl\" data-g=\"107\" tabindex=\"0\" role=\"button\">HTTPS<\/span> 的適用場景是「<span class=\"gl\" data-g=\"299\" tabindex=\"0\" role=\"button\">韌體<\/span>更新、影像傳輸、Web 介面」；它<span class=\"gl\" data-g=\"116\" tabindex=\"0\" role=\"button\">標頭<\/span>大、需<span class=\"gl\" data-g=\"185\" tabindex=\"0\" role=\"button\">輪詢<\/span>，不適合高頻小量即時資料，但大型檔案與網頁正是它的強項。<span class=\"gl\" data-g=\"173\" tabindex=\"0\" role=\"button\">CoAP<\/span> 適合極低功耗<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>；<span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span> 適合大規模即時推播；<span class=\"gl\" data-g=\"194\" tabindex=\"0\" role=\"button\">Modbus RTU<\/span> 是工業<span class=\"gl\" data-g=\"369\" tabindex=\"0\" role=\"button\">串列<\/span>協定。"}, {"ref": "考科一 2.3", "opts": ["Device", "Adapter", "Agent", "Application"], "exp": "Adapter（適配器）負責存取設備資料並轉成 XML，不同控制器用不同函式庫（如發那科用 FOCAS）。Agent 是整合多個 Adapter、以 HTTP RESTful API 對外提供的核心；Device 是實體機器；Application 用資料做分析。", "stem": "某工廠想導入 MTConnect 收集多台發那科（FANUC）CNC 的狀態。在 Device → Adapter → Agent → Application 的資料流中，負責「直接存取控制器資料（例如透過 FOCAS 函式庫），並轉換成 XML 格式」的是哪一個元素？", "ans": 1, "id": "d3c2", "n": 2, "stemH": "某工廠想導入 MTConnect 收集多台發那科（FANUC）CNC 的狀態。在 Device → Adapter → Agent → Application 的資料流中，負責「直接存取控制器資料（例如透過 FOCAS 函式庫），並轉換成 XML 格式」的是哪一個元素？", "optsH": ["Device", "Adapter", "Agent", "Application"], "expH": "Adapter（適配器）負責存取設備資料並轉成 <span class=\"gl\" data-g=\"213\" tabindex=\"0\" role=\"button\">XML<\/span>，不同控制器用不同函式庫（如發那科用 FOCAS）。<span class=\"gl\" data-g=\"8\" tabindex=\"0\" role=\"button\">Agent<\/span> 是整合多個 Adapter、以 <span class=\"gl\" data-g=\"106\" tabindex=\"0\" role=\"button\">HTTP<\/span> <span class=\"gl\" data-g=\"186\" tabindex=\"0\" role=\"button\">RESTful API<\/span> 對外提供的核心；Device 是實體機器；Application 用資料做分析。"}, {"ref": "考科一 2.3", "opts": ["Keep Alive：用戶端定期送訊息，Broker 超過約定時間的倍數沒收到封包就判定斷線", "保留訊息（Retained Message）", "把 QoS 設為 0", "Topic 使用 # 萬用字元"], "exp": "Keep Alive 讓客戶端定期送訊息維持連線，Broker 逾時沒收到就斷線，這是偵測非正常斷線的基礎（偵測到之後，若有設定 LWT 才會代發遺囑）。保留訊息是給新訂閱者最新值；QoS 0 是送達等級；# 是訂閱萬用字元。", "stem": "MQTT Broker 需要在裝置「沒有正常斷線、突然消失」時察覺它已離線。下列哪一個機制是讓 Broker 能「偵測」到這種斷線的基礎？", "ans": 0, "id": "d3c3", "n": 3, "stemH": "MQTT Broker 需要在裝置「沒有正常斷線、突然消失」時察覺它已離線。下列哪一個機制是讓 Broker 能「偵測」到這種斷線的基礎？", "optsH": ["Keep Alive：用戶端定期送訊息，Broker 超過約定時間的倍數沒收到封包就判定斷線", "保留訊息（Retained Message）", "把 QoS 設為 0", "Topic 使用 # 萬用字元"], "expH": "<span class=\"gl\" data-g=\"179\" tabindex=\"0\" role=\"button\">Keep Alive<\/span> 讓客戶端定期送訊息維持連線，<span class=\"gl\" data-g=\"176\" tabindex=\"0\" role=\"button\">Broker<\/span> 逾時沒收到就斷線，這是偵測非正常斷線的基礎（偵測到之後，若有設定 <span class=\"gl\" data-g=\"180\" tabindex=\"0\" role=\"button\">LWT<\/span> 才會代發遺囑）。<span class=\"gl\" data-g=\"181\" tabindex=\"0\" role=\"button\">保留訊息<\/span>是給新訂閱者最新值；<span class=\"gl\" data-g=\"178\" tabindex=\"0\" role=\"button\">QoS<\/span> 0 是送達等級；# 是訂閱萬用字元。"}, {"ref": "考科一 2.3", "opts": ["Modbus RTU，使用 CRC", "Modbus ASCII，使用 LRC", "Modbus TCP，使用 CRC", "Modbus ASCII，不需要任何錯誤檢查"], "exp": "Modbus ASCII 以 ASCII 字元編碼，可讀性好、效率較低，錯誤檢查用 LRC；RTU 是二進制、效率高，用 CRC；Modbus TCP 走乙太網路，錯誤檢查由 TCP 負責。", "stem": "現場工程師希望 Modbus 串列通訊的封包內容「人眼就能直接看懂」，方便除錯，可接受效率較低。應選哪一種模式？它使用哪一種錯誤檢查？", "ans": 1, "id": "d3c4", "n": 4, "stemH": "現場工程師希望 Modbus 串列通訊的封包內容「人眼就能直接看懂」，方便除錯，可接受效率較低。應選哪一種模式？它使用哪一種錯誤檢查？", "optsH": ["Modbus RTU，使用 CRC", "Modbus ASCII，使用 LRC", "Modbus TCP，使用 CRC", "Modbus ASCII，不需要任何錯誤檢查"], "expH": "<span class=\"gl\" data-g=\"195\" tabindex=\"0\" role=\"button\">Modbus ASCII<\/span> 以 <span class=\"gl\" data-g=\"217\" tabindex=\"0\" role=\"button\">ASCII<\/span> 字元編碼，可讀性好、效率較低，錯誤檢查用 <span class=\"gl\" data-g=\"200\" tabindex=\"0\" role=\"button\">LRC<\/span>；RTU 是二進制、效率高，用 <span class=\"gl\" data-g=\"199\" tabindex=\"0\" role=\"button\">CRC<\/span>；<span class=\"gl\" data-g=\"196\" tabindex=\"0\" role=\"button\">Modbus TCP<\/span> 走<span class=\"gl\" data-g=\"120\" tabindex=\"0\" role=\"button\">乙太網路<\/span>，錯誤檢查由 <span class=\"gl\" data-g=\"100\" tabindex=\"0\" role=\"button\">TCP<\/span> 負責。"}], "lecture": "<h3>今天要搞懂的 5 件事<\/h3>\n<ol>\n<li><span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span>、<span class=\"gl\" data-g=\"106\" tabindex=\"0\" role=\"button\">HTTP<\/span>、<span class=\"gl\" data-g=\"173\" tabindex=\"0\" role=\"button\">CoAP<\/span> 的底層協定、通訊模式、<span class=\"gl\" data-g=\"116\" tabindex=\"0\" role=\"button\">標頭<\/span>大小與適用場景。<\/li>\n<li>MQTT 三角色、<span class=\"gl\" data-g=\"177\" tabindex=\"0\" role=\"button\">Topic<\/span>、<span class=\"gl\" data-g=\"178\" tabindex=\"0\" role=\"button\">QoS<\/span> 0/1/2、<span class=\"gl\" data-g=\"179\" tabindex=\"0\" role=\"button\">Keep Alive<\/span>、<span class=\"gl\" data-g=\"180\" tabindex=\"0\" role=\"button\">LWT<\/span>、<span class=\"gl\" data-g=\"181\" tabindex=\"0\" role=\"button\">Retained Message<\/span>、<span class=\"gl\" data-g=\"182\" tabindex=\"0\" role=\"button\">TLS<\/span>。<\/li>\n<li><span class=\"gl\" data-g=\"115\" tabindex=\"0\" role=\"button\">封裝<\/span>與解封裝；<span class=\"gl\" data-g=\"100\" tabindex=\"0\" role=\"button\">TCP<\/span> vs. <span class=\"gl\" data-g=\"101\" tabindex=\"0\" role=\"button\">UDP<\/span>。<\/li>\n<li><span class=\"gl\" data-g=\"209\" tabindex=\"0\" role=\"button\">OPC UA<\/span> 特性與四種資料存取方式；<span class=\"gl\" data-g=\"212\" tabindex=\"0\" role=\"button\">MTConnect<\/span> 四元素與「唯讀、<span class=\"gl\" data-g=\"213\" tabindex=\"0\" role=\"button\">XML<\/span>、HTTP」。<\/li>\n<li><span class=\"gl\" data-g=\"194\" tabindex=\"0\" role=\"button\">Modbus RTU<\/span>／<span class=\"gl\" data-g=\"217\" tabindex=\"0\" role=\"button\">ASCII<\/span>／TCP 與四種資料區塊；<span class=\"gl\" data-g=\"186\" tabindex=\"0\" role=\"button\">RESTful API<\/span> 方法與<span class=\"gl\" data-g=\"190\" tabindex=\"0\" role=\"button\">狀態碼<\/span>。<\/li>\n<\/ol>\n<h2>1. 為什麼 IoT 需要輕量協定 <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-40<\/span><\/h2>\n<p>連上網（<span class=\"gl\" data-g=\"131\" tabindex=\"0\" role=\"button\">Wi-Fi<\/span>、<span class=\"gl\" data-g=\"162\" tabindex=\"0\" role=\"button\">5G<\/span>、<span class=\"gl\" data-g=\"157\" tabindex=\"0\" role=\"button\">LoRa<\/span>）之後，下一個問題是「<strong>數據如何被<span class=\"gl\" data-g=\"115\" tabindex=\"0\" role=\"button\">封裝<\/span>與交換<\/strong>」。<span class=\"gl\" data-g=\"106\" tabindex=\"0\" role=\"button\">HTTP<\/span> 為網頁設計，在硬體資源受限、網路不穩的 <span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">IoT<\/span> 環境顯得笨重，因此出現 <span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span>、<span class=\"gl\" data-g=\"173\" tabindex=\"0\" role=\"button\">CoAP<\/span> 等輕量協定。<\/p>\n<h2>2. MQTT、HTTP、CoAP 三者比較 <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-40～4-42<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span><\/th>\n<th><span class=\"gl\" data-g=\"106\" tabindex=\"0\" role=\"button\">HTTP<\/span>/<span class=\"gl\" data-g=\"107\" tabindex=\"0\" role=\"button\">HTTPS<\/span><\/th>\n<th><span class=\"gl\" data-g=\"173\" tabindex=\"0\" role=\"button\">CoAP<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>底層<\/td>\n<td><strong><span class=\"gl\" data-g=\"100\" tabindex=\"0\" role=\"button\">TCP<\/span><\/strong>/<span class=\"gl\" data-g=\"103\" tabindex=\"0\" role=\"button\">IP<\/span><\/td>\n<td><span class=\"gl\" data-g=\"99\" tabindex=\"0\" role=\"button\">TCP/IP<\/span><\/td>\n<td><strong><span class=\"gl\" data-g=\"101\" tabindex=\"0\" role=\"button\">UDP<\/span><\/strong><\/td>\n<\/tr>\n<tr>\n<td>通訊模式<\/td>\n<td><strong><span class=\"gl\" data-g=\"174\" tabindex=\"0\" role=\"button\">發布/訂閱<\/span>（Pub/Sub）<\/strong>＋<span class=\"gl\" data-g=\"176\" tabindex=\"0\" role=\"button\">Broker<\/span><\/td>\n<td><span class=\"gl\" data-g=\"175\" tabindex=\"0\" role=\"button\">請求/回應<\/span>（Req/Res）<\/td>\n<td>請求/回應，支援 <span class=\"gl\" data-g=\"186\" tabindex=\"0\" role=\"button\">REST<\/span>（GET、POST、PUT、DELETE）<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"116\" tabindex=\"0\" role=\"button\">標頭<\/span><\/td>\n<td>極小（最小 <strong>2 Bytes<\/strong>）<\/td>\n<td>大（數百 Bytes）<\/td>\n<td>小（<strong>4 Bytes<\/strong>）<\/td>\n<\/tr>\n<tr>\n<td>即時性<\/td>\n<td>高（主動推播）<\/td>\n<td>低（需<span class=\"gl\" data-g=\"185\" tabindex=\"0\" role=\"button\">輪詢<\/span> Polling）<\/td>\n<td>中<\/td>\n<\/tr>\n<tr>\n<td>可靠性<\/td>\n<td><strong><span class=\"gl\" data-g=\"178\" tabindex=\"0\" role=\"button\">QoS<\/span> 機制<\/strong><\/td>\n<td>依賴 TCP 重傳<\/td>\n<td>內建確認機制<\/td>\n<\/tr>\n<tr>\n<td>適用<\/td>\n<td>大規模感測網、即時控制、行動裝置<\/td>\n<td><span class=\"gl\" data-g=\"299\" tabindex=\"0\" role=\"button\">韌體<\/span>更新、影像傳輸、Web 介面<\/td>\n<td>極低功耗<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>、<span class=\"gl\" data-g=\"156\" tabindex=\"0\" role=\"button\">NB-IoT<\/span> 設備、智慧電表<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>MQTT：IBM 於 <strong>1999 年<\/strong>為監控輸油管線開發，強調低<span class=\"gl\" data-g=\"48\" tabindex=\"0\" role=\"button\">頻寬<\/span>、低硬體需求、網路不穩時的可靠性。<\/li>\n<li>HTTP：伺服器<strong>無法主動推播<\/strong>給裝置（除非 <span class=\"gl\" data-g=\"184\" tabindex=\"0\" role=\"button\">WebSocket<\/span> 或 Long-polling）。<\/li>\n<li>CoAP：「輕量版 HTTP」；走 UDP <strong>不需維持長連線（Keep-alive）<\/strong>，喚醒時間更短。<strong>CoAP 沒有 QUERY 這種請求方法<\/strong>（p.4-45）。<\/li>\n<\/ul>\n<p><span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-43～4-46 練習題<\/span> <strong>WebSocket<\/strong>：建立後可<strong>雙向即時通訊<\/strong>，適合視訊通話、即時監看；指引練習題認為 HTTP 在 server 回應後會斷線，而 Socket、WebSocket、<span class=\"gl\" data-g=\"108\" tabindex=\"0\" role=\"button\">FTP<\/span> 不會。<\/p>\n<blockquote>\n<p><strong>⚠️ 標註<\/strong>：「HTTP 回應後即斷線」是 HTTP/1.0 的預設行為；HTTP/1.1 預設持久連線（keep-alive）。考試遇到此題型<strong>依指引答 HTTP<\/strong>。<\/p>\n<\/blockquote>\n<div class=\"cp\" id=\"cp_d3c1\" data-ans=\"0\"><div class=\"cph\">🧩 隨堂小測 1<span class=\"ref\">考科一 2.2<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">某閘道器每季需要從伺服器下載一個約 2 MB 的韌體更新檔，同時也提供一個給工程師用瀏覽器查看設定的 Web 介面。依講義的 MQTT／HTTP／CoAP 比較表，這兩項需求最典型對應哪一種協定？<\/div><button class=\"opt cpo\" data-k=\"0\">A. HTTP/HTTPS<\/button><button class=\"opt cpo\" data-k=\"1\">B. CoAP<\/button><button class=\"opt cpo\" data-k=\"2\">C. MQTT QoS 0<\/button><button class=\"opt cpo\" data-k=\"3\">D. Modbus RTU<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div>比較表中 <span class=\"gl\" data-g=\"106\" tabindex=\"0\" role=\"button\">HTTP<\/span>/<span class=\"gl\" data-g=\"107\" tabindex=\"0\" role=\"button\">HTTPS<\/span> 的適用場景是「<span class=\"gl\" data-g=\"299\" tabindex=\"0\" role=\"button\">韌體<\/span>更新、影像傳輸、Web 介面」；它<span class=\"gl\" data-g=\"116\" tabindex=\"0\" role=\"button\">標頭<\/span>大、需<span class=\"gl\" data-g=\"185\" tabindex=\"0\" role=\"button\">輪詢<\/span>，不適合高頻小量即時資料，但大型檔案與網頁正是它的強項。<span class=\"gl\" data-g=\"173\" tabindex=\"0\" role=\"button\">CoAP<\/span> 適合極低功耗<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>；<span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span> 適合大規模即時推播；<span class=\"gl\" data-g=\"194\" tabindex=\"0\" role=\"button\">Modbus RTU<\/span> 是工業<span class=\"gl\" data-g=\"369\" tabindex=\"0\" role=\"button\">串列<\/span>協定。<\/div><\/div><\/div>\n<h2>3. 封裝與解封裝、網路五層 <span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-47～4-50<\/span><\/h2>\n<p>指引 4.3 節用 **<span class=\"gl\" data-g=\"99\" tabindex=\"0\" role=\"button\">TCP/IP 五層<\/span>（含實體層）**說明：<span class=\"gl\" data-g=\"95\" tabindex=\"0\" role=\"button\">應用層<\/span>、傳輸層、網際<span class=\"gl\" data-g=\"94\" tabindex=\"0\" role=\"button\">網路層<\/span>、資料連結層、實體層。<\/p>\n<ul>\n<li><strong><span class=\"gl\" data-g=\"115\" tabindex=\"0\" role=\"button\">封裝<\/span>（Encapsulation）<\/strong>：資料往下傳，<strong>每一層加上自己的<span class=\"gl\" data-g=\"116\" tabindex=\"0\" role=\"button\">標頭<\/span>（Header）<\/strong>。<\/li>\n<li><strong>解封裝（Decapsulation）<\/strong>：接收端往上傳，<strong>逐層移除標頭<\/strong>。<\/li>\n<li>資料連結層把<span class=\"gl\" data-g=\"113\" tabindex=\"0\" role=\"button\">封包<\/span>封成「<strong><span class=\"gl\" data-g=\"114\" tabindex=\"0\" role=\"button\">訊框<\/span>（Frame）<\/strong>」，以 <strong><span class=\"gl\" data-g=\"117\" tabindex=\"0\" role=\"button\">MAC 位址<\/span><\/strong>定址，常見設備是<strong><span class=\"gl\" data-g=\"118\" tabindex=\"0\" role=\"button\">交換器<\/span><\/strong>；實體層包含電纜、光纖、網路卡、<strong><span class=\"gl\" data-g=\"119\" tabindex=\"0\" role=\"button\">中繼器<\/span><\/strong>。<\/li>\n<\/ul>\n<p>以 <span class=\"gl\" data-g=\"193\" tabindex=\"0\" role=\"button\">Modbus<\/span> 為例（p.4-50）：應用程式要讀<span class=\"gl\" data-g=\"206\" tabindex=\"0\" role=\"button\">保持暫存器<\/span> → 函式庫轉成 <strong>Modbus <span class=\"gl\" data-g=\"197\" tabindex=\"0\" role=\"button\">PDU<\/span>（功能碼＋資料欄位）<\/strong> →\n- <strong><span class=\"gl\" data-g=\"196\" tabindex=\"0\" role=\"button\">Modbus TCP<\/span><\/strong>：加 <strong><span class=\"gl\" data-g=\"198\" tabindex=\"0\" role=\"button\">MBAP Header<\/span><\/strong>，再經 <span class=\"gl\" data-g=\"100\" tabindex=\"0\" role=\"button\">TCP<\/span>、<span class=\"gl\" data-g=\"103\" tabindex=\"0\" role=\"button\">IP<\/span> 送出；\n- <strong><span class=\"gl\" data-g=\"194\" tabindex=\"0\" role=\"button\">Modbus RTU<\/span>/<span class=\"gl\" data-g=\"217\" tabindex=\"0\" role=\"button\">ASCII<\/span><\/strong>：加<strong>裝置位址＋錯誤檢查碼（<span class=\"gl\" data-g=\"199\" tabindex=\"0\" role=\"button\">CRC<\/span> 或 <span class=\"gl\" data-g=\"200\" tabindex=\"0\" role=\"button\">LRC<\/span>）<\/strong>，成為<span class=\"gl\" data-g=\"369\" tabindex=\"0\" role=\"button\">串列<\/span>訊框，經 <strong><span class=\"gl\" data-g=\"201\" tabindex=\"0\" role=\"button\">RS-232<\/span>/<span class=\"gl\" data-g=\"202\" tabindex=\"0\" role=\"button\">RS-485<\/span><\/strong> 傳輸。\n接收端反向解封裝、驗證 CRC/LRC、解析 PDU 後執行，再用同樣流程回傳。<\/p>\n<h3>TCP vs. UDP <span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-48、p.4-69～4-71<\/span><\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>TCP<\/th>\n<th><span class=\"gl\" data-g=\"101\" tabindex=\"0\" role=\"button\">UDP<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>連線<\/td>\n<td><strong>連接導向<\/strong>（傳輸前<span class=\"gl\" data-g=\"102\" tabindex=\"0\" role=\"button\">三次握手<\/span>）<\/td>\n<td><strong>無連接<\/strong><\/td>\n<\/tr>\n<tr>\n<td>可靠性<\/td>\n<td>保證按順序、完整到達<\/td>\n<td>不保證可靠、順序、不重複<\/td>\n<\/tr>\n<tr>\n<td>速度<\/td>\n<td>較慢、開銷大<\/td>\n<td>快、即時性高<\/td>\n<\/tr>\n<tr>\n<td>適用<\/td>\n<td>檔案、郵件、網頁請求；<span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span>、Modbus TCP<\/td>\n<td>影音串流、即時應用；<span class=\"gl\" data-g=\"173\" tabindex=\"0\" role=\"button\">CoAP<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-69～4-71 練習題<\/span> 其他練習題常考：<strong><span class=\"gl\" data-g=\"121\" tabindex=\"0\" role=\"button\">LAN<\/span><\/strong> 是小範圍（一棟或一組建築物）的網路；<strong><span class=\"gl\" data-g=\"104\" tabindex=\"0\" role=\"button\">IPv4<\/span><\/strong> 由 4 組 0–255 的數字以「.」分隔（如 192.168.0.1）。<\/p>\n<h2>4. 為什麼工廠要從 Modbus 走向 OPC UA <span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-51<\/span><\/h2>\n<p>早期產線自動化低，傳統工控普遍用 <strong><span class=\"gl\" data-g=\"193\" tabindex=\"0\" role=\"button\">Modbus<\/span><\/strong>：簡單可靠，但<strong>設計時沒考慮資安<\/strong>，沒有加密與身分驗證。現代製造要小批量、多樣化、安全的資料交換，因此導入 <strong><span class=\"gl\" data-g=\"209\" tabindex=\"0\" role=\"button\">OPC UA<\/span><\/strong> 這類提供<strong>加密、身分驗證與授權<\/strong>的進階協定。<\/p>\n<h2>5. OPC UA <span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-51～4-56<\/span><\/h2>\n<p>由 **OPC 基金會（OPC Foundation）**開發，跨平台、開放、統一，被視為<span class=\"gl\" data-g=\"88\" tabindex=\"0\" role=\"button\">工業 4.0<\/span> 關鍵標準。<\/p>\n<p>主要特性：\n1. <strong>平台獨立<\/strong>：不依賴特定 <span class=\"gl\" data-g=\"436\" tabindex=\"0\" role=\"button\">OS<\/span> 或硬體，從嵌入式 <span class=\"gl\" data-g=\"57\" tabindex=\"0\" role=\"button\">MCU<\/span> 到<span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>都能實作（不是只限 Windows）。\n2. <strong>內建多層次安全<\/strong>：認證、授權、資料<span class=\"gl\" data-g=\"267\" tabindex=\"0\" role=\"button\">完整性<\/span>、加密通訊。\n3. <strong>可擴展的服務與資料模型（<span class=\"gl\" data-g=\"210\" tabindex=\"0\" role=\"button\">資訊模型<\/span>）<\/strong>。\n4. 多語言實作：C++、C#、Java、Python。\n5. <strong><span class=\"gl\" data-g=\"207\" tabindex=\"0\" role=\"button\">Client/Server<\/span> 架構<\/strong>：Server 通常在設備端，收集控制器與<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>資料並轉成標準格式；Client 向 Server 要資料。\n6. 把各廠牌設備存取函式庫<span class=\"gl\" data-g=\"115\" tabindex=\"0\" role=\"button\">封裝<\/span>在 <span class=\"gl\" data-g=\"209\" tabindex=\"0\" role=\"button\">OPC UA<\/span> Server，形成<strong>設備聯網<span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span>平台<\/strong>，對外提供統一存取方式。\n7. 促進<strong>水平與垂直整合<\/strong>：設備 → <span class=\"gl\" data-g=\"66\" tabindex=\"0\" role=\"button\">MES<\/span> → <span class=\"gl\" data-g=\"67\" tabindex=\"0\" role=\"button\">ERP<\/span> 的無縫資料流。<\/p>\n<p><strong>四種資料存取方式（必考）<\/strong>：<\/p>\n<table>\n<thead>\n<tr>\n<th>方式<\/th>\n<th>白話<\/th>\n<th>例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>讀/寫 Read/Write<\/td>\n<td>主動讀變數或寫新值<\/td>\n<td>讀產品重量；寫入新的進給率<\/td>\n<\/tr>\n<tr>\n<td>資料變更通知 Data Change Notification<\/td>\n<td><strong>訂閱變數<\/strong>，值改變時伺服器通知<\/td>\n<td>訂閱刀具壽命、機器溫度超過閾值<\/td>\n<\/tr>\n<tr>\n<td>方法 Method<\/td>\n<td>遠端呼叫伺服器提供的方法<\/td>\n<td>遠端觸發自動換刀程序<\/td>\n<\/tr>\n<tr>\n<td>事件通知 Event Notification<\/td>\n<td><strong>訂閱事件<\/strong>，被動接收事件通知<\/td>\n<td>緊急停機、機器手臂故障、系統日誌<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.5-26～5-27 練習題<\/span> OPC UA 資訊模型（Information Model）中 <strong><span class=\"gl\" data-g=\"211\" tabindex=\"0\" role=\"button\">NodeId<\/span> 不能重複<\/strong>；指引練習題解析認為 OPC UA 對應到 <strong><span class=\"gl\" data-g=\"98\" tabindex=\"0\" role=\"button\">OSI<\/span> 第 7 層（<span class=\"gl\" data-g=\"95\" tabindex=\"0\" role=\"button\">應用層<\/span>）<\/strong>。<\/p>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：「Data Change」訂閱的是<strong>變數值的變化<\/strong>；「Event」訂閱的是<strong>事件（故障、警報）<\/strong>。題目說「訂閱特定事件、被動接收通知」→ Event Notification。<\/p>\n<\/blockquote>\n<h2>6. MTConnect <span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-56～4-59<\/span><\/h2>\n<p>專為製造業（特別是<strong>工具機<\/strong>）設計的開放標準，定義一組<strong>標準設備參數名稱<\/strong>描述設備效能與即時狀態。三個關鍵字：<strong>唯讀（Read-only，只讀不寫指令）、<span class=\"gl\" data-g=\"213\" tabindex=\"0\" role=\"button\">XML<\/span>、<span class=\"gl\" data-g=\"106\" tabindex=\"0\" role=\"button\">HTTP<\/span><\/strong>。<\/p>\n<p>特性：開放源碼且<strong>免授權費（royalty-free）<\/strong>、可擴展（基於 XML）、互操作性、可讀性（XML 人與機器都好讀）。應用：生產監控、<span class=\"gl\" data-g=\"74\" tabindex=\"0\" role=\"button\">預測性維護<\/span>、數據分析與優化。<\/p>\n<p><strong>四元素資料流<\/strong>：<\/p>\n<table>\n<thead>\n<tr>\n<th>元素<\/th>\n<th>角色<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>設備 Device<\/td>\n<td>實體機器：<span class=\"gl\" data-g=\"214\" tabindex=\"0\" role=\"button\">CNC<\/span>、機器人、檢測儀；產生運行狀態、主軸轉速、進給速度等參數<\/td>\n<\/tr>\n<tr>\n<td>適配器 Adapter<\/td>\n<td><strong>存取設備資料並轉成 XML<\/strong>；不同控制器用不同函式庫（如發那科用 FOCAS）<\/td>\n<\/tr>\n<tr>\n<td>代理器 <span class=\"gl\" data-g=\"8\" tabindex=\"0\" role=\"button\">Agent<\/span><\/td>\n<td><strong>核心<\/strong>；整合一或多個 Adapter 的資料，以標準 XML 儲存，透過 <strong>HTTP <span class=\"gl\" data-g=\"186\" tabindex=\"0\" role=\"button\">RESTful API<\/span><\/strong> 提供；負責緩存、格式化、傳輸<\/td>\n<\/tr>\n<tr>\n<td>應用程式 Application<\/td>\n<td>用 Agent 資料做分析、監控、效能評估、預測維護<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：<span class=\"gl\" data-g=\"209\" tabindex=\"0\" role=\"button\">OPC UA<\/span> 可讀可寫、<span class=\"gl\" data-g=\"207\" tabindex=\"0\" role=\"button\">Client/Server<\/span>、資安內建；<span class=\"gl\" data-g=\"212\" tabindex=\"0\" role=\"button\">MTConnect<\/span> <strong>唯讀<\/strong>、XML over HTTP、Device→Adapter→Agent→Application。<\/p>\n<\/blockquote>\n<div class=\"cp\" id=\"cp_d3c2\" data-ans=\"1\"><div class=\"cph\">🧩 隨堂小測 2<span class=\"ref\">考科一 2.3<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">某工廠想導入 MTConnect 收集多台發那科（FANUC）CNC 的狀態。在 Device → Adapter → Agent → Application 的資料流中，負責「直接存取控制器資料（例如透過 FOCAS 函式庫），並轉換成 XML 格式」的是哪一個元素？<\/div><button class=\"opt cpo\" data-k=\"0\">A. Device<\/button><button class=\"opt cpo\" data-k=\"1\">B. Adapter<\/button><button class=\"opt cpo\" data-k=\"2\">C. Agent<\/button><button class=\"opt cpo\" data-k=\"3\">D. Application<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div>Adapter（適配器）負責存取設備資料並轉成 <span class=\"gl\" data-g=\"213\" tabindex=\"0\" role=\"button\">XML<\/span>，不同控制器用不同函式庫（如發那科用 FOCAS）。<span class=\"gl\" data-g=\"8\" tabindex=\"0\" role=\"button\">Agent<\/span> 是整合多個 Adapter、以 <span class=\"gl\" data-g=\"106\" tabindex=\"0\" role=\"button\">HTTP<\/span> <span class=\"gl\" data-g=\"186\" tabindex=\"0\" role=\"button\">RESTful API<\/span> 對外提供的核心；Device 是實體機器；Application 用資料做分析。<\/div><\/div><\/div>\n<h2>7. MQTT 深入：角色、主題、機制 <span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-59～4-61<\/span><\/h2>\n<ul>\n<li>三角色：<strong>發布者（Publisher）<\/strong>、<strong>訂閱者（Subscriber）<\/strong>、<strong><span class=\"gl\" data-g=\"176\" tabindex=\"0\" role=\"button\">中介代理者<\/span>（Broker）<\/strong>；以<span class=\"gl\" data-g=\"372\" tabindex=\"0\" role=\"button\">非同步<\/span>方式傳輸。<\/li>\n<li>流程：發布者帶著**主題（<span class=\"gl\" data-g=\"177\" tabindex=\"0\" role=\"button\">Topic<\/span>）**把訊息送給 Broker → Broker 依主題過濾 → 推播給訂閱該主題的訂閱者。<\/li>\n<li>以 Client-Server 來看，<strong>發布者與訂閱者都是 Client<\/strong>，Broker 是 Server；發布者<strong>不知道<\/strong>有多少訂閱者。<\/li>\n<li><strong><span class=\"gl\" data-g=\"221\" tabindex=\"0\" role=\"button\">解耦<\/span>（Decoupled）<\/strong>：<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>故障，手機 App 不會掛；App 離線，感測器照樣送到 Broker。<\/li>\n<li>三個可靠性/安全機制：<\/li>\n<li><strong><span class=\"gl\" data-g=\"179\" tabindex=\"0\" role=\"button\">Keep Alive<\/span><\/strong>：客戶端定期送訊息維持連線，偵測斷線；Broker 在約定時間的特定倍數內沒收到<span class=\"gl\" data-g=\"113\" tabindex=\"0\" role=\"button\">封包<\/span>就斷線。<\/li>\n<li><strong><span class=\"gl\" data-g=\"180\" tabindex=\"0\" role=\"button\">遺囑<\/span> LWT（Last Will and Testament）<\/strong>：裝置<strong>非正常斷線<\/strong>（沒電、網路斷）時，Broker 代為發送預設的遺囑訊息通知大家。<\/li>\n<li><strong><span class=\"gl\" data-g=\"182\" tabindex=\"0\" role=\"button\">TLS/SSL<\/span><\/strong>：加密、身分驗證、訊息<span class=\"gl\" data-g=\"267\" tabindex=\"0\" role=\"button\">完整性<\/span>。<\/li>\n<li><span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-45 練習題<\/span> <strong><span class=\"gl\" data-g=\"181\" tabindex=\"0\" role=\"button\">保留訊息<\/span>（Retained Message）<\/strong>：發布者可要求 Broker 保留一份最新訊息，給<strong>新加入的訂閱者<\/strong>立刻收到。<\/li>\n<\/ul>\n<div class=\"cp\" id=\"cp_d3c3\" data-ans=\"0\"><div class=\"cph\">🧩 隨堂小測 3<span class=\"ref\">考科一 2.3<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">MQTT Broker 需要在裝置「沒有正常斷線、突然消失」時察覺它已離線。下列哪一個機制是讓 Broker 能「偵測」到這種斷線的基礎？<\/div><button class=\"opt cpo\" data-k=\"0\">A. Keep Alive：用戶端定期送訊息，Broker 超過約定時間的倍數沒收到封包就判定斷線<\/button><button class=\"opt cpo\" data-k=\"1\">B. 保留訊息（Retained Message）<\/button><button class=\"opt cpo\" data-k=\"2\">C. 把 QoS 設為 0<\/button><button class=\"opt cpo\" data-k=\"3\">D. Topic 使用 # 萬用字元<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div><span class=\"gl\" data-g=\"179\" tabindex=\"0\" role=\"button\">Keep Alive<\/span> 讓客戶端定期送訊息維持連線，<span class=\"gl\" data-g=\"176\" tabindex=\"0\" role=\"button\">Broker<\/span> 逾時沒收到就斷線，這是偵測非正常斷線的基礎（偵測到之後，若有設定 <span class=\"gl\" data-g=\"180\" tabindex=\"0\" role=\"button\">LWT<\/span> 才會代發遺囑）。<span class=\"gl\" data-g=\"181\" tabindex=\"0\" role=\"button\">保留訊息<\/span>是給新訂閱者最新值；<span class=\"gl\" data-g=\"178\" tabindex=\"0\" role=\"button\">QoS<\/span> 0 是送達等級；# 是訂閱萬用字元。<\/div><\/div><\/div>\n<h2>8. MQTT QoS 三等級（必考） <span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-61～4-62<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th><span class=\"gl\" data-g=\"178\" tabindex=\"0\" role=\"button\">QoS<\/span><\/th>\n<th>名稱<\/th>\n<th>保證<\/th>\n<th>代價<\/th>\n<th>適用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>最多一次 At most once<\/td>\n<td><strong>不確認、不重傳，可能遺失<\/strong><\/td>\n<td>最省<\/td>\n<td>不重要資料、網路良好<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>至少一次 At least once<\/td>\n<td>等確認，沒收到就重傳 → <strong>保證到達但可能重複<\/strong><\/td>\n<td>中<\/td>\n<td>接收方要能處理重複<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>恰好一次 Exactly once<\/td>\n<td><strong>四步驟握手<\/strong>，保證只收到一次、不重複<\/td>\n<td>最耗資源與時間<\/td>\n<td>關鍵訊息（如計費、控制指令）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 記法<\/strong>：0＝「丟了就算」、1＝「一定到，可能兩次」、2＝「剛剛好一次」。<strong>沒有 QoS 3<\/strong>。QoS 越高越可靠、開銷越大。<\/p>\n<\/blockquote>\n<h2>9. Modbus <span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-63～4-65<\/span><\/h2>\n<p>工業設備常用（<span class=\"gl\" data-g=\"68\" tabindex=\"0\" role=\"button\">PLC<\/span>、溫控器、伺服驅動器），格式簡單；可走<span class=\"gl\" data-g=\"369\" tabindex=\"0\" role=\"button\">串列<\/span>（<span class=\"gl\" data-g=\"201\" tabindex=\"0\" role=\"button\">RS-232<\/span>、<span class=\"gl\" data-g=\"202\" tabindex=\"0\" role=\"button\">RS-485<\/span>）或 <span class=\"gl\" data-g=\"99\" tabindex=\"0\" role=\"button\">TCP/IP<\/span>。<strong>不支援加密與身分驗證<\/strong>，在不受信任網路易被監聽、竄改、偽造。<strong><span class=\"gl\" data-g=\"196\" tabindex=\"0\" role=\"button\">Modbus TCP<\/span> 常用 502 埠<\/strong>。採<strong><span class=\"gl\" data-g=\"207\" tabindex=\"0\" role=\"button\">主從<\/span>（Master/Slave 或 Client/Server）架構<\/strong>。<\/p>\n<table>\n<thead>\n<tr>\n<th>模式<\/th>\n<th>編碼<\/th>\n<th>實體<\/th>\n<th>錯誤檢查<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"194\" tabindex=\"0\" role=\"button\">Modbus RTU<\/span><\/td>\n<td><strong>二進制<\/strong>，效率高<\/td>\n<td>RS-232／RS-485<\/td>\n<td><strong><span class=\"gl\" data-g=\"199\" tabindex=\"0\" role=\"button\">CRC<\/span><\/strong>（循環冗餘檢查）<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"195\" tabindex=\"0\" role=\"button\">Modbus ASCII<\/span><\/td>\n<td><strong><span class=\"gl\" data-g=\"217\" tabindex=\"0\" role=\"button\">ASCII<\/span><\/strong>，可讀性好<\/td>\n<td>RS-232／RS-485<\/td>\n<td><strong><span class=\"gl\" data-g=\"200\" tabindex=\"0\" role=\"button\">LRC<\/span><\/strong>（縱向冗餘檢查）<\/td>\n<\/tr>\n<tr>\n<td>Modbus TCP/IP<\/td>\n<td>TCP/IP <span class=\"gl\" data-g=\"115\" tabindex=\"0\" role=\"button\">封裝<\/span><\/td>\n<td><span class=\"gl\" data-g=\"120\" tabindex=\"0\" role=\"button\">乙太網路<\/span>、<span class=\"gl\" data-g=\"121\" tabindex=\"0\" role=\"button\">LAN<\/span><\/td>\n<td>由 <span class=\"gl\" data-g=\"100\" tabindex=\"0\" role=\"button\">TCP<\/span> 負責；通訊前要建立連線<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>四種資料區塊<\/strong>：<\/p>\n<table>\n<thead>\n<tr>\n<th>區塊<\/th>\n<th>型態<\/th>\n<th>讀寫<\/th>\n<th>位址範圍<\/th>\n<th>用途<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"203\" tabindex=\"0\" role=\"button\">Coil<\/span> 線圈<\/td>\n<td>位元（布林）<\/td>\n<td><strong>可讀可寫<\/strong><\/td>\n<td>00001–09999<\/td>\n<td>控制開/關、<span class=\"gl\" data-g=\"404\" tabindex=\"0\" role=\"button\">繼電器<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"204\" tabindex=\"0\" role=\"button\">Discrete Input<\/span> 離散輸入<\/td>\n<td>位元<\/td>\n<td><strong>唯讀<\/strong><\/td>\n<td>10001–19999<\/td>\n<td>顯示開關狀態<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"205\" tabindex=\"0\" role=\"button\">Input Register<\/span> 輸入暫存器<\/td>\n<td>16 位元字<\/td>\n<td><strong>唯讀<\/strong><\/td>\n<td>30001–39999<\/td>\n<td>讀溫度、壓力等類比值<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"206\" tabindex=\"0\" role=\"button\">Holding Register<\/span> 保持暫存器<\/td>\n<td>16 位元字<\/td>\n<td><strong>可讀可寫<\/strong><\/td>\n<td>40001–49999<\/td>\n<td><span class=\"gl\" data-g=\"399\" tabindex=\"0\" role=\"button\">類比輸出<\/span>、設定參數<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 記法<\/strong>：「0 線圈、1 離散、3 輸入、4 保持」；<strong>位元<\/strong>的是 Coil／Discrete，<strong>16 位元<\/strong>的是 Register；能寫的只有 <strong>Coil 與 Holding<\/strong>。<\/p>\n<\/blockquote>\n<div class=\"cp\" id=\"cp_d3c4\" data-ans=\"1\"><div class=\"cph\">🧩 隨堂小測 4<span class=\"ref\">考科一 2.3<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">現場工程師希望 Modbus 串列通訊的封包內容「人眼就能直接看懂」，方便除錯，可接受效率較低。應選哪一種模式？它使用哪一種錯誤檢查？<\/div><button class=\"opt cpo\" data-k=\"0\">A. Modbus RTU，使用 CRC<\/button><button class=\"opt cpo\" data-k=\"1\">B. Modbus ASCII，使用 LRC<\/button><button class=\"opt cpo\" data-k=\"2\">C. Modbus TCP，使用 CRC<\/button><button class=\"opt cpo\" data-k=\"3\">D. Modbus ASCII，不需要任何錯誤檢查<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div><span class=\"gl\" data-g=\"195\" tabindex=\"0\" role=\"button\">Modbus ASCII<\/span> 以 <span class=\"gl\" data-g=\"217\" tabindex=\"0\" role=\"button\">ASCII<\/span> 字元編碼，可讀性好、效率較低，錯誤檢查用 <span class=\"gl\" data-g=\"200\" tabindex=\"0\" role=\"button\">LRC<\/span>；RTU 是二進制、效率高，用 <span class=\"gl\" data-g=\"199\" tabindex=\"0\" role=\"button\">CRC<\/span>；<span class=\"gl\" data-g=\"196\" tabindex=\"0\" role=\"button\">Modbus TCP<\/span> 走<span class=\"gl\" data-g=\"120\" tabindex=\"0\" role=\"button\">乙太網路<\/span>，錯誤檢查由 <span class=\"gl\" data-g=\"100\" tabindex=\"0\" role=\"button\">TCP<\/span> 負責。<\/div><\/div><\/div>\n<h2>10. RESTful API <span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-65～4-68<\/span><\/h2>\n<p>基於 <span class=\"gl\" data-g=\"106\" tabindex=\"0\" role=\"button\">HTTP<\/span>，用 <strong><span class=\"gl\" data-g=\"188\" tabindex=\"0\" role=\"button\">URL<\/span> 當資源唯一識別（URI）<\/strong>，用 HTTP 方法做 <strong><span class=\"gl\" data-g=\"189\" tabindex=\"0\" role=\"button\">CRUD<\/span><\/strong>；特性：<strong>統一介面<\/strong>、<strong>客戶端/伺服器端分離<\/strong>。<\/p>\n<table>\n<thead>\n<tr>\n<th>方法<\/th>\n<th>用途<\/th>\n<th>常見成功碼<\/th>\n<th>常見錯誤碼<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>GET<\/td>\n<td>讀取（Read）<\/td>\n<td>200 OK<\/td>\n<td>404 Not Found<\/td>\n<\/tr>\n<tr>\n<td>POST<\/td>\n<td>建立（Create）<\/td>\n<td><strong>201 Created<\/strong><\/td>\n<td>400 Bad Request、409 Conflict<\/td>\n<\/tr>\n<tr>\n<td>PUT<\/td>\n<td>更新或在指定 URI 建立<\/td>\n<td>200 OK／201 Created<\/td>\n<td>404 Not Found<\/td>\n<\/tr>\n<tr>\n<td>DELETE<\/td>\n<td>刪除<\/td>\n<td><strong>204 No Content<\/strong><\/td>\n<td>403 Forbidden、404 Not Found<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>開發測試工具：<strong><span class=\"gl\" data-g=\"191\" tabindex=\"0\" role=\"button\">Mock Server<\/span><\/strong>（模擬後端，讓前後端平行開發，可模擬錯誤、<span class=\"gl\" data-g=\"47\" tabindex=\"0\" role=\"button\">延遲<\/span>、節流）、<strong><span class=\"gl\" data-g=\"192\" tabindex=\"0\" role=\"button\">Postman<\/span><\/strong>（模擬 Client，設定參數、<span class=\"gl\" data-g=\"116\" tabindex=\"0\" role=\"button\">標頭<\/span>、Body，看<span class=\"gl\" data-g=\"190\" tabindex=\"0\" role=\"button\">狀態碼<\/span>與回應時間、寫測試腳本）。<\/p>\n<h3>今日 30 秒回顧<\/h3>\n<p><span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span>＝<span class=\"gl\" data-g=\"100\" tabindex=\"0\" role=\"button\">TCP<\/span>＋<span class=\"gl\" data-g=\"174\" tabindex=\"0\" role=\"button\">Pub/Sub<\/span>＋2 Bytes＋<span class=\"gl\" data-g=\"178\" tabindex=\"0\" role=\"button\">QoS<\/span>；<span class=\"gl\" data-g=\"173\" tabindex=\"0\" role=\"button\">CoAP<\/span>＝<span class=\"gl\" data-g=\"101\" tabindex=\"0\" role=\"button\">UDP<\/span>＋<span class=\"gl\" data-g=\"186\" tabindex=\"0\" role=\"button\">REST<\/span>＋4 Bytes；HTTP 標頭大、要<span class=\"gl\" data-g=\"185\" tabindex=\"0\" role=\"button\">輪詢<\/span>｜<span class=\"gl\" data-g=\"115\" tabindex=\"0\" role=\"button\">封裝<\/span>加標頭、解封裝去標頭｜TCP 可靠、UDP 快｜<span class=\"gl\" data-g=\"209\" tabindex=\"0\" role=\"button\">OPC UA<\/span>：跨平台、內建資安、<span class=\"gl\" data-g=\"207\" tabindex=\"0\" role=\"button\">Client/Server<\/span>、讀寫/資料變更/方法/事件｜<span class=\"gl\" data-g=\"212\" tabindex=\"0\" role=\"button\">MTConnect<\/span>：唯讀、<span class=\"gl\" data-g=\"213\" tabindex=\"0\" role=\"button\">XML<\/span>、HTTP；Device→Adapter→<span class=\"gl\" data-g=\"8\" tabindex=\"0\" role=\"button\">Agent<\/span>→Application｜QoS 0 可能遺失、1 可能重複、2 恰好一次｜<span class=\"gl\" data-g=\"193\" tabindex=\"0\" role=\"button\">Modbus<\/span>：RTU-<span class=\"gl\" data-g=\"199\" tabindex=\"0\" role=\"button\">CRC<\/span>、<span class=\"gl\" data-g=\"217\" tabindex=\"0\" role=\"button\">ASCII<\/span>-<span class=\"gl\" data-g=\"200\" tabindex=\"0\" role=\"button\">LRC<\/span>、TCP-502；0/1/3/4｜REST：POST 201、DELETE 204。<\/p>", "audio": {"src": "audio/d03.mp3?v=2", "dur": 727}, "questions": [{"id": "d3q1", "n": 1, "opts": ["CoAP", "HTTP/HTTPS", "FTP", "SMTP"], "exp": "CoAP 是「輕量版 HTTP」，走 UDP、支援 REST 模型（GET、POST、PUT、DELETE），標頭約 4 Bytes，不需維持長連線，喚醒時間更短，適合 NB-IoT 設備與需數年電池壽命的感測器。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某電池供電的微型土壤感測器希望封包最小、喚醒時間最短，並且讓熟悉 HTTP 的工程師能用 GET/PUT 操作資源。最適合的協定是？", "ref": "考科一 2.2", "src": "指引 p.4-41～4-42", "ans": 0, "stemH": "某電池供電的微型土壤感測器希望封包最小、喚醒時間最短，並且讓熟悉 HTTP 的工程師能用 GET/PUT 操作資源。最適合的協定是？", "optsH": ["CoAP", "HTTP/HTTPS", "FTP", "SMTP"], "expH": "<span class=\"gl\" data-g=\"173\" tabindex=\"0\" role=\"button\">CoAP<\/span> 是「輕量版 <span class=\"gl\" data-g=\"106\" tabindex=\"0\" role=\"button\">HTTP<\/span>」，走 <span class=\"gl\" data-g=\"101\" tabindex=\"0\" role=\"button\">UDP<\/span>、支援 <span class=\"gl\" data-g=\"186\" tabindex=\"0\" role=\"button\">REST<\/span> 模型（GET、POST、PUT、DELETE），<span class=\"gl\" data-g=\"116\" tabindex=\"0\" role=\"button\">標頭<\/span>約 4 Bytes，不需維持長連線，喚醒時間更短，適合 <span class=\"gl\" data-g=\"156\" tabindex=\"0\" role=\"button\">NB-IoT<\/span> 設備與需數年電池壽命的<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>。"}, {"id": "d3q2", "n": 2, "opts": ["CoAP－UDP－請求/回應", "HTTP－TCP/IP－發布/訂閱", "MQTT－UDP－請求/回應", "MQTT－TCP/IP－請求/回應"], "exp": "MQTT：TCP/IP＋發布/訂閱；HTTP：TCP/IP＋請求/回應；CoAP：UDP＋請求/回應。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "依指引的 MQTT、HTTP、CoAP 比較表，下列對應何者正確？", "ref": "考科一 2.2", "src": "指引 p.4-42", "ans": 0, "stemH": "依指引的 MQTT、HTTP、CoAP 比較表，下列對應何者正確？", "optsH": ["CoAP－UDP－請求/回應", "HTTP－TCP/IP－發布/訂閱", "MQTT－UDP－請求/回應", "MQTT－TCP/IP－請求/回應"], "expH": "<span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span>：<span class=\"gl\" data-g=\"99\" tabindex=\"0\" role=\"button\">TCP/IP<\/span>＋<span class=\"gl\" data-g=\"174\" tabindex=\"0\" role=\"button\">發布/訂閱<\/span>；<span class=\"gl\" data-g=\"106\" tabindex=\"0\" role=\"button\">HTTP<\/span>：TCP/IP＋<span class=\"gl\" data-g=\"175\" tabindex=\"0\" role=\"button\">請求/回應<\/span>；<span class=\"gl\" data-g=\"173\" tabindex=\"0\" role=\"button\">CoAP<\/span>：<span class=\"gl\" data-g=\"101\" tabindex=\"0\" role=\"button\">UDP<\/span>＋請求/回應。"}, {"id": "d3q3", "n": 3, "opts": ["資料從傳送端往下傳遞時，每經過一層就加上該層的標頭", "資料抵達接收端往上傳時，每經過一層就再加上一層標頭", "封裝只發生在實體層", "使用 Modbus 或 MQTT 函式庫時，完全不涉及封裝概念"], "exp": "往下傳加標頭＝封裝；往上傳去標頭＝解封裝。指引 p.4-49 也說明在應用層使用 Modbus 或 MQTT 函式庫時，封裝與解封裝的概念同樣適用。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "關於網路通訊的「封裝（Encapsulation）」，下列敘述何者正確？", "ref": "考科一 2.3", "src": "指引 p.4-49", "ans": 0, "stemH": "關於網路通訊的「封裝（Encapsulation）」，下列敘述何者正確？", "optsH": ["資料從傳送端往下傳遞時，每經過一層就加上該層的標頭", "資料抵達接收端往上傳時，每經過一層就再加上一層標頭", "封裝只發生在實體層", "使用 Modbus 或 MQTT 函式庫時，完全不涉及封裝概念"], "expH": "往下傳加<span class=\"gl\" data-g=\"116\" tabindex=\"0\" role=\"button\">標頭<\/span>＝<span class=\"gl\" data-g=\"115\" tabindex=\"0\" role=\"button\">封裝<\/span>；往上傳去標頭＝解封裝。指引 p.4-49 也說明在<span class=\"gl\" data-g=\"95\" tabindex=\"0\" role=\"button\">應用層<\/span>使用 <span class=\"gl\" data-g=\"193\" tabindex=\"0\" role=\"button\">Modbus<\/span> 或 <span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span> 函式庫時，封裝與解封裝的概念同樣適用。"}, {"id": "d3q4", "n": 4, "opts": [ ethod"], "exp": "OPC UA 伺服器可提供可執行的方法（Method），客戶端遠端呼叫以執行特定操作，例如自動換刀。訂閱變數變化用 Data Change；訂閱故障等事件用 Event Notification。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "操作員希望透過 OPC UA 客戶端「遠端觸發」工具機的自動換刀程序，應使用哪一種資料存取方式？", "ref": "考科一 2.3", "src": "指引 p.4-55", "ans": 3, "stemH": "操作員希望透過 OPC UA 客戶端「遠端觸發」工具機的自動換刀程序，應使用哪一種資料存取方式？", "optsH": ["Read/Write", "Data Change Notification", "Event Notification", "Method"], "expH": "<span class=\"gl\" data-g=\"209\" tabindex=\"0\" role=\"button\">OPC UA<\/span> 伺服器可提供可執行的方法（Method），客戶端遠端呼叫以執行特定操作，例如自動換刀。訂閱變數變化用 Data Change；訂閱故障等事件用 Event Notification。"}, {"id": "d3q7", "n": 7, "opts": ["Device", "Adapter", "Agent", "Application"], "exp": "Agent 是 MTConnect 的核心軟體服務，負責資料緩存、格式化與傳輸。Adapter 負責存取設備資料並轉成 XML（例如用 FOCAS 讀發那科控制器）。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "在 MTConnect 架構中，負責整合一個或多個 Adapter 的資料、以標準 XML 儲存，並透過 HTTP RESTful API 提供給外部應用的元素是？", "ref": "考科一 2.3", "src": "指引 p.4-58", "ans": 2, "stemH": "在 MTConnect 架構中，負責整合一個或多個 Adapter 的資料、以標準 XML 儲存，並透過 HTTP RESTful API 提供給外部應用的元素是？", "optsH": ["Device", "Adapter", "Agent", "Application"], "expH": "<span class=\"gl\" data-g=\"8\" tabindex=\"0\" role=\"button\">Agent<\/span> 是 <span class=\"gl\" data-g=\"212\" tabindex=\"0\" role=\"button\">MTConnect<\/span> 的核心軟體服務，負責資料緩存、格式化與傳輸。Adapter 負責存取設備資料並轉成 <span class=\"gl\" data-g=\"213\" tabindex=\"0\" role=\"button\">XML<\/span>（例如用 FOCAS 讀發那科控制器）。"}, {"id": "d3q8", "n": 8, "opts": ["發布者必須知道每一位訂閱者的 IP 位址", "Broker 依主題（Topic）過濾並把訊息轉發給訂閱該主題的訂閱者", "訂閱者需主動輪詢發布者才能取得資料", "只要有一個感測器故障，所有訂閱者都會停止運作"], "exp": "Broker 是 MQTT 核心，接收發布者訊息並依主題過濾分發。Pub/Sub 架構讓發布者與訂閱者完全解耦，部分裝置離線不影響其他裝置。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "關於 MQTT 的 Broker，下列敘述何者正確？", "ref": "考科一 2.3", "src": "指引 p.4-59～4-60", "ans": 1, "stemH": "關於 MQTT 的 Broker，下列敘述何者正確？", "optsH": ["發布者必須知道每一位訂閱者的 IP 位址", "Broker 依主題（Topic）過濾並把訊息轉發給訂閱該主題的訂閱者", "訂閱者需主動輪詢發布者才能取得資料", "只要有一個感測器故障，所有訂閱者都會停止運作"], "expH": "<span class=\"gl\" data-g=\"176\" tabindex=\"0\" role=\"button\">Broker<\/span> 是 <span clas 始碼；第三方函式庫掃描檢查套件的已知漏洞；災難復原（DR）是災後恢復，不是找漏洞。", "stem": "某 IoT 平台即將上線。資安團隊在上線前，由專人「模擬駭客實際攻擊」運行中的系統，嘗試找出可被利用的漏洞。依 SDLC 資安掃描，這項工作稱為？", "ans": 2, "id": "d4c3", "n": 3, "stemH": "某 IoT 平台即將上線。資安團隊在上線前，由專人「模擬駭客實際攻擊」運行中的系統，嘗試找出可被利用的漏洞。依 SDLC 資安掃描，這項工作稱為？", "optsH": ["靜態程式碼弱點掃描", "第三方函式庫弱點掃描", "滲透測試", "災難復原演練"], "expH": "上線前與定期由專人模擬攻擊＝<span class=\"gl\" data-g=\"304\" tabindex=\"0\" role=\"button\">滲透測試<\/span>。靜態程式碼掃描在開發階段檢查原始碼；第三方函式庫掃描檢查套件的已知漏洞；<span class=\"gl\" data-g=\"300\" tabindex=\"0\" role=\"button\">災難復原<\/span>（DR）是災後恢復，不是找漏洞。"}, {"ref": "考科一 2.5", "opts": ["資料已經蒐集了，可以直接使用", "只要資料有加密，就可以用於新用途", "要用於原告知目的以外的用途，須再次取得住戶同意", "只要不對外公開分析結果，就不需告知"], "exp": "「目的限制」：告知用途後，若要用在其他用途（例如匯入 AI 分析）須再次取得同意。加密保護的是機密性，不能取代同意；不公開也不代表可以超出原目的使用。", "stem": "社區智慧門禁蒐集住戶進出紀錄時，告知的用途是「門禁管理」。管委會後來想把這些紀錄匯入 AI 分析住戶作息，用於社區行銷活動。依物聯網隱私原則，最恰當的做法是？", "ans": 2, "id": "d4c4", "n": 4, "stemH": "社區智慧門禁蒐集住戶進出紀錄時，告知的用途是「門禁管理」。管委會後來想把這些紀錄匯入 AI 分析住戶作息，用於社區行銷活動。依物聯網隱私原則，最恰當的做法是？", "optsH": ["資料已經蒐集了，可以直接使用", "只要資料有加密，就可以用於新用途", "要用於原告知目的以外的用途，須再次取得住戶同意", "只要不對外公開分析結果，就不需告知"], "expH": "「<span class=\"gl\" data-g=\"307\" tabindex=\"0\" role=\"button\">目的限制<\/span>」：告知用途後，若要用在其他用途（例如匯入 <span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span> 分析）須再次取得同意。加密保護的是<span class=\"gl\" data-g=\"267\" tabindex=\"0\" role=\"button\">機密性<\/span>，不能取代同意；不公開也不代表可以超出原目的使用。"}], "lecture": "<h3>今天要搞懂的 5 件事<\/h3>\n<ol>\n<li>「<span class=\"gl\" data-g=\"219\" tabindex=\"0\" role=\"button\">中介軟體<\/span>與平台」涵蓋哪些層：連線技術 → <span class=\"gl\" data-g=\"94\" tabindex=\"0\" role=\"button\">網路層<\/span> → 訊息中介 → <span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>平台 → <span class=\"gl\" data-g=\"95\" tabindex=\"0\" role=\"button\">應用層<\/span>決策。<\/li>\n<li><span class=\"gl\" data-g=\"220\" tabindex=\"0\" role=\"button\">訊息中介軟體<\/span>（<span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span>、<span class=\"gl\" data-g=\"222\" tabindex=\"0\" role=\"button\">AMQP<\/span>、<span class=\"gl\" data-g=\"223\" tabindex=\"0\" role=\"button\">Kafka<\/span>）為什麼能「<span class=\"gl\" data-g=\"221\" tabindex=\"0\" role=\"button\">解耦<\/span>」與「削峰」。<\/li>\n<li><span class=\"gl\" data-g=\"226\" tabindex=\"0\" role=\"button\">地端<\/span>／純雲／<span class=\"gl\" data-g=\"227\" tabindex=\"0\" role=\"button\">混合雲<\/span>；<span class=\"gl\" data-g=\"228\" tabindex=\"0\" role=\"button\">IaaS<\/span>、<span class=\"gl\" data-g=\"229\" tabindex=\"0\" role=\"button\">PaaS<\/span>、<span class=\"gl\" data-g=\"230\" tabindex=\"0\" role=\"button\">SaaS<\/span> 的分界與例子。<\/li>\n<li>資料儲存（關聯式 <span class=\"gl\" data-g=\"237\" tabindex=\"0\" role=\"button\">ACID<\/span>、<span class=\"gl\" data-g=\"236\" tabindex=\"0\" role=\"button\">NoSQL<\/span>、<span class=\"gl\" data-g=\"239\" tabindex=\"0\" role=\"button\">快取<\/span>）、通訊模式、身分驗證、<span class=\"gl\" data-g=\"257\" tabindex=\"0\" role=\"button\">ETL<\/span> 與分析。<\/li>\n<li>資安：加密（對稱/非對稱）、<span class=\"gl\" data-g=\"275\" tabindex=\"0\" role=\"button\">雜湊<\/span>、<span class=\"gl\" data-g=\"277\" tabindex=\"0\" role=\"button\">數位簽章<\/span>、<span class=\"gl\" data-g=\"268\" tabindex=\"0\" role=\"button\">AAA<\/span>、<span class=\"gl\" data-g=\"267\" tabindex=\"0\" role=\"button\">CIA<\/span>、<span class=\"gl\" data-g=\"300\" tabindex=\"0\" role=\"button\">DR<\/span>/<span class=\"gl\" data-g=\"301\" tabindex=\"0\" role=\"button\">RPO<\/span>/<span class=\"gl\" data-g=\"302\" tabindex=\"0\" role=\"button\">RTO<\/span>、常見攻擊；隱私：<span class=\"gl\" data-g=\"305\" tabindex=\"0\" role=\"button\">去識別化<\/span>、<span class=\"gl\" data-g=\"306\" tabindex=\"0\" role=\"button\">資料最小化<\/span>、同意、<span class=\"gl\" data-g=\"307\" tabindex=\"0\" role=\"button\">目的限制<\/span>。<\/li>\n<\/ol>\n<h2>1. 中介軟體與平台的範圍 <span class=\"ref\">考科一 2.4<\/span><span class=\"pg\">指引 p.4-73～4-74<\/span><\/h2>\n<p>指引定義：感測資料經<strong>感測<span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span><\/strong>接收後，一直到提供 <span class=\"gl\" data-g=\"1\" tabindex=\"0\" role=\"button\">AIoT<\/span> 應用服務之間的<strong>所有軟體元件與<span class=\"gl\" data-g=\"383\" tabindex=\"0\" role=\"button\">通訊協定<\/span><\/strong>；在 <span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">IoT<\/span> 分層上涵蓋<strong><span class=\"gl\" data-g=\"94\" tabindex=\"0\" role=\"button\">網路層<\/span>與<span class=\"gl\" data-g=\"95\" tabindex=\"0\" role=\"button\">應用層<\/span><\/strong>。<\/p>\n<p><strong>(1) 閘道器的連線技術<\/strong>：<span class=\"gl\" data-g=\"120\" tabindex=\"0\" role=\"button\">Ethernet<\/span>、Datacom（<span class=\"gl\" data-g=\"161\" tabindex=\"0\" role=\"button\">4G<\/span>/<span class=\"gl\" data-g=\"162\" tabindex=\"0\" role=\"button\">5G<\/span>）、<span class=\"gl\" data-g=\"131\" tabindex=\"0\" role=\"button\">Wi-Fi<\/span>、<span class=\"gl\" data-g=\"155\" tabindex=\"0\" role=\"button\">LPWAN<\/span>；工業環境另有 <span class=\"gl\" data-g=\"201\" tabindex=\"0\" role=\"button\">RS232<\/span>/485、<span class=\"gl\" data-g=\"193\" tabindex=\"0\" role=\"button\">Modbus<\/span>、<span class=\"gl\" data-g=\"215\" tabindex=\"0\" role=\"button\">EtherCAT<\/span>。分成兩類協定：\n- <strong>實體層（硬體）協定<\/strong>：定義電壓、接腳、連線方式。\n- <strong>網路層（軟體）協定<\/strong>：定義通訊格式與內容。\n- 例：智慧城市常用 <strong>Ethernet＋<span class=\"gl\" data-g=\"99\" tabindex=\"0\" role=\"button\">TCP/IP<\/span><\/strong>；工業常用 <strong>RS232/485＋<span class=\"gl\" data-g=\"194\" tabindex=\"0\" role=\"button\">Modbus RTU<\/span><\/strong> 或 <strong>Ethernet＋<span class=\"gl\" data-g=\"196\" tabindex=\"0\" role=\"button\">Modbus TCP/IP<\/span><\/strong>。\n- 有線<span class=\"gl\" data-g=\"121\" tabindex=\"0\" role=\"button\">區域網路<\/span>最普及的標準是 <strong>IEEE 802.3（Ethernet）<\/strong>，如 100Base-T／1000Base-T，用雙絞線或光纖。<\/p>\n<p><strong>(2) 網路層協定<\/strong>：負責定址與路由，常見 <strong><span class=\"gl\" data-g=\"104\" tabindex=\"0\" role=\"button\">IPv4<\/span>、IPv6<\/strong>；其上再由傳輸層（<span class=\"gl\" data-g=\"100\" tabindex=\"0\" role=\"button\">TCP<\/span>/<span class=\"gl\" data-g=\"101\" tabindex=\"0\" role=\"button\">UDP<\/span>）提供端對端傳輸、應用層（<span class=\"gl\" data-g=\"106\" tabindex=\"0\" role=\"button\">HTTP<\/span>、Modbus TCP、<span class=\"gl\" data-g=\"110\" tabindex=\"0\" role=\"button\">DNS<\/span>）處理應用格式。<\/p>\n<h2>2. 訊息中介軟體 <span class=\"ref\">考科一 2.4<\/span><span class=\"pg\">指引 p.4-74～4-75<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>多、資料量暴增時，加入<strong><span class=\"gl\" data-g=\"220\" tabindex=\"0\" role=\"button\">訊息中介軟體<\/span><\/strong>當緩衝，把「資料接收」與「應用處理」<strong><span class=\"gl\" data-g=\"221\" tabindex=\"0\" role=\"button\">解耦<\/span>（Decoupling）<\/strong>。<\/p>\n<table>\n<thead>\n<tr>\n<th>協定<\/th>\n<th>對應軟體<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span>、<span class=\"gl\" data-g=\"222\" tabindex=\"0\" role=\"button\">AMQP<\/span><\/td>\n<td><span class=\"gl\" data-g=\"224\" tabindex=\"0\" role=\"button\">RabbitMQ<\/span>、Apache ActiveMQ<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"223\" tabindex=\"0\" role=\"button\">Kafka<\/span><\/td>\n<td>Kafka<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>四個要點：\n- <strong><span class=\"gl\" data-g=\"178\" tabindex=\"0\" role=\"button\">QoS<\/span><\/strong>：最多一次、最少一次、剛好一次（概念同 MQTT QoS）。\n- <strong><span class=\"gl\" data-g=\"174\" tabindex=\"0\" role=\"button\">Pub/Sub<\/span> 角色<\/strong>：Publisher（產生者）、Subscriber（接收者）、<span class=\"gl\" data-g=\"176\" tabindex=\"0\" role=\"button\">Broker<\/span>（分派者），依 <span class=\"gl\" data-g=\"177\" tabindex=\"0\" role=\"button\">Topic<\/span> 分派。\n- <strong>資料保存<\/strong>：訊息在分派前不能因斷電當機遺失 → 選具**永久儲存（Persistent Storage）**能力的，如 <strong>Kafka<\/strong>。\n- <strong>高併發緩衝<\/strong>：暫存後逐一分派，保護後端電腦與資料庫不被衝垮，也讓後端規格能用 CP 值較高的方式設計。<\/p>\n<h2>3. 地端、純雲、混合雲與 IaaS/PaaS/SaaS <span class=\"ref\">考科一 2.4<\/span><span class=\"pg\">指引 p.4-75～4-77<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>架構<\/th>\n<th>說明<\/th>\n<th>例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"226\" tabindex=\"0\" role=\"button\">地端<\/span> On-Premise<\/td>\n<td>營運與管理屬於企業內部（實體機或 <span class=\"gl\" data-g=\"231\" tabindex=\"0\" role=\"button\">VMware<\/span>、Proxmox 虛擬化），重點不是機器規模<\/td>\n<td>小型或封閉系統<\/td>\n<\/tr>\n<tr>\n<td>純雲 Pure-cloud<\/td>\n<td>所有軟體元件都在<span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>業者環境內<\/td>\n<td><span class=\"gl\" data-g=\"249\" tabindex=\"0\" role=\"button\">S3<\/span>／Cloud Storage、RDS／Cloud <span class=\"gl\" data-g=\"240\" tabindex=\"0\" role=\"button\">SQL<\/span>、EC2／Compute Engine、<span class=\"gl\" data-g=\"264\" tabindex=\"0\" role=\"button\">AWS IoT Core<\/span>／GCP <span class=\"gl\" data-g=\"174\" tabindex=\"0\" role=\"button\">Pub/Sub<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"227\" tabindex=\"0\" role=\"button\">混合雲<\/span> Hybrid-cloud<\/td>\n<td>部分資料與邏輯在地端、部分在雲端<\/td>\n<td>原因：資料安全、內部網路、上雲速度與規劃耗時<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th>服務模型<\/th>\n<th>雲端給你什麼<\/th>\n<th>你要自己管什麼<\/th>\n<th>例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"228\" tabindex=\"0\" role=\"button\">IaaS<\/span> 基礎設施即服務<\/td>\n<td>虛擬網路、虛擬電腦等<strong>虛擬硬體<\/strong><\/td>\n<td><span class=\"gl\" data-g=\"436\" tabindex=\"0\" role=\"button\">OS<\/span>、資料庫版本更新、備份、應用<\/td>\n<td>租 EC2 自己裝 SQL Server<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"229\" tabindex=\"0\" role=\"button\">PaaS<\/span> 平台即服務<\/td>\n<td>在 IaaS 上整合 OS、執行環境、資料庫、網頁伺服器、維運<\/td>\n<td>主要只管應用程式<\/td>\n<td><strong>AWS RDS／GCP Cloud SQL<\/strong>（已含修補與備份）、AWS IoT Core、Vertex <span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"230\" tabindex=\"0\" role=\"button\">SaaS<\/span> 軟體即服務<\/td>\n<td>直接可用的軟體服務<\/td>\n<td>只管使用與設定<\/td>\n<td>應用業者部署給終端客戶的服務<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>指引觀點：<strong>PaaS 對應用業者最有價值<\/strong>，可降低 <strong><span class=\"gl\" data-g=\"232\" tabindex=\"0\" role=\"button\">CI<\/span>（持續整合）、CD（持續交付／持續部署）、<span class=\"gl\" data-g=\"233\" tabindex=\"0\" role=\"button\">DevOps<\/span><\/strong> 的負擔；不用 PaaS 的話，跟傳統 <span class=\"gl\" data-g=\"234\" tabindex=\"0\" role=\"button\">IDC<\/span> 機房模式差不多。<\/li>\n<\/ul>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：「提供作業系統、程式執行環境、資料庫及網頁伺服器的開發平台」＝ <strong>PaaS<\/strong>（指引 p.4-80 練習題）。自己裝資料庫＝IaaS；用託管資料庫＝PaaS。<\/p>\n<\/blockquote>\n<div class=\"cp\" id=\"cp_d4c1\" data-ans=\"2\"><div class=\"cph\">🧩 隨堂小測 1<span class=\"ref\">考科一 2.4<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">某工廠因資安規定，產線即時控制資料與配方必須留在廠內伺服器；但跨廠報表分析與長期資料保存希望放到雲端，以便擴充。這種架構最符合下列哪一種？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 純雲（Pure-cloud）<\/button><button class=\"opt cpo\" data-k=\"1\">B. 地端（On-Premise）<\/button><button class=\"opt cpo\" data-k=\"2\">C. 混合雲（Hybrid-cloud）<\/button><button class=\"opt cpo\" data-k=\"3\">D. SaaS<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div>部分資料與邏輯在<span class=\"gl\" data-g=\"226\" tabindex=\"0\" role=\"button\">地端<\/span>、部分在<span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>＝<span class=\"gl\" data-g=\"227\" tabindex=\"0\" role=\"button\">混合雲<\/span>；指引列出的常見原因包含資料安全與內部網路需求。純雲是全部在雲端業者環境；地端是全部由企業內部營運；<span class=\"gl\" data-g=\"230\" tabindex=\"0\" role=\"button\">SaaS<\/span> 是服務模型，不是部署位置。<\/div><\/div><\/div>\n<h2>4. 應用層的決策：儲存、通訊、驗證、分析、服務 <span class=\"ref\">考科一 2.4<\/span><span class=\"pg\">指引 p.4-77～4-79<\/span><\/h2>\n<p><strong>(1) 資料儲存<\/strong>\n| 資料型態 | 例 | 存放 |\n|---|---|---|\n| 結構化 | 表格欄位固定的感測紀錄 | <strong><span class=\"gl\" data-g=\"235\" tabindex=\"0\" role=\"button\">關聯式資料庫<\/span><\/strong>：嚴謹結構、以鍵值關聯；提供 <strong><span class=\"gl\" data-g=\"237\" tabindex=\"0\" role=\"button\">ACID<\/span><\/strong>（原子性 Atomicity、一致性 Consistency、隔離性 Isolation、持久性 Durability） |\n| <span class=\"gl\" data-g=\"250\" tabindex=\"0\" role=\"button\">半結構化<\/span> | <strong><span class=\"gl\" data-g=\"251\" tabindex=\"0\" role=\"button\">JSON<\/span>、<span class=\"gl\" data-g=\"252\" tabindex=\"0\" role=\"button\">YAML<\/span>、<span class=\"gl\" data-g=\"213\" tabindex=\"0\" role=\"button\">XML<\/span><\/strong> | <strong><span class=\"gl\" data-g=\"236\" tabindex=\"0\" role=\"button\">NoSQL<\/span><\/strong>：特色是<strong>橫向擴充<\/strong>、對大數據友善 |\n| 非結構化 | 圖文檔案、圖片 | <span class=\"gl\" data-g=\"249\" tabindex=\"0\" role=\"button\">物件儲存<\/span>（如 S3）、<span class=\"gl\" data-g=\"260\" tabindex=\"0\" role=\"button\">向量資料庫<\/span>；經 <span class=\"gl\" data-g=\"259\" tabindex=\"0\" role=\"button\">OCR<\/span>、向量計算可轉成半結構化 |\n| 高時效 | 即時查詢 | <strong><span class=\"gl\" data-g=\"239\" tabindex=\"0\" role=\"button\">記憶體快取<\/span>（Memory-cache）<\/strong>：Redis、Memcached（&lt; 5 ms） |<\/p>\n<p><strong>(2) 元件間通訊模式<\/strong>：<span class=\"gl\" data-g=\"175\" tabindex=\"0\" role=\"button\">請求-回應<\/span>（<span class=\"gl\" data-g=\"106\" tabindex=\"0\" role=\"button\">HTTP<\/span>、<span class=\"gl\" data-g=\"186\" tabindex=\"0\" role=\"button\">REST<\/span>、<span class=\"gl\" data-g=\"255\" tabindex=\"0\" role=\"button\">gRPC<\/span>、<span class=\"gl\" data-g=\"256\" tabindex=\"0\" role=\"button\">GraphQL<\/span>）、<span class=\"gl\" data-g=\"372\" tabindex=\"0\" role=\"button\">非同步<\/span>訊息驅動（<span class=\"gl\" data-g=\"222\" tabindex=\"0\" role=\"button\">AMQP<\/span>、<span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span>、<span class=\"gl\" data-g=\"223\" tabindex=\"0\" role=\"button\">Kafka<\/span>）、遠端程序呼叫 RPC（gRPC、Apache Thrift、Apache Dubbo）。<\/p>\n<p><strong>(3) 身分驗證機制<\/strong>\n| 機制 | 特性 | 適用 |\n|---|---|---|\n| <span class=\"gl\" data-g=\"279\" tabindex=\"0\" role=\"button\">X.509 憑證<\/span> | 安全性極高，但運算與管理複雜、資源負擔重 | <span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span>、<span class=\"gl\" data-g=\"170\" tabindex=\"0\" role=\"button\">車聯網<\/span> |\n| <span class=\"gl\" data-g=\"280\" tabindex=\"0\" role=\"button\">Token<\/span>（JWT、Basic Auth、Bearer token） | 輕量簡單 | 應用服務的軟體元件 |\n| <span class=\"gl\" data-g=\"274\" tabindex=\"0\" role=\"button\">共享金鑰<\/span> PSK（Pre-shared key） | 運算最輕 | <strong>算力極低的設備<\/strong> |\n| <span class=\"gl\" data-g=\"281\" tabindex=\"0\" role=\"button\">硬體安全模組<\/span> TPM、HSM | 做密碼學運算，遭惡意破壞也不洩漏金鑰 | 高安全硬體 |\n| 帳號密碼 | 最基本 | 使用者登入 |<\/p>\n<p><strong>(4) 資料分析三層次<\/strong>：統計與描述性分析（中位數、標準差、極值＋<span class=\"gl\" data-g=\"91\" tabindex=\"0\" role=\"button\">Dashboard<\/span>、Alert）→ 資料探勘與關聯分析（找離群點、<span class=\"gl\" data-g=\"12\" tabindex=\"0\" role=\"button\">分群<\/span>；需大量 <strong><span class=\"gl\" data-g=\"257\" tabindex=\"0\" role=\"button\">ETL<\/span>：擷取 Extract、轉換 Transform、載入 Load<\/strong> 清洗資料，再用 <strong><span class=\"gl\" data-g=\"258\" tabindex=\"0\" role=\"button\">Hadoop<\/span>、Spark、BigQuery<\/strong> 處理海量資料）→ <strong><span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span>/<span class=\"gl\" data-g=\"2\" tabindex=\"0\" role=\"button\">ML<\/span><\/strong>。<\/p>\n<p><strong>(5) 服務提供<\/strong>：APP（Android/iPhone，原生 Java/Swift 或跨平台 Flutter）與 WEB（本質是 HTML＋JavaScript＋CSS）。<\/p>\n<p><span class=\"ref\">考科一 2.4<\/span><span class=\"pg\">指引 p.4-80～4-84 練習題<\/span> 練習題重點：<span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>讓<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測元件<\/span>不需強大算力、易擴展；但<strong>雲端即時處理的主要挑戰是網路<span class=\"gl\" data-g=\"47\" tabindex=\"0\" role=\"button\">延遲<\/span>較高<\/strong>；雲端資安考量應是<strong><span class=\"gl\" data-g=\"314\" tabindex=\"0\" role=\"button\">最小權限<\/span><\/strong>而非最大權限；大數據工具（Hadoop）的價值在「<strong>資料處理與分析能力<\/strong>」。<\/p>\n<div class=\"cp\" id=\"cp_d4c2\" data-ans=\"0\"><div class=\"cph\">🧩 隨堂小測 2<span class=\"ref\">考科一 2.4<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">平台團隊先用中位數、標準差、極值等指標整理每日感測資料，並以儀表板（Dashboard）與告警（Alert）呈現。依指引的「資料分析三層次」，這屬於哪一層？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 統計與描述性分析<\/button><button class=\"opt cpo\" data-k=\"1\">B. 資料探勘與關聯分析<\/button><button class=\"opt cpo\" data-k=\"2\">C. AI／機器學習<\/button><button class=\"opt cpo\" data-k=\"3\">D. ETL 資料載入<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div>指引的三層次為：統計與描述性分析（中位數、標準差、極值＋<span class=\"gl\" data-g=\"91\" tabindex=\"0\" role=\"button\">Dashboard<\/span>、Alert）→ 資料探勘與關聯分析（找離群點、<span class=\"gl\" data-g=\"12\" tabindex=\"0\" role=\"button\">分群<\/span>，需大量 <span class=\"gl\" data-g=\"257\" tabindex=\"0\" role=\"button\">ETL<\/span>）→ <span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span>/<span class=\"gl\" data-g=\"2\" tabindex=\"0\" role=\"button\">ML<\/span>。ETL 是資料清洗的過程，不是分析層次。<\/div><\/div><\/div>\n<h2>5. 資安三大技術：加密、雜湊、簽章 <span class=\"ref\">考科一 2.5<\/span><span class=\"pg\">指引 p.4-85<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>技術<\/th>\n<th>解決什麼<\/th>\n<th>常見演算法／重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"269\" tabindex=\"0\" role=\"button\">對稱式加解密<\/span><\/td>\n<td>防<strong>竊聽<\/strong>（<span class=\"gl\" data-g=\"267\" tabindex=\"0\" role=\"button\">機密性<\/span>），雙方用<strong>同一把金鑰<\/strong><\/td>\n<td><span class=\"gl\" data-g=\"271\" tabindex=\"0\" role=\"button\">AES<\/span>、DES、Twofish；需<span class=\"gl\" data-g=\"273\" tabindex=\"0\" role=\"button\">金鑰交換<\/span>：<strong>DHE、ECDH（Elliptic Curve DH）<\/strong><\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"274\" tabindex=\"0\" role=\"button\">PSK<\/span> 預載金鑰<\/td>\n<td>感測節點算力弱，避免複雜的非對稱金鑰交換<\/td>\n<td><span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">Sensor<\/span> node 可明文或用 PSK 加密<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"275\" tabindex=\"0\" role=\"button\">雜湊<\/span> Hash<\/td>\n<td>不易由結果反推原文；<strong>輕量地保護密碼、<span class=\"gl\" data-g=\"187\" tabindex=\"0\" role=\"button\">API<\/span> 金鑰<\/strong>；單獨使用只能確保<strong>完整性<\/strong><\/td>\n<td><span class=\"gl\" data-g=\"276\" tabindex=\"0\" role=\"button\">SHA256<\/span>、SHA512、SHA3<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"277\" tabindex=\"0\" role=\"button\">數位簽章<\/span>（非對稱）<\/td>\n<td>證明「確實是他發的、內容沒被假造」→ <strong><span class=\"gl\" data-g=\"278\" tabindex=\"0\" role=\"button\">不可否認性<\/span>（Non-repudiation）<\/strong><\/td>\n<td><span class=\"gl\" data-g=\"270\" tabindex=\"0\" role=\"button\">私鑰<\/span>簽、公鑰驗<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 非對稱金鑰口訣<\/strong>：要<strong>保密<\/strong>給 B → 用 <strong>B 的公鑰<\/strong>加密，B 用自己的私鑰解；要<strong>簽章<\/strong>證明是 A → A 用<strong>自己的私鑰<\/strong>加密（簽），B 用 <strong>A 的公鑰<\/strong>解（驗）。（指引 p.4-91 練習題：A 用自己的金鑰加密，B 用 A 的公鑰解開）<\/p>\n<\/blockquote>\n<h2>6. IoT 常見風險與攻擊 <span class=\"ref\">考科一 2.5<\/span><span class=\"pg\">指引 p.4-86～4-87<\/span><\/h2>\n<ul>\n<li><strong>預設帳號密碼／弱加密<\/strong>（如 RC2、RC4）：攻擊者用自動化工具掃描取得存取權。<\/li>\n<li><strong><span class=\"gl\" data-g=\"299\" tabindex=\"0\" role=\"button\">韌體<\/span>漏洞<\/strong>：<span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">IoT<\/span> 更新不易且數量多，已知漏洞可存在數年；加入 <strong><span class=\"gl\" data-g=\"168\" tabindex=\"0\" role=\"button\">OTA<\/span><\/strong> 更新機制可改善，但不是每台都有算力。<\/li>\n<li><strong>網路攻擊<\/strong>：<span class=\"gl\" data-g=\"286\" tabindex=\"0\" role=\"button\">中間人攻擊<\/span>（MITM）、<span class=\"gl\" data-g=\"287\" tabindex=\"0\" role=\"button\">殭屍網路<\/span>（Botnet）、阻斷服務（<span class=\"gl\" data-g=\"288\" tabindex=\"0\" role=\"button\">DoS<\/span>）、分散式阻斷服務（<span class=\"gl\" data-g=\"289\" tabindex=\"0\" role=\"button\">DDoS<\/span>）、竊聽、竄改。<\/li>\n<li><strong>實體入侵<\/strong>：透過電路板上的 <strong><span class=\"gl\" data-g=\"292\" tabindex=\"0\" role=\"button\">JTAG<\/span>/<span class=\"gl\" data-g=\"384\" tabindex=\"0\" role=\"button\">UART<\/span>/Console<\/strong> 直接取得管理權限 → 量產設備應<strong>關閉 JTAG/Console<\/strong>。<\/li>\n<li>被大量入侵的 IoT 可能<strong>反過來變成攻擊工具<\/strong>，發動 Botnet 攻擊下游（Edge、Cloud server）→ 重要系統要做<strong><span class=\"gl\" data-g=\"293\" tabindex=\"0\" role=\"button\">網路隔離<\/span>（Network isolation）<\/strong>，切斷橫向攻擊。<\/li>\n<\/ul>\n<blockquote>\n<p><strong>💡 經典案例<\/strong>：<strong><span class=\"gl\" data-g=\"290\" tabindex=\"0\" role=\"button\">Mirai<\/span><\/strong> 感染數十萬台攝影機、路由器組成殭屍網路，發動 <strong>DDoS<\/strong>（指引 p.4-91 練習題）。<\/p>\n<\/blockquote>\n<h2>7. 資安核心觀念：AAA、CIA、裝置與平台防護 <span class=\"ref\">考科一 2.5<\/span><span class=\"pg\">指引 p.4-86～4-88<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>框架<\/th>\n<th>內容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"268\" tabindex=\"0\" role=\"button\">AAA<\/span><\/strong><\/td>\n<td>認證 Authentication（你是誰）、授權 Authorization（依身分給權限）、稽核 Auditing（事後追查時間、人員、結果）<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"267\" tabindex=\"0\" role=\"button\">CIA<\/span><\/strong><\/td>\n<td>機密性 Confidentiality（加密、身份驗證、遮罩、存取控制）、完整性 Integrity（<span class=\"gl\" data-g=\"275\" tabindex=\"0\" role=\"button\">雜湊<\/span>；<strong><span class=\"gl\" data-g=\"283\" tabindex=\"0\" role=\"button\">訊息鑑別碼<\/span> MAC<\/strong>）、可用性 Availability（<span class=\"gl\" data-g=\"284\" tabindex=\"0\" role=\"button\">SLA<\/span>、<span class=\"gl\" data-g=\"285\" tabindex=\"0\" role=\"button\">Load Balancer<\/span> 高可用；會被 <span class=\"gl\" data-g=\"289\" tabindex=\"0\" role=\"button\">DDoS<\/span>、<span class=\"gl\" data-g=\"291\" tabindex=\"0\" role=\"button\">SYN Flood<\/span>、Broadcast Storm 降低）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>SLA 換算<\/strong>：99% ≈ 每月 7.2 小時停機；99.99% ≈ 每月 4.3 分鐘。<\/li>\n<li><strong>裝置防護<\/strong>：<span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span>注意預設密碼、實體接線、<span class=\"gl\" data-g=\"299\" tabindex=\"0\" role=\"button\">韌體<\/span> N 日攻擊；<strong><span class=\"gl\" data-g=\"298\" tabindex=\"0\" role=\"button\">韌體簽章<\/span>（Secure boot）＋<span class=\"gl\" data-g=\"168\" tabindex=\"0\" role=\"button\">OTA<\/span> encryption<\/strong>；裝置認證依能力選 <span class=\"gl\" data-g=\"274\" tabindex=\"0\" role=\"button\">PSK<\/span>、<span class=\"gl\" data-g=\"280\" tabindex=\"0\" role=\"button\">API key<\/span>、Token、<strong><span class=\"gl\" data-g=\"282\" tabindex=\"0\" role=\"button\">mTLS<\/span><\/strong>、<span class=\"gl\" data-g=\"279\" tabindex=\"0\" role=\"button\">X.509<\/span>；通訊依重要性選加密、MAC、<span class=\"gl\" data-g=\"277\" tabindex=\"0\" role=\"button\">簽章<\/span>。<\/li>\n<li><strong>平台防護<\/strong>：<strong><span class=\"gl\" data-g=\"294\" tabindex=\"0\" role=\"button\">防火牆白名單<\/span><\/strong>（Layer 2/3，限制來源 <span class=\"gl\" data-g=\"103\" tabindex=\"0\" role=\"button\">IP<\/span> 與 port，簡單快速）；<strong><span class=\"gl\" data-g=\"295\" tabindex=\"0\" role=\"button\">WAF<\/span> 網頁應用程式防火牆<\/strong>（拆到<span class=\"gl\" data-g=\"95\" tabindex=\"0\" role=\"button\">應用層<\/span>，可防 <strong><span class=\"gl\" data-g=\"296\" tabindex=\"0\" role=\"button\">SQL Injection<\/span>、<span class=\"gl\" data-g=\"297\" tabindex=\"0\" role=\"button\">XSS<\/span>、Bot attack<\/strong>）。<\/li>\n<li>練習題：<strong>認證方式中「密碼」防護較差<\/strong>（生物特徵如靜脈、瞳孔、指紋不易偽造）；<strong><span class=\"gl\" data-g=\"119\" tabindex=\"0\" role=\"button\">中繼器<\/span>（Repeater）無法做<span class=\"gl\" data-g=\"293\" tabindex=\"0\" role=\"button\">網路隔離<\/span><\/strong>，<span class=\"gl\" data-g=\"122\" tabindex=\"0\" role=\"button\">VLAN<\/span>、防火牆、不同 <span class=\"gl\" data-g=\"136\" tabindex=\"0\" role=\"button\">SSID<\/span> 可以；鐵殼保護 <span class=\"gl\" data-g=\"68\" tabindex=\"0\" role=\"button\">PLC<\/span> <strong>無法防 <span class=\"gl\" data-g=\"288\" tabindex=\"0\" role=\"button\">DoS<\/span><\/strong>。<\/li>\n<\/ul>\n<h2>8. 資料安全：DR、RPO、RTO 與 SDLC 掃描 <span class=\"ref\">考科一 2.5<\/span><span class=\"pg\">指引 p.4-88～4-89<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>名詞<\/th>\n<th>意思<\/th>\n<th>例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"300\" tabindex=\"0\" role=\"button\">DR<\/span> 災難復原<\/td>\n<td>災難後如何快速恢復系統與資料<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"301\" tabindex=\"0\" role=\"button\">RPO<\/span><\/strong> 復原點目標<\/td>\n<td><strong>最多會遺失多少時間的資料<\/strong><\/td>\n<td>一天備份一次 → RPO＝24 hr<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"302\" tabindex=\"0\" role=\"button\">RTO<\/span><\/strong> 復原時間目標<\/td>\n<td><strong>系統要多久恢復服務（停機時間）<\/strong><\/td>\n<td>靠<span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>部署、多用 <span class=\"gl\" data-g=\"229\" tabindex=\"0\" role=\"button\">PaaS<\/span>、<span class=\"gl\" data-g=\"232\" tabindex=\"0\" role=\"button\">CI/CD<\/span> 縮短<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 記法<\/strong>：RP<strong>O<\/strong>＝資料「<strong>點<\/strong>」回到哪裡（丟多少資料）；RT<strong>O<\/strong>＝「<strong>時間<\/strong>」多久回來（停多久）。<\/p>\n<\/blockquote>\n<p><span class=\"gl\" data-g=\"303\" tabindex=\"0\" role=\"button\">SDLC<\/span> 資安掃描：開發階段<strong>靜態程式碼<span class=\"gl\" data-g=\"304\" tabindex=\"0\" role=\"button\">弱點掃描<\/span><\/strong>、<strong>第三方函式庫（套件）弱點掃描<\/strong>、測試階段對運行中系統做<strong>弱點掃描<\/strong>、上線前與定期做<strong>滲透測試<\/strong>。<\/p>\n<div class=\"cp\" id=\"cp_d4c3\" data-ans=\"2\"><div class=\"cph\">🧩 隨堂小測 3<span class=\"ref\">考科一 2.5<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">某 IoT 平台即將上線。資安團隊在上線前，由專人「模擬駭客實際攻擊」運行中的系統，嘗試找出可被利用的漏洞。依 SDLC 資安掃描，這項工作稱為？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 靜態程式碼弱點掃描<\/button><button class=\"opt cpo\" data-k=\"1\">B. 第三方函式庫弱點掃描<\/button><button class=\"opt cpo\" data-k=\"2\">C. 滲透測試<\/button><button class=\"opt cpo\" data-k=\"3\">D. 災難復原演練<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div>上線前與定期由專人模擬攻擊＝<span class=\"gl\" data-g=\"304\" tabindex=\"0\" role=\"button\">滲透測試<\/span>。靜態程式碼掃描在開發階段檢查原始碼；第三方函式庫掃描檢查套件的已知漏洞；<span class=\"gl\" data-g=\"300\" tabindex=\"0\" role=\"button\">災難復原<\/span>（DR）是災後恢復，不是找漏洞。<\/div><\/div><\/div>\n<h2>9. 物聯網隱私四原則 <span class=\"ref\">考科一 2.5<\/span><span class=\"pg\">指引 p.4-89～4-90<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>原則<\/th>\n<th>意思<\/th>\n<th>例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"305\" tabindex=\"0\" role=\"button\">匿名化<\/span>／假名化 Anonymization / Pseudonymization<\/td>\n<td>遮罩去識別化，或把識別資料換成匿名編號，處理到無法追溯個人<\/td>\n<td>感測資料與個資在同表或可 Join 時要處理<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"306\" tabindex=\"0\" role=\"button\">資料最小化<\/span> Data minimization<\/td>\n<td>只收集應用所需的必要資料<\/td>\n<td>門禁只記進出時間，不錄整段影像<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"307\" tabindex=\"0\" role=\"button\">告知與同意<\/span>、可攜與刪除<\/td>\n<td>告知收集哪些資料並取得同意；使用者可要求<strong>匯出<\/strong>與<strong>刪除<\/strong><\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>目的限制<\/td>\n<td>告知用途；<strong>要用在其他用途（例如匯入 <span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span> 分析）須再次取得同意<\/strong><\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><span class=\"ref\">考科一 2.5<\/span><span class=\"supp\">補充<\/span> 一般區分：<strong>匿名化<\/strong>＝不可逆、無法再識別；<strong>假名化<\/strong>＝以代號取代，持有對照表仍可回推。指引將兩者並列說明，考題若問「無法追溯到個人」選匿名化較穩。<\/p>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：<strong><span class=\"gl\" data-g=\"289\" tabindex=\"0\" role=\"button\">DDoS<\/span> 監控<\/strong>屬<span class=\"gl\" data-g=\"267\" tabindex=\"0\" role=\"button\">可用性<\/span>防護，<strong>對防止個資外洩沒有直接幫助<\/strong>；傳輸加密、身份認證與權限管控、去識別化才是（指引 p.4-92 練習題）。<\/p>\n<\/blockquote>\n<div class=\"cp\" id=\"cp_d4c4\" data-ans=\"2\"><div class=\"cph\">🧩 隨堂小測 4<span class=\"ref\">考科一 2.5<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">社區智慧門禁蒐集住戶進出紀錄時，告知的用途是「門禁管理」。管委會後來想把這些紀錄匯入 AI 分析住戶作息，用於社區行銷活動。依物聯網隱私原則，最恰當的做法是？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 資料已經蒐集了，可以直接使用<\/button><button class=\"opt cpo\" data-k=\"1\">B. 只要資料有加密，就可以用於新用途<\/button><button class=\"opt cpo\" data-k=\"2\">C. 要用於原告知目的以外的用途，須再次取得住戶同意<\/button><button class=\"opt cpo\" data-k=\"3\">D. 只要不對外公開分析結果，就不需告知<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div>「<span class=\"gl\" data-g=\"307\" tabindex=\"0\" role=\"button\">目的限制<\/span>」：告知用途後，若要用在其他用途（例如匯入 <span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span> 分析）須再次取得同意。加密保護的是<span class=\"gl\" data-g=\"267\" tabindex=\"0\" role=\"button\">機密性<\/span>，不能取代同意；不公開也不代表可以超出原目的使用。<\/div><\/div><\/div>\n<h3>今日 30 秒回顧<\/h3>\n<p><span class=\"gl\" data-g=\"219\" tabindex=\"0\" role=\"button\">中介軟體<\/span>＝<span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span>之後到應用服務之間的一切｜訊息中介：<span class=\"gl\" data-g=\"221\" tabindex=\"0\" role=\"button\">解耦<\/span>、緩衝、<span class=\"gl\" data-g=\"223\" tabindex=\"0\" role=\"button\">Kafka<\/span> 永久儲存｜<span class=\"gl\" data-g=\"228\" tabindex=\"0\" role=\"button\">IaaS<\/span> 虛擬硬體、<span class=\"gl\" data-g=\"229\" tabindex=\"0\" role=\"button\">PaaS<\/span> 託管平台（RDS）、<span class=\"gl\" data-g=\"230\" tabindex=\"0\" role=\"button\">SaaS<\/span> 軟體｜<span class=\"gl\" data-g=\"237\" tabindex=\"0\" role=\"button\">ACID<\/span>＝關聯式；<span class=\"gl\" data-g=\"236\" tabindex=\"0\" role=\"button\">NoSQL<\/span> 橫向擴充；<span class=\"gl\" data-g=\"239\" tabindex=\"0\" role=\"button\">Redis<\/span> 快取｜<span class=\"gl\" data-g=\"279\" tabindex=\"0\" role=\"button\">X.509<\/span> 重、<span class=\"gl\" data-g=\"280\" tabindex=\"0\" role=\"button\">Token<\/span> 輕、<span class=\"gl\" data-g=\"274\" tabindex=\"0\" role=\"button\">PSK<\/span> 最輕｜<span class=\"gl\" data-g=\"257\" tabindex=\"0\" role=\"button\">ETL<\/span>＝擷取轉換載入｜對稱 <span class=\"gl\" data-g=\"271\" tabindex=\"0\" role=\"button\">AES<\/span>＋<span class=\"gl\" data-g=\"273\" tabindex=\"0\" role=\"button\">ECDH<\/span> 交換；<span class=\"gl\" data-g=\"275\" tabindex=\"0\" role=\"button\">雜湊<\/span>＝完整性；<span class=\"gl\" data-g=\"277\" tabindex=\"0\" role=\"button\">簽章<\/span>＝不可否認｜<span class=\"gl\" data-g=\"268\" tabindex=\"0\" role=\"button\">AAA<\/span>、CIA｜<span class=\"gl\" data-g=\"301\" tabindex=\"0\" role=\"button\">RPO<\/span> 丟多少、<span class=\"gl\" data-g=\"302\" tabindex=\"0\" role=\"button\">RTO<\/span> 停多久｜<span class=\"gl\" data-g=\"290\" tabindex=\"0\" role=\"button\">Mirai<\/span>＝DDoS｜<span class=\"gl\" data-g=\"119\" tabindex=\"0\" role=\"button\">Repeater<\/span> 不能隔離｜匿名化、最小化、同意、目的限制。<\/p>", "audio": {"src": "audio/d04.mp3?v=2", "dur": 700}, "questions": [{"id": "d4q1", "n": 1, "opts": ["NFC＋HTTP", "Wi-Fi HaLow＋FTP", "BLE＋SMTP", "RS-485＋Modbus RTU"], "exp": "指引 p.4-73：智慧城市常用 Ethernet＋TCP/IP；工業環境常用 RS232/485＋Modbus RTU，或 Ethernet＋Modbus TCP/IP。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "依指引說明，在工業環境中閘道器將資料傳送到後端，下列哪一組「實體層＋通訊協定」組合最常見？", "ref": "考科一 2.4", "src": "指引 p.4-73", "ans": 3, "stemH": "依指引說明，在工業環境中閘道器將資料傳送到後端，下列哪一組「實體層＋通訊協定」組合最常見？", "optsH": ["NFC＋HTTP", "Wi-Fi HaLow＋FTP", "BLE＋SMTP", "RS-485＋Modbus RTU"], "expH": "指引 p.4-73：智慧城市常用 <span class=\"gl\" data-g=\"120\" tabindex=\"0\" role=\"button\">Ethernet<\/span>＋<span class=\"gl\" data-g=\"99\" tabindex=\"0\" role=\"button\">TCP/IP<\/span>；工業環境常用 <span class=\"gl\" data-g=\"201\" tabindex=\"0\" role=\"button\">RS232<\/span>/485＋<span class=\"gl\" data-g=\"194\" tabindex=\"0\" role=\"button\">Modbus RTU<\/span>，或 Ethernet＋<span class=\"gl\" data-g=\"196\" tabindex=\"0\" role=\"button\">Modbus TCP/IP<\/span>。"}, {"id": "d4q2", "n": 2, "opts": ["將資料接收與應用處理解耦", "高併發時暫存訊息、逐一分派，保護後端資料庫", "依主題（Topic）將訊息分派給有興趣的接收者", "取代感測器，直接量測物理量"], "exp": "訊息中介軟體負責解耦、緩衝高併發、依主題分派，並可選擇具永久儲存能力者（如 Kafka）避免訊息遺失。它是軟體元件，不能量測物理量。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "在大量感測器同時上傳資料的系統中加入訊息中介軟體（如 Kafka、RabbitMQ），其主要目的「不」包括下列何者？", "ref": "考科一 2.4", "src": "指引 p.4-74～4-75", "ans": 3, "stemH": "在大量感測器同時上傳資料的系統中加入訊息中介軟體（如 Kafka、RabbitMQ），其主要目的「不」包括下列何者？", "optsH": ["將資料接收與應用處理解耦", "高併發時暫存訊息、逐一分派，保護後端資料庫", "依主題（Topic）將訊息分派給有興趣的接收者", "取代感測器，直接量測物理量"], "expH": "<span class=\"gl\" data-g=\"220\" tabindex=\"0\" role=\"button\">訊息中介軟體<\/span>負責<span class=\"gl\" data-g=\"221\" tabindex=\"0\" role=\"button\">解耦<\/span>、緩衝高併發、依主題分派，並可選擇具永久儲存能力者（如 <span class=\"gl\" data-g=\"223\" tabindex=\"0\" role=\"button\">Kafka<\/span>）避免訊息遺失。它是軟體元件，不能量測物理量。"}, {"id": "d4q3", "n": 3, "opts": ["永久儲存（Persistent Storage），例如 Kafka", "記憶體快取（Memory-cache）", "只支援 QoS 0 的 Broker", "不需儲存的 UDP 廣播"], "exp": "指引 p.4-75：訊息很重要、未分派前不能因電力或當機遺失時，選擇具永久儲存能力的訊息中介軟體，如 Kafka。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "若訊息「在分派前絕不能因為電力中斷或當機而遺失」，指引建議選擇具備哪種能力的訊息中介軟體？", "ref": "考科一 2.4", "src": "指引 p.4-75", "ans": 0, "stemH": "若訊息「在分派前絕不能因為電力中斷或當機而遺失」，指引建議選擇具備哪種能力的訊息中介軟體？", "optsH": ["永久儲存（Persistent Storage），例如 Kafka", "記憶體快取（Memory-cache）", "只支援 QoS 0 的 Broker", "不需儲存的 UDP 廣播"], "expH": "指引 p.4-75：訊息很重要、未分派前不能因電力或當機遺失時，選擇具永久儲存能力的<span class=\"gl\" data-g=\"220\" tabindex=\"0\" role=\"button\">訊息中介軟體<\/span>，如 <span class=\"gl\" data-g=\"223\" tabindex=\"0\" role=\"button\">Kafka<\/span>。"}, {"id": "d4q4", "n": 4, "opts": ["從 SaaS 改為 IaaS", "從 PaaS 改為 IaaS", "從 IaaS 改為 PaaS", "從 On-Premise 改為 SaaS"], "exp": "指引 p.4-76～4-77：租 EC2／Compute Engine 自己裝 SQL Server 是 IaaS 的使用邏輯；RDS／Cloud SQL 已提供修補與備份，屬於 PaaS。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某團隊租用雲端虛擬機自行安裝 SQL Server，必須自己更新作業系統與資料庫版本、做備份。若改用 AWS RDS／GCP Cloud SQL 這類託管資料庫，則屬於從哪一種服務模型改為哪一種？", "ref": "考科一 2.4", "src": "指引 p.4-76～4-77", "ans": 2, "stemH": "某團隊租用雲端虛擬機自行安裝 SQL Server，必須自己更新作業系統與資料庫版本、做備份。若改用 AWS RDS／GCP Cloud SQL 這類託管資料庫，則屬於從哪一種服務模型改為哪一種？", "optsH": ["從 SaaS 改為 IaaS", "從 PaaS 改為 IaaS", "從 IaaS 改為 PaaS", "從 On-Premise 改為 SaaS"], "expH": "指引 p.4-76～4-77：租 EC2／Compute Engine 自己裝 <span class=\"gl\" data-g=\"240\" tabindex=\"0\" role=\"button\">SQL<\/span> Server 是 <span class=\"gl\" data-g=\"228\" tabindex=\"0\" role=\"button\">IaaS<\/span> 的使用邏輯；RDS／Cloud SQL 已提供修補與備份，屬於 <span class=\"gl\" data-g=\"229\" tabindex=\"0\" role=\"button\">PaaS<\/span>。"}, {"id": "d4q5", "n": 5, "opts": ["Concurrency（並行性）", "Consistency（一致性）", "Compression（壓縮性）", "Confidentiality（機密性）"], "exp": "ACID＝原子性 Atomicity、一致性 Consistency、隔離性 Isolation、持久性 Durability。Confidentiality 是資安 CIA 的 C，別搞混。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "關聯式資料庫提供的 ACID 特性中，「C」代表什麼？", "ref": "考科一 2.4", "src": "指引 p.4-77", "ans": 1, "stemH": "關聯式資料庫提供的 ACID 特性中，「C」代表什麼？", "optsH": ["Concurrency（並行性）", "Consistency（一致性）", "Compression（壓縮性）", "Confidentiality（機密性）"], "expH": "<span class=\"gl\" data-g=\"237\" tabindex=\"0\" role=\"button\">ACID<\/span>＝原子性 Atomicity、一致性 Consistency、隔離性 Isolation、持久性 Durability。Confidentiality 是資安 <span class=\"gl\" data-g=\"267\" tabindex=\"0\" role=\"button\">CIA<\/span> 的 C，別搞混。"}, {"id": "d4q6", "n": 6, "opts": ["X.509 憑證", "完全不做驗證", "大型語言模型驗證", "共享金鑰（Pre-shared key, PSK）"], "exp": "X.509 安全性極高但運算與管理負擔重，適合閘道器、車聯網；Token 適合應用服務的軟體元件；PSK 適合算力極低的設備。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "一顆算力極低的感測節點需要與閘道器互相驗證身份，指引建議較適合採用哪一種機制？", "ref": "考科一 2.4", "src": "指引 p.4-78", "ans": 3, "stemH": "一顆算力極低的感測節點需要與閘道器互相驗證身份，指引建議較適合採用哪一種機制？", "optsH": ["X.509 憑證", "完全不做驗證", "大型語言模型驗證", "共享金鑰（Pre-shared key, PSK）"], "expH": "<span class=\"gl\" data-g=\"279\" tabindex=\"0\" role=\"button\">X.509<\/span> 安全性極高但運算與管理負擔重，適合<span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span>、<span class=\"gl\" data-g=\"170\" tabindex=\"0\" role=\"button\">車聯網<\/span>；<span class=\"gl\" data-g=\"280\" tabindex=\"0\" role=\"button\">Token<\/span> 適合應用服務的軟體元件；<span class=\"gl\" data-g=\"274\" tabindex=\"0\" role=\"button\">PSK<\/span> 適合算力極低的設備。"}, {"id": "d4q7", "n": 7, "opts": ["ETL", "ACID", "OTA", "SLA"], "exp": "ETL＝Extract（擷取）、Transform（轉換）、Load（載入），將原始資料清洗後導入 Hadoop、Spark、BigQuery 等大數據工具。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "在進行資料探勘之前，需要把雜亂的原始資料「擷取、轉換、載入」到大數據平台，這個過程稱為？", "ref": "考科一 2.4", "src": "指引 p.4-78", "ans": 0, "stemH": "在進行資料探勘之前，需要把雜亂的原始資料「擷取、轉換、載入」到大數據平台，這個過程稱為？", "optsH": ["ETL", "ACID", "OTA", "SLA"], "expH": "<span class=\"gl\" data-g=\"257\" tabindex=\"0\" role=\"button\">ETL<\/span>＝Extract（擷取）、Transform（轉換）、Load（載入），將原始資料清洗後導入 <span class=\"gl\" data-g=\"258\" tabindex=\"0\" role=\"button\">Hadoop<\/span>、Spark、BigQuery 等大數據工具。"}, {"id": "d4q8", "n": 8, "opts": ["以明文儲存", "以雜湊（如 SHA256）處理後儲存", "以 Base64 編碼儲存", "改用 UDP 傳輸"], "exp": "指引 p.4-85：雜湊不易由結果反推原文，能以輕量方式達到隱密效果，使用者帳號密碼、API 存取金鑰都可用雜湊處理。Base64 只是編碼、可直接還原。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "系統要「儲存使用者密碼」並且讓資料庫即使外洩也不容易被反推出原始密碼，最適合的處理方式是？", "ref": "考科一 2.5", "src": "指引 p.4-85", "ans": 1, "st
