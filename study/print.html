半雙工是雙向但同時只能一方（對講機）；全雙工是雙方可同時傳（電話）；同步／<span class=\"gl\" data-g=\"372\" tabindex=\"0\" role=\"button\">非同步<\/span>是依收發時序的另一種分法。"}, {"ref": "考科一 3.2", "opts": ["鮑率 9600、8 個資料位元、無同位元（No parity）、1 個停止位元", "時脈 9600 Hz、8 條資料線、無地線、1 個主裝置", "I²C 位址 9600、8 個從裝置、1 個主裝置", "SPI 速度 9600 MHz、8 個片選"], "exp": "「9600 8N1」是 UART 常見設定：鮑率 9600、8 個資料位元、N＝無同位元、1 個停止位元。UART 沒有時脈線，雙方要先約好這些參數，否則會出現亂碼。", "stem": "某 GPS 模組規格書寫著序列埠設定「9600 8N1」。下列解讀何者正確？", "ans": 0, "id": "d5c4", "n": 4, "stemH": "某 GPS 模組規格書寫著序列埠設定「9600 8N1」。下列解讀何者正確？", "optsH": ["鮑率 9600、8 個資料位元、無同位元（No parity）、1 個停止位元", "時脈 9600 Hz、8 條資料線、無地線、1 個主裝置", "I²C 位址 9600、8 個從裝置、1 個主裝置", "SPI 速度 9600 MHz、8 個片選"], "expH": "「<span class=\"gl\" data-g=\"396\" tabindex=\"0\" role=\"button\">9600 8N1<\/span>」是 <span class=\"gl\" data-g=\"384\" tabindex=\"0\" role=\"button\">UART<\/span> 常見設定：<span class=\"gl\" data-g=\"375\" tabindex=\"0\" role=\"button\">鮑率<\/span> 9600、8 個資料位元、N＝無<span class=\"gl\" data-g=\"373\" tabindex=\"0\" role=\"button\">同位元<\/span>、1 個<span class=\"gl\" data-g=\"374\" tabindex=\"0\" role=\"button\">停止位元<\/span>。UART 沒有<span class=\"gl\" data-g=\"388\" tabindex=\"0\" role=\"button\">時脈線<\/span>，雙方要先約好這些參數，否則會出現亂碼。"}], "lecture": "<h3>今天要搞懂的 5 件事<\/h3>\n<ol>\n<li><span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>的三種<span class=\"gl\" data-g=\"10\" tabindex=\"0\" role=\"button\">分類<\/span>方式與 8 個性能參數（<span class=\"gl\" data-g=\"329\" tabindex=\"0\" role=\"button\">誤差<\/span>、<span class=\"gl\" data-g=\"324\" tabindex=\"0\" role=\"button\">精確度<\/span>、<span class=\"gl\" data-g=\"326\" tabindex=\"0\" role=\"button\">重複性<\/span>、<span class=\"gl\" data-g=\"323\" tabindex=\"0\" role=\"button\">靈敏度<\/span>、<span class=\"gl\" data-g=\"322\" tabindex=\"0\" role=\"button\">解析度<\/span>、<span class=\"gl\" data-g=\"330\" tabindex=\"0\" role=\"button\">量測範圍<\/span>、<span class=\"gl\" data-g=\"327\" tabindex=\"0\" role=\"button\">線性度<\/span>、<span class=\"gl\" data-g=\"328\" tabindex=\"0\" role=\"button\">遲滯<\/span>）。<\/li>\n<li>力量／振動／溫度／位移／光感測器原理：壓電、<span class=\"gl\" data-g=\"353\" tabindex=\"0\" role=\"button\">應變規<\/span>＋<span class=\"gl\" data-g=\"355\" tabindex=\"0\" role=\"button\">惠斯登電橋<\/span>、<span class=\"gl\" data-g=\"342\" tabindex=\"0\" role=\"button\">NTC<\/span>/<span class=\"gl\" data-g=\"343\" tabindex=\"0\" role=\"button\">PTC<\/span>/<span class=\"gl\" data-g=\"344\" tabindex=\"0\" role=\"button\">CTR<\/span>、<span class=\"gl\" data-g=\"345\" tabindex=\"0\" role=\"button\">RTD<\/span>（<span class=\"gl\" data-g=\"346\" tabindex=\"0\" role=\"button\">Pt100<\/span>）、<span class=\"gl\" data-g=\"347\" tabindex=\"0\" role=\"button\">熱電偶<\/span>（席貝克＋<span class=\"gl\" data-g=\"350\" tabindex=\"0\" role=\"button\">冷點補償<\/span>）、<span class=\"gl\" data-g=\"356\" tabindex=\"0\" role=\"button\">LVDT<\/span>、<span class=\"gl\" data-g=\"357\" tabindex=\"0\" role=\"button\">渦電流<\/span>。<\/li>\n<li>訊號三要素（<span class=\"gl\" data-g=\"365\" tabindex=\"0\" role=\"button\">振幅<\/span>、<span class=\"gl\" data-g=\"366\" tabindex=\"0\" role=\"button\">頻率<\/span>、<span class=\"gl\" data-g=\"367\" tabindex=\"0\" role=\"button\">相位<\/span>）、<span class=\"gl\" data-g=\"369\" tabindex=\"0\" role=\"button\">串列<\/span> vs. 並列、<span class=\"gl\" data-g=\"371\" tabindex=\"0\" role=\"button\">單工<\/span>/半雙工/全雙工、同步/<span class=\"gl\" data-g=\"372\" tabindex=\"0\" role=\"button\">非同步<\/span>。<\/li>\n<li><span class=\"gl\" data-g=\"48\" tabindex=\"0\" role=\"button\">頻寬<\/span>、<span class=\"gl\" data-g=\"376\" tabindex=\"0\" role=\"button\">位元速率<\/span>、<span class=\"gl\" data-g=\"375\" tabindex=\"0\" role=\"button\">鮑率<\/span>；<span class=\"gl\" data-g=\"218\" tabindex=\"0\" role=\"button\">Baudot<\/span> 與 <span class=\"gl\" data-g=\"217\" tabindex=\"0\" role=\"button\">ASCII<\/span>；<span class=\"gl\" data-g=\"377\" tabindex=\"0\" role=\"button\">AM<\/span>/FM/PM 與 <span class=\"gl\" data-g=\"378\" tabindex=\"0\" role=\"button\">ASK<\/span>/FSK/<span class=\"gl\" data-g=\"274\" tabindex=\"0\" role=\"button\">PSK<\/span>。<\/li>\n<li><span class=\"gl\" data-g=\"207\" tabindex=\"0\" role=\"button\">主從架構<\/span>、<span class=\"gl\" data-g=\"382\" tabindex=\"0\" role=\"button\">網路拓樸<\/span>；<span class=\"gl\" data-g=\"384\" tabindex=\"0\" role=\"button\">UART<\/span>、<span class=\"gl\" data-g=\"385\" tabindex=\"0\" role=\"button\">I²C<\/span>、<span class=\"gl\" data-g=\"386\" tabindex=\"0\" role=\"button\">SPI<\/span> 的比較。<\/li>\n<\/ol>\n<h2>1. 感測器是什麼、怎麼分類 <span class=\"ref\">考科一 3.1<\/span><span class=\"pg\">指引 p.5-3～5-5<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>把待測的物理量或化學量（溫度、壓力、濕度、長度、速度、振動、聲音、pH…）<strong>轉換成可記錄的形式，通常是電訊號<\/strong>。例：力量元件受力形變 → 電阻改變 → 量電阻推算受力。<\/p>\n<table>\n<thead>\n<tr>\n<th><span class=\"gl\" data-g=\"10\" tabindex=\"0\" role=\"button\">分類<\/span>依據<\/th>\n<th>類別<\/th>\n<th>說明（依指引）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>是否需外加電源<\/td>\n<td><strong>主動式 Active<\/strong><\/td>\n<td><strong>不需外加激發電源<\/strong>，待測量改變即產生電壓或電流，例：<strong><span class=\"gl\" data-g=\"347\" tabindex=\"0\" role=\"button\">熱電偶<\/span><\/strong><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>被動式 Passive<\/strong><\/td>\n<td><strong>需外加激發電源<\/strong>才有輸出，例：<span class=\"gl\" data-g=\"334\" tabindex=\"0\" role=\"button\">加速規<\/span>、<span class=\"gl\" data-g=\"353\" tabindex=\"0\" role=\"button\">應變規<\/span>、麥克風<\/td>\n<\/tr>\n<tr>\n<td>量測方式<\/td>\n<td>接觸式／非接觸式<\/td>\n<td>高溫鐵水等極端條件 → 必須非接觸<\/td>\n<\/tr>\n<tr>\n<td>輸出訊號<\/td>\n<td>機械式／電子式<\/td>\n<td>電子式再分：<strong>數位<\/strong>（只有 0 或 1）、<strong>類比<\/strong>（隨時間連續變化）、<strong>脈衝<\/strong>（一連串 ON/OFF）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 標註<\/strong>：主動／被動式的定義在不同教科書<strong>剛好相反<\/strong>（有些書把「需外加電源」稱為主動式）。<strong>本考試以官方學習指引 p.5-3 為準<\/strong>：熱電偶＝主動式（自己發電）、應變規＝被動式（要外加電源）。<\/p>\n<\/blockquote>\n<h2>2. 感測器 8 大性能參數 <span class=\"ref\">考科一 3.1<\/span><span class=\"pg\">指引 p.5-5～5-6<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>參數<\/th>\n<th>意思<\/th>\n<th>公式／重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"329\" tabindex=\"0\" role=\"button\">誤差<\/span> Error<\/td>\n<td>量測值與真實值的差<\/td>\n<td>靜態誤差＝測量值−實際值；動態誤差隨時間變化<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"324\" tabindex=\"0\" role=\"button\">精確度<\/span>（準確度）Accuracy<\/td>\n<td>靜態誤差相對實際值的百分比，越小越接近真值<\/td>\n<td>（測量值−實際值）／實際值 ×100%<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"326\" tabindex=\"0\" role=\"button\">重複性<\/span> Repeatability<\/td>\n<td>同條件下多次量測的變化量，越小越可靠<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"323\" tabindex=\"0\" role=\"button\">靈敏度<\/span> Sensitivity<\/td>\n<td>輸出訊號／待測物理量<\/td>\n<td>例：10 mV/°C<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"322\" tabindex=\"0\" role=\"button\">解析度<\/span> Resolution<\/td>\n<td>能量到的最小量值；數位化時與 <span class=\"gl\" data-g=\"320\" tabindex=\"0\" role=\"button\">ADC<\/span> 位元數有關<\/td>\n<td>n 位元可表示 <strong>2ⁿ<\/strong> 種值<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"330\" tabindex=\"0\" role=\"button\">量測範圍<\/span> Range<\/td>\n<td>可正常量測的上限與下限<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"327\" tabindex=\"0\" role=\"button\">線性度<\/span> Linearity<\/td>\n<td>校準曲線與擬合直線的最大偏差／滿刻度 %，越小越線性<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"328\" tabindex=\"0\" role=\"button\">遲滯<\/span>（滯後）Hysteresis<\/td>\n<td>量測值上升與下降時，<strong>同一數值量到不同結果<\/strong>（曲線不重合）<\/td>\n<td>需建立遲滯模型補償；<strong>不是時間<span class=\"gl\" data-g=\"47\" tabindex=\"0\" role=\"button\">延遲<\/span><\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 計算例（ADC 解析度）<\/strong> <span class=\"ref\">考科一 3.1<\/span><span class=\"supp\">補充<\/span>：0–10 V 的訊號用 10 位元 ADC → 2¹⁰＝1024 階 → 每階約 10/1024 ≈ 9.8 mV（嚴謹算法除以 2ⁿ−1＝1023 也可，選項通常只差一點，挑最接近的）。<\/p>\n<p><strong>⚠️ 易混淆<\/strong>：精確度（Accuracy，準）＝離真值多近；<span class=\"gl\" data-g=\"325\" tabindex=\"0\" role=\"button\">精密度<\/span>（Precision，精）／重複性＝多次量測彼此多接近。指引練習題把 Precision 譯為「精度」、Accuracy 譯為「準度」（p.5-11）。誤差<strong>不是<\/strong>「平均值−標準差」。<\/p>\n<\/blockquote>\n<div class=\"cp\" id=\"cp_d5c1\" data-ans=\"0\"><div class=\"cph\">🧩 隨堂小測 1<span class=\"ref\">考科一 3.1<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">用一台電子秤重複量測 100.0 g 的標準砝碼 10 次，結果都落在 102.0～102.1 g 之間。關於這台秤，下列敘述何者最恰當？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 精密度（重複性）好，但準確度（精確度）差<\/button><button class=\"opt cpo\" data-k=\"1\">B. 準確度好，但精密度差<\/button><button class=\"opt cpo\" data-k=\"2\">C. 準確度與精密度都很好<\/button><button class=\"opt cpo\" data-k=\"3\">D. 這是遲滯現象<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div>10 次結果彼此非常接近 → <span class=\"gl\" data-g=\"325\" tabindex=\"0\" role=\"button\">精密度<\/span>／<span class=\"gl\" data-g=\"326\" tabindex=\"0\" role=\"button\">重複性<\/span>好；但都偏離真值約 2 g → <span class=\"gl\" data-g=\"324\" tabindex=\"0\" role=\"button\">準確度<\/span>差。<span class=\"gl\" data-g=\"328\" tabindex=\"0\" role=\"button\">遲滯<\/span>是指上升與下降時同一數值量到不同結果，與此情境無關。<\/div><\/div><\/div>\n<h2>3. 力量與振動感測器 <span class=\"ref\">考科一 3.1<\/span><span class=\"pg\">指引 p.5-7～5-8<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>類型<\/th>\n<th>原理<\/th>\n<th>輸出<\/th>\n<th>搭配電路<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"351\" tabindex=\"0\" role=\"button\">壓電式<\/span>（石英、鈦酸鋇陶瓷）<\/td>\n<td><strong>壓電效應<\/strong>：受壓表面產生<strong>電荷<\/strong>，與應力成正比<\/td>\n<td>電荷（極微小）<\/td>\n<td><strong><span class=\"gl\" data-g=\"352\" tabindex=\"0\" role=\"button\">電荷放大器<\/span><\/strong>轉成電壓或電流<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"353\" tabindex=\"0\" role=\"button\">應變規<\/span> Strain Gauge<\/td>\n<td><strong><span class=\"gl\" data-g=\"354\" tabindex=\"0\" role=\"button\">壓阻效應<\/span><\/strong>：導體電阻與長度成正比、與截面積成反比，形變→電阻變化<\/td>\n<td>電阻變化<\/td>\n<td><strong><span class=\"gl\" data-g=\"355\" tabindex=\"0\" role=\"button\">惠斯登電橋<\/span><\/strong><\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"334\" tabindex=\"0\" role=\"button\">加速規<\/span>（振動感測器）<\/td>\n<td><strong>牛頓第二定律 F＝m×a<\/strong>：內部質量塊的慣性力換算加速度<\/td>\n<td>依種類<\/td>\n<td>分<strong>壓阻式、壓電式、電容式<\/strong>；壓電式加速規依電荷變化推估振動<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><span class=\"ref\">考科一 3.1<\/span><span class=\"supp\">補充<\/span> <strong>惠斯登電橋<\/strong>：四個電阻接成菱形，當 <strong>R1/R2＝R3/R4<\/strong> 時電橋平衡、輸出電壓為 0；應變規電阻有微小變化 ΔR 就會打破平衡，產生與 ΔR 近似成正比的小電壓，再經放大器放大。優點是能<strong>量測非常微小的電阻變化<\/strong>並抵消溫度等共同變化（半橋、全橋接法）。<\/p>\n<blockquote>\n<p><strong>⚠️ 標註（指引疑誤）<\/strong>：指引 p.5-7 與練習題解析寫「應變規<strong>受壓力時電阻增加、受張力時減少<\/strong>」。依一般物理（R＝ρL/A），<strong>受拉（張力）時變長變細→電阻增加；受壓時電阻減少<\/strong>，與指引寫法相反。考題若只問「利用電阻變化的<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>是哪種」→ 答<strong>應變規<\/strong>即可；若直接考方向，請以題目敘述為準並留意此差異。<\/p>\n<\/blockquote>\n<h2>4. 溫度感測器 <span class=\"ref\">考科一 3.1<\/span><span class=\"pg\">指引 p.5-8～5-9<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>類型<\/th>\n<th>原理<\/th>\n<th>特性<\/th>\n<th>必背<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"341\" tabindex=\"0\" role=\"button\">熱敏電阻<\/span> Thermistor<\/td>\n<td>半導體電阻隨溫度變化<\/td>\n<td>一般 −90～130°C（調整材料可擴展到高溫）<\/td>\n<td><strong><span class=\"gl\" data-g=\"342\" tabindex=\"0\" role=\"button\">NTC<\/span><\/strong>：溫度↑電阻↓，<span class=\"gl\" data-g=\"323\" tabindex=\"0\" role=\"button\">靈敏度<\/span>極高（一般說熱敏電阻多指 NTC）；<strong><span class=\"gl\" data-g=\"343\" tabindex=\"0\" role=\"button\">PTC<\/span><\/strong>：到居禮溫度電阻<strong>急升<\/strong>，用於電路保護；<strong><span class=\"gl\" data-g=\"344\" tabindex=\"0\" role=\"button\">CTR<\/span><\/strong>：到臨界溫度電阻<strong>驟降<\/strong><\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"345\" tabindex=\"0\" role=\"button\">電阻式溫度計<\/span> RTD<\/td>\n<td>金屬電阻隨溫度上升而增加<\/td>\n<td>靈敏度較低，需周邊電路降低<strong>線阻<\/strong><span class=\"gl\" data-g=\"329\" tabindex=\"0\" role=\"button\">誤差<\/span><\/td>\n<td><strong><span class=\"gl\" data-g=\"346\" tabindex=\"0\" role=\"button\">Pt100<\/span>：0°C 時 100 Ω<\/strong><\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"347\" tabindex=\"0\" role=\"button\">熱電偶<\/span> Thermocouple<\/td>\n<td><strong><span class=\"gl\" data-g=\"348\" tabindex=\"0\" role=\"button\">席貝克效應<\/span>（Seebeck）<\/strong>：兩種<strong>不同金屬<\/strong>一端焊接，兩端溫差產生電位差<\/td>\n<td><span class=\"gl\" data-g=\"330\" tabindex=\"0\" role=\"button\">量測範圍<\/span>廣；線徑會影響量測範圍<\/td>\n<td>查表假設冷端 0°C → 需<strong>冷點（冷接點）補償<\/strong><\/td>\n<\/tr>\n<tr>\n<td>非接觸式（紅外線）<\/td>\n<td>偵測物體熱輻射<\/td>\n<td>適合移動物件、極端環境<\/td>\n<td>受介質干擾，需依<strong><span class=\"gl\" data-g=\"362\" tabindex=\"0\" role=\"button\">放射率<\/span><\/strong>修正<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 計算例（RTD）<\/strong>：R(T) ≈ R₀(1＋αT)。Pt100、α 取 0.004 → 100°C 時 R ≈ 100×(1＋0.4)＝<strong>140 Ω<\/strong>（指引練習題用 0.004；實際標準 Pt100 α≈0.00385，100°C 約 <strong>138.5 Ω<\/strong>，兩者都可能出現，看題目給的係數）。<\/p>\n<p><strong>⚠️ 易混淆<\/strong>：席貝克（Seebeck）＝溫差→電壓（熱電偶）；貝爾帖（<span class=\"gl\" data-g=\"349\" tabindex=\"0\" role=\"button\">Peltier<\/span>）＝電流→溫差（致冷晶片）。<\/p>\n<\/blockquote>\n<div class=\"cp\" id=\"cp_d5c2\" data-ans=\"0\"><div class=\"cph\">🧩 隨堂小測 2<span class=\"ref\">考科一 3.1<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">電阻式溫度計（RTD，如 Pt100）靈敏度較低，每度只變化不到 1 Ω。依指引，RTD 量測時特別需要搭配周邊電路來降低哪一種誤差來源？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 導線本身的電阻（線阻）造成的誤差<\/button><button class=\"opt cpo\" data-k=\"1\">B. 冷接點溫度造成的誤差<\/button><button class=\"opt cpo\" data-k=\"2\">C. 放射率設定錯誤造成的誤差<\/button><button class=\"opt cpo\" data-k=\"3\">D. 壓電電荷外洩造成的誤差<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div><span class=\"gl\" data-g=\"345\" tabindex=\"0\" role=\"button\">RTD<\/span> 靠金屬電阻變化量溫，變化量小，連接導線本身的電阻就會造成明顯<span class=\"gl\" data-g=\"329\" tabindex=\"0\" role=\"button\">誤差<\/span>，需周邊電路降低線阻誤差。<span class=\"gl\" data-g=\"350\" tabindex=\"0\" role=\"button\">冷接點補償<\/span>是<span class=\"gl\" data-g=\"347\" tabindex=\"0\" role=\"button\">熱電偶<\/span>的問題；<span class=\"gl\" data-g=\"362\" tabindex=\"0\" role=\"button\">放射率<\/span>是紅外線測溫的問題；電荷是壓電<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>的特性。<\/div><\/div><\/div>\n<h2>5. 位移與光感測器 <span class=\"ref\">考科一 3.1<\/span><span class=\"pg\">指引 p.5-9～5-10<\/span><\/h2>\n<ul>\n<li><strong>位移<\/strong>：接觸式＝刻度盤、<strong><span class=\"gl\" data-g=\"356\" tabindex=\"0\" role=\"button\">LVDT<\/span>（線性可變差動變壓器）<\/strong>、電阻式<span class=\"gl\" data-g=\"363\" tabindex=\"0\" role=\"button\">分壓<\/span>元件；<strong>非接觸式<\/strong>＝<strong><span class=\"gl\" data-g=\"357\" tabindex=\"0\" role=\"button\">渦電流位移計<\/span><\/strong>（高頻磁場在金屬產生渦電流、改變線圈阻抗）、雷射位移計（1D 共焦或三角反射；2D/3D 用光切法＋<strong><span class=\"gl\" data-g=\"358\" tabindex=\"0\" role=\"button\">CMOS<\/span><\/strong> 影像<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>）、白光共焦／白光干涉（3D，以「面」量測、不受材質顏色影響）。<\/li>\n<li><strong>光感測器<\/strong>基於<strong><span class=\"gl\" data-g=\"359\" tabindex=\"0\" role=\"button\">光電效應<\/span><\/strong>，三類：<strong>光傳導<\/strong>（光→電阻變化：<span class=\"gl\" data-g=\"360\" tabindex=\"0\" role=\"button\">光敏電阻<\/span>、<span class=\"gl\" data-g=\"361\" tabindex=\"0\" role=\"button\">光二極體<\/span>、紅外線二極體）、<strong>光發射<\/strong>（電子脫離表面射出）、<strong>光伏特<\/strong>（介面受光直接產生電壓差，如太陽能電池）。<\/li>\n<\/ul>\n<p><span class=\"ref\">考科一 3.1<\/span><span class=\"pg\">指引 p.5-11～5-14 練習題<\/span> <span class=\"gl\" data-g=\"334\" tabindex=\"0\" role=\"button\">加速規<\/span>的選用：量<strong>微小振動選<span class=\"gl\" data-g=\"323\" tabindex=\"0\" role=\"button\">靈敏度<\/span>高<\/strong>的；加速規本身太重會產生<strong>質量效應<\/strong>影響量測（不是只要比待測物輕就好）。<\/p>\n<h2>6. 訊號基礎 <span class=\"ref\">考科一 3.2<\/span><span class=\"pg\">指引 p.5-15～5-17<\/span><\/h2>\n<ul>\n<li><strong><span class=\"gl\" data-g=\"318\" tabindex=\"0\" role=\"button\">類比訊號<\/span><\/strong>：<span class=\"gl\" data-g=\"365\" tabindex=\"0\" role=\"button\">振幅<\/span>隨時間連續變化（振動、溫度、聲音）；<strong><span class=\"gl\" data-g=\"319\" tabindex=\"0\" role=\"button\">數位訊號<\/span><\/strong>：一連串脈波，高低電壓代表 1 與 0（位元）。<\/li>\n<li>正弦波三要素：<strong>振幅（Amplitude）<\/strong>＝大小；<strong><span class=\"gl\" data-g=\"366\" tabindex=\"0\" role=\"button\">頻率<\/span>（Frequency）<\/strong>＝每秒重複次數，單位 Hz，<strong>是<span class=\"gl\" data-g=\"368\" tabindex=\"0\" role=\"button\">週期<\/span>的倒數<\/strong>；<strong><span class=\"gl\" data-g=\"367\" tabindex=\"0\" role=\"button\">相位<\/span>（Phase）<\/strong>＝波形在週期內的時間位置。<\/li>\n<li><strong>正弦與餘弦相差 90°<\/strong>（p.5-27）。週期性訊號：每隔相同時間重複，如週期性正弦波、方波。<\/li>\n<\/ul>\n<h2>7. 傳輸方式三種分法 <span class=\"ref\">考科一 3.2<\/span><span class=\"pg\">指引 p.5-17～5-18<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>分法<\/th>\n<th>類別<\/th>\n<th>重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>依傳輸線數與距離<\/td>\n<td><strong><span class=\"gl\" data-g=\"369\" tabindex=\"0\" role=\"button\">串列<\/span><\/strong>：一次一個位元<\/td>\n<td>100 呎以上多用；架設方便、易維護、線路成本低；缺點<strong>速率較慢<\/strong>；<span class=\"gl\" data-g=\"201\" tabindex=\"0\" role=\"button\">RS-232<\/span>、<span class=\"gl\" data-g=\"385\" tabindex=\"0\" role=\"button\">I²C<\/span>、<span class=\"gl\" data-g=\"386\" tabindex=\"0\" role=\"button\">SPI<\/span>、USB、網路<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>並列<\/strong>：多條線同時傳<\/td>\n<td>100 呎以內；優點<strong>速率快<\/strong>；缺點<strong>線路成本高、維修不易、易受干擾<\/strong>；IEEE 488<\/td>\n<\/tr>\n<tr>\n<td>依資料流向<\/td>\n<td><span class=\"gl\" data-g=\"371\" tabindex=\"0\" role=\"button\">單工<\/span>／半雙工／全雙工<\/td>\n<td>單工＝收音機、電視；半雙工＝<strong>對講機<\/strong>（雙向但同時只能一方）；全雙工＝<strong>電話<\/strong><\/td>\n<\/tr>\n<tr>\n<td>依收發時序<\/td>\n<td><strong><span class=\"gl\" data-g=\"372\" tabindex=\"0\" role=\"button\">非同步<\/span><\/strong><\/td>\n<td>一次一個字元（字元導向）；<strong><span class=\"gl\" data-g=\"374\" tabindex=\"0\" role=\"button\">起始位元<\/span>＋資料＋<span class=\"gl\" data-g=\"373\" tabindex=\"0\" role=\"button\">同位元<\/span>＋停止位元<\/strong>（起止式）<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>同步<\/strong><\/td>\n<td>以資料區塊為單位（區塊傳輸），先送 2 個同步字元；<strong>效率高於非同步<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"cp\" id=\"cp_d5c3\" data-ans=\"0\"><div class=\"cph\">🧩 隨堂小測 3<span class=\"ref\">考科一 3.2<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">工廠中控室透過廣播系統把公告「單向」播放到各區喇叭，各區無法回話。依資料流向分類，這屬於哪一種傳輸方式？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 單工<\/button><button class=\"opt cpo\" data-k=\"1\">B. 半雙工<\/button><button class=\"opt cpo\" data-k=\"2\">C. 全雙工<\/button><button class=\"opt cpo\" data-k=\"3\">D. 同步傳輸<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div>只能單一方向傳送＝<span class=\"gl\" data-g=\"371\" tabindex=\"0\" role=\"button\">單工<\/span>（例如收音機、電視）。半雙工是雙向但同時只能一方（對講機）；全雙工是雙方可同時傳（電話）；同步／<span class=\"gl\" data-g=\"372\" tabindex=\"0\" role=\"button\">非同步<\/span>是依收發時序的另一種分法。<\/div><\/div><\/div>\n<h2>8. 頻寬、鮑率、編碼與調變 <span class=\"ref\">考科一 3.2<\/span><span class=\"pg\">指引 p.5-18～5-20<\/span><\/h2>\n<ul>\n<li><strong><span class=\"gl\" data-g=\"48\" tabindex=\"0\" role=\"button\">頻寬<\/span><\/strong>兩種意義：①訊號最高與最低<span class=\"gl\" data-g=\"366\" tabindex=\"0\" role=\"button\">頻率<\/span>的差（100～5000 Hz → 頻寬 4900 Hz）；②傳輸媒體提供的速率（Cable Modem 2M/256K ＝ 下載 2 <span class=\"gl\" data-g=\"376\" tabindex=\"0\" role=\"button\">Mbps<\/span>、上傳 256 kbps）。頻率與波長成<strong>反比<\/strong>；整個頻率範圍稱為<strong><span class=\"gl\" data-g=\"380\" tabindex=\"0\" role=\"button\">頻譜<\/span><\/strong>，再分成頻帶。<\/li>\n<li><strong>位元速率<\/strong>＝每秒傳送的位元數（bps）；<strong><span class=\"gl\" data-g=\"375\" tabindex=\"0\" role=\"button\">鮑率<\/span>（Baud Rate）<\/strong>＝每秒傳送的<strong>訊號單元<\/strong>數，一個訊號單元可能含 2、3 個以上位元 → <strong>位元速率 ≥ 鮑率<\/strong>。<\/li>\n<li>編碼：<strong><span class=\"gl\" data-g=\"218\" tabindex=\"0\" role=\"button\">Baudot<\/span><\/strong>＝最早的 <strong>5 位元<\/strong>碼（電傳打字碼 Telex），2⁵＝32 種，用 Figure Shift／Letter Shift 擴充到 58 種，<strong>無檢查字元<\/strong>；<strong><span class=\"gl\" data-g=\"217\" tabindex=\"0\" role=\"button\">ASCII<\/span><\/strong>＝<strong>7 位元<\/strong>、128 種，擴充版 8 位元。<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th><span class=\"gl\" data-g=\"377\" tabindex=\"0\" role=\"button\">調變<\/span><\/th>\n<th>輸入<\/th>\n<th>改變<span class=\"gl\" data-g=\"379\" tabindex=\"0\" role=\"button\">載波<\/span>的什麼<\/th>\n<th>重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>AM <span class=\"gl\" data-g=\"365\" tabindex=\"0\" role=\"button\">振幅<\/span>調變<\/td>\n<td>類比資料→<span class=\"gl\" data-g=\"318\" tabindex=\"0\" role=\"button\">類比訊號<\/span><\/td>\n<td>振幅（頻率固定）<\/td>\n<td>指引：低速傳輸多用<\/td>\n<\/tr>\n<tr>\n<td>FM 頻率調變<\/td>\n<td>〃<\/td>\n<td>頻率（振幅固定）<\/td>\n<td><strong>抗雜訊比 AM 好<\/strong>；指引：300/600/1200 bps 多採 FM<\/td>\n<\/tr>\n<tr>\n<td>PM <span class=\"gl\" data-g=\"367\" tabindex=\"0\" role=\"button\">相位<\/span>調變<\/td>\n<td>〃<\/td>\n<td>相位<\/td>\n<td>指引：更高速傳輸用 PM<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"378\" tabindex=\"0\" role=\"button\">ASK<\/span>／FSK／PSK<\/td>\n<td><strong>數位資料→類比訊號<\/strong><\/td>\n<td>振幅／頻率／相位<\/td>\n<td>「移轉鍵式（Shift Keying）」＝數位版<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>9. 通訊架構與網路拓樸 <span class=\"ref\">考科一 3.2<\/span><span class=\"pg\">指引 p.5-21～5-24<\/span><\/h2>\n<ul>\n<li><strong>一對一<\/strong>最單純；<strong><span class=\"gl\" data-g=\"207\" tabindex=\"0\" role=\"button\">主從架構<\/span><\/strong>：同一時間只有一個設備（主站）發號司令，其他等待，硬體常以**<span class=\"gl\" data-g=\"381\" tabindex=\"0\" role=\"button\">匯流排<\/span>（Bus）**實現，如 <strong><span class=\"gl\" data-g=\"202\" tabindex=\"0\" role=\"button\">RS-485<\/span>、<span class=\"gl\" data-g=\"386\" tabindex=\"0\" role=\"button\">SPI<\/span><\/strong>。<\/li>\n<li><strong>Server-Client<\/strong> 也是主從：資料集中在 Server，被動等待多個 Client 連線；硬體需求較高，但集中管理、安全性較高。<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th><span class=\"gl\" data-g=\"382\" tabindex=\"0\" role=\"button\">拓樸<\/span><\/th>\n<th>優點<\/th>\n<th>缺點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>線性<\/td>\n<td>功能簡單易實現<\/td>\n<td>彈性不大<\/td>\n<\/tr>\n<tr>\n<td>星狀<\/td>\n<td>集中管理<\/td>\n<td><strong>核心故障整個網路失效<\/strong><\/td>\n<\/tr>\n<tr>\n<td>樹狀<\/td>\n<td><strong>易於擴充<\/strong>：可延伸很多分支，新節點易加入；<span class=\"gl\" data-g=\"12\" tabindex=\"0\" role=\"button\">分群<\/span>分階層有效管理資料流<\/td>\n<td>階層多時傳遞時間變長；<strong>對根節點依賴大<\/strong><\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"149\" tabindex=\"0\" role=\"button\">網狀<\/span><\/td>\n<td>可找最佳路徑、節點省電長久運作、可靠<\/td>\n<td>路由較複雜<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong><span class=\"gl\" data-g=\"383\" tabindex=\"0\" role=\"button\">通訊協定<\/span>（Protocol）<\/strong>＝建立在通訊介面上的資料格式與交換規則，通常分層設計（<span class=\"gl\" data-g=\"98\" tabindex=\"0\" role=\"button\">OSI<\/span>、<span class=\"gl\" data-g=\"99\" tabindex=\"0\" role=\"button\">TCP/IP<\/span>）。<\/li>\n<\/ul>\n<h2>10. UART、I²C、SPI 比較 <span class=\"ref\">考科一 3.2<\/span><span class=\"supp\">補充（指引 p.5-17、p.5-25～5-27 僅練習題提及）<\/span><\/h2>\n<p>能力指標明列 <span class=\"gl\" data-g=\"384\" tabindex=\"0\" role=\"button\">UART<\/span>、<span class=\"gl\" data-g=\"385\" tabindex=\"0\" role=\"button\">I²C<\/span>、<span class=\"gl\" data-g=\"386\" tabindex=\"0\" role=\"button\">SPI<\/span>，但指引正文只有簡短描述，以下為一般技術知識整理：<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>UART<\/th>\n<th>I²C<\/th>\n<th>SPI<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>同步方式<\/td>\n<td><strong><span class=\"gl\" data-g=\"372\" tabindex=\"0\" role=\"button\">非同步<\/span><\/strong>（無<span class=\"gl\" data-g=\"388\" tabindex=\"0\" role=\"button\">時脈線<\/span>，雙方先約定<strong><span class=\"gl\" data-g=\"375\" tabindex=\"0\" role=\"button\">鮑率<\/span><\/strong>）<\/td>\n<td><strong>同步<\/strong>（SCL 時脈）<\/td>\n<td><strong>同步<\/strong>（SCLK 時脈）<\/td>\n<\/tr>\n<tr>\n<td>線數<\/td>\n<td>TX、RX（＋<span class=\"gl\" data-g=\"419\" tabindex=\"0\" role=\"button\">GND<\/span>）<\/td>\n<td><strong>2 條：SDA 資料、SCL 時脈<\/strong><\/td>\n<td>4 條：SCLK、MOSI、MISO、<span class=\"gl\" data-g=\"387\" tabindex=\"0\" role=\"button\">SS<\/span>/CS（每個從裝置一條 CS）<\/td>\n<\/tr>\n<tr>\n<td>雙工<\/td>\n<td><strong><span class=\"gl\" data-g=\"371\" tabindex=\"0\" role=\"button\">全雙工<\/span><\/strong><\/td>\n<td><strong>半雙工<\/strong>（只有一條資料線）<\/td>\n<td><strong>全雙工<\/strong><\/td>\n<\/tr>\n<tr>\n<td>多裝置<\/td>\n<td>一對一<\/td>\n<td>多主多從，靠 <strong>7 位元位址<\/strong>區分；需<strong><span class=\"gl\" data-g=\"389\" tabindex=\"0\" role=\"button\">上拉電阻<\/span><\/strong><\/td>\n<td>一主多從，靠<strong>片選 CS<\/strong><\/td>\n<\/tr>\n<tr>\n<td>速度<\/td>\n<td>中（如 9600、115200 <span class=\"gl\" data-g=\"376\" tabindex=\"0\" role=\"button\">bps<\/span>）<\/td>\n<td>中（標準 100 kbps、快速 400 kbps…）<\/td>\n<td><strong>最快<\/strong>（數十 MHz 等級）<\/td>\n<\/tr>\n<tr>\n<td>典型<\/td>\n<td><span class=\"gl\" data-g=\"427\" tabindex=\"0\" role=\"button\">序列埠<\/span>、<span class=\"gl\" data-g=\"171\" tabindex=\"0\" role=\"button\">GPS<\/span> 模組、除錯 Console<\/td>\n<td><span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>、<span class=\"gl\" data-g=\"393\" tabindex=\"0\" role=\"button\">EEPROM<\/span>、螢幕參數（板內晶片間）<\/td>\n<td><span class=\"gl\" data-g=\"394\" tabindex=\"0\" role=\"button\">Flash<\/span>、EEPROM、顯示器、高速 <span class=\"gl\" data-g=\"320\" tabindex=\"0\" role=\"button\">ADC<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>UART <span class=\"gl\" data-g=\"114\" tabindex=\"0\" role=\"button\">訊框<\/span>：<strong><span class=\"gl\" data-g=\"374\" tabindex=\"0\" role=\"button\">起始位元<\/span>＋5～9 個資料位元＋（<span class=\"gl\" data-g=\"373\" tabindex=\"0\" role=\"button\">同位元<\/span>）＋停止位元<\/strong>，如常見「<span class=\"gl\" data-g=\"396\" tabindex=\"0\" role=\"button\">9600 8N1<\/span>」。<\/li>\n<li>指引練習題重點：I²C <strong>接腳少、易受線長影響、可減少重量與耗電<\/strong>，是<strong>同步<\/strong>、<strong>半雙工<\/strong>；<strong><span class=\"gl\" data-g=\"392\" tabindex=\"0\" role=\"button\">IrDA<\/span> 紅外線<\/strong>屬單工（指引答案觀點）；SPI 為高速全雙工（p.5-17）。<\/li>\n<\/ul>\n<div class=\"cp\" id=\"cp_d5c4\" data-ans=\"0\"><div class=\"cph\">🧩 隨堂小測 4<span class=\"ref\">考科一 3.2<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">某 GPS 模組規格書寫著序列埠設定「9600 8N1」。下列解讀何者正確？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 鮑率 9600、8 個資料位元、無同位元（No parity）、1 個停止位元<\/button><button class=\"opt cpo\" data-k=\"1\">B. 時脈 9600 Hz、8 條資料線、無地線、1 個主裝置<\/button><button class=\"opt cpo\" data-k=\"2\">C. I²C 位址 9600、8 個從裝置、1 個主裝置<\/button><button class=\"opt cpo\" data-k=\"3\">D. SPI 速度 9600 MHz、8 個片選<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div>「<span class=\"gl\" data-g=\"396\" tabindex=\"0\" role=\"button\">9600 8N1<\/span>」是 <span class=\"gl\" data-g=\"384\" tabindex=\"0\" role=\"button\">UART<\/span> 常見設定：<span class=\"gl\" data-g=\"375\" tabindex=\"0\" role=\"button\">鮑率<\/span> 9600、8 個資料位元、N＝無<span class=\"gl\" data-g=\"373\" tabindex=\"0\" role=\"button\">同位元<\/span>、1 個<span class=\"gl\" data-g=\"374\" tabindex=\"0\" role=\"button\">停止位元<\/span>。UART 沒有<span class=\"gl\" data-g=\"388\" tabindex=\"0\" role=\"button\">時脈線<\/span>，雙方要先約好這些參數，否則會出現亂碼。<\/div><\/div><\/div>\n<h3>今日 30 秒回顧<\/h3>\n<p>主動（<span class=\"gl\" data-g=\"347\" tabindex=\"0\" role=\"button\">熱電偶<\/span>，自己發電）／被動（<span class=\"gl\" data-g=\"353\" tabindex=\"0\" role=\"button\">應變規<\/span>，要外加電源）〔依指引〕｜<span class=\"gl\" data-g=\"328\" tabindex=\"0\" role=\"button\">遲滯<\/span>＝上升下降曲線不重合｜壓電→電荷＋<span class=\"gl\" data-g=\"352\" tabindex=\"0\" role=\"button\">電荷放大器<\/span>；應變規→電阻＋<span class=\"gl\" data-g=\"355\" tabindex=\"0\" role=\"button\">惠斯登電橋<\/span>｜<span class=\"gl\" data-g=\"342\" tabindex=\"0\" role=\"button\">NTC<\/span> 溫升電阻降、<span class=\"gl\" data-g=\"343\" tabindex=\"0\" role=\"button\">PTC<\/span> 急升、<span class=\"gl\" data-g=\"344\" tabindex=\"0\" role=\"button\">CTR<\/span> 驟降｜<span class=\"gl\" data-g=\"346\" tabindex=\"0\" role=\"button\">Pt100<\/span>：0°C＝100Ω｜熱電偶＝席貝克＋<span class=\"gl\" data-g=\"350\" tabindex=\"0\" role=\"button\">冷點補償<\/span>｜<span class=\"gl\" data-g=\"366\" tabindex=\"0\" role=\"button\">頻率<\/span>＝1/<span class=\"gl\" data-g=\"368\" tabindex=\"0\" role=\"button\">週期<\/span>；sin 與 cos 差 90°｜並列快但貴、易干擾；<span class=\"gl\" data-g=\"369\" tabindex=\"0\" role=\"button\">串列<\/span>慢但便宜｜對講機半雙工、電話全雙工｜鮑率＝訊號單元/秒｜<span class=\"gl\" data-g=\"218\" tabindex=\"0\" role=\"button\">Baudot<\/span> 5 位元、<span class=\"gl\" data-g=\"217\" tabindex=\"0\" role=\"button\">ASCII<\/span> 7 位元｜<span class=\"gl\" data-g=\"377\" tabindex=\"0\" role=\"button\">FM<\/span> 抗雜訊佳；<span class=\"gl\" data-g=\"378\" tabindex=\"0\" role=\"button\">ASK<\/span>/FSK/PSK 數位→類比｜<span class=\"gl\" data-g=\"382\" tabindex=\"0\" role=\"button\">樹狀<\/span>易擴充｜UART 非同步全雙工、I²C 同步半雙工 2 線、SPI 同步全雙工 4 線最快。<\/p>", "audio": {"src": "audio/d05.mp3?v=2", "dur": 719}, "questions": [{"id": "d5q1", "n": 1, "opts": ["熱電偶", "應變規", "加速規", "麥克風"], "exp": "指引 p.5-3：主動式感測器（如熱電偶）不需外加激發電源；被動式感測器（如加速規、應變規、麥克風）需外加激發電源。注意不同教科書定義可能相反，本考試依指引。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "依官方學習指引的分類方式，下列哪一種感測器屬於「不需外加激發電源，待測量改變即可產生電壓」的主動式感測器？", "ref": "考科一 3.1", "src": "指引 p.5-3", "ans": 0, "stemH": "依官方學習指引的分類方式，下列哪一種感測器屬於「不需外加激發電源，待測量改變即可產生電壓」的主動式感測器？", "optsH": ["熱電偶", "應變規", "加速規", "麥克風"], "expH": "指引 p.5-3：<span class=\"gl\" data-g=\"317\" tabindex=\"0\" role=\"button\">主動式感測器<\/span>（如<span class=\"gl\" data-g=\"347\" tabindex=\"0\" role=\"button\">熱電偶<\/span>）不需外加激發電源；被動式感測器（如<span class=\"gl\" data-g=\"334\" tabindex=\"0\" role=\"button\">加速規<\/span>、<span class=\"gl\" data-g=\"353\" tabindex=\"0\" role=\"button\">應變規<\/span>、麥克風）需外加激發電源。注意不同教科書定義可能相反，本考試依指引。"}, {"id": "d5q2", "n": 2, "opts": ["線性度（Linearity）", "重複性（Repeatability）", "遲滯（Hysteresis）", "解析度（Resolution）"], "exp": "遲滯（滯後）現象：量測值上升與下降過程中，對同一數值的量測產生偏差，曲線不重合，需建立遲滯模型補償。它不是時間延遲。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某溫度感測器在溫度「上升」到 50°C 時讀值為 50.0，「下降」回 50°C 時讀值卻是 50.6，上升與下降曲線不重合。這種現象稱為？", "ref": "考科一 3.1", "src": "指引 p.5-6", "ans": 2, "stemH": "某溫度感測器在溫度「上升」到 50°C 時讀值為 50.0，「下降」回 50°C 時讀值卻是 50.6，上升與下降曲線不重合。這種現象稱為？", "optsH": ["線性度（Linearity）", "重複性（Repeatability）", "遲滯（Hysteresis）", "解析度（Resolution）"], "expH": "<span class=\"gl\" data-g=\"328\" tabindex=\"0\" role=\"button\">遲滯<\/span>（滯後）現象：量測值上升與下降過程中，對同一數值的量測產生偏差，曲線不重合，需建立遲滯模型補償。它不是時間<span class=\"gl\" data-g=\"47\" tabindex=\"0\" role=\"button\">延遲<\/span>。"}, {"id": "d5q3", "n": 3, "opts": ["2%", "0.2%", "4%", "20%"], "exp": "精確度＝（測量值−實際值）／實際值×100%＝（204−200）／200×100%＝2%。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "一支壓力計量測實際值 200 kPa 的壓力，讀值為 204 kPa。依指引的精確度定義，其誤差百分比為？", "ref": "考科一 3.1", "src": "指引 p.5-5～5-6", "ans": 0, "stemH": "一支壓力計量測實際值 200 kPa 的壓力，讀值為 204 kPa。依指引的精確度定義，其誤差百分比為？", "optsH": ["2%", "0.2%", "4%", "20%"], "expH": "<span class=\"gl\" data-g=\"324\" tabindex=\"0\" role=\"button\">精確度<\/span>＝（測量值−實際值）／實際值×100%＝（204−200）／200×100%＝2%。"}, {"id": "d5q4", "n": 4, "opts": ["12", "144", "1024", "4096"], "exp": "n 位元可表示 2ⁿ 種值，2¹²＝4096。位元數越多，解析度（可分辨的最小量值）越細。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某 ADC 為 12 位元，可將量測範圍以多少種不同的數位值表示？", "ref": "考科一 3.1", "src": "指引 p.5-6", "ans": 3, "stemH": "某 ADC 為 12 位元，可將量測範圍以多少種不同的數位值表示？", "optsH": ["12", "144", "1024", "4096"], "expH": "n 位元可表示 2ⁿ 種值，2¹²＝4096。位元數越多，<span class=\"gl\" data-g=\"322\" tabindex=\"0\" role=\"button\">解析度<\/span>（可分辨的最小量值）越細。"}, {"id": "d5q5", "n": 5, "opts": ["惠斯登電橋", "分壓電路", "冷點補償電路", "電荷放大器（Charge Amplifier）"], "exp": "壓電材料受力表面產生電荷，需配合電荷放大器轉換。惠斯登電橋用於應變規等電阻變化的量測；冷點補償用於熱電偶；分壓電路常用於光敏電阻。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "壓電式力量感測器受力後產生的原始訊號極微小，實務上通常需搭配哪一種電路，將其轉換為與應力成正比的電壓或電流？", "ref": "考科一 3.1", "src": "指引 p.5-7", "ans": 3, "stemH": "壓電式力量感測器受力後產生的原始訊號極微小，實務上通常需搭配哪一種電路，將其轉換為與應力成正比的電壓或電流？", "optsH": ["惠斯登電橋", "分壓電路", "冷點補償電路", "電荷放大器（Charge Amplifier）"], "expH": "壓電材料受力表面產生電荷，需配合<span class=\"gl\" data-g=\"352\" tabindex=\"0\" role=\"button\">電荷放大器<\/span>轉換。<span class=\"gl\" data-g=\"355\" tabindex=\"0\" role=\"button\">惠斯登電橋<\/span>用於<span class=\"gl\" data-g=\"353\" tabindex=\"0\" role=\"button\">應變規<\/span>等電阻變化的量測；<span class=\"gl\" data-g=\"350\" tabindex=\"0\" role=\"button\">冷點補償<\/span>用於<span class=\"gl\" data-g=\"347\" tabindex=\"0\" role=\"button\">熱電偶<\/span>；<span class=\"gl\" data-g=\"363\" tabindex=\"0\" role=\"button\">分壓電路<\/span>常用於<span class=\"gl\" data-g=\"360\" tabindex=\"0\" role=\"button\">光敏電阻<\/span>。"}, {"id": "d5q6", "n": 6, "opts": ["惠斯登電橋可以把溫度直接轉成數位訊號", "應變規的電阻變化極微小，電橋能把微小的電阻變化轉成可量測的電壓變化", "惠斯登電橋可以產生電荷供應變規使用", "惠斯登電橋可取代放大器，不需任何後續電路"], "exp": "應變規利用壓阻效應，受力形變造成極小的電阻變化；惠斯登電橋在平衡（R1/R2＝R3/R4）時輸出 0，電阻一變就產生小電壓，再經放大器放大。電橋原理屬補充知識。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "應變規常搭配惠斯登電橋使用，主要原因是？", "ref": "考科一 3.1", "src": "指引 p.5-7＋補充", "ans": 1, "stemH": "應變規常搭配惠斯登電橋使用，主要原因是？", "optsH": ["惠斯登電橋可以把溫度直接轉成數位訊號", "應變規的電阻變化極微小，電橋能把微小的電阻變化轉成可量測的電壓變化", "惠斯登電橋可以產生電荷供應變規使用", "惠斯登電橋可取代放大器，不需任何後續電路"], "expH": "<span class=\"gl\" data-g=\"353\" tabindex=\"0\" role=\"button\">應變規<\/span>利用<span class=\"gl\" data-g=\"354\" tabindex=\"0\" role=\"button\">壓阻效應<\/span>，受力形變造成極小的電阻變化；<span class=\"gl\" data-g=\"355\" tabindex=\"0\" role=\"button\">惠斯登電橋<\/span>在平衡（R1/R2＝R3/R4）時輸出 0，電阻一變就產生小電壓，再經放大器放大。電橋原理屬補充知識。"}, {"id": "d5q7", "n": 7, "opts": ["NTC 的電阻隨溫度上升而增加", "PTC 在達到居禮溫度時電阻值會急升，常用於電路保護", "CTR 的電阻隨溫度上升而線性增加", "一般所稱的熱敏電阻多指 PTC"], "exp": "NTC：溫度上升電阻下降、靈敏度高，一般熱敏電阻多指此類；PTC：達居禮溫度電阻急升，用於電路保護；CTR：達臨界溫度電阻驟降。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "下列關於熱敏電阻的敘述，何者正確？", "ref": "考科一 3.1", "src": "指引 p.5-8", "ans": 1, "stemH": "下列關於熱敏電阻的敘述，何者正確？", "optsH": ["NTC 的電阻隨溫度上升而增加", "PTC 在達到居禮溫度時電阻值會急升，常用於電路保護", "CTR 的電阻隨溫度上升而線性增加", "一般所稱的熱敏電阻多指 PTC"], "expH": "<span class=\"gl\" data-g=\"342\" tabindex=\"0\" role=\"button\">NTC<\/span>：溫度上升電阻下降、<span class=\"gl\" data-g=\"323\" tabindex=\"0\" role=\"button\">靈敏度<\/span>高，一般<span class=\"gl\" data-g=\"341\" tabindex=\"0\" role=\"button\">熱敏電阻<\/span>多指此類；<span class=\"gl\" data-g=\"343\" tabindex=\"0\" role=\"button\">PTC<\/span>：達居禮溫度電阻急升，用於電路保護；<span class=\"gl\" data-g=\"344\" tabindex=\"0\" role=\"button\">CTR<\/span>：達臨界溫度電阻驟降。"}, {"id": "d5q8", "n": 8, "opts": ["50 Ω", "100 Ω", "120 Ω", "140 Ω"], "exp": "Pt100 在 0°C 時為 100 Ω。R＝R₀(1＋αT)＝100×(1＋0.004×50)＝120 Ω。（實際標準 Pt100 α 約 0.00385，題目給定係數就照題目算。）", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某 RTD 為 Pt100，假設電阻溫度係數 α＝0.004/°C，且電阻與溫度呈線性關係，則 50°C 時電阻約為？", "ref": "考科一 3.1", "src": "指引 p.5-8", "ans": 2, "stemH": "某 RTD 為 Pt100，假設電阻溫度係數 α＝0.004/°C，且電阻與溫度呈線性關係，則 50°C 時電阻約為？", "optsH": ["50 Ω" <\/strong>：快速看下面的「考前熱身」，喚醒 D1～D3 的記憶。<\/li>\n<li><strong>後 25～30 分鐘<\/strong>：按「開始模擬考」計時作答 40 題（預設 30 分鐘，可改成正式 75 分鐘模式）。全部作答完或時間到才交卷、看分數與解析，模擬正式考試的節奏。<\/li>\n<li>題目全部<strong>改編自官方學習指引<\/strong>各章練習評量（第 3-1、3-2、4-1、4-2、4-3 節），每題都標了指引頁碼。少數原題有排版或答案爭議，已在解析中以 ⚠️ 標註。<\/li>\n<li>交卷後錯題會自動進「錯題本」，明天（D7）一起整理。<\/li>\n<\/ul>\n<blockquote>\n<p><strong>💡 作答技巧<\/strong>：iPAS 單選題常用「下列何者『不』正確」，先圈出「不」字再看選項；遇到不確定的題目先用刪去法，把明顯錯的兩個先刪掉。<\/p>\n<\/blockquote>\n<h2>考前熱身：AI 基礎與應用案例 <span class=\"ref\">考科一 1.1<\/span><span class=\"pg\">指引 p.3-2～3-13<\/span><\/h2>\n<ul>\n<li><span class=\"gl\" data-g=\"5\" tabindex=\"0\" role=\"button\">監督式<\/span>（有標籤：<span class=\"gl\" data-g=\"10\" tabindex=\"0\" role=\"button\">分類<\/span>、<span class=\"gl\" data-g=\"11\" tabindex=\"0\" role=\"button\">迴歸<\/span>）／<span class=\"gl\" data-g=\"6\" tabindex=\"0\" role=\"button\">非監督式<\/span>（無標籤：<span class=\"gl\" data-g=\"12\" tabindex=\"0\" role=\"button\">分群<\/span>、<span class=\"gl\" data-g=\"13\" tabindex=\"0\" role=\"button\">異常偵測<\/span>）／<span class=\"gl\" data-g=\"7\" tabindex=\"0\" role=\"button\">強化學習<\/span>（獎勵：動態控制）。<\/li>\n<li><span class=\"gl\" data-g=\"17\" tabindex=\"0\" role=\"button\">CNN<\/span> 看空間（影像、<span class=\"gl\" data-g=\"71\" tabindex=\"0\" role=\"button\">AOI<\/span>）；<span class=\"gl\" data-g=\"18\" tabindex=\"0\" role=\"button\">RNN<\/span>/<span class=\"gl\" data-g=\"19\" tabindex=\"0\" role=\"button\">LSTM<\/span> 看時間（震動、電流趨勢）；<span class=\"gl\" data-g=\"26\" tabindex=\"0\" role=\"button\">GAN<\/span> 生成；<span class=\"gl\" data-g=\"27\" tabindex=\"0\" role=\"button\">隨機森林<\/span>是傳統 <span class=\"gl\" data-g=\"2\" tabindex=\"0\" role=\"button\">ML<\/span>。<\/li>\n<li><span class=\"gl\" data-g=\"34\" tabindex=\"0\" role=\"button\">量化<\/span> <span class=\"gl\" data-g=\"36\" tabindex=\"0\" role=\"button\">FP32<\/span>→INT8；<span class=\"gl\" data-g=\"53\" tabindex=\"0\" role=\"button\">NPU<\/span> <span class=\"gl\" data-g=\"29\" tabindex=\"0\" role=\"button\">推論<\/span>專用、低功耗；訓練在<span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>、推論在邊緣；<span class=\"gl\" data-g=\"50\" tabindex=\"0\" role=\"button\">聯合學習<\/span>只傳模型參數。<\/li>\n<li><span class=\"gl\" data-g=\"82\" tabindex=\"0\" role=\"button\">PbD<\/span>：<span class=\"gl\" data-g=\"44\" tabindex=\"0\" role=\"button\">邊緣端<\/span>就<span class=\"gl\" data-g=\"305\" tabindex=\"0\" role=\"button\">去識別化<\/span>；<span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span> 是輔助判斷，不是最終決策者。<\/li>\n<\/ul>\n<h2>考前熱身：應用案例 <span class=\"ref\">考科一 1.2<\/span><span class=\"pg\">指引 p.3-18～3-22<\/span><\/h2>\n<ul>\n<li><span class=\"gl\" data-g=\"76\" tabindex=\"0\" role=\"button\">Diagnosis<\/span>＝<span class=\"gl\" data-g=\"10\" tabindex=\"0\" role=\"button\">分類<\/span>（現在怎樣）；<span class=\"gl\" data-g=\"77\" tabindex=\"0\" role=\"button\">Prognosis<\/span>＝<span class=\"gl\" data-g=\"11\" tabindex=\"0\" role=\"button\">迴歸<\/span>（<span class=\"gl\" data-g=\"78\" tabindex=\"0\" role=\"button\">RUL<\/span>，還能撐多久）。<\/li>\n<li><span class=\"gl\" data-g=\"79\" tabindex=\"0\" role=\"button\">感測融合<\/span>提升<span class=\"gl\" data-g=\"80\" tabindex=\"0\" role=\"button\">強健性<\/span>（成本可能增加）；<span class=\"gl\" data-g=\"81\" tabindex=\"0\" role=\"button\">四位一體<\/span>：感知、通訊、智慧、安全（資訊安全）。<\/li>\n<li>異質 <span class=\"gl\" data-g=\"68\" tabindex=\"0\" role=\"button\">PLC<\/span> → <span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span>轉 <span class=\"gl\" data-g=\"209\" tabindex=\"0\" role=\"button\">OPC UA<\/span>；大面積農業 → <span class=\"gl\" data-g=\"157\" tabindex=\"0\" role=\"button\">LoRa<\/span>＋<span class=\"gl\" data-g=\"49\" tabindex=\"0\" role=\"button\">端雲協作<\/span>。<\/li>\n<\/ul>\n<h2>考前熱身：物聯網架構 <span class=\"ref\">考科一 2.1<\/span><span class=\"pg\">指引 p.4-1～4-21<\/span><\/h2>\n<ul>\n<li><span class=\"gl\" data-g=\"93\" tabindex=\"0\" role=\"button\">感知層<\/span>（感測、識別）→ <span class=\"gl\" data-g=\"94\" tabindex=\"0\" role=\"button\">網路層<\/span>（傳輸、<span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span>異質融合）→ <span class=\"gl\" data-g=\"95\" tabindex=\"0\" role=\"button\">應用層<\/span>（<span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>、<span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span>、服務）。<\/li>\n<li>超音波量距離不是量分貝；<span class=\"gl\" data-g=\"335\" tabindex=\"0\" role=\"button\">PIR<\/span> 偵測移動；<span class=\"gl\" data-g=\"336\" tabindex=\"0\" role=\"button\">DHT11<\/span> 溫濕度；<span class=\"gl\" data-g=\"340\" tabindex=\"0\" role=\"button\">MQ-2<\/span> 氣體。<\/li>\n<li><span class=\"gl\" data-g=\"98\" tabindex=\"0\" role=\"button\">OSI<\/span>「應表會傳網鏈實」；表達層管加密壓縮。<\/li>\n<\/ul>\n<h2>考前熱身：通訊協定 <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-26～4-42<\/span><\/h2>\n<ul>\n<li><span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span>＝<span class=\"gl\" data-g=\"100\" tabindex=\"0\" role=\"button\">TCP<\/span>＋<span class=\"gl\" data-g=\"174\" tabindex=\"0\" role=\"button\">Pub/Sub<\/span>、<span class=\"gl\" data-g=\"178\" tabindex=\"0\" role=\"button\">QoS<\/span> 0 不保證送達；<span class=\"gl\" data-g=\"173\" tabindex=\"0\" role=\"button\">CoAP<\/span>＝<span class=\"gl\" data-g=\"101\" tabindex=\"0\" role=\"button\">UDP<\/span>＋<span class=\"gl\" data-g=\"186\" tabindex=\"0\" role=\"button\">REST<\/span>（無 QUERY）；<span class=\"gl\" data-g=\"184\" tabindex=\"0\" role=\"button\">WebSocket<\/span>＝雙向即時。<\/li>\n<li><span class=\"gl\" data-g=\"162\" tabindex=\"0\" role=\"button\">5G<\/span> 不是低功耗長距離；<span class=\"gl\" data-g=\"156\" tabindex=\"0\" role=\"button\">NB-IoT<\/span> 窄頻不適合影音；<span class=\"gl\" data-g=\"153\" tabindex=\"0\" role=\"button\">Matter<\/span> 不支援 <span class=\"gl\" data-g=\"157\" tabindex=\"0\" role=\"button\">LoRa<\/span>；<span class=\"gl\" data-g=\"136\" tabindex=\"0\" role=\"button\">SSID<\/span>＝基地台識別碼。<\/li>\n<\/ul>\n<h2>考前熱身：工業通訊與網路 <span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-47～4-68<\/span><\/h2>\n<ul>\n<li><span class=\"gl\" data-g=\"100\" tabindex=\"0\" role=\"button\">TCP<\/span> 連接導向可靠；<span class=\"gl\" data-g=\"101\" tabindex=\"0\" role=\"button\">UDP<\/span> 無連接不保證；<span class=\"gl\" data-g=\"121\" tabindex=\"0\" role=\"button\">LAN<\/span> 小範圍；<span class=\"gl\" data-g=\"104\" tabindex=\"0\" role=\"button\">IPv4<\/span> 四組。<\/li>\n<li><span class=\"gl\" data-g=\"209\" tabindex=\"0\" role=\"button\">OPC UA<\/span> 跨平台；Event Notification＝訂閱事件；<span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span> 傳輸層是 TCP。<\/li>\n<\/ul>", "audio": {"src": "audio/d06.mp3?v=2", "dur": 459}, "questions": [{"id": "d6q1", "n": 1, "opts": ["監督式學習不需依賴標籤資料，適合用於未知故障型態的探索", "非監督式學習常利用分群（Clustering）技術，將相似的設備運作資料自動歸類", "強化學習的主要目標是進行靜態影像的瑕疵檢測（AOI）", "迴歸屬於非監督式學習，主要用於將資料區分成離散類別"], "exp": "(A) 監督式學習必須依賴特徵與對應標籤。(B) 正確，非監督式學習無需標籤，可找出資料內部結構與群集。(C) AOI 通常用監督式學習中的 CNN；強化學習用於動態控制決策（如空調節能）。(D) 迴歸屬監督式，輸出連續數值；離散類別是分類。", "origin": "改編自官方學習指引 3-1 練習評量第 1 題（p.3-14）", "stem": "關於機器學習在 AIoT 資料分析中的應用範式，下列敘述何者正確？", "ref": "考科一 1.1", "src": "指引 p.3-14", "ans": 1, "stemH": "關於機器學習在 AIoT 資料分析中的應用範式，下列敘述何者正確？", "optsH": ["監督式學習不需依賴標籤資料，適合用於未知故障型態的探索", "非監督式學習常利用分群（Clustering）技術，將相似的設備運作資料自動歸類", "強化學習的主要目標是進行靜態影像的瑕疵檢測（AOI）", "迴歸屬於非監督式學習，主要用於將資料區分成離散類別"], "expH": "(A) <span class=\"gl\" data-g=\"5\" tabindex=\"0\" role=\"button\">監督式學習<\/span>必須依賴特徵與對應標籤。(B) 正確，<span class=\"gl\" data-g=\"6\" tabindex=\"0\" role=\"button\">非監督式學習<\/span>無需標籤，可找出資料內部結構與群集。(C) <span class=\"gl\" data-g=\"71\" tabindex=\"0\" role=\"button\">AOI<\/span> 通常用監督式學習中的 <span class=\"gl\" data-g=\"17\" tabindex=\"0\" role=\"button\">CNN<\/span>；<span class=\"gl\" data-g=\"7\" tabindex=\"0\" role=\"button\">強化學習<\/span>用於動態控制決策（如空調節能）。(D) <span class=\"gl\" data-g=\"11\" tabindex=\"0\" role=\"button\">迴歸<\/span>屬監督式，輸出連續數值；離散類別是<span class=\"gl\" data-g=\"10\" tabindex=\"0\" role=\"button\">分類<\/span>。"}, {"id": "d6q2", "n": 2, "opts": ["卷積神經網路（CNN）", "循環神經網路（RNN/LSTM）", "生成對抗網路（GAN）", "隨機森林（Random Forest）"], "exp": "RNN/LSTM 具備記憶機制，能捕捉前後時間點的關聯性，最適合時序資料。CNN 擅長空間結構（雖然 1D-CNN 也可處理時序，但 RNN/LSTM 更具代表性）；GAN 用於生成資料；隨機森林是傳統機器學習，不屬於類神經網路。", "origin": "改編自官方學習指引 3-1 練習評量第 2 題（p.3-14）", "stem": "處理 AIoT 感測器產生的時間序列資料（如馬達連續震動波形或電流趨勢）時，下列哪一種神經網路架構最合適？", "ref": "考科一 1.1", "src": "指引 p.3-14", "ans": 1, "stemH": "處理 AIoT 感測器產生的時間序列資料（如馬達連續震動波形或電流趨勢）時，下列哪一種神經網路架構最合適？", "optsH": ["卷積神經網路（CNN）", "循環神經網路（RNN/LSTM）", "生成對抗網路（GAN）", "隨機森林（Random Forest）"], "expH": "<span class=\"gl\" data-g=\"18\" tabindex=\"0\" role=\"button\">RNN<\/span>/<span class=\"gl\" data-g=\"19\" tabindex=\"0\" role=\"button\">LSTM<\/span> 具備記憶機制，能捕捉前後時間點的關聯性，最適合<span class=\"gl\" data-g=\"14\" tabindex=\"0\" role=\"button\">時序資料<\/span>。<span class=\"gl\" data-g=\"17\" tabindex=\"0\" role=\"button\">CNN<\/span> 擅長空間結構（雖然 1D-CNN 也可處理時序，但 RNN/LSTM 更具代表性）；<span class=\"gl\" data-g=\"26\" tabindex=\"0\" role=\"button\">GAN<\/span> 用於生成資料；<span class=\"gl\" data-g=\"27\" tabindex=\"0\" role=\"button\">隨機森林<\/span>是傳統<span class=\"gl\" data-g=\"2\" tabindex=\"0\" role=\"button\">機器學習<\/span>，不屬於<span class=\"gl\" data-g=\"4\" tabindex=\"0\" role=\"button\">類神經網路<\/span>。"}, {"id": "d6q3", "n": 3, "opts": ["將模型參數由 FP32 轉換為 INT8，以降低記憶體佔用", "透過增加神經網路層數來提升邊緣端推論準確度", "將模型切割成多個部分，分別在不同雲端伺服器上執行", "是一種將類比訊號轉換為數位訊號的硬體電路技術"], "exp": "量化以降低數值精度換取更小的模型與更快的運算。(B) 增加層數只會更重；(C) 是模型平行或分散式運算；(D) 是 ADC，與模型權重量化不同。", "origin": "改編自官方學習指引 3-1 練習評量第 3 題（p.3-14）", "stem": "為了讓神經網路模型能部署在資源受限的 MCU 上，常採用「量化（Quantization）」技術。下列敘述何者正確？", "ref": "考科一 1.1", "src": "指引 p.3-14", "ans": 0, "stemH": "為了讓神經網路模型能部署在資源受限的 MCU 上，常採用「量化（Quantization）」技術。下列敘述何者正確？", "optsH": ["將模型參數由 FP32 轉換為 INT8，以降低記憶體佔用", "透過增加神經網路層數來提升邊緣端推論準確度", "將模型切割成多個部分，分別在不同雲端伺服器上執行", "是一種將類比訊號轉換為數位訊號的硬體電路技術"], "expH": "<span class=\"gl\" data-g=\"34\" tabindex=\"0\" role=\"button\">量化<\/span>以降低數值精度換取更小的模型與更快的運算。(B) 增加層數只會更重；(C) 是模型平行或分散式運算；(D) 是 <span class=\"gl\" data-g=\"320\" tabindex=\"0\" role=\"button\">ADC<\/span>，與模型<span class=\"gl\" data-g=\"24\" tabindex=\"0\" role=\"button\">權重<\/span>量化不同。"}, {"id": "d6q4", "n": 4, "opts": ["NPU 可完全取代 CPU，負責作業系統與 I/O 等通用運算", "NPU 專注於推論（Forward Propagation），省去訓練所需的反向傳播邏輯，因此能效極高", "NPU 是雲端大規模模型訓練的主力硬體", "NPU 不適合執行 INT8 量化模型，只能跑浮點運算"], "exp": "(A) NPU 是協同處理器，通用運算仍由 CPU 負責。(C) 雲端訓練多用 GPU 或 TPU。(D) NPU 的優勢正是執行 INT8 量化模型，比浮點運算更省電快速。", "origin": "改編自官方學習指引 3-1 練習評量第 4 題（p.3-15）；原題選項排版含「錯誤／正確」字樣，已改寫為一般選項", "stem": "關於神經網路處理器（NPU）在 AIoT 邊緣裝置中的角色與特性，下列敘述何者正確？", "ref": "考科一 1.1", "src": "指引 p.3-15", "ans": 1, "stemH": "關於神經網路處理器（NPU）在 AIoT 邊緣裝置中的角色與特性，下列敘述何者正確？", "optsH": ["NPU 可完全取代 CPU，負責作業系統與 I/O 等通用運算", "NPU 專注於推論（Forward Propagation），省去訓練所需的反向傳播邏輯，因此能效極高", "NPU 是雲端大規模模型訓練的主力硬體", "NPU 不適合執行 INT8 量化模型，只能跑浮點運算"], "expH": "(A) <span class=\"gl\" data-g=\"53\" tabindex=\"0\" role=\"button\">NPU<\/span> 是協同處理器，通用運算仍由 <span class=\"gl\" data-g=\"51\" tabindex=\"0\" role=\"button\">CPU<\/span> 負責。(C) <span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>訓練多用 <span class=\"gl\" data-g=\"52\" tabindex=\"0\" role=\"button\">GPU<\/span> 或 <span class=\"gl\" data-g=\"56\" tabindex=\"0\" role=\"button\">TPU<\/span>。(D) NPU 的優勢正是執行 <span class=\"gl\" data-g=\"36\" tabindex=\"0\" role=\"button\">INT8<\/span> <span class=\"gl\" data-g=\"34\" tabindex=\"0\" role=\"button\">量化<\/span>模型，比浮點運算更省電快速。"}, {"id": "d6q5", "n": 5, "opts": ["將攝影機拍攝的所有原始畫面無條件上傳雲端，以備不時之需", "只依賴雲端伺服器的防火牆，終端裝置不需處理資安", "在邊緣端即進行資料去識別化（如僅傳送特徵值或骨架資訊）", "要求所有使用者先簽署放棄隱私權同意書"], "exp": "PbD 強調在架構設計時就納入隱私；資料「不離地」或「去識別化後才上傳」是核心實踐。(A) 增加攔截與外洩風險；(B) 邊緣裝置常是入侵破口；(D) 屬法律免責手段，不是技術上的 by Design。", "origin": "改編自官方學習指引 3-1 練習評量第 5 題（p.3-15）", "stem": "為降低 AIoT 系統的隱私風險，應遵循「由設計起始的隱私（Privacy by Design）」原則。下列哪項措施最符合此原則在邊緣運算中的實踐？", "ref": "考科一 1.1", "src": "指引 p.3-15", "ans": 2, "stemH": "為降低 AIoT 系統的隱私風險，應遵循「由設計起始的隱私（Privacy by Design）」原則。下列哪項措施最符合此原則在邊緣運算中的實踐？", "optsH": ["將攝影機拍攝的所有原始畫面無條件上傳雲端，以備不時之需", "只依賴雲端伺服器的防火牆，終端裝置不需處理資安", "在邊緣端即進行資料去識別化（如僅傳送特徵值或骨架資訊）", "要求所有使用者先簽署放棄隱私權同意書"], "expH": "<span class=\"gl\" data-g=\"82\" tabindex=\"0\" role=\"button\">PbD<\/span> 強調在架構設計時就納入隱私；資料「不離地」或「<span class=\"gl\" data-g=\"305\" tabindex=\"0\" role=\"button\">去識別化<\/span>後才上傳」是核心實踐。(A) 增加攔截與外洩風險；(B) <span class=\"gl\" data-g=\"46\" tabindex=\"0\" role=\"button\">邊緣裝置<\/span>常是入侵破口；(D) 屬法律免責手段，不是技術上的 by Design。"}, {"id": "d6q6", "n": 6, "opts": ["故障診斷（Diagnosis）屬於迴歸任務，用於計算設備運轉時數", "健康預測（Prognosis）屬於分類任務，用於判斷設備是否故障", "故障診斷用於判斷設備當前狀態（如正常/異常），屬於分類任務", "健康預測主要依賴非監督式學習，不需參考歷史故障資料"], "exp": "診斷是分類當下狀態；健康預測推估剩餘壽命（RUL），輸出連續數值，屬迴歸，且通常需要歷史衰退資料訓練（監督式）。", "origin": "改編自官方學習指引 3-2 練習評量第 1 題（p.3-23）", "stem": "在智慧工廠的預測性維護（PdM）中，關於 AI 模型任務分類，下列敘述何者正確？", "ref": "考科一 1.2", "src": "指引 p.3-23", "ans": 2, "stemH": "在智慧工廠的預測性維護（PdM）中，關於 AI 模型任務分類，下列敘述何者正確？", "optsH": ["故障診斷（Diagnosis）屬於迴歸任務，用於計算設備運轉時數", "健康預測（Prognosis）屬於分類任務，用於判斷設備是否故障", "故障診斷用於判斷設備當前狀態（如正常/異常），屬於分類任務", "健康預測主要依賴非監督式學習，不需參考歷史故障資料"], "expH": "診斷是<span class=\"gl\" data-g=\"10\" tabindex=\"0\" role=\"button\">分類<\/span>當下狀態；<span class=\"gl\" data-g=\"77\" tabindex=\"0\" role=\"button\">健康預測<\/span>推估剩餘壽命（<span class=\"gl\" data-g=\"78\" tabindex=\"0\" role=\"button\">RUL<\/span>），輸出連續數值，屬<span class=\"gl\" data-g=\"11\" tabindex=\"0\" role=\"button\">迴歸<\/span>，且通常需要歷史衰退資料訓練（<span class=\"gl\" data-g=\"5\" tabindex=\"0\" role=\"button\">監督式<\/span>）。"}, {"id": "d6q7", "n": 7, "opts": ["目的是降低硬體成本，減少感測器數量", "整合多種不同類型感測器（如影像加光達），提升系統在複雜環境下的強健性", "只能在雲端伺服器執行，無法在邊緣裝置運作", "會導致資料衝突，降低判斷準確度"], "exp": "感測融合互補不同感測器的盲點（如光達補強影像在暗處的不足），增加強健性。它通常需要更多感測器；常在邊緣端（如車載電腦）即時執行；融合演算法（Kalman Filter 或 AI）正是用來解決衝突。", "origin": "改編自官方學習指引 3-2 練習評量第 2 題（p.3-23）", "stem": "關於感測融合（Sensor Fusion）在 AIoT 系統中的主要效益，下列敘述何者正確？", "ref": "考科一 1.2", "src": "指引 p.3-23", "ans": 1, "stemH": "關於感測融合（Sensor Fusion）在 AIoT 系統中的主要效益，下列敘述何者正確？", "optsH": ["目的是降低硬體成本，減少感測器數量", "整合多種不同類型感測器（如影像加光達），提升系統在複雜環境下的強健性", "只能在雲端伺服器執行，無法在邊緣裝置運作", "會導致資料衝突，降低判斷準確度"], "expH": "<span class=\"gl\" data-g=\"79\" tabindex=\"0\" role=\"button\">感測融合<\/span>互補不同<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>的盲點（ ong>每一題用一句話寫下「我錯在哪個觀念」<\/strong>（例如「把 <span class=\"gl\" data-g=\"301\" tabindex=\"0\" role=\"button\">RPO<\/span> 和 <span class=\"gl\" data-g=\"302\" tabindex=\"0\" role=\"button\">RTO<\/span> 搞反」），再按「重做」直到答對；答對的題目會自動移出錯題本。<\/li>\n<\/ul>\n<blockquote>\n<p><strong>⚠️ 注意<\/strong>：指引第 5-2 節練習評量有 3 題「答案欄與解析內容不一致」（第 5、7、8 題），本模擬考已依解析與技術常識修正並標註 ⚠️，請以解析說明理解觀念。<\/p>\n<\/blockquote>\n<h2>考前熱身：中介軟體與平台 <span class=\"ref\">考科一 2.4<\/span><span class=\"pg\">指引 p.4-73～4-79<\/span><\/h2>\n<ul>\n<li><span class=\"gl\" data-g=\"229\" tabindex=\"0\" role=\"button\">PaaS<\/span>＝<span class=\"gl\" data-g=\"436\" tabindex=\"0\" role=\"button\">OS<\/span>＋執行環境＋資料庫＋網頁伺服器；資安用<span class=\"gl\" data-g=\"314\" tabindex=\"0\" role=\"button\">最小權限<\/span>；<span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>即時處理的挑戰是<span class=\"gl\" data-g=\"47\" tabindex=\"0\" role=\"button\">延遲<\/span>。<\/li>\n<li><span class=\"gl\" data-g=\"44\" tabindex=\"0\" role=\"button\">邊緣運算<\/span>＝靠近源頭，不是移到雲端；長距離影像傳輸 → <span class=\"gl\" data-g=\"161\" tabindex=\"0\" role=\"button\">4G<\/span>/<span class=\"gl\" data-g=\"162\" tabindex=\"0\" role=\"button\">5G<\/span>。<\/li>\n<\/ul>\n<h2>考前熱身：資安與隱私 <span class=\"ref\">考科一 2.5<\/span><span class=\"pg\">指引 p.4-85～4-90<\/span><\/h2>\n<ul>\n<li>密碼最弱；<span class=\"gl\" data-g=\"119\" tabindex=\"0\" role=\"button\">Repeater<\/span> 無法隔離；<span class=\"gl\" data-g=\"290\" tabindex=\"0\" role=\"button\">Mirai<\/span>＝<span class=\"gl\" data-g=\"289\" tabindex=\"0\" role=\"button\">DDoS<\/span>；鐵殼防不了 <span class=\"gl\" data-g=\"288\" tabindex=\"0\" role=\"button\">DoS<\/span>。<\/li>\n<li><span class=\"gl\" data-g=\"270\" tabindex=\"0\" role=\"button\">私鑰<\/span>簽、公鑰驗＝不可否認；<span class=\"gl\" data-g=\"275\" tabindex=\"0\" role=\"button\">雜湊<\/span>＝<span class=\"gl\" data-g=\"267\" tabindex=\"0\" role=\"button\">完整性<\/span>；DDoS 監控無助於防個資外洩。<\/li>\n<\/ul>\n<h2>考前熱身：感測技術 <span class=\"ref\">考科一 3.1<\/span><span class=\"pg\">指引 p.5-3～5-10<\/span><\/h2>\n<ul>\n<li><span class=\"gl\" data-g=\"347\" tabindex=\"0\" role=\"button\">熱電偶<\/span>：兩種不同金屬、<span class=\"gl\" data-g=\"348\" tabindex=\"0\" role=\"button\">席貝克效應<\/span>、<span class=\"gl\" data-g=\"350\" tabindex=\"0\" role=\"button\">冷點補償<\/span>；<span class=\"gl\" data-g=\"342\" tabindex=\"0\" role=\"button\">NTC<\/span> 溫升電阻降；<span class=\"gl\" data-g=\"346\" tabindex=\"0\" role=\"button\">Pt100<\/span> 0°C＝100 Ω。<\/li>\n<li><span class=\"gl\" data-g=\"328\" tabindex=\"0\" role=\"button\">遲滯<\/span>不是時間<span class=\"gl\" data-g=\"47\" tabindex=\"0\" role=\"button\">延遲<\/span>；壓電→電荷；<span class=\"gl\" data-g=\"353\" tabindex=\"0\" role=\"button\">應變規<\/span>→電阻變化。<\/li>\n<\/ul>\n<h2>考前熱身：訊號與通訊 <span class=\"ref\">考科一 3.2<\/span><span class=\"pg\">指引 p.5-15～5-24<\/span><\/h2>\n<ul>\n<li><span class=\"gl\" data-g=\"98\" tabindex=\"0\" role=\"button\">OSI 七層<\/span>；<span class=\"gl\" data-g=\"385\" tabindex=\"0\" role=\"button\">I²C<\/span> 同步、<span class=\"gl\" data-g=\"371\" tabindex=\"0\" role=\"button\">半雙工<\/span>；並列快但貴、易干擾、難維修；<span class=\"gl\" data-g=\"382\" tabindex=\"0\" role=\"button\">樹狀<\/span>易擴充。<\/li>\n<li>依時序分同步／<span class=\"gl\" data-g=\"372\" tabindex=\"0\" role=\"button\">非同步<\/span>；sin 與 cos 相差 90°。<\/li>\n<\/ul>", "audio": {"src": "audio/d07.mp3?v=2", "dur": 469}, "questions": [{"id": "d7q1", "n": 1, "opts": ["提供大量的運算資源", "雲端運算讓物聯網感測設備本身也能支援虛擬化和容器化技術", "提供安全的資料儲存", "讓物聯網感測元件不需要擁有較強的運算能力"], "exp": "A、C 是雲服務特色；D 雲端可簡化閘道器、感測器的設計。虛擬化與容器化通常用於運算能力較大的系統，感測節點與閘道器沒有必要。", "origin": "改編自官方學習指引 4-4 練習評量第 1 題（p.4-80）", "stem": "關於雲端運算如何協助物聯網完成系統建置，下列敘述何者「不」正確？", "ref": "考科一 2.4", "src": "指引 p.4-80", "ans": 1, "stemH": "關於雲端運算如何協助物聯網完成系統建置，下列敘述何者「不」正確？", "optsH": ["提供大量的運算資源", "雲端運算讓物聯網感測設備本身也能支援虛擬化和容器化技術", "提供安全的資料儲存", "讓物聯網感測元件不需要擁有較強的運算能力"], "expH": "A、C 是雲服務特色；D <span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>可簡化<span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span>、<span class=\"gl\" data-g=\"70\" tabi
