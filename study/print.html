\" data-g=\"35\" tabindex=\"0\" role=\"button\">剪枝<\/span>；訓練是調整<span class=\"gl\" data-g=\"24\" tabindex=\"0\" role=\"button\">權重<\/span>。"}, {"ref": "考科一 1.1", "opts": ["GPU", "FPGA", "NPU", "只用通用 CPU"], "exp": "FPGA 可重新配置硬體邏輯，特點是低延遲、高度客製化，適合工業控制與安全監測等極度即時場域，缺點是開發門檻高。GPU 功耗高、偏通用平行運算；NPU 主打低功耗推論；只用 CPU 常在延遲與效能上不足。", "stem": "某產線的安全監測模組需要「極低且可預期」的反應延遲，並希望依自家需求客製硬體邏輯；公司有硬體工程團隊，可以接受較高的開發門檻。依講義的比較，最適合的加速器是？", "ans": 1, "id": "d1c3", "n": 3, "stemH": "某產線的安全監測模組需要「極低且可預期」的反應延遲，並希望依自家需求客製硬體邏輯；公司有硬體工程團隊，可以接受較高的開發門檻。依講義的比較，最適合的加速器是？", "optsH": ["GPU", "FPGA", "NPU", "只用通用 CPU"], "expH": "<span class=\"gl\" data-g=\"54\" tabindex=\"0\" role=\"button\">FPGA<\/span> 可重新配置硬體邏輯，特點是低<span class=\"gl\" data-g=\"47\" tabindex=\"0\" role=\"button\">延遲<\/span>、高度客製化，適合工業控制與安全監測等極度即時場域，缺點是開發門檻高。<span class=\"gl\" data-g=\"52\" tabindex=\"0\" role=\"button\">GPU<\/span> 功耗高、偏通用平行運算；<span class=\"gl\" data-g=\"53\" tabindex=\"0\" role=\"button\">NPU<\/span> 主打低功耗<span class=\"gl\" data-g=\"29\" tabindex=\"0\" role=\"button\">推論<\/span>；只用 <span class=\"gl\" data-g=\"51\" tabindex=\"0\" role=\"button\">CPU<\/span> 常在延遲與效能上不足。"}, {"ref": "考科一 1.2", "opts": ["事後維修；停機損失最小", "預防保養；可能過度維護，也可能在週期之間無預警故障", "預測性維護；需要大量 AI 運算", "預測性維護；只能用在新設備"], "exp": "依固定週期保養、不看實際狀態＝預防保養，指引提到這種做法「往往造成過度維護或無預警停機」。事後維修是壞了才修；預測性維護是依實際運轉狀態預測故障、在對的時間修。", "stem": "某工廠規定「每 3 個月固定更換一次主軸軸承」，不論軸承實際狀況如何。依講義的三種維護策略，這屬於哪一種？它最常見的缺點是什麼？", "ans": 1, "id": "d1c4", "n": 4, "stemH": "某工廠規定「每 3 個月固定更換一次主軸軸承」，不論軸承實際狀況如何。依講義的三種維護策略，這屬於哪一種？它最常見的缺點是什麼？", "optsH": ["事後維修；停機損失最小", "預防保養；可能過度維護，也可能在週期之間無預警故障", "預測性維護；需要大量 AI 運算", "預測性維護；只能用在新設備"], "expH": "依固定<span class=\"gl\" data-g=\"368\" tabindex=\"0\" role=\"button\">週期<\/span>保養、不看實際狀態＝<span class=\"gl\" data-g=\"75\" tabindex=\"0\" role=\"button\">預防保養<\/span>，指引提到這種做法「往往造成過度維護或無預警停機」。事後維修是壞了才修；<span class=\"gl\" data-g=\"74\" tabindex=\"0\" role=\"button\">預測性維護<\/span>是依實際運轉狀態預測故障、在對的時間修。"}], "lecture": "<h3>今天要搞懂的 5 件事<\/h3>\n<ol>\n<li><span class=\"gl\" data-g=\"2\" tabindex=\"0\" role=\"button\">機器學習<\/span>三大範式（<span class=\"gl\" data-g=\"5\" tabindex=\"0\" role=\"button\">監督式<\/span>／<span class=\"gl\" data-g=\"6\" tabindex=\"0\" role=\"button\">非監督式<\/span>／<span class=\"gl\" data-g=\"7\" tabindex=\"0\" role=\"button\">強化學習<\/span>）各自「吃什麼資料、做什麼事」。<\/li>\n<li><span class=\"gl\" data-g=\"10\" tabindex=\"0\" role=\"button\">分類<\/span> vs. <span class=\"gl\" data-g=\"11\" tabindex=\"0\" role=\"button\">迴歸<\/span> vs. <span class=\"gl\" data-g=\"12\" tabindex=\"0\" role=\"button\">分群<\/span> vs. <span class=\"gl\" data-g=\"13\" tabindex=\"0\" role=\"button\">異常偵測<\/span>，看到題目情境就能分辨。<\/li>\n<li><span class=\"gl\" data-g=\"17\" tabindex=\"0\" role=\"button\">CNN<\/span> 看「空間」、<span class=\"gl\" data-g=\"18\" tabindex=\"0\" role=\"button\">RNN<\/span>/<span class=\"gl\" data-g=\"19\" tabindex=\"0\" role=\"button\">LSTM<\/span> 看「時間」；模型從訓練到<span class=\"gl\" data-g=\"45\" tabindex=\"0\" role=\"button\">邊緣推論<\/span>的 5 個階段。<\/li>\n<li>為什麼要 Edge AI（低<span class=\"gl\" data-g=\"47\" tabindex=\"0\" role=\"button\">延遲<\/span>、省<span class=\"gl\" data-g=\"48\" tabindex=\"0\" role=\"button\">頻寬<\/span>、隱私），<span class=\"gl\" data-g=\"52\" tabindex=\"0\" role=\"button\">GPU<\/span>／<span class=\"gl\" data-g=\"53\" tabindex=\"0\" role=\"button\">NPU<\/span>／<span class=\"gl\" data-g=\"54\" tabindex=\"0\" role=\"button\">FPGA<\/span> 怎麼選。<\/li>\n<li><span class=\"gl\" data-g=\"1\" tabindex=\"0\" role=\"button\">AIoT<\/span> 應用案例：<span class=\"gl\" data-g=\"74\" tabindex=\"0\" role=\"button\">預測性維護<\/span>、<span class=\"gl\" data-g=\"79\" tabindex=\"0\" role=\"button\">感測融合<\/span>、「<span class=\"gl\" data-g=\"81\" tabindex=\"0\" role=\"button\">四位一體循環<\/span>」與四大場域。<\/li>\n<\/ol>\n<h2>1. AI 在 AIoT 裡扮演什麼角色 <span class=\"ref\">考科一 1.1<\/span><span class=\"pg\">指引 p.3-1<\/span><\/h2>\n<p>一句話記住：<strong><span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>給設備「感覺」，通訊與平台負責「傳遞與管理」，<span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span> 給設備「分析與判斷能力」。<\/strong>\nAI 不只在<span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>跑，正逐步延伸到<span class=\"gl\" data-g=\"46\" tabindex=\"0\" role=\"button\">邊緣裝置<\/span>（Edge Device）與<span class=\"gl\" data-g=\"57\" tabindex=\"0\" role=\"button\">微控制器<\/span>（MCU），在資源受限的地方做即時決策。<\/p>\n<p><span class=\"gl\" data-g=\"1\" tabindex=\"0\" role=\"button\">AIoT<\/span> 的資料有幾個「難搞」的特性，題目常拿來當背景：\n- <strong>高<span class=\"gl\" data-g=\"366\" tabindex=\"0\" role=\"button\">頻率<\/span>、<span class=\"gl\" data-g=\"14\" tabindex=\"0\" role=\"button\">時間序列<\/span>（Time-series）<\/strong>：例如馬達每秒上千筆震動值。\n- <strong>高雜訊、<span class=\"gl\" data-g=\"16\" tabindex=\"0\" role=\"button\">資料缺失<\/span>（Missing Data）<\/strong>：感測器斷線、受干擾。\n- <strong><span class=\"gl\" data-g=\"15\" tabindex=\"0\" role=\"button\">類別不平衡<\/span>（Imbalanced Data）<\/strong>：正常資料一大堆，故障資料很少。<\/p>\n<blockquote>\n<p><strong>💡 例子<\/strong>：工廠一年只壞 3 次，若要做「故障<span class=\"gl\" data-g=\"10\" tabindex=\"0\" role=\"button\">分類<\/span>」很難湊到足夠的故障樣本 → 所以實務上常改用「<span class=\"gl\" data-g=\"13\" tabindex=\"0\" role=\"button\">異常偵測<\/span>」（只用正常資料建模）。<\/p>\n<\/blockquote>\n<h2>2. 機器學習三大範式 <span class=\"ref\">考科一 1.1<\/span><span class=\"pg\">指引 p.3-2～3-3<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"2\" tabindex=\"0\" role=\"button\">機器學習<\/span>（ML）就是「用資料建立輸入與輸出的關聯模型」，讓系統能對新資料做<span class=\"gl\" data-g=\"10\" tabindex=\"0\" role=\"button\">分類<\/span>、預測或異常判斷。<\/p>\n<table>\n<thead>\n<tr>\n<th>範式<\/th>\n<th>訓練資料<\/th>\n<th>常見任務<\/th>\n<th><span class=\"gl\" data-g=\"1\" tabindex=\"0\" role=\"button\">AIoT<\/span> 例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"5\" tabindex=\"0\" role=\"button\">監督式學習<\/span> Supervised<\/td>\n<td>有<strong><span class=\"gl\" data-g=\"9\" tabindex=\"0\" role=\"button\">特徵（Feature）<\/span>＋標籤（Label）<\/strong><\/td>\n<td>分類（離散類別）、<span class=\"gl\" data-g=\"11\" tabindex=\"0\" role=\"button\">迴歸<\/span>（連續數值）<\/td>\n<td>依震動判斷「正常/異常」；預測剩餘壽命 <span class=\"gl\" data-g=\"78\" tabindex=\"0\" role=\"button\">RUL<\/span>、能耗、溫度趨勢<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"6\" tabindex=\"0\" role=\"button\">非監督式學習<\/span> Unsupervised<\/td>\n<td><strong>沒有標籤<\/strong><\/td>\n<td><span class=\"gl\" data-g=\"12\" tabindex=\"0\" role=\"button\">分群<\/span>（Clustering）、<span class=\"gl\" data-g=\"13\" tabindex=\"0\" role=\"button\">異常偵測<\/span>（Anomaly Detection）<\/td>\n<td>將相似運轉狀態自動歸類；用正常資料畫邊界抓異常<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"7\" tabindex=\"0\" role=\"button\">強化學習<\/span> Reinforcement（RL）<\/td>\n<td><span class=\"gl\" data-g=\"8\" tabindex=\"0\" role=\"button\">代理人<\/span>（Agent）與環境互動，得到<strong>獎勵（Reward）／懲罰<\/strong><\/td>\n<td>動態控制、參數最佳化<\/td>\n<td><span class=\"gl\" data-g=\"73\" tabindex=\"0\" role=\"button\">HVAC<\/span> 空調在舒適與安全條件下節能控制<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>重點補充（指引原意）：\n- 監督式學習的成效<strong>高度仰賴標註資料的品質與一致性<\/strong>；標註<span class=\"gl\" data-g=\"47\" tabindex=\"0\" role=\"button\">延遲<\/span>或標準不一，會讓模型學偏。\n- 非監督式方法實務上要搭配<strong>門檻設定與告警管理<\/strong>，避免誤報太多。\n- 強化學習是「試探式決策」，必須<strong>先界定安全邊界與測試方式<\/strong>。<\/p>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：\n- <strong>迴歸是監督式<\/strong>，輸出「連續數值」（溫度、壽命）；<strong>分類<\/strong>輸出「離散類別」（正常/異常、故障 A/B/C）。\n- <strong>分群（非監督）≠ 分類（監督）<\/strong>：分群沒有標準答案，只是把相似的放一起。\n- <span class=\"gl\" data-g=\"71\" tabindex=\"0\" role=\"button\">AOI<\/span> 影像瑕疵檢測通常是<strong>監督式＋<span class=\"gl\" data-g=\"17\" tabindex=\"0\" role=\"button\">CNN<\/span><\/strong>，不是強化學習。<\/p>\n<\/blockquote>\n<div class=\"cp\" id=\"cp_d1c1\" data-ans=\"0\"><div class=\"cph\">🧩 隨堂小測 1<span class=\"ref\">考科一 1.1<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">某 AOI 瑕疵檢測專案上線後誤判偏高。調查發現：不同班別的檢驗員對「輕微刮傷」該標成良品或瑕疵，標準並不一致。依官方指引的觀點，最直接的問題根源是什麼？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 監督式學習的成效高度仰賴標註資料的品質與一致性<\/button><button class=\"opt cpo\" data-k=\"1\">B. 模型應該改用強化學習，讓它自己試錯<\/button><button class=\"opt cpo\" data-k=\"2\">C. 攝影機取樣頻率太高，資料量過大<\/button><button class=\"opt cpo\" data-k=\"3\">D. CNN 不適合處理影像資料<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div><span class=\"gl\" data-g=\"71\" tabindex=\"0\" role=\"button\">AOI<\/span> 通常是<span class=\"gl\" data-g=\"5\" tabindex=\"0\" role=\"button\">監督式<\/span>＋<span class=\"gl\" data-g=\"17\" tabindex=\"0\" role=\"button\">CNN<\/span>，模型是「照著標籤學」。標籤標準不一，模型就會學偏。B <span class=\"gl\" data-g=\"7\" tabindex=\"0\" role=\"button\">強化學習<\/span>是靠獎勵試錯做控制，不是解法；C 與問題無關；D 錯，CNN 正是處理影像的主力。<\/div><\/div><\/div>\n<h2>3. 深度學習：CNN 與 RNN/LSTM <span class=\"ref\">考科一 1.1<\/span><span class=\"pg\">指引 p.3-3～3-4<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"3\" tabindex=\"0\" role=\"button\">深度學習<\/span>（DL）是<span class=\"gl\" data-g=\"2\" tabindex=\"0\" role=\"button\">機器學習<\/span>的<strong>子領域<\/strong>，核心是<span class=\"gl\" data-g=\"4\" tabindex=\"0\" role=\"button\">類神經網路<\/span>（ANN）。最大優勢：<strong>能自動從原始資料萃取高階特徵<\/strong>，特別適合影像、聲音、震動等<span class=\"gl\" data-g=\"250\" tabindex=\"0\" role=\"button\">非結構化<\/span>或高維度資料。<\/p>\n<table>\n<thead>\n<tr>\n<th>模型<\/th>\n<th>原理（白話）<\/th>\n<th>擅長的資料<\/th>\n<th><span class=\"gl\" data-g=\"1\" tabindex=\"0\" role=\"button\">AIoT<\/span> 應用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"17\" tabindex=\"0\" role=\"button\">CNN<\/span> 卷積神經網路<\/td>\n<td>濾波器（Filter）在資料上滑動，抓「局部特徵」<\/td>\n<td><strong>空間結構<\/strong>：影像、<span class=\"gl\" data-g=\"72\" tabindex=\"0\" role=\"button\">LiDAR<\/span> 點雲<\/td>\n<td><span class=\"gl\" data-g=\"71\" tabindex=\"0\" role=\"button\">AOI<\/span> 檢測瑕疵、缺件、刮傷；3D 物件偵測<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"18\" tabindex=\"0\" role=\"button\">RNN<\/span> 循環神經網路<\/td>\n<td>輸出同時受「當前輸入＋過去狀態」影響（有記憶）<\/td>\n<td><strong><span class=\"gl\" data-g=\"14\" tabindex=\"0\" role=\"button\">時間序列<\/span><\/strong><\/td>\n<td>連續震動、電流、溫度趨勢 → 設備健康評估、負載預測<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"19\" tabindex=\"0\" role=\"button\">LSTM<\/span> 長短期記憶<\/td>\n<td>RNN 的改良，用<strong><span class=\"gl\" data-g=\"20\" tabindex=\"0\" role=\"button\">門控結構<\/span><\/strong>改善長序列「遺忘」問題<\/td>\n<td>長時間序列<\/td>\n<td>同上，序列更長時更好<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：<span class=\"gl\" data-g=\"26\" tabindex=\"0\" role=\"button\">GAN<\/span>（生成對抗網路）主要用來「生成新資料」（例如逼真影像）；<span class=\"gl\" data-g=\"27\" tabindex=\"0\" role=\"button\">隨機森林<\/span>（Random Forest）是<strong>傳統機器學習<\/strong>，不是深度學習。〔出自指引練習題解析 p.3-16〕<\/p>\n<\/blockquote>\n<h2>4. 從訓練到推論：Training-to-Inference Pipeline <span class=\"ref\">考科一 1.1<\/span><span class=\"pg\">指引 p.3-4～3-5<\/span><\/h2>\n<p>模型要真正在工廠跑起來，要走完 5 個階段（順序要記）：<\/p>\n<ol>\n<li><strong><span class=\"gl\" data-g=\"31\" tabindex=\"0\" role=\"button\">資料前處理<\/span>／訊號調理（Data Preprocessing / Signal Conditioning）<\/strong>：濾波、去雜訊、異常值處理、<span class=\"gl\" data-g=\"32\" tabindex=\"0\" role=\"button\">正規化<\/span>（Normalization）、取樣率對齊（Resampling/Alignment）。<\/li>\n<li><strong><span class=\"gl\" data-g=\"28\" tabindex=\"0\" role=\"button\">模型訓練<\/span>（Model Training）<\/strong>：在算力充足的地方（<span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>、<span class=\"gl\" data-g=\"52\" tabindex=\"0\" role=\"button\">GPU<\/span> 工作站）做；切好<strong><span class=\"gl\" data-g=\"30\" tabindex=\"0\" role=\"button\">訓練集<\/span>／驗證集／測試集<\/strong>，並處理<span class=\"gl\" data-g=\"15\" tabindex=\"0\" role=\"button\">類別不平衡<\/span>。<\/li>\n<li><strong><span class=\"gl\" data-g=\"33\" tabindex=\"0\" role=\"button\">模型壓縮<\/span>（Model Compression）<\/strong>：為了放進 <span class=\"gl\" data-g=\"57\" tabindex=\"0\" role=\"button\">MCU<\/span>、嵌入式處理器、邊緣<span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道<\/span> → <strong><span class=\"gl\" data-g=\"34\" tabindex=\"0\" role=\"button\">量化<\/span>（Quantization）<strong>與<\/strong><span class=\"gl\" data-g=\"35\" tabindex=\"0\" role=\"button\">剪枝<\/span>（Pruning）<\/strong>。\n   - 量化 = 把參數從 <strong><span class=\"gl\" data-g=\"36\" tabindex=\"0\" role=\"button\">FP32<\/span>（32 位元浮點）轉成 INT8（8 位元整數）<\/strong>，<span class=\"gl\" data-g=\"324\" tabindex=\"0\" role=\"button\">精確度<\/span>略降，但檔案與記憶體大幅變小、更省電更快。<\/li>\n<li><strong><span class=\"gl\" data-g=\"29\" tabindex=\"0\" role=\"button\">推論<\/span>與系統整合（Inference &amp; System Integration）<\/strong>：部署到<span class=\"gl\" data-g=\"46\" tabindex=\"0\" role=\"button\">邊緣裝置<\/span>或閘道器，結果回饋給 <strong><span class=\"gl\" data-g=\"64\" tabindex=\"0\" role=\"button\">HMI<\/span>、<span class=\"gl\" data-g=\"66\" tabindex=\"0\" role=\"button\">MES<\/span>、<span class=\"gl\" data-g=\"65\" tabindex=\"0\" role=\"button\">SCADA<\/span><\/strong>，形成告警、決策建議或維護指標。<\/li>\n<li><strong>監控與版本管理（Monitoring &amp; Versioning）<\/strong>：持續監看資料分布變化與模型效能，保留版本與推論紀錄，供追蹤與<span class=\"gl\" data-g=\"268\" tabindex=\"0\" role=\"button\">稽核<\/span>。<\/li>\n<\/ol>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：「量化」是 <span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span> 模型<span class=\"gl\" data-g=\"24\" tabindex=\"0\" role=\"button\">權重<\/span>的精度降低；「<span class=\"gl\" data-g=\"320\" tabindex=\"0\" role=\"button\">ADC<\/span> 類比數位轉換」是訊號處理的硬體電路，兩者不同。增加<span class=\"gl\" data-g=\"94\" tabindex=\"0\" role=\"button\">網路層<\/span>數只會更重，不是輕量化。<\/p>\n<\/blockquote>\n<div class=\"cp\" id=\"cp_d1c2\" data-ans=\"2\"><div class=\"cph\">🧩 隨堂小測 2<span class=\"ref\">考科一 1.1<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">某工廠的瑕疵模型已部署半年。最近更換原料供應商後，工程師持續比對新資料的分布與模型準確率，並保留新舊模型版本與推論紀錄以便追查。這項工作屬於「訓練到推論」流程的哪個階段？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 資料前處理／訊號調理<\/button><button class=\"opt cpo\" data-k=\"1\">B. 模型壓縮<\/button><button class=\"opt cpo\" data-k=\"2\">C. 監控與版本管理<\/button><button class=\"opt cpo\" data-k=\"3\">D. 模型訓練<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div>上線後「持續監看資料分布變化與模型效能、保留版本與<span class=\"gl\" data-g=\"29\" tabindex=\"0\" role=\"button\">推論<\/span>紀錄供追蹤<span class=\"gl\" data-g=\"268\" tabindex=\"0\" role=\"button\">稽核<\/span>」正是第 5 階段「監控與版本管理」。前處理是訓練前清理資料；壓縮是<span class=\"gl\" data-g=\"34\" tabindex=\"0\" role=\"button\">量化<\/span>、<span class=\"gl\" data-g=\"35\" tabindex=\"0\" role=\"button\">剪枝<\/span>；訓練是調整<span class=\"gl\" data-g=\"24\" tabindex=\"0\" role=\"button\">權重<\/span>。<\/div><\/div><\/div>\n<h2>5. 模型格式、推論引擎、生成式 AI 與 SLM <span class=\"ref\">考科一 1.1<\/span><span class=\"pg\">指引 p.3-5～3-7<\/span><\/h2>\n<ul>\n<li><strong><span class=\"gl\" data-g=\"37\" tabindex=\"0\" role=\"button\">模型格式<\/span>（Model Format）<\/strong>：模型結構與<span class=\"gl\" data-g=\"24\" tabindex=\"0\" role=\"button\">權重<\/span>的表示方式，如 <strong><span class=\"gl\" data-g=\"38\" tabindex=\"0\" role=\"button\">ONNX<\/span>、<span class=\"gl\" data-g=\"39\" tabindex=\"0\" role=\"button\">TensorFlow<\/span>、PyTorch<\/strong>。對 <span class=\"gl\" data-g=\"1\" tabindex=\"0\" role=\"button\">AIoT<\/span> 工程師而言，重點不是訓練效率，而是能否<strong>穩定、可重複地部署<\/strong>到不同硬體、支援<span class=\"gl\" data-g=\"33\" tabindex=\"0\" role=\"button\">輕量化<\/span>轉換與版本更新。<\/li>\n<li><strong><span class=\"gl\" data-g=\"40\" tabindex=\"0\" role=\"button\">推論引擎<\/span>（Inference Engine）<\/strong>：在實際硬體上執行<span class=\"gl\" data-g=\"29\" tabindex=\"0\" role=\"button\">推論<\/span>的元件，把模型運算對應到處理器或加速器，確保效能與即時性。<\/li>\n<li><strong><span class=\"gl\" data-g=\"41\" tabindex=\"0\" role=\"button\">生成式 AI<\/span>（GenAI）與<span class=\"gl\" data-g=\"42\" tabindex=\"0\" role=\"button\">小型語言模型<\/span>（SLM）<\/strong>：SLM 是可在邊緣執行的輕量語言模型。它在 AIoT 中<strong>不是取代既有感測與預測模型<\/strong>，而是補強「人機互動與決策支援層」，例如把推論結果轉成設備狀態摘要、告警說明、操作建議。邊緣 SLM 可做語意摘要，但<strong>不直接介入設備控制邏輯<\/strong>。<\/li>\n<\/ul>\n<h2>6. 邊緣運算與 Edge AI：為什麼不全部丟雲端 <span class=\"ref\">考科一 1.1<\/span><span class=\"pg\">指引 p.3-7～3-8<\/span><\/h2>\n<p>把所有原始資料上傳<span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>，會卡在三件事：<strong><span class=\"gl\" data-g=\"47\" tabindex=\"0\" role=\"button\">延遲<\/span>（Latency）、<span class=\"gl\" data-g=\"48\" tabindex=\"0\" role=\"button\">頻寬<\/span>（Bandwidth）、隱私（Privacy）<\/strong>。<span class=\"gl\" data-g=\"45\" tabindex=\"0\" role=\"button\">Edge AI<\/span> 的核心精神：<strong>在資料產生端就近處理與<span class=\"gl\" data-g=\"29\" tabindex=\"0\" role=\"button\">推論<\/span>，只回傳必要的特徵、事件或彙整結果<\/strong>。<\/p>\n<p>邊緣推論（Edge Inference）的三大必要性：<\/p>\n<table>\n<thead>\n<tr>\n<th>好處<\/th>\n<th>說明<\/th>\n<th>典型情境<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>低延遲<\/td>\n<td>秒級、毫秒級反應，不必等雲端回傳<\/td>\n<td>安全告警、設備保護、即時控制<\/td>\n<\/tr>\n<tr>\n<td>節省頻寬<\/td>\n<td>只送特徵、事件或結果<\/td>\n<td>影像串流、高頻震動訊號<\/td>\n<\/tr>\n<tr>\n<td>隱私保護<\/td>\n<td>敏感資料留在場域內<\/td>\n<td>攝影機只上傳骨架或特徵值<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：<span class=\"gl\" data-g=\"44\" tabindex=\"0\" role=\"button\">邊緣運算<\/span>是把計算移到<strong>靠近資料源頭的網路邊緣<\/strong>，不是「移到雲端」。（指引 p.4-83 練習題解析也特別強調）<\/p>\n<\/blockquote>\n<h2>7. 邊緣 AI 硬體加速器 <span class=\"ref\">考科一 1.1<\/span><span class=\"pg\">指引 p.3-8～3-9<\/span><\/h2>\n<p>只用通用 <span class=\"gl\" data-g=\"51\" tabindex=\"0\" role=\"button\">CPU<\/span> 跑 <span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span>，常在效能、<span class=\"gl\" data-g=\"47\" tabindex=\"0\" role=\"button\">延遲<\/span>或能耗上不夠，所以搭配專用加速器：<\/p>\n<table>\n<thead>\n<tr>\n<th>加速器<\/th>\n<th>特性<\/th>\n<th>優點<\/th>\n<th>限制／適用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"52\" tabindex=\"0\" role=\"button\">GPU<\/span><\/td>\n<td>大量平行運算核心<\/td>\n<td>生態成熟、開發彈性高<\/td>\n<td>功耗較高；適合<span class=\"gl\" data-g=\"63\" tabindex=\"0\" role=\"button\">工業電腦<\/span>（IPC）、多路影像分析、<span class=\"gl\" data-g=\"71\" tabindex=\"0\" role=\"button\">AOI<\/span>、交通監控<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"53\" tabindex=\"0\" role=\"button\">NPU<\/span><\/td>\n<td>專為<span class=\"gl\" data-g=\"3\" tabindex=\"0\" role=\"button\">深度學習<\/span><strong><span class=\"gl\" data-g=\"29\" tabindex=\"0\" role=\"button\">推論<\/span><\/strong>設計，常以 <strong><span class=\"gl\" data-g=\"55\" tabindex=\"0\" role=\"button\">ASIC<\/span><\/strong> 形式實作；針對矩陣與卷積運算最佳化<\/td>\n<td>低功耗、高效能推論；執行 <span class=\"gl\" data-g=\"36\" tabindex=\"0\" role=\"button\">INT8<\/span> <span class=\"gl\" data-g=\"34\" tabindex=\"0\" role=\"button\">量化<\/span>模型與 <span class=\"gl\" data-g=\"42\" tabindex=\"0\" role=\"button\">SLM<\/span> 的重要基礎<\/td>\n<td>定位「推論專用（Inference-only）」，<strong>不適合訓練<\/strong>（訓練要大量浮點與<span class=\"gl\" data-g=\"25\" tabindex=\"0\" role=\"button\">反向傳播<\/span>）<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"54\" tabindex=\"0\" role=\"button\">FPGA<\/span><\/td>\n<td>可重新配置硬體邏輯<\/td>\n<td>低延遲、高度客製化<\/td>\n<td>開發門檻高；適合工業控制、安全監測等極度即時場域<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 記法<\/strong>：GPU＝「力氣大、吃電多」；NPU＝「只做推論、超省電」；FPGA＝「可改線路、門檻高」。NPU 是協同處理器，<span class=\"gl\" data-g=\"436\" tabindex=\"0\" role=\"button\">OS<\/span> 與 <span class=\"gl\" data-g=\"398\" tabindex=\"0\" role=\"button\">I/O<\/span> 仍由 CPU 負責；<span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>訓練多用 GPU 或 <span class=\"gl\" data-g=\"56\" tabindex=\"0\" role=\"button\">TPU<\/span>。〔指引 p.3-16 解析〕<\/p>\n<\/blockquote>\n<div class=\"cp\" id=\"cp_d1c3\" data-ans=\"1\"><div class=\"cph\">🧩 隨堂小測 3<span class=\"ref\">考科一 1.1<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">某產線的安全監測模組需要「極低且可預期」的反應延遲，並希望依自家需求客製硬體邏輯；公司有硬體工程團隊，可以接受較高的開發門檻。依講義的比較，最適合的加速器是？<\/div><button class=\"opt cpo\" data-k=\"0\">A. GPU<\/button><button class=\"opt cpo\" data-k=\"1\">B. FPGA<\/button><button class=\"opt cpo\" data-k=\"2\">C. NPU<\/button><button class=\"opt cpo\" data-k=\"3\">D. 只用通用 CPU<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div><span class=\"gl\" data-g=\"54\" tabindex=\"0\" role=\"button\">FPGA<\/span> 可重新配置硬體邏輯，特點是低<span class=\"gl\" data-g=\"47\" tabindex=\"0\" role=\"button\">延遲<\/span>、高度客製化，適合工業控制與安全監測等極度即時場域，缺點是開發門檻高。<span class=\"gl\" data-g=\"52\" tabindex=\"0\" role=\"button\">GPU<\/span> 功耗高、偏通用平行運算；<span class=\"gl\" data-g=\"53\" tabindex=\"0\" role=\"button\">NPU<\/span> 主打低功耗<span class=\"gl\" data-g=\"29\" tabindex=\"0\" role=\"button\">推論<\/span>；只用 <span class=\"gl\" data-g=\"51\" tabindex=\"0\" role=\"button\">CPU<\/span> 常在延遲與效能上不足。<\/div><\/div><\/div>\n<h2>8. 分佈式 AI：端雲協作與聯合學習 <span class=\"ref\">考科一 1.1<\/span><span class=\"pg\">指引 p.3-10<\/span><\/h2>\n<ul>\n<li><strong><span class=\"gl\" data-g=\"49\" tabindex=\"0\" role=\"button\">端雲協作<\/span>（Edge–Cloud Collaboration）<\/strong>：典型模式是 <strong>「訓練在<span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>、<span class=\"gl\" data-g=\"29\" tabindex=\"0\" role=\"button\">推論<\/span>在邊緣」<\/strong>。雲端彙整多場域歷史資料做訓練與參數更新；邊緣負責即時推論，網路不穩時也能持續運作。這是目前主流設計。<\/li>\n<li><strong><span class=\"gl\" data-g=\"50\" tabindex=\"0\" role=\"button\">聯合學習<\/span>（Federated Learning, FL；也常譯「聯邦學習」）<\/strong>：各邊緣節點用<strong>本地資料<\/strong>訓練，只把**模型更新參數（<span class=\"gl\" data-g=\"24\" tabindex=\"0\" role=\"button\">權重<\/span>或<span class=\"gl\" data-g=\"23\" tabindex=\"0\" role=\"button\">梯度<\/span>）**上傳雲端聚合，<strong>原始資料不離開本地<\/strong>。適合智慧製造、智慧醫療等跨組織、敏感資料場域。<\/li>\n<li>邊緣節點之間也可透過區域<span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span>共享模型版本、同步異常事件；設計時要考量資料流向、模型更新<span class=\"gl\" data-g=\"366\" tabindex=\"0\" role=\"button\">頻率<\/span>、通訊成本與治理需求，避免過度集中或過度分散。<\/li>\n<\/ul>\n<h2>9. AI 倫理、治理與法規 <span class=\"ref\">考科一 1.1<\/span><span class=\"pg\">指引 p.3-11～3-13<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>議題<\/th>\n<th>重點<\/th>\n<th>工程上怎麼做<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>演算法偏誤與決策風險<\/td>\n<td>訓練資料有偏差或不完整 → 系統性誤判；<span class=\"gl\" data-g=\"41\" tabindex=\"0\" role=\"button\">GenAI<\/span> 的自然語言輸出易被誤認為「權威」<\/td>\n<td><span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span> 定位為**「輔助判斷」而非「最終決策者」**；資料要涵蓋多元運作狀態<\/td>\n<\/tr>\n<tr>\n<td>隱私保護與資料治理<\/td>\n<td>操作紀錄、互動語句可能洩漏隱私<\/td>\n<td><strong><span class=\"gl\" data-g=\"82\" tabindex=\"0\" role=\"button\">Privacy by Design<\/span>（PbD，由設計起始的隱私）<\/strong>：架構設計時就納入保護；<span class=\"gl\" data-g=\"42\" tabindex=\"0\" role=\"button\">SLM<\/span> 在邊緣在地<span class=\"gl\" data-g=\"29\" tabindex=\"0\" role=\"button\">推論<\/span>；管控存取權限、推論紀錄、資料生命<span class=\"gl\" data-g=\"368\" tabindex=\"0\" role=\"button\">週期<\/span><\/td>\n<\/tr>\n<tr>\n<td>可信任 AI 與可解釋性<\/td>\n<td>工控、公共安全需可預期、可解釋、穩定<\/td>\n<td><strong><span class=\"gl\" data-g=\"83\" tabindex=\"0\" role=\"button\">XAI<\/span>（可解釋 AI）<\/strong>＋清楚的<span class=\"gl\" data-g=\"64\" tabindex=\"0\" role=\"button\">人機介面<\/span>；GenAI 做決策輔助，不直接控制設備<\/td>\n<\/tr>\n<tr>\n<td>AI 治理與問責<\/td>\n<td>出事時要能釐清責任<\/td>\n<td>模型版本管理、推論紀錄保存、<strong>人工介入機制<\/strong>；參考 <strong><span class=\"gl\" data-g=\"84\" tabindex=\"0\" role=\"button\">ISO/IEC 42001<\/span><\/strong>（AI 管理系統）、<strong><span class=\"gl\" data-g=\"85\" tabindex=\"0\" role=\"button\">歐盟 AI Act<\/span><\/strong>（依風險分級）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 例子（PbD）<\/strong>：攝影機在<span class=\"gl\" data-g=\"44\" tabindex=\"0\" role=\"button\">邊緣端<\/span>就做<span class=\"gl\" data-g=\"305\" tabindex=\"0\" role=\"button\">去識別化<\/span>，只送骨架或特徵值上雲 ✅；把原始畫面全部上傳「以備不時之需」❌；要求使用者簽「放棄隱私權同意書」只是法律免責，不是 by Design ❌。<\/p>\n<\/blockquote>\n<p><span class=\"ref\">考科一 1.1<\/span><span class=\"supp\">補充<\/span> 歐盟 AI Act 採風險分級：不可接受風險（禁止）、高風險（嚴格義務）、有限風險（透明義務）、最低風險。考試若出現，記住「<strong>依風險等級給不同要求<\/strong>」這個核心即可。<\/p>\n<h2>10. AIoT 三大智慧化應用模式 <span class=\"ref\">考科一 1.2<\/span><span class=\"pg\">指引 p.3-18～3-19<\/span><\/h2>\n<h3>(1) 預測性維護（Predictive Maintenance, PdM）<\/h3>\n<ul>\n<li>定義：以**設備實際運轉狀態（Condition-based）**為基礎的主動式維護，用即時感測＋歷史資料，以 <span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span> 預測潛在故障。<\/li>\n<li>資料來源：工具機控制器或外掛<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>（<strong>震動、電流、溫度<\/strong>），常結合智慧機聯網架構。<\/li>\n<li>AI 兩個角色（必考）：<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>任務<\/th>\n<th>問的問題<\/th>\n<th><span class=\"gl\" data-g=\"2\" tabindex=\"0\" role=\"button\">ML<\/span> 任務類型<\/th>\n<th>輸出<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"76\" tabindex=\"0\" role=\"button\">故障診斷<\/span> Diagnosis<\/td>\n<td>「現在正常嗎？是哪種故障？」<\/td>\n<td><strong><span class=\"gl\" data-g=\"10\" tabindex=\"0\" role=\"button\">分類<\/span><\/strong><\/td>\n<td>類別<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"77\" tabindex=\"0\" role=\"button\">健康預測<\/span> Prognosis<\/td>\n<td>「還能撐多久？」<\/td>\n<td><strong><span class=\"gl\" data-g=\"11\" tabindex=\"0\" role=\"button\">迴歸<\/span><\/strong><\/td>\n<td><span class=\"gl\" data-g=\"78\" tabindex=\"0\" role=\"button\">剩餘有效壽命<\/span> <strong>RUL<\/strong>（連續數值）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><span class=\"ref\">考科一 1.2<\/span><span class=\"supp\">補充<\/span> 三種維護策略對照：<strong>事後維修<\/strong>（壞了才修，停機損失大）→ <strong><span class=\"gl\" data-g=\"75\" tabindex=\"0\" role=\"button\">預防保養<\/span><\/strong>（固定<span class=\"gl\" data-g=\"368\" tabindex=\"0\" role=\"button\">週期<\/span>換，可能過度維護）→ <strong><span class=\"gl\" data-g=\"74\" tabindex=\"0\" role=\"button\">預測性維護<\/span><\/strong>（依狀態在對的時間修）。指引 p.4-17 也提到傳統定期保養「往往造成過度維護或無預警停機」。<\/p>\n<h3>(2) 感測融合（Sensor Fusion）<\/h3>\n<ul>\n<li>用 AI 整合<strong>多個不同類型<\/strong>感測器的資訊，提升判斷<span class=\"gl\" data-g=\"324\" tabindex=\"0\" role=\"button\">準確度<\/span>與穩定性（<strong><span class=\"gl\" data-g=\"80\" tabindex=\"0\" role=\"button\">強健性<\/span> Robustness<\/strong>）。<\/li>\n<li>例：震動＋溫度一起看，區分「設備真的異常」還是「環境干擾」；影像＋<span class=\"gl\" data-g=\"72\" tabindex=\"0\" role=\"button\">光達<\/span>，暗處也看得清。<\/li>\n<li><span class=\"gl\" data-g=\"79\" tabindex=\"0\" role=\"button\">感測融合<\/span>通常<strong>需要更多感測器<\/strong>（成本可能增加，換取可靠度），也常在<span class=\"gl\" data-g=\"44\" tabindex=\"0\" role=\"button\">邊緣端<\/span>（如車載電腦）即時執行。<\/li>\n<\/ul>\n<div class=\"cp\" id=\"cp_d1c4\" data-ans=\"1\"><div class=\"cph\">🧩 隨堂小測 4<span class=\"ref\">考科一 1.2<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">某工廠規定「每 3 個月固定更換一次主軸軸承」，不論軸承實際狀況如何。依講義的三種維護策略，這屬於哪一種？它最常見的缺點是什麼？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 事後維修；停機損失最小<\/button><button class=\"opt cpo\" data-k=\"1\">B. 預防保養；可能過度維護，也可能在週期之間無預警故障<\/button><button class=\"opt cpo\" data-k=\"2\">C. 預測性維護；需要大量 AI 運算<\/button><button class=\"opt cpo\" data-k=\"3\">D. 預測性維護；只能用在新設備<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div>依固定<span class=\"gl\" data-g=\"368\" tabindex=\"0\" role=\"button\">週期<\/span>保養、不看實際狀態＝<span class=\"gl\" data-g=\"75\" tabindex=\"0\" role=\"button\">預防保養<\/span>，指引提到這種做法「往往造成過度維護或無預警停機」。事後維修是壞了才修；<span class=\"gl\" data-g=\"74\" tabindex=\"0\" role=\"button\">預測性維護<\/span>是依實際運轉狀態預測故障、在對的時間修。<\/div><\/div><\/div>\n<h2>11. 四位一體循環（AIoT Integrated Cycle） <span class=\"ref\">考科一 1.2<\/span><span class=\"pg\">指引 p.3-19～3-20<\/span><\/h2>\n<p>分析任何 <span class=\"gl\" data-g=\"1\" tabindex=\"0\" role=\"button\">AIoT<\/span> 案例的通用框架，資料從物理世界走到數位決策：<\/p>\n<table>\n<thead>\n<tr>\n<th>構面<\/th>\n<th>關注什麼<\/th>\n<th>例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>感知端 Input<\/td>\n<td>感測什麼（溫度、影像、震動）、取樣<span class=\"gl\" data-g=\"366\" tabindex=\"0\" role=\"button\">頻率<\/span>與<span class=\"gl\" data-g=\"322\" tabindex=\"0\" role=\"button\">解析度<\/span>夠不夠<\/td>\n<td>主軸震動、加工電流<\/td>\n<\/tr>\n<tr>\n<td>通訊端 Transport<\/td>\n<td>距離、功耗、即時性<\/td>\n<td>長距離低功耗 → <span class=\"gl\" data-g=\"157\" tabindex=\"0\" role=\"button\">LoRa<\/span>；短距離或高即時 → <span class=\"gl\" data-g=\"138\" tabindex=\"0\" role=\"button\">Bluetooth<\/span>、<span class=\"gl\" data-g=\"131\" tabindex=\"0\" role=\"button\">Wi-Fi<\/span><\/td>\n<\/tr>\n<tr>\n<td>智慧端 <span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span>/Process<\/td>\n<td>AI 做<strong>即時判斷（Judgment）<strong>還是<\/strong>趨勢預測（Prediction）<\/strong><\/td>\n<td>換刀預警、趨勢分析<\/td>\n<\/tr>\n<tr>\n<td>安全端 Security<\/td>\n<td>終端實體安全、通訊攔截、敏感資訊外洩<\/td>\n<td>指的是<strong>資訊安全<\/strong>，不是工廠保全<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：感知端（<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>）通常<strong>沒有能力做<span class=\"gl\" data-g=\"28\" tabindex=\"0\" role=\"button\">模型訓練<\/span><\/strong>；訓練多在<span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>。<\/p>\n<\/blockquote>\n<h2>12. 四大場域案例 <span class=\"ref\">考科一 1.2<\/span><span class=\"pg\">指引 p.3-20～3-22<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>場域<\/th>\n<th>目標<\/th>\n<th>感測<\/th>\n<th>通訊／標準<\/th>\n<th><span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span> 應用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>智慧製造<\/td>\n<td>工具機即時監控、提升品質降損耗<\/td>\n<td>震動（主軸）、電流（負載與能耗）<\/td>\n<td><span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span>把異質設備資料轉成 <strong><span class=\"gl\" data-g=\"209\" tabindex=\"0\" role=\"button\">OPC UA<\/span><\/strong> 統一格式，AI 再讀取<\/td>\n<td>刀具震動特徵異常 → <strong>提前換刀預警<\/strong><\/td>\n<\/tr>\n<tr>\n<td>智慧農業<\/td>\n<td>大面積溫室／農場環境監測調控<\/td>\n<td>溫濕度、土壤水分<\/td>\n<td><strong><span class=\"gl\" data-g=\"155\" tabindex=\"0\" role=\"button\">LPWAN<\/span>（如 <span class=\"gl\" data-g=\"157\" tabindex=\"0\" role=\"button\">LoRa<\/span>）<\/strong>：數公里、電池供電<\/td>\n<td>依歷史資料自動調整噴灌、啟動通風<\/td>\n<\/tr>\n<tr>\n<td>智慧交通與物流<\/td>\n<td>共享運具調度、倉儲自動盤點<\/td>\n<td><strong><span class=\"gl\" data-g=\"171\" tabindex=\"0\" role=\"button\">GPS<\/span><\/strong> 定位、<strong><span class=\"gl\" data-g=\"124\" tabindex=\"0\" role=\"button\">RFID<\/span><\/strong> 貨物識別<\/td>\n<td><strong><span class=\"gl\" data-g=\"161\" tabindex=\"0\" role=\"button\">4G<\/span>/<span class=\"gl\" data-g=\"162\" tabindex=\"0\" role=\"button\">5G<\/span><\/strong> 行動通訊即時回傳<\/td>\n<td>配送路徑最佳化、共享運具需求預測<\/td>\n<\/tr>\n<tr>\n<td>智慧居家<\/td>\n<td>智慧門鎖、室內環境自動調節<\/td>\n<td>環境光<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>、<strong><span class=\"gl\" data-g=\"335\" tabindex=\"0\" role=\"button\">PIR<\/span><\/strong> 被動紅外線<\/td>\n<td><strong><span class=\"gl\" data-g=\"128\" tabindex=\"0\" role=\"button\">NFC<\/span><\/strong> 近距離解鎖、短距離低功耗無線<\/td>\n<td>學習作息偏好，自動調燈光與空調<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 重要觀念<\/strong>：AI 模型通常<strong>不直接讀 <span class=\"gl\" data-g=\"68\" tabindex=\"0\" role=\"button\">PLC<\/span> 或感測器原始訊號<\/strong>，而是經閘道器轉成 OPC UA 等標準格式後再讀取（指引 p.3-20～3-21）。<span class=\"gl\" data-g=\"106\" tabindex=\"0\" role=\"button\">HTTP<\/span> 雖通用，但不是工業底層設備資料交換的首選；USB 只是實體介面，解決不了不同廠牌暫存器定義不一致的問題。<\/p>\n<\/blockquote>\n<h3>今日 30 秒回顧<\/h3>\n<p>監督（有標籤：<span class=\"gl\" data-g=\"10\" tabindex=\"0\" role=\"button\">分類<\/span>/<span class=\"gl\" data-g=\"11\" tabindex=\"0\" role=\"button\">迴歸<\/span>）、非監督（無標籤：<span class=\"gl\" data-g=\"12\" tabindex=\"0\" role=\"button\">分群<\/span>/異常）、強化（獎勵：控制）｜<span class=\"gl\" data-g=\"17\" tabindex=\"0\" role=\"button\">CNN<\/span> 空間、<span class=\"gl\" data-g=\"18\" tabindex=\"0\" role=\"button\">RNN<\/span>/<span class=\"gl\" data-g=\"19\" tabindex=\"0\" role=\"button\">LSTM<\/span> 時間｜前處理→訓練→壓縮（<span class=\"gl\" data-g=\"36\" tabindex=\"0\" role=\"button\">FP32<\/span>→INT8）→<span class=\"gl\" data-g=\"29\" tabindex=\"0\" role=\"button\">推論<\/span>整合→監控版本｜<span class=\"gl\" data-g=\"45\" tabindex=\"0\" role=\"button\">Edge AI<\/span>＝低<span class=\"gl\" data-g=\"47\" tabindex=\"0\" role=\"button\">延遲<\/span>＋省<span class=\"gl\" data-g=\"48\" tabindex=\"0\" role=\"button\">頻寬<\/span>＋隱私｜<span class=\"gl\" data-g=\"53\" tabindex=\"0\" role=\"button\">NPU<\/span> 推論專用｜訓練在雲、推論在邊；<span class=\"gl\" data-g=\"50\" tabindex=\"0\" role=\"button\">FL<\/span> 只傳參數｜<span class=\"gl\" data-g=\"82\" tabindex=\"0\" role=\"button\">PbD<\/span>、<span class=\"gl\" data-g=\"83\" tabindex=\"0\" role=\"button\">XAI<\/span>、AI 輔助不做最終決策｜<span class=\"gl\" data-g=\"76\" tabindex=\"0\" role=\"button\">Diagnosis<\/span> 分類、<span class=\"gl\" data-g=\"77\" tabindex=\"0\" role=\"button\">Prognosis<\/span> 迴歸（<span class=\"gl\" data-g=\"78\" tabindex=\"0\" role=\"button\">RUL<\/span>）｜<span class=\"gl\" data-g=\"81\" tabindex=\"0\" role=\"button\">四位一體<\/span>：感知、通訊、智慧、安全。<\/p>", "audio": {"src": "audio/d01.mp3?v=2", "dur": 912}, "questions": [{"id": "d1q1", "n": 1, "opts": ["監督式學習的迴歸任務", "監督式學習的分類任務", "非監督式學習的分群任務", "強化學習的控制任務"], "exp": "有歷史「正確答案」（實際耗電）可當標籤 → 監督式；輸出是連續數值（kWh）→ 迴歸。分類輸出離散類別；分群沒有標籤；強化學習靠獎勵與環境互動，用於動態控制。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某工廠想依據馬達的電流波形預測「下個月的耗電量（kWh）」，並有過去三年的實際耗電紀錄可供訓練。此任務最適合歸類為下列何者？", "ref": "考科一 1.1", "src": "指引 p.3-2", "ans": 0, "stemH": "某工廠想依據馬達的電流波形預測「下個月的耗電量（kWh）」，並有過去三年的實際耗電紀錄可供訓練。此任務最適合歸類為下列何者？", "optsH": ["監督式學習的迴歸任務", "監督式學習的分類任務", "非監督式學習的分群任務", "強化學習的控制任務"], "expH": "有歷史「正確答案」（實際耗電）可當標籤 → <span class=\"gl\" data-g=\"5\" tabindex=\"0\" role=\"button\">監督式<\/span>；輸出是連續數值（kWh）→ <span class=\"gl\" data-g=\"11\" tabindex=\"0\" role=\"button\">迴歸<\/span>。<span class=\"gl\" data-g=\"10\" tabindex=\"0\" role=\"button\">分類<\/span>輸出離散類別；<span class=\"gl\" data-g=\"12\" tabindex=\"0\" role=\"button\">分群<\/span>沒有標籤；<span class=\"gl\" data-g=\"7\" tabindex=\"0\" role=\"button\">強化學習<\/span>靠獎勵與環境互動，用於動態控制。"}, {"id": "d1q2", "n": 2, "opts": ["用故障類別標籤訓練多類別分類模型", "用正常資料建立分布邊界，進行異常偵測（Anomaly Detection）", "用強化學習讓馬達自行嘗試各種轉速", "用迴歸模型預測產品售價"], "exp": "指引指出異常偵測「以正常資料建立分布邊界」，特別適用於故障樣本難以蒐集的工業現場。A 缺少故障標籤無法訓練；C 試探式決策有安全疑慮且不符需求；D 無關。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "工廠剛導入新產線，幾乎沒有故障樣本，只累積了大量「正常運轉」的震動資料。若想及早發現偏離正常行為的狀況，最合適的做法是？", "ref": "考科一 1.1", "src": "指引 p.3-2", "ans": 1, "stemH": "工廠剛導入新產線，幾乎沒有故障樣本，只累積了大量「正常運轉」的震動資料。若想及早發現偏離正常行為的狀況，最合適的做法是？", "optsH": ["用故障類別標籤訓練多類別分類模型", "用正常資料建立分布邊界，進行異常偵測（Anomaly Detection）", "用強化學習讓馬達自行嘗試各種轉速", "用迴歸模型預測產品售價"], "expH": "指引指出<span class=\"gl\" data-g=\"13\" tabindex=\"0\" role=\"button\">異常偵測<\/span>「以正常資料建立分布邊界」，特別適用於故障樣本難以蒐集的工業現場。A 缺少故障標籤無法訓練；C 試探式決策有安全疑慮且不符需求；D 無關。"}, {"id": "d1q3", "n": 3, "opts": ["需要大量標註好的影像資料才能訓練", "代理人（Agent）依行動後的獎勵或懲罰調整策略，常用於 HVAC 節能等動態控制", "主要用來把相似資料自動分群", "因不涉及試探，導入時不必界定安全邊界"], "exp": "強化學習透過與環境互動、依獎勵調整策略以最大化累積獎勵，常用於動態控制或參數最佳化（如 HVAC）。因涉及試探式決策，指引特別提醒「需事先界定安全邊界與測試方式」，所以 D 錯。A 是監督式；C 是非監督式分群。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "關於強化學習（Reinforcement Learning）在 AIoT 的應用，下列敘述何者最正確？", "ref": "考科一 1.1", "src": "指引 p.3-3", "ans": 1, "stemH": "關於強化學習（Reinforcement Learning）在 AIoT 的應用，下列敘述何者最正確？", "optsH": ["需要大量標註好的影像資料才能訓練", "代理人（Agent）依行動後的獎勵或懲罰調整策略，常用於 HVAC 節能等動態控制", "主要用來把相似資料自動分群", "因不涉及試探，導入時不必界定安全邊界"], "expH": "<span class=\"gl\" data-g=\"7\" tabindex=\"0\" role=\"button\">強化學習<\/span>透過與環境互動、依獎勵調整策略以最大化累積獎勵，常用於動態控制或參數最佳化（如 <span class=\"gl\" data-g=\"73\" tabindex=\"0\" role=\"button\">HVAC<\/span>）。因涉及試探式決策，指引特別提醒「需事先界定安全邊界與測試方式」，所以 D 錯。A 是<span class=\"gl\" data-g=\"5\" tabindex=\"0\" role=\"button\">監督式<\/span>；C 是<span class=\"gl\" data-g=\"6\" tabindex=\"0\" role=\"button\">非監督式<\/span><span class=\"gl\" data-g=\"12\" tabindex=\"0\" role=\"button\">分群<\/span>。"}, {"id": "d1q4", "n": 4, "opts": ["AOI 工件刮傷影像－RNN", "馬達連續電流趨勢－CNN 以外別無選擇", "產線瑕疵影像－CNN；設備震動時間序列－LSTM", "LiDAR 點雲－GAN"], "exp": "CNN 用濾波器擷取局部（空間）特徵，適合影像與點雲；RNN/LSTM 有記憶機制，適合時間序列。GAN 用於生成資料。B 的說法過於絕對（1D-CNN 也可處理時序，但 RNN/LSTM 更具代表性）。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "下列「資料型態－深度學習模型」的配對，何者最恰當？", "ref": "考科一 1.1", "src": "指引 p.3-3～3-4", "ans": 2, "stemH": "下列「資料型態－深度學習模型」的配對，何者最恰當？", "optsH": ["AOI 工件刮傷影像－RNN", "馬達連續電流趨勢－CNN 以外別無選擇", "產線瑕疵影像－CNN；設備震動時間序列－LSTM", "LiDAR 點雲－GAN"], "expH": "<span class=\"gl\" data-g=\"17\" tabindex=\"0\" role=\"button\">CNN<\/span> 用濾波器擷取局部（空間）特徵，適合影像與點雲；<span class=\"gl\" data-g=\"18\" tabindex=\"0\" role=\"button\">RNN<\/span>/<span class=\"gl\" data-g=\"19\" tabindex=\"0\" role=\"button\">LSTM<\/span> 有記憶機制，適合<span class=\"gl\" data-g=\"14\" tabindex=\"0\" role=\"button\">時間序列<\/span>。<span class=\"gl\" data-g=\"26\" tabindex=\"0\" role=\"button\">GAN<\/span> 用於生成資料。B 的說法過於絕對（1D-CNN 也可處理時序，但 RNN/LSTM 更具代表性）。"}, {"id": "d1q5", "n": 5, "opts": ["資料前處理 → 模型訓練 → 模型壓縮 → 推論與系統整合 → 監控與版本管理", "模型訓練 → 資料前處理 → 推論與整合 → 模型壓縮 → 監控與版本管理", "模型壓縮 → 資料前處理 → 模型訓練 → 監控與版本管理 → 推論與整合", "資料前處理 → 推論與系統整合 → 模型訓練 → 模型壓縮 → 監控與版本管理"], "exp": "指引圖 3-1-1 的流程：資料前處理/訊號調理 → 模型訓練 → 模型壓縮（量化、剪枝）→ 推論與系統整合（回饋 HMI/MES/SCADA）→ 監控與版本管理。", "origin": "原創練習題（依官方評鑑範圍撰寫 用層", "TCP/IP 直接刪除了 OSI 的傳輸層，所以沒有 TCP 與 UDP", "OSI 的實體層對應到 TCP/IP 的應用層", "兩者層數不同，因此完全無法對照"], "exp": "TCP/IP 不是砍掉 OSI 的層，而是把功能相近的層合併：應用＋表達＋會議→應用層；資料鏈結＋實體→網路介面（鏈結）層。傳輸層仍在（TCP/UDP）；兩者可以逐層對照。", "stem": "關於 OSI 七層模型與 TCP/IP 四層模型的關係，下列敘述何者最正確？", "ans": 0, "id": "d2c2", "n": 2, "stemH": "關於 OSI 七層模型與 TCP/IP 四層模型的關係，下列敘述何者最正確？", "optsH": ["TCP/IP 把 OSI 中功能相近的層「合併」，例如 OSI 的應用、表達、會議層合併為 TCP/IP 的應用層", "TCP/IP 直接刪除了 OSI 的傳輸層，所以沒有 TCP 與 UDP", "OSI 的實體層對應到 TCP/IP 的應用層", "兩者層數不同，因此完全無法對照"], "expH": "<span class=\"gl\" data-g=\"99\" tabindex=\"0\" role=\"button\">TCP/IP<\/span> 不是砍掉 <span class=\"gl\" data-g=\"98\" tabindex=\"0\" role=\"button\">OSI<\/span> 的層，而是把功能相近的層合併：應用＋表達＋會議→<span class=\"gl\" data-g=\"95\" tabindex=\"0\" role=\"button\">應用層<\/span>；資料鏈結＋實體→網路介面（鏈結）層。傳輸層仍在（<span class=\"gl\" data-g=\"100\" tabindex=\"0\" role=\"button\">TCP<\/span>/<span class=\"gl\" data-g=\"101\" tabindex=\"0\" role=\"button\">UDP<\/span>）；兩者可以逐層對照。"}, {"ref": "考科一 2.2", "opts": ["電池供電的門窗感測器", "插電的智慧插座", "再加一台協調器，讓兩台協調器一起管理", "用手機直接當路由器"], "exp": "路由器要負責轉發封包，需長期供電，典型是插電設備（燈泡、插座）。電池設備適合當不轉發、多半睡眠的終端裝置；每個 Zigbee 網路只能有一個協調器；手機沒有 Zigbee 晶片。", "stem": "小明家的 Zigbee 智慧家庭有：一台 Hub、三個插電的智慧插座、五個電池供電的門窗感測器。若想延伸 Zigbee 網路的覆蓋範圍，最適合擔任「路由器（Router）」角色的是？", "ans": 1, "id": "d2c3", "n": 3, "stemH": "小明家的 Zigbee 智慧家庭有：一台 Hub、三個插電的智慧插座、五個電池供電的門窗感測器。若想延伸 Zigbee 網路的覆蓋範圍，最適合擔任「路由器（Router）」角色的是？", "optsH": ["電池供電的門窗感測器", "插電的智慧插座", "再加一台協調器，讓兩台協調器一起管理", "用手機直接當路由器"], "expH": "路由器要負責轉發<span class=\"gl\" data-g=\"113\" tabindex=\"0\" role=\"button\">封包<\/span>，需長期供電，典型是插電設備（燈泡、插座）。電池設備適合當不轉發、多半睡眠的終端裝置；每個 <span class=\"gl\" data-g=\"146\" tabindex=\"0\" role=\"button\">Zigbee<\/span> 網路只能有一個<span class=\"gl\" data-g=\"147\" tabindex=\"0\" role=\"button\">協調器<\/span>；手機沒有 Zigbee 晶片。"}], "lecture": "<h3>今天要搞懂的 5 件事<\/h3>\n<ol>\n<li><span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">物聯網<\/span>三層架構：<span class=\"gl\" data-g=\"93\" tabindex=\"0\" role=\"button\">感知層<\/span>、<span class=\"gl\" data-g=\"94\" tabindex=\"0\" role=\"button\">網路層<\/span>、<span class=\"gl\" data-g=\"95\" tabindex=\"0\" role=\"button\">應用層<\/span>各做什麼。<\/li>\n<li>常見感測模組（<span class=\"gl\" data-g=\"335\" tabindex=\"0\" role=\"button\">PIR<\/span>、<span class=\"gl\" data-g=\"336\" tabindex=\"0\" role=\"button\">DHT11<\/span>、<span class=\"gl\" data-g=\"337\" tabindex=\"0\" role=\"button\">HC-SR04<\/span>、<span class=\"gl\" data-g=\"338\" tabindex=\"0\" role=\"button\">ADXL345<\/span>、<span class=\"gl\" data-g=\"339\" tabindex=\"0\" role=\"button\">MPU6050<\/span>、<span class=\"gl\" data-g=\"340\" tabindex=\"0\" role=\"button\">MQ-2<\/span>、<span class=\"gl\" data-g=\"360\" tabindex=\"0\" role=\"button\">光敏電阻<\/span>）的原理與用途。<\/li>\n<li><span class=\"gl\" data-g=\"98\" tabindex=\"0\" role=\"button\">OSI 七層<\/span> vs. <span class=\"gl\" data-g=\"99\" tabindex=\"0\" role=\"button\">TCP/IP 四層<\/span>，各層代表協定。<\/li>\n<li><span class=\"gl\" data-g=\"124\" tabindex=\"0\" role=\"button\">RFID<\/span> 頻段表、RFID vs. <span class=\"gl\" data-g=\"128\" tabindex=\"0\" role=\"button\">NFC<\/span>、NFC 三種模式。<\/li>\n<li><span class=\"gl\" data-g=\"131\" tabindex=\"0\" role=\"button\">Wi-Fi<\/span> 各世代、<span class=\"gl\" data-g=\"139\" tabindex=\"0\" role=\"button\">BLE<\/span>、<span class=\"gl\" data-g=\"146\" tabindex=\"0\" role=\"button\">Zigbee<\/span>、<span class=\"gl\" data-g=\"156\" tabindex=\"0\" role=\"button\">NB-IoT<\/span>、<span class=\"gl\" data-g=\"157\" tabindex=\"0\" role=\"button\">LoRaWAN<\/span>、<span class=\"gl\" data-g=\"161\" tabindex=\"0\" role=\"button\">4G<\/span>/<span class=\"gl\" data-g=\"162\" tabindex=\"0\" role=\"button\">5G<\/span> 的「距離／功耗／<span class=\"gl\" data-g=\"48\" tabindex=\"0\" role=\"button\">頻寬<\/span>」取捨。<\/li>\n<\/ol>\n<h2>1. 物聯網三層架構 <span class=\"ref\">考科一 2.1<\/span><span class=\"pg\">指引 p.4-1<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">物聯網<\/span>要做到「<strong>全面感知、可靠傳遞、智慧處理<\/strong>」三大特徵；ITU 與多數標準組織把架構分三層：<\/p>\n<table>\n<thead>\n<tr>\n<th>層級<\/th>\n<th>一句話<\/th>\n<th>主要工作<\/th>\n<th>例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"93\" tabindex=\"0\" role=\"button\">感知層<\/span> Perception<\/td>\n<td>物理世界與數位世界的介面<\/td>\n<td>數據採集（類比→數位）、識別（<span class=\"gl\" data-g=\"124\" tabindex=\"0\" role=\"button\">RFID<\/span>、<span class=\"gl\" data-g=\"128\" tabindex=\"0\" role=\"button\">NFC<\/span>、QR Code）、簡單<span class=\"gl\" data-g=\"44\" tabindex=\"0\" role=\"button\">邊緣運算<\/span>（先濾雜訊）<\/td>\n<td>溫濕度、加速度、氣體<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>；<span class=\"gl\" data-g=\"125\" tabindex=\"0\" role=\"button\">RFID 標籤<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"94\" tabindex=\"0\" role=\"button\">網路層<\/span> Network<\/td>\n<td>把資料「無縫、透明」送到<span class=\"gl\" data-g=\"95\" tabindex=\"0\" role=\"button\">應用層<\/span><\/td>\n<td>存取網路（Access）＋核心網路（Core）；<strong><span class=\"gl\" data-g=\"97\" tabindex=\"0\" role=\"button\">異質網路融合<\/span><\/strong>（<span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span>把 <span class=\"gl\" data-g=\"146\" tabindex=\"0\" role=\"button\">Zigbee<\/span> 轉 <span class=\"gl\" data-g=\"99\" tabindex=\"0\" role=\"button\">TCP/IP<\/span>）<\/td>\n<td><span class=\"gl\" data-g=\"131\" tabindex=\"0\" role=\"button\">Wi-Fi<\/span>、Zigbee、<span class=\"gl\" data-g=\"157\" tabindex=\"0\" role=\"button\">LoRa<\/span>、<span class=\"gl\" data-g=\"161\" tabindex=\"0\" role=\"button\">4G<\/span>/<span class=\"gl\" data-g=\"162\" tabindex=\"0\" role=\"button\">5G<\/span>、閘道器<\/td>\n<\/tr>\n<tr>\n<td>應用層 Application<\/td>\n<td>把資料變成有價值的資訊或決策<\/td>\n<td><span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端運算<\/span>、大數據、<span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span>；設備管理、數據儲存、<span class=\"gl\" data-g=\"187\" tabindex=\"0\" role=\"button\">API<\/span><\/td>\n<td>智慧家庭、交通、城市、工廠、農業、醫療<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>IoT 的傳輸特性通常是 <strong>「小<span class=\"gl\" data-g=\"113\" tabindex=\"0\" role=\"button\">封包<\/span>、高<span class=\"gl\" data-g=\"366\" tabindex=\"0\" role=\"button\">頻率<\/span>」或「事件驅動（Event-driven）」<\/strong>，所以網路層要特別注意<strong>封包遺失率與<span class=\"gl\" data-g=\"47\" tabindex=\"0\" role=\"button\">延遲<\/span><\/strong>。<\/li>\n<li>感知層元件<strong>不是各自獨立運作<\/strong>：例如按門鈴後通知攝影機開始人臉辨識，元件之間要交換資料（指引 p.4-24 練習題解析）。<\/li>\n<\/ul>\n<h2>2. 感知層常見感測模組 <span class=\"ref\">考科一 2.1<\/span><span class=\"pg\">指引 p.4-2～4-8<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>模組<\/th>\n<th>量什麼<\/th>\n<th>原理（白話）<\/th>\n<th>輸出／介面<\/th>\n<th>典型應用與限制<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"335\" tabindex=\"0\" role=\"button\">HC-SR501<\/span><\/td>\n<td>人體移動<\/td>\n<td><strong>被動<\/strong>接收人體紅外線變化；菲涅爾透鏡切出多個感應區<\/td>\n<td><span class=\"gl\" data-g=\"397\" tabindex=\"0\" role=\"button\">GPIO<\/span> 高電位<\/td>\n<td>感應燈「人來燈亮」、保全；<strong>偵測不到靜止的人<\/strong>、無法辨識身分<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"336\" tabindex=\"0\" role=\"button\">DHT11<\/span><\/td>\n<td>溫度＋濕度<\/td>\n<td>電阻式濕度元件＋<strong><span class=\"gl\" data-g=\"342\" tabindex=\"0\" role=\"button\">NTC<\/span> <span class=\"gl\" data-g=\"341\" tabindex=\"0\" role=\"button\">熱敏電阻<\/span><\/strong>，內建 8 位元 <span class=\"gl\" data-g=\"57\" tabindex=\"0\" role=\"button\">MCU<\/span><\/td>\n<td><strong>單線（Single-wire）數位<\/strong><\/td>\n<td>濕度 20–90%RH、溫度 0–50°C；建議約 2 秒讀一次<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"337\" tabindex=\"0\" role=\"button\">HC-SR04<\/span><\/td>\n<td>距離<\/td>\n<td>發 40kHz 超音波、量回波時間：距離＝聲速（約 340m/s）×時間÷2<\/td>\n<td>Trig／Echo 腳位<\/td>\n<td>2–400cm；不受光線、顏色影響；避障、液位、停車格、垃圾桶滿載<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"338\" tabindex=\"0\" role=\"button\">ADXL345<\/span><\/td>\n<td>三軸加速度<\/td>\n<td><span class=\"gl\" data-g=\"331\" tabindex=\"0\" role=\"button\">MEMS<\/span> <span class=\"gl\" data-g=\"417\" tabindex=\"0\" role=\"button\">差動<\/span>電容<\/td>\n<td><strong><span class=\"gl\" data-g=\"385\" tabindex=\"0\" role=\"button\">I²C<\/span> 或 <span class=\"gl\" data-g=\"386\" tabindex=\"0\" role=\"button\">SPI<\/span><\/strong><\/td>\n<td>計步、傾斜、跌倒／自由落體偵測、喚醒裝置<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"339\" tabindex=\"0\" role=\"button\">MPU6050<\/span><\/td>\n<td>6 軸 <span class=\"gl\" data-g=\"332\" tabindex=\"0\" role=\"button\">IMU<\/span>（3 軸加速度＋3 軸<span class=\"gl\" data-g=\"333\" tabindex=\"0\" role=\"button\">陀螺儀<\/span>）<\/td>\n<td>陀螺儀依<strong>科里奧利力<\/strong>量角速度（dps）<\/td>\n<td>I²C<\/td>\n<td>無人機、平衡車；陀螺儀會「漂移」、<span class=\"gl\" data-g=\"334\" tabindex=\"0\" role=\"button\">加速度計<\/span>怕震動 → 用互補／<span class=\"gl\" data-g=\"364\" tabindex=\"0\" role=\"button\">卡爾曼濾波<\/span>算 roll、pitch、yaw<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"340\" tabindex=\"0\" role=\"button\">MQ-2<\/span><\/td>\n<td>可燃氣體、煙霧<\/td>\n<td>加熱的 <strong>SnO₂<\/strong> 半導體，遇氣體電阻<strong>下降<\/strong><\/td>\n<td>類比電壓（<span class=\"gl\" data-g=\"320\" tabindex=\"0\" role=\"button\">ADC<\/span>）或比較器<span class=\"gl\" data-g=\"399\" tabindex=\"0\" role=\"button\">數位輸出<\/span><\/td>\n<td>瓦斯外洩、煙霧警報；需預熱、選擇性差（酒精、油煙干擾）<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"360\" tabindex=\"0\" role=\"button\">光敏電阻<\/span> LDR<\/td>\n<td>亮度<\/td>\n<td>光電導效應（CdS），光越強電阻越小<\/td>\n<td>需串固定電阻做<strong><span class=\"gl\" data-g=\"363\" tabindex=\"0\" role=\"button\">分壓<\/span><\/strong>，再由 ADC 讀<\/td>\n<td>自動路燈、雷射絆線；反應比<span class=\"gl\" data-g=\"361\" tabindex=\"0\" role=\"button\">光二極體<\/span>慢（數十 ms）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：<strong>超音波感測器量「距離」，不是量噪音分貝<\/strong>；室內燈光控制用不到電子羅盤與加速度計（指引 p.4-23～4-24 練習題）。<\/p>\n<\/blockquote>\n<div class=\"cp\" id=\"cp_d2c1\" data-ans=\"1\"><div class=\"cph\">🧩 隨堂小測 1<span class=\"ref\">考科一 2.1<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">想用光敏電阻（LDR）讓 MCU 判斷環境亮度，下列哪一種接法最常見、也最正確？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 光敏電阻直接接到 I²C 的 SDA 腳<\/button><button class=\"opt cpo\" data-k=\"1\">B. 光敏電阻串接一個固定電阻形成分壓，再用 ADC 讀取中間點電壓<\/button><button class=\"opt cpo\" data-k=\"2\">C. 光敏電阻接 UART 的 TX 腳，以鮑率傳出亮度<\/button><button class=\"opt cpo\" data-k=\"3\">D. 光敏電阻自己會輸出數位 0/1，直接接任一 GPIO 即可得到亮度數值<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div><span class=\"gl\" data-g=\"360\" tabindex=\"0\" role=\"button\">光敏電阻<\/span>是「光越強電阻越小」的元件，本身不輸出數位資料，需串固定電阻做<span class=\"gl\" data-g=\"363\" tabindex=\"0\" role=\"button\">分壓<\/span>，把電阻變化轉成電壓，再由 <span class=\"gl\" data-g=\"320\" tabindex=\"0\" role=\"button\">ADC<\/span> 讀取。<span class=\"gl\" data-g=\"385\" tabindex=\"0\" role=\"button\">I²C<\/span>、<span class=\"gl\" data-g=\"384\" tabindex=\"0\" role=\"button\">UART<\/span> 是數位通訊介面，不適用。<\/div><\/div><\/div>\n<h2>3. OSI 七層與 TCP/IP 四層 <span class=\"ref\">考科一 2.1<\/span><span class=\"pg\">指引 p.4-9～4-12<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"98\" tabindex=\"0\" role=\"button\">OSI<\/span> 由 ISO 提出，分七層的目的是<strong>解決異構網路互連的相容性問題<\/strong>（明確區分 service、port、protocol）。<\/p>\n<table>\n<thead>\n<tr>\n<th>OSI 層<\/th>\n<th>做什麼<\/th>\n<th>代表<\/th>\n<th><span class=\"gl\" data-g=\"99\" tabindex=\"0\" role=\"button\">TCP/IP 四層<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>7 <span class=\"gl\" data-g=\"95\" tabindex=\"0\" role=\"button\">應用層<\/span><\/td>\n<td>讓應用程式使用網路<\/td>\n<td><span class=\"gl\" data-g=\"106\" tabindex=\"0\" role=\"button\">HTTP<\/span>、<span class=\"gl\" data-g=\"108\" tabindex=\"0\" role=\"button\">FTP<\/span>、<span class=\"gl\" data-g=\"109\" tabindex=\"0\" role=\"button\">SMTP<\/span><\/td>\n<td>應用層（FTP、SMTP、POP、<span class=\"gl\" data-g=\"110\" tabindex=\"0\" role=\"button\">DNS<\/span>、<span class=\"gl\" data-g=\"112\" tabindex=\"0\" role=\"button\">Telnet<\/span>、<span class=\"gl\" data-g=\"111\" tabindex=\"0\" role=\"button\">SNMP<\/span>、HTTP）<\/td>\n<\/tr>\n<tr>\n<td>6 表達層<\/td>\n<td><strong>格式轉換、壓縮/解壓縮、加密/解密<\/strong>（如 <span class=\"gl\" data-g=\"217\" tabindex=\"0\" role=\"button\">ASCII<\/span>↔EBCDIC）<\/td>\n<td>—<\/td>\n<td>〃<\/td>\n<\/tr>\n<tr>\n<td>5 會議層（會話層）<\/td>\n<td>建立、管理、終止會談<\/td>\n<td>—<\/td>\n<td>〃<\/td>\n<\/tr>\n<tr>\n<td>4 傳輸層<\/td>\n<td>端對端可靠傳輸、<span class=\"gl\" data-g=\"178\" tabindex=\"0\" role=\"button\">服務品質<\/span><\/td>\n<td><strong><span class=\"gl\" data-g=\"100\" tabindex=\"0\" role=\"button\">TCP<\/span>、<span class=\"gl\" data-g=\"101\" tabindex=\"0\" role=\"button\">UDP<\/span><\/strong><\/td>\n<td>傳輸層（主機對主機層）<\/td>\n<\/tr>\n<tr>\n<td>3 <span class=\"gl\" data-g=\"94\" tabindex=\"0\" role=\"button\">網路層<\/span><\/td>\n<td>定址與路由<\/td>\n<td><strong><span class=\"gl\" data-g=\"103\" tabindex=\"0\" role=\"button\">IP<\/span>、<span class=\"gl\" data-g=\"105\" tabindex=\"0\" role=\"button\">ICMP<\/span><\/strong><\/td>\n<td>網路層（網際網路層，以 datagram 為單位）<\/td>\n<\/tr>\n<tr>\n<td>2 資料鏈結層<\/td>\n<td>組成<span class=\"gl\" data-g=\"114\" tabindex=\"0\" role=\"button\">訊框<\/span>、錯誤偵測與控制<\/td>\n<td><span class=\"gl\" data-g=\"120\" tabindex=\"0\" role=\"button\">乙太網路<\/span><\/td>\n<td>鏈結層（網路介面層）<\/td>\n<\/tr>\n<tr>\n<td>1 實體層<\/td>\n<td>傳送位元（電、光、無線電脈衝）<\/td>\n<td>電纜、光纖<\/td>\n<td>〃<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 記法<\/strong>：由上到下「<strong>應表會傳網鏈實<\/strong>」。TCP/IP 不是砍掉 OSI 的層，而是<strong>把功能相近的層合併<\/strong>。指引 4.3 節另以「五層（含實體層）」說明，看到五層或四層都別慌（p.4-47）。<\/p>\n<\/blockquote>\n<div class=\"cp\" id=\"cp_d2c2\" data-ans=\"0\"><div class=\"cph\">🧩 隨堂小測 2<span class=\"ref\">考科一 2.1<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">關於 OSI 七層模型與 TCP/IP 四層模型的關係，下列敘述何者最正確？<\/div><button class=\"opt cpo\" data-k=\"0\">A. TCP/IP 把 OSI 中功能相近的層「合併」，例如 OSI 的應用、表達、會議層合併為 TCP/IP 的應用層<\/button><button class=\"opt cpo\" data-k=\"1\">B. TCP/IP 直接刪除了 OSI 的傳輸層，所以沒有 TCP 與 UDP<\/button><button class=\"opt cpo\" data-k=\"2\">C. OSI 的實體層對應到 TCP/IP 的應用層<\/button><button class=\"opt cpo\" data-k=\"3\">D. 兩者層數不同，因此完全無法對照<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div><span class=\"gl\" data-g=\"99\" tabindex=\"0\" role=\"button\">TCP/IP<\/span> 不是砍掉 <span class=\"gl\" data-g=\"98\" tabindex=\"0\" role=\"button\">OSI<\/span> 的層，而是把功能相近的層合併：應用＋表達＋會議→<span class=\"gl\" data-g=\"95\" tabindex=\"0\" role=\"button\">應用層<\/span>；資料鏈結＋實體→網路介面（鏈結）層。傳輸層仍在（<span class=\"gl\" data-g=\"100\" tabindex=\"0\" role=\"button\">TCP<\/span>/<span class=\"gl\" data-g=\"101\" tabindex=\"0\" role=\"button\">UDP<\/span>）；兩者可以逐層對照。<\/div><\/div><\/div>\n<h2>4. 應用層場域（指引 7 大場域速覽） <span class=\"ref\">考科一 2.1<\/span><span class=\"pg\">指引 p.4-13～4-21<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>場域<\/th>\n<th>關鍵字<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>智慧家庭<\/td>\n<td><span class=\"gl\" data-g=\"131\" tabindex=\"0\" role=\"button\">Wi-Fi<\/span>、<span class=\"gl\" data-g=\"146\" tabindex=\"0\" role=\"button\">Zigbee<\/span>、<span class=\"gl\" data-g=\"152\" tabindex=\"0\" role=\"button\">Thread<\/span> 連到中樞；「回家模式」場景化；語音助理；<span class=\"gl\" data-g=\"45\" tabindex=\"0\" role=\"button\">邊緣 AI<\/span> 攝影機辨識家人/寵物/陌生人<\/td>\n<\/tr>\n<tr>\n<td>智慧交通<\/td>\n<td><span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span> 影像＋<strong>地磁<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span><\/strong>算車流、動態調整號誌；<strong><span class=\"gl\" data-g=\"170\" tabindex=\"0\" role=\"button\">V2X<\/span> 車聯網<\/strong>＋<span class=\"gl\" data-g=\"162\" tabindex=\"0\" role=\"button\">5G<\/span> 低<span class=\"gl\" data-g=\"47\" tabindex=\"0\" role=\"button\">延遲<\/span>；智慧停車<\/td>\n<\/tr>\n<tr>\n<td>智慧城市<\/td>\n<td><span class=\"gl\" data-g=\"155\" tabindex=\"0\" role=\"button\">LPWAN<\/span> 或 5G 匯流到<span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>；智慧路燈變城市節點；智慧垃圾桶、智慧水務（水壓流量抓漏）<\/td>\n<\/tr>\n<tr>\n<td>科技執法<\/td>\n<td>邊緣 AI 主動偵測違規、車牌辨識；區間測速；聲音照相（陣列麥克風）<\/td>\n<\/tr>\n<tr>\n<td>智慧工廠<\/td>\n<td><strong><span class=\"gl\" data-g=\"89\" tabindex=\"0\" role=\"button\">OT 與 IT 融合<\/span><\/strong>、<span class=\"gl\" data-g=\"90\" tabindex=\"0\" role=\"button\">IIoT<\/span> <span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span>、5G 專網、<span class=\"gl\" data-g=\"91\" tabindex=\"0\" role=\"button\">Dashboard<\/span>；<strong><span class=\"gl\" data-g=\"74\" tabindex=\"0\" role=\"button\">預測性維護<\/span><\/strong>、<strong><span class=\"gl\" data-g=\"86\" tabindex=\"0\" role=\"button\">數位孿生<\/span>（Digital Twin）<\/strong>；大規模客製化<\/td>\n<\/tr>\n<tr>\n<td>智慧農業<\/td>\n<td>「看天吃飯」→精密農業；<strong><span class=\"gl\" data-g=\"157\" tabindex=\"0\" role=\"button\">LoRaWAN<\/span>、<span class=\"gl\" data-g=\"156\" tabindex=\"0\" role=\"button\">NB-IoT<\/span><\/strong> 回傳；自動滴灌、無人機多光譜<\/td>\n<\/tr>\n<tr>\n<td>智慧教育／醫療<\/td>\n<td>適性學習、<span class=\"gl\" data-g=\"124\" tabindex=\"0\" role=\"button\">RFID<\/span> 學生證；穿戴裝置、連續血糖監測、RFID/<span class=\"gl\" data-g=\"138\" tabindex=\"0\" role=\"button\">藍牙<\/span>資產追蹤、遠距照護<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：「自動駕駛汽車」不屬於智慧醫療的例子（指引 p.4-22 練習題）。數位孿生＝在虛擬世界建立與實體一樣的模型，<strong>先模擬驗證再套用到實體產線<\/strong>。<\/p>\n<\/blockquote>\n<h2>5. RFID：頻段表必背 <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-26～4-27<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"124\" tabindex=\"0\" role=\"button\">RFID<\/span>＝用無線電波做<strong>非接觸式雙向<\/strong>自動識別。三元件：<strong><span class=\"gl\" data-g=\"125\" tabindex=\"0\" role=\"button\">電子標籤<\/span>（Tag，天線＋晶片，存 UID）、讀寫器（Reader）、後端應用系統<\/strong>。\n依供電分：<strong>被動式（無電池，最常見，靠讀寫器電波感應供電，Backscatter 回傳）<\/strong>、半被動式、主動式。<\/p>\n<table>\n<thead>\n<tr>\n<th>頻段<\/th>\n<th><span class=\"gl\" data-g=\"366\" tabindex=\"0\" role=\"button\">頻率<\/span><\/th>\n<th>標準<\/th>\n<th>距離<\/th>\n<th>特性與應用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>低頻 <span class=\"gl\" data-g=\"126\" tabindex=\"0\" role=\"button\">LF<\/span><\/td>\n<td>125–134 kHz<\/td>\n<td>ISO 11784/85<\/td>\n<td>&lt; 10 cm<\/td>\n<td>穿透力強、受金屬與水干擾小；動物晶片、門禁卡<\/td>\n<\/tr>\n<tr>\n<td>高頻 HF<\/td>\n<td>13.56 MHz<\/td>\n<td>ISO 14443、ISO 15693<\/td>\n<td>&lt; 1 m<\/td>\n<td>速度較快；圖書館、電子護照、智慧卡<\/td>\n<\/tr>\n<tr>\n<td>超高頻 UHF<\/td>\n<td>860–960 MHz<\/td>\n<td>EPCglobal Gen2（ISO 18000-6C）<\/td>\n<td>3–10 m+<\/td>\n<td>距離遠、速度快、<strong>防碰撞可一次讀數百個<\/strong>；物流倉儲、<span class=\"gl\" data-g=\"127\" tabindex=\"0\" role=\"button\">ETC<\/span>、零售盤點<\/td>\n<\/tr>\n<tr>\n<td>微波<\/td>\n<td>2.45 / 5.8 GHz<\/td>\n<td>ISO 18000-4<\/td>\n<td>&gt; 10 m<\/td>\n<td>數據量大但指向性強、易受干擾；行李追蹤<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>6. NFC 與 RFID 比較 <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-28～4-29<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"128\" tabindex=\"0\" role=\"button\">NFC<\/span> 由 <span class=\"gl\" data-g=\"124\" tabindex=\"0\" role=\"button\">RFID<\/span> 的 <strong><span class=\"gl\" data-g=\"126\" tabindex=\"0\" role=\"button\">HF<\/span> 技術<\/strong>演變而來，<span class=\"gl\" data-g=\"366\" tabindex=\"0\" role=\"button\">頻率<\/span>固定 <strong>13.56 MHz<\/strong>；理論 20 cm，實務 <strong>4 cm 以內<\/strong>（距離短反而是安全優勢）；速率 106/212/424 kbit/s；標準 ISO/IEC 18092、14443，資料格式 <strong><span class=\"gl\" data-g=\"129\" tabindex=\"0\" role=\"button\">NDEF<\/span><\/strong>（NFC Forum 定義）。<\/p>\n<p>NFC 三種模式：\n1. <strong>卡片模擬（Card Emulation）<\/strong>：手機變成 IC 卡 → Apple Pay、手機悠遊卡、數位門禁；通常需<strong><span class=\"gl\" data-g=\"130\" tabindex=\"0\" role=\"button\">安全元件<\/span> SE<\/strong>。\n2. <strong>讀卡機（Reader/Writer）<\/strong>：手機讀寫外部標籤 → 智慧海報、防偽標籤。\n3. <strong>點對點（P2P）<\/strong>：兩裝置雙向交換 → <span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">物聯網<\/span>最關鍵應用是<strong>快速配對（Handover）<\/strong>：碰一下傳<span class=\"gl\" data-g=\"138\" tabindex=\"0\" role=\"button\">藍牙<\/span>/<span class=\"gl\" data-g=\"131\" tabindex=\"0\" role=\"button\">Wi-Fi<\/span> 連線資訊，再切到高<span class=\"gl\" data-g=\"48\" tabindex=\"0\" role=\"button\">頻寬<\/span>連線。<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>RFID（UHF）<\/th>\n<th>NFC<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>用途<\/td>\n<td>物品識別、追蹤、大量讀取<\/td>\n<td>通訊互動、支付、單一配對<\/td>\n<\/tr>\n<tr>\n<td>距離<\/td>\n<td>可達 10 m 以上<\/td>\n<td>&lt; 10 cm<\/td>\n<\/tr>\n<tr>\n<td>模式<\/td>\n<td>單向為主（讀寫器→標籤）<\/td>\n<td>雙向（支援 P2P）<\/td>\n<\/tr>\n<tr>\n<td>同時讀取<\/td>\n<td>強（數百個）<\/td>\n<td>弱（通常一對一）<\/td>\n<\/tr>\n<tr>\n<td>哲學<\/td>\n<td>讓「物」被系統看見<\/td>\n<td>讓「人」與「物」互動<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. Wi-Fi（IEEE 802.11） <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-29～4-31<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>世代<\/th>\n<th>標準<\/th>\n<th>頻段<\/th>\n<th>最高速率<\/th>\n<th><span class=\"gl\" data-g=\"1\" tabindex=\"0\" role=\"button\">AIoT<\/span> 定位<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"131\" tabindex=\"0\" role=\"button\">Wi-Fi<\/span> 4<\/td>\n<td>802.11n<\/td>\n<td>2.4/5 GHz<\/td>\n<td>600 <span class=\"gl\" data-g=\"376\" tabindex=\"0\" role=\"button\">Mbps<\/span><\/td>\n<td>目前最主流 <span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">IoT<\/span> 標準，<span class=\"gl\" data-g=\"61\" tabindex=\"0\" role=\"button\">ESP32<\/span>/ESP8266 多採用<\/td>\n<\/tr>\n<tr>\n<td>Wi-Fi 5<\/td>\n<td>802.11ac<\/td>\n<td>5 GHz<\/td>\n<td>6.9 Gbps<\/td>\n<td>高<span class=\"gl\" data-g=\"48\" tabindex=\"0\" role=\"button\">頻寬<\/span>、穿牆弱；<span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span> 攝影機、<span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span><\/td>\n<\/tr>\n<tr>\n<td>Wi-Fi 6/6E<\/td>\n<td>802.11ax<\/td>\n<td>2.4/5/6 GHz<\/td>\n<td>9.6 Gbps<\/td>\n<td><strong><span class=\"gl\" data-g=\"133\" tabindex=\"0\" role=\"button\">TWT<\/span>（目標喚醒時間）＋<span class=\"gl\" data-g=\"134\" tabindex=\"0\" role=\"button\">OFDMA<\/span><\/strong> → 省電、解多裝置擁塞<\/td>\n<\/tr>\n<tr>\n<td>Wi-Fi 7<\/td>\n<td>802.11be<\/td>\n<td>2.4/5/6 GHz<\/td>\n<td>46 Gbps<\/td>\n<td>極低<span class=\"gl\" data-g=\"47\" tabindex=\"0\" role=\"button\">延遲<\/span>、<strong><span class=\"gl\" data-g=\"135\" tabindex=\"0\" role=\"button\">MLO<\/span> 多重連結<\/strong>；工業自動化<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"132\" tabindex=\"0\" role=\"button\">Wi-Fi HaLow<\/span><\/td>\n<td>802.11ah<\/td>\n<td><span class=\"gl\" data-g=\"159\" tabindex=\"0\" role=\"button\">Sub-1 GHz<\/span>（約 900 MHz）<\/td>\n<td>150 Kbps–15 Mbps<\/td>\n<td>IoT 專用：穿透強、約 1 公里、極低功耗<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>優勢：<strong>原生 <span class=\"gl\" data-g=\"103\" tabindex=\"0\" role=\"button\">IP<\/span> 連線<\/strong>（不用閘道器轉換，可直接 <span class=\"gl\" data-g=\"106\" tabindex=\"0\" role=\"button\">HTTP<\/span>、<span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span>、<span class=\"gl\" data-g=\"184\" tabindex=\"0\" role=\"button\">WebSocket<\/span> 上雲）；能同時滿足即時性與大資料量（聲音、影像）。<\/li>\n<li>頻段：<strong>2.4 GHz<\/strong> 穿牆好但與<span class=\"gl\" data-g=\"138\" tabindex=\"0\" role=\"button\">藍牙<\/span>、微波爐共用、干擾大；<strong>5/6 GHz<\/strong> 快、干擾少但衰減快、穿牆差。<\/li>\n<li>限制：連線電流約 100–300 mA，不適合鈕扣電池跑數年；無螢幕裝置配網麻煩（AP 模式或藍牙輔助設定 <span class=\"gl\" data-g=\"136\" tabindex=\"0\" role=\"button\">SSID<\/span> 與密碼）。<strong>SSID＝基地台識別碼<\/strong>。<\/li>\n<\/ul>\n<h2>8. 藍牙：經典藍牙 vs. BLE <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-32～4-34<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><span class=\"gl\" data-g=\"138\" tabindex=\"0\" role=\"button\">經典藍牙<\/span> Classic<\/th>\n<th><span class=\"gl\" data-g=\"139\" tabindex=\"0\" role=\"button\">低功耗藍牙<\/span> BLE（藍牙 4.0 起）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>目的<\/td>\n<td>持續大量傳輸（音訊串流）<\/td>\n<td>間歇小量（感測數值）<\/td>\n<\/tr>\n<tr>\n<td>連線<\/td>\n<td>保持常時連線<\/td>\n<td>平常休眠，毫秒級喚醒傳送<\/td>\n<\/tr>\n<tr>\n<td>功耗<\/td>\n<td>&gt; 10 mA，需常充電<\/td>\n<td>峰值 &lt; 15 mA、睡眠 &lt; 10 µA，鈕扣電池可用數年<\/td>\n<\/tr>\n<tr>\n<td>應用<\/td>\n<td>耳機、車用免持、檔案傳輸<\/td>\n<td>手環、心率帶、門鎖、胎壓偵測<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong><span class=\"gl\" data-g=\"140\" tabindex=\"0\" role=\"button\">GAP<\/span><\/strong>：廣播與連線。周邊（Peripheral，如手環）廣播；中央（Central，如手機）掃描並發起連線。<\/li>\n<li><strong><span class=\"gl\" data-g=\"141\" tabindex=\"0\" role=\"button\">GATT<\/span><\/strong>：連線後的資料交換，階層為 <strong>服務（Service）→ 特徵（Characteristic）<\/strong>，例如「心率服務」裡的「心率數值」。<\/li>\n<li><strong>藍牙 5.0<\/strong>：2 <span class=\"gl\" data-g=\"376\" tabindex=\"0\" role=\"button\">Mbps<\/span> PHY（2 倍速）、**Long <span class=\"gl\" data-g=\"330\" tabindex=\"0\" role=\"button\">Range<\/span>（Coded PHY）**延伸距離；<strong>5.1<\/strong>：<strong><span class=\"gl\" data-g=\"144\" tabindex=\"0\" role=\"button\">AoA<\/span>/AoD<\/strong> 測角定位，室內定位從公尺級到公分級；<strong><span class=\"gl\" data-g=\"143\" tabindex=\"0\" role=\"button\">Bluetooth Mesh<\/span><\/strong>：多對多，燈泡接力。<\/li>\n<li>應用：穿戴醫療（CGM）、<strong><span class=\"gl\" data-g=\"142\" tabindex=\"0\" role=\"button\">Beacon<\/span><\/strong>（利用 GAP 廣播推播優惠券）、<strong>無鑰匙解鎖<\/strong>（用 <span class=\"gl\" data-g=\"137\" tabindex=\"0\" role=\"button\">RSSI<\/span> 判斷距離）。<\/li>\n<li>限制：<span class=\"gl\" data-g=\"48\" tabindex=\"0\" role=\"button\">頻寬<\/span>遠低於 <span class=\"gl\" data-g=\"131\" tabindex=\"0\" role=\"button\">Wi-Fi<\/span>；2.4 GHz 同頻干擾，靠 <strong><span class=\"gl\" data-g=\"145\" tabindex=\"0\" role=\"button\">FHSS<\/span> 跳頻<\/strong>。<\/li>\n<\/ul>\n<h2>9. Zigbee（IEEE 802.15.4） <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-34～4-36<\/span><\/h2>\n<p>設計初衷：<strong>低速率、低功耗、大規模節點組網<\/strong>（名字來自蜜蜂的 8 字舞）。<\/p>\n<table>\n<thead>\n<tr>\n<th>角色<\/th>\n<th>功能<\/th>\n<th>硬體<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"147\" tabindex=\"0\" role=\"button\">協調器<\/span> Coordinator<\/td>\n<td>網路創始者與管理者；選頻道、設 <strong><span class=\"gl\" data-g=\"148\" tabindex=\"0\" role=\"button\">PAN ID<\/span><\/strong>、分配位址、維護安全金鑰；<strong>每個網路只能有一個<\/strong><\/td>\n<td><span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">網關<\/span>／Hub，須長期供電<\/td>\n<\/tr>\n<tr>\n<td>路由器 Router<\/td>\n<td>轉發<span class=\"gl\" data-g=\"113\" tabindex=\"0\" role=\"button\">封包<\/span>、延伸覆蓋、允許其他裝置加入<\/td>\n<td>插電設備：智慧燈泡、插座<\/td>\n<\/tr>\n<tr>\n<td>終端裝置 End Device<\/td>\n<td>只收發自己的資料，<strong>不轉發<\/strong>；大多時間睡眠<\/td>\n<td>電池設備：門窗<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>、溫濕度計，電池 1～2 年<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong><span class=\"gl\" data-g=\"149\" tabindex=\"0\" role=\"button\">網狀<\/span>（Mesh）多跳<\/strong>：理論可容納約 65,000 個節點（可擴充性）；路由器壞了會自動找替代路徑（<strong><span class=\"gl\" data-g=\"150\" tabindex=\"0\" role=\"button\">自我修復<\/span> Self-Healing<\/strong>）。<\/li>\n<li><strong><span class=\"gl\" data-g=\"146\" tabindex=\"0\" role=\"button\">Zigbee<\/span> 3.0<\/strong> 統一<span class=\"gl\" data-g=\"95\" tabindex=\"0\" role=\"button\">應用層<\/span>、**<span class=\"gl\" data-g=\"151\" tabindex=\"0\" role=\"button\">ZCL<\/span>（Zigbee Cluster Library）**定義標準指令（如 On/Off Cluster），解決跨品牌互通。<\/li>\n<li>限制：最大 <strong>250 <span class=\"gl\" data-g=\"376\" tabindex=\"0\" role=\"button\">kbps<\/span><\/strong>，不適合音訊影像；2.4 GHz 易受 <span class=\"gl\" data-g=\"131\" tabindex=\"0\" role=\"button\">Wi-Fi<\/span> 干擾；手機沒有 Zigbee 晶片，<strong>必須透過網關<\/strong>。<\/li>\n<li>Zigbee 聯盟已更名 <strong><span class=\"gl\" data-g=\"154\" tabindex=\"0\" role=\"button\">CSA<\/span>（連接標準聯盟）<\/strong>，是推動 <strong><span class=\"gl\" data-g=\"153\" tabindex=\"0\" role=\"button\">Matter<\/span><\/strong> 的核心；Matter 支援 <span class=\"gl\" data-g=\"120\" tabindex=\"0\" role=\"button\">Ethernet<\/span>、Wi-Fi、<span class=\"gl\" data-g=\"152\" tabindex=\"0\" role=\"button\">Thread<\/span>（並用 <span class=\"gl\" data-g=\"139\" tabindex=\"0\" role=\"button\">BLE<\/span>），<strong>不支援 <span class=\"gl\" data-g=\"157\" tabindex=\"0\" role=\"button\">LoRa<\/span><\/strong>（p.4-45）。<\/li>\n<\/ul>\n<div class=\"cp\" id=\"cp_d2c3\" data-ans=\"1\"><div class=\"cph\">🧩 隨堂小測 3<span class=\"ref\">考科一 2.2<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">小明家的 Zigbee 智慧家庭有：一台 Hub、三個插電的智慧插座、五個電池供電的門窗感測器。若想延伸 Zigbee 網路的覆蓋範圍，最適合擔任「路由器（Router）」角色的是？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 電池供電的門窗感測器<\/button><button class=\"opt cpo\" data-k=\"1\">B. 插電的智慧插座<\/button><button class=\"opt cpo\" data-k=\"2\">C. 再加一台協調器，讓兩台協調器一起管理<\/button><button class=\"opt cpo\" data-k=\"3\">D. 用手機直接當路由器<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div>路由器要負責轉發<span class=\"gl\" data-g=\"113\" tabindex=\"0\" role=\"button\">封包<\/span>，需長期供電，典型是插電設備（燈泡、插座）。電池設備適合當不轉發、多半睡眠的終端裝置；每個 <span class=\"gl\" data-g=\"146\" tabindex=\"0\" role=\"button\">Zigbee<\/span> 網路只能有一個<span class=\"gl\" data-g=\"147\" tabindex=\"0\" role=\"button\">協調器<\/span>；手機沒有 Zigbee 晶片。<\/div><\/div><\/div>\n<h2>10. LPWAN：NB-IoT vs. LoRaWAN <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-37～4-38<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><span class=\"gl\" data-g=\"156\" tabindex=\"0\" role=\"button\">NB-IoT<\/span><\/th>\n<th><span class=\"gl\" data-g=\"157\" tabindex=\"0\" role=\"button\">LoRaWAN<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"380\" tabindex=\"0\" role=\"button\">頻譜<\/span><\/td>\n<td><strong><span class=\"gl\" data-g=\"158\" tabindex=\"0\" role=\"button\">授權頻譜<\/span><\/strong>，架在現有 <span class=\"gl\" data-g=\"161\" tabindex=\"0\" role=\"button\">LTE<\/span> 基地台，由電信商提供<\/td>\n<td><strong>非授權頻譜<\/strong>（<span class=\"gl\" data-g=\"159\" tabindex=\"0\" role=\"button\">Sub-GHz<\/span>，台灣 920–925 MHz），可<strong>自建基地台<\/strong>、不用月租<\/td>\n<\/tr>\n<tr>\n<td>優勢<\/td>\n<td>覆蓋極佳（比 GSM 強 20 dB，地下室、下水道）；海量連結；<span class=\"gl\" data-g=\"166\" tabindex=\"0\" role=\"button\">SIM 卡<\/span>電信級安全<\/td>\n<td>建置彈性高（大農場、石化廠）；空曠地可達 10 km 以上<\/td>\n<\/tr>\n<tr>\n<td>限制<\/td>\n<td>指引寫：<strong>不支援移動性<\/strong>，適合固定裝置<\/td>\n<td><span class=\"gl\" data-g=\"48\" tabindex=\"0\" role=\"button\">頻寬<\/span>極低；公共頻段易受干擾<\/td>\n<\/tr>\n<tr>\n<td>應用<\/td>\n<td>智慧水電表、路燈、人孔蓋<\/td>\n<td>土壤監測、大型廠區資產追蹤、土石流預警<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 標註<\/strong>：指引 p.4-37 寫 NB-IoT「不支援移動性（換基地台會斷線）」，這是早期版本（<span class=\"gl\" data-g=\"160\" tabindex=\"0\" role=\"button\">3GPP<\/span> Release 13）的特性，後續版本已逐步改善。<strong>考試以指引說法作答<\/strong>。<\/p>\n<\/blockquote>\n<h2>11. 4G／5G 與 SIM 型態 <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-38～4-40<\/span><\/h2>\n<ul>\n<li><span class=\"gl\" data-g=\"161\" tabindex=\"0\" role=\"button\">LTE<\/span> <strong>Cat.4/Cat.6<\/strong>：下行 150 <span class=\"gl\" data-g=\"376\" tabindex=\"0\" role=\"button\">Mbps<\/span> 以上 → 行動監控攝影機、數位<span class=\"gl\" data-g=\"458\" tabindex=\"0\" role=\"button\">看板<\/span>。<strong>Cat.1<\/strong>：約 10 Mbps、成本功耗低 → 公車動態、共享單車、POS、電梯聯網（目前 <span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">IoT<\/span> 最熱門）。<\/li>\n<li><strong><span class=\"gl\" data-g=\"162\" tabindex=\"0\" role=\"button\">5G<\/span> 三大場景（ITU 5G Triangle）<\/strong>：<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>場景<\/th>\n<th>特徵<\/th>\n<th>應用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"163\" tabindex=\"0\" role=\"button\">eMBB<\/span> 增強型行動寬頻<\/td>\n<td>極致網速，可達 10 Gbps<\/td>\n<td>4K/8K 串流、AR/VR 遠端協作<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"164\" tabindex=\"0\" role=\"button\">mMTC<\/span> 大規模機器通訊<\/td>\n<td>每平方公里 100 萬個裝置<\/td>\n<td>智慧城市全域感知（「<span class=\"gl\" data-g=\"156\" tabindex=\"0\" role=\"button\">NB-IoT<\/span> 的 5G 升級版」）<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"165\" tabindex=\"0\" role=\"button\">URLLC<\/span> 超可靠低<span class=\"gl\" data-g=\"47\" tabindex=\"0\" role=\"button\">延遲<\/span><\/td>\n<td>延遲 &lt; 1 ms、可靠度 99.999%<\/td>\n<td><span class=\"gl\" data-g=\"170\" tabindex=\"0\" role=\"button\">車聯網<\/span>、工業機器手臂、遠端手術<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><span class=\"gl\" data-g=\"166\" tabindex=\"0\" role=\"button\">SIM<\/span>：<strong>工業級 SIM<\/strong>（耐高溫抗腐蝕）、<strong><span class=\"gl\" data-g=\"167\" tabindex=\"0\" role=\"button\">eSIM<\/span><\/strong>（焊在板上防震，可 <strong><span class=\"gl\" data-g=\"168\" tabindex=\"0\" role=\"button\">OTA<\/span><\/strong> 遠端換電信商）、<strong>iSIM<\/strong>（整合進 <span class=\"gl\" data-g=\"169\" tabindex=\"0\" role=\"button\">SoC<\/span>，更小更便宜）。<\/li>\n<li>5G 並不是「低功耗長距離」技術（那是 <span class=\"gl\" data-g=\"155\" tabindex=\"0\" role=\"button\">LPWAN<\/span>）。<\/li>\n<\/ul>\n<h2>12. 選型總表（考前必看） <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-40<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>需求<\/th>\n<th>首選<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>極低資料量＋電池供電<\/td>\n<td><span class=\"gl\" data-g=\"156\" tabindex=\"0\" role=\"button\">NB-IoT<\/span>／<span class=\"gl\" data-g=\"157\" tabindex=\"0\" role=\"button\">LoRaWAN<\/span>（水表、路邊停車感測）<\/td>\n<\/tr>\n<tr>\n<td>中等資料量＋移動<\/td>\n<td><span class=\"gl\" data-g=\"161\" tabindex=\"0\" role=\"button\">LTE Cat.1<\/span>（共享機車定位、電梯監控）<\/td>\n<\/tr>\n<tr>\n<td>大資料量（影像）＋即時<\/td>\n<td>4G LTE Cat.4／<span class=\"gl\" data-g=\"162\" tabindex=\"0\" role=\"button\">5G<\/span> <span class=\"gl\" data-g=\"163\" tabindex=\"0\" role=\"button\">eMBB<\/span>（路口監視器、無人機巡檢）<\/td>\n<\/tr>\n<tr>\n<td>不容許<span class=\"gl\" data-g=\"47\" tabindex=\"0\" role=\"button\">延遲<\/span>＋生命安全<\/td>\n<td>5G <span class=\"gl\" data-g=\"165\" tabindex=\"0\" role=\"button\">URLLC<\/span>（自駕車、遠端醫療）<\/td>\n<\/tr>\n<tr>\n<td>室內影音、AR/VR<\/td>\n<td><span class=\"gl\" data-g=\"131\" tabindex=\"0\" role=\"button\">Wi-Fi<\/span><\/td>\n<\/tr>\n<tr>\n<td>穿戴、手機配件<\/td>\n<td><span class=\"gl\" data-g=\"139\" tabindex=\"0\" role=\"button\">BLE<\/span><\/td>\n<\/tr>\n<tr>\n<td>居家／樓宇大量低速節點<\/td>\n<td><span class=\"gl\" data-g=\"146\" tabindex=\"0\" role=\"button\">Zigbee<\/span>（<span class=\"gl\" data-g=\"149\" tabindex=\"0\" role=\"button\">Mesh<\/span>）<\/td>\n<\/tr>\n<tr>\n<td>碰一下支付／配對<\/td>\n<td><span class=\"gl\" data-g=\"128\" tabindex=\"0\" role=\"button\">NFC<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>今日 30 秒回顧<\/h3>\n<p>感知→網路→應用｜應表會傳網鏈實；表達層管加密壓縮｜<span class=\"gl\" data-g=\"126\" tabindex=\"0\" role=\"button\">UHF<\/span> 一次讀數百、NFC 13.56MHz 4cm｜Wi-Fi 6＝<span class=\"gl\" data-g=\"133\" tabindex=\"0\" role=\"button\">TWT<\/span>＋<span class=\"gl\" data-g=\"134\" tabindex=\"0\" role=\"button\">OFDMA<\/span>、HaLow＝Sub-1GHz｜BLE：<span class=\"gl\" data-g=\"140\" tabindex=\"0\" role=\"button\">GAP<\/span> 廣播連線、<span class=\"gl\" data-g=\"141\" tabindex=\"0\" role=\"button\">GATT<\/span> 服務特徵｜Zigbee：<span class=\"gl\" data-g=\"147\" tabindex=\"0\" role=\"button\">協調器<\/span>只有一個、終端不轉發、250kbps｜NB-IoT <span class=\"gl\" data-g=\"158\" tabindex=\"0\" role=\"button\">授權頻譜<\/span>、LoRa 非授權可自建｜5G：eMBB 快、<span class=\"gl\" data-g=\"164\" tabindex=\"0\" role=\"button\">mMTC<\/span> 多、URLLC 準。<\/p>", "audio": {"src": "audio/d02.mp3?v=2", "dur": 807}, "questions": [{"id": "d2q1", "n": 1, "opts": ["感知層", "網路層", "應用層", "實體層（OSI 第 1 層）"], "exp": "指引 p.4-9：網路層必須處理多種通訊協定的轉換（異質網路融合），例如工廠內 Zigbee 感測器資料需經閘道器轉成 TCP/IP 封包。D 是 OSI 的分層，不是物聯網三層架構的名稱。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "在物聯網三層架構中，「閘道器把 Zigbee 封包轉換成 TCP/IP 封包送上網際網路」主要屬於哪一層的工作？", "ref": "考科一 2.1", "src": "指引 p.4-1", "ans": 1, "stemH": "在物聯網三層架構中，「閘道器把 Zigbee 封包轉換成 TCP/IP 封包送上網際網路」主要屬於哪一層的工作？", "optsH": ["感知層", "網路層", "應用層", "實體層（OSI 第 1 層）"], "expH": "指引 p.4-9：<span class=\"gl\" data-g=\"94\" tabindex=\"0\" role=\"button\">網路層<\/span>必須處理多種<span class=\"gl\" data-g=\"383\" tabindex=\"0\" role=\"button\">通訊協定<\/span>的轉換（<span class=\"gl\" data-g=\"97\" tabindex=\"0\" role=\"button\">異質網路融合<\/span>），例如工廠內 <span class=\"gl\" data-g=\"146\" tabindex=\"0\" role=\"button\">Zigbee<\/span> <span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>資料需經<span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span>轉成 <span class=\"gl\" data-g=\"99\" tabindex=\"0\" role=\"button\">TCP/IP<\/span> <span class=\"gl\" data-g=\"113\" tabindex=\"0\" role=\"button\">封包<\/span>。D 是 <span class=\"gl\" data-g=\"98\" tabindex=\"0\" role=\"button\">OSI<\/span> 的分層，不是<span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">物聯網<\/span>三層架構的名稱。"}, {"id": "d2q2", "n": 2, "opts": ["主動發射紅外線並量測反射時間來計算距離", "以 I²C 介面輸出溫度數值", "能辨識進入者的身分", "被動接收人體紅外線輻射量的變化，可偵測移動但無法偵測靜止不動的人"], "exp": "HC-SR501 是被
