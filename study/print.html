span class=\"gl\" data-g=\"387\" tabindex=\"0\" role=\"button\">CS<\/span><\/td>\n<td>同步<\/td>\n<td>全雙工<\/td>\n<td>片選 CS<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>sin 與 cos 差 90°｜並列快但貴、易干擾｜對講機半雙工、電話全雙工<\/p>\n<h2>系統元件與架構 <span class=\"ref\">考科二 1-1<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>輸入、<span class=\"gl\" data-g=\"69\" tabindex=\"0\" role=\"button\">致動器<\/span>輸出｜<span class=\"gl\" data-g=\"57\" tabindex=\"0\" role=\"button\">MCU<\/span> 省電無 <span class=\"gl\" data-g=\"436\" tabindex=\"0\" role=\"button\">OS<\/span>、<span class=\"gl\" data-g=\"59\" tabindex=\"0\" role=\"button\">SBC<\/span> 跑 Linux、<span class=\"gl\" data-g=\"68\" tabindex=\"0\" role=\"button\">PLC<\/span> 工業可靠｜<span class=\"gl\" data-g=\"60\" tabindex=\"0\" role=\"button\">Arduino<\/span> 5 V、<span class=\"gl\" data-g=\"61\" tabindex=\"0\" role=\"button\">ESP32<\/span>／Pi 3.3 V、Pi 無 <span class=\"gl\" data-g=\"320\" tabindex=\"0\" role=\"button\">ADC<\/span>｜<span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span>：協定轉換、前處理、斷線暫存｜<span class=\"gl\" data-g=\"64\" tabindex=\"0\" role=\"button\">HMI<\/span>／<span class=\"gl\" data-g=\"65\" tabindex=\"0\" role=\"button\">SCADA<\/span> 監控、<span class=\"gl\" data-g=\"66\" tabindex=\"0\" role=\"button\">MES<\/span> 製造、<span class=\"gl\" data-g=\"67\" tabindex=\"0\" role=\"button\">ERP<\/span> 企業<\/p>\n<h2>故障判斷與排除 <span class=\"ref\">考科二 1-2<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>症狀<\/th>\n<th>先查<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>亂碼<\/td>\n<td><span class=\"gl\" data-g=\"375\" tabindex=\"0\" role=\"button\">鮑率<\/span>、<span class=\"gl\" data-g=\"396\" tabindex=\"0\" role=\"button\">8N1<\/span>、TX↔RX、準位<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"385\" tabindex=\"0\" role=\"button\">I²C<\/span> 掃不到<\/td>\n<td>位址衝突、<span class=\"gl\" data-g=\"389\" tabindex=\"0\" role=\"button\">上拉電阻<\/span>、線長<\/td>\n<\/tr>\n<tr>\n<td>負載啟動就重開機<\/td>\n<td><span class=\"gl\" data-g=\"420\" tabindex=\"0\" role=\"button\">電壓下陷<\/span> → 分開供電、<span class=\"gl\" data-g=\"419\" tabindex=\"0\" role=\"button\">共地<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"131\" tabindex=\"0\" role=\"button\">Wi-Fi<\/span> 連不上<\/td>\n<td>2.4 GHz、<span class=\"gl\" data-g=\"137\" tabindex=\"0\" role=\"button\">RSSI<\/span>、<span class=\"gl\" data-g=\"431\" tabindex=\"0\" role=\"button\">DHCP<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span> 收不到<\/td>\n<td><span class=\"gl\" data-g=\"177\" tabindex=\"0\" role=\"button\">Topic<\/span> 大小寫、1883／8883、Client ID<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"193\" tabindex=\"0\" role=\"button\">Modbus<\/span> 無回應<\/td>\n<td><span class=\"gl\" data-g=\"208\" tabindex=\"0\" role=\"button\">Slave ID<\/span>、A/B、鮑率、120 Ω<\/td>\n<\/tr>\n<tr>\n<td>時間錯亂<\/td>\n<td><span class=\"gl\" data-g=\"430\" tabindex=\"0\" role=\"button\">NTP<\/span><\/td>\n<\/tr>\n<tr>\n<td>當機<\/td>\n<td><span class=\"gl\" data-g=\"413\" tabindex=\"0\" role=\"button\">看門狗<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>電表：電流串聯、電壓並聯、電阻斷電｜<span class=\"gl\" data-g=\"426\" tabindex=\"0\" role=\"button\">邏輯分析儀<\/span>解碼 <span class=\"gl\" data-g=\"384\" tabindex=\"0\" role=\"button\">UART<\/span>／I²C／<span class=\"gl\" data-g=\"386\" tabindex=\"0\" role=\"button\">SPI<\/span>｜<span class=\"gl\" data-g=\"428\" tabindex=\"0\" role=\"button\">ping<\/span>、traceroute、nslookup<\/p>\n<h2>物聯網資訊安全 <span class=\"ref\">考科二 1-3<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<p>每台唯一密碼｜<span class=\"gl\" data-g=\"182\" tabindex=\"0\" role=\"button\">TLS<\/span>（<span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span> 8883）、<span class=\"gl\" data-g=\"183\" tabindex=\"0\" role=\"button\">DTLS<\/span>（<span class=\"gl\" data-g=\"173\" tabindex=\"0\" role=\"button\">CoAP<\/span>）｜<span class=\"gl\" data-g=\"298\" tabindex=\"0\" role=\"button\">Secure Boot<\/span>＋<span class=\"gl\" data-g=\"277\" tabindex=\"0\" role=\"button\">簽章<\/span> <span class=\"gl\" data-g=\"168\" tabindex=\"0\" role=\"button\">OTA<\/span>｜<span class=\"gl\" data-g=\"282\" tabindex=\"0\" role=\"button\">mTLS<\/span>＋<span class=\"gl\" data-g=\"279\" tabindex=\"0\" role=\"button\">X.509<\/span>｜<span class=\"gl\" data-g=\"314\" tabindex=\"0\" role=\"button\">最小權限<\/span> <span class=\"gl\" data-g=\"313\" tabindex=\"0\" role=\"button\">ACL<\/span>、<span class=\"gl\" data-g=\"293\" tabindex=\"0\" role=\"button\">網路分段<\/span>｜<span class=\"gl\" data-g=\"310\" tabindex=\"0\" role=\"button\">重放攻擊<\/span> → <span class=\"gl\" data-g=\"311\" tabindex=\"0\" role=\"button\">nonce<\/span>、<span class=\"gl\" data-g=\"266\" tabindex=\"0\" role=\"button\">時間戳<\/span>｜個資：最小化、<span class=\"gl\" data-g=\"307\" tabindex=\"0\" role=\"button\">告知同意<\/span>、去識別、限期刪除、<span class=\"gl\" data-g=\"82\" tabindex=\"0\" role=\"button\">PbD<\/span><\/p>\n<h2>硬體設計基礎 <span class=\"ref\">考科二 2-1<\/span><span class=\"supp\">補充（能力指標 2）<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"390\" tabindex=\"0\" role=\"button\">浮接<\/span> → 上拉／下拉｜<span class=\"gl\" data-g=\"391\" tabindex=\"0\" role=\"button\">去彈跳<\/span>｜<span class=\"gl\" data-g=\"400\" tabindex=\"0\" role=\"button\">PWM<\/span> 平均電壓＝V×<span class=\"gl\" data-g=\"401\" tabindex=\"0\" role=\"button\">占空比<\/span>｜LED 限流 R＝(V−Vf)÷I｜<span class=\"gl\" data-g=\"408\" tabindex=\"0\" role=\"button\">感性負載<\/span>加<span class=\"gl\" data-g=\"407\" tabindex=\"0\" role=\"button\">飛輪二極體<\/span>｜<span class=\"gl\" data-g=\"410\" tabindex=\"0\" role=\"button\">光耦合器<\/span>隔離｜<span class=\"gl\" data-g=\"411\" tabindex=\"0\" role=\"button\">中斷<\/span>省電反應快｜<span class=\"gl\" data-g=\"202\" tabindex=\"0\" role=\"button\">RS-485<\/span> <span class=\"gl\" data-g=\"417\" tabindex=\"0\" role=\"button\">差動<\/span>多點約 1200 m｜<span class=\"gl\" data-g=\"416\" tabindex=\"0\" role=\"button\">4–20 mA<\/span>：0 mA＝斷線｜<span class=\"gl\" data-g=\"440\" tabindex=\"0\" role=\"button\">開源硬體<\/span>：<span class=\"gl\" data-g=\"441\" tabindex=\"0\" role=\"button\">CERN OHL<\/span>（P／W／S）、TAPR、<span class=\"gl\" data-g=\"442\" tabindex=\"0\" role=\"button\">CC BY-SA<\/span>，商標除外<\/p>\n<h2>雲端數據收集與平台設計 <span class=\"ref\">考科二 2-2<\/span><span class=\"supp\">補充（能力指標 1）<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"251\" tabindex=\"0\" role=\"button\">JSON<\/span> 雙引號、無尾逗號、無註解｜<span class=\"gl\" data-g=\"213\" tabindex=\"0\" role=\"button\">XML<\/span> 單一根、大小寫｜GET 讀、POST 新增（201）、401 未認證、403 無權限、404 找不到｜<span class=\"gl\" data-g=\"177\" tabindex=\"0\" role=\"button\">Topic<\/span>：+ 單層、# 多層（放最後）｜<span class=\"gl\" data-g=\"242\" tabindex=\"0\" role=\"button\">PK<\/span> 唯一非空、<span class=\"gl\" data-g=\"243\" tabindex=\"0\" role=\"button\">FK<\/span> 參照｜<span class=\"gl\" data-g=\"244\" tabindex=\"0\" role=\"button\">1NF<\/span> 單一值、2NF 完全相依、3NF 無遞移｜<span class=\"gl\" data-g=\"241\" tabindex=\"0\" role=\"button\">DDL<\/span> 定義、DML 操作、DCL 權限｜時序 DB 存讀值｜<span class=\"gl\" data-g=\"444\" tabindex=\"0\" role=\"button\">GPL<\/span> 傳染、<span class=\"gl\" data-g=\"445\" tabindex=\"0\" role=\"button\">LGPL<\/span> 連結可閉源、<span class=\"gl\" data-g=\"447\" tabindex=\"0\" role=\"button\">MIT<\/span>／<span class=\"gl\" data-g=\"448\" tabindex=\"0\" role=\"button\">BSD<\/span>／Apache（專利授權）寬鬆、<span class=\"gl\" data-g=\"450\" tabindex=\"0\" role=\"button\">AGPL<\/span> 網路服務也算<\/p>\n<h2>智慧製造流程優化與成本控制 <span class=\"ref\">考科二 2-3<\/span><span class=\"supp\">補充（依簡章評鑑內容 2-3）<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"451\" tabindex=\"0\" role=\"button\">OEE<\/span>＝<span class=\"gl\" data-g=\"452\" tabindex=\"0\" role=\"button\">可用率<\/span>×效能×品質（停機換模／變慢小停／不良啟動）｜<span class=\"gl\" data-g=\"455\" tabindex=\"0\" role=\"button\">七大浪費<\/span>：過量、庫存、搬運、等待、動作、過度加工、不良｜<span class=\"gl\" data-g=\"457\" tabindex=\"0\" role=\"button\">JIT<\/span>、<span class=\"gl\" data-g=\"458\" tabindex=\"0\" role=\"button\">看板<\/span>拉式、<span class=\"gl\" data-g=\"459\" tabindex=\"0\" role=\"button\">Jidoka<\/span>＋安燈、<span class=\"gl\" data-g=\"460\" tabindex=\"0\" role=\"button\">防呆<\/span>、<span class=\"gl\" data-g=\"461\" tabindex=\"0\" role=\"button\">5S<\/span>（整理整頓清掃清潔素養）、<span class=\"gl\" data-g=\"462\" tabindex=\"0\" role=\"button\">SMED<\/span>、<span class=\"gl\" data-g=\"463\" tabindex=\"0\" role=\"button\">TPM<\/span>｜<span class=\"gl\" data-g=\"466\" tabindex=\"0\" role=\"button\">ISA-95<\/span>：<span class=\"gl\" data-g=\"67\" tabindex=\"0\" role=\"button\">ERP<\/span> L4、<span class=\"gl\" data-g=\"66\" tabindex=\"0\" role=\"button\">MES<\/span> L3、<span class=\"gl\" data-g=\"65\" tabindex=\"0\" role=\"button\">SCADA<\/span> L2、<span class=\"gl\" data-g=\"68\" tabindex=\"0\" role=\"button\">PLC<\/span> L1｜<span class=\"gl\" data-g=\"467\" tabindex=\"0\" role=\"button\">PDCA<\/span>、<span class=\"gl\" data-g=\"468\" tabindex=\"0\" role=\"button\">DMAIC<\/span>、<span class=\"gl\" data-g=\"470\" tabindex=\"0\" role=\"button\">管制圖<\/span> ±3σ、魚骨 <span class=\"gl\" data-g=\"471\" tabindex=\"0\" role=\"button\">4M1E<\/span>、<span class=\"gl\" data-g=\"472\" tabindex=\"0\" role=\"button\">柏拉圖<\/span> 80/20｜節拍＝可用時間÷需求｜<span class=\"gl\" data-g=\"473\" tabindex=\"0\" role=\"button\">瓶頸<\/span>決定產出｜<span class=\"gl\" data-g=\"478\" tabindex=\"0\" role=\"button\">CAPEX<\/span>／<span class=\"gl\" data-g=\"479\" tabindex=\"0\" role=\"button\">OPEX<\/span>／<span class=\"gl\" data-g=\"480\" tabindex=\"0\" role=\"button\">TCO<\/span>｜<span class=\"gl\" data-g=\"481\" tabindex=\"0\" role=\"button\">ROI<\/span>＝(效益−成本)÷成本｜<span class=\"gl\" data-g=\"482\" tabindex=\"0\" role=\"button\">回收期<\/span>＝投資÷年效益<\/p>", "intro": "<h3>這份讀書包怎麼用<\/h3>\n<ul>\n<li><strong>13 天 × 每天 30 分鐘<\/strong>：每天先「今日學習」（約 15～20 分鐘），再做「今日驗證」（10～12 題，作答立刻顯示對錯與解析），最後勾選「今天完成」。<\/li>\n<li>D6、D7（考科一）與 D12（考科二）是<strong>計時模擬考<\/strong>，交卷後才顯示成績與解析；預設 30 分鐘，可切換成正式的 75 分鐘。<\/li>\n<li>答錯的題目自動收進「錯題本」，重做答對就移出；作答紀錄存在這台裝置的瀏覽器（localStorage），可在「設定」匯出／匯入進度。<\/li>\n<\/ul>\n<h3>內容依據與標示規則<\/h3>\n<ul>\n<li>每一段講義與每一題都標註<strong>官方評鑑內容編號<\/strong>（例如「考科一 2.2」「考科二 2-1」），範圍完全依照 115 年簡章公告的評鑑主題與評鑑內容。<\/li>\n<li><strong>考科一<\/strong>以官方《AIoT 應用工程師（初級）學習指引—考科一 AIoT 基礎概論》為主要依據，盡量標出指引頁碼（例如「指引 p.4-62」）；指引沒涵蓋、以一般技術知識補充的部分標示「<strong>補充<\/strong>」。<\/li>\n<li><strong>考科二目前沒有官方學習指引<\/strong>，講義與題目是依簡章的 6 項評鑑內容（1-1～2-3）與 3 項能力指標逐條撰寫，全部屬於一般技術知識（標「補充」）。<\/li>\n<li><strong>所有題目都不是考古題或官方題目。<\/strong> 每日驗證與 D12、D13 題目為原創練習題；D6、D7 模擬考題目<strong>改編自官方學習指引<\/strong>各節練習評量，並標出原題頁碼。指引原題若有答案與解析不一致等問題，已依技術常識修正並以 ⚠️ 標註。<\/li>\n<li>115 年簡章未載明題數（舊制每科 50 題），每科 75 分鐘、70 分及格。<\/li>\n<\/ul>"};const L='ABCD';
const GL=DATA.glossary;const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function gi(i,days){const g=GL[i];return `<div class="gi"><b>${esc(g.term)}</b>${g.aliases.length?` <span class="ga">（${esc(g.aliases.join('、'))}）</span>`:''}：${esc(g.exp)}${g.vs?` <span class="gv">【易混淆】${esc(g.vs)}</span>`:''}${days&&g.days.length?` <span class="ga">〔${g.days.map(x=>'D'+x).join('、')}〕</span>`:''}</div>`}
const WK='日一二三四五六';function wk(s){const [y,m,d]=s.split('-').map(Number);return WK[new Date(y,m-1,d).getDay()]}
let h=`<div class="cover"><h1>iPAS AIoT 應用工程師（初級）<br>13 天考前講義</h1><p class="muted">考試日期：2026/10/31（六）｜考科一 AIoT基礎概論、考科二 物聯網系統與應用｜各 75 分鐘、70 分及格<br>讀書期間：2026/10/18～10/30，每天 30 分鐘（學習＋驗證）</p>
<p>共 ${DATA.days.reduce((a,d)=>a+d.questions.length,0)} 題練習題。每天的題目後面附「答案與解析」。</p>${DATA.intro}
<h2 style="border:none;padding:0">13 天課表</h2><table><tr><th>天</th><th>日期</th><th>科目</th><th>主題</th><th>題數</th></tr>${DATA.days.map(d=>`<tr><td>D${d.id}</td><td>${d.date.slice(5).replace('-','/')}（${wk(d.date)}）</td><td>${d.subject}</td><td>${d.title}${d.type==='mock'?'（計時模擬考）':''}</td><td>${d.questions.length}</td></tr>`).join('')}</table></div>
<div class="day"><div class="sec">官方評鑑內容 ↔ 講義天數 對照表</div><p class="muted">依 115 年簡章評鑑內容。考科一以官方學習指引為依據；考科二無官方學習指引，依簡章評鑑內容與能力指標逐條對應。</p>
<table><tr><th>官方評鑑內容</th><th>名稱</th><th>依據</th><th>講義天數</th><th>題數</th></tr>${DATA.official.map(o=>`<tr><td><span class="ref">${o.code}</span></td><td>${o.name}<br><span class="muted">${o.topic}</span></td><td>${o.guide}</td><td>${o.days.map(i=>'D'+i).join('、')}</td><td>${o.qn}</td></tr>`).join('')}</table></div>`;
DATA.days.forEach(d=>{
 h+=`<div class="day"><div class="dayhd"><div class="m">D${d.id}｜${d.date.replace(/-/g,'/')}（${wk(d.date)}）｜${d.subject}${d.type==='mock'?`｜計時模擬考（建議 ${d.minutes} 分鐘；正式 75 分鐘）`:''}</div><h1 style="font-size:16pt">${d.title}</h1></div>
 <div class="sec">📖 今日學習</div>${d.lecture}
 <div class="sec" style="break-before:page">✏️ ${d.type==='mock'?'模擬考':'今日驗證'}（${d.questions.length} 題）</div>`;
 d.questions.forEach((q,i)=>{h+=`<div class="q"><b>${i+1}.</b> <span class="ref">${q.ref}</span>${q.src?`<span class="${/補充|能力指標|依簡章/.test(q.src)?'supp':'pg'}">${q.src}</span>`:''}<div class="stem">${q.stemH}</div>${q.optsH.map((o,k)=>`<div class="o">(${L[k]}) ${o}</div>`).join('')}</div>`});
 h+=`<div class="sec">✅ D${d.id} 答案與解析</div><p><b>答案速查：</b>${d.questions.map((q,i)=>`${i+1}.${L[q.ans]}`).join('　')}</p>`;
 d.questions.forEach((q,i)=>{h+=`<div class="ans"><b class="k">${i+1}. (${L[q.ans]})</b><span class="ref">${q.ref}</span> ${q.expH}<br><span class="src">來源：${q.origin}</span></div>`});
 if(d.checks&&d.checks.length){h+=`<div class="sec">🧩 D${d.id} 隨堂小測（${d.checks.length} 題，含答案）</div><p class="muted">講義中各段落後的隨堂小測，為原創練習題（非考古題、不計分）。</p>`;
  d.checks.forEach((c,i)=>{h+=`<div class="cpq"><b>小測 ${i+1}.</b> <span class="ref">${c.ref}</span><div class="stem">${c.stemH}</div>${c.optsH.map((o,k)=>`<div class="o">(${L[k]}) ${o}</div>`).join('')}<div class="a"><b>答案：(${L[c.ans]})</b> ${c.expH}</div></div>`})}
 const first=d.gloss.filter(i=>GL[i].days[0]===d.id), seen=d.gloss.filter(i=>GL[i].days[0]!==d.id);
 h+=`<div class="sec">📚 D${d.id} 名詞小辭典</div><p class="seen">本日首次出現 ${first.length} 個名詞，解釋如下。${seen.length?`本日也用到、已在前面章節解釋過的名詞：${seen.map(i=>esc(GL[i].term)+'（D'+GL[i].days[0]+'）').join('、')}。`:''}完整名詞請見書末「附錄：名詞辭典」。</p><div class="gdl">${first.map(i=>gi(i,false)).join('')}</div>`;
 h+=`</div>`});
h+=`<div class="day"><div class="sec">考前速記表</div>${DATA.cheat}</div>`;
{const idx=GL.map((g,i)=>i);const en=idx.filter(i=>/^[A-Za-z0-9]/.test(GL[i].term)).sort((a,b)=>GL[a].term.localeCompare(GL[b].term,'en',{sensitivity:'base',numeric:true}));
 const CATS=['AI','硬體','感測與訊號','網路通訊','工業通訊','平台與資料','資安','製造管理'];
 let a=`<div class="day"><div class="sec">附錄：名詞辭典（${GL.length} 個名詞）</div><p class="muted">英文縮寫依 A–Z 排列，中文名詞依主題分組；〔 〕內為出現的天數。</p><div class="gdl"><div class="gcat">英文縮寫與英文名詞（A–Z）</div>${en.map(i=>gi(i,true)).join('')}`;
 CATS.forEach(c=>{const it=idx.filter(i=>!/^[A-Za-z0-9]/.test(GL[i].term)&&GL[i].cat===c).sort((x,y)=>GL[x].term.localeCompare(GL[y].term,'zh-Hant-TW'));if(it.length)a+=`<div class="gcat">中文名詞｜${c}</div>`+it.map(i=>gi(i,true)).join('')});
 h+=a+`</div></div>`;}
document.getElementById('doc').innerHTML=h;
