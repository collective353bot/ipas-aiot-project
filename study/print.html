在哪裡？", "ans": 0, "id": "d8c4", "n": 4, "stemH": "某裝置設定連線到 <code>mqtt.example.com<\/code>。工程師在現場測試：<code>ping 8.8.8.8<\/code> 可以通，但 <code>nslookup mqtt.example.com<\/code> 查不到 IP。問題最可能出在哪裡？", "optsH": ["裝置的 DNS 設定或 DNS 伺服器", "感測器沒有供電", "MQTT 的 QoS 設定太低", "序列埠鮑率不一致"], "expH": "能 <span class=\"gl\" data-g=\"428\" tabindex=\"0\" role=\"button\">ping<\/span> 通外部 <span class=\"gl\" data-g=\"103\" tabindex=\"0\" role=\"button\">IP<\/span> 代表基本網路連通；nslookup 查不到網域對應 IP，表示 <span class=\"gl\" data-g=\"110\" tabindex=\"0\" role=\"button\">DNS<\/span> 解析有問題，應檢查 DNS 設定。<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>供電、<span class=\"gl\" data-g=\"178\" tabindex=\"0\" role=\"button\">QoS<\/span>、<span class=\"gl\" data-g=\"375\" tabindex=\"0\" role=\"button\">鮑率<\/span>都不會造成網域解析失敗。"}], "lecture": "<blockquote>\n<p><strong>📌 考科二讀前說明（重要）<\/strong>：考科二「<span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">物聯網<\/span>系統與應用」<strong>目前沒有官方學習指引<\/strong>（官網學習資源頁只有考科一的指引；另有官方<span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>課程 collegeplus 1146）。因此 D8～D12 的講義是<strong>依 115 年簡章公告的評鑑主題、6 項評鑑內容（1-1～2-3）與 3 項能力指標逐條撰寫<\/strong>，內容採業界公認的技術知識，每一段都標註對應的官方評鑑內容編號，並註明對應哪一條能力指標。考科二範圍與舊制「物聯網應用工程師」科目二相同。能力指標原文：①軟體設計基礎（雲端資料交換格式、資料庫設計基礎、開源軟體規劃與授權規範）；②硬體設計基礎（<span class=\"gl\" data-g=\"398\" tabindex=\"0\" role=\"button\">I/O<\/span> 通訊與控制方式基礎、<span class=\"gl\" data-g=\"440\" tabindex=\"0\" role=\"button\">開源硬體<\/span>規劃與授權規範）；③軟硬體整合規劃（系統元件與架構、系統故障問題判斷與排除、物聯網資安與隱私權）。<\/p>\n<\/blockquote>\n<h3>今天要搞懂的 5 件事<\/h3>\n<ol>\n<li>一套 IoT 系統由哪些元件組成：<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>、<span class=\"gl\" data-g=\"69\" tabindex=\"0\" role=\"button\">致動器<\/span>、控制器、通訊模組、<span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span>、電源、雲端平台、應用介面。<\/li>\n<li><span class=\"gl\" data-g=\"57\" tabindex=\"0\" role=\"button\">MCU<\/span>、<span class=\"gl\" data-g=\"58\" tabindex=\"0\" role=\"button\">MPU<\/span>／<span class=\"gl\" data-g=\"59\" tabindex=\"0\" role=\"button\">單板電腦<\/span>、閘道器、<span class=\"gl\" data-g=\"68\" tabindex=\"0\" role=\"button\">PLC<\/span> 的差別與選用時機。<\/li>\n<li>「端－邊－雲」架構與資料流（含<span class=\"gl\" data-g=\"414\" tabindex=\"0\" role=\"button\">閉迴路<\/span>控制）。<\/li>\n<li>故障排除的方法論：由簡入繁、分層排查、分段隔離、一次只改一個變數。<\/li>\n<li>常見故障症狀 → 可能原因 → 檢查工具（電源、接線、<span class=\"gl\" data-g=\"427\" tabindex=\"0\" role=\"button\">序列埠<\/span>、<span class=\"gl\" data-g=\"385\" tabindex=\"0\" role=\"button\">I²C<\/span>、<span class=\"gl\" data-g=\"131\" tabindex=\"0\" role=\"button\">Wi-Fi<\/span>、<span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span>、<span class=\"gl\" data-g=\"193\" tabindex=\"0\" role=\"button\">Modbus<\/span>、雜訊）。<\/li>\n<\/ol>\n<h2>1. IoT 系統的基本元件 <span class=\"ref\">考科二 1-1<\/span><span class=\"supp\">補充（能力指標 3：系統元件與架構）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>元件<\/th>\n<th>角色<\/th>\n<th>例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span> Sensor（輸入）<\/td>\n<td>把物理量轉成電訊號<\/td>\n<td>溫濕度、光、加速度、電流、超音波<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"69\" tabindex=\"0\" role=\"button\">致動器<\/span> Actuator（輸出）<\/td>\n<td>把電訊號轉成動作<\/td>\n<td>馬達、<span class=\"gl\" data-g=\"404\" tabindex=\"0\" role=\"button\">繼電器<\/span>、<span class=\"gl\" data-g=\"434\" tabindex=\"0\" role=\"button\">電磁閥<\/span>、LED、蜂鳴器、<span class=\"gl\" data-g=\"433\" tabindex=\"0\" role=\"button\">伺服機<\/span><\/td>\n<\/tr>\n<tr>\n<td>控制器／運算單元<\/td>\n<td>讀感測、做判斷、下指令<\/td>\n<td><span class=\"gl\" data-g=\"57\" tabindex=\"0\" role=\"button\">MCU<\/span>（<span class=\"gl\" data-g=\"60\" tabindex=\"0\" role=\"button\">Arduino<\/span>、<span class=\"gl\" data-g=\"61\" tabindex=\"0\" role=\"button\">ESP32<\/span>）、<span class=\"gl\" data-g=\"59\" tabindex=\"0\" role=\"button\">單板電腦<\/span>（<span class=\"gl\" data-g=\"62\" tabindex=\"0\" role=\"button\">Raspberry Pi<\/span>）、<span class=\"gl\" data-g=\"68\" tabindex=\"0\" role=\"button\">PLC<\/span><\/td>\n<\/tr>\n<tr>\n<td>通訊模組<\/td>\n<td>連網<\/td>\n<td><span class=\"gl\" data-g=\"131\" tabindex=\"0\" role=\"button\">Wi-Fi<\/span>、<span class=\"gl\" data-g=\"139\" tabindex=\"0\" role=\"button\">BLE<\/span>、<span class=\"gl\" data-g=\"146\" tabindex=\"0\" role=\"button\">Zigbee<\/span>、<span class=\"gl\" data-g=\"157\" tabindex=\"0\" role=\"button\">LoRa<\/span>、<span class=\"gl\" data-g=\"156\" tabindex=\"0\" role=\"button\">NB-IoT<\/span>、<span class=\"gl\" data-g=\"161\" tabindex=\"0\" role=\"button\">4G<\/span>/<span class=\"gl\" data-g=\"162\" tabindex=\"0\" role=\"button\">5G<\/span>、<span class=\"gl\" data-g=\"120\" tabindex=\"0\" role=\"button\">Ethernet<\/span>、<span class=\"gl\" data-g=\"202\" tabindex=\"0\" role=\"button\">RS-485<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span> Gateway<\/td>\n<td>協定轉換、<span class=\"gl\" data-g=\"31\" tabindex=\"0\" role=\"button\">資料前處理<\/span>、暫存、安全、上雲<\/td>\n<td>把 Zigbee／<span class=\"gl\" data-g=\"193\" tabindex=\"0\" role=\"button\">Modbus<\/span> 轉成 <span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span>／<span class=\"gl\" data-g=\"106\" tabindex=\"0\" role=\"button\">HTTP<\/span><\/td>\n<\/tr>\n<tr>\n<td>電源<\/td>\n<td>供電與穩壓<\/td>\n<td>電池、變壓器、<span class=\"gl\" data-g=\"421\" tabindex=\"0\" role=\"button\">穩壓 IC<\/span>（如 3.3 V LDO）、太陽能<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>平台／伺服器<\/td>\n<td>收集、儲存、分析、裝置管理<\/td>\n<td>MQTT <span class=\"gl\" data-g=\"176\" tabindex=\"0\" role=\"button\">Broker<\/span>、資料庫、<span class=\"gl\" data-g=\"91\" tabindex=\"0\" role=\"button\">Dashboard<\/span>、<span class=\"gl\" data-g=\"265\" tabindex=\"0\" role=\"button\">規則引擎<\/span><\/td>\n<\/tr>\n<tr>\n<td>應用介面<\/td>\n<td>給人看與操作<\/td>\n<td>手機 App、Web 儀表板、告警通知<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 記法<\/strong>：「<strong>感（輸入）→ 控（判斷）→ 動（輸出）<\/strong>」是單機；加上「<strong>通（通訊）→ 雲（平台）→ 用（應用）<\/strong>」才是<span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">物聯網<\/span>。<\/p>\n<\/blockquote>\n<h2>2. 控制器怎麼選：MCU、單板電腦、PLC <span class=\"ref\">考科二 1-1<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>類型<\/th>\n<th>特性<\/th>\n<th>優點<\/th>\n<th>限制<\/th>\n<th>典型<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"57\" tabindex=\"0\" role=\"button\">MCU<\/span> 微控制器<\/td>\n<td><span class=\"gl\" data-g=\"51\" tabindex=\"0\" role=\"button\">CPU<\/span>＋記憶體＋<span class=\"gl\" data-g=\"398\" tabindex=\"0\" role=\"button\">I/O<\/span> 整合在一顆晶片，通常<strong>不跑完整<span class=\"gl\" data-g=\"436\" tabindex=\"0\" role=\"button\">作業系統<\/span><\/strong>（裸機或 <span class=\"gl\" data-g=\"435\" tabindex=\"0\" role=\"button\">RTOS<\/span>）<\/td>\n<td>便宜、省電、開機即用、即時性好<\/td>\n<td>記憶體與算力小<\/td>\n<td><span class=\"gl\" data-g=\"60\" tabindex=\"0\" role=\"button\">Arduino Uno<\/span>（ATmega328P，8 位元，5 V）、<span class=\"gl\" data-g=\"61\" tabindex=\"0\" role=\"button\">ESP32<\/span>（內建 <span class=\"gl\" data-g=\"131\" tabindex=\"0\" role=\"button\">Wi-Fi<\/span>＋<span class=\"gl\" data-g=\"139\" tabindex=\"0\" role=\"button\">BLE<\/span>，3.3 V）<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"58\" tabindex=\"0\" role=\"button\">MPU<\/span>／<span class=\"gl\" data-g=\"59\" tabindex=\"0\" role=\"button\">單板電腦<\/span> SBC<\/td>\n<td>處理器需外接記憶體，<strong>跑 Linux 等作業系統<\/strong><\/td>\n<td>算力強、可跑資料庫、Python、<span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span> <span class=\"gl\" data-g=\"29\" tabindex=\"0\" role=\"button\">推論<\/span>、多工<\/td>\n<td>較耗電、需正常關機、開機慢<\/td>\n<td><span class=\"gl\" data-g=\"62\" tabindex=\"0\" role=\"button\">Raspberry Pi<\/span>（<span class=\"gl\" data-g=\"397\" tabindex=\"0\" role=\"button\">GPIO<\/span> 為 3.3 V）<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"68\" tabindex=\"0\" role=\"button\">PLC<\/span> 可程式邏輯控制器<\/td>\n<td>工業級控制器，梯形圖等語言<\/td>\n<td>耐環境、穩定可靠、即時控制<\/td>\n<td>價格高、彈性較小<\/td>\n<td>產線設備控制<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"63\" tabindex=\"0\" role=\"button\">工業電腦<\/span> IPC／<span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">邊緣閘道器<\/span><\/td>\n<td>工業級電腦<\/td>\n<td>可跑<span class=\"gl\" data-g=\"44\" tabindex=\"0\" role=\"button\">邊緣運算<\/span>與多協定轉換<\/td>\n<td>成本較高<\/td>\n<td>機台聯網、<span class=\"gl\" data-g=\"45\" tabindex=\"0\" role=\"button\">Edge AI<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：Arduino Uno 的 I/O 是 <strong>5 V<\/strong>，ESP32 與 Raspberry Pi 的 GPIO 是 <strong>3.3 V<\/strong>（不耐 5 V）；混接要加<strong><span class=\"gl\" data-g=\"422\" tabindex=\"0\" role=\"button\">電壓準位轉換<\/span><\/strong>。Raspberry Pi <strong>沒有內建 <span class=\"gl\" data-g=\"320\" tabindex=\"0\" role=\"button\">ADC<\/span><\/strong>，讀類比<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>要外接 ADC 晶片（如經 <span class=\"gl\" data-g=\"386\" tabindex=\"0\" role=\"button\">SPI<\/span> 或 <span class=\"gl\" data-g=\"385\" tabindex=\"0\" role=\"button\">I²C<\/span>）。<\/p>\n<\/blockquote>\n<div class=\"cp\" id=\"cp_d8c1\" data-ans=\"2\"><div class=\"cph\">🧩 隨堂小測 1<span class=\"ref\">考科二 1-1<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">某產線要在高溫、多粉塵、電氣雜訊大的現場，長時間穩定地執行輸送帶與氣缸的即時邏輯控制，可靠度是第一優先，預算相對充足。依講義，最適合的控制器是？<\/div><button class=\"opt cpo\" data-k=\"0\">A. Arduino Uno 開發板<\/button><button class=\"opt cpo\" data-k=\"1\">B. Raspberry Pi 單板電腦<\/button><button class=\"opt cpo\" data-k=\"2\">C. PLC（可程式邏輯控制器）<\/button><button class=\"opt cpo\" data-k=\"3\">D. 手機 App<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div><span class=\"gl\" data-g=\"68\" tabindex=\"0\" role=\"button\">PLC<\/span> 是工業級控制器：耐環境、穩定可靠、即時控制，缺點是價格較高、彈性較小，正符合產線設備控制。<span class=\"gl\" data-g=\"60\" tabindex=\"0\" role=\"button\">Arduino<\/span>、<span class=\"gl\" data-g=\"62\" tabindex=\"0\" role=\"button\">Raspberry Pi<\/span> 偏向開發與原型，耐環境與可靠度不如 PLC。<\/div><\/div><\/div>\n<h2>3. 「端－邊－雲」架構與資料流 <span class=\"ref\">考科二 1-1<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>層<\/th>\n<th>位置<\/th>\n<th>工作<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>端（Device／<span class=\"gl\" data-g=\"93\" tabindex=\"0\" role=\"button\">感知層<\/span>）<\/td>\n<td>現場<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>、<span class=\"gl\" data-g=\"69\" tabindex=\"0\" role=\"button\">致動器<\/span>、<span class=\"gl\" data-g=\"57\" tabindex=\"0\" role=\"button\">MCU<\/span><\/td>\n<td>擷取資料、執行控制<\/td>\n<\/tr>\n<tr>\n<td>邊（Edge／<span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span>）<\/td>\n<td>現場附近<\/td>\n<td>協定轉換、過濾與彙整、即時判斷、斷線暫存（store and forward）<\/td>\n<\/tr>\n<tr>\n<td>雲（Cloud／平台）<\/td>\n<td>資料中心<\/td>\n<td>長期儲存、大數據分析、<span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span> 訓練、裝置管理、跨場域監控<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>典型資料流：<strong>感測器 → <span class=\"gl\" data-g=\"31\" tabindex=\"0\" role=\"button\">訊號調理<\/span>（放大、濾波）→ <span class=\"gl\" data-g=\"320\" tabindex=\"0\" role=\"button\">ADC<\/span> → MCU → 通訊模組 → 閘道器 → <span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>（<span class=\"gl\" data-g=\"176\" tabindex=\"0\" role=\"button\">Broker<\/span>／<span class=\"gl\" data-g=\"187\" tabindex=\"0\" role=\"button\">API<\/span>）→ 資料庫 → <span class=\"gl\" data-g=\"91\" tabindex=\"0\" role=\"button\">儀表板<\/span>／App<\/strong>；若要<strong><span class=\"gl\" data-g=\"414\" tabindex=\"0\" role=\"button\">閉迴路<\/span>控制<\/strong>，雲端或邊緣的判斷結果再下行到 MCU 驅動致動器（例如溫度過高 → 開風扇）。<\/p>\n<p><strong>架構設計的取捨考量<\/strong>：功耗（電池多久）、傳輸距離、<span class=\"gl\" data-g=\"48\" tabindex=\"0\" role=\"button\">頻寬<\/span>與資料量、即時性（<span class=\"gl\" data-g=\"47\" tabindex=\"0\" role=\"button\">延遲<\/span>）、可靠度、成本、資安、擴充性、維運（<span class=\"gl\" data-g=\"168\" tabindex=\"0\" role=\"button\">OTA 更新<\/span>、遠端監控）。<\/p>\n<blockquote>\n<p><strong>💡 例子（智慧溫室規劃）<\/strong>：土壤濕度與溫濕度感測器（類比／數位）→ <span class=\"gl\" data-g=\"61\" tabindex=\"0\" role=\"button\">ESP32<\/span> → <span class=\"gl\" data-g=\"157\" tabindex=\"0\" role=\"button\">LoRa<\/span> 或 <span class=\"gl\" data-g=\"131\" tabindex=\"0\" role=\"button\">Wi-Fi<\/span> → 閘道器 → <span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span> Broker → <span class=\"gl\" data-g=\"247\" tabindex=\"0\" role=\"button\">時序資料庫<\/span> → Dashboard；濕度低於門檻時，由<span class=\"gl\" data-g=\"44\" tabindex=\"0\" role=\"button\">邊緣端<\/span>直接驅動<span class=\"gl\" data-g=\"404\" tabindex=\"0\" role=\"button\">繼電器<\/span>開啟灌溉<span class=\"gl\" data-g=\"434\" tabindex=\"0\" role=\"button\">電磁閥<\/span>（即使網路<span class=\"gl\" data-g=\"411\" tabindex=\"0\" role=\"button\">中斷<\/span>也能運作），雲端負責趨勢分析與通知。<\/p>\n<\/blockquote>\n<div class=\"cp\" id=\"cp_d8c2\" data-ans=\"0\"><div class=\"cph\">🧩 隨堂小測 2<span class=\"ref\">考科二 1-1<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">下列哪一個順序，最符合講義中「感測資料上雲」的典型資料流？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 感測器 → 訊號調理（放大、濾波）→ ADC → MCU → 通訊模組 → 閘道器 → 雲端<\/button><button class=\"opt cpo\" data-k=\"1\">B. 感測器 → 雲端 → ADC → MCU → 閘道器<\/button><button class=\"opt cpo\" data-k=\"2\">C. MCU → 感測器 → 閘道器 → ADC → 雲端<\/button><button class=\"opt cpo\" data-k=\"3\">D. 感測器 → 閘道器 → 訊號調理 → 雲端 → ADC<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div>典型資料流：<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span> → <span class=\"gl\" data-g=\"31\" tabindex=\"0\" role=\"button\">訊號調理<\/span> → <span class=\"gl\" data-g=\"320\" tabindex=\"0\" role=\"button\">ADC<\/span> → <span class=\"gl\" data-g=\"57\" tabindex=\"0\" role=\"button\">MCU<\/span> → 通訊模組 → <span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span> → <span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>（<span class=\"gl\" data-g=\"176\" tabindex=\"0\" role=\"button\">Broker<\/span>／<span class=\"gl\" data-g=\"187\" tabindex=\"0\" role=\"button\">API<\/span>）→ 資料庫 → <span class=\"gl\" data-g=\"91\" tabindex=\"0\" role=\"button\">儀表板<\/span>。<span class=\"gl\" data-g=\"318\" tabindex=\"0\" role=\"button\">類比訊號<\/span>要先調理、再經 ADC 數位化，MCU 才能處理與傳送。<\/div><\/div><\/div>\n<h2>4. 工業現場的元件分層 <span class=\"ref\">考科二 1-1<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>層級<\/th>\n<th>元件<\/th>\n<th>功能<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>現場層<\/td>\n<td><span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>、<span class=\"gl\" data-g=\"69\" tabindex=\"0\" role=\"button\">致動器<\/span>、<span class=\"gl\" data-g=\"432\" tabindex=\"0\" role=\"button\">變頻器<\/span>、伺服<\/td>\n<td>量測與動作<\/td>\n<\/tr>\n<tr>\n<td>控制層<\/td>\n<td><span class=\"gl\" data-g=\"68\" tabindex=\"0\" role=\"button\">PLC<\/span>、控制器<\/td>\n<td>即時邏輯控制<\/td>\n<\/tr>\n<tr>\n<td>監控層<\/td>\n<td><strong><span class=\"gl\" data-g=\"64\" tabindex=\"0\" role=\"button\">HMI<\/span><\/strong>（人機介面）、<strong><span class=\"gl\" data-g=\"65\" tabindex=\"0\" role=\"button\">SCADA<\/span><\/strong>（監控與資料擷取）<\/td>\n<td>畫面監看、警報、遠端操作<\/td>\n<\/tr>\n<tr>\n<td>製造管理層<\/td>\n<td><strong><span class=\"gl\" data-g=\"66\" tabindex=\"0\" role=\"button\">MES<\/span><\/strong>（製造執行系統）<\/td>\n<td>工單、生產追蹤、品質、績效<\/td>\n<\/tr>\n<tr>\n<td>企業層<\/td>\n<td><strong><span class=\"gl\" data-g=\"67\" tabindex=\"0\" role=\"button\">ERP<\/span><\/strong>（企業資源規劃）<\/td>\n<td>訂單、採購、財務、庫存<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>設備聯網常以 <span class=\"gl\" data-g=\"209\" tabindex=\"0\" role=\"button\">OPC UA<\/span>、<span class=\"gl\" data-g=\"212\" tabindex=\"0\" role=\"button\">MTConnect<\/span>、<span class=\"gl\" data-g=\"193\" tabindex=\"0\" role=\"button\">Modbus<\/span> 等標準把現場資料送到上層（D3 已學）。MES 與 ERP 在 D11 會再深入。<\/p>\n<h2>5. 故障排除的方法論 <span class=\"ref\">考科二 1-2<\/span><span class=\"supp\">補充（能力指標 3：系統故障問題判斷與排除）<\/span><\/h2>\n<ol>\n<li><strong>先確認現象與範圍<\/strong>：是全部裝置還是單一裝置？一直發生還是偶發？什麼時候開始？最近改過什麼？<\/li>\n<li><strong>由簡入繁、由外而內<\/strong>：先查電源、接線、指示燈，再查設定、程式、網路、<span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>。<\/li>\n<li><strong>分層排查<\/strong>（對照 <span class=\"gl\" data-g=\"98\" tabindex=\"0\" role=\"button\">OSI<\/span>）：實體（電源、線路、訊號）→ 鏈結／網路（連線、<span class=\"gl\" data-g=\"103\" tabindex=\"0\" role=\"button\">IP<\/span>）→ 傳輸（<span class=\"gl\" data-g=\"123\" tabindex=\"0\" role=\"button\">埠號<\/span>）→ 應用（帳密、主題、格式）。<\/li>\n<li><strong>分段隔離（二分法）<\/strong>：從資料流中間切開測試，例如「<span class=\"gl\" data-g=\"57\" tabindex=\"0\" role=\"button\">MCU<\/span> <span class=\"gl\" data-g=\"427\" tabindex=\"0\" role=\"button\">序列埠<\/span>有讀值嗎？」有 → 問題在後段；沒有 → 問題在前段。<\/li>\n<li><strong>一次只改一個變數<\/strong>，並<strong>做紀錄<\/strong>；修好後確認根本原因（Root Cause），避免再發生。<\/li>\n<li><strong>替換法<\/strong>：用已知良品替換可疑元件（<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>、線材、電源）。<\/li>\n<\/ol>\n<div class=\"cp\" id=\"cp_d8c3\" data-ans=\"2\"><div class=\"cph\">🧩 隨堂小測 3<span class=\"ref\">考科二 1-2<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">工廠 50 台相同的溫度監測裝置中，只有 1 台在儀表板上停止更新，其他 49 台正常。依故障排除方法論，最合理的第一步是？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 立刻重新安裝雲端的 MQTT Broker<\/button><button class=\"opt cpo\" data-k=\"1\">B. 修改全部裝置的 Topic 命名<\/button><button class=\"opt cpo\" data-k=\"2\">C. 既然問題只在單一裝置，先從該台的電源、接線、指示燈與連線狀態查起<\/button><button class=\"opt cpo\" data-k=\"3\">D. 同時更換該裝置的感測器、電源與韌體，盡快恢復<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div>先確認範圍：49 台正常代表 <span class=\"gl\" data-g=\"176\" tabindex=\"0\" role=\"button\">Broker<\/span> 與共通設定大致沒問題，應聚焦單一裝置，並由簡入繁、由外而內。D 一次改太多變數，修好也不知道根本原因。<\/div><\/div><\/div>\n<h2>6. 常見故障「症狀 → 原因 → 處理」 <span class=\"ref\">考科二 1-2<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>症狀<\/th>\n<th>常見原因<\/th>\n<th>檢查與處理<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>裝置完全不動作、指示燈不亮<\/td>\n<td>電源未接、電壓不足、極性反接、保險絲斷<\/td>\n<td><strong><span class=\"gl\" data-g=\"424\" tabindex=\"0\" role=\"button\">三用電表<\/span><\/strong>量供電電壓；檢查變壓器規格<\/td>\n<\/tr>\n<tr>\n<td>馬達或<span class=\"gl\" data-g=\"404\" tabindex=\"0\" role=\"button\">繼電器<\/span>一啟動，<span class=\"gl\" data-g=\"57\" tabindex=\"0\" role=\"button\">MCU<\/span> 就重開機<\/td>\n<td>負載瞬間電流造成<strong><span class=\"gl\" data-g=\"420\" tabindex=\"0\" role=\"button\">電壓下陷<\/span>（brownout）<\/strong>、共用電源<\/td>\n<td><span class=\"gl\" data-g=\"69\" tabindex=\"0\" role=\"button\">致動器<\/span>獨立供電、加大電源容量、加電容；<span class=\"gl\" data-g=\"419\" tabindex=\"0\" role=\"button\">共地<\/span><\/td>\n<\/tr>\n<tr>\n<td>感測讀值一直是 0 或最大值<\/td>\n<td>接線鬆脫、腳位設定錯、<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>沒供電、<strong>未共地<\/strong><\/td>\n<td>檢查接線與程式腳位；量感測器輸出電壓<\/td>\n<\/tr>\n<tr>\n<td>讀值跳動、雜訊大<\/td>\n<td>接地不良、線太長、電源雜訊、靠近馬達<\/td>\n<td>加濾波電容／RC 濾波、軟體平均或中位數濾波、雙絞屏蔽線、遠離干擾源<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"427\" tabindex=\"0\" role=\"button\">序列埠<\/span>出現亂碼<\/td>\n<td><strong><span class=\"gl\" data-g=\"375\" tabindex=\"0\" role=\"button\">鮑率<\/span>不一致<\/strong>、資料格式（如 <span class=\"gl\" data-g=\"396\" tabindex=\"0\" role=\"button\">8N1<\/span>）不符、TX/RX 沒交叉、<span class=\"gl\" data-g=\"201\" tabindex=\"0\" role=\"button\">RS-232<\/span> 與 <span class=\"gl\" data-g=\"423\" tabindex=\"0\" role=\"button\">TTL 準位<\/span>不同<\/td>\n<td>兩端設定一致、TX 接 RX、加<span class=\"gl\" data-g=\"422\" tabindex=\"0\" role=\"button\">準位轉換<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"385\" tabindex=\"0\" role=\"button\">I²C<\/span> 掃不到裝置<\/td>\n<td>位址錯或<strong>位址衝突<\/strong>、<strong>缺<span class=\"gl\" data-g=\"389\" tabindex=\"0\" role=\"button\">上拉電阻<\/span><\/strong>、SDA/SCL 接反、線過長<\/td>\n<td>用 I²C 掃描程式確認位址；加上拉電阻；縮短線長<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"386\" tabindex=\"0\" role=\"button\">SPI<\/span> 讀不到資料<\/td>\n<td><span class=\"gl\" data-g=\"387\" tabindex=\"0\" role=\"button\">片選<\/span> CS 沒拉低、SPI 模式（<span class=\"gl\" data-g=\"388\" tabindex=\"0\" role=\"button\">時脈<\/span>極性／<span class=\"gl\" data-g=\"367\" tabindex=\"0\" role=\"button\">相位<\/span>）不符、MISO/MOSI 接反<\/td>\n<td>對照規格書設定<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"131\" tabindex=\"0\" role=\"button\">Wi-Fi<\/span> 連不上<\/td>\n<td><span class=\"gl\" data-g=\"136\" tabindex=\"0\" role=\"button\">SSID<\/span> 或密碼錯、<strong>裝置只支援 2.4 GHz<\/strong>（如 <span class=\"gl\" data-g=\"61\" tabindex=\"0\" role=\"button\">ESP8266<\/span>）卻連 5 GHz、訊號弱、拿不到 <span class=\"gl\" data-g=\"103\" tabindex=\"0\" role=\"button\">IP<\/span><\/td>\n<td>檢查頻段與<span class=\"gl\" data-g=\"137\" tabindex=\"0\" role=\"button\">訊號強度<\/span>（RSSI）、<span class=\"gl\" data-g=\"431\" tabindex=\"0\" role=\"button\">DHCP<\/span><\/td>\n<\/tr>\n<tr>\n<td>有連網但連不到伺服器<\/td>\n<td>IP／<span class=\"gl\" data-g=\"110\" tabindex=\"0\" role=\"button\">DNS<\/span> 設定、<span class=\"gl\" data-g=\"294\" tabindex=\"0\" role=\"button\">防火牆<\/span>擋埠、伺服器沒開<\/td>\n<td><strong><span class=\"gl\" data-g=\"428\" tabindex=\"0\" role=\"button\">ping<\/span><\/strong> 測連通、<strong>traceroute<\/strong> 看路徑、<strong>nslookup<\/strong> 查 DNS、確認<span class=\"gl\" data-g=\"123\" tabindex=\"0\" role=\"button\">埠號<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span> 收不到訊息<\/td>\n<td><span class=\"gl\" data-g=\"176\" tabindex=\"0\" role=\"button\">Broker<\/span> 位址或埠號錯（一般 <strong>1883<\/strong>、<span class=\"gl\" data-g=\"182\" tabindex=\"0\" role=\"button\">TLS<\/span> <strong>8883<\/strong>）、<strong><span class=\"gl\" data-g=\"177\" tabindex=\"0\" role=\"button\">Topic<\/span> 拼字或大小寫不同<\/strong>、帳密錯、<strong>Client ID 重複<\/strong>互踢<\/td>\n<td>用 MQTT 測試工具訂閱 <code>#<\/code> 觀察；核對 Topic<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"194\" tabindex=\"0\" role=\"button\">Modbus RTU<\/span> 沒有回應<\/td>\n<td><span class=\"gl\" data-g=\"208\" tabindex=\"0\" role=\"button\">從站位址<\/span>（Slave ID）錯、鮑率／<span class=\"gl\" data-g=\"373\" tabindex=\"0\" role=\"button\">同位元<\/span>不符、<strong><span class=\"gl\" data-g=\"202\" tabindex=\"0\" role=\"button\">RS-485<\/span> 的 A/B 線接反<\/strong>、長線缺<span class=\"gl\" data-g=\"418\" tabindex=\"0\" role=\"button\">終端電阻<\/span>（約 120 Ω）、暫存器位址偏移（40001 對應位址 0）<\/td>\n<td>逐項核對通訊參數與接線<\/td>\n<\/tr>\n<tr>\n<td>資料<span class=\"gl\" data-g=\"266\" tabindex=\"0\" role=\"button\">時間戳<\/span>錯亂<\/td>\n<td>裝置時鐘未同步<\/td>\n<td>啟用 <strong><span class=\"gl\" data-g=\"430\" tabindex=\"0\" role=\"button\">NTP<\/span><\/strong> 校時<\/td>\n<\/tr>\n<tr>\n<td>系統跑一段時間當機<\/td>\n<td>記憶體不足或洩漏、無限迴圈、電源不穩<\/td>\n<td>加**<span class=\"gl\" data-g=\"413\" tabindex=\"0\" role=\"button\">看門狗<\/span>（Watchdog）**自動重啟、檢查記憶體使用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 故障排除工具箱 <span class=\"ref\">考科二 1-2<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>工具<\/th>\n<th>用途<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"424\" tabindex=\"0\" role=\"button\">三用電表<\/span>（萬用電表）<\/td>\n<td>量<strong>電壓、電流、電阻、通路（蜂鳴）<\/strong>；查供電與斷線<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"425\" tabindex=\"0\" role=\"button\">示波器<\/span><\/td>\n<td>看<strong>訊號波形<\/strong>、雜訊、<span class=\"gl\" data-g=\"400\" tabindex=\"0\" role=\"button\">PWM<\/span>、時序<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"426\" tabindex=\"0\" role=\"button\">邏輯分析儀<\/span><\/td>\n<td>擷取多路<span class=\"gl\" data-g=\"319\" tabindex=\"0\" role=\"button\">數位訊號<\/span>並<strong>解碼 <span class=\"gl\" data-g=\"384\" tabindex=\"0\" role=\"button\">UART<\/span>／<span class=\"gl\" data-g=\"385\" tabindex=\"0\" role=\"button\">I²C<\/span>／<span class=\"gl\" data-g=\"386\" tabindex=\"0\" role=\"button\">SPI<\/span><\/strong><\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"427\" tabindex=\"0\" role=\"button\">序列埠監控<\/span>（Serial Monitor）<\/td>\n<td>看 <span class=\"gl\" data-g=\"57\" tabindex=\"0\" role=\"button\">MCU<\/span> 印出的除錯訊息與讀值<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"428\" tabindex=\"0\" role=\"button\">ping<\/span>／traceroute／nslookup／ipconfig（ifconfig）<\/td>\n<td>網路連通、路徑、<span class=\"gl\" data-g=\"110\" tabindex=\"0\" role=\"button\">DNS<\/span>、<span class=\"gl\" data-g=\"103\" tabindex=\"0\" role=\"button\">IP<\/span> 設定<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"429\" tabindex=\"0\" role=\"button\">封包分析<\/span>（如 Wireshark）<\/td>\n<td>看實際<span class=\"gl\" data-g=\"113\" tabindex=\"0\" role=\"button\">封包<\/span>內容與協定<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span> 用戶端工具、<span class=\"gl\" data-g=\"192\" tabindex=\"0\" role=\"button\">Postman<\/span><\/td>\n<td>測 <span class=\"gl\" data-g=\"176\" tabindex=\"0\" role=\"button\">Broker<\/span> 訂閱發布、測 <span class=\"gl\" data-g=\"186\" tabindex=\"0\" role=\"button\">REST API<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：量<strong>電流<\/strong>要把電表<strong>串聯<\/strong>在電路中；量<strong>電壓<\/strong>要<strong>並聯<\/strong>；量<strong>電阻<\/strong>要先<strong>斷電<\/strong>。<\/p>\n<\/blockquote>\n<div class=\"cp\" id=\"cp_d8c4\" data-ans=\"0\"><div class=\"cph\">🧩 隨堂小測 4<span class=\"ref\">考科二 1-2<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">某裝置設定連線到 <code>mqtt.example.com<\/code>。工程師在現場測試：<code>ping 8.8.8.8<\/code> 可以通，但 <code>nslookup mqtt.example.com<\/code> 查不到 IP。問題最可能出在哪裡？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 裝置的 DNS 設定或 DNS 伺服器<\/button><button class=\"opt cpo\" data-k=\"1\">B. 感測器沒有供電<\/button><button class=\"opt cpo\" data-k=\"2\">C. MQTT 的 QoS 設定太低<\/button><button class=\"opt cpo\" data-k=\"3\">D. 序列埠鮑率不一致<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div>能 <span class=\"gl\" data-g=\"428\" tabindex=\"0\" role=\"button\">ping<\/span> 通外部 <span class=\"gl\" data-g=\"103\" tabindex=\"0\" role=\"button\">IP<\/span> 代表基本網路連通；nslookup 查不到網域對應 IP，表示 <span class=\"gl\" data-g=\"110\" tabindex=\"0\" role=\"button\">DNS<\/span> 解析有問題，應檢查 DNS 設定。<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>供電、<span class=\"gl\" data-g=\"178\" tabindex=\"0\" role=\"button\">QoS<\/span>、<span class=\"gl\" data-g=\"375\" tabindex=\"0\" role=\"button\">鮑率<\/span>都不會造成網域解析失敗。<\/div><\/div><\/div>\n<h3>今日 30 秒回顧<\/h3>\n<p>感→控→動＋通→雲→用｜MCU 便宜省電無 <span class=\"gl\" data-g=\"436\" tabindex=\"0\" role=\"button\">OS<\/span>、<span class=\"gl\" data-g=\"59\" tabindex=\"0\" role=\"button\">SBC<\/span> 跑 Linux、<span class=\"gl\" data-g=\"68\" tabindex=\"0\" role=\"button\">PLC<\/span> 工業可靠｜<span class=\"gl\" data-g=\"60\" tabindex=\"0\" role=\"button\">Arduino<\/span> 5 V、<span class=\"gl\" data-g=\"61\" tabindex=\"0\" role=\"button\">ESP32<\/span>／Pi 3.3 V、Pi 無 <span class=\"gl\" data-g=\"320\" tabindex=\"0\" role=\"button\">ADC<\/span>｜端－邊－雲；邊緣斷線也能控｜<span class=\"gl\" data-g=\"64\" tabindex=\"0\" role=\"button\">HMI<\/span>/<span class=\"gl\" data-g=\"65\" tabindex=\"0\" role=\"button\">SCADA<\/span> 監控、<span class=\"gl\" data-g=\"66\" tabindex=\"0\" role=\"button\">MES<\/span> 製造、<span class=\"gl\" data-g=\"67\" tabindex=\"0\" role=\"button\">ERP<\/span> 企業｜排查：先現象、由簡入繁、分層、二分、一次改一個｜亂碼→<span class=\"gl\" data-g=\"375\" tabindex=\"0\" role=\"button\">鮑率<\/span>；I²C→位址＋上拉；MQTT→<span class=\"gl\" data-g=\"177\" tabindex=\"0\" role=\"button\">Topic<\/span>、1883/8883；<span class=\"gl\" data-g=\"193\" tabindex=\"0\" role=\"button\">Modbus<\/span>→<span class=\"gl\" data-g=\"208\" tabindex=\"0\" role=\"button\">Slave ID<\/span>、A/B、120 Ω｜電流串聯、電壓並聯、電阻斷電。<\/p>", "audio": {"src": "audio/d08.mp3?v=2", "dur": 640}, "questions": [{"id": "d8q1", "n": 1, "opts": ["感測器（Sensor）", "雲端平台（Cloud Platform）", "閘道器（Gateway）", "致動器（Actuator）"], "exp": "致動器把電訊號轉成實際動作（馬達、繼電器、電磁閥、LED 等），是系統的「輸出」端。感測器是輸入端；閘道器負責協定轉換與上雲；雲端平台負責儲存、分析與管理。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "在智慧溫室系統中，「接收控制訊號後開啟灌溉電磁閥」的元件，屬於物聯網系統中的哪一類元件？", "ref": "考科二 1-1", "src": "能力指標 3（系統元件與架構）", "ans": 3, "stemH": "在智慧溫室系統中，「接收控制訊號後開啟灌溉電磁閥」的元件，屬於物聯網系統中的哪一類元件？", "optsH": ["感測器（Sensor）", "雲端平台（Cloud Platform）", "閘道器（Gateway）", "致動器（Actuator）"], "expH": "<span class=\"gl\" data-g=\"69\" tabindex=\"0\" role=\"button\">致動器<\/span>把電訊號轉成實際動作（馬達、<span class=\"gl\" data-g=\"404\" tabindex=\"0\" role=\"button\">繼電器<\/span>、<span class=\"gl\" data-g=\"434\" tabindex=\"0\" role=\"button\">電磁閥<\/span>、LED 等），是系統的「輸出」端。<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>是輸入端；<span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span>負責協定轉換與上雲；<span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>平台負責儲存、分析與管理。"}, {"id": "d8q2", "n": 2, "opts": ["工業級大型 PLC 搭配 HMI", "機架式伺服器", "內建 Wi-Fi 與 BLE 的 ESP32 微控制器", "具獨立顯示卡的桌上型電腦"], "exp": "單純的感測上傳節點重視成本、功耗與體積，內建無線模組的 MCU（如 ESP32）最合適。伺服器、桌機成本與功耗過高；大型 PLC 適合產線的即時控制，並非低成本感測節點的最佳選擇。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某專案需要一個便宜、低功耗、開機即可執行、可直接以 Wi-Fi 將溫度資料上傳的感測節點，下列何者最適合作為節點控制器？", "ref": "考科二 1-1", "src": "能力指標 3（系統元件與架構）", "ans": 2, "stemH": "某專案需要一個便宜、低功耗、開機即可執行、可直接以 Wi-Fi 將溫度資料上傳的感測節點，下列何者最適合作為節點控制器？", "optsH": ["工業級大型 PLC 搭配 HMI", "機架式伺服器", "內建 Wi-Fi 與 BLE 的 ESP32 微控制器", "具獨立顯示卡的桌上型電腦"], "expH": "單純的感測上傳節點重視成本、功耗與體積，內建無線模組的 <span class=\"gl\" data-g=\"57\" tabindex=\"0\" role=\"button\">MCU<\/span>（如 <span class=\"gl\" data-g=\"61\" tabindex=\"0\" role=\"button\">ESP32<\/span>）最合適。伺服器、桌機成本與功耗過高；大型 <span class=\"gl\" data-g=\"68\" tabindex=\"0\" role=\"button\">PLC<\/span> 適合產線的即時控制，並非低成本感測節點的最佳選擇。"}, {"id": "d8q3", "n": 3, "opts": ["MCU 通常以裸機程式或 RTOS 執行，即時性佳、耗電低", "單板電腦可執行 Linux 作業系統，適合執行資料庫或 AI 推論等較重的工作", "Raspberry Pi 內建類比數位轉換器（ADC），可直接讀取類比感測器的電壓", "單板電腦突然斷電可能損壞檔案系統，應正常關機"], "exp": "Raspberry Pi 的 GPIO 只有數位輸入輸出，**沒有內建 ADC**，讀類比感測器需外接 ADC 晶片（例如透過 SPI 或 I²C）。A、B、D 皆正確。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "關於微控制器（MCU）與單板電腦（如 Raspberry Pi）的比較，下列敘述何者「不」正確？", "ref": "考科二 1-1", "src": "能力指標 3（系統元件與架構）", "ans": 2, "stemH": "關於微控制器（MCU）與單板電腦（如 Raspberry Pi）的比較，下列敘述何者「不」正確？", "optsH": ["MCU 通常以裸機程式或 RTOS 執行，即時性佳、耗電低", "單板電腦可執行 Linux 作業系統，適合執行資料庫或 AI 推論等較重的工作", "Raspberry Pi 內建類比數位轉換器（ADC），可直接讀取類比感測器的電壓", "單板電腦突然斷電可能損壞檔案系統，應正常關機"], "expH": "<span class=\"gl\" data-g=\"62\" tabindex=\"0\" role=\"button\">Raspberry Pi<\/span> 的 <span class=\"gl\" data-g=\"397\" tabindex=\"0\" role=\"button\">GPIO<\/span> 只有<span class=\"gl\" data-g=\"399\" tabindex=\"0\" role=\"button\">數位輸入<\/span>輸出，<b>沒有內建 <span class=\"gl\" data-g=\"320\" tabindex=\"0\" role=\"button\">ADC<\/span><\/b>，讀類比<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>需外接 ADC 晶片（例如透過 <span class=\"gl\" data-g=\"386\" tabindex=\"0\" role=\"button\">SPI<\/span> 或 <span class=\"gl\" data-g=\"385\" tabindex=\"0\" role=\"button\">I²C<\/span>）。A、B、D 皆正確。"}, {"id": "d8q4", "n": 4, "opts": ["將現場 Modbus 設備資料轉換成 MQTT 上傳，並在網路中斷時先暫存資料", "以多年的全廠資料訓練大型深度學習模型", "提供跨國各廠區的經營管理報表", "直接把物理量轉換成電訊號"], "exp": "閘道器（邊緣端）的典型工作是協定轉換、資料前處理、即時判斷與斷線暫存（store and forward）。大型模型訓練與跨廠區報表適合雲端；把物理量轉成電訊號是感測器的工作。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "在「端－邊－雲」架構中，下列哪一項工作最適合放在「邊緣閘道器」執行？", "ref": "考科二 1-1", "src": "能力指標 3（系統元件與架構）", "ans": 0, "stemH": "在「端－邊－雲」架構中，下列哪一項工作最適合放在「邊緣閘道器」執行？", "optsH": ["將現場 Modbus 設備資料轉換成 MQTT 上傳，並在網路中斷時先暫存資料", "以多年的全廠資料訓練大型深度學習模型", "提供跨國各廠區的經營管理報表", "直接把物理量轉換成電訊號"], "expH": "<span class=\"gl\" data-g=\"96\" tabindex=\"0\" role=\"button\">閘道器<\/span>（<span class=\"gl\" data-g=\"44\" tabindex=\"0\" role=\"button\">邊緣端<\/span>）的典型工作是協定轉換、<span class=\"gl\" data-g=\"31\" tabindex=\"0\" role=\"button\">資料前處理<\/span>、即時判斷與斷線暫存（store and forward）。大型<span class=\"gl\" data-g=\"28\" tabindex=\"0\" role=\"button\">模型訓練<\/span>與跨廠區報表適合<span class=\"gl\" data-g=\"225\" tabindex=\"0\" role=\"button\">雲端<\/span>；把物理量轉成電訊號是<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>的工作。"}, {"id": "d8q5", "n": 5, "opts": ["ERP（企業資源規劃）", "PLC（可程式邏輯控制器）", "HMI（人機介面）", "MES（製造執行系統）"], "exp": "MES 位於企業層（ERP）與控制層（PLC／SCADA）之間，負責製造現場的工單、追蹤、品質與績效。ERP 管訂單、採購、財務；HMI 是操作畫面；PLC 執行即時邏輯控制。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "在工廠的資訊系統分層中，負責「工單派工 s=\"gl\" data-g=\"386\" tabindex=\"0\" role=\"button\">SPI<\/span>／<span class=\"gl\" data-g=\"384\" tabindex=\"0\" role=\"button\">UART<\/span> <span class=\"gl\" data-g=\"113\" tabindex=\"0\" role=\"button\">封包<\/span>要用<span class=\"gl\" data-g=\"426\" tabindex=\"0\" role=\"button\">邏輯分析儀<\/span>（部分<span class=\"gl\" data-g=\"425\" tabindex=\"0\" role=\"button\">示波器<\/span>亦有解碼功能）。"}], "gloss": [162, 396, 320, 0, 187, 60, 139, 176, 51, 431, 399, 110, 45, 67, 61, 397, 64, 106, 398, 105, 92, 103, 63, 385, 421, 436, 157, 161, 57, 66, 193, 194, 58, 172, 212, 156, 430, 209, 98, 168, 428, 68, 192, 400, 178, 62, 186, 201, 202, 137, 435, 65, 427, 208, 386, 136, 182, 177, 423, 384, 131, 429, 146, 424, 389, 411, 120, 433, 91, 419, 363, 381, 373, 59, 123, 113, 47, 70, 93, 29, 319, 247, 388, 266, 28, 3, 387, 367, 413, 425, 245, 418, 404, 69, 265, 432, 31, 44, 426, 330, 414, 440, 96, 294, 225, 420, 422, 434, 372, 299, 48, 318, 407, 375]}, {"id": 9, "date": "2026-10-26", "subject": "考科二", "type": "study", "title": "物聯網資訊安全、硬體設計基礎與 I/O、開源授權", "short": "資安＋硬體 I/O＋授權", "lectureChars": 5742, "checks": [{"ref": "考科二 1-3", "opts": ["保留 Telnet，方便日後遠端維修", "關閉不必要的服務與埠號，縮小攻擊面", "只要把攝影機 Wi-Fi 密碼改長就好", "把 Telnet 改用 UDP 傳輸"], "exp": "開啟不必要的網路服務（如 Telnet）會擴大攻擊面，防護做法是關閉不用的服務與埠號。Telnet 本身明文傳輸，保留它風險很高；改 Wi-Fi 密碼無法關掉這個入口。", "stem": "資安人員用掃描工具檢查一台 IoT 攝影機，發現它開著 Telnet 服務，但產品功能完全用不到。依講義的防護原則，最恰當的處理是？", "ans": 1, "id": "d9c1", "n": 1, "stemH": "資安人員用掃描工具檢查一台 IoT 攝影機，發現它開著 Telnet 服務，但產品功能完全用不到。依講義的防護原則，最恰當的處理是？", "optsH": ["保留 Telnet，方便日後遠端維修", "關閉不必要的服務與埠號，縮小攻擊面", "只要把攝影機 Wi-Fi 密碼改長就好", "把 Telnet 改用 UDP 傳輸"], "expH": "開啟不必要的網路服務（如 <span class=\"gl\" data-g=\"112\" tabindex=\"0\" role=\"button\">Telnet<\/span>）會擴大攻擊面，防護做法是關閉不用的服務與<span class=\"gl\" data-g=\"123\" tabindex=\"0\" role=\"button\">埠號<\/span>。Telnet 本身明文傳輸，保留它風險很高；改 <span class=\"gl\" data-g=\"131\" tabindex=\"0\" role=\"button\">Wi-Fi<\/span> 密碼無法關掉這個入口。"}, {"ref": "考科二 2-1", "opts": ["機械按鍵彈跳（Bounce）；用軟體延遲或 RC 電路去彈跳", "ADC 位元數不足；改用 12 位元 ADC", "PWM 占空比太高；降低占空比", "鮑率不一致；兩端改成相同鮑率"], "exp": "機械開關切換瞬間會抖動多次，程式可能誤判成按了很多下，需要去彈跳（Debounce）。ADC、PWM、鮑率都與按鈕計數重複無關。", "stem": "小美做了一個「按一下按鈕計數加 1」的裝置，但常常按一次，計數卻跳了 2～3。最可能的原因與處理方式是？", "ans": 0, "id": "d9c2", "n": 2, "stemH": "小美做了一個「按一下按鈕計數加 1」的裝置，但常常按一次，計數卻跳了 2～3。最可能的原因與處理方式是？", "optsH": ["機械按鍵彈跳（Bounce）；用軟體延遲或 RC 電路去彈跳", "ADC 位元數不足；改用 12 位元 ADC", "PWM 占空比太高；降低占空比", "鮑率不一致；兩端改成相同鮑率"], "expH": "機械開關切換瞬間會抖動多次，程式可能誤判成按了很多下，需要<span class=\"gl\" data-g=\"391\" tabindex=\"0\" role=\"button\">去彈跳<\/span>（Debounce）。<span class=\"gl\" data-g=\"320\" tabindex=\"0\" role=\"button\">ADC<\/span>、<span class=\"gl\" data-g=\"400\" tabindex=\"0\" role=\"button\">PWM<\/span>、<span class=\"gl\" data-g=\"375\" tabindex=\"0\" role=\"button\">鮑率<\/span>都與按鈕計數重複無關。"}, {"ref": "考科二 2-1", "opts": ["12°C", "40°C", "50°C", "60°C"], "exp": "4 mA＝0°C、20 mA＝100°C，量程 16 mA。12 mA 比起點多 8 mA，8÷16＝50%，所以約 50°C。若量到 0 mA 則代表斷線。", "stem": "某溫度變送器以 4–20 mA 輸出，對應 0～100°C，且為線性關係。若量到 12 mA，代表溫度約為多少？", "ans": 2, "id": "d9c3", "n": 3, "stemH": "某溫度變送器以 4–20 mA 輸出，對應 0～100°C，且為線性關係。若量到 12 mA，代表溫度約為多少？", "optsH": ["12°C", "40°C", "50°C", "60°C"], "expH": "4 mA＝0°C、20 mA＝100°C，量程 16 mA。12 mA 比起點多 8 mA，8÷16＝50%，所以約 50°C。若量到 0 mA 則代表斷線。"}, {"ref": "考科二 2-2", "opts": ["自家程式也必須以 LGPL 公開原始碼", "自家程式可以維持閉源；但若修改了函式庫本身，修改的部分須開源", "LGPL 禁止任何商業用途", "LGPL 與 MIT 完全相同，不需保留任何聲明"], "exp": "LGPL 是弱 Copyleft：只是連結使用函式庫，自己的程式可閉源；修改函式庫本身則須開源。它允許商用；與 MIT 不同，仍有 Copyleft 條件。", "stem": "某公司的閉源 IoT 應用程式「只是動態連結使用」一套 LGPL 授權的函式庫，沒有修改函式庫本身。依講義，下列敘述何者正確？", "ans": 1, "id": "d9c4", "n": 4, "stemH": "某公司的閉源 IoT 應用程式「只是動態連結使用」一套 LGPL 授權的函式庫，沒有修改函式庫本身。依講義，下列敘述何者正確？", "optsH": ["自家程式也必須以 LGPL 公開原始碼", "自家程式可以維持閉源；但若修改了函式庫本身，修改的部分須開源", "LGPL 禁止任何商業用途", "LGPL 與 MIT 完全相同，不需保留任何聲明"], "expH": "<span class=\"gl\" data-g=\"445\" tabindex=\"0\" role=\"button\">LGPL<\/span> 是<span class=\"gl\" data-g=\"443\" tabindex=\"0\" role=\"button\">弱 Copyleft<\/span>：只是連結使用函式庫，自己的程式可閉源；修改函式庫本身則須開源。它允許商用；與 <span class=\"gl\" data-g=\"447\" tabindex=\"0\" role=\"button\">MIT<\/span> 不同，仍有 Copyleft 條件。"}], "lecture": "<blockquote>\n<p><strong>📌 考科二說明<\/strong>：本日內容依簡章評鑑內容 1-3（<span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">物聯網<\/span>資訊安全，能力指標 3）、2-1（物聯網硬體設計基礎，能力指標 2：<span class=\"gl\" data-g=\"398\" tabindex=\"0\" role=\"button\">I/O<\/span> 通訊與控制方式基礎、<span class=\"gl\" data-g=\"440\" tabindex=\"0\" role=\"button\">開源硬體<\/span>規劃與授權規範）及能力指標 1 的「開源軟體規劃與授權規範」撰寫；考科二無官方學習指引，內容皆為一般技術知識（標「補充」）。<\/p>\n<\/blockquote>\n<h3>今天要搞懂的 5 件事<\/h3>\n<ol>\n<li>IoT 裝置最常見的資安弱點（預設密碼、未加密、不更新、除錯埠外露）與對應防護。<\/li>\n<li>隱私保護的基本原則：<span class=\"gl\" data-g=\"306\" tabindex=\"0\" role=\"button\">資料最小化<\/span>、<span class=\"gl\" data-g=\"307\" tabindex=\"0\" role=\"button\">告知同意<\/span>、<span class=\"gl\" data-g=\"305\" tabindex=\"0\" role=\"button\">去識別化<\/span>、存取控制。<\/li>\n<li>數位 I/O、類比 I/O、<span class=\"gl\" data-g=\"400\" tabindex=\"0\" role=\"button\">PWM<\/span>、上拉／<span class=\"gl\" data-g=\"389\" tabindex=\"0\" role=\"button\">下拉電阻<\/span>的觀念與計算。<\/li>\n<li>驅動負載與控制方式：<span class=\"gl\" data-g=\"402\" tabindex=\"0\" role=\"button\">電晶體<\/span>／<span class=\"gl\" data-g=\"404\" tabindex=\"0\" role=\"button\">繼電器<\/span>、<span class=\"gl\" data-g=\"407\" tabindex=\"0\" role=\"button\">飛輪二極體<\/span>、<span class=\"gl\" data-g=\"410\" tabindex=\"0\" role=\"button\">光耦合器<\/span>、<span class=\"gl\" data-g=\"185\" tabindex=\"0\" role=\"button\">輪詢<\/span> vs <span class=\"gl\" data-g=\"411\" tabindex=\"0\" role=\"button\">中斷<\/span>、<span class=\"gl\" data-g=\"413\" tabindex=\"0\" role=\"button\">看門狗<\/span>、<span class=\"gl\" data-g=\"416\" tabindex=\"0\" role=\"button\">4–20 mA<\/span>、<span class=\"gl\" data-g=\"201\" tabindex=\"0\" role=\"button\">RS-232<\/span>／<span class=\"gl\" data-g=\"202\" tabindex=\"0\" role=\"button\">RS-485<\/span>。<\/li>\n<li>開源硬體與開源軟體授權：<span class=\"gl\" data-g=\"443\" tabindex=\"0\" role=\"button\">Copyleft<\/span>（<span class=\"gl\" data-g=\"444\" tabindex=\"0\" role=\"button\">GPL<\/span>）與寬鬆型（<span class=\"gl\" data-g=\"447\" tabindex=\"0\" role=\"button\">MIT<\/span>、<span class=\"gl\" data-g=\"448\" tabindex=\"0\" role=\"button\">BSD<\/span>、Apache）的差別。<\/li>\n<\/ol>\n<h2>1. IoT 裝置常見的資安弱點 <span class=\"ref\">考科二 1-3<\/span><span class=\"supp\">補充（能力指標 3：物聯網資安與隱私權）<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"309\" tabindex=\"0\" role=\"button\">OWASP<\/span>（開放式 Web 應用程式安全計畫）整理的 <strong><span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">IoT<\/span> Top 10（2018 版）<\/strong> 第一名就是「<strong>弱密碼、可猜測或寫死（hardcoded）的密碼<\/strong>」。常見弱點與攻擊：<\/p>\n<table>\n<thead>\n<tr>\n<th>弱點<\/th>\n<th>可能後果<\/th>\n<th>防護<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>出廠預設帳密、所有裝置同一組密碼<\/td>\n<td>被<span class=\"gl\" data-g=\"287\" tabindex=\"0\" role=\"button\">殭屍網路<\/span>（如 <span class=\"gl\" data-g=\"290\" tabindex=\"0\" role=\"button\">Mirai<\/span>）大量入侵，拿來發動 <span class=\"gl\" data-g=\"289\" tabindex=\"0\" role=\"button\">DDoS<\/span><\/td>\n<td><strong>每台唯一密碼<\/strong>、首次使用強制修改<\/td>\n<\/tr>\n<tr>\n<td>傳輸未加密（明文 <span class=\"gl\" data-g=\"106\" tabindex=\"0\" role=\"button\">HTTP<\/span>、<span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span> 1883）<\/td>\n<td>竊聽、<strong><span class=\"gl\" data-g=\"286\" tabindex=\"0\" role=\"button\">中間人攻擊<\/span>（MITM）<\/strong>、竄改<\/td>\n<td><strong><span class=\"gl\" data-g=\"182\" tabindex=\"0\" role=\"button\">TLS<\/span><\/strong>（<span class=\"gl\" data-g=\"107\" tabindex=\"0\" role=\"button\">HTTPS<\/span>、MQTT over TLS 常用埠 8883）、<span class=\"gl\" data-g=\"173\" tabindex=\"0\" role=\"button\">CoAP<\/span> 用 <strong><span class=\"gl\" data-g=\"183\" tabindex=\"0\" role=\"button\">DTLS<\/span><\/strong><\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"299\" tabindex=\"0\" role=\"button\">韌體<\/span>有漏洞但無法更新<\/td>\n<td>漏洞長期存在<\/td>\n<td><strong>安全 <span class=\"gl\" data-g=\"168\" tabindex=\"0\" role=\"button\">OTA 更新<\/span><\/strong>（更新檔需<strong><span class=\"gl\" data-g=\"277\" tabindex=\"0\" role=\"button\">數位簽章<\/span><\/strong>驗證）<\/td>\n<\/tr>\n<tr>\n<td>被植入惡意韌體<\/td>\n<td>裝置被控制<\/td>\n<td><strong><span class=\"gl\" data-g=\"298\" tabindex=\"0\" role=\"button\">安全開機<\/span>（Secure Boot）<\/strong>：只執行經簽章驗證的韌體<\/td>\n<\/tr>\n<tr>\n<td>除錯埠（<span class=\"gl\" data-g=\"384\" tabindex=\"0\" role=\"button\">UART<\/span>、<span class=\"gl\" data-g=\"292\" tabindex=\"0\" role=\"button\">JTAG<\/span>）開放、裝置可被拆解<\/td>\n<td>讀出韌體與金鑰<\/td>\n<td>量產關閉除錯埠、加密儲存、<strong><span class=\"gl\" data-g=\"130\" tabindex=\"0\" role=\"button\">安全元件<\/span>／<span class=\"gl\" data-g=\"281\" tabindex=\"0\" role=\"button\">TPM<\/span><\/strong> 保管金鑰<\/td>\n<\/tr>\n<tr>\n<td>開啟不必要的網路服務（<span class=\"gl\" data-g=\"112\" tabindex=\"0\" role=\"button\">Telnet<\/span> 等）<\/td>\n<td>擴大攻擊面<\/td>\n<td>關閉不用的服務與<span class=\"gl\" data-g=\"123\" tabindex=\"0\" role=\"button\">埠號<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"310\" tabindex=\"0\" role=\"button\">重放攻擊<\/span>（Replay）<\/td>\n<td>攻擊者重送截獲的合法指令（例如開門）<\/td>\n<td>加入<span class=\"gl\" data-g=\"266\" tabindex=\"0\" role=\"button\">時間戳<\/span>、亂數（<span class=\"gl\" data-g=\"311\" tabindex=\"0\" role=\"button\">nonce<\/span>）、序號<\/td>\n<\/tr>\n<tr>\n<td>物聯網與辦公網路混在一起<\/td>\n<td>一台被入侵就橫向擴散<\/td>\n<td><strong><span class=\"gl\" data-g=\"293\" tabindex=\"0\" role=\"button\">網路分段<\/span><\/strong>（獨立 <span class=\"gl\" data-g=\"122\" tabindex=\"0\" role=\"button\">VLAN<\/span>、<span class=\"gl\" data-g=\"294\" tabindex=\"0\" role=\"button\">防火牆<\/span>）、<strong><span class=\"gl\" data-g=\"314\" tabindex=\"0\" role=\"button\">最小權限<\/span><\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 記法（裝置資安基本功）<\/strong>：<strong>改密碼、加密傳、能更新、驗開機、關後門、分網段、留紀錄<\/strong>。歐洲 <span class=\"gl\" data-g=\"315\" tabindex=\"0\" role=\"button\">ETSI EN 303 645<\/span> 消費性 IoT 資安基準也把「不得使用通用預設密碼」「提供漏洞通報管道」「保持軟體更新」列為前三項要求。<\/p>\n<\/blockquote>\n<div class=\"cp\" id=\"cp_d9c1\" data-ans=\"1\"><div class=\"cph\">🧩 隨堂小測 1<span class=\"ref\">考科二 1-3<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">資安人員用掃描工具檢查一台 IoT 攝影機，發現它開著 Telnet 服務，但產品功能完全用不到。依講義的防護原則，最恰當的處理是？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 保留 Telnet，方便日後遠端維修<\/button><button class=\"opt cpo\" data-k=\"1\">B. 關閉不必要的服務與埠號，縮小攻擊面<\/button><button class=\"opt cpo\" data-k=\"2\">C. 只要把攝影機 Wi-Fi 密碼改長就好<\/button><button class=\"opt cpo\" data-k=\"3\">D. 把 Telnet 改用 UDP 傳輸<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div>開啟不必要的網路服務（如 <span class=\"gl\" data-g=\"112\" tabindex=\"0\" role=\"button\">Telnet<\/span>）會擴大攻擊面，防護做法是關閉不用的服務與<span class=\"gl\" data-g=\"123\" tabindex=\"0\" role=\"button\">埠號<\/span>。Telnet 本身明文傳輸，保留它風險很高；改 <span class=\"gl\" data-g=\"131\" tabindex=\"0\" role=\"button\">Wi-Fi<\/span> 密碼無法關掉這個入口。<\/div><\/div><\/div>\n<h2>2. 身分認證、加密與資安三要素 <span class=\"ref\">考科二 1-3<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<ul>\n<li><strong><span class=\"gl\" data-g=\"267\" tabindex=\"0\" role=\"button\">CIA 三要素<\/span><\/strong>：機密性（加密）、完整性（<span class=\"gl\" data-g=\"275\" tabindex=\"0\" role=\"button\">雜湊<\/span>、<span class=\"gl\" data-g=\"277\" tabindex=\"0\" role=\"button\">數位簽章<\/span>）、可用性（備援、防 <span class=\"gl\" data-g=\"289\" tabindex=\"0\" role=\"button\">DDoS<\/span>）。<\/li>\n<li><strong>裝置身分認證<\/strong>：帳號密碼、<span class=\"gl\" data-g=\"280\" tabindex=\"0\" role=\"button\">Token<\/span>／API Key、<strong><span class=\"gl\" data-g=\"279\" tabindex=\"0\" role=\"button\">X.509 數位憑證<\/span><\/strong>；高安全場合用<strong><span class=\"gl\" data-g=\"282\" tabindex=\"0\" role=\"button\">雙向 TLS<\/span>（mTLS）<\/strong>，伺服器與裝置互相驗證。<\/li>\n<li><strong><span class=\"gl\" data-g=\"269\" tabindex=\"0\" role=\"button\">對稱加密<\/span><\/strong>（<span class=\"gl\" data-g=\"271\" tabindex=\"0\" role=\"button\">AES<\/span>，同一把金鑰，快，適合大量資料）vs <strong><span class=\"gl\" data-g=\"270\" tabindex=\"0\" role=\"button\">非對稱加密<\/span><\/strong>（<span class=\"gl\" data-g=\"272\" tabindex=\"0\" role=\"button\">RSA<\/span>、ECC，公鑰／私鑰，用於交換金鑰與數位簽章）。<span class=\"gl\" data-g=\"182\" tabindex=\"0\" role=\"button\">TLS<\/span> 就是先用非對稱交換金鑰，再用對稱加密傳資料。<\/li>\n<li><strong>存取控制<\/strong>：依角色授權（<span class=\"gl\" data-g=\"312\" tabindex=\"0\" role=\"button\">RBAC<\/span>）、<span class=\"gl\" data-g=\"314\" tabindex=\"0\" role=\"button\">最小權限<\/span>；<span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span> <span class=\"gl\" data-g=\"176\" tabindex=\"0\" role=\"button\">Broker<\/span> 可設定 <span class=\"gl\" data-g=\"313\" tabindex=\"0\" role=\"button\">ACL<\/span> 限制每個用戶端能發布或訂閱哪些 <span class=\"gl\" data-g=\"177\" tabindex=\"0\" role=\"button\">Topic<\/span>。<\/li>\n<li><strong>監控與事件應變<\/strong>：記錄登入與異常流量、設定告警、定期<span class=\"gl\" data-g=\"304\" tabindex=\"0\" role=\"button\">弱點掃描<\/span>。<\/li>\n<\/ul>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：<strong>加密<\/strong>保護機密性（別人看不懂）；<strong>雜湊<\/strong>保護完整性（看得出被改過），雜湊不可逆、不能「解密」。<strong>數位簽章<\/strong>＝用<strong>私鑰<\/strong>簽、<strong>公鑰<\/strong>驗，可證明來源與不可否認。<\/p>\n<\/blockquote>\n<h2>3. 隱私權保護 <span class=\"ref\">考科二 1-3<\/span><span class=\"supp\">補充（能力指標 3：物聯網資安與隱私權）<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">IoT<\/span> 會蒐集位置、影像、聲音、健康與行為資料，屬於個人資料時需遵守我國《<span class=\"gl\" data-g=\"308\" tabindex=\"0\" role=\"button\">個人資料保護法<\/span>》（歐盟則為 GDPR）。設計原則：\n- <strong><span class=\"gl\" data-g=\"306\" tabindex=\"0\" role=\"button\">資料最小化<\/span><\/strong>：只蒐集達成目的所需的資料（例如人流計數只需「人數」，不需保存人臉影像）。\n- <strong><span class=\"gl\" data-g=\"307\" tabindex=\"0\" role=\"button\">告知與同意<\/span><\/strong>：說明蒐集目的、範圍、保存期限與利用方式。\n- <strong><span class=\"gl\" data-g=\"305\" tabindex=\"0\" role=\"button\">去識別化<\/span><\/strong>：在<span class=\"gl\" data-g=\"44\" tabindex=\"0\" role=\"button\">邊緣端<\/span>先做遮蔽、匿名化或假名化再上傳。\n- <strong>安全保存與限期刪除<\/strong>：加密儲存、存取控制、到期刪除。\n- <strong><span class=\"gl\" data-g=\"82\" tabindex=\"0\" role=\"button\">隱私設計<\/span>（Privacy by Design）<\/strong>：從系統設計之初就納入隱私保護，而非事後補救。<\/p>\n<h2>4. 數位與類比 I/O 基礎 <span class=\"ref\">考科二 2-1<\/span><span class=\"supp\">補充（能力指標 2：I/O 通訊與控制方式基礎）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>類型<\/th>\n<th>說明<\/th>\n<th>例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"399\" tabindex=\"0\" role=\"button\">數位輸入<\/span> DI<\/td>\n<td>讀取 HIGH／LOW 兩種狀態<\/td>\n<td>按鈕、極限開關、<span class=\"gl\" data-g=\"335\" tabindex=\"0\" role=\"button\">PIR<\/span> 輸出<\/td>\n<\/tr>\n<tr>\n<td>數位輸出 DO<\/td>\n<td>輸出 HIGH／LOW<\/td>\n<td>LED、<span class=\"gl\" data-g=\"404\" tabindex=\"0\" role=\"button\">繼電器<\/span>控制腳<\/td>\n<\/tr>\n<tr>\n<td>類比輸入 <span class=\"gl\" data-g=\"0\" tabindex=\"0\" role=\"button\">AI<\/span><\/td>\n<td>經 <strong><span class=\"gl\" data-g=\"320\" tabindex=\"0\" role=\"button\">ADC<\/span><\/strong> 轉成數值<\/td>\n<td><span class=\"gl\" data-g=\"360\" tabindex=\"0\" role=\"button\">光敏電阻<\/span><span class=\"gl\" data-g=\"363\" tabindex=\"0\" role=\"button\">分壓<\/span>、可變電阻、類比溫度<span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span><\/td>\n<\/tr>\n<tr>\n<td>類比輸出 AO<\/td>\n<td>經 <strong><span class=\"gl\" data-g=\"321\" tabindex=\"0\" role=\"button\">DAC<\/span><\/strong> 輸出電壓，或用 <strong><span class=\"gl\" data-g=\"400\" tabindex=\"0\" role=\"button\">PWM<\/span><\/strong> 模擬<\/td>\n<td>調光、馬達調速、音訊<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong><span class=\"gl\" data-g=\"390\" tabindex=\"0\" role=\"button\">浮接<\/span>（Floating）<\/strong>：輸入腳沒接到確定電位時讀值會亂跳 → 加<strong><span class=\"gl\" data-g=\"389\" tabindex=\"0\" role=\"button\">上拉電阻<\/span><\/strong>（平時 HIGH，按下接地變 LOW）或<strong>下拉電阻<\/strong>（平時 LOW）。許多 <span class=\"gl\" data-g=\"57\" tabindex=\"0\" role=\"button\">MCU<\/span> 內建上拉電阻（如 <span class=\"gl\" data-g=\"60\" tabindex=\"0\" role=\"button\">Arduino<\/span> <code>INPUT_PULLUP<\/code>）。<\/li>\n<li><strong><span class=\"gl\" data-g=\"391\" tabindex=\"0\" role=\"button\">按鍵彈跳<\/span>（Bounce）<\/strong>：機械開關切換瞬間會抖動多次 → 用軟體<span class=\"gl\" data-g=\"47\" tabindex=\"0\" role=\"button\">延遲<\/span>或 RC 電路<strong>去彈跳（Debounce）<\/strong>。<\/li>\n<li><strong>ADC<\/strong>：10 位元 ADC 有 2¹⁰＝1024 階（0～1023）；參考電壓 5 V 時，讀值 512 約等於 2.5 V。<\/li>\n<li><strong>PWM（脈波寬度調變）<\/strong>：用固定<span class=\"gl\" data-g=\"366\" tabindex=\"0\" role=\"button\">頻率<\/span>的方波，改變<strong><span class=\"gl\" data-g=\"401\" tabindex=\"0\" role=\"button\">占空比<\/span>（Duty Cycle）<\/strong>＝高電位時間 ÷ <span class=\"gl\" data-g=\"368\" tabindex=\"0\" role=\"button\">週期<\/span>。平均電壓 ≈ 電源電壓 × 占空比，例如 5 V × 25 %＝1.25 V。用於 LED 調光、直流馬達調速、<span class=\"gl\" data-g=\"433\" tabindex=\"0\" role=\"button\">伺服馬達<\/span>定位（伺服機看的是脈波寬度）。<\/li>\n<\/ul>\n<blockquote>\n<p><strong>💡 例子（LED <span class=\"gl\" data-g=\"437\" tabindex=\"0\" role=\"button\">限流電阻<\/span>）<\/strong>：電源 5 V、LED 順向電壓 2 V、希望電流 15 mA → R＝(5−2)÷0.015＝200 Ω（實務選相近的標準值，如 220 Ω）。<\/p>\n<\/blockquote>\n<div class=\"cp\" id=\"cp_d9c2\" data-ans=\"0\"><div class=\"cph\">🧩 隨堂小測 2<span class=\"ref\">考科二 2-1<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">小美做了一個「按一下按鈕計數加 1」的裝置，但常常按一次，計數卻跳了 2～3。最可能的原因與處理方式是？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 機械按鍵彈跳（Bounce）；用軟體延遲或 RC 電路去彈跳<\/button><button class=\"opt cpo\" data-k=\"1\">B. ADC 位元數不足；改用 12 位元 ADC<\/button><button class=\"opt cpo\" data-k=\"2\">C. PWM 占空比太高；降低占空比<\/button><button class=\"opt cpo\" data-k=\"3\">D. 鮑率不一致；兩端改成相同鮑率<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div>機械開關切換瞬間會抖動多次，程式可能誤判成按了很多下，需要<span class=\"gl\" data-g=\"391\" tabindex=\"0\" role=\"button\">去彈跳<\/span>（Debounce）。<span class=\"gl\" data-g=\"320\" tabindex=\"0\" role=\"button\">ADC<\/span>、<span class=\"gl\" data-g=\"400\" tabindex=\"0\" role=\"button\">PWM<\/span>、<span class=\"gl\" data-g=\"375\" tabindex=\"0\" role=\"button\">鮑率<\/span>都與按鈕計數重複無關。<\/div><\/div><\/div>\n<h2>5. 驅動負載與隔離保護 <span class=\"ref\">考科二 2-1<\/span><span class=\"supp\">補充（能力指標 2）<\/span><\/h2>\n<p><span class=\"gl\" data-g=\"57\" tabindex=\"0\" role=\"button\">MCU<\/span> 的 <span class=\"gl\" data-g=\"397\" tabindex=\"0\" role=\"button\">GPIO<\/span> 只能提供很小的電流（每腳約數 mA 至數十 mA，依晶片規格），<strong>不能直接驅動馬達、<span class=\"gl\" data-g=\"434\" tabindex=\"0\" role=\"button\">電磁閥<\/span>、燈泡<\/strong>。<\/p>\n<table>\n<thead>\n<tr>\n<th>元件<\/th>\n<th>用途<\/th>\n<th>注意<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"402\" tabindex=\"0\" role=\"button\">電晶體<\/span>（BJT）／<span class=\"gl\" data-g=\"403\" tabindex=\"0\" role=\"button\">MOSFET<\/span><\/td>\n<td>以小訊號控制直流負載的大電流<\/td>\n<td>MOSFET 常用於 <span class=\"gl\" data-g=\"400\" tabindex=\"0\" role=\"button\">PWM<\/span> 調速<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"404\" tabindex=\"0\" role=\"button\">繼電器<\/span>（Relay）<\/td>\n<td>以小電流控制大電流或<strong>交流市電<\/strong>的開關，觸點與控制端電氣隔離<\/td>\n<td>機械觸點有壽命、切換慢、有噪音<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"405\" tabindex=\"0\" role=\"button\">固態繼電器<\/span>（SSR）<\/td>\n<td>無機械觸點的半導體開關<\/td>\n<td>無火花、壽命長、可快速切換<\/td>\n<\/tr>\n<tr>\n<td><span class=\"gl\" data-g=\"406\" tabindex=\"0\" role=\"button\">馬達驅動 IC<\/span>（H 橋，如 L298N）<\/td>\n<td>控制直流馬達<strong>正反轉<\/strong>與速度<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"407\" tabindex=\"0\" role=\"button\">飛輪二極體<\/span>（Flyback Diode）<\/strong><\/td>\n<td>並聯在<strong>繼電器線圈、馬達<\/strong>等<strong><span class=\"gl\" data-g=\"408\" tabindex=\"0\" role=\"button\">感性負載<\/span><\/strong>兩端，吸收斷電時的<span class=\"gl\" data-g=\"409\" tabindex=\"0\" role=\"button\">反電動勢<\/span><\/td>\n<td>不加可能燒毀電晶體或 MCU<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"410\" tabindex=\"0\" role=\"button\">光耦合器<\/span>（Optocoupler）<\/strong><\/td>\n<td>用光傳遞訊號，使控制端與負載端<strong>電氣隔離<\/strong><\/td>\n<td>抗雜訊、保護 MCU<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>6. 控制方式與工業 I/O 介面 <span class=\"ref\">考科二 2-1<\/span><span class=\"supp\">補充（能力指標 2：I/O 通訊與控制方式基礎）<\/span><\/h2>\n<ul>\n<li><strong><span class=\"gl\" data-g=\"185\" tabindex=\"0\" role=\"button\">輪詢<\/span>（Polling）<\/strong>：程式反覆檢查狀態，簡單但浪費 <span class=\"gl\" data-g=\"51\" tabindex=\"0\" role=\"button\">CPU<\/span>、可能漏掉短暫事件。<\/li>\n<li><strong><span class=\"gl\" data-g=\"411\" tabindex=\"0\" role=\"button\">中斷<\/span>（Interrupt）<\/strong>：事件發生時硬體通知 CPU 立即處理，反應快、省電（可配合睡眠模式）。<\/li>\n<li><strong><span class=\"gl\" data-g=\"412\" tabindex=\"0\" role=\"button\">計時器<\/span>（Timer）<\/strong>：定時取樣、產生 <span class=\"gl\" data-g=\"400\" tabindex=\"0\" role=\"button\">PWM<\/span>。<strong><span class=\"gl\" data-g=\"413\" tabindex=\"0\" role=\"button\">看門狗<\/span>（Watchdog Timer）<\/strong>：程式當機未按時「餵狗」就自動重置系統。<\/li>\n<li><strong><span class=\"gl\" data-g=\"414\" tabindex=\"0\" role=\"button\">開迴路<\/span><\/strong>（只下命令不看結果）vs <strong>閉迴路<\/strong>（依感測回授調整，如 ON/OFF 溫控、<span class=\"gl\" data-g=\"415\" tabindex=\"0\" role=\"button\">PID 控制<\/span>）。<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>介面<\/th>\n<th>特性<\/th>\n<th>用途<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"gl\" data-g=\"384\" tabindex=\"0\" role=\"button\">UART<\/span>／<span class=\"gl\" data-g=\"385\" tabindex=\"0\" role=\"button\">I²C<\/span>／<span class=\"gl\" data-g=\"386\" tabindex=\"0\" role=\"button\">SPI<\/span>（D5 已學）<\/td>\n<td>板上或短距離<\/td>\n<td><span class=\"gl\" data-g=\"70\" tabindex=\"0\" role=\"button\">感測器<\/span>、模組<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"201\" tabindex=\"0\" role=\"button\">RS-232<\/span><\/strong><\/td>\n<td>單端訊號、點對點、距離短（約 15 m）<\/td>\n<td>舊設備、儀器<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"202\" tabindex=\"0\" role=\"button\">RS-485<\/span><\/strong><\/td>\n<td><strong><span class=\"gl\" data-g=\"417\" tabindex=\"0\" role=\"button\">差動訊號<\/span><\/strong>、抗雜訊、<strong>多點<\/strong>連線（常見 32 個單位負載）、可達約 <strong>1200 m<\/strong>，常用<span class=\"gl\" data-g=\"371\" tabindex=\"0\" role=\"button\">半雙工<\/span><\/td>\n<td><strong><span class=\"gl\" data-g=\"194\" tabindex=\"0\" role=\"button\">Modbus RTU<\/span><\/strong>、工業現場<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"216\" tabindex=\"0\" role=\"button\">CAN Bus<\/span><\/strong><\/td>\n<td>差動、多主控、具錯誤偵測<\/td>\n<td>汽車、工業機械<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"416\" tabindex=\"0\" role=\"button\">4–20 mA<\/span> 電流迴路<\/strong><\/td>\n<td>長距離抗雜訊、不受線阻影響；<strong>4 mA 代表最小值，0 mA 代表斷線<\/strong><\/td>\n<td>工業感測器、變送器<\/td>\n<\/tr>\n<tr>\n<td>0–10 V 電壓訊號<\/td>\n<td>簡單，但長距離易受壓降影響<\/td>\n<td><span class=\"gl\" data-g=\"432\" tabindex=\"0\" role=\"button\">變頻器<\/span>設定<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：4–20 mA 用 <strong>4 mA 而不是 0 mA<\/strong> 當起點，就是為了能分辨「量到最小值」與「線斷了」。<\/p>\n<\/blockquote>\n<div class=\"cp\" id=\"cp_d9c3\" data-ans=\"2\"><div class=\"cph\">🧩 隨堂小測 3<span class=\"ref\">考科二 2-1<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">某溫度變送器以 4–20 mA 輸出，對應 0～100°C，且為線性關係。若量到 12 mA，代表溫度約為多少？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 12°C<\/button><button class=\"opt cpo\" data-k=\"1\">B. 40°C<\/button><button class=\"opt cpo\" data-k=\"2\">C. 50°C<\/button><button class=\"opt cpo\" data-k=\"3\">D. 60°C<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div>4 mA＝0°C、20 mA＝100°C，量程 16 mA。12 mA 比起點多 8 mA，8÷16＝50%，所以約 50°C。若量到 0 mA 則代表斷線。<\/div><\/div><\/div>\n<h2>7. 開源硬體的規劃與授權 <span class=\"ref\">考科二 2-1<\/span><span class=\"supp\">補充（能力指標 2：開源硬體規劃與授權規範）<\/span><\/h2>\n<ul>\n<li><strong><span class=\"gl\" data-g=\"440\" tabindex=\"0\" role=\"button\">開源硬體<\/span><\/strong>：公開設計檔（<strong>原理圖、<span class=\"gl\" data-g=\"438\" tabindex=\"0\" role=\"button\">PCB<\/span> 佈線、<span class=\"gl\" data-g=\"439\" tabindex=\"0\" role=\"button\">物料清單<\/span> BOM<\/strong>、<span class=\"gl\" data-g=\"299\" tabindex=\"0\" role=\"button\">韌體<\/span>與文件），讓任何人可研究、修改、製造與販售。開源硬體協會（OSHWA）有定義與認證。<\/li>\n<li><strong>常見授權<\/strong>：<strong><span class=\"gl\" data-g=\"441\" tabindex=\"0\" role=\"button\">CERN OHL v2<\/span><\/strong>（分 -P 寬鬆、-W 弱互惠、-S 強互惠三種）、<strong>TAPR OHL<\/strong>、<strong><span class=\"gl\" data-g=\"442\" tabindex=\"0\" role=\"button\">CC BY-SA<\/span><\/strong>（姓名標示－相同方式分享，<span class=\"gl\" data-g=\"60\" tabindex=\"0\" role=\"button\">Arduino<\/span> 參考設計即採用）。<\/li>\n<li><strong>商標不在開源範圍內<\/strong>：Arduino 電路可以合法複製販售，但不能用「Arduino」商標，只能稱「相容板（compatible）」。<\/li>\n<li><strong><span class=\"gl\" data-g=\"62\" tabindex=\"0\" role=\"button\">Raspberry Pi<\/span> 的定位<\/strong>：軟體生態大多開源，但主板設計並未以開源硬體授權完整公開，一般不視為開源硬體。<\/li>\n<li><strong>規劃時考量<\/strong>：授權是否允許商用、衍生設計是否必須以相同授權公開、需保留的姓名標示、元件是否容易取得。<\/li>\n<\/ul>\n<h2>8. 開源軟體的規劃與授權 <span class=\"ref\">考科二 2-2<\/span><span class=\"supp\">補充（能力指標 1：開源軟體規劃與授權規範）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>授權<\/th>\n<th>類型<\/th>\n<th>散布修改後的程式時<\/th>\n<th><span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">IoT<\/span> 常見例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"444\" tabindex=\"0\" role=\"button\">GPL<\/span><\/strong>（v2／v3）<\/td>\n<td><strong><span class=\"gl\" data-g=\"443\" tabindex=\"0\" role=\"button\">強 Copyleft<\/span>（著作傳染性）<\/strong><\/td>\n<td>衍生作品<strong>必須以 GPL 開放原始碼<\/strong><\/td>\n<td><span class=\"gl\" data-g=\"436\" tabindex=\"0\" role=\"button\">Linux<\/span> 核心（GPLv2）<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"445\" tabindex=\"0\" role=\"button\">LGPL<\/span><\/strong><\/td>\n<td>弱 Copyleft<\/td>\n<td>只是<strong>連結使用<\/strong>函式庫，自己的程式可閉源；<strong>修改函式庫本身<\/strong>須開源<\/td>\n<td><span class=\"gl\" data-g=\"60\" tabindex=\"0\" role=\"button\">Arduino<\/span> 核心函式庫（LGPL）<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"446\" tabindex=\"0\" role=\"button\">MPL 2.0<\/span><\/strong><\/td>\n<td>檔案層級 Copyleft<\/td>\n<td>修改到的那些檔案需開源<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"447\" tabindex=\"0\" role=\"button\">MIT<\/span><\/strong><\/td>\n<td>寬鬆型<\/td>\n<td>保留版權與授權聲明即可，可閉源商用<\/td>\n<td><span class=\"gl\" data-g=\"435\" tabindex=\"0\" role=\"button\">FreeRTOS<\/span><\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"448\" tabindex=\"0\" role=\"button\">BSD<\/span><\/strong><\/td>\n<td>寬鬆型<\/td>\n<td>保留聲明；部分版本禁止用作者名背書<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"449\" tabindex=\"0\" role=\"button\">Apache 2.0<\/span><\/strong><\/td>\n<td>寬鬆型<\/td>\n<td>保留聲明與 NOTICE、標示修改；<strong>含明確專利授權<\/strong><\/td>\n<td><span class=\"gl\" data-g=\"262\" tabindex=\"0\" role=\"button\">Node-RED<\/span>、Zephyr RTOS<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"gl\" data-g=\"450\" tabindex=\"0\" role=\"button\">AGPL<\/span><\/strong><\/td>\n<td>網路 Copyleft<\/td>\n<td>即使只是<strong>透過網路提供服務<\/strong>也要開源<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>規劃重點：\n- <strong>只在內部使用、沒有散布<\/strong>，GPL 不要求公開原始碼（AGPL 例外：網路服務也算）。\n- 產品出貨前做<strong>授權盤點<\/strong>，建立 <strong><span class=\"gl\" data-g=\"316\" tabindex=\"0\" role=\"button\">SBOM<\/span>（軟體物料清單）<\/strong>，保留 LICENSE／NOTICE 檔。\n- 注意<strong>授權相容性<\/strong>：例如 Apache 2.0 與 GPLv2 不相容，與 GPLv3 相容。\n- 開源不等於免費放棄權利：仍有著作權，只是依授權條件授權他人使用。<\/p>\n<div class=\"cp\" id=\"cp_d9c4\" data-ans=\"1\"><div class=\"cph\">🧩 隨堂小測 4<span class=\"ref\">考科二 2-2<\/span><span class=\"cpn\">不計分・原創練習<\/span><\/div><div class=\"stem\">某公司的閉源 IoT 應用程式「只是動態連結使用」一套 LGPL 授權的函式庫，沒有修改函式庫本身。依講義，下列敘述何者正確？<\/div><button class=\"opt cpo\" data-k=\"0\">A. 自家程式也必須以 LGPL 公開原始碼<\/button><button class=\"opt cpo\" data-k=\"1\">B. 自家程式可以維持閉源；但若修改了函式庫本身，修改的部分須開源<\/button><button class=\"opt cpo\" data-k=\"2\">C. LGPL 禁止任何商業用途<\/button><button class=\"opt cpo\" data-k=\"3\">D. LGPL 與 MIT 完全相同，不需保留任何聲明<\/button><div class=\"cpfb\" hidden><b class=\"cpr\"><\/b><div><span class=\"gl\" data-g=\"445\" tabindex=\"0\" role=\"button\">LGPL<\/span> 是<span class=\"gl\" data-g=\"443\" tabindex=\"0\" role=\"button\">弱 Copyleft<\/span>：只是連結使用函式庫，自己的程式可閉源；修改函式庫本身則須開源。它允許商用；與 <span class=\"gl\" data-g=\"447\" tabindex=\"0\" role=\"button\">MIT<\/span> 不同，仍有 Copyleft 條件。<\/div><\/div><\/div>\n<h3>今日 30 秒回顧<\/h3>\n<p>預設密碼＝第一大弱點（<span class=\"gl\" data-g=\"290\" tabindex=\"0\" role=\"button\">Mirai<\/span>）｜<span class=\"gl\" data-g=\"182\" tabindex=\"0\" role=\"button\">TLS<\/span>、<span class=\"gl\" data-g=\"172\" tabindex=\"0\" role=\"button\">MQTT<\/span> 8883、<span class=\"gl\" data-g=\"173\" tabindex=\"0\" role=\"button\">CoAP<\/span> 用 <span class=\"gl\" data-g=\"183\" tabindex=\"0\" role=\"button\">DTLS<\/span>｜<span class=\"gl\" data-g=\"277\" tabindex=\"0\" role=\"button\">簽章<\/span> <span class=\"gl\" data-g=\"168\" tabindex=\"0\" role=\"button\">OTA<\/span>＋<span class=\"gl\" data-g=\"298\" tabindex=\"0\" role=\"button\">Secure Boot<\/span>｜關除錯埠、分<span class=\"gl\" data-g=\"293\" tabindex=\"0\" role=\"button\">網段<\/span>、<span class=\"gl\" data-g=\"314\" tabindex=\"0\" role=\"button\">最小權限<\/span>｜隱私：最小化、同意、去識別、限期刪除、<span class=\"gl\" data-g=\"82\" tabindex=\"0\" role=\"button\">PbD<\/span>｜<span class=\"gl\" data-g=\"390\" tabindex=\"0\" role=\"button\">浮接<\/span>→上拉／下拉｜10 位元 <span class=\"gl\" data-g=\"320\" tabindex=\"0\" role=\"button\">ADC<\/span>＝0～1023｜<span class=\"gl\" data-g=\"400\" tabindex=\"0\" role=\"button\">PWM<\/span> 平均電壓＝V×<span class=\"gl\" data-g=\"401\" tabindex=\"0\" role=\"button\">占空比<\/span>｜<span class=\"gl\" data-g=\"408\" tabindex=\"0\" role=\"button\">感性負載<\/span>加<span class=\"gl\" data-g=\"407\" tabindex=\"0\" role=\"button\">飛輪二極體<\/span>、<span class=\"gl\" data-g=\"410\" tabindex=\"0\" role=\"button\">光耦<\/span>隔離｜<span class=\"gl\" data-g=\"411\" tabindex=\"0\" role=\"button\">中斷<\/span>比<span class=\"gl\" data-g=\"185\" tabindex=\"0\" role=\"button\">輪詢<\/span>快又省電、<span class=\"gl\" data-g=\"413\" tabindex=\"0\" role=\"button\">看門狗<\/span>自動重置｜<span class=\"gl\" data-g=\"202\" tabindex=\"0\" role=\"button\">RS-485<\/span> <span class=\"gl\" data-g=\"417\" tabindex=\"0\" role=\"button\">差動<\/span>多點 1200 m｜4 mA 起點、0 mA＝斷線｜<span class=\"gl\" data-g=\"440\" tabindex=\"0\" role=\"button\">開源硬體<\/span>：<span class=\"gl\" data-g=\"441\" tabindex=\"0\" role=\"button\">CERN OHL<\/span>、TAPR、<span class=\"gl\" data-g=\"442\" tabindex=\"0\" role=\"button\">CC BY-SA<\/span>，商標除外｜GPL 傳染、LGPL 連結可閉源、MIT/BSD/Apache 寬鬆（Apache 有專利授權）、AGPL 連網路服務也算。<\/p>", "audio": {"src": "audio/d09.mp3?v=2", "dur": 691}, "questions": [{"id": "d9q1", "n": 1, "opts": ["裝置使用出廠預設或容易猜測的帳號密碼", "裝置採用 TLS 加密傳輸", "裝置啟用安全開機（Secure Boot）", "裝置放在獨立的網段中"], "exp": "Mirai 以一份常見預設帳密清單掃描網路上的裝置並登入植入惡意程式，再用這些裝置發動 DDoS。B、C、D 都是防護措施。OWASP IoT Top 10（2018）第一名即「弱密碼、可猜測或寫死的密碼」。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "Mirai 殭屍網路能大量入侵網路攝影機與路由器，最主要利用的是下列哪一項弱點？", "ref": "考科二 1-3", "src": "能力指標 3（物聯網資安與隱私權）", "ans": 0, "stemH": "Mirai 殭屍網路能大量入侵網路攝影機與路由器，最主要利用的是下列哪一項弱點？", "optsH": ["裝置使用出廠預設或容易猜測的帳號密碼", "裝置採用 TLS 加密傳輸", "裝置啟用安全開機（Secure Boot）", "裝置放在獨立的網段中"], "expH": "<span class=\"gl\" data-g=\"290\" tabindex=\"0\" role=\"button\">Mirai<\/span> 以一份常見預設帳密清單掃描網路上的裝置並登入植入惡意程式，再用這些裝置發動 <span class=\"gl\" data-g=\"289\" tabindex=\"0\" role=\"button\">DDoS<\/span>。B、C、D 都是防護措施。<span class=\"gl\" data-g=\"309\" tabindex=\"0\" role=\"button\">OWASP IoT Top 10<\/span>（2018）第一名即「弱密碼、可猜測或寫死的密碼」。"}, {"id": "d9q2", "n": 2, "opts": ["改用 QoS 2", "縮短心跳（Keep Alive）時間", "把 Topic 名稱取得很長，讓人猜不到", "使用 MQTT over TLS（常用埠 8883），並以帳密或憑證驗證用戶端"], "exp": "QoS 只管送達保證，與加密無關；Topic 複雜度不是安全機制（隱匿不等於安全）；Keep Alive 用來偵測連線。保護機密性與完整性需用 TLS 加密，並搭配身分驗證。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某裝置要透過 MQTT 把資料傳到雲端，並防止傳輸過程被竊聽與竄改，最合適的做法是？", "ref": "考科二 1-3", "src": "能力指標 3（物聯網資安與隱私權）", "ans": 3, "stemH": "某裝置要透過 MQTT 把資料傳到雲端，並防止傳輸過程被竊聽與竄改，最合適的做法是？", "optsH": ["改用 QoS 2", "縮短心跳（Keep Alive）時間", "把 Topic 名稱取得很長，讓人猜不到", "使用 MQTT over TLS（常用埠 8883），並以帳密或憑證驗證用戶端"], "expH": "<span class=\"gl\" data-g=\"178\" tabindex=\"0\" role=\"button\">QoS<\/span> 只管送達保證，與加密無關；<span class=\"gl\" data-g=\"177\" tabindex=\"0\" role=\"button\">Topic<\/span> 複雜度不是安全機制（隱匿不等於安全）；<span class=\"gl\" data-g=\"179\" tabindex=\"0\" role=\"button\">Keep Alive<\/span> 用來偵測連線。保護<span class=\"gl\" data-g=\"267\" tabindex=\"0\" role=\"button\">機密性<\/span>與完整 能被重放；加入<span class=\"gl\" data-g=\"266\" tabindex=\"0\" role=\"button\">時間戳<\/span>、<span class=\"gl\" data-g=\"311\" tabindex=\"0\" role=\"button\">nonce<\/span> 或遞增序號（如滾動碼）可讓舊訊息失效。"}, {"id": "d9q5", "n": 5, "opts": ["把所有原始影像永久上傳雲端備用", "在邊緣端完成計數，只上傳各區人數統計，不保存可識別人臉的影像", "將影像公開於網站，方便顧客查詢人潮", "為了分析需要，同時蒐集顧客手機號碼"], "exp": "資料最小化：只蒐集達成目的所需的資料。人流統計只需要人數，在邊緣端處理後上傳統計值，可大幅降低個資外洩風險。A、C、D 都蒐集或揭露了超出目的的個資。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某商場以攝影機統計各區人流，下列哪一種做法最符合「資料最小化」與隱私設計（Privacy by Design）原則？", "ref": "考科二 1-3", "src": "能力指標 3（物聯網資安與隱私權）", "ans": 1, "stemH": "某商場以攝影機統計各區人流，下列哪一種做法最符合「資料最小化」與隱私設計（Privacy by Design）原則？", "optsH": ["把所有原始影像永久上傳雲端備用", "在邊緣端完成計數，只上傳各區人數統計，不保存可識別人臉的影像", "將影像公開於網站，方便顧客查詢人潮", "為了分析需要，同時蒐集顧客手機號碼"], "expH": "<span class=\"gl\" data-g=\"306\" tabindex=\"0\" role=\"button\">資料最小化<\/span>：只蒐集達成目的所需的資料。人流統計只需要人數，在<span class=\"gl\" data-g=\"44\" tabindex=\"0\" role=\"button\">邊緣端<\/span>處理後上傳統計值，可大幅降低個資外洩風險。A、C、D 都蒐集或揭露了超出目的的個資。"}, {"id": "d9q6", "n": 6, "opts": ["雜湊函數可用來檢查資料是否被竄改，但無法用來還原原始資料", "數位簽章是用簽署者的私鑰簽署、以其公鑰驗證", "將 IoT 裝置與辦公電腦放在同一個網段，可以提升整體安全性", "量產時應關閉 UART、JTAG 等除錯介面"], "exp": "IoT 裝置應與辦公網路**分段**（VLAN、防火牆），避免單一裝置被入侵後橫向擴散。A、B、D 皆正確。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "關於物聯網資安的敘述，下列何者「不」正確？", "ref": "考科二 1-3", "src": "能力指標 3（物聯網資安與隱私權）", "ans": 2, "stemH": "關於物聯網資安的敘述，下列何者「不」正確？", "optsH": ["雜湊函數可用來檢查資料是否被竄改，但無法用來還原原始資料", "數位簽章是用簽署者的私鑰簽署、以其公鑰驗證", "將 IoT 裝置與辦公電腦放在同一個網段，可以提升整體安全性", "量產時應關閉 UART、JTAG 等除錯介面"], "expH": "<span class=\"gl\" data-g=\"92\" tabindex=\"0\" role=\"button\">IoT<\/span> 裝置應與辦公網路<b>分段<\/b>（<span class=\"gl\" data-g=\"122\" tabindex=\"0\" role=\"button\">VLAN<\/span>、<span class=\"gl\" data-g=\"294\" tabindex=\"0\" role=\"button\">防火牆<\/span>），避免單一裝置被入侵後橫向擴散。A、B、D 皆正確。"}, {"id": "d9q7", "n": 7, "opts": ["輸入腳浮接（Floating）；加上拉或下拉電阻（或啟用內建上拉）", "ADC 解析度不足；改用 12 位元 ADC", "鮑率設定錯誤；改成 115200", "PWM 頻率太低；提高 PWM 頻率"], "exp": "輸入腳沒有連到確定的電位時會受雜訊影響而亂跳，需加上拉電阻（平時 HIGH）或下拉電阻（平時 LOW），Arduino 可用 `INPUT_PULLUP` 啟用內建上拉。按鍵另有機械彈跳問題，需去彈跳處理。
