<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">

<title>iPAS AIoT 應用工程師（初級）13 天讀書包</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#1f2933;--muted:#616e7c;--line:#e4e7eb;--pri:#2563eb;--pri2:#dbeafe;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef9c3;--s1:#7c3aed;--s2:#0d9488}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
a{color:var(--pri)}
nav{position:sticky;top:0;z-index:20;background:#111827;color:#fff;display:flex;gap:2px;overflow-x:auto;padding:0 6px;white-space:nowrap}
nav a{color:#d1d5db;text-decoration:none;padding:11px 12px;font-size:15px;border-bottom:3px solid transparent}
nav a.on{color:#fff;border-bottom-color:#60a5fa}
main{max-width:880px;margin:0 auto;padding:14px 12px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
h1{font-size:22px;margin:6px 0 4px;line-height:1.4}
h2{font-size:19px;line-height:1.45}
h3{font-size:17px}
.muted{color:var(--muted);font-size:14px}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.bar{height:12px;background:#e5e7eb;border-radius:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#22c55e)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.day{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;position:relative}
.day.today{outline:3px solid #93c5fd}
.day.done{background:#f0fdf4;border-color:#86efac}
.day b{display:block;font-size:15px}
.day .t{font-size:13.5px;line-height:1.45;margin-top:2px}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:0 6px;margin-right:4px;line-height:20px}
.tag.s1{background:#ede9fe;color:var(--s1)}.tag.s2{background:#ccfbf1;color:var(--s2)}.tag.s3{background:#fef3c7;color:#92400e}.tag.mk{background:#fee2e2;color:var(--bad)}
.ref{display:inline-block;font-size:12.5px;font-weight:600;background:var(--pri2);color:#1e40af;border-radius:6px;padding:0 7px;margin:0 3px;line-height:21px;vertical-align:middle;white-space:nowrap}
.pg{display:inline-block;font-size:12px;color:#475569;background:#f1f5f9;border-radius:6px;padding:0 6px;line-height:20px;vertical-align:middle;white-space:nowrap}
.supp{display:inline-block;font-size:12px;color:#92400e;background:#fef3c7;border-radius:6px;padding:0 6px;line-height:20px;vertical-align:middle}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.lec h2{border-left:5px solid var(--pri);padding-left:10px;margin-top:28px}
.lec h3{margin-top:22px}
.lec blockquote{margin:12px 0;padding:10px 14px;background:#f8fafc;border-left:4px solid #94a3b8;border-radius:6px}
.lec blockquote p{margin:4px 0}
.tw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.55}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f1f5f9}
pre{background:#0f172a;color:#e2e8f0;padding:10px;border-radius:8px;overflow-x:auto;font-size:13.5px;line-height:1.5}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;background:#eef2f7;padding:0 4px;border-radius:4px}
pre code{background:none;padding:0}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.q .hd{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:6px}
.q .n{font-weight:800;margin-right:4px}
.q .stem{font-weight:500}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:15.5px;line-height:1.55;cursor:pointer;color:inherit}
.opt:hover{border-color:#93c5fd}
.opt.sel{border-color:var(--pri);background:var(--pri2)}
.opt.right{border-color:#22c55e;background:var(--okbg)}
.opt.wrong{border-color:#ef4444;background:var(--badbg)}
.opt[disabled]{cursor:default}
.fb{margin-top:8px;padding:10px 12px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}
.fb .o{display:block;font-size:12.5px;color:var(--muted);margin-top:6px}
.btn{display:inline-block;padding:9px 16px;border-radius:10px;border:1px solid var(--pri);background:var(--pri);color:#fff;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:#fff;color:var(--pri)}
.btn.red{background:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:14px}
.done-box{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;padding:14px;border-radius:12px;background:#fff;border:2px dashed #86efac;cursor:pointer}
.done-box input{width:24px;height:24px}
.timer{position:sticky;top:46px;z-index:10;background:#111827;color:#fff;border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.timer .tm{font-size:20px;font-variant-numeric:tabular-nums}
.timer.low .tm{color:#fca5a5}
.score{font-size:34px;font-weight:800}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.no{background:var(--badbg);color:var(--bad)}.pill.na{background:#f1f5f9;color:var(--muted)}
.acc{display:inline-block;min-width:64px}
select,input[type=file]{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.warnbox{background:var(--warnbg);border:1px solid #fde68a;border-radius:10px;padding:10px 12px;font-size:15px}
@media (max-width:520px){body{font-size:15.5px}.big{font-size:32px}main{padding:10px 8px 70px}.card{padding:13px}th,td{padding:5px 6px;font-size:13.5px}}
.aud{background:#eef6ff;border:1px solid #bfdbfe}.aud audio{width:100%;margin-top:6px}.aud .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:14px}.aud select{padding:3px 6px;font-size:14px}
.alist .it{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #e5e7eb}.alist .it:last-child{border-bottom:0}
</style>

<script>
const DATA = {"examDate": "2026-10-31", "official": [{"code": "考科一 1.1", "subject": "考科一", "topic": "1. AI 基礎知識與應用", "name": "AI 基礎概念", "guide": "指引 3-1～3-17", "days": [1, 6, 13], "qn": 16}, {"code": "考科一 1.2", "subject": "考科一", "topic": "1. AI 基礎知識與應用", "name": "AIoT 應用案例", "guide": "指引 3-18～3-26", "days": [1, 6, 13], "qn": 8}, {"code": "考科一 2.1", "subject": "考科一", "topic": "2. AIoT 基礎與架構", "name": "物聯網架構與功能", "guide": "指引 4-1～4-25", "days": [2, 6, 13], "qn": 16}, {"code": "考科一 2.2", "subject": "考科一", "topic": "2. AIoT 基礎與架構", "name": "常見通訊協定與網路層技術", "guide": "指引 4-26～4-46", "days": [2, 3, 6, 13], "qn": 19}, {"code": "考科一 2.3", "subject": "考科一", "topic": "2. AIoT 基礎與架構", "name": "工業通訊標準與資訊模型", "guide": "指引 4-47～4-72", "days": [3, 6, 7, 13], "qn": 22}, {"code": "考科一 2.4", "subject": "考科一", "topic": "2. AIoT 基礎與架構", "name": "中介軟體與平台", "guide": "指引 4-73～4-84", "days": [4, 7, 13], "qn": 17}, {"code": "考科一 2.5", "subject": "考科一", "topic": "2. AIoT 基礎與架構", "name": "資安與隱私基本概念", "guide": "指引 4-85～4-94", "days": [4, 7, 13], "qn": 16}, {"code": "考科一 3.1", "subject": "考科一", "topic": "3. 感測器原理與應用", "name": "感測技術基礎", "guide": "指引 5-1～5-14", "days": [5, 7, 13], "qn": 19}, {"code": "考科一 3.2", "subject": "考科一", "topic": "3. 感測器原理與應用", "name": "感測訊號與通訊基礎", "guide": "指引 5-15～5-27", "days": [5, 7, 13], "qn": 13}, {"code": "考科二 1-1", "subject": "考科二", "topic": "1. 軟硬體整合規劃", "name": "系統元件與架構", "guide": "無官方指引（依簡章能力指標 3）", "days": [8, 12, 13], "qn": 14}, {"code": "考科二 1-2", "subject": "考科二", "topic": "1. 軟硬體整合規劃", "name": "簡易系統故障問題判斷與排除", "guide": "無官方指引（依簡章能力指標 3）", "days": [8, 12, 13], "qn": 14}, {"code": "考科二 1-3", "subject": "考科二", "topic": "1. 軟硬體整合規劃", "name": "物聯網資訊安全", "guide": "無官方指引（依簡章能力指標 3）", "days": [9, 12, 13], "qn": 13}, {"code": "考科二 2-1", "subject": "考科二", "topic": "2. 軟硬體設計", "name": "物聯網硬體設計基礎", "guide": "無官方指引（依簡章能力指標 2）", "days": [9, 12, 13], "qn": 13}, {"code": "考科二 2-2", "subject": "考科二", "topic": "2. 軟硬體設計", "name": "雲端環境數據收集與平台設計", "guide": "無官方指引（依簡章能力指標 1）", "days": [9, 10, 12, 13], "qn": 22}, {"code": "考科二 2-3", "subject": "考科二", "topic": "2. 軟硬體設計", "name": "智慧製造流程優化與成本控制", "guide": "無官方指引（依簡章評鑑內容）", "days": [11, 12, 13], "qn": 19}], "days": [{"id": 1, "date": "2026-10-18", "subject": "考科一", "type": "study", "title": "AI 基礎概念與 AIoT 應用案例", "short": "AI 基礎＋應用案例", "lectureChars": 6213, "lecture": "<h3>今天要搞懂的 5 件事<\/h3>\n<ol>\n<li>機器學習三大範式（監督式／非監督式／強化學習）各自「吃什麼資料、做什麼事」。<\/li>\n<li>分類 vs. 迴歸 vs. 分群 vs. 異常偵測，看到題目情境就能分辨。<\/li>\n<li>CNN 看「空間」、RNN/LSTM 看「時間」；模型從訓練到邊緣推論的 5 個階段。<\/li>\n<li>為什麼要 Edge AI（低延遲、省頻寬、隱私），GPU／NPU／FPGA 怎麼選。<\/li>\n<li>AIoT 應用案例：預測性維護、感測融合、「四位一體循環」與四大場域。<\/li>\n<\/ol>\n<h2>1. AI 在 AIoT 裡扮演什麼角色 <span class=\"ref\">考科一 1.1<\/span><span class=\"pg\">指引 p.3-1<\/span><\/h2>\n<p>一句話記住：<strong>感測器給設備「感覺」，通訊與平台負責「傳遞與管理」，AI 給設備「分析與判斷能力」。<\/strong>\nAI 不只在雲端跑，正逐步延伸到邊緣裝置（Edge Device）與微控制器（MCU），在資源受限的地方做即時決策。<\/p>\n<p>AIoT 的資料有幾個「難搞」的特性，題目常拿來當背景：\n- <strong>高頻率、時間序列（Time-series）<\/strong>：例如馬達每秒上千筆震動值。\n- <strong>高雜訊、資料缺失（Missing Data）<\/strong>：感測器斷線、受干擾。\n- <strong>類別不平衡（Imbalanced Data）<\/strong>：正常資料一大堆，故障資料很少。<\/p>\n<blockquote>\n<p><strong>💡 例子<\/strong>：工廠一年只壞 3 次，若要做「故障分類」很難湊到足夠的故障樣本 → 所以實務上常改用「異常偵測」（只用正常資料建模）。<\/p>\n<\/blockquote>\n<h2>2. 機器學習三大範式 <span class=\"ref\">考科一 1.1<\/span><span class=\"pg\">指引 p.3-2～3-3<\/span><\/h2>\n<p>機器學習（ML）就是「用資料建立輸入與輸出的關聯模型」，讓系統能對新資料做分類、預測或異常判斷。<\/p>\n<table>\n<thead>\n<tr>\n<th>範式<\/th>\n<th>訓練資料<\/th>\n<th>常見任務<\/th>\n<th>AIoT 例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>監督式學習 Supervised<\/td>\n<td>有<strong>特徵（Feature）＋標籤（Label）<\/strong><\/td>\n<td>分類（離散類別）、迴歸（連續數值）<\/td>\n<td>依震動判斷「正常/異常」；預測剩餘壽命 RUL、能耗、溫度趨勢<\/td>\n<\/tr>\n<tr>\n<td>非監督式學習 Unsupervised<\/td>\n<td><strong>沒有標籤<\/strong><\/td>\n<td>分群（Clustering）、異常偵測（Anomaly Detection）<\/td>\n<td>將相似運轉狀態自動歸類；用正常資料畫邊界抓異常<\/td>\n<\/tr>\n<tr>\n<td>強化學習 Reinforcement（RL）<\/td>\n<td>代理人（Agent）與環境互動，得到<strong>獎勵（Reward）／懲罰<\/strong><\/td>\n<td>動態控制、參數最佳化<\/td>\n<td>HVAC 空調在舒適與安全條件下節能控制<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>重點補充（指引原意）：\n- 監督式學習的成效<strong>高度仰賴標註資料的品質與一致性<\/strong>；標註延遲或標準不一，會讓模型學偏。\n- 非監督式方法實務上要搭配<strong>門檻設定與告警管理<\/strong>，避免誤報太多。\n- 強化學習是「試探式決策」，必須<strong>先界定安全邊界與測試方式<\/strong>。<\/p>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：\n- <strong>迴歸是監督式<\/strong>，輸出「連續數值」（溫度、壽命）；<strong>分類<\/strong>輸出「離散類別」（正常/異常、故障 A/B/C）。\n- <strong>分群（非監督）≠ 分類（監督）<\/strong>：分群沒有標準答案，只是把相似的放一起。\n- AOI 影像瑕疵檢測通常是<strong>監督式＋CNN<\/strong>，不是強化學習。<\/p>\n<\/blockquote>\n<h2>3. 深度學習：CNN 與 RNN/LSTM <span class=\"ref\">考科一 1.1<\/span><span class=\"pg\">指引 p.3-3～3-4<\/span><\/h2>\n<p>深度學習（DL）是機器學習的<strong>子領域<\/strong>，核心是類神經網路（ANN）。最大優勢：<strong>能自動從原始資料萃取高階特徵<\/strong>，特別適合影像、聲音、震動等非結構化或高維度資料。<\/p>\n<table>\n<thead>\n<tr>\n<th>模型<\/th>\n<th>原理（白話）<\/th>\n<th>擅長的資料<\/th>\n<th>AIoT 應用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>CNN 卷積神經網路<\/td>\n<td>濾波器（Filter）在資料上滑動，抓「局部特徵」<\/td>\n<td><strong>空間結構<\/strong>：影像、LiDAR 點雲<\/td>\n<td>AOI 檢測瑕疵、缺件、刮傷；3D 物件偵測<\/td>\n<\/tr>\n<tr>\n<td>RNN 循環神經網路<\/td>\n<td>輸出同時受「當前輸入＋過去狀態」影響（有記憶）<\/td>\n<td><strong>時間序列<\/strong><\/td>\n<td>連續震動、電流、溫度趨勢 → 設備健康評估、負載預測<\/td>\n<\/tr>\n<tr>\n<td>LSTM 長短期記憶<\/td>\n<td>RNN 的改良，用<strong>門控結構<\/strong>改善長序列「遺忘」問題<\/td>\n<td>長時間序列<\/td>\n<td>同上，序列更長時更好<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：GAN（生成對抗網路）主要用來「生成新資料」（例如逼真影像）；隨機森林（Random Forest）是<strong>傳統機器學習<\/strong>，不是深度學習。〔出自指引練習題解析 p.3-16〕<\/p>\n<\/blockquote>\n<h2>4. 從訓練到推論：Training-to-Inference Pipeline <span class=\"ref\">考科一 1.1<\/span><span class=\"pg\">指引 p.3-4～3-5<\/span><\/h2>\n<p>模型要真正在工廠跑起來，要走完 5 個階段（順序要記）：<\/p>\n<ol>\n<li><strong>資料前處理／訊號調理（Data Preprocessing / Signal Conditioning）<\/strong>：濾波、去雜訊、異常值處理、正規化（Normalization）、取樣率對齊（Resampling/Alignment）。<\/li>\n<li><strong>模型訓練（Model Training）<\/strong>：在算力充足的地方（雲端、GPU 工作站）做；切好<strong>訓練集／驗證集／測試集<\/strong>，並處理類別不平衡。<\/li>\n<li><strong>模型壓縮（Model Compression）<\/strong>：為了放進 MCU、嵌入式處理器、邊緣閘道 → <strong>量化（Quantization）<strong>與<\/strong>剪枝（Pruning）<\/strong>。\n   - 量化 = 把參數從 <strong>FP32（32 位元浮點）轉成 INT8（8 位元整數）<\/strong>，精確度略降，但檔案與記憶體大幅變小、更省電更快。<\/li>\n<li><strong>推論與系統整合（Inference &amp; System Integration）<\/strong>：部署到邊緣裝置或閘道器，結果回饋給 <strong>HMI、MES、SCADA<\/strong>，形成告警、決策建議或維護指標。<\/li>\n<li><strong>監控與版本管理（Monitoring &amp; Versioning）<\/strong>：持續監看資料分布變化與模型效能，保留版本與推論紀錄，供追蹤與稽核。<\/li>\n<\/ol>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：「量化」是 AI 模型權重的精度降低；「ADC 類比數位轉換」是訊號處理的硬體電路，兩者不同。增加網路層數只會更重，不是輕量化。<\/p>\n<\/blockquote>\n<h2>5. 模型格式、推論引擎、生成式 AI 與 SLM <span class=\"ref\">考科一 1.1<\/span><span class=\"pg\">指引 p.3-5～3-7<\/span><\/h2>\n<ul>\n<li><strong>模型格式（Model Format）<\/strong>：模型結構與權重的表示方式，如 <strong>ONNX、TensorFlow、PyTorch<\/strong>。對 AIoT 工程師而言，重點不是訓練效率，而是能否<strong>穩定、可重複地部署<\/strong>到不同硬體、支援輕量化轉換與版本更新。<\/li>\n<li><strong>推論引擎（Inference Engine）<\/strong>：在實際硬體上執行推論的元件，把模型運算對應到處理器或加速器，確保效能與即時性。<\/li>\n<li><strong>生成式 AI（GenAI）與小型語言模型（SLM）<\/strong>：SLM 是可在邊緣執行的輕量語言模型。它在 AIoT 中<strong>不是取代既有感測與預測模型<\/strong>，而是補強「人機互動與決策支援層」，例如把推論結果轉成設備狀態摘要、告警說明、操作建議。邊緣 SLM 可做語意摘要，但<strong>不直接介入設備控制邏輯<\/strong>。<\/li>\n<\/ul>\n<h2>6. 邊緣運算與 Edge AI：為什麼不全部丟雲端 <span class=\"ref\">考科一 1.1<\/span><span class=\"pg\">指引 p.3-7～3-8<\/span><\/h2>\n<p>把所有原始資料上傳雲端，會卡在三件事：<strong>延遲（Latency）、頻寬（Bandwidth）、隱私（Privacy）<\/strong>。Edge AI 的核心精神：<strong>在資料產生端就近處理與推論，只回傳必要的特徵、事件或彙整結果<\/strong>。<\/p>\n<p>邊緣推論（Edge Inference）的三大必要性：<\/p>\n<table>\n<thead>\n<tr>\n<th>好處<\/th>\n<th>說明<\/th>\n<th>典型情境<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>低延遲<\/td>\n<td>秒級、毫秒級反應，不必等雲端回傳<\/td>\n<td>安全告警、設備保護、即時控制<\/td>\n<\/tr>\n<tr>\n<td>節省頻寬<\/td>\n<td>只送特徵、事件或結果<\/td>\n<td>影像串流、高頻震動訊號<\/td>\n<\/tr>\n<tr>\n<td>隱私保護<\/td>\n<td>敏感資料留在場域內<\/td>\n<td>攝影機只上傳骨架或特徵值<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：邊緣運算是把計算移到<strong>靠近資料源頭的網路邊緣<\/strong>，不是「移到雲端」。（指引 p.4-83 練習題解析也特別強調）<\/p>\n<\/blockquote>\n<h2>7. 邊緣 AI 硬體加速器 <span class=\"ref\">考科一 1.1<\/span><span class=\"pg\">指引 p.3-8～3-9<\/span><\/h2>\n<p>只用通用 CPU 跑 AI，常在效能、延遲或能耗上不夠，所以搭配專用加速器：<\/p>\n<table>\n<thead>\n<tr>\n<th>加速器<\/th>\n<th>特性<\/th>\n<th>優點<\/th>\n<th>限制／適用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>GPU<\/td>\n<td>大量平行運算核心<\/td>\n<td>生態成熟、開發彈性高<\/td>\n<td>功耗較高；適合工業電腦（IPC）、多路影像分析、AOI、交通監控<\/td>\n<\/tr>\n<tr>\n<td>NPU<\/td>\n<td>專為深度學習<strong>推論<\/strong>設計，常以 <strong>ASIC<\/strong> 形式實作；針對矩陣與卷積運算最佳化<\/td>\n<td>低功耗、高效能推論；執行 INT8 量化模型與 SLM 的重要基礎<\/td>\n<td>定位「推論專用（Inference-only）」，<strong>不適合訓練<\/strong>（訓練要大量浮點與反向傳播）<\/td>\n<\/tr>\n<tr>\n<td>FPGA<\/td>\n<td>可重新配置硬體邏輯<\/td>\n<td>低延遲、高度客製化<\/td>\n<td>開發門檻高；適合工業控制、安全監測等極度即時場域<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 記法<\/strong>：GPU＝「力氣大、吃電多」；NPU＝「只做推論、超省電」；FPGA＝「可改線路、門檻高」。NPU 是協同處理器，OS 與 I/O 仍由 CPU 負責；雲端訓練多用 GPU 或 TPU。〔指引 p.3-16 解析〕<\/p>\n<\/blockquote>\n<h2>8. 分佈式 AI：端雲協作與聯合學習 <span class=\"ref\">考科一 1.1<\/span><span class=\"pg\">指引 p.3-10<\/span><\/h2>\n<ul>\n<li><strong>端雲協作（Edge–Cloud Collaboration）<\/strong>：典型模式是 <strong>「訓練在雲端、推論在邊緣」<\/strong>。雲端彙整多場域歷史資料做訓練與參數更新；邊緣負責即時推論，網路不穩時也能持續運作。這是目前主流設計。<\/li>\n<li><strong>聯合學習（Federated Learning, FL；也常譯「聯邦學習」）<\/strong>：各邊緣節點用<strong>本地資料<\/strong>訓練，只把**模型更新參數（權重或梯度）**上傳雲端聚合，<strong>原始資料不離開本地<\/strong>。適合智慧製造、智慧醫療等跨組織、敏感資料場域。<\/li>\n<li>邊緣節點之間也可透過區域閘道器共享模型版本、同步異常事件；設計時要考量資料流向、模型更新頻率、通訊成本與治理需求，避免過度集中或過度分散。<\/li>\n<\/ul>\n<h2>9. AI 倫理、治理與法規 <span class=\"ref\">考科一 1.1<\/span><span class=\"pg\">指引 p.3-11～3-13<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>議題<\/th>\n<th>重點<\/th>\n<th>工程上怎麼做<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>演算法偏誤與決策風險<\/td>\n<td>訓練資料有偏差或不完整 → 系統性誤判；GenAI 的自然語言輸出易被誤認為「權威」<\/td>\n<td>AI 定位為**「輔助判斷」而非「最終決策者」**；資料要涵蓋多元運作狀態<\/td>\n<\/tr>\n<tr>\n<td>隱私保護與資料治理<\/td>\n<td>操作紀錄、互動語句可能洩漏隱私<\/td>\n<td><strong>Privacy by Design（PbD，由設計起始的隱私）<\/strong>：架構設計時就納入保護；SLM 在邊緣在地推論；管控存取權限、推論紀錄、資料生命週期<\/td>\n<\/tr>\n<tr>\n<td>可信任 AI 與可解釋性<\/td>\n<td>工控、公共安全需可預期、可解釋、穩定<\/td>\n<td><strong>XAI（可解釋 AI）<\/strong>＋清楚的人機介面；GenAI 做決策輔助，不直接控制設備<\/td>\n<\/tr>\n<tr>\n<td>AI 治理與問責<\/td>\n<td>出事時要能釐清責任<\/td>\n<td>模型版本管理、推論紀錄保存、<strong>人工介入機制<\/strong>；參考 <strong>ISO/IEC 42001<\/strong>（AI 管理系統）、<strong>歐盟 AI Act<\/strong>（依風險分級）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 例子（PbD）<\/strong>：攝影機在邊緣端就做去識別化，只送骨架或特徵值上雲 ✅；把原始畫面全部上傳「以備不時之需」❌；要求使用者簽「放棄隱私權同意書」只是法律免責，不是 by Design ❌。<\/p>\n<\/blockquote>\n<p><span class=\"ref\">考科一 1.1<\/span><span class=\"supp\">補充<\/span> 歐盟 AI Act 採風險分級：不可接受風險（禁止）、高風險（嚴格義務）、有限風險（透明義務）、最低風險。考試若出現，記住「<strong>依風險等級給不同要求<\/strong>」這個核心即可。<\/p>\n<h2>10. AIoT 三大智慧化應用模式 <span class=\"ref\">考科一 1.2<\/span><span class=\"pg\">指引 p.3-18～3-19<\/span><\/h2>\n<h3>(1) 預測性維護（Predictive Maintenance, PdM）<\/h3>\n<ul>\n<li>定義：以**設備實際運轉狀態（Condition-based）**為基礎的主動式維護，用即時感測＋歷史資料，以 AI 預測潛在故障。<\/li>\n<li>資料來源：工具機控制器或外掛感測器（<strong>震動、電流、溫度<\/strong>），常結合智慧機聯網架構。<\/li>\n<li>AI 兩個角色（必考）：<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>任務<\/th>\n<th>問的問題<\/th>\n<th>ML 任務類型<\/th>\n<th>輸出<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>故障診斷 Diagnosis<\/td>\n<td>「現在正常嗎？是哪種故障？」<\/td>\n<td><strong>分類<\/strong><\/td>\n<td>類別<\/td>\n<\/tr>\n<tr>\n<td>健康預測 Prognosis<\/td>\n<td>「還能撐多久？」<\/td>\n<td><strong>迴歸<\/strong><\/td>\n<td>剩餘有效壽命 <strong>RUL<\/strong>（連續數值）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><span class=\"ref\">考科一 1.2<\/span><span class=\"supp\">補充<\/span> 三種維護策略對照：<strong>事後維修<\/strong>（壞了才修，停機損失大）→ <strong>預防保養<\/strong>（固定週期換，可能過度維護）→ <strong>預測性維護<\/strong>（依狀態在對的時間修）。指引 p.4-17 也提到傳統定期保養「往往造成過度維護或無預警停機」。<\/p>\n<h3>(2) 感測融合（Sensor Fusion）<\/h3>\n<ul>\n<li>用 AI 整合<strong>多個不同類型<\/strong>感測器的資訊，提升判斷準確度與穩定性（<strong>強健性 Robustness<\/strong>）。<\/li>\n<li>例：震動＋溫度一起看，區分「設備真的異常」還是「環境干擾」；影像＋光達，暗處也看得清。<\/li>\n<li>感測融合通常<strong>需要更多感測器<\/strong>（成本可能增加，換取可靠度），也常在邊緣端（如車載電腦）即時執行。<\/li>\n<\/ul>\n<h2>11. 四位一體循環（AIoT Integrated Cycle） <span class=\"ref\">考科一 1.2<\/span><span class=\"pg\">指引 p.3-19～3-20<\/span><\/h2>\n<p>分析任何 AIoT 案例的通用框架，資料從物理世界走到數位決策：<\/p>\n<table>\n<thead>\n<tr>\n<th>構面<\/th>\n<th>關注什麼<\/th>\n<th>例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>感知端 Input<\/td>\n<td>感測什麼（溫度、影像、震動）、取樣頻率與解析度夠不夠<\/td>\n<td>主軸震動、加工電流<\/td>\n<\/tr>\n<tr>\n<td>通訊端 Transport<\/td>\n<td>距離、功耗、即時性<\/td>\n<td>長距離低功耗 → LoRa；短距離或高即時 → Bluetooth、Wi-Fi<\/td>\n<\/tr>\n<tr>\n<td>智慧端 AI/Process<\/td>\n<td>AI 做<strong>即時判斷（Judgment）<strong>還是<\/strong>趨勢預測（Prediction）<\/strong><\/td>\n<td>換刀預警、趨勢分析<\/td>\n<\/tr>\n<tr>\n<td>安全端 Security<\/td>\n<td>終端實體安全、通訊攔截、敏感資訊外洩<\/td>\n<td>指的是<strong>資訊安全<\/strong>，不是工廠保全<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：感知端（感測器）通常<strong>沒有能力做模型訓練<\/strong>；訓練多在雲端。<\/p>\n<\/blockquote>\n<h2>12. 四大場域案例 <span class=\"ref\">考科一 1.2<\/span><span class=\"pg\">指引 p.3-20～3-22<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>場域<\/th>\n<th>目標<\/th>\n<th>感測<\/th>\n<th>通訊／標準<\/th>\n<th>AI 應用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>智慧製造<\/td>\n<td>工具機即時監控、提升品質降損耗<\/td>\n<td>震動（主軸）、電流（負載與能耗）<\/td>\n<td>閘道器把異質設備資料轉成 <strong>OPC UA<\/strong> 統一格式，AI 再讀取<\/td>\n<td>刀具震動特徵異常 → <strong>提前換刀預警<\/strong><\/td>\n<\/tr>\n<tr>\n<td>智慧農業<\/td>\n<td>大面積溫室／農場環境監測調控<\/td>\n<td>溫濕度、土壤水分<\/td>\n<td><strong>LPWAN（如 LoRa）<\/strong>：數公里、電池供電<\/td>\n<td>依歷史資料自動調整噴灌、啟動通風<\/td>\n<\/tr>\n<tr>\n<td>智慧交通與物流<\/td>\n<td>共享運具調度、倉儲自動盤點<\/td>\n<td><strong>GPS<\/strong> 定位、<strong>RFID<\/strong> 貨物識別<\/td>\n<td><strong>4G/5G<\/strong> 行動通訊即時回傳<\/td>\n<td>配送路徑最佳化、共享運具需求預測<\/td>\n<\/tr>\n<tr>\n<td>智慧居家<\/td>\n<td>智慧門鎖、室內環境自動調節<\/td>\n<td>環境光感測器、<strong>PIR<\/strong> 被動紅外線<\/td>\n<td><strong>NFC<\/strong> 近距離解鎖、短距離低功耗無線<\/td>\n<td>學習作息偏好，自動調燈光與空調<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 重要觀念<\/strong>：AI 模型通常<strong>不直接讀 PLC 或感測器原始訊號<\/strong>，而是經閘道器轉成 OPC UA 等標準格式後再讀取（指引 p.3-20～3-21）。HTTP 雖通用，但不是工業底層設備資料交換的首選；USB 只是實體介面，解決不了不同廠牌暫存器定義不一致的問題。<\/p>\n<\/blockquote>\n<h3>今日 30 秒回顧<\/h3>\n<p>監督（有標籤：分類/迴歸）、非監督（無標籤：分群/異常）、強化（獎勵：控制）｜CNN 空間、RNN/LSTM 時間｜前處理→訓練→壓縮（FP32→INT8）→推論整合→監控版本｜Edge AI＝低延遲＋省頻寬＋隱私｜NPU 推論專用｜訓練在雲、推論在邊；FL 只傳參數｜PbD、XAI、AI 輔助不做最終決策｜Diagnosis 分類、Prognosis 迴歸（RUL）｜四位一體：感知、通訊、智慧、安全。<\/p>", "audio": {"src": "audio/d01.mp3", "dur": 921}, "questions": [{"id": " , "exp": "CNN 用濾波器擷取局部（空間）特徵，適合影像與點雲；RNN/LSTM 有記憶機制，適合時間序列。GAN 用於生成資料。B 的說法過於絕對（1D-CNN 也可處理時序，但 RNN/LSTM 更具代表性）。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "下列「資料型態－深度學習模型」的配對，何者最恰當？", "ref": "考科一 1.1", "src": "指引 p.3-3～3-4", "ans": 2, "stemH": "下列「資料型態－深度學習模型」的配對，何者最恰當？", "optsH": ["AOI 工件刮傷影像－RNN", "馬達連續電流趨勢－CNN 以外別無選擇", "產線瑕疵影像－CNN；設備震動時間序列－LSTM", "LiDAR 點雲－GAN"], "expH": "CNN 用濾波器擷取局部（空間）特徵，適合影像與點雲；RNN/LSTM 有記憶機制，適合時間序列。GAN 用於生成資料。B 的說法過於絕對（1D-CNN 也可處理時序，但 RNN/LSTM 更具代表性）。"}, {"id": "d1q5", "n": 5, "opts": ["資料前處理 → 模型訓練 → 模型壓縮 → 推論與系統整合 → 監控與版本管理", "模型訓練 → 資料前處理 → 推論與整合 → 模型壓縮 → 監控與版本管理", "模型壓縮 → 資料前處理 → 模型訓練 → 監控與版本管理 → 推論與整合", "資料前處理 → 推論與系統整合 → 模型訓練 → 模型壓縮 → 監控與版本管理"], "exp": "指引圖 3-1-1 的流程：資料前處理/訊號調理 → 模型訓練 → 模型壓縮（量化、剪枝）→ 推論與系統整合（回饋 HMI/MES/SCADA）→ 監控與版本管理。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "在 AIoT 的 Training-to-Inference Pipeline 中，下列哪一個順序最正確？", "ref": "考科一 1.1", "src": "指引 p.3-4", "ans": 0, "stemH": "在 AIoT 的 Training-to-Inference Pipeline 中，下列哪一個順序最正確？", "optsH": ["資料前處理 → 模型訓練 → 模型壓縮 → 推論與系統整合 → 監控與版本管理", "模型訓練 → 資料前處理 → 推論與整合 → 模型壓縮 → 監控與版本管理", "模型壓縮 → 資料前處理 → 模型訓練 → 監控與版本管理 → 推論與整合", "資料前處理 → 推論與系統整合 → 模型訓練 → 模型壓縮 → 監控與版本管理"], "expH": "指引圖 3-1-1 的流程：資料前處理/訊號調理 → 模型訓練 → 模型壓縮（量化、剪枝）→ 推論與系統整合（回饋 HMI/MES/SCADA）→ 監控與版本管理。"}, {"id": "d1q6", "n": 6, "opts": ["兩者都是為了讓模型更大、更準確", "量化是指感測器的 ADC 取樣位元數", "量化是把 INT8 轉成 FP32 以提升精度", "兩者屬於模型壓縮，目的是讓模型能部署在 MCU、嵌入式處理器或邊緣閘道"], "exp": "剪枝與量化都屬「模型壓縮（Model Compression）」的輕量化處理。量化方向是 FP32 → INT8（精度略降、體積與記憶體大幅減少）。ADC 是訊號轉換電路，不是模型量化。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "關於「剪枝（Pruning）」與「量化（Quantization）」，下列敘述何者正確？", "ref": "考科一 1.1", "src": "指引 p.3-4～3-5", "ans": 3, "stemH": "關於「剪枝（Pruning）」與「量化（Quantization）」，下列敘述何者正確？", "optsH": ["兩者都是為了讓模型更大、更準確", "量化是指感測器的 ADC 取樣位元數", "量化是把 INT8 轉成 FP32 以提升精度", "兩者屬於模型壓縮，目的是讓模型能部署在 MCU、嵌入式處理器或邊緣閘道"], "expH": "剪枝與量化都屬「模型壓縮（Model Compression）」的輕量化處理。量化方向是 FP32 → INT8（精度略降、體積與記憶體大幅減少）。ADC 是訊號轉換電路，不是模型量化。"}, {"id": "d1q7", "n": 7, "opts": ["低延遲，可支援毫秒級的安全告警", "節省頻寬，只回傳特徵或事件", "隱私保護，敏感資料留在場域內", "可以在邊緣端集中彙整所有場域的歷史資料進行大規模模型訓練"], "exp": "邊緣推論三大必要性：低延遲、節省頻寬、隱私保護。彙整多場域歷史資料做大規模訓練是「雲端」的角色（端雲協作：訓練在雲端、推論在邊緣）。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "下列哪一項「不是」指引所列導入邊緣推論（Edge Inference）的主要必要性？", "ref": "考科一 1.1", "src": "指引 p.3-7", "ans": 3, "stemH": "下列哪一項「不是」指引所列導入邊緣推論（Edge Inference）的主要必要性？", "optsH": ["低延遲，可支援毫秒級的安全告警", "節省頻寬，只回傳特徵或事件", "隱私保護，敏感資料留在場域內", "可以在邊緣端集中彙整所有場域的歷史資料進行大規模模型訓練"], "expH": "邊緣推論三大必要性：低延遲、節省頻寬、隱私保護。彙整多場域歷史資料做大規模訓練是「雲端」的角色（端雲協作：訓練在雲端、推論在邊緣）。"}, {"id": "d1q8", "n": 8, "opts": ["高階獨立 GPU", "NPU（神經網路處理器）", "只用通用 CPU 執行浮點運算", "FPGA，因為它的開發門檻在三者中最低"], "exp": "NPU 為推論專用、針對矩陣與卷積運算最佳化，能在低功耗下高效執行 INT8 量化模型，是 AIoT 邊緣裝置主流配置。GPU 功耗高，適合 IPC 等散熱良好的節點；FPGA 雖低延遲、可客製，但開發門檻「較高」，D 敘述錯誤。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某智慧門鈴以電池供電，需在本地執行 INT8 量化後的人臉偵測模型，且要求功耗極低。最適合的硬體加速方案是？", "ref": "考科一 1.1", "src": "指引 p.3-9", "ans": 1, "stemH": "某智慧門鈴以電池供電，需在本地執行 INT8 量化後的人臉偵測模型，且要求功耗極低。最適合的硬體加速方案是？", "optsH": ["高階獨立 GPU", "NPU（神經網路處理器）", "只用通用 CPU 執行浮點運算", "FPGA，因為它的開發門檻在三者中最低"], "expH": "NPU 為推論專用、針對矩陣與卷積運算最佳化，能在低功耗下高效執行 INT8 量化模型，是 AIoT 邊緣裝置主流配置。GPU 功耗高，適合 IPC 等散熱良好的節點；FPGA 雖低延遲、可客製，但開發門檻「較高」，D 敘述錯誤。"}, {"id": "d1q9", "n": 9, "opts": ["聯合學習（Federated Learning）：各院用本地資料訓練，只上傳模型更新參數聚合", "把所有醫院的原始影像集中上傳到同一雲端資料庫再訓練", "只在一家醫院訓練，其他醫院直接沿用，不做任何更新", "改用強化學習，就不需要任何資料"], "exp": "聯合學習讓原始資料不離開本地，只上傳權重或梯度等模型更新參數到雲端聚合，降低外洩與合規風險，適合跨組織、敏感資料場域。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "多家醫院想共同訓練一個 AI 模型，但病歷影像依法不能離開各院。下列哪一種架構最符合需求？", "ref": "考科一 1.1", "src": "指引 p.3-10", "ans": 0, "stemH": "多家醫院想共同訓練一個 AI 模型，但病歷影像依法不能離開各院。下列哪一種架構最符合需求？", "optsH": ["聯合學習（Federated Learning）：各院用本地資料訓練，只上傳模型更新參數聚合", "把所有醫院的原始影像集中上傳到同一雲端資料庫再訓練", "只在一家醫院訓練，其他醫院直接沿用，不做任何更新", "改用強化學習，就不需要任何資料"], "expH": "聯合學習讓原始資料不離開本地，只上傳權重或梯度等模型更新參數到雲端聚合，降低外洩與合規風險，適合跨組織、敏感資料場域。"}, {"id": "d1q10", "n": 10, "opts": ["讓 SLM 直接接管 PLC 控制邏輯，以加快反應速度", "因為模型很聰明，不需要可解釋性設計", "將 AI 定位為「輔助判斷」，保留人工介入機制、模型版本管理與推論紀錄", "為了效率，不必評估是否屬於高風險應用"], "exp": "指引強調 AI 是「輔助判斷而非最終決策者」，生成式模型多作決策輔助、不直接控制設備；治理面要有模型版本管理、推論紀錄保存與人工介入，並參考 ISO/IEC 42001、歐盟 AI Act 依風險等級評估。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "在工廠導入生成式 AI（GenAI／SLM）提供設備操作建議時，下列做法何者最符合指引所述的治理原則？", "ref": "考科一 1.1", "src": "指引 p.3-11～3-13", "ans": 2, "stemH": "在工廠導入生成式 AI（GenAI／SLM）提供設備操作建議時，下列做法何者最符合指引所述的治理原則？", "optsH": ["讓 SLM 直接接管 PLC 控制邏輯，以加快反應速度", "因為模型很聰明，不需要可解釋性設計", "將 AI 定位為「輔助判斷」，保留人工介入機制、模型版本管理與推論紀錄", "為了效率，不必評估是否屬於高風險應用"], "expH": "指引強調 AI 是「輔助判斷而非最終決策者」，生成式模型多作決策輔助、不直接控制設備；治理面要有模型版本管理、推論紀錄保存與人工介入，並參考 ISO/IEC 42001、歐盟 AI Act 依風險等級評估。"}, {"id": "d1q11", "n": 11, "opts": ["故障診斷（Diagnosis），屬於分類", "事後維修（Breakdown Maintenance）", "感測融合（Sensor Fusion），屬於分群", "健康預測（Prognosis），屬於迴歸，推估剩餘有效壽命（RUL）"], "exp": "「還能撐多久」是推估 RUL，輸出連續數值 → Prognosis、迴歸任務。Diagnosis 判斷目前是否異常或哪種故障，屬分類。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某工廠在主軸上加裝震動感測器，AI 系統輸出「主軸軸承預估還能運轉 320 小時」。這個輸出屬於預測性維護中的哪一項？", "ref": "考科一 1.2", "src": "指引 p.3-18～3-19", "ans": 3, "stemH": "某工廠在主軸上加裝震動感測器，AI 系統輸出「主軸軸承預估還能運轉 320 小時」。這個輸出屬於預測性維護中的哪一項？", "optsH": ["故障診斷（Diagnosis），屬於分類", "事後維修（Breakdown Maintenance）", "感測融合（Sensor Fusion），屬於分群", "健康預測（Prognosis），屬於迴歸，推估剩餘有效壽命（RUL）"], "expH": "「還能撐多久」是推估 RUL，輸出連續數值 → Prognosis、迴歸任務。Diagnosis 判斷目前是否異常或哪種故障，屬分類。"}, {"id": "d1q12", "n": 12, "opts": ["感知端：使用 LoRa 傳輸數公里", "通訊端：佈署溫濕度與土壤水分感測器", "智慧端：依歷史環境資料預測並自動調整噴灌與通風", "安全端：指的是在溫室門口裝設實體門鎖，與資訊系統無關"], "exp": "感知端＝感測項目（溫濕度、土壤水分）；通訊端＝傳輸技術（LoRa/LPWAN）；智慧端＝AI 做判斷或預測（自動環控）；安全端＝資訊安全與隱私風險（終端實體安全、資料攔截、外洩）。A、B 對調了，D 理解錯誤。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "依據「四位一體循環（AIoT Integrated Cycle）」分析智慧農業溫室案例，下列對應何者正確？", "ref": "考科一 1.2", "src": "指引 p.3-19～3-21", "ans": 2, "stemH": "依據「四位一體循環（AIoT Integrated Cycle）」分析智慧農業溫室案例，下列對應何者正確？", "optsH": ["感知端：使用 LoRa 傳輸數公里", "通訊端：佈署溫濕度與土壤水分感測器", "智慧端：依歷史環境資料預測並自動調整噴灌與通風", "安全端：指的是在溫室門口裝設實體門鎖，與資訊系統無關"], "expH": "感知端＝感測項目（溫濕度、土壤水分）；通訊端＝傳輸技術（LoRa/LPWAN）；智慧端＝AI 做判斷或預測（自動環控）；安全端＝資訊安全與隱私風險（終端實體安全、資料攔截、外洩）。A、B 對調了，D 理解錯誤。"}]}, {"id": 2, "date": "2026-10-19", "subject": "考科一", "type": "study", "title": "物聯網三層架構、OSI／TCP-IP 與無線通訊技術", "short": "IoT 架構＋無線技術", "lectureChars": 6603, "lecture": "<h3>今天要搞懂的 5 件事<\/h3>\n<ol>\n<li>物聯網三層架構：感知層、網路層、應用層各做什麼。<\/li>\n<li>常見感測模組（PIR、DHT11、HC-SR04、ADXL345、MPU6050、MQ-2、光敏電阻）的原理與用途。<\/li>\n<li>OSI 七層 vs. TCP/IP 四層，各層代表協定。<\/li>\n<li>RFID 頻段表、RFID vs. NFC、NFC 三種模式。<\/li>\n<li>Wi-Fi 各世代、BLE、Zigbee、NB-IoT、LoRaWAN、4G/5G 的「距離／功耗／頻寬」取捨。<\/li>\n<\/ol>\n<h2>1. 物聯網三層架構 <span class=\"ref\">考科一 2.1<\/span><span class=\"pg\">指引 p.4-1<\/span><\/h2>\n<p>物聯網要做到「<strong>全面感知、可靠傳遞、智慧處理<\/strong>」三大特徵；ITU 與多數標準組織把架構分三層：<\/p>\n<table>\n<thead>\n<tr>\n<th>層級<\/th>\n<th>一句話<\/th>\n<th>主要工作<\/th>\n<th>例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>感知層 Perception<\/td>\n<td>物理世界與數位世界的介面<\/td>\n<td>數據採集（類比→數位）、識別（RFID、NFC、QR Code）、簡單邊緣運算（先濾雜訊）<\/td>\n<td>溫濕度、加速度、氣體感測器；RFID 標籤<\/td>\n<\/tr>\n<tr>\n<td>網路層 Network<\/td>\n<td>把資料「無縫、透明」送到應用層<\/td>\n<td>存取網路（Access）＋核心網路（Core）；<strong>異質網路融合<\/strong>（閘道器把 Zigbee 轉 TCP/IP）<\/td>\n<td>Wi-Fi、Zigbee、LoRa、4G/5G、閘道器<\/td>\n<\/tr>\n<tr>\n<td>應用層 Application<\/td>\n<td>把資料變成有價值的資訊或決策<\/td>\n<td>雲端運算、大數據、AI；設備管理、數據儲存、API<\/td>\n<td>智慧家庭、交通、城市、工廠、農業、醫療<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>IoT 的傳輸特性通常是 <strong>「小封包、高頻率」或「事件驅動（Event-driven）」<\/strong>，所以網路層要特別注意<strong>封包遺失率與延遲<\/strong>。<\/li>\n<li>感知層元件<strong>不是各自獨立運作<\/strong>：例如按門鈴後通知攝影機開始人臉辨識，元件之間要交換資料（指引 p.4-24 練習題解析）。<\/li>\n<\/ul>\n<h2>2. 感知層常見感測模組 <span class=\"ref\">考科一 2.1<\/span><span class=\"pg\">指引 p.4-2～4-8<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>模組<\/th>\n<th>量什麼<\/th>\n<th>原理（白話）<\/th>\n<th>輸出／介面<\/th>\n<th>典型應用與限制<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>HC-SR501<\/td>\n<td>人體移動<\/td>\n<td><strong>被動<\/strong>接收人體紅外線變化；菲涅爾透鏡切出多個感應區<\/td>\n<td>GPIO 高電位<\/td>\n<td>感應燈「人來燈亮」、保全；<strong>偵測不到靜止的人<\/strong>、無法辨識身分<\/td>\n<\/tr>\n<tr>\n<td>DHT11<\/td>\n<td>溫度＋濕度<\/td>\n<td>電阻式濕度元件＋<strong>NTC 熱敏電阻<\/strong>，內建 8 位元 MCU<\/td>\n<td><strong>單線（Single-wire）數位<\/strong><\/td>\n<td>濕度 20–90%RH、溫度 0–50°C；建議約 2 秒讀一次<\/td>\n<\/tr>\n<tr>\n<td>HC-SR04<\/td>\n<td>距離<\/td>\n<td>發 40kHz 超音波、量回波時間：距離＝聲速（約 340m/s）×時間÷2<\/td>\n<td>Trig／Echo 腳位<\/td>\n<td>2–400cm；不受光線、顏色影響；避障、液位、停車格、垃圾桶滿載<\/td>\n<\/tr>\n<tr>\n<td>ADXL345<\/td>\n<td>三軸加速度<\/td>\n<td>MEMS 差動電容<\/td>\n<td><strong>I²C 或 SPI<\/strong><\/td>\n<td>計步、傾斜、跌倒／自由落體偵測、喚醒裝置<\/td>\n<\/tr>\n<tr>\n<td>MPU6050<\/td>\n<td>6 軸 IMU（3 軸加速度＋3 軸陀螺儀）<\/td>\n<td>陀螺儀依<strong>科里奧利力<\/strong>量角速度（dps）<\/td>\n<td>I²C<\/td>\n<td>無人機、平衡車；陀螺儀會「漂移」、加速度計怕震動 → 用互補／卡爾曼濾波算 roll、pitch、yaw<\/td>\n<\/tr>\n<tr>\n<td>MQ-2<\/td>\n<td>可燃氣體、煙霧<\/td>\n<td>加熱的 <strong>SnO₂<\/strong> 半導體，遇氣體電阻<strong>下降<\/strong><\/td>\n<td>類比電壓（ADC）或比較器數位輸出<\/td>\n<td>瓦斯外洩、煙霧警報；需預熱、選擇性差（酒精、油煙干擾）<\/td>\n<\/tr>\n<tr>\n<td>光敏電阻 LDR<\/td>\n<td>亮度<\/td>\n<td>光電導效應（CdS），光越強電阻越小<\/td>\n<td>需串固定電阻做<strong>分壓<\/strong>，再由 ADC 讀<\/td>\n<td>自動路燈、雷射絆線；反應比光二極體慢（數十 ms）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：<strong>超音波感測器量「距離」，不是量噪音分貝<\/strong>；室內燈光控制用不到電子羅盤與加速度計（指引 p.4-23～4-24 練習題）。<\/p>\n<\/blockquote>\n<h2>3. OSI 七層與 TCP/IP 四層 <span class=\"ref\">考科一 2.1<\/span><span class=\"pg\">指引 p.4-9～4-12<\/span><\/h2>\n<p>OSI 由 ISO 提出，分七層的目的是<strong>解決異構網路互連的相容性問題<\/strong>（明確區分 service、port、protocol）。<\/p>\n<table>\n<thead>\n<tr>\n<th>OSI 層<\/th>\n<th>做什麼<\/th>\n<th>代表<\/th>\n<th>TCP/IP 四層<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>7 應用層<\/td>\n<td>讓應用程式使用網路<\/td>\n<td>HTTP、FTP、SMTP<\/td>\n<td>應用層（FTP、SMTP、POP、DNS、Telnet、SNMP、HTTP）<\/td>\n<\/tr>\n<tr>\n<td>6 表達層<\/td>\n<td><strong>格式轉換、壓縮/解壓縮、加密/解密<\/strong>（如 ASCII↔EBCDIC）<\/td>\n<td>—<\/td>\n<td>〃<\/td>\n<\/tr>\n<tr>\n<td>5 會議層（會話層）<\/td>\n<td>建立、管理、終止會談<\/td>\n<td>—<\/td>\n<td>〃<\/td>\n<\/tr>\n<tr>\n<td>4 傳輸層<\/td>\n<td>端對端可靠傳輸、服務品質<\/td>\n<td><strong>TCP、UDP<\/strong><\/td>\n<td>傳輸層（主機對主機層）<\/td>\n<\/tr>\n<tr>\n<td>3 網路層<\/td>\n<td>定址與路由<\/td>\n<td><strong>IP、ICMP<\/strong><\/td>\n<td>網路層（網際網路層，以 datagram 為單位）<\/td>\n<\/tr>\n<tr>\n<td>2 資料鏈結層<\/td>\n<td>組成訊框、錯誤偵測與控制<\/td>\n<td>乙太網路<\/td>\n<td>鏈結層（網路介面層）<\/td>\n<\/tr>\n<tr>\n<td>1 實體層<\/td>\n<td>傳送位元（電、光、無線電脈衝）<\/td>\n<td>電纜、光纖<\/td>\n<td>〃<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 記法<\/strong>：由上到下「<strong>應表會傳網鏈實<\/strong>」。TCP/IP 不是砍掉 OSI 的層，而是<strong>把功能相近的層合併<\/strong>。指引 4.3 節另以「五層（含實體層）」說明，看到五層或四層都別慌（p.4-47）。<\/p>\n<\/blockquote>\n<h2>4. 應用層場域（指引 7 大場域速覽） <span class=\"ref\">考科一 2.1<\/span><span class=\"pg\">指引 p.4-13～4-21<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>場域<\/th>\n<th>關鍵字<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>智慧家庭<\/td>\n<td>Wi-Fi、Zigbee、Thread 連到中樞；「回家模式」場景化；語音助理；邊緣 AI 攝影機辨識家人/寵物/陌生人<\/td>\n<\/tr>\n<tr>\n<td>智慧交通<\/td>\n<td>AI 影像＋<strong>地磁感測器<\/strong>算車流、動態調整號誌；<strong>V2X 車聯網<\/strong>＋5G 低延遲；智慧停車<\/td>\n<\/tr>\n<tr>\n<td>智慧城市<\/td>\n<td>LPWAN 或 5G 匯流到雲端；智慧路燈變城市節點；智慧垃圾桶、智慧水務（水壓流量抓漏）<\/td>\n<\/tr>\n<tr>\n<td>科技執法<\/td>\n<td>邊緣 AI 主動偵測違規、車牌辨識；區間測速；聲音照相（陣列麥克風）<\/td>\n<\/tr>\n<tr>\n<td>智慧工廠<\/td>\n<td><strong>OT 與 IT 融合<\/strong>、IIoT 閘道器、5G 專網、Dashboard；<strong>預測性維護<\/strong>、<strong>數位孿生（Digital Twin）<\/strong>；大規模客製化<\/td>\n<\/tr>\n<tr>\n<td>智慧農業<\/td>\n<td>「看天吃飯」→精密農業；<strong>LoRaWAN、NB-IoT<\/strong> 回傳；自動滴灌、無人機多光譜<\/td>\n<\/tr>\n<tr>\n<td>智慧教育／醫療<\/td>\n<td>適性學習、RFID 學生證；穿戴裝置、連續血糖監測、RFID/藍牙資產追蹤、遠距照護<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：「自動駕駛汽車」不屬於智慧醫療的例子（指引 p.4-22 練習題）。數位孿生＝在虛擬世界建立與實體一樣的模型，<strong>先模擬驗證再套用到實體產線<\/strong>。<\/p>\n<\/blockquote>\n<h2>5. RFID：頻段表必背 <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-26～4-27<\/span><\/h2>\n<p>RFID＝用無線電波做<strong>非接觸式雙向<\/strong>自動識別。三元件：<strong>電子標籤（Tag，天線＋晶片，存 UID）、讀寫器（Reader）、後端應用系統<\/strong>。\n依供電分：<strong>被動式（無電池，最常見，靠讀寫器電波感應供電，Backscatter 回傳）<\/strong>、半被動式、主動式。<\/p>\n<table>\n<thead>\n<tr>\n<th>頻段<\/th>\n<th>頻率<\/th>\n<th>標準<\/th>\n<th>距離<\/th>\n<th>特性與應用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>低頻 LF<\/td>\n<td>125–134 kHz<\/td>\n<td>ISO 11784/85<\/td>\n<td>&lt; 10 cm<\/td>\n<td>穿透力強、受金屬與水干擾小；動物晶片、門禁卡<\/td>\n<\/tr>\n<tr>\n<td>高頻 HF<\/td>\n<td>13.56 MHz<\/td>\n<td>ISO 14443、ISO 15693<\/td>\n<td>&lt; 1 m<\/td>\n<td>速度較快；圖書館、電子護照、智慧卡<\/td>\n<\/tr>\n<tr>\n<td>超高頻 UHF<\/td>\n<td>860–960 MHz<\/td>\n<td>EPCglobal Gen2（ISO 18000-6C）<\/td>\n<td>3–10 m+<\/td>\n<td>距離遠、速度快、<strong>防碰撞可一次讀數百個<\/strong>；物流倉儲、ETC、零售盤點<\/td>\n<\/tr>\n<tr>\n<td>微波<\/td>\n<td>2.45 / 5.8 GHz<\/td>\n<td>ISO 18000-4<\/td>\n<td>&gt; 10 m<\/td>\n<td>數據量大但指向性強、易受干擾；行李追蹤<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>6. NFC 與 RFID 比較 <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-28～4-29<\/span><\/h2>\n<p>NFC 由 RFID 的 <strong>HF 技術<\/strong>演變而來，頻率固定 <strong>13.56 MHz<\/strong>；理論 20 cm，實務 <strong>4 cm 以內<\/strong>（距離短反而是安全優勢）；速率 106/212/424 kbit/s；標準 ISO/IEC 18092、14443，資料格式 <strong>NDEF<\/strong>（NFC Forum 定義）。<\/p>\n<p>NFC 三種模式：\n1. <strong>卡片模擬（Card Emulation）<\/strong>：手機變成 IC 卡 → Apple Pay、手機悠遊卡、數位門禁；通常需<strong>安全元件 SE<\/strong>。\n2. <strong>讀卡機（Reader/Writer）<\/strong>：手機讀寫外部標籤 → 智慧海報、防偽標籤。\n3. <strong>點對點（P2P）<\/strong>：兩裝置雙向交換 → 物聯網最關鍵應用是<strong>快速配對（Handover）<\/strong>：碰一下傳藍牙/Wi-Fi 連線資訊，再切到高頻寬連線。<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>RFID（UHF）<\/th>\n<th>NFC<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>用途<\/td>\n<td>物品識別、追蹤、大量讀取<\/td>\n<td>通訊互動、支付、單一配對<\/td>\n<\/tr>\n<tr>\n<td>距離<\/td>\n<td>可達 10 m 以上<\/td>\n<td>&lt; 10 cm<\/td>\n<\/tr>\n<tr>\n<td>模式<\/td>\n<td>單向為主（讀寫器→標籤）<\/td>\n<td>雙向（支援 P2P）<\/td>\n<\/tr>\n<tr>\n<td>同時讀取<\/td>\n<td>強（數百個）<\/td>\n<td>弱（通常一對一）<\/td>\n<\/tr>\n<tr>\n<td>哲學<\/td>\n<td>讓「物」被系統看見<\/td>\n<td>讓「人」與「物」互動<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. Wi-Fi（IEEE 802.11） <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-29～4-31<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>世代<\/th>\n<th>標準<\/th>\n<th>頻段<\/th>\n<th>最高速率<\/th>\n<th>AIoT 定位<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Wi-Fi 4<\/td>\n<td>802.11n<\/td>\n<td>2.4/5 GHz<\/td>\n<td>600 Mbps<\/td>\n<td>目前最主流 IoT 標準，ESP32/ESP8266 多採用<\/td>\n<\/tr>\n<tr>\n<td>Wi-Fi 5<\/td>\n<td>802.11ac<\/td>\n<td>5 GHz<\/td>\n<td>6.9 Gbps<\/td>\n<td>高頻寬、穿牆弱；AI 攝影機、閘道器<\/td>\n<\/tr>\n<tr>\n<td>Wi-Fi 6/6E<\/td>\n<td>802.11ax<\/td>\n<td>2.4/5/6 GHz<\/td>\n<td>9.6 Gbps<\/td>\n<td><strong>TWT（目標喚醒時間）＋OFDMA<\/strong> → 省電、解多裝置擁塞<\/td>\n<\/tr>\n<tr>\n<td>Wi-Fi 7<\/td>\n<td>802.11be<\/td>\n<td>2.4/5/6 GHz<\/td>\n<td>46 Gbps<\/td>\n<td>極低延遲、<strong>MLO 多重連結<\/strong>；工業自動化<\/td>\n<\/tr>\n<tr>\n<td>Wi-Fi HaLow<\/td>\n<td>802.11ah<\/td>\n<td>Sub-1 GHz（約 900 MHz）<\/td>\n<td>150 Kbps–15 Mbps<\/td>\n<td>IoT 專用：穿透強、約 1 公里、極低功耗<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>優勢：<strong>原生 IP 連線<\/strong>（不用閘道器轉換，可直接 HTTP、MQTT、WebSocket 上雲）；能同時滿足即時性與大資料量（聲音、影像）。<\/li>\n<li>頻段：<strong>2.4 GHz<\/strong> 穿牆好但與藍牙、微波爐共用、干擾大；<strong>5/6 GHz<\/strong> 快、干擾少但衰減快、穿牆差。<\/li>\n<li>限制：連線電流約 100–300 mA，不適合鈕扣電池跑數年；無螢幕裝置配網麻煩（AP 模式或藍牙輔助設定 SSID 與密碼）。<strong>SSID＝基地台識別碼<\/strong>。<\/li>\n<\/ul>\n<h2>8. 藍牙：經典藍牙 vs. BLE <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-32～4-34<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>經典藍牙 Classic<\/th>\n<th>低功耗藍牙 BLE（藍牙 4.0 起）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>目的<\/td>\n<td>持續大量傳輸（音訊串流）<\/td>\n<td>間歇小量（感測數值）<\/td>\n<\/tr>\n<tr>\n<td>連線<\/td>\n<td>保持常時連線<\/td>\n<td>平常休眠，毫秒級喚醒傳送<\/td>\n<\/tr>\n<tr>\n<td>功耗<\/td>\n<td>&gt; 10 mA，需常充電<\/td>\n<td>峰值 &lt; 15 mA、睡眠 &lt; 10 µA，鈕扣電池可用數年<\/td>\n<\/tr>\n<tr>\n<td>應用<\/td>\n<td>耳機、車用免持、檔案傳輸<\/td>\n<td>手環、心率帶、門鎖、胎壓偵測<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>GAP<\/strong>：廣播與連線。周邊（Peripheral，如手環）廣播；中央（Central，如手機）掃描並發起連線。<\/li>\n<li><strong>GATT<\/strong>：連線後的資料交換，階層為 <strong>服務（Service）→ 特徵（Characteristic）<\/strong>，例如「心率服務」裡的「心率數值」。<\/li>\n<li><strong>藍牙 5.0<\/strong>：2 Mbps PHY（2 倍速）、**Long Range（Coded PHY）**延伸距離；<strong>5.1<\/strong>：<strong>AoA/AoD<\/strong> 測角定位，室內定位從公尺級到公分級；<strong>Bluetooth Mesh<\/strong>：多對多，燈泡接力。<\/li>\n<li>應用：穿戴醫療（CGM）、<strong>Beacon<\/strong>（利用 GAP 廣播推播優惠券）、<strong>無鑰匙解鎖<\/strong>（用 RSSI 判斷距離）。<\/li>\n<li>限制：頻寬遠低於 Wi-Fi；2.4 GHz 同頻干擾，靠 <strong>FHSS 跳頻<\/strong>。<\/li>\n<\/ul>\n<h2>9. Zigbee（IEEE 802.15.4） <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-34～4-36<\/span><\/h2>\n<p>設計初衷：<strong>低速率、低功耗、大規模節點組網<\/strong>（名字來自蜜蜂的 8 字舞）。<\/p>\n<table>\n<thead>\n<tr>\n<th>角色<\/th>\n<th>功能<\/th>\n<th>硬體<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>協調器 Coordinator<\/td>\n<td>網路創始者與管理者；選頻道、設 <strong>PAN ID<\/strong>、分配位址、維護安全金鑰；<strong>每個網路只能有一個<\/strong><\/td>\n<td>網關／Hub，須長期供電<\/td>\n<\/tr>\n<tr>\n<td>路由器 Router<\/td>\n<td>轉發封包、延伸覆蓋、允許其他裝置加入<\/td>\n<td>插電設備：智慧燈泡、插座<\/td>\n<\/tr>\n<tr>\n<td>終端裝置 End Device<\/td>\n<td>只收發自己的資料，<strong>不轉發<\/strong>；大多時間睡眠<\/td>\n<td>電池設備：門窗感測器、溫濕度計，電池 1～2 年<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>網狀（Mesh）多跳<\/strong>：理論可容納約 65,000 個節點（可擴充性）；路由器壞了會自動找替代路徑（<strong>自我修復 Self-Healing<\/strong>）。<\/li>\n<li><strong>Zigbee 3.0<\/strong> 統一應用層、**ZCL（Zigbee Cluster Library）**定義標準指令（如 On/Off Cluster），解決跨品牌互通。<\/li>\n<li>限制：最大 <strong>250 kbps<\/strong>，不適合音訊影像；2.4 GHz 易受 Wi-Fi 干擾；手機沒有 Zigbee 晶片，<strong>必須透過網關<\/strong>。<\/li>\n<li>Zigbee 聯盟已更名 <strong>CSA（連接標準聯盟）<\/strong>，是推動 <strong>Matter<\/strong> 的核心；Matter 支援 Ethernet、Wi-Fi、Thread（並用 BLE），<strong>不支援 LoRa<\/strong>（p.4-45）。<\/li>\n<\/ul>\n<h2>10. LPWAN：NB-IoT vs. LoRaWAN <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-37～4-38<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>NB-IoT<\/th>\n<th>LoRaWAN<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>頻譜<\/td>\n<td><strong>授權頻譜<\/strong>，架在現有 LTE 基地台，由電信商提供<\/td>\n<td><strong>非授權頻譜<\/strong>（Sub-GHz，台灣 920–925 MHz），可<strong>自建基地台<\/strong>、不用月租<\/td>\n<\/tr>\n<tr>\n<td>優勢<\/td>\n<td>覆蓋極佳（比 GSM 強 20 dB，地下室、下水道）；海量連結；SIM 卡電信級安全<\/td>\n<td>建置彈性高（大農場、石化廠）；空曠地可達 10 km 以上<\/td>\n<\/tr>\n<tr>\n<td>限制<\/td>\n<td>指引寫：<strong>不支援移動性<\/strong>，適合固定裝置<\/td>\n<td>頻寬極低；公共頻段易受干擾<\/td>\n<\/tr>\n<tr>\n<td>應用<\/td>\n<td>智慧水電表、路燈、人孔蓋<\/td>\n<td>土壤監測、大型廠區資產追蹤、土石流預警<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 標註<\/strong>：指引 p.4-37 寫 NB-IoT「不支援移動性（換基地台會斷線）」，這是早期版本（3GPP Release 13）的特性，後續版本已逐步改善。<strong>考試以指引說法作答<\/strong>。<\/p>\n<\/blockquote>\n<h2>11. 4G／5G 與 SIM 型態 <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-38～4-40<\/span><\/h2>\n<ul>\n<li>LTE <strong>Cat.4/Cat.6<\/strong>：下行 150 Mbps 以上 → 行動監控攝影機、數位看板。<strong>Cat.1<\/strong>：約 10 Mbps、成本功耗低 → 公車動態、共享單車、POS、電梯聯網（目前 IoT 最熱門）。<\/li>\n<li><strong>5G 三大場景（ITU 5G Triangle）<\/strong>：<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>場景<\/th>\n<th>特徵<\/th>\n<th>應用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>eMBB 增強型行動寬頻<\/td>\n<td>極致網速，可達 10 Gbps<\/td>\n<td>4K/8K 串流、AR/VR 遠端協作<\/td>\n<\/tr>\n<tr>\n<td>mMTC 大規模機器通訊<\/td>\n<td>每平方公里 100 萬個裝置<\/td>\n<td>智慧城市全域感知（「NB-IoT 的 5G 升級版」）<\/td>\n<\/tr>\n<tr>\n<td>URLLC 超可靠低延遲<\/td>\n<td>延遲 &lt; 1 ms、可靠度 99.999%<\/td>\n<td>車聯網、工業機器手臂、遠端手術<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>SIM：<strong>工業級 SIM<\/strong>（耐高溫抗腐蝕）、<strong>eSIM<\/strong>（焊在板上防震，可 <strong>OTA<\/strong> 遠端換電信商）、<strong>iSIM<\/strong>（整合進 SoC，更小更便宜）。<\/li>\n<li>5G 並不是「低功耗長距離」技術（那是 LPWAN）。<\/li>\n<\/ul>\n<h2>12. 選型總表（考前必看） <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-40<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>需求<\/th>\n<th>首選<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>極低資料量＋電池供電<\/td>\n<td>NB-IoT／LoRaWAN（水表、路邊停車感測）<\/td>\n<\/tr>\n<tr>\n<td>中等資料量＋移動<\/td>\n<td>LTE Cat.1（共享機車定位、電梯監控）<\/td>\n<\/tr>\n<tr>\n<td>大資料量（影像）＋即時<\/td>\n<td>4G LTE Cat.4／5G eMBB（路口監視器、無人機巡檢）<\/td>\n<\/tr>\n<tr>\n<td>不容許延遲＋生命安全<\/td>\n<td>5G URLLC（自駕車、遠端醫療）<\/td>\n<\/tr>\n<tr>\n<td>室內影音、AR/VR<\/td>\n<td>Wi-Fi<\/td>\n<\/tr>\n<tr>\n<td>穿戴、手機配件<\/td>\n<td>BLE<\/td>\n<\/tr>\n<tr>\n<td>居家／樓宇大量低速節點<\/td>\n<td>Zigbee（Mesh）<\/td>\n<\/tr>\n<tr>\n<td>碰一下支付／配對<\/td>\n<td>NFC<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>今日 30 秒回顧<\/h3>\n<p>感知→網路→應用｜應表會傳網鏈實；表達層管加密壓縮｜UHF 一次讀數百、NFC 13.56MHz 4cm｜Wi-Fi 6＝TWT＋OFDMA、HaLow＝Sub-1GHz｜BLE：GAP 廣播連線、GATT 服務特徵｜Zigbee：協調器只有一個、終端不轉發、250kbps｜NB-IoT 授權頻譜、LoRa 非授權可自建｜5G：eMBB 快、mMTC 多、URLLC 準。<\/p>", "audio": {"src": "audio/d02.mp3", "dur": 872}, "questions": [{"id": "d2q1", "n": 1, "opts": ["感知層", "網路層", "應用層", "實體層（OSI 第 1 層）"], "exp": "指引 p.4-9：網路層必須處理多種通訊協定的轉換（異質網路融合），例如工廠內 Zigbee 感測器資料需經閘道器轉成 TCP/IP 封包。D 是 OSI 的分層，不是物聯網三層架構的名稱。", }, {"id": "d2q5", "n": 5, "opts": ["遇到可燃性氣體時電阻值會隨濃度增加而上升", "核心材料為二氧化錫（SnO₂）的金屬氧化物半導體", "使用前通常需要預熱", "容易受酒精或油煙干擾，氣體選擇性較差"], "exp": "遇到可燃氣體或煙霧時，表面氧負離子發生氧化還原反應，電阻值隨濃度增加而「下降」（電導率上升）。其餘敘述皆為指引內容。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "關於 MQ-2 氣體感測器，下列敘述何者「不」正確？", "ref": "考科一 2.1", "src": "指引 p.4-7", "ans": 0, "stemH": "關於 MQ-2 氣體感測器，下列敘述何者「不」正確？", "optsH": ["遇到可燃性氣體時電阻值會隨濃度增加而上升", "核心材料為二氧化錫（SnO₂）的金屬氧化物半導體", "使用前通常需要預熱", "容易受酒精或油煙干擾，氣體選擇性較差"], "expH": "遇到可燃氣體或煙霧時，表面氧負離子發生氧化還原反應，電阻值隨濃度增加而「下降」（電導率上升）。其餘敘述皆為指引內容。"}, {"id": "d2q6", "n": 6, "opts": ["會議層（Session Layer）", "傳輸層（Transport Layer）", "表達層（Presentation Layer）", "資料鏈結層（Data Link Layer）"], "exp": "表達層負責資料格式轉換（如 ASCII 轉 EBCDIC）、壓縮與解壓縮、加密與解密。會議層管理會談的建立與終止；傳輸層負責端對端可靠傳輸（TCP/UDP）。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "資料傳輸時常需「加密與解密、壓縮與解壓縮、字碼轉換」，這些屬於 OSI 模型的哪一層？", "ref": "考科一 2.1", "src": "指引 p.4-10～4-11", "ans": 2, "stemH": "資料傳輸時常需「加密與解密、壓縮與解壓縮、字碼轉換」，這些屬於 OSI 模型的哪一層？", "optsH": ["會議層（Session Layer）", "傳輸層（Transport Layer）", "表達層（Presentation Layer）", "資料鏈結層（Data Link Layer）"], "expH": "表達層負責資料格式轉換（如 ASCII 轉 EBCDIC）、壓縮與解壓縮、加密與解密。會議層管理會談的建立與終止；傳輸層負責端對端可靠傳輸（TCP/UDP）。"}, {"id": "d2q7", "n": 7, "opts": ["低頻 LF（125–134 kHz）", "高頻 HF（13.56 MHz）", "超高頻 UHF（860–960 MHz，EPC Gen2）", "NFC（13.56 MHz，4 cm 內）"], "exp": "UHF 讀取距離遠（3–10 m+）、速度快，並有防碰撞機制可同時讀數百個標籤，常見於物流倉儲、ETC、零售盤點。LF 距離短；NFC 一次通常只對應單一裝置。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "物流中心希望貨車經過閘門時，自動一次讀取整車數百箱貨物的標籤。最適合的 RFID 頻段是？", "ref": "考科一 2.2", "src": "指引 p.4-27", "ans": 2, "stemH": "物流中心希望貨車經過閘門時，自動一次讀取整車數百箱貨物的標籤。最適合的 RFID 頻段是？", "optsH": ["低頻 LF（125–134 kHz）", "高頻 HF（13.56 MHz）", "超高頻 UHF（860–960 MHz，EPC Gen2）", "NFC（13.56 MHz，4 cm 內）"], "expH": "UHF 讀取距離遠（3–10 m+）、速度快，並有防碰撞機制可同時讀數百個標籤，常見於物流倉儲、ETC、零售盤點。LF 距離短；NFC 一次通常只對應單一裝置。"}, {"id": "d2q8", "n": 8, "opts": ["卡片模擬模式（Card Emulation）", "讀卡機模式（Reader/Writer）", "點對點模式（P2P）", "廣播模式（Broadcast）"], "exp": "卡片模擬模式把手機模擬成非接觸式 IC 卡，應用於 Apple Pay、Google Pay、門禁卡、交通票證，通常需要安全元件（SE）。讀智慧海報是 Reader/Writer；快速配對、交換名片是 P2P。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "使用手機 NFC 「感應付款」或當作手機悠遊卡，屬於 NFC 的哪一種模式？", "ref": "考科一 2.2", "src": "指引 p.4-28", "ans": 0, "stemH": "使用手機 NFC 「感應付款」或當作手機悠遊卡，屬於 NFC 的哪一種模式？", "optsH": ["卡片模擬模式（Card Emulation）", "讀卡機模式（Reader/Writer）", "點對點模式（P2P）", "廣播模式（Broadcast）"], "expH": "卡片模擬模式把手機模擬成非接觸式 IC 卡，應用於 Apple Pay、Google Pay、門禁卡、交通票證，通常需要安全元件（SE）。讀智慧海報是 Reader/Writer；快速配對、交換名片是 P2P。"}, {"id": "d2q9", "n": 9, "opts": ["MLO 與 Sub-1GHz", "NDEF 與 SE", "FHSS 與 AoA", "TWT（目標喚醒時間）與 OFDMA"], "exp": "指引表 4-2-3：Wi-Fi 6/6E 導入 TWT 與 OFDMA。MLO 是 Wi-Fi 7；Sub-1GHz 是 HaLow；FHSS、AoA 屬藍牙；NDEF、SE 屬 NFC。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "Wi-Fi 6（802.11ax）被稱為 IoT 的重大變革，主要是因為導入了哪兩項技術而大幅降低功耗並改善多裝置擁塞？", "ref": "考科一 2.2", "src": "指引 p.4-30", "ans": 3, "stemH": "Wi-Fi 6（802.11ax）被稱為 IoT 的重大變革，主要是因為導入了哪兩項技術而大幅降低功耗並改善多裝置擁塞？", "optsH": ["MLO 與 Sub-1GHz", "NDEF 與 SE", "FHSS 與 AoA", "TWT（目標喚醒時間）與 OFDMA"], "expH": "指引表 4-2-3：Wi-Fi 6/6E 導入 TWT 與 OFDMA。MLO 是 Wi-Fi 7；Sub-1GHz 是 HaLow；FHSS、AoA 屬藍牙；NDEF、SE 屬 NFC。"}, {"id": "d2q10", "n": 10, "opts": ["GATT 負責廣播與連線，GAP 負責連線後的資料交換", "GATT 的資料結構分為服務（Service）與特徵（Characteristic）", "藍牙 5.1 新增 TWT 機制，延長電池壽命", "BLE 適合持續性的音訊串流"], "exp": "GAP 管廣播與連線（Peripheral 廣播、Central 掃描），GATT 管連線後的資料交換，結構為 Service → Characteristic。藍牙 5.1 新增的是 AoA/AoD 定位；TWT 是 Wi-Fi 6。音訊串流是經典藍牙。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "關於低功耗藍牙（BLE）的敘述，下列何者正確？", "ref": "考科一 2.2", "src": "指引 p.4-32～4-33", "ans": 1, "stemH": "關於低功耗藍牙（BLE）的敘述，下列何者正確？", "optsH": ["GATT 負責廣播與連線，GAP 負責連線後的資料交換", "GATT 的資料結構分為服務（Service）與特徵（Characteristic）", "藍牙 5.1 新增 TWT 機制，延長電池壽命", "BLE 適合持續性的音訊串流"], "expH": "GAP 管廣播與連線（Peripheral 廣播、Central 掃描），GATT 管連線後的資料交換，結構為 Service → Characteristic。藍牙 5.1 新增的是 AoA/AoD 定位；TWT 是 Wi-Fi 6。音訊串流是經典藍牙。"}, {"id": "d2q11", "n": 11, "opts": ["協調器（Coordinator）", "路由器（Router）", "終端裝置（End Device）", "閘道器（Gateway）"], "exp": "終端裝置只收發自己的資料、不具轉發功能，多為電池供電，電池壽命可達 1～2 年。協調器每個網路只有一個、需長期供電；路由器多為插電設備並負責轉發。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "在 Zigbee 網路中，門窗感測器以電池供電、大部分時間處於睡眠，只在偵測到事件時喚醒傳送資料，且不轉發其他裝置的封包。它通常扮演哪一種角色？", "ref": "考科一 2.2", "src": "指引 p.4-35", "ans": 2, "stemH": "在 Zigbee 網路中，門窗感測器以電池供電、大部分時間處於睡眠，只在偵測到事件時喚醒傳送資料，且不轉發其他裝置的封包。它通常扮演哪一種角色？", "optsH": ["協調器（Coordinator）", "路由器（Router）", "終端裝置（End Device）", "閘道器（Gateway）"], "expH": "終端裝置只收發自己的資料、不具轉發功能，多為電池供電，電池壽命可達 1～2 年。協調器每個網路只有一個、需長期供電；路由器多為插電設備並負責轉發。"}, {"id": "d2q12", "n": 12, "opts": ["NB-IoT", "LoRaWAN", "LTE Cat.4", "5G eMBB"], "exp": "LoRaWAN 使用非授權頻譜（台灣 920–925 MHz），可自行架設基地台、不需向電信商繳月費，適合大片私有場域。NB-IoT 使用授權頻譜、由電信商提供；Cat.4 與 eMBB 是高頻寬、較耗電的方案。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某石化廠想在自有大廠區佈建數百個電池供電的管線壓力感測器，希望自建基地台、不繳電信月租。最適合的技術是？", "ref": "考科一 2.2", "src": "指引 p.4-37～4-38", "ans": 1, "stemH": "某石化廠想在自有大廠區佈建數百個電池供電的管線壓力感測器，希望自建基地台、不繳電信月租。最適合的技術是？", "optsH": ["NB-IoT", "LoRaWAN", "LTE Cat.4", "5G eMBB"], "expH": "LoRaWAN 使用非授權頻譜（台灣 920–925 MHz），可自行架設基地台、不需向電信商繳月費，適合大片私有場域。NB-IoT 使用授權頻譜、由電信商提供；Cat.4 與 eMBB 是高頻寬、較耗電的方案。"}]}, {"id": 3, "date": "2026-10-20", "subject": "考科一", "type": "study", "title": "應用層協定與工業通訊標準：MQTT、CoAP、HTTP/REST、Modbus、OPC UA、MTConnect", "short": "MQTT／OPC UA 等協定", "lectureChars": 5699, "lecture": "<h3>今天要搞懂的 5 件事<\/h3>\n<ol>\n<li>MQTT、HTTP、CoAP 的底層協定、通訊模式、標頭大小與適用場景。<\/li>\n<li>MQTT 三角色、Topic、QoS 0/1/2、Keep Alive、LWT、Retained Message、TLS。<\/li>\n<li>封裝與解封裝；TCP vs. UDP。<\/li>\n<li>OPC UA 特性與四種資料存取方式；MTConnect 四元素與「唯讀、XML、HTTP」。<\/li>\n<li>Modbus RTU／ASCII／TCP 與四種資料區塊；RESTful API 方法與狀態碼。<\/li>\n<\/ol>\n<h2>1. 為什麼 IoT 需要輕量協定 <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-40<\/span><\/h2>\n<p>連上網（Wi-Fi、5G、LoRa）之後，下一個問題是「<strong>數據如何被封裝與交換<\/strong>」。HTTP 為網頁設計，在硬體資源受限、網路不穩的 IoT 環境顯得笨重，因此出現 MQTT、CoAP 等輕量協定。<\/p>\n<h2>2. MQTT、HTTP、CoAP 三者比較 <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-40～4-42<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>MQTT<\/th>\n<th>HTTP/HTTPS<\/th>\n<th>CoAP<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>底層<\/td>\n<td><strong>TCP<\/strong>/IP<\/td>\n<td>TCP/IP<\/td>\n<td><strong>UDP<\/strong><\/td>\n<\/tr>\n<tr>\n<td>通訊模式<\/td>\n<td><strong>發布/訂閱（Pub/Sub）<\/strong>＋Broker<\/td>\n<td>請求/回應（Req/Res）<\/td>\n<td>請求/回應，支援 REST（GET、POST、PUT、DELETE）<\/td>\n<\/tr>\n<tr>\n<td>標頭<\/td>\n<td>極小（最小 <strong>2 Bytes<\/strong>）<\/td>\n<td>大（數百 Bytes）<\/td>\n<td>小（<strong>4 Bytes<\/strong>）<\/td>\n<\/tr>\n<tr>\n<td>即時性<\/td>\n<td>高（主動推播）<\/td>\n<td>低（需輪詢 Polling）<\/td>\n<td>中<\/td>\n<\/tr>\n<tr>\n<td>可靠性<\/td>\n<td><strong>QoS 機制<\/strong><\/td>\n<td>依賴 TCP 重傳<\/td>\n<td>內建確認機制<\/td>\n<\/tr>\n<tr>\n<td>適用<\/td>\n<td>大規模感測網、即時控制、行動裝置<\/td>\n<td>韌體更新、影像傳輸、Web 介面<\/td>\n<td>極低功耗感測器、NB-IoT 設備、智慧電表<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>MQTT：IBM 於 <strong>1999 年<\/strong>為監控輸油管線開發，強調低頻寬、低硬體需求、網路不穩時的可靠性。<\/li>\n<li>HTTP：伺服器<strong>無法主動推播<\/strong>給裝置（除非 WebSocket 或 Long-polling）。<\/li>\n<li>CoAP：「輕量版 HTTP」；走 UDP <strong>不需維持長連線（Keep-alive）<\/strong>，喚醒時間更短。<strong>CoAP 沒有 QUERY 這種請求方法<\/strong>（p.4-45）。<\/li>\n<\/ul>\n<p><span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-43～4-46 練習題<\/span> <strong>WebSocket<\/strong>：建立後可<strong>雙向即時通訊<\/strong>，適合視訊通話、即時監看；指引練習題認為 HTTP 在 server 回應後會斷線，而 Socket、WebSocket、FTP 不會。<\/p>\n<blockquote>\n<p><strong>⚠️ 標註<\/strong>：「HTTP 回應後即斷線」是 HTTP/1.0 的預設行為；HTTP/1.1 預設持久連線（keep-alive）。考試遇到此題型<strong>依指引答 HTTP<\/strong>。<\/p>\n<\/blockquote>\n<h2>3. 封裝與解封裝、網路五層 <span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-47～4-50<\/span><\/h2>\n<p>指引 4.3 節用 **TCP/IP 五層（含實體層）**說明：應用層、傳輸層、網際網路層、資料連結層、實體層。<\/p>\n<ul>\n<li><strong>封裝（Encapsulation）<\/strong>：資料往下傳，<strong>每一層加上自己的標頭（Header）<\/strong>。<\/li>\n<li><strong>解封裝（Decapsulation）<\/strong>：接收端往上傳，<strong>逐層移除標頭<\/strong>。<\/li>\n<li>資料連結層把封包封成「<strong>訊框（Frame）<\/strong>」，以 <strong>MAC 位址<\/strong>定址，常見設備是<strong>交換器<\/strong>；實體層包含電纜、光纖、網路卡、<strong>中繼器<\/strong>。<\/li>\n<\/ul>\n<p>以 Modbus 為例（p.4-50）：應用程式要讀保持暫存器 → 函式庫轉成 <strong>Modbus PDU（功能碼＋資料欄位）<\/strong> →\n- <strong>Modbus TCP<\/strong>：加 <strong>MBAP Header<\/strong>，再經 TCP、IP 送出；\n- <strong>Modbus RTU/ASCII<\/strong>：加<strong>裝置位址＋錯誤檢查碼（CRC 或 LRC）<\/strong>，成為串列訊框，經 <strong>RS-232/RS-485<\/strong> 傳輸。\n接收端反向解封裝、驗證 CRC/LRC、解析 PDU 後執行，再用同樣流程回傳。<\/p>\n<h3>TCP vs. UDP <span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-48、p.4-69～4-71<\/span><\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>TCP<\/th>\n<th>UDP<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>連線<\/td>\n<td><strong>連接導向<\/strong>（傳輸前三次握手）<\/td>\n<td><strong>無連接<\/strong><\/td>\n<\/tr>\n<tr>\n<td>可靠性<\/td>\n<td>保證按順序、完整到達<\/td>\n<td>不保證可靠、順序、不重複<\/td>\n<\/tr>\n<tr>\n<td>速度<\/td>\n<td>較慢、開銷大<\/td>\n<td>快、即時性高<\/td>\n<\/tr>\n<tr>\n<td>適用<\/td>\n<td>檔案、郵件、網頁請求；MQTT、Modbus TCP<\/td>\n<td>影音串流、即時應用；CoAP<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-69～4-71 練習題<\/span> 其他練習題常考：<strong>LAN<\/strong> 是小範圍（一棟或一組建築物）的網路；<strong>IPv4<\/strong> 由 4 組 0–255 的數字以「.」分隔（如 192.168.0.1）。<\/p>\n<h2>4. 為什麼工廠要從 Modbus 走向 OPC UA <span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-51<\/span><\/h2>\n<p>早期產線自動化低，傳統工控普遍用 <strong>Modbus<\/strong>：簡單可靠，但<strong>設計時沒考慮資安<\/strong>，沒有加密與身分驗證。現代製造要小批量、多樣化、安全的資料交換，因此導入 <strong>OPC UA<\/strong> 這類提供<strong>加密、身分驗證與授權<\/strong>的進階協定。<\/p>\n<h2>5. OPC UA <span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-51～4-56<\/span><\/h2>\n<p>由 **OPC 基金會（OPC Foundation）**開發，跨平台、開放、統一，被視為工業 4.0 關鍵標準。<\/p>\n<p>主要特性：\n1. <strong>平台獨立<\/strong>：不依賴特定 OS 或硬體，從嵌入式 MCU 到雲端都能實作（不是只限 Windows）。\n2. <strong>內建多層次安全<\/strong>：認證、授權、資料完整性、加密通訊。\n3. <strong>可擴展的服務與資料模型（資訊模型）<\/strong>。\n4. 多語言實作：C++、C#、Java、Python。\n5. <strong>Client/Server 架構<\/strong>：Server 通常在設備端，收集控制器與感測器資料並轉成標準格式；Client 向 Server 要資料。\n6. 把各廠牌設備存取函式庫封裝在 OPC UA Server，形成<strong>設備聯網閘道器平台<\/strong>，對外提供統一存取方式。\n7. 促進<strong>水平與垂直整合<\/strong>：設備 → MES → ERP 的無縫資料流。<\/p>\n<p><strong>四種資料存取方式（必考）<\/strong>：<\/p>\n<table>\n<thead>\n<tr>\n<th>方式<\/th>\n<th>白話<\/th>\n<th>例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>讀/寫 Read/Write<\/td>\n<td>主動讀變數或寫新值<\/td>\n<td>讀產品重量；寫入新的進給率<\/td>\n<\/tr>\n<tr>\n<td>資料變更通知 Data Change Notification<\/td>\n<td><strong>訂閱變數<\/strong>，值改變時伺服器通知<\/td>\n<td>訂閱刀具壽命、機器溫度超過閾值<\/td>\n<\/tr>\n<tr>\n<td>方法 Method<\/td>\n<td>遠端呼叫伺服器提供的方法<\/td>\n<td>遠端觸發自動換刀程序<\/td>\n<\/tr>\n<tr>\n<td>事件通知 Event Notification<\/td>\n<td><strong>訂閱事件<\/strong>，被動接收事件通知<\/td>\n<td>緊急停機、機器手臂故障、系統日誌<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.5-26～5-27 練習題<\/span> OPC UA 資訊模型（Information Model）中 <strong>NodeId 不能重複<\/strong>；指引練習題解析認為 OPC UA 對應到 <strong>OSI 第 7 層（應用層）<\/strong>。<\/p>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：「Data Change」訂閱的是<strong>變數值的變化<\/strong>；「Event」訂閱的是<strong>事件（故障、警報）<\/strong>。題目說「訂閱特定事件、被動接收通知」→ Event Notification。<\/p>\n<\/blockquote>\n<h2>6. MTConnect <span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-56～4-59<\/span><\/h2>\n<p>專為製造業（特別是<strong>工具機<\/strong>）設計的開放標準，定義一組<strong>標準設備參數名稱<\/strong>描述設備效能與即時狀態。三個關鍵字：<strong>唯讀（Read-only，只讀不寫指令）、XML、HTTP<\/strong>。<\/p>\n<p>特性：開放源碼且<strong>免授權費（royalty-free）<\/strong>、可擴展（基於 XML）、互操作性、可讀性（XML 人與機器都好讀）。應用：生產監控、預測性維護、數據分析與優化。<\/p>\n<p><strong>四元素資料流<\/strong>：<\/p>\n<table>\n<thead>\n<tr>\n<th>元素<\/th>\n<th>角色<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>設備 Device<\/td>\n<td>實體機器：CNC、機器人、檢測儀；產生運行狀態、主軸轉速、進給速度等參數<\/td>\n<\/tr>\n<tr>\n<td>適配器 Adapter<\/td>\n<td><strong>存取設備資料並轉成 XML<\/strong>；不同控制器用不同函式庫（如發那科用 FOCAS）<\/td>\n<\/tr>\n<tr>\n<td>代理器 Agent<\/td>\n<td><strong>核心<\/strong>；整合一或多個 Adapter 的資料，以標準 XML 儲存，透過 <strong>HTTP RESTful API<\/strong> 提供；負責緩存、格式化、傳輸<\/td>\n<\/tr>\n<tr>\n<td>應用程式 Application<\/td>\n<td>用 Agent 資料做分析、監控、效能評估、預測維護<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：OPC UA 可讀可寫、Client/Server、資安內建；MTConnect <strong>唯讀<\/strong>、XML over HTTP、Device→Adapter→Agent→Application。<\/p>\n<\/blockquote>\n<h2>7. MQTT 深入：角色、主題、機制 <span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-59～4-61<\/span><\/h2>\n<ul>\n<li>三角色：<strong>發布者（Publisher）<\/strong>、<strong>訂閱者（Subscriber）<\/strong>、<strong>中介代理者（Broker）<\/strong>；以非同步方式傳輸。<\/li>\n<li>流程：發布者帶著**主題（Topic）**把訊息送給 Broker → Broker 依主題過濾 → 推播給訂閱該主題的訂閱者。<\/li>\n<li>以 Client-Server 來看，<strong>發布者與訂閱者都是 Client<\/strong>，Broker 是 Server；發布者<strong>不知道<\/strong>有多少訂閱者。<\/li>\n<li><strong>解耦（Decoupled）<\/strong>：感測器故障，手機 App 不會掛；App 離線，感測器照樣送到 Broker。<\/li>\n<li>三個可靠性/安全機制：<\/li>\n<li><strong>Keep Alive<\/strong>：客戶端定期送訊息維持連線，偵測斷線；Broker 在約定時間的特定倍數內沒收到封包就斷線。<\/li>\n<li><strong>遺囑 LWT（Last Will and Testament）<\/strong>：裝置<strong>非正常斷線<\/strong>（沒電、網路斷）時，Broker 代為發送預設的遺囑訊息通知大家。<\/li>\n<li><strong>TLS/SSL<\/strong>：加密、身分驗證、訊息完整性。<\/li>\n<li><span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-45 練習題<\/span> <strong>保留訊息（Retained Message）<\/strong>：發布者可要求 Broker 保留一份最新訊息，給<strong>新加入的訂閱者<\/strong>立刻收到。<\/li>\n<\/ul>\n<h2>8. MQTT QoS 三等級（必考） <span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-61～4-62<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>QoS<\/th>\n<th>名稱<\/th>\n<th>保證<\/th>\n<th>代價<\/th>\n<th>適用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>最多一次 At most once<\/td>\n<td><strong>不確認、不重傳，可能遺失<\/strong><\/td>\n<td>最省<\/td>\n<td>不重要資料、網路良好<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>至少一次 At least once<\/td>\n<td>等確認，沒收到就重傳 → <strong>保證到達但可能重複<\/strong><\/td>\n<td>中<\/td>\n<td>接收方要能處理重複<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>恰好一次 Exactly once<\/td>\n<td><strong>四步驟握手<\/strong>，保證只收到一次、不重複<\/td>\n<td>最耗資源與時間<\/td>\n<td>關鍵訊息（如計費、控制指令）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 記法<\/strong>：0＝「丟了就算」、1＝「一定到，可能兩次」、2＝「剛剛好一次」。<strong>沒有 QoS 3<\/strong>。QoS 越高越可靠、開銷越大。<\/p>\n<\/blockquote>\n<h2>9. Modbus <span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-63～4-65<\/span><\/h2>\n<p>工業設備常用（PLC、溫控器、伺服驅動器），格式簡單；可走串列（RS-232、RS-485）或 TCP/IP。<strong>不支援加密與身分驗證<\/strong>，在不受信任網路易被監聽、竄改、偽造。<strong>Modbus TCP 常用 502 埠<\/strong>。採<strong>主從（Master/Slave 或 Client/Server）架構<\/strong>。<\/p>\n<table>\n<thead>\n<tr>\n<th>模式<\/th>\n<th>編碼<\/th>\n<th>實體<\/th>\n<th>錯誤檢查<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Modbus RTU<\/td>\n<td><strong>二進制<\/strong>，效率高<\/td>\n<td>RS-232／RS-485<\/td>\n<td><strong>CRC<\/strong>（循環冗餘檢查）<\/td>\n<\/tr>\n<tr>\n<td>Modbus ASCII<\/td>\n<td><strong>ASCII<\/strong>，可讀性好<\/td>\n<td>RS-232／RS-485<\/td>\n<td><strong>LRC<\/strong>（縱向冗餘檢查）<\/td>\n<\/tr>\n<tr>\n<td>Modbus TCP/IP<\/td>\n<td>TCP/IP 封裝<\/td>\n<td>乙太網路、LAN<\/td>\n<td>由 TCP 負責；通訊前要建立連線<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>四種資料區塊<\/strong>：<\/p>\n<table>\n<thead>\n<tr>\n<th>區塊<\/th>\n<th>型態<\/th>\n<th>讀寫<\/th>\n<th>位址範圍<\/th>\n<th>用途<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Coil 線圈<\/td>\n<td>位元（布林）<\/td>\n<td><strong>可讀可寫<\/strong><\/td>\n<td>00001–09999<\/td>\n<td>控制開/關、繼電器<\/td>\n<\/tr>\n<tr>\n<td>Discrete Input 離散輸入<\/td>\n<td>位元<\/td>\n<td><strong>唯讀<\/strong><\/td>\n<td>10001–19999<\/td>\n<td>顯示開關狀態<\/td>\n<\/tr>\n<tr>\n<td>Input Register 輸入暫存器<\/td>\n<td>16 位元字<\/td>\n<td><strong>唯讀<\/strong><\/td>\n<td>30001–39999<\/td>\n<td>讀溫度、壓力等類比值<\/td>\n<\/tr>\n<tr>\n<td>Holding Register 保持暫存器<\/td>\n<td>16 位元字<\/td>\n<td><strong>可讀可寫<\/strong><\/td>\n<td>40001–49999<\/td>\n<td>類比輸出、設定參數<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 記法<\/strong>：「0 線圈、1 離散、3 輸入、4 保持」；<strong>位元<\/strong>的是 Coil／Discrete，<strong>16 位元<\/strong>的是 Register；能寫的只有 <strong>Coil 與 Holding<\/strong>。<\/p>\n<\/blockquote>\n<h2>10. RESTful API <span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-65～4-68<\/span><\/h2>\n<p>基於 HTTP，用 <strong>URL 當資源唯一識別（URI）<\/strong>，用 HTTP 方法做 <strong>CRUD<\/strong>；特性：<strong>統一介面<\/strong>、<strong>客戶端/伺服器端分離<\/strong>。<\/p>\n<table>\n<thead>\n<tr>\n<th>方法<\/th>\n<th>用途<\/th>\n<th>常見成功碼<\/th>\n<th>常見錯誤碼<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>GET<\/td>\n<td>讀取（Read）<\/td>\n<td>200 OK<\/td>\n<td>404 Not Found<\/td>\n<\/tr>\n<tr>\n<td>POST<\/td>\n<td>建立（Create）<\/td>\n<td><strong>201 Created<\/strong><\/td>\n<td>400 Bad Request、409 Conflict<\/td>\n<\/tr>\n<tr>\n<td>PUT<\/td>\n<td>更新或在指定 URI 建立<\/td>\n<td>200 OK／201 Created<\/td>\n<td>404 Not Found<\/td>\n<\/tr>\n<tr>\n<td>DELETE<\/td>\n<td>刪除<\/td>\n<td><strong>204 No Content<\/strong><\/td>\n<td>403 Forbidden、404 Not Found<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>開發測試工具：<strong>Mock Server<\/strong>（模擬後端，讓前後端平行開發，可模擬錯誤、延遲、節流）、<strong>Postman<\/strong>（模擬 Client，設定參數、標頭、Body，看狀態碼與回應時間、寫測試腳本）。<\/p>\n<h3>今日 30 秒回顧<\/h3>\n<p>MQTT＝TCP＋Pub/Sub＋2 Bytes＋QoS；CoAP＝UDP＋REST＋4 Bytes；HTTP 標頭大、要輪詢｜封裝加標頭、解封裝去標頭｜TCP 可靠、UDP 快｜OPC UA：跨平台、內建資安、Client/Server、讀寫/資料變更/方法/事件｜MTConnect：唯讀、XML、HTTP；Device→Adapter→Agent→Application｜QoS 0 可能遺失、1 可能重複、2 恰好一次｜Modbus：RTU-CRC、ASCII-LRC、TCP-502；0/1/3/4｜REST：POST 201、DELETE 204。<\/p>", "audio": {"src": "audio/d03.mp3", "dur": 749}, "questions": [{"id": "d3q1", "n": 1, "opts": ["CoAP", "HTTP/HTTPS", "FTP", "SMTP"], "exp": "CoAP 是「輕量版 HTTP」，走 UDP、支援 REST 模型（GET、POST、PUT、DELETE），標頭約 4 Bytes，不需維持長連線，喚醒時間更短，適合 NB-IoT 設備與需數年電池壽命的感測器。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某電池供電的微型土壤感測器希望封包最小、喚醒時間最短，並且讓熟悉 HTTP 的工程師能用 GET/PUT 操作資源。最適合的協定是？", "ref": "考科一 2.2", "src": "指引 p.4-41～4-42", "ans": 0, "stemH": "某電池供電的微型土壤感測器希望封包最小、喚醒時間最短，並且讓熟悉 HTTP 的工程師能用 GET/PUT 操作資源。最適合的協定是？", "optsH": ["CoAP", "HTTP/HTTPS", "FTP", "SMTP"], "expH": "CoAP 是「輕量版 HTTP」，走 UDP、支援 REST 模型（GET、POST、PUT、DELETE），標頭約 4 Bytes，不需維持長連線，喚醒時間更短，適合 NB-IoT 設備與需數年電池壽命的感測器。"}, {"id": "d3q2", "n": 2, "opts": ["CoAP－UDP－請求/回應", "HTTP－TCP/IP－發布/訂閱", "MQTT－UDP－請求/回應", "MQTT－TCP/IP－請求/回應"], "exp": "MQTT：TCP/IP＋發布/訂閱；HTTP：TCP/IP＋請求/回應；CoAP：UDP＋請求/回應。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "依指引的 MQTT、HTTP、CoAP 比較表，下列對應何者正確？", "ref": "考科一 2.2", "src": "指引 p.4-42", "ans": 0, "stemH": "依指引的 MQTT、HTTP、CoAP 比較表，下列對應何者正確？", "optsH": ["CoAP－UDP－請求/回應", "HTTP－TCP/IP－發布/訂閱", "MQTT－UDP－請求/回應", "MQTT－TCP/IP－請求/回應"], "expH": "MQTT：TCP/IP＋發布/訂閱；HTTP：TCP/IP＋請求/回應；CoAP：UDP＋請求/回應。"}, {"id": "d3q3", "n": 3, "opts": ["資料從傳送端往下傳遞時，每經過一層就加上該層的標頭", "資料抵達接收端往上傳時，每經過一層就再加上一層標頭", "封裝只發生在實體層", "使用 Modbus 或 MQTT 函式庫時，完全不涉及封裝概念"], "exp": "往下傳加標頭＝封裝；往上傳去標頭＝解封裝。指引 p.4-49 也說明在應用層使用 Modbus 或 MQTT 函式庫時，封裝與解封裝的概念同樣適用。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "關於網路通訊的「封裝（Encapsulation）」，下列敘述何者正確？", "ref": "考科一 2.3", "src": "指引 p.4-49", "ans": 0, "stemH": "關於網路通訊的「封裝（Encapsulation）」，下列敘述何者正確？", "optsH": ["資料從傳送端往下傳遞時，每經過一層就加上該層的標頭", "資料抵達接收端往上傳時，每經過一層就再加上一層標頭", "封裝只發生在實體層", "使用 Modbus 或 MQTT 函式庫時，完全不涉及封裝概念"], "expH": "往下傳加標頭＝封裝；往上傳去標頭＝解封裝。指引 p.4-49 也說明在應用層使用 Modbus 或 MQTT 函式庫時，封裝與解封裝的概念同樣適用。"}, {"id": "d3q4", "n": 4, "opts": ["MBAP Header", "CRC", "LRC", "TCP checksum"], "exp": "Modbus RTU 使用循環冗餘檢查（CRC）；Modbus ASCII 使用 LRC；Modbus TCP 則加上 MBAP Header 並經 TCP/IP 傳送。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "一個 Modbus RTU 請求經由 RS-485 傳送，接收端解封裝時最先需要驗證的錯誤檢查碼是？", "ref": "考科一 2.3", "src": "指引 p.4-50", "ans": 1, "stemH": "一個 Modbus RTU 請求經由 RS-485 傳送，接收端解封裝時最先需要驗證的錯誤檢查碼是？", "optsH": ["MBAP Header", "CRC", "LRC", "TCP checksum"], "expH": "Modbus RTU 使用循環冗餘檢查（CRC）；Modbus ASCII 使用 LRC；Modbus TCP 則加上 MBAP Header 並經 TCP/IP 傳送。"}, {"id": "d3q5", "n": 5, "opts": ["由 OPC 基金會開發，可跨平台實作於嵌入式設備到雲端", "內建認證、授權、資料完整性與加密通訊等安全機制", "採用 Client/Server 架構，Server 通常位於設備端", "只能讀取資料、不能寫入，資料一律以 XML 經 HTTP 傳送"], "exp": "D 描述的是 MTConnect（唯讀、XML、HTTP）。OPC UA 支援讀/寫、方法呼叫、資料變更通知與事件通知。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "關於 OPC UA 的敘述，下列何者「不」正確？", "ref": "考科一 2.3", "src": "指引 p.4-52", "ans": 3, "stemH": "關於 OPC UA 的敘述，下列何者「不」正確？", "optsH": ["由 OPC 基金會開發，可跨平台實作於嵌入式設備到雲端", "內建認證、授權、資料完整性與加密通訊等安全機制", "採用 Client/Server 架構，Server 通常位於設備端", "只能讀取資料、不能寫入，資料一律以 XML 經 HTTP 傳送"], "expH": "D 描述的是 MTConnect（唯讀、XML、HTTP）。OPC UA 支援讀/寫、方法呼叫、資料變更通知與事件通知。"}, {"id": "d3q6", "n": 6, "opts": ["Read/Write", "Data Change Notification", "Event Notification", "Method"], "exp": "OPC UA 伺服器可提供可執行的方法（Method），客戶端遠端呼叫以執行特定操作，例如自動換刀。訂閱變數變化用 Data Change；訂閱故障等事件用 Event Notification。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "操作員希望透過 OPC UA 客戶端「遠端觸發」工具機的自動換刀程序，應使用哪一種資料存取方式？", "ref": "考科一 2.3", "src": "指引 p.4-55", "ans": 3, "stemH": "操作員希望透過 OPC UA 客戶端「遠端觸發」工具機的自動換刀程序，應使用哪一種資料存取方式？", "optsH": ["Read/Write", "Data Change Notification", "Event Notification", "Method"], "expH": "OPC UA 伺服器可提供可執行的方法（Method），客戶端遠端呼叫以執行特定操作，例如自動換刀。訂閱變數變化用 Data Change；訂閱故障等事件用 Event Notification。"}, {"id": "d3q7", "n": 7, "opts": ["Device", "Adapter", "Agent", "Application"], "exp": "Agent 是 MTConnect 的核心軟體服務，負責資料緩存、格式化與傳輸。Adapter 負責存取設備資料並轉成 XML（例如用 FOCAS 讀發那科控制器）。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "在 MTConnect 架構中，負責整合一個或多個 Adapter 的資料、以標準 XML 儲存，並透過 HTTP RESTful API 提供給外部應用的元素是？", "ref": "考科一 2.3", "src": "指引 p.4-58", "ans": 2, "stemH": "在 MTConnect 架構中，負責整合一個或多個 Adapter 的資料、以標準 XML 儲存，並透過 HTTP RESTful API 提供給外部應用的元素是？", "optsH": ["Device", "Adapter", "Agent", "Application"], "expH": "Agent 是 MTConnect 的核心軟體服務，負責資料緩存、格式化與傳輸。Adapter 負責存取設備資料並轉成 XML（例如用 FOCAS 讀發那科控制器）。"}, {"id": "d3q8", "n": 8, "opts": ["發布者必須知道每一位訂閱者的 IP 位址", "Broker 依主題（Topic）過濾並把訊息轉發給訂閱該主題的訂閱者", "訂閱者需主動輪詢發布者才能取得資料", "只要有一個感測器故障，所有訂閱者都會停止運作"], "exp": "Broker 是 MQTT 核心，接收發布者訊息並依主題過濾分發。Pub/Sub 架構讓發布者與訂閱者完全解耦，部分裝置離線不影響其他裝置。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "關於 MQTT 的 Broker，下列敘述何者正確？", "ref": "考科一 2.3", "src": "指引 p.4-59～4-60", "ans": 1, "stemH": "關於 MQTT 的 Broker，下列敘述何者正確？", "optsH": ["發布者必須知道每一位訂閱者的 IP 位址", "Broker 依主題（Topic）過濾並把訊息轉發給訂閱該主題的訂閱者", "訂閱者需主動輪詢發布者才能取得資料", "只要有一個感測器故障，所有訂閱者都會停止運作"], "expH": "Broker 是 MQTT 核心，接收發布者訊息並依主題過濾分發。Pub/Sub 架構讓發布者與訂閱者完全解耦，部分裝置離線不影響其他裝置。"}, {"id": "d3q9", "n": 9, "opts": ["QoS 0", "Retained Message", "遺囑訊息（Last Will and Testament, LWT）", "TLS/SSL"], "exp": "LWT 讓客戶端預設一則在非正常斷線時由 Broker 代為發布的訊息。Retained Message 是讓新訂閱者收到最新一筆；TLS 是加密；QoS 是傳遞保證等級。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某電池供電的 MQTT 感測器突然沒電而非正常斷線，希望 Broker 能自動通知所有訂閱者「此裝置已離線」。應使用哪一項機制？", "ref": "考科一 2.3", "src": "指引 p.4-61", "ans": 2, "stemH": "某電池供電的 MQTT 感測器突然沒電而非正常斷線，希望 Broker 能自動通知所有訂閱者「此裝置已離線」。應使用哪一項機制？", "optsH": ["QoS 0", "Retained Message", "遺囑訊息（Last Will and Testament, LWT）", "TLS/SSL"], "expH": "LWT 讓客戶端預設一則在非正常斷線時由 Broker 代為發布的訊息。Retained Message 是讓新訂閱者收到最新一筆；TLS 是加密；QoS 是傳遞保證等級。"}, {"id": "d3q10", "n": 10, "opts": ["QoS 0", "QoS 1", "QoS 2", "QoS 3"], "exp": "QoS 1（至少一次）保證送達但可能重複，接收方需處理重複；QoS 2 恰好一次但需四步驟握手、開銷最大；QoS 0 可能遺失；MQTT 沒有 QoS 3。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某系統的訂閱端可以處理重複訊息，但要求訊息「一定要送到」，同時希望開銷比最高等級小。應選擇哪一個 MQTT QoS？", "ref": "考科一 2.3", "src": "指引 p.4-62", "ans": 1, "stemH": "某系統的訂閱端可以處理重複訊息，但要求訊息「一定要送到」，同時希望開銷比最高等級小。應選擇哪一個 MQTT QoS？", "optsH": ["QoS 0", "QoS 1", "QoS 2", "QoS 3"], "expH": "QoS 1（至少一次）保證送達但可能重複，接收方需處理重複；QoS 2 恰好一次但需四步驟握手、開銷最大；QoS 0 可能遺失；MQTT 沒有 QoS 3。"}, {"id": "d3q11", "n": 11, "opts": ["Coil", "Discrete Input", "Input Register", "Holding Register"], "exp": "Holding Register 為可讀可寫的 16 位元資料區塊（40001–49999），用於設定參數或類比輸出。Input Register 是唯讀 16 位元；Coil 可讀寫但是位元（開/關）；Discrete Input 唯讀位元。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "在 Modbus 協定中，要「寫入」溫控器的溫度設定值（16 位元數值），應存取哪一種資料區塊？", "ref": "考科一 2.3", "src": "指引 p.4-64～4-65", "ans": 3, "stemH": "在 Modbus 協定中，要「寫入」溫控器的溫度設定值（16 位元數值），應存取哪一種資料區塊？", "optsH": ["Coil", "Discrete Input", "Input Register", "Holding Register"], "expH": "Holding Register 為可讀可寫的 16 位元資料區塊（40001–49999），用於設定參數或類比輸出。Input Register 是唯讀 16 位元；Coil 可讀寫但是位元（開/關）；Discrete Input 唯讀位元。"}, {"id": "d3q12", "n": 12, "opts": ["200 OK", "201 Created", "204 No Content", "404 Not Found"], "exp": "指引 p.4-67：成功的 DELETE 通常回傳 204 No Content。POST 成功建立資源回 201；GET 成功回 200；資源不存在回 404。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "在 RESTful API 中，以 DELETE 成功刪除一筆設備資料，且伺服器不回傳任何內容，通常回傳哪一個狀態碼？", "ref": "考科一 2.3", "src": "指引 p.4-67", "ans": 2, "stemH": "在 RESTful API 中，以 DELETE 成功刪除一筆設備資料，且伺服器不回傳任何內容，通常回傳哪一個狀態碼？", "optsH": ["200 OK", "201 Created", "204 No Content", "404 Not Found"], "expH": "指引 p.4-67：成功的 DELETE 通常回傳 204 No Content。POST 成功建立資源回 201；GET 成功回 200；資源不存在回 404。"}]}, {"id": 4, "date": "2026-10-21", "subject": "考科一", "type": "study", "title": "中介軟體與平台、資安與隱私", "short": "平台＋資安隱私", "lectureChars": 5503, "lecture": "<h3>今天要搞懂的 5 件事<\/h3>\n<ol>\n<li>「中介軟體與平台」涵蓋哪些層：連線技術 → 網路層 → 訊息中介 → 雲端平台 → 應用層決策。<\/li>\n<li>訊息中介軟體（MQTT、AMQP、Kafka）為什麼能「解耦」與「削峰」。<\/li>\n<li>地端／純雲／混合雲；IaaS、PaaS、SaaS 的分界與例子。<\/li>\n<li>資料儲存（關聯式 ACID、NoSQL、快取）、通訊模式、身分驗證、ETL 與分析。<\/li>\n<li>資安：加密（對稱/非對稱）、雜湊、數位簽章、AAA、CIA、DR/RPO/RTO、常見攻擊；隱私：去識別化、資料最小化、同意、目的限制。<\/li>\n<\/ol>\n<h2>1. 中介軟體與平台的範圍 <span class=\"ref\">考科一 2.4<\/span><span class=\"pg\">指引 p.4-73～4-74<\/span><\/h2>\n<p>指引定義：感測資料經<strong>感測閘道器<\/strong>接收後，一直到提供 AIoT 應用服務之間的<strong>所有軟體元件與通訊協定<\/strong>；在 IoT 分層上涵蓋<strong>網路層與應用層<\/strong>。<\/p>\n<p><strong>(1) 閘道器的連線技術<\/strong>：Ethernet、Datacom（4G/5G）、Wi-Fi、LPWAN；工業環境另有 RS232/485、Modbus、EtherCAT。分成兩類協定：\n- <strong>實體層（硬體）協定<\/strong>：定義電壓、接腳、連線方式。\n- <strong>網路層（軟體）協定<\/strong>：定義通訊格式與內容。\n- 例：智慧城市常用 <strong>Ethernet＋TCP/IP<\/strong>；工業常用 <strong>RS232/485＋Modbus RTU<\/strong> 或 <strong>Ethernet＋Modbus TCP/IP<\/strong>。\n- 有線區域網路最普及的標準是 <strong>IEEE 802.3（Ethernet）<\/strong>，如 100Base-T／1000Base-T，用雙絞線或光纖。<\/p>\n<p><strong>(2) 網路層協定<\/strong>：負責定址與路由，常見 <strong>IPv4、IPv6<\/strong>；其上再由傳輸層（TCP/UDP）提供端對端傳輸、應用層（HTTP、Modbus TCP、DNS）處理應用格式。<\/p>\n<h2>2. 訊息中介軟體 <span class=\"ref\">考科一 2.4<\/span><span class=\"pg\">指引 p.4-74～4-75<\/span><\/h2>\n<p>感測器多、資料量暴增時，加入<strong>訊息中介軟體<\/strong>當緩衝，把「資料接收」與「應用處理」<strong>解耦（Decoupling）<\/strong>。<\/p>\n<table>\n<thead>\n<tr>\n<th>協定<\/th>\n<th>對應軟體<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>MQTT、AMQP<\/td>\n<td>RabbitMQ、Apache ActiveMQ<\/td>\n<\/tr>\n<tr>\n<td>Kafka<\/td>\n<td>Kafka<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>四個要點：\n- <strong>QoS<\/strong>：最多一次、最少一次、剛好一次（概念同 MQTT QoS）。\n- <strong>Pub/Sub 角色<\/strong>：Publisher（產生者）、Subscriber（接收者）、Broker（分派者），依 Topic 分派。\n- <strong>資料保存<\/strong>：訊息在分派前不能因斷電當機遺失 → 選具**永久儲存（Persistent Storage）**能力的，如 <strong>Kafka<\/strong>。\n- <strong>高併發緩衝<\/strong>：暫存後逐一分派，保護後端電腦與資料庫不被衝垮，也讓後端規格能用 CP 值較高的方式設計。<\/p>\n<h2>3. 地端、純雲、混合雲與 IaaS/PaaS/SaaS <span class=\"ref\">考科一 2.4<\/span><span class=\"pg\">指引 p.4-75～4-77<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>架構<\/th>\n<th>說明<\/th>\n<th>例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>地端 On-Premise<\/td>\n<td>營運與管理屬於企業內部（實體機或 VMware、Proxmox 虛擬化），重點不是機器規模<\/td>\n<td>小型或封閉系統<\/td>\n<\/tr>\n<tr>\n<td>純雲 Pure-cloud<\/td>\n<td>所有軟體元件都在雲端業者環境內<\/td>\n<td>S3／Cloud Storage、RDS／Cloud SQL、EC2／Compute Engine、AWS IoT Core／GCP Pub/Sub<\/td>\n<\/tr>\n<tr>\n<td>混合雲 Hybrid-cloud<\/td>\n<td>部分資料與邏輯在地端、部分在雲端<\/td>\n<td>原因：資料安全、內部網路、上雲速度與規劃耗時<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th>服務模型<\/th>\n<th>雲端給你什麼<\/th>\n<th>你要自己管什麼<\/th>\n<th>例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>IaaS 基礎設施即服務<\/td>\n<td>虛擬網路、虛擬電腦等<strong>虛擬硬體<\/strong><\/td>\n<td>OS、資料庫版本更新、備份、應用<\/td>\n<td>租 EC2 自己裝 SQL Server<\/td>\n<\/tr>\n<tr>\n<td>PaaS 平台即服務<\/td>\n<td>在 IaaS 上整合 OS、執行環境、資料庫、網頁伺服器、維運<\/td>\n<td>主要只管應用程式<\/td>\n<td><strong>AWS RDS／GCP Cloud SQL<\/strong>（已含修補與備份）、AWS IoT Core、Vertex AI<\/td>\n<\/tr>\n<tr>\n<td>SaaS 軟體即服務<\/td>\n<td>直接可用的軟體服務<\/td>\n<td>只管使用與設定<\/td>\n<td>應用業者部署給終端客戶的服務<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>指引觀點：<strong>PaaS 對應用業者最有價值<\/strong>，可降低 <strong>CI（持續整合）、CD（持續交付／持續部署）、DevOps<\/strong> 的負擔；不用 PaaS 的話，跟傳統 IDC 機房模式差不多。<\/li>\n<\/ul>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：「提供作業系統、程式執行環境、資料庫及網頁伺服器的開發平台」＝ <strong>PaaS<\/strong>（指引 p.4-80 練習題）。自己裝資料庫＝IaaS；用託管資料庫＝PaaS。<\/p>\n<\/blockquote>\n<h2>4. 應用層的決策：儲存、通訊、驗證、分析、服務 <span class=\"ref\">考科一 2.4<\/span><span class=\"pg\">指引 p.4-77～4-79<\/span><\/h2>\n<p><strong>(1) 資料儲存<\/strong>\n| 資料型態 | 例 | 存放 |\n|---|---|---|\n| 結構化 | 表格欄位固定的感測紀錄 | <strong>關聯式資料庫<\/strong>：嚴謹結構、以鍵值關聯；提供 <strong>ACID<\/strong>（原子性 Atomicity、一致性 Consistency、隔離性 Isolation、持久性 Durability） |\n| 半結構化 | <strong>JSON、YAML、XML<\/strong> | <strong>NoSQL<\/strong>：特色是<strong>橫向擴充<\/strong>、對大數據友善 |\n| 非結構化 | 圖文檔案、圖片 | 物件儲存（如 S3）、向量資料庫；經 OCR、向量計算可轉成半結構化 |\n| 高時效 | 即時查詢 | <strong>記憶體快取（Memory-cache）<\/strong>：Redis、Memcached（&lt; 5 ms） |<\/p>\n<p><strong>(2) 元件間通訊模式<\/strong>：請求-回應（HTTP、REST、gRPC、GraphQL）、非同步訊息驅動（AMQP、MQTT、Kafka）、遠端程序呼叫 RPC（gRPC、Apache Thrift、Apache Dubbo）。<\/p>\n<p><strong>(3) 身分驗證機制<\/strong>\n| 機制 | 特性 | 適用 |\n|---|---|---|\n| X.509 憑證 | 安全性極高，但運算與管理複雜、資源負擔重 | 閘道器、車聯網 |\n| Token（JWT、Basic Auth、Bearer token） | 輕量簡單 | 應用服務的軟體元件 |\n| 共享金鑰 PSK（Pre-shared key） | 運算最輕 | <strong>算力極低的設備<\/strong> |\n| 硬體安全模組 TPM、HSM | 做密碼學運算，遭惡意破壞也不洩漏金鑰 | 高安全硬體 |\n| 帳號密碼 | 最基本 | 使用者登入 |<\/p>\n<p><strong>(4) 資料分析三層次<\/strong>：統計與描述性分析（中位數、標準差、極值＋Dashboard、Alert）→ 資料探勘與關聯分析（找離群點、分群；需大量 <strong>ETL：擷取 Extract、轉換 Transform、載入 Load<\/strong> 清洗資料，再用 <strong>Hadoop、Spark、BigQuery<\/strong> 處理海量資料）→ <strong>AI/ML<\/strong>。<\/p>\n<p><strong>(5) 服務提供<\/strong>：APP（Android/iPhone，原生 Java/Swift 或跨平台 Flutter）與 WEB（本質是 HTML＋JavaScript＋CSS）。<\/p>\n<p><span class=\"ref\">考科一 2.4<\/span><span class=\"pg\">指引 p.4-80～4-84 練習題<\/span> 練習題重點：雲端讓感測元件不需強大算力、易擴展；但<strong>雲端即時處理的主要挑戰是網路延遲較高<\/strong>；雲端資安考量應是<strong>最小權限<\/strong>而非最大權限；大數據工具（Hadoop）的價值在「<strong>資料處理與分析能力<\/strong>」。<\/p>\n<h2>5. 資安三大技術：加密、雜湊、簽章 <span class=\"ref\">考科一 2.5<\/span><span class=\"pg\">指引 p.4-85<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>技術<\/th>\n<th>解決什麼<\/th>\n<th>常見演算法／重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>對稱式加解密<\/td>\n<td>防<strong>竊聽<\/strong>（機密性），雙方用<strong>同一把金鑰<\/strong><\/td>\n<td>AES、DES、Twofish；需金鑰交換：<strong>DHE、ECDH（Elliptic Curve DH）<\/strong><\/td>\n<\/tr>\n<tr>\n<td>PSK 預載金鑰<\/td>\n<td>感測節點算力弱，避免複雜的非對稱金鑰交換<\/td>\n<td>Sensor node 可明文或用 PSK 加密<\/td>\n<\/tr>\n<tr>\n<td>雜湊 Hash<\/td>\n<td>不易由結果反推原文；<strong>輕量地保護密碼、API 金鑰<\/strong>；單獨使用只能確保<strong>完整性<\/strong><\/td>\n<td>SHA256、SHA512、SHA3<\/td>\n<\/tr>\n<tr>\n<td>數位簽章（非對稱）<\/td>\n<td>證明「確實是他發的、內容沒被假造」→ <strong>不可否認性（Non-repudiation）<\/strong><\/td>\n<td>私鑰簽、公鑰驗<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 非對稱金鑰口訣<\/strong>：要<strong>保密<\/strong>給 B → 用 <strong>B 的公鑰<\/strong>加密，B 用自己的私鑰解；要<strong>簽章<\/strong>證明是 A → A 用<strong>自己的私鑰<\/strong>加密（簽），B 用 <strong>A 的公鑰<\/strong>解（驗）。（指引 p.4-91 練習題：A 用自己的金鑰加密，B 用 A 的公鑰解開）<\/p>\n<\/blockquote>\n<h2>6. IoT 常見風險與攻擊 <span class=\"ref\">考科一 2.5<\/span><span class=\"pg\">指引 p.4-86～4-87<\/span><\/h2>\n<ul>\n<li><strong>預設帳號密碼／弱加密<\/strong>（如 RC2、RC4）：攻擊者用自動化工具掃描取得存取權。<\/li>\n<li><strong>韌體漏洞<\/strong>：IoT 更新不易且數量多，已知漏洞可存在數年；加入 <strong>OTA<\/strong> 更新機制可改善，但不是每台都有算力。<\/li>\n<li><strong>網路攻擊<\/strong>：中間人攻擊（MITM）、殭屍網路（Botnet）、阻斷服務（DoS）、分散式阻斷服務（DDoS）、竊聽、竄改。<\/li>\n<li><strong>實體入侵<\/strong>：透過電路板上的 <strong>JTAG/UART/Console<\/strong> 直接取得管理權限 → 量產設備應<strong>關閉 JTAG/Console<\/strong>。<\/li>\n<li>被大量入侵的 IoT 可能<strong>反過來變成攻擊工具<\/strong>，發動 Botnet 攻擊下游（Edge、Cloud server）→ 重要系統要做<strong>網路隔離（Network isolation）<\/strong>，切斷橫向攻擊。<\/li>\n<\/ul>\n<blockquote>\n<p><strong>💡 經典案例<\/strong>：<strong>Mirai<\/strong> 感染數十萬台攝影機、路由器組成殭屍網路，發動 <strong>DDoS<\/strong>（指引 p.4-91 練習題）。<\/p>\n<\/blockquote>\n<h2>7. 資安核心觀念：AAA、CIA、裝置與平台防護 <span class=\"ref\">考科一 2.5<\/span><span class=\"pg\">指引 p.4-86～4-88<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>框架<\/th>\n<th>內容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>AAA<\/strong><\/td>\n<td>認證 Authentication（你是誰）、授權 Authorization（依身分給權限）、稽核 Auditing（事後追查時間、人員、結果）<\/td>\n<\/tr>\n<tr>\n<td><strong>CIA<\/strong><\/td>\n<td>機密性 Confidentiality（加密、身份驗證、遮罩、存取控制）、完整性 Integrity（雜湊；<strong>訊息鑑別碼 MAC<\/strong>）、可用性 Availability（SLA、Load Balancer 高可用；會被 DDoS、SYN Flood、Broadcast Storm 降低）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>SLA 換算<\/strong>：99% ≈ 每月 7.2 小時停機；99.99% ≈ 每月 4.3 分鐘。<\/li>\n<li><strong>裝置防護<\/strong>：閘道器注意預設密碼、實體接線、韌體 N 日攻擊；<strong>韌體簽章（Secure boot）＋OTA encryption<\/strong>；裝置認證依能力選 PSK、API key、Token、<strong>mTLS<\/strong>、X.509；通訊依重要性選加密、MAC、簽章。<\/li>\n<li><strong>平台防護<\/strong>：<strong>防火牆白名單<\/strong>（Layer 2/3，限制來源 IP 與 port，簡單快速）；<strong>WAF 網頁應用程式防火牆<\/strong>（拆到應用層，可防 <strong>SQL Injection、XSS、Bot attack<\/strong>）。<\/li>\n<li>練習題：<strong>認證方式中「密碼」防護較差<\/strong>（生物特徵如靜脈、瞳孔、指紋不易偽造）；<strong>中繼器（Repeater）無法做網路隔離<\/strong>，VLAN、防火牆、不同 SSID 可以；鐵殼保護 PLC <strong>無法防 DoS<\/strong>。<\/li>\n<\/ul>\n<h2>8. 資料安全：DR、RPO、RTO 與 SDLC 掃描 <span class=\"ref\">考科一 2.5<\/span><span class=\"pg\">指引 p.4-88～4-89<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>名詞<\/th>\n<th>意思<\/th>\n<th>例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>DR 災難復原<\/td>\n<td>災難後如何快速恢復系統與資料<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>RPO<\/strong> 復原點目標<\/td>\n<td><strong>最多會遺失多少時間的資料<\/strong><\/td>\n<td>一天備份一次 → RPO＝24 hr<\/td>\n<\/tr>\n<tr>\n<td><strong>RTO<\/strong> 復原時間目標<\/td>\n<td><strong>系統要多久恢復服務（停機時間）<\/strong><\/td>\n<td>靠雲端部署、多用 PaaS、CI/CD 縮短<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 記法<\/strong>：RP<strong>O<\/strong>＝資料「<strong>點<\/strong>」回到哪裡（丟多少資料）；RT<strong>O<\/strong>＝「<strong>時間<\/strong>」多久回來（停多久）。<\/p>\n<\/blockquote>\n<p>SDLC 資安掃描：開發階段<strong>靜態程式碼弱點掃描<\/strong>、<strong>第三方函式庫（套件）弱點掃描<\/strong>、測試階段對運行中系統做<strong>弱點掃描<\/strong>、上線前與定期做<strong>滲透測試<\/strong>。<\/p>\n<h2>9. 物聯網隱私四原則 <span class=\"ref\">考科一 2.5<\/span><span class=\"pg\">指引 p.4-89～4-90<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>原則<\/th>\n<th>意思<\/th>\n<th>例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>匿名化／假名化 Anonymization / Pseudonymization<\/td>\n<td>遮罩去識別化，或把識別資料換成匿名編號，處理到無法追溯個人<\/td>\n<td>感測資料與個資在同表或可 Join 時要處理<\/td>\n<\/tr>\n<tr>\n<td>資料最小化 Data minimization<\/td>\n<td>只收集應用所需的必要資料<\/td>\n<td>門禁只記進出時間，不錄整段影像<\/td>\n<\/tr>\n<tr>\n<td>告知與同意、可攜與刪除<\/td>\n<td>告知收集哪些資料並取得同意；使用者可要求<strong>匯出<\/strong>與<strong>刪除<\/strong><\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>目的限制<\/td>\n<td>告知用途；<strong>要用在其他用途（例如匯入 AI 分析）須再次取得同意<\/strong><\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><span class=\"ref\">考科一 2.5<\/span><span class=\"supp\">補充<\/span> 一般區分：<strong>匿名化<\/strong>＝不可逆、無法再識別；<strong>假名化<\/strong>＝以代號取代，持有對照表仍可回推。指引將兩者並列說明，考題若問「無法追溯到個人」選匿名化較穩。<\/p>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：<strong>DDoS 監控<\/strong>屬可用性防護，<strong>對防止個資外洩沒有直接幫助<\/strong>；傳輸加密、身份認證與權限管控、去識別化才是（指引 p.4-92 練習題）。<\/p>\n<\/blockquote>\n<h3>今日 30 秒回顧<\/h3>\n<p>中介軟體＝閘道器之後到應用服務之間的一切｜訊息中介：解耦、緩衝、Kafka 永久儲存｜IaaS 虛擬硬體、PaaS 託管平台（RDS）、SaaS 軟體｜ACID＝關聯式；NoSQL 橫向擴充；Redis 快取｜X.509 重、Token 輕、PSK 最輕｜ETL＝擷取轉換載入｜對稱 AES＋ECDH 交換；雜湊＝完整性；簽章＝不可否認｜AAA、CIA｜RPO 丟多少、RTO 停多久｜Mirai＝DDoS｜Repeater 不能隔離｜匿名化、最小化、同意、目的限制。<\/p>", "audio": {"
