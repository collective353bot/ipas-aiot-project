": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某團隊租用雲端虛擬機自行安裝 SQL Server，必須自己更新作業系統與資料庫版本、做備份。若改用 AWS RDS／GCP Cloud SQL 這類託管資料庫，則屬於從哪一種服務模型改為哪一種？", "ref": "考科一 2.4", "src": "指引 p.4-76～4-77", "ans": 2, "stemH": "某團隊租用雲端虛擬機自行安裝 SQL Server，必須自己更新作業系統與資料庫版本、做備份。若改用 AWS RDS／GCP Cloud SQL 這類託管資料庫，則屬於從哪一種服務模型改為哪一種？", "optsH": ["從 SaaS 改為 IaaS", "從 PaaS 改為 IaaS", "從 IaaS 改為 PaaS", "從 On-Premise 改為 SaaS"], "expH": "指引 p.4-76～4-77：租 EC2／Compute Engine 自己裝 SQL Server 是 IaaS 的使用邏輯；RDS／Cloud SQL 已提供修補與備份，屬於 PaaS。"}, {"id": "d4q5", "n": 5, "opts": ["Concurrency（並行性）", "Consistency（一致性）", "Compression（壓縮性）", "Confidentiality（機密性）"], "exp": "ACID＝原子性 Atomicity、一致性 Consistency、隔離性 Isolation、持久性 Durability。Confidentiality 是資安 CIA 的 C，別搞混。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "關聯式資料庫提供的 ACID 特性中，「C」代表什麼？", "ref": "考科一 2.4", "src": "指引 p.4-77", "ans": 1, "stemH": "關聯式資料庫提供的 ACID 特性中，「C」代表什麼？", "optsH": ["Concurrency（並行性）", "Consistency（一致性）", "Compression（壓縮性）", "Confidentiality（機密性）"], "expH": "ACID＝原子性 Atomicity、一致性 Consistency、隔離性 Isolation、持久性 Durability。Confidentiality 是資安 CIA 的 C，別搞混。"}, {"id": "d4q6", "n": 6, "opts": ["X.509 憑證", "完全不做驗證", "大型語言模型驗證", "共享金鑰（Pre-shared key, PSK）"], "exp": "X.509 安全性極高但運算與管理負擔重，適合閘道器、車聯網；Token 適合應用服務的軟體元件；PSK 適合算力極低的設備。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "一顆算力極低的感測節點需要與閘道器互相驗證身份，指引建議較適合採用哪一種機制？", "ref": "考科一 2.4", "src": "指引 p.4-78", "ans": 3, "stemH": "一顆算力極低的感測節點需要與閘道器互相驗證身份，指引建議較適合採用哪一種機制？", "optsH": ["X.509 憑證", "完全不做驗證", "大型語言模型驗證", "共享金鑰（Pre-shared key, PSK）"], "expH": "X.509 安全性極高但運算與管理負擔重，適合閘道器、車聯網；Token 適合應用服務的軟體元件；PSK 適合算力極低的設備。"}, {"id": "d4q7", "n": 7, "opts": ["ETL", "ACID", "OTA", "SLA"], "exp": "ETL＝Extract（擷取）、Transform（轉換）、Load（載入），將原始資料清洗後導入 Hadoop、Spark、BigQuery 等大數據工具。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "在進行資料探勘之前，需要把雜亂的原始資料「擷取、轉換、載入」到大數據平台，這個過程稱為？", "ref": "考科一 2.4", "src": "指引 p.4-78", "ans": 0, "stemH": "在進行資料探勘之前，需要把雜亂的原始資料「擷取、轉換、載入」到大數據平台，這個過程稱為？", "optsH": ["ETL", "ACID", "OTA", "SLA"], "expH": "ETL＝Extract（擷取）、Transform（轉換）、Load（載入），將原始資料清洗後導入 Hadoop、Spark、BigQuery 等大數據工具。"}, {"id": "d4q8", "n": 8, "opts": ["以明文儲存", "以雜湊（如 SHA256）處理後儲存", "以 Base64 編碼儲存", "改用 UDP 傳輸"], "exp": "指引 p.4-85：雜湊不易由結果反推原文，能以輕量方式達到隱密效果，使用者帳號密碼、API 存取金鑰都可用雜湊處理。Base64 只是編碼、可直接還原。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "系統要「儲存使用者密碼」並且讓資料庫即使外洩也不容易被反推出原始密碼，最適合的處理方式是？", "ref": "考科一 2.5", "src": "指引 p.4-85", "ans": 1, "stemH": "系統要「儲存使用者密碼」並且讓資料庫即使外洩也不容易被反推出原始密碼，最適合的處理方式是？", "optsH": ["以明文儲存", "以雜湊（如 SHA256）處理後儲存", "以 Base64 編碼儲存", "改用 UDP 傳輸"], "expH": "指引 p.4-85：雜湊不易由結果反推原文，能以輕量方式達到隱密效果，使用者帳號密碼、API 存取金鑰都可用雜湊處理。Base64 只是編碼、可直接還原。"}, {"id": "d4q9", "n": 9, "opts": ["A 的私鑰", "A 的公鑰", "B 的公鑰", "B 的私鑰"], "exp": "保密：用接收者（B）的公鑰加密，只有持有 B 私鑰的人能解。若 A 用自己的私鑰加密，任何人都能用 A 的公鑰解開，那是「簽章」用途（證明是 A 發的、不可否認）。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "A 要傳送一份機密文件給 B，並希望只有 B 能解開。若使用非對稱式加密，A 應該用哪一把金鑰加密？", "ref": "考科一 2.5", "src": "指引 p.4-85", "ans": 2, "stemH": "A 要傳送一份機密文件給 B，並希望只有 B 能解開。若使用非對稱式加密，A 應該用哪一把金鑰加密？", "optsH": ["A 的私鑰", "A 的公鑰", "B 的公鑰", "B 的私鑰"], "expH": "保密：用接收者（B）的公鑰加密，只有持有 B 私鑰的人能解。若 A 用自己的私鑰加密，任何人都能用 A 的公鑰解開，那是「簽章」用途（證明是 A 發的、不可否認）。"}, {"id": "d4q10", "n": 10, "opts": ["量產設備關閉 JTAG／Console 介面", "使用韌體簽章（Secure boot）並搭配 OTA encryption", "保留出廠預設帳號密碼以方便維修", "重要系統做網路隔離，切斷橫向攻擊"], "exp": "預設帳號密碼是 IoT 最常見的入侵破口，必須更換。A、B、D 都是指引列出的防護措施。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "下列何者「不是」指引建議的 IoT 裝置防護措施？", "ref": "考科一 2.5", "src": "指引 p.4-86～4-87", "ans": 2, "stemH": "下列何者「不是」指引建議的 IoT 裝置防護措施？", "optsH": ["量產設備關閉 JTAG／Console 介面", "使用韌體簽章（Secure boot）並搭配 OTA encryption", "保留出廠預設帳號密碼以方便維修", "重要系統做網路隔離，切斷橫向攻擊"], "expH": "預設帳號密碼是 IoT 最常見的入侵破口，必須更換。A、B、D 都是指引列出的防護措施。"}, {"id": "d4q11", "n": 11, "opts": ["RPO 2 小時、RTO 6 小時", "RPO 6 小時、RTO 2 小時", "RPO 與 RTO 都是 6 小時", "RPO 與 RTO 都是 2 小時"], "exp": "RPO＝可能遺失多少時間的資料（取決於備份間隔，最多 6 小時）；RTO＝停機多久才恢復服務（2 小時）。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某系統每 6 小時備份一次資料庫，系統崩潰後約 2 小時恢復服務。則此系統的 RPO 與 RTO 分別約為？", "ref": "考科一 2.5", "src": "指引 p.4-88", "ans": 1, "stemH": "某系統每 6 小時備份一次資料庫，系統崩潰後約 2 小時恢復服務。則此系統的 RPO 與 RTO 分別約為？", "optsH": ["RPO 2 小時、RTO 6 小時", "RPO 6 小時、RTO 2 小時", "RPO 與 RTO 都是 6 小時", "RPO 與 RTO 都是 2 小時"], "expH": "RPO＝可能遺失多少時間的資料（取決於備份間隔，最多 6 小時）；RTO＝停機多久才恢復服務（2 小時）。"}, {"id": "d4q12", "n": 12, "opts": ["資料最小化（Data minimization）", "可用性（Availability）", "不可否認性（Non-repudiation）", "負載平衡（Load Balancing）"], "exp": "指引 p.4-89 正是以門禁系統為例：只收集應用所需的必要資料（進出時間），不記錄整個影像，即資料最小化。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "智慧門禁系統只記錄員工的進出時間與卡號，不錄存整段影像。這最符合哪一項隱私原則？", "ref": "考科一 2.5", "src": "指引 p.4-89", "ans": 0, "stemH": "智慧門禁系統只記錄員工的進出時間與卡號，不錄存整段影像。這最符合哪一項隱私原則？", "optsH": ["資料最小化（Data minimization）", "可用性（Availability）", "不可否認性（Non-repudiation）", "負載平衡（Load Balancing）"], "expH": "指引 p.4-89 正是以門禁系統為例：只收集應用所需的必要資料（進出時間），不記錄整個影像，即資料最小化。"}]}, {"id": 5, "date": "2026-10-22", "subject": "考科一", "type": "study", "title": "感測器原理、訊號、串列介面與調變", "short": "感測器＋訊號通訊", "lectureChars": 5449, "lecture": "<h3>今天要搞懂的 5 件事<\/h3>\n<ol>\n<li>感測器的三種分類方式與 8 個性能參數（誤差、精確度、重複性、靈敏度、解析度、量測範圍、線性度、遲滯）。<\/li>\n<li>力量／振動／溫度／位移／光感測器原理：壓電、應變規＋惠斯登電橋、NTC/PTC/CTR、RTD（Pt100）、熱電偶（席貝克＋冷點補償）、LVDT、渦電流。<\/li>\n<li>訊號三要素（振幅、頻率、相位）、串列 vs. 並列、單工/半雙工/全雙工、同步/非同步。<\/li>\n<li>頻寬、位元速率、鮑率；Baudot 與 ASCII；AM/FM/PM 與 ASK/FSK/PSK。<\/li>\n<li>主從架構、網路拓樸；UART、I²C、SPI 的比較。<\/li>\n<\/ol>\n<h2>1. 感測器是什麼、怎麼分類 <span class=\"ref\">考科一 3.1<\/span><span class=\"pg\">指引 p.5-3～5-5<\/span><\/h2>\n<p>感測器把待測的物理量或化學量（溫度、壓力、濕度、長度、速度、振動、聲音、pH…）<strong>轉換成可記錄的形式，通常是電訊號<\/strong>。例：力量元件受力形變 → 電阻改變 → 量電阻推算受力。<\/p>\n<table>\n<thead>\n<tr>\n<th>分類依據<\/th>\n<th>類別<\/th>\n<th>說明（依指引）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>是否需外加電源<\/td>\n<td><strong>主動式 Active<\/strong><\/td>\n<td><strong>不需外加激發電源<\/strong>，待測量改變即產生電壓或電流，例：<strong>熱電偶<\/strong><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>被動式 Passive<\/strong><\/td>\n<td><strong>需外加激發電源<\/strong>才有輸出，例：加速規、應變規、麥克風<\/td>\n<\/tr>\n<tr>\n<td>量測方式<\/td>\n<td>接觸式／非接觸式<\/td>\n<td>高溫鐵水等極端條件 → 必須非接觸<\/td>\n<\/tr>\n<tr>\n<td>輸出訊號<\/td>\n<td>機械式／電子式<\/td>\n<td>電子式再分：<strong>數位<\/strong>（只有 0 或 1）、<strong>類比<\/strong>（隨時間連續變化）、<strong>脈衝<\/strong>（一連串 ON/OFF）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 標註<\/strong>：主動／被動式的定義在不同教科書<strong>剛好相反<\/strong>（有些書把「需外加電源」稱為主動式）。<strong>本考試以官方學習指引 p.5-3 為準<\/strong>：熱電偶＝主動式（自己發電）、應變規＝被動式（要外加電源）。<\/p>\n<\/blockquote>\n<h2>2. 感測器 8 大性能參數 <span class=\"ref\">考科一 3.1<\/span><span class=\"pg\">指引 p.5-5～5-6<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>參數<\/th>\n<th>意思<\/th>\n<th>公式／重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>誤差 Error<\/td>\n<td>量測值與真實值的差<\/td>\n<td>靜態誤差＝測量值−實際值；動態誤差隨時間變化<\/td>\n<\/tr>\n<tr>\n<td>精確度（準確度）Accuracy<\/td>\n<td>靜態誤差相對實際值的百分比，越小越接近真值<\/td>\n<td>（測量值−實際值）／實際值 ×100%<\/td>\n<\/tr>\n<tr>\n<td>重複性 Repeatability<\/td>\n<td>同條件下多次量測的變化量，越小越可靠<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>靈敏度 Sensitivity<\/td>\n<td>輸出訊號／待測物理量<\/td>\n<td>例：10 mV/°C<\/td>\n<\/tr>\n<tr>\n<td>解析度 Resolution<\/td>\n<td>能量到的最小量值；數位化時與 ADC 位元數有關<\/td>\n<td>n 位元可表示 <strong>2ⁿ<\/strong> 種值<\/td>\n<\/tr>\n<tr>\n<td>量測範圍 Range<\/td>\n<td>可正常量測的上限與下限<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>線性度 Linearity<\/td>\n<td>校準曲線與擬合直線的最大偏差／滿刻度 %，越小越線性<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>遲滯（滯後）Hysteresis<\/td>\n<td>量測值上升與下降時，<strong>同一數值量到不同結果<\/strong>（曲線不重合）<\/td>\n<td>需建立遲滯模型補償；<strong>不是時間延遲<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 計算例（ADC 解析度）<\/strong> <span class=\"ref\">考科一 3.1<\/span><span class=\"supp\">補充<\/span>：0–10 V 的訊號用 10 位元 ADC → 2¹⁰＝1024 階 → 每階約 10/1024 ≈ 9.8 mV（嚴謹算法除以 2ⁿ−1＝1023 也可，選項通常只差一點，挑最接近的）。<\/p>\n<p><strong>⚠️ 易混淆<\/strong>：精確度（Accuracy，準）＝離真值多近；精密度（Precision，精）／重複性＝多次量測彼此多接近。指引練習題把 Precision 譯為「精度」、Accuracy 譯為「準度」（p.5-11）。誤差<strong>不是<\/strong>「平均值−標準差」。<\/p>\n<\/blockquote>\n<h2>3. 力量與振動感測器 <span class=\"ref\">考科一 3.1<\/span><span class=\"pg\">指引 p.5-7～5-8<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>類型<\/th>\n<th>原理<\/th>\n<th>輸出<\/th>\n<th>搭配電路<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>壓電式（石英、鈦酸鋇陶瓷）<\/td>\n<td><strong>壓電效應<\/strong>：受壓表面產生<strong>電荷<\/strong>，與應力成正比<\/td>\n<td>電荷（極微小）<\/td>\n<td><strong>電荷放大器<\/strong>轉成電壓或電流<\/td>\n<\/tr>\n<tr>\n<td>應變規 Strain Gauge<\/td>\n<td><strong>壓阻效應<\/strong>：導體電阻與長度成正比、與截面積成反比，形變→電阻變化<\/td>\n<td>電阻變化<\/td>\n<td><strong>惠斯登電橋<\/strong><\/td>\n<\/tr>\n<tr>\n<td>加速規（振動感測器）<\/td>\n<td><strong>牛頓第二定律 F＝m×a<\/strong>：內部質量塊的慣性力換算加速度<\/td>\n<td>依種類<\/td>\n<td>分<strong>壓阻式、壓電式、電容式<\/strong>；壓電式加速規依電荷變化推估振動<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><span class=\"ref\">考科一 3.1<\/span><span class=\"supp\">補充<\/span> <strong>惠斯登電橋<\/strong>：四個電阻接成菱形，當 <strong>R1/R2＝R3/R4<\/strong> 時電橋平衡、輸出電壓為 0；應變規電阻有微小變化 ΔR 就會打破平衡，產生與 ΔR 近似成正比的小電壓，再經放大器放大。優點是能<strong>量測非常微小的電阻變化<\/strong>並抵消溫度等共同變化（半橋、全橋接法）。<\/p>\n<blockquote>\n<p><strong>⚠️ 標註（指引疑誤）<\/strong>：指引 p.5-7 與練習題解析寫「應變規<strong>受壓力時電阻增加、受張力時減少<\/strong>」。依一般物理（R＝ρL/A），<strong>受拉（張力）時變長變細→電阻增加；受壓時電阻減少<\/strong>，與指引寫法相反。考題若只問「利用電阻變化的感測器是哪種」→ 答<strong>應變規<\/strong>即可；若直接考方向，請以題目敘述為準並留意此差異。<\/p>\n<\/blockquote>\n<h2>4. 溫度感測器 <span class=\"ref\">考科一 3.1<\/span><span class=\"pg\">指引 p.5-8～5-9<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>類型<\/th>\n<th>原理<\/th>\n<th>特性<\/th>\n<th>必背<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>熱敏電阻 Thermistor<\/td>\n<td>半導體電阻隨溫度變化<\/td>\n<td>一般 −90～130°C（調整材料可擴展到高溫）<\/td>\n<td><strong>NTC<\/strong>：溫度↑電阻↓，靈敏度極高（一般說熱敏電阻多指 NTC）；<strong>PTC<\/strong>：到居禮溫度電阻<strong>急升<\/strong>，用於電路保護；<strong>CTR<\/strong>：到臨界溫度電阻<strong>驟降<\/strong><\/td>\n<\/tr>\n<tr>\n<td>電阻式溫度計 RTD<\/td>\n<td>金屬電阻隨溫度上升而增加<\/td>\n<td>靈敏度較低，需周邊電路降低<strong>線阻<\/strong>誤差<\/td>\n<td><strong>Pt100：0°C 時 100 Ω<\/strong><\/td>\n<\/tr>\n<tr>\n<td>熱電偶 Thermocouple<\/td>\n<td><strong>席貝克效應（Seebeck）<\/strong>：兩種<strong>不同金屬<\/strong>一端焊接，兩端溫差產生電位差<\/td>\n<td>量測範圍廣；線徑會影響量測範圍<\/td>\n<td>查表假設冷端 0°C → 需<strong>冷點（冷接點）補償<\/strong><\/td>\n<\/tr>\n<tr>\n<td>非接觸式（紅外線）<\/td>\n<td>偵測物體熱輻射<\/td>\n<td>適合移動物件、極端環境<\/td>\n<td>受介質干擾，需依<strong>放射率<\/strong>修正<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 計算例（RTD）<\/strong>：R(T) ≈ R₀(1＋αT)。Pt100、α 取 0.004 → 100°C 時 R ≈ 100×(1＋0.4)＝<strong>140 Ω<\/strong>（指引練習題用 0.004；實際標準 Pt100 α≈0.00385，100°C 約 <strong>138.5 Ω<\/strong>，兩者都可能出現，看題目給的係數）。<\/p>\n<p><strong>⚠️ 易混淆<\/strong>：席貝克（Seebeck）＝溫差→電壓（熱電偶）；貝爾帖（Peltier）＝電流→溫差（致冷晶片）。<\/p>\n<\/blockquote>\n<h2>5. 位移與光感測器 <span class=\"ref\">考科一 3.1<\/span><span class=\"pg\">指引 p.5-9～5-10<\/span><\/h2>\n<ul>\n<li><strong>位移<\/strong>：接觸式＝刻度盤、<strong>LVDT（線性可變差動變壓器）<\/strong>、電阻式分壓元件；<strong>非接觸式<\/strong>＝<strong>渦電流位移計<\/strong>（高頻磁場在金屬產生渦電流、改變線圈阻抗）、雷射位移計（1D 共焦或三角反射；2D/3D 用光切法＋<strong>CMOS<\/strong> 影像感測器）、白光共焦／白光干涉（3D，以「面」量測、不受材質顏色影響）。<\/li>\n<li><strong>光感測器<\/strong>基於<strong>光電效應<\/strong>，三類：<strong>光傳導<\/strong>（光→電阻變化：光敏電阻、光二極體、紅外線二極體）、<strong>光發射<\/strong>（電子脫離表面射出）、<strong>光伏特<\/strong>（介面受光直接產生電壓差，如太陽能電池）。<\/li>\n<\/ul>\n<p><span class=\"ref\">考科一 3.1<\/span><span class=\"pg\">指引 p.5-11～5-14 練習題<\/span> 加速規的選用：量<strong>微小振動選靈敏度高<\/strong>的；加速規本身太重會產生<strong>質量效應<\/strong>影響量測（不是只要比待測物輕就好）。<\/p>\n<h2>6. 訊號基礎 <span class=\"ref\">考科一 3.2<\/span><span class=\"pg\">指引 p.5-15～5-17<\/span><\/h2>\n<ul>\n<li><strong>類比訊號<\/strong>：振幅隨時間連續變化（振動、溫度、聲音）；<strong>數位訊號<\/strong>：一連串脈波，高低電壓代表 1 與 0（位元）。<\/li>\n<li>正弦波三要素：<strong>振幅（Amplitude）<\/strong>＝大小；<strong>頻率（Frequency）<\/strong>＝每秒重複次數，單位 Hz，<strong>是週期的倒數<\/strong>；<strong>相位（Phase）<\/strong>＝波形在週期內的時間位置。<\/li>\n<li><strong>正弦與餘弦相差 90°<\/strong>（p.5-27）。週期性訊號：每隔相同時間重複，如週期性正弦波、方波。<\/li>\n<\/ul>\n<h2>7. 傳輸方式三種分法 <span class=\"ref\">考科一 3.2<\/span><span class=\"pg\">指引 p.5-17～5-18<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>分法<\/th>\n<th>類別<\/th>\n<th>重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>依傳輸線數與距離<\/td>\n<td><strong>串列<\/strong>：一次一個位元<\/td>\n<td>100 呎以上多用；架設方便、易維護、線路成本低；缺點<strong>速率較慢<\/strong>；RS-232、I²C、SPI、USB、網路<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>並列<\/strong>：多條線同時傳<\/td>\n<td>100 呎以內；優點<strong>速率快<\/strong>；缺點<strong>線路成本高、維修不易、易受干擾<\/strong>；IEEE 488<\/td>\n<\/tr>\n<tr>\n<td>依資料流向<\/td>\n<td>單工／半雙工／全雙工<\/td>\n<td>單工＝收音機、電視；半雙工＝<strong>對講機<\/strong>（雙向但同時只能一方）；全雙工＝<strong>電話<\/strong><\/td>\n<\/tr>\n<tr>\n<td>依收發時序<\/td>\n<td><strong>非同步<\/strong><\/td>\n<td>一次一個字元（字元導向）；<strong>起始位元＋資料＋同位元＋停止位元<\/strong>（起止式）<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>同步<\/strong><\/td>\n<td>以資料區塊為單位（區塊傳輸），先送 2 個同步字元；<strong>效率高於非同步<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>8. 頻寬、鮑率、編碼與調變 <span class=\"ref\">考科一 3.2<\/span><span class=\"pg\">指引 p.5-18～5-20<\/span><\/h2>\n<ul>\n<li><strong>頻寬<\/strong>兩種意義：①訊號最高與最低頻率的差（100～5000 Hz → 頻寬 4900 Hz）；②傳輸媒體提供的速率（Cable Modem 2M/256K ＝ 下載 2 Mbps、上傳 256 kbps）。頻率與波長成<strong>反比<\/strong>；整個頻率範圍稱為<strong>頻譜<\/strong>，再分成頻帶。<\/li>\n<li><strong>位元速率<\/strong>＝每秒傳送的位元數（bps）；<strong>鮑率（Baud Rate）<\/strong>＝每秒傳送的<strong>訊號單元<\/strong>數，一個訊號單元可能含 2、3 個以上位元 → <strong>位元速率 ≥ 鮑率<\/strong>。<\/li>\n<li>編碼：<strong>Baudot<\/strong>＝最早的 <strong>5 位元<\/strong>碼（電傳打字碼 Telex），2⁵＝32 種，用 Figure Shift／Letter Shift 擴充到 58 種，<strong>無檢查字元<\/strong>；<strong>ASCII<\/strong>＝<strong>7 位元<\/strong>、128 種，擴充版 8 位元。<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>調變<\/th>\n<th>輸入<\/th>\n<th>改變載波的什麼<\/th>\n<th>重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>AM 振幅調變<\/td>\n<td>類比資料→類比訊號<\/td>\n<td>振幅（頻率固定）<\/td>\n<td>指引：低速傳輸多用<\/td>\n<\/tr>\n<tr>\n<td>FM 頻率調變<\/td>\n<td>〃<\/td>\n<td>頻率（振幅固定）<\/td>\n<td><strong>抗雜訊比 AM 好<\/strong>；指引：300/600/1200 bps 多採 FM<\/td>\n<\/tr>\n<tr>\n<td>PM 相位調變<\/td>\n<td>〃<\/td>\n<td>相位<\/td>\n<td>指引：更高速傳輸用 PM<\/td>\n<\/tr>\n<tr>\n<td>ASK／FSK／PSK<\/td>\n<td><strong>數位資料→類比訊號<\/strong><\/td>\n<td>振幅／頻率／相位<\/td>\n<td>「移轉鍵式（Shift Keying）」＝數位版<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>9. 通訊架構與網路拓樸 <span class=\"ref\">考科一 3.2<\/span><span class=\"pg\">指引 p.5-21～5-24<\/span><\/h2>\n<ul>\n<li><strong>一對一<\/strong>最單純；<strong>主從架構<\/strong>：同一時間只有一個設備（主站）發號司令，其他等待，硬體常以**匯流排（Bus）**實現，如 <strong>RS-485、SPI<\/strong>。<\/li>\n<li><strong>Server-Client<\/strong> 也是主從：資料集中在 Server，被動等待多個 Client 連線；硬體需求較高，但集中管理、安全性較高。<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>拓樸<\/th>\n<th>優點<\/th>\n<th>缺點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>線性<\/td>\n<td>功能簡單易實現<\/td>\n<td>彈性不大<\/td>\n<\/tr>\n<tr>\n<td>星狀<\/td>\n<td>集中管理<\/td>\n<td><strong>核心故障整個網路失效<\/strong><\/td>\n<\/tr>\n<tr>\n<td>樹狀<\/td>\n<td><strong>易於擴充<\/strong>：可延伸很多分支，新節點易加入；分群分階層有效管理資料流<\/td>\n<td>階層多時傳遞時間變長；<strong>對根節點依賴大<\/strong><\/td>\n<\/tr>\n<tr>\n<td>網狀<\/td>\n<td>可找最佳路徑、節點省電長久運作、可靠<\/td>\n<td>路由較複雜<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>通訊協定（Protocol）<\/strong>＝建立在通訊介面上的資料格式與交換規則，通常分層設計（OSI、TCP/IP）。<\/li>\n<\/ul>\n<h2>10. UART、I²C、SPI 比較 <span class=\"ref\">考科一 3.2<\/span><span class=\"supp\">補充（指引 p.5-17、p.5-25～5-27 僅練習題提及）<\/span><\/h2>\n<p>能力指標明列 UART、I²C、SPI，但指引正文只有簡短描述，以下為一般技術知識整理：<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>UART<\/th>\n<th>I²C<\/th>\n<th>SPI<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>同步方式<\/td>\n<td><strong>非同步<\/strong>（無時脈線，雙方先約定<strong>鮑率<\/strong>）<\/td>\n<td><strong>同步<\/strong>（SCL 時脈）<\/td>\n<td><strong>同步<\/strong>（SCLK 時脈）<\/td>\n<\/tr>\n<tr>\n<td>線數<\/td>\n<td>TX、RX（＋GND）<\/td>\n<td><strong>2 條：SDA 資料、SCL 時脈<\/strong><\/td>\n<td>4 條：SCLK、MOSI、MISO、SS/CS（每個從裝置一條 CS）<\/td>\n<\/tr>\n<tr>\n<td>雙工<\/td>\n<td><strong>全雙工<\/strong><\/td>\n<td><strong>半雙工<\/strong>（只有一條資料線）<\/td>\n<td><strong>全雙工<\/strong><\/td>\n<\/tr>\n<tr>\n<td>多裝置<\/td>\n<td>一對一<\/td>\n<td>多主多從，靠 <strong>7 位元位址<\/strong>區分；需<strong>上拉電阻<\/strong><\/td>\n<td>一主多從，靠<strong>片選 CS<\/strong><\/td>\n<\/tr>\n<tr>\n<td>速度<\/td>\n<td>中（如 9600、115200 bps）<\/td>\n<td>中（標準 100 kbps、快速 400 kbps…）<\/td>\n<td><strong>最快<\/strong>（數十 MHz 等級）<\/td>\n<\/tr>\n<tr>\n<td>典型<\/td>\n<td>序列埠、GPS 模組、除錯 Console<\/td>\n<td>感測器、EEPROM、螢幕參數（板內晶片間）<\/td>\n<td>Flash、EEPROM、顯示器、高速 ADC<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>UART 訊框：<strong>起始位元＋5～9 個資料位元＋（同位元）＋停止位元<\/strong>，如常見「9600 8N1」。<\/li>\n<li>指引練習題重點：I²C <strong>接腳少、易受線長影響、可減少重量與耗電<\/strong>，是<strong>同步<\/strong>、<strong>半雙工<\/strong>；<strong>IrDA 紅外線<\/strong>屬單工（指引答案觀點）；SPI 為高速全雙工（p.5-17）。<\/li>\n<\/ul>\n<h3>今日 30 秒回顧<\/h3>\n<p>主動（熱電偶，自己發電）／被動（應變規，要外加電源）〔依指引〕｜遲滯＝上升下降曲線不重合｜壓電→電荷＋電荷放大器；應變規→電阻＋惠斯登電橋｜NTC 溫升電阻降、PTC 急升、CTR 驟降｜Pt100：0°C＝100Ω｜熱電偶＝席貝克＋冷點補償｜頻率＝1/週期；sin 與 cos 差 90°｜並列快但貴、易干擾；串列慢但便宜｜對講機半雙工、電話全雙工｜鮑率＝訊號單元/秒｜Baudot 5 位元、ASCII 7 位元｜FM 抗雜訊佳；ASK/FSK/PSK 數位→類比｜樹狀易擴充｜UART 非同步全雙工、I²C 同步半雙工 2 線、SPI 同步全雙工 4 線最快。<\/p>", "audio": {"src": "audio/d05.mp3", "dur": 700}, "questions": [{"id": "d5q1", "n": 1, "opts": ["熱電偶", "應變規", "加速規", "麥克風"], "exp": "指引 p.5-3：主動式感測器（如熱電偶）不需外加激發電源；被動式感測器（如加速規、應變規、麥克風）需外加激發電源。注意不同教科書定義可能相反，本考試依指引。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "依官方學習指引的分類方式，下列哪一種感測器屬於「不需外加激發電源，待測量改變即可產生電壓」的主動式感測器？", "ref": "考科一 3.1", "src": "指引 p.5-3", "ans": 0, "stemH": "依官方學習指引的分類方式，下列哪一種感測器屬於「不需外加激發電源，待測量改變即可產生電壓」的主動式感測器？", "optsH": ["熱電偶", "應變規", "加速規", "麥克風"], "expH": "指引 p.5-3：主動式感測器（如熱電偶）不需外加激發電源；被動式感測器（如加速規、應變規、麥克風）需外加激發電源。注意不同教科書定義可能相反，本考試依指引。"}, {"id": "d5q2", "n": 2, "opts": ["線性度（Linearity）", "重複性（Repeatability）", "遲滯（Hysteresis）", "解析度（Resolution）"], "exp": "遲滯（滯後）現象：量測值上升與下降過程中，對同一數值的量測產生偏差，曲線不重合，需建立遲滯模型補償。它不是時間延遲。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某溫度感測器在溫度「上升」到 50°C 時讀值為 50.0，「下降」回 50°C 時讀值卻是 50.6，上升與下降曲線不重合。這種現象稱為？", "ref": "考科一 3.1", "src": "指引 p.5-6", "ans": 2, "stemH": "某溫度感測器在溫度「上升」到 50°C 時讀值為 50.0，「下降」回 50°C 時讀值卻是 50.6，上升與下降曲線不重合。這種現象稱為？", "optsH": ["線性度（Linearity）", "重複性（Repeatability）", "遲滯（Hysteresis）", "解析度（Resolution）"], "expH": "遲滯（滯後）現象：量測值上升與下降過程中，對同一數值的量測產生偏差，曲線不重合，需建立遲滯模型補償。它不是時間延遲。"}, {"id": "d5q3", "n": 3, "opts": ["2%", "0.2%", "4%", "20%"], "exp": "精確度＝（測量值−實際值）／實際值×100%＝（204−200）／200×100%＝2%。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "一支壓力計量測實際值 200 kPa 的壓力，讀值為 204 kPa。依指引的精確度定義，其誤差百分比為？", "ref": "考科一 3.1", "src": "指引 p.5-5～5-6", "ans": 0, "stemH": "一支壓力計量測實際值 200 kPa 的壓力，讀值為 204 kPa。依指引的精確度定義，其誤差百分比為？", "optsH": ["2%", "0.2%", "4%", "20%"], "expH": "精確度＝（測量值−實際值）／實際值×100%＝（204−200）／200×100%＝2%。"}, {"id": "d5q4", "n": 4, "opts": ["12", "144", "1024", "4096"], "exp": "n 位元可表示 2ⁿ 種值，2¹²＝4096。位元數越多，解析度（可分辨的最小量值）越細。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某 ADC 為 12 位元，可將量測範圍以多少種不同的數位值表示？", "ref": "考科一 3.1", "src": "指引 p.5-6", "ans": 3, "stemH": "某 ADC 為 12 位元，可將量測範圍以多少種不同的數位值表示？", "optsH": ["12", "144", "1024", "4096"], "expH": "n 位元可表示 2ⁿ 種值，2¹²＝4096。位元數越多，解析度（可分辨的最小量值）越細。"}, {"id": "d5q5", "n": 5, "opts": ["惠斯登電橋", "分壓電路", "冷點補償電路", "電荷放大器（Charge Amplifier）"], "exp": "壓電材料受力表面產生電荷，需配合電荷放大器轉換。惠斯登電橋用於應變規等電阻變化的量測；冷點補償用於熱電偶；分壓電路常用於光敏電阻。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "壓電式力量感測器受力後產生的原始訊號極微小，實務上通常需搭配哪一種電路，將其轉換為與應力成正比的電壓或電流？", "ref": "考科一 3.1", "src": "指引 p.5-7", "ans": 3, "stemH": "壓電式力量感測器受力後產生的原始訊號極微小，實務上通常需搭配哪一種電路，將其轉換為與應力成正比的電壓或電流？", "optsH": ["惠斯登電橋", "分壓電路", "冷點補償電路", "電荷放大器（Charge Amplifier）"], "expH": "壓電材料受力表面產生電荷，需配合電荷放大器轉換。惠斯登電橋用於應變規等電阻變化的量測；冷點補償用於熱電偶；分壓電路常用於光敏電阻。"}, {"id": "d5q6", "n": 6, "opts": ["惠斯登電橋可以把溫度直接轉成數位訊號", "應變規的電阻變化極微小，電橋能把微小的電阻變化轉成可量測的電壓變化", "惠斯登電橋可以產生電荷供應變規使用", "惠斯登電橋可取代放大器，不需任何後續電路"], "exp": "應變規利用壓阻效應，受力形變造成極小的電阻變化；惠斯登電橋在平衡（R1/R2＝R3/R4）時輸出 0，電阻一變就產生小電壓，再經放大器放大。電橋原理屬補充知識。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "應變規常搭配惠斯登電橋使用，主要原因是？", "ref": "考科一 3.1", "src": "指引 p.5-7＋補充", "ans": 1, "stemH": "應變規常搭配惠斯登電橋使用，主要原因是？", "optsH": ["惠斯登電橋可以把溫度直接轉成數位訊號", "應變規的電阻變化極微小，電橋能把微小的電阻變化轉成可量測的電壓變化", "惠斯登電橋可以產生電荷供應變規使用", "惠斯登電橋可取代放大器，不需任何後續電路"], "expH": "應變規利用壓阻效應，受力形變造成極小的電阻變化；惠斯登電橋在平衡（R1/R2＝R3/R4）時輸出 0，電阻一變就產生小電壓，再經放大器放大。電橋原理屬補充知識。"}, {"id": "d5q7", "n": 7, "opts": ["NTC 的電阻隨溫度上升而增加", "PTC 在達到居禮溫度時電阻值會急升，常用於電路保護", "CTR 的電阻隨溫度上升而線性增加", "一般所稱的熱敏電阻多指 PTC"], "exp": "NTC：溫度上升電阻下降、靈敏度高，一般熱敏電阻多指此類；PTC：達居禮溫度電阻急升，用於電路保護；CTR：達臨界溫度電阻驟降。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "下列關於熱敏電阻的敘述，何者正確？", "ref": "考科一 3.1", "src": "指引 p.5-8", "ans": 1, "stemH": "下列關於熱敏電阻的敘述，何者正確？", "optsH": ["NTC 的電阻隨溫度上升而增加", "PTC 在達到居禮溫度時電阻值會急升，常用於電路保護", "CTR 的電阻隨溫度上升而線性增加", "一般所稱的熱敏電阻多指 PTC"], "expH": "NTC：溫度上升電阻下降、靈敏度高，一般熱敏電阻多指此類；PTC：達居禮溫度電阻急升，用於電路保護；CTR：達臨界溫度電阻驟降。"}, {"id": "d5q8", "n": 8, "opts": ["50 Ω", "100 Ω", "120 Ω", "140 Ω"], "exp": "Pt100 在 0°C 時為 100 Ω。R＝R₀(1＋αT)＝100×(1＋0.004×50)＝120 Ω。（實際標準 Pt100 α 約 0.00385，題目給定係數就照題目算。）", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某 RTD 為 Pt100，假設電阻溫度係數 α＝0.004/°C，且電阻與溫度呈線性關係，則 50°C 時電阻約為？", "ref": "考科一 3.1", "src": "指引 p.5-8", "ans": 2, "stemH": "某 RTD 為 Pt100，假設電阻溫度係數 α＝0.004/°C，且電阻與溫度呈線性關係，則 50°C 時電阻約為？", "optsH": ["50 Ω", "100 Ω", "120 Ω", "140 Ω"], "expH": "Pt100 在 0°C 時為 100 Ω。R＝R₀(1＋αT)＝100×(1＋0.004×50)＝120 Ω。（實際標準 Pt100 α 約 0.00385，題目給定係數就照題目算。）"}, {"id": "d5q9", "n": 9, "opts": ["冷點（冷接點）補償", "相位補償", "增加 ADC 位元數", "改用 NTC 熱敏電阻並取消量測"], "exp": "熱電偶只反映兩端溫差，需另以溫度感測器量冷端溫度並補償，稱為冷點補償。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "熱電偶的查表數值假設冷端位於 0°C，但實際量測時儀表處於 28°C 的環境。若要得到正確溫度，需要採取哪種措施？", "ref": "考科一 3.1", "src": "指引 p.5-9", "ans": 0, "stemH": "熱電偶的查表數值假設冷端位於 0°C，但實際量測時儀表處於 28°C 的環境。若要得到正確溫度，需要採取哪種措施？", "optsH": ["冷點（冷接點）補償", "相位補償", "增加 ADC 位元數", "改用 NTC 熱敏電阻並取消量測"], "expH": "熱電偶只反映兩端溫差，需另以溫度感測器量冷端溫度並補償，稱為冷點補償。"}, {"id": "d5q10", "n": 10, "opts": ["以資料區塊為單位，先送 2 個同步字元", "一次傳送一個字元，傳送前加起始位元、最後加同位元與停止位元", "效率高於同步傳輸", "必須使用並列傳輸線"], "exp": "非同步傳輸是字元導向、起止式傳輸（起始位元＋資料＋同位元＋停止位元）。同步傳輸以區塊為單位、先送 2 個同步字元，效率較高。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "關於「非同步串列傳輸」，下列敘述何者正確？", "ref": "考科一 3.2", "src": "指引 p.5-18", "ans": 1, "stemH": "關於「非同步串列傳輸」，下列敘述何者正確？", "optsH": ["以資料區塊為單位，先送 2 個同步字元", "一次傳送一個字元，傳送前加起始位元、最後加同位元與停止位元", "效率高於同步傳輸", "必須使用並列傳輸線"], "expH": "非同步傳輸是字元導向、起止式傳輸（起始位元＋資料＋同位元＋停止位元）。同步傳輸以區塊為單位、先送 2 個同步字元，效率較高。"}, {"id": "d5q11", "n": 11, "opts": ["600 bps", "2400 bps", "4800 bps", "9600 bps"], "exp": "鮑率是每秒傳送的訊號單元數；位元速率＝鮑率×每單元位元數＝2400×4＝9600 bps。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某數據機每個訊號單元攜帶 4 個位元，鮑率為 2400 baud，則位元速率為？", "ref": "考科一 3.2", "src": "指引 p.5-19", "ans": 3, "stemH": "某數據機每個訊號單元攜帶 4 個位元，鮑率為 2400 baud，則位元速率為？", "optsH": ["600 bps", "2400 bps", "4800 bps", "9600 bps"], "expH": "鮑率是每秒傳送的訊號單元數；位元速率＝鮑率×每單元位元數＝2400×4＝9600 bps。"}, {"id": "d5q12", "n": 12, "opts": ["UART，非同步、全雙工", "SPI，同步、全雙工", "I²C，同步、半雙工", "RS-485，並列傳輸"], "exp": "I²C 使用 SDA（資料）與 SCL（時脈）兩條線，靠位址區分裝置，屬同步、半雙工（指引練習題 p.5-27）。SPI 有 SCLK、MOSI、MISO、CS 四條線，全雙工；UART 非同步、TX/RX。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某感測模組只有 SDA 與 SCL 兩條訊號線，並以 7 位元位址讓多個裝置共用匯流排。這是哪一種介面？其傳輸特性為何？", "ref": "考科一 3.2", "src": "補充（指引 p.5-17、p.5-25～5-27）", "ans": 2, "stemH": "某感測模組只有 SDA 與 SCL 兩條訊號線，並以 7 位元位址讓多個裝置共用匯流排。這是哪一種介面？其傳輸特性為何？", "optsH": ["UART，非同步、全雙工", "SPI，同步、全雙工", "I²C，同步、半雙工", "RS-485，並列傳輸"], "expH": "I²C 使用 SDA（資料）與 SCL（時脈）兩條線，靠位址區分裝置，屬同步、半雙工（指引練習題 p.5-27）。SPI 有 SCLK、MOSI、MISO、CS 四條線，全雙工；UART 非同步、TX/RX。"}]}, {"id": 6, "date": "2026-10-23", "subject": "考科一", "type": "mock", "minutes": 30, "title": "考科一模擬考 A（官方學習指引練習評量 第一部分）", "short": "考科一模擬考 A", "lectureChars": 1083, "lecture": "<h3>今天怎麼用 30 分鐘<\/h3>\n<ul>\n<li><strong>前 5 分鐘<\/strong>：快速看下面的「考前熱身」，喚醒 D1～D3 的記憶。<\/li>\n<li><strong>後 25～30 分鐘<\/strong>：按「開始模擬考」計時作答 40 題（預設 30 分鐘，可改成正式 75 分鐘模式）。全部作答完或時間到才交卷、看分數與解析，模擬正式考試的節奏。<\/li>\n<li>題目全部<strong>改編自官方學習指引<\/strong>各章練習評量（第 3-1、3-2、4-1、4-2、4-3 節），每題都標了指引頁碼。少數原題有排版或答案爭議，已在解析中以 ⚠️ 標註。<\/li>\n<li>交卷後錯題會自動進「錯題本」，明天（D7）一起整理。<\/li>\n<\/ul>\n<blockquote>\n<p><strong>💡 作答技巧<\/strong>：iPAS 單選題常用「下列何者『不』正確」，先圈出「不」字再看選項；遇到不確定的題目先用刪去法，把明顯錯的兩個先刪掉。<\/p>\n<\/blockquote>\n<h2>考前熱身：AI 基礎與應用案例 <span class=\"ref\">考科一 1.1<\/span><span class=\"pg\">指引 p.3-2～3-13<\/span><\/h2>\n<ul>\n<li>監督式（有標籤：分類、迴歸）／非監督式（無標籤：分群、異常偵測）／強化學習（獎勵：動態控制）。<\/li>\n<li>CNN 看空間（影像、AOI）；RNN/LSTM 看時間（震動、電流趨勢）；GAN 生成；隨機森林是傳統 ML。<\/li>\n<li>量化 FP32→INT8；NPU 推論專用、低功耗；訓練在雲端、推論在邊緣；聯合學習只傳模型參數。<\/li>\n<li>PbD：邊緣端就去識別化；AI 是輔助判斷，不是最終決策者。<\/li>\n<\/ul>\n<h2>考前熱身：應用案例 <span class=\"ref\">考科一 1.2<\/span><span class=\"pg\">指引 p.3-18～3-22<\/span><\/h2>\n<ul>\n<li>Diagnosis＝分類（現在怎樣）；Prognosis＝迴歸（RUL，還能撐多久）。<\/li>\n<li>感測融合提升強健性（成本可能增加）；四位一體：感知、通訊、智慧、安全（資訊安全）。<\/li>\n<li>異質 PLC → 閘道器轉 OPC UA；大面積農業 → LoRa＋端雲協作。<\/li>\n<\/ul>\n<h2>考前熱身：物聯網架構 <span class=\"ref\">考科一 2.1<\/span><span class=\"pg\">指引 p.4-1～4-21<\/span><\/h2>\n<ul>\n<li>感知層（感測、識別）→ 網路層（傳輸、閘道器異質融合）→ 應用層（雲端、AI、服務）。<\/li>\n<li>超音波量距離不是量分貝；PIR 偵測移動；DHT11 溫濕度；MQ-2 氣體。<\/li>\n<li>OSI「應表會傳網鏈實」；表達層管加密壓縮。<\/li>\n<\/ul>\n<h2>考前熱身：通訊協定 <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-26～4-42<\/span><\/h2>\n<ul>\n<li>MQTT＝TCP＋Pub/Sub、QoS 0 不保證送達；CoAP＝UDP＋REST（無 QUERY）；WebSocket＝雙向即時。<\/li>\n<li>5G 不是低功耗長距離；NB-IoT 窄頻不適合影音；Matter 不支援 LoRa；SSID＝基地台識別碼。<\/li>\n<\/ul>\n<h2>考前熱身：工業通訊與網路 <span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-47～4-68<\/span><\/h2>\n<ul>\n<li>TCP 連接導向可靠；UDP 無連接不保證；LAN 小範圍；IPv4 四組。<\/li>\n<li>OPC UA 跨平台；Event Notification＝訂閱事件；MQTT 傳輸層是 TCP。<\/li>\n<\/ul>", "audio": {"src": "audio/d06.mp3", "dur": 483}, "questions": [{"id": "d6q1", "n": 1, "opts": ["監督式學習不需依賴標籤資料，適合用於未知故障型態的探索", "非監督式學習常利用分群（Clustering）技術，將相似的設備運作資料自動歸類", "強化學習的主要目標是進行靜態影像的瑕疵檢測（AOI）", "迴歸屬於非監督式學習，主要用於將資料區分成離散類別"], "exp": "(A) 監督式學習必須依賴特徵與對應標籤。(B) 正確，非監督式學習無需標籤，可找出資料內部結構與群集。(C) AOI 通常用監督式學習中的 CNN；強化學習用於動態控制決策（如空調節能）。(D) 迴歸屬監督式，輸出連續數值；離散類別是分類。", "origin": "改編自官方學習指引 3-1 練習評量第 1 題（p.3-14）", "stem": "關於機器學習在 AIoT 資料分析中的應用範式，下列敘述何者正確？", "ref": "考科一 1.1", "src": "指引 p.3-14", "ans": 1, "stemH": "關於機器學習在 AIoT 資料分析中的應用範式，下列敘述何者正確？", "optsH": ["監督式學習不需依賴標籤資料，適合用於未知故障型態的探索", "非監督式學習常利用分群（Clustering）技術，將相似的設備運作資料自動歸類", "強化學習的主要目標是進行靜態影像的瑕疵檢測（AOI）", "迴歸屬於非監督式學習，主要用於將資料區分成離散類別"], "expH": "(A) 監督式學習必須依賴特徵與對應標籤。(B) 正確，非監督式學習無需標籤，可找出資料內部結構與群集。(C) AOI 通常用監督式學習中的 CNN；強化學習用於動態控制決策（如空調節能）。(D) 迴歸屬監督式，輸出連續數值；離散類別是分類。"}, {"id": "d6q2", "n": 2, "opts": ["卷積神經網路（CNN）", "循環神經網路（RNN/LSTM）", "生成對抗網路（GAN）", "隨機森林（Random Forest）"], "exp": "RNN/LSTM 具備記憶機制，能捕捉前後時間點的關聯性，最適合時序資料。CNN 擅長空間結構（雖然 1D-CNN 也可處理時序，但 RNN/LSTM 更具代表性）；GAN 用於生成資料；隨機森林是傳統機器學習，不屬於類神經網路。", "origin": "改編自官方學習指引 3-1 練習評量第 2 題（p.3-14）", "stem": "處理 AIoT 感測器產生的時間序列資料（如馬達連續震動波形或電流趨勢）時，下列哪一種神經網路架構最合適？", "ref": "考科一 1.1", "src": "指引 p.3-14", "ans": 1, "stemH": "處理 AIoT 感測器產生的時間序列資料（如馬達連續震動波形或電流趨勢）時，下列哪一種神經網路架構最合適？", "optsH": ["卷積神經網路（CNN）", "循環神經網路（RNN/LSTM）", "生成對抗網路（GAN）", "隨機森林（Random Forest）"], "expH": "RNN/LSTM 具備記憶機制，能捕捉前後時間點的關聯性，最適合時序資料。CNN 擅長空間結構（雖然 1D-CNN 也可處理時序，但 RNN/LSTM 更具代表性）；GAN 用於生成資料；隨機森林是傳統機器學習，不屬於類神經網路。"}, {"id": "d6q3", "n": 3, "opts": ["將模型參數由 FP32 轉換為 INT8，以降低記憶體佔用", "透過增加神經網路層數來提升邊緣端推論準確度", "將模型切割成多個部分，分別在不同雲端伺服器上執行", "是一種將類比訊號轉換為數位訊號的硬體電路技術"], "exp": "量化以降低數值精度換取更小的模型與更快的運算。(B) 增加層數只會更重；(C) 是模型平行或分散式運算；(D) 是 ADC，與模型權重量化不同。", "origin": "改編自官方學習指引 3-1 練習評量第 3 題（p.3-14）", "stem": "為了讓神經網路模型能部署在資源受限的 MCU 上，常採用「量化（Quantization）」技術。下列敘述何者正確？", "ref": "考科一 1.1", "src": "指引 p.3-14", "ans": 0, "stemH": "為了讓神經網路模型能部署在資源受限的 MCU 上，常採用「量化（Quantization）」技術。下列敘述何者正確？", "optsH": ["將模型參數由 FP32 轉換為 INT8，以降低記憶體佔用", "透過增加神經網路層數來提升邊緣端推論準確度", "將模型切割成多個部分，分別在不同雲端伺服器上執行", "是一種將類比訊號轉換為數位訊號的硬體電路技術"], "expH": "量化以降低數值精度換取更小的模型與更快的運算。(B) 增加層數只會更重；(C) 是模型平行或分散式運算；(D) 是 ADC，與模型權重量化不同。"}, {"id": "d6q4", "n": 4, "opts": ["NPU 可完全取代 CPU，負責作業系統與 I/O 等通用運算", "NPU 專注於推論（Forward Propagation），省去訓練所需的反向傳播邏輯，因此能效極高", "NPU 是雲端大規模模型訓練的主力硬體", "NPU 不適合執行 INT8 量化模型，只能跑浮點運算"], "exp": "(A) NPU 是協同處理器，通用運算仍由 CPU 負責。(C) 雲端訓練多用 GPU 或 TPU。(D) NPU 的優勢正是執行 INT8 量化模型，比浮點運算更省電快速。", "origin": "改編自官方學習指引 3-1 練習評量第 4 題（p.3-15）；原題選項排版含「錯誤／正確」字樣，已改寫為一般選項", "stem": "關於神經網路處理器（NPU）在 AIoT 邊緣裝置中的角色與特性，下列敘述何者正確？", "ref": "考科一 1.1", "src": "指引 p.3-15", "ans": 1, "stemH": "關於神經網路處理器（NPU）在 AIoT 邊緣裝置中的角色與特性，下列敘述何者正確？", "optsH": ["NPU 可完全取代 CPU，負責作業系統與 I/O 等通用運算", "NPU 專注於推論（Forward Propagation），省去訓練所需的反向傳播邏輯，因此能效極高", "NPU 是雲端大規模模型訓練的主力硬體", "NPU 不適合執行 INT8 量化模型，只能跑浮點運算"], "expH": "(A) NPU 是協同處理器，通用運算仍由 CPU 負責。(C) 雲端訓練多用 GPU 或 TPU。(D) NPU 的優勢正是執行 INT8 量化模型，比浮點運算更省電快速。"}, {"id": "d6q5", "n": 5, "opts": ["將攝影機拍攝的所有原始畫面無條件上傳雲端，以備不時之需", "只依賴雲端伺服器的防火牆，終端裝置不需處理資安", "在邊緣端即進行資料去識別化（如僅傳送特徵值或骨架資訊）", "要求所有使用者先簽署放棄隱私權同意書"], "exp": "PbD 強調在架構設計時就納入隱私；資料「不離地」或「去識別化後才上傳」是核心實踐。(A) 增加攔截與外洩風險；(B) 邊緣裝置常是入侵破口；(D) 屬法律免責手段，不是技術上的 by Design。", "origin": "改編自官方學習指引 3-1 練習評量第 5 題（p.3-15）", "stem": "為降低 AIoT 系統的隱私風險，應遵循「由設計起始的隱私（Privacy by Design）」原則。下列哪項措施最符合此原則在邊緣運算中的實踐？", "ref": "考科一 1.1", "src": "指引 p.3-15", "ans": 2, "stemH": "為降低 AIoT 系統的隱私風險，應遵循「由設計起始的隱私（Privacy by Design）」原則。下列哪項措施最符合此原則在邊緣運算中的實踐？", "optsH": ["將攝影機拍攝的所有原始畫面無條件上傳雲端，以備不時之需", "只依賴雲端伺服器的防火牆，終端裝置不需處理資安", "在邊緣端即進行資料去識別化（如僅傳送特徵值或骨架資訊）", "要求所有使用者先簽署放棄隱私權同意書"], "expH": "PbD 強調在架構設計時就納入隱私；資料「不離地」或「去識別化後才上傳」是核心實踐。(A) 增加攔截與外洩 i>\n<li>邊緣運算＝靠近源頭，不是移到雲端；長距離影像傳輸 → 4G/5G。<\/li>\n<\/ul>\n<h2>考前熱身：資安與隱私 <span class=\"ref\">考科一 2.5<\/span><span class=\"pg\">指引 p.4-85～4-90<\/span><\/h2>\n<ul>\n<li>密碼最弱；Repeater 無法隔離；Mirai＝DDoS；鐵殼防不了 DoS。<\/li>\n<li>私鑰簽、公鑰驗＝不可否認；雜湊＝完整性；DDoS 監控無助於防個資外洩。<\/li>\n<\/ul>\n<h2>考前熱身：感測技術 <span class=\"ref\">考科一 3.1<\/span><span class=\"pg\">指引 p.5-3～5-10<\/span><\/h2>\n<ul>\n<li>熱電偶：兩種不同金屬、席貝克效應、冷點補償；NTC 溫升電阻降；Pt100 0°C＝100 Ω。<\/li>\n<li>遲滯不是時間延遲；壓電→電荷；應變規→電阻變化。<\/li>\n<\/ul>\n<h2>考前熱身：訊號與通訊 <span class=\"ref\">考科一 3.2<\/span><span class=\"pg\">指引 p.5-15～5-24<\/span><\/h2>\n<ul>\n<li>OSI 七層；I²C 同步、半雙工；並列快但貴、易干擾、難維修；樹狀易擴充。<\/li>\n<li>依時序分同步／非同步；sin 與 cos 相差 90°。<\/li>\n<\/ul>", "audio": {"src": "audio/d07.mp3", "dur": 421}, "questions": [{"id": "d7q1", "n": 1, "opts": ["提供大量的運算資源", "雲端運算讓物聯網感測設備本身也能支援虛擬化和容器化技術", "提供安全的資料儲存", "讓物聯網感測元件不需要擁有較強的運算能力"], "exp": "A、C 是雲服務特色；D 雲端可簡化閘道器、感測器的設計。虛擬化與容器化通常用於運算能力較大的系統，感測節點與閘道器沒有必要。", "origin": "改編自官方學習指引 4-4 練習評量第 1 題（p.4-80）", "stem": "關於雲端運算如何協助物聯網完成系統建置，下列敘述何者「不」正確？", "ref": "考科一 2.4", "src": "指引 p.4-80", "ans": 1, "stemH": "關於雲端運算如何協助物聯網完成系統建置，下列敘述何者「不」正確？", "optsH": ["提供大量的運算資源", "雲端運算讓物聯網感測設備本身也能支援虛擬化和容器化技術", "提供安全的資料儲存", "讓物聯網感測元件不需要擁有較強的運算能力"], "expH": "A、C 是雲服務特色；D 雲端可簡化閘道器、感測器的設計。虛擬化與容器化通常用於運算能力較大的系統，感測節點與閘道器沒有必要。"}, {"id": "d7q2", "n": 2, "opts": ["軟體即服務（SaaS）", "平台即服務（PaaS）", "基礎設施即服務（IaaS）", "資料即服務（DaaS）"], "exp": "PaaS 的基本定義。IaaS 只給虛擬硬體；SaaS 直接給軟體。", "origin": "改編自官方學習指引 4-4 練習評量第 2 題（p.4-80）", "stem": "提供開發平台（包含作業系統、程式語言執行環境、資料庫及網頁伺服器）的雲端服務是下列哪一項？", "ref": "考科一 2.4", "src": "指引 p.4-80", "ans": 1, "stemH": "提供開發平台（包含作業系統、程式語言執行環境、資料庫及網頁伺服器）的雲端服務是下列哪一項？", "optsH": ["軟體即服務（SaaS）", "平台即服務（PaaS）", "基礎設施即服務（IaaS）", "資料即服務（DaaS）"], "expH": "PaaS 的基本定義。IaaS 只給虛擬硬體；SaaS 直接給軟體。"}, {"id": "d7q3", "n": 3, "opts": ["資料儲存和管理功能", "資料加密和安全保護機制", "資料處理和分析能力", "即時資料傳輸和訊息處理"], "exp": "大數據工具的核心價值在於海量資料的處理與分析能力。", "origin": "改編自官方學習指引 4-4 練習評量第 3 題（p.4-80）", "stem": "大數據分析工具（如 Hadoop）主要是因為提供了下列哪一項能力，協助物聯網應用創造價值？", "ref": "考科一 2.4", "src": -3）與 3 項能力指標逐條撰寫<\/strong>，內容採業界公認的技術知識，每一段都標註對應的官方評鑑內容編號，並註明對應哪一條能力指標。考科二範圍與舊制「物聯網應用工程師」科目二相同。能力指標原文：①軟體設計基礎（雲端資料交換格式、資料庫設計基礎、開源軟體規劃與授權規範）；②硬體設計基礎（I/O 通訊與控制方式基礎、開源硬體規劃與授權規範）；③軟硬體整合規劃（系統元件與架構、系統故障問題判斷與排除、物聯網資安與隱私權）。<\/p>\n<\/blockquote>\n<h3>今天要搞懂的 5 件事<\/h3>\n<ol>\n<li>一套 IoT 系統由哪些元件組成：感測器、致動器、控制器、通訊模組、閘道器、電源、雲端平台、應用介面。<\/li>\n<li>MCU、MPU／單板電腦、閘道器、PLC 的差別與選用時機。<\/li>\n<li>「端－邊－雲」架構與資料流（含閉迴路控制）。<\/li>\n<li>故障排除的方法論：由簡入繁、分層排查、分段隔離、一次只改一個變數。<\/li>\n<li>常見故障症狀 → 可能原因 → 檢查工具（電源、接線、序列埠、I²C、Wi-Fi、MQTT、Modbus、雜訊）。<\/li>\n<\/ol>\n<h2>1. IoT 系統的基本元件 <span class=\"ref\">考科二 1-1<\/span><span class=\"supp\">補充（能力指標 3：系統元件與架構）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>元件<\/th>\n<th>角色<\/th>\n<th>例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>感測器 Sensor（輸入）<\/td>\n<td>把物理量轉成電訊號<\/td>\n<td>溫濕度、光、加速度、電流、超音波<\/td>\n<\/tr>\n<tr>\n<td>致動器 Actuator（輸出）<\/td>\n<td>把電訊號轉成動作<\/td>\n<td>馬達、繼電器、電磁閥、LED、蜂鳴器、伺服機<\/td>\n<\/tr>\n<tr>\n<td>控制器／運算單元<\/td>\n<td>讀感測、做判斷、下指令<\/td>\n<td>MCU（Arduino、ESP32）、單板電腦（Raspberry Pi）、PLC<\/td>\n<\/tr>\n<tr>\n<td>通訊模組<\/td>\n<td>連網<\/td>\n<td>Wi-Fi、BLE、Zigbee、LoRa、NB-IoT、4G/5G、Ethernet、RS-485<\/td>\n<\/tr>\n<tr>\n<td>閘道器 Gateway<\/td>\n<td>協定轉換、資料前處理、暫存、安全、上雲<\/td>\n<td>把 Zigbee／Modbus 轉成 MQTT／HTTP<\/td>\n<\/tr>\n<tr>\n<td>電源<\/td>\n<td>供電與穩壓<\/td>\n<td>電池、變壓器、穩壓 IC（如 3.3 V LDO）、太陽能<\/td>\n<\/tr>\n<tr>\n<td>雲端平台／伺服器<\/td>\n<td>收集、儲存、分析、裝置管理<\/td>\n<td>MQTT Broker、資料庫、Dashboard、規則引擎<\/td>\n<\/tr>\n<tr>\n<td>應用介面<\/td>\n<td>給人看與操作<\/td>\n<td>手機 App、Web 儀表板、告警通知<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 記法<\/strong>：「<strong>感（輸入）→ 控（判斷）→ 動（輸出）<\/strong>」是單機；加上「<strong>通（通訊）→ 雲（平台）→ 用（應用）<\/strong>」才是物聯網。<\/p>\n<\/blockquote>\n<h2>2. 控制器怎麼選：MCU、單板電腦、PLC <span class=\"ref\">考科二 1-1<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>類型<\/th>\n<th>特性<\/th>\n<th>優點<\/th>\n<th>限制<\/th>\n<th>典型<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>MCU 微控制器<\/td>\n<td>CPU＋記憶體＋I/O 整合在一顆晶片，通常<strong>不跑完整作業系統<\/strong>（裸機或 RTOS）<\/td>\n<td>便宜、省電、開機即用、即時性好<\/td>\n<td>記憶體與算力小<\/td>\n<td>Arduino Uno（ATmega328P，8 位元，5 V）、ESP32（內建 Wi-Fi＋BLE，3.3 V）<\/td>\n<\/tr>\n<tr>\n<td>MPU／單板電腦 SBC<\/td>\n<td>處理器需外接記憶體，<strong>跑 Linux 等作業系統<\/strong><\/td>\n<td>算力強、可跑資料庫、Python、AI 推論、多工<\/td>\n<td>較耗電、需正常關機、開機慢<\/td>\n<td>Raspberry Pi（GPIO 為 3.3 V）<\/td>\n<\/tr>\n<tr>\n<td>PLC 可程式邏輯控制器<\/td>\n<td>工業級控制器，梯形圖等語言<\/td>\n<td>耐環境、穩定可靠、即時控制<\/td>\n<td>價格高、彈性較小<\/td>\n<td>產線設備控制<\/td>\n<\/tr>\n<tr>\n<td>工業電腦 IPC／邊緣閘道器<\/td>\n<td>工業級電腦<\/td>\n<td>可跑邊緣運算與多協定轉換<\/td>\n<td>成本較高<\/td>\n<td>機台聯網、Edge AI<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：Arduino Uno 的 I/O 是 <strong>5 V<\/strong>，ESP32 與 Raspberry Pi 的 GPIO 是 <strong>3.3 V<\/strong>（不耐 5 V）；混接要加<strong>電壓準位轉換<\/strong>。Raspberry Pi <strong>沒有內建 ADC<\/strong>，讀類比感測器要外接 ADC 晶片（如經 SPI 或 I²C）。<\/p>\n<\/blockquote>\n<h2>3. 「端－邊－雲」架構與資料流 <span class=\"ref\">考科二 1-1<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>層<\/th>\n<th>位置<\/th>\n<th>工作<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>端（Device／感知層）<\/td>\n<td>現場感測器、致動器、MCU<\/td>\n<td>擷取資料、執行控制<\/td>\n<\/tr>\n<tr>\n<td>邊（Edge／閘道器）<\/td>\n<td>現場附近<\/td>\n<td>協定轉換、過濾與彙整、即時判斷、斷線暫存（store and forward）<\/td>\n<\/tr>\n<tr>\n<td>雲（Cloud／平台）<\/td>\n<td>資料中心<\/td>\n<td>長期儲存、大數據分析、AI 訓練、裝置管理、跨場域監控<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>典型資料流：<strong>感測器 → 訊號調理（放大、濾波）→ ADC → MCU → 通訊模組 → 閘道器 → 雲端（Broker／API）→ 資料庫 → 儀表板／App<\/strong>；若要<strong>閉迴路控制<\/strong>，雲端或邊緣的判斷結果再下行到 MCU 驅動致動器（例如溫度過高 → 開風扇）。<\/p>\n<p><strong>架構設計的取捨考量<\/strong>：功耗（電池多久）、傳輸距離、頻寬與資料量、即時性（延遲）、可靠度、成本、資安、擴充性、維運（OTA 更新、遠端監控）。<\/p>\n<blockquote>\n<p><strong>💡 例子（智慧溫室規劃）<\/strong>：土壤濕度與溫濕度感測器（類比／數位）→ ESP32 → LoRa 或 Wi-Fi → 閘道器 → MQTT Broker → 時序資料庫 → Dashboard；濕度低於門檻時，由邊緣端直接驅動繼電器開啟灌溉電磁閥（即使網路中斷也能運作），雲端負責趨勢分析與通知。<\/p>\n<\/blockquote>\n<h2>4. 工業現場的元件分層 <span class=\"ref\">考科二 1-1<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>層級<\/th>\n<th>元件<\/th>\n<th>功能<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>現場層<\/td>\n<td>感測器、致動器、變頻器、伺服<\/td>\n<td>量測與動作<\/td>\n<\/tr>\n<tr>\n<td>控制層<\/td>\n<td>PLC、控制器<\/td>\n<td>即時邏輯控制<\/td>\n<\/tr>\n<tr>\n<td>監控層<\/td>\n<td><strong>HMI<\/strong>（人機介面）、<strong>SCADA<\/strong>（監控與資料擷取）<\/td>\n<td>畫面監看、警報、遠端操作<\/td>\n<\/tr>\n<tr>\n<td>製造管理層<\/td>\n<td><strong>MES<\/strong>（製造執行系統）<\/td>\n<td>工單、生產追蹤、品質、績效<\/td>\n<\/tr>\n<tr>\n<td>企業層<\/td>\n<td><strong>ERP<\/strong>（企業資源規劃）<\/td>\n<td>訂單、採購、財務、庫存<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>設備聯網常以 OPC UA、MTConnect、Modbus 等標準把現場資料送到上層（D3 已學）。MES 與 ERP 在 D11 會再深入。<\/p>\n<h2>5. 故障排除的方法論 <span class=\"ref\">考科二 1-2<\/span><span class=\"supp\">補充（能力指標 3：系統故障問題判斷與排除）<\/span><\/h2>\n<ol>\n<li><strong>先確認現象與範圍<\/strong>：是全部裝置還是單一裝置？一直發生還是偶發？什麼時候開始？最近改過什麼？<\/li>\n<li><strong>由簡入繁、由外而內<\/strong>：先查電源、接線、指示燈，再查設定、程式、網路、雲端。<\/li>\n<li><strong>分層排查<\/strong>（對照 OSI）：實體（電源、線路、訊號）→ 鏈結／網路（連線、IP）→ 傳輸（埠號）→ 應用（帳密、主題、格式）。<\/li>\n<li><strong>分段隔離（二分法）<\/strong>：從資料流中間切開測試，例如「MCU 序列埠有讀值嗎？」有 → 問題在後段；沒有 → 問題在前段。<\/li>\n<li><strong>一次只改一個變數<\/strong>，並<strong>做紀錄<\/strong>；修好後確認根本原因（Root Cause），避免再發生。<\/li>\n<li><strong>替換法<\/strong>：用已知良品替換可疑元件（感測器、線材、電源）。<\/li>\n<\/ol>\n<h2>6. 常見故障「症狀 → 原因 → 處理」 <span class=\"ref\">考科二 1-2<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>症狀<\/th>\n<th>常見原因<\/th>\n<th>檢查與處理<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>裝置完全不動作、指示燈不亮<\/td>\n<td>電源未接、電壓不足、極性反接、保險絲斷<\/td>\n<td><strong>三用電表<\/strong>量供電電壓；檢查變壓器規格<\/td>\n<\/tr>\n<tr>\n<td>馬達或繼電器一啟動，MCU 就重開機<\/td>\n<td>負載瞬間電流造成<strong>電壓下陷（brownout）<\/strong>、共用電源<\/td>\n<td>致動器獨立供電、加大電源容量、加電容；共地<\/td>\n<\/tr>\n<tr>\n<td>感測讀值一直是 0 或最大值<\/td>\n<td>接線鬆脫、腳位設定錯、感測器沒供電、<strong>未共地<\/strong><\/td>\n<td>檢查接線與程式腳位；量感測器輸出電壓<\/td>\n<\/tr>\n<tr>\n<td>讀值跳動、雜訊大<\/td>\n<td>接地不良、線太長、電源雜訊、靠近馬達<\/td>\n<td>加濾波電容／RC 濾波、軟體平均或中位數濾波、雙絞屏蔽線、遠離干擾源<\/td>\n<\/tr>\n<tr>\n<td>序列埠出現亂碼<\/td>\n<td><strong>鮑率不一致<\/strong>、資料格式（如 8N1）不符、TX/RX 沒交叉、RS-232 與 TTL 準位不同<\/td>\n<td>兩端設定一致、TX 接 RX、加準位轉換<\/td>\n<\/tr>\n<tr>\n<td>I²C 掃不到裝置<\/td>\n<td>位址錯或<strong>位址衝突<\/strong>、<strong>缺上拉電阻<\/strong>、SDA/SCL 接反、線過長<\/td>\n<td>用 I²C 掃描程式確認位址；加上拉電阻；縮短線長<\/td>\n<\/tr>\n<tr>\n<td>SPI 讀不到資料<\/td>\n<td>片選 CS 沒拉低、SPI 模式（時脈極性／相位）不符、MISO/MOSI 接反<\/td>\n<td>對照規格書設定<\/td>\n<\/tr>\n<tr>\n<td>Wi-Fi 連不上<\/td>\n<td>SSID 或密碼錯、<strong>裝置只支援 2.4 GHz<\/strong>（如 ESP8266）卻連 5 GHz、訊號弱、拿不到 IP<\/td>\n<td>檢查頻段與訊號強度（RSSI）、DHCP<\/td>\n<\/tr>\n<tr>\n<td>有連網但連不到伺服器<\/td>\n<td>IP／DNS 設定、防火牆擋埠、伺服器沒開<\/td>\n<td><strong>ping<\/strong> 測連通、<strong>traceroute<\/strong> 看路徑、<strong>nslookup<\/strong> 查 DNS、確認埠號<\/td>\n<\/tr>\n<tr>\n<td>MQTT 收不到訊息<\/td>\n<td>Broker 位址或埠號錯（一般 <strong>1883<\/strong>、TLS <strong>8883<\/strong>）、<strong>Topic 拼字或大小寫不同<\/strong>、帳密錯、<strong>Client ID 重複<\/strong>互踢<\/td>\n<td>用 MQTT 測試工具訂閱 <code>#<\/code> 觀察；核對 Topic<\/td>\n<\/tr>\n<tr>\n<td>Modbus RTU 沒有回應<\/td>\n<td>從站位址（Slave ID）錯、鮑率／同位元不符、<strong>RS-485 的 A/B 線接反<\/strong>、長線缺終端電阻（約 120 Ω）、暫存器位址偏移（40001 對應位址 0）<\/td>\n<td>逐項核對通訊參數與接線<\/td>\n<\/tr>\n<tr>\n<td>資料時間戳錯亂<\/td>\n<td>裝置時鐘未同步<\/td>\n<td>啟用 <strong>NTP<\/strong> 校時<\/td>\n<\/tr>\n<tr>\n<td>系統跑一段時間當機<\/td>\n<td>記憶體不足或洩漏、無限迴圈、電源不穩<\/td>\n<td>加**看門狗（Watchdog）**自動重啟、檢查記憶體使用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 故障排除工具箱 <span class=\"ref\">考科二 1-2<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>工具<\/th>\n<th>用途<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>三用電表（萬用電表）<\/td>\n<td>量<strong>電壓、電流、電阻、通路（蜂鳴）<\/strong>；查供電與斷線<\/td>\n<\/tr>\n<tr>\n<td>示波器<\/td>\n<td>看<strong>訊號波形<\/strong>、雜訊、PWM、時序<\/td>\n<\/tr>\n<tr>\n<td>邏輯分析儀<\/td>\n<td>擷取多路數位訊號並<strong>解碼 UART／I²C／SPI<\/strong><\/td>\n<\/tr>\n<tr>\n<td>序列埠監控（Serial Monitor）<\/td>\n<td>看 MCU 印出的除錯訊息與讀值<\/td>\n<\/tr>\n<tr>\n<td>ping／traceroute／nslookup／ipconfig（ifconfig）<\/td>\n<td>網路連通、路徑、DNS、IP 設定<\/td>\n<\/tr>\n<tr>\n<td>封包分析（如 Wireshark）<\/td>\n<td>看實際封包內容與協定<\/td>\n<\/tr>\n<tr>\n<td>MQTT 用戶端工具、Postman<\/td>\n<td>測 Broker 訂閱發布、測 REST API<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：量<strong>電流<\/strong>要把電表<strong>串聯<\/strong>在電路中；量<strong>電壓<\/strong>要<strong>並聯<\/strong>；量<strong>電阻<\/strong>要先<strong>斷電<\/strong>。<\/p>\n<\/blockquote>\n<h3>今日 30 秒回顧<\/h3>\n<p>感→控→動＋通→雲→用｜MCU 便宜省電無 OS、SBC 跑 Linux、PLC 工業可靠｜Arduino 5 V、ESP32／Pi 3.3 V、Pi 無 ADC｜端－邊－雲；邊緣斷線也能控｜HMI/SCADA 監控、MES 製造、ERP 企業｜排查：先現象、由簡入繁、分層、二分、一次改一個｜亂碼→鮑率；I²C→位址＋上拉；MQTT→Topic、1883/8883；Modbus→Slave ID、A/B、120 Ω｜電流串聯、電壓並聯、電阻斷電。<\/p>", "audio": {"src": "audio/d08.mp3", "dur": 637}, "questions": [{"id": "d8q1", "n": 1, "opts": ["感測器（Sensor）", "雲端平台（Cloud Platform）", "閘道器（Gateway）", "致動器（Actuator）"], "exp": "致動器把電訊號轉成實際動作（馬達、繼電器、電磁閥、LED 等），是系統的「輸出」端。感測器是輸入端；閘道器負責協定轉換與上雲；雲端平台負責儲存、分析與管理。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "在智慧溫室系統中，「接收控制訊號後開啟灌溉電磁閥」的元件，屬於物聯網系統中的哪一類元件？", "ref": "考科二 1-1", "src": "能力指標 3（系統元件與架構）", "ans": 3, "stemH": "在智慧溫室系統中，「接收控制訊號後開啟灌溉電磁閥」的元件，屬於物聯網系統中的哪一類元件？", "optsH": ["感測器（Sensor）", "雲端平台（Cloud Platform）", "閘道器（Gateway）", "致動器（Actuator）"], "expH": "致動器把電訊號轉成實際動作（馬達、繼電器、電磁閥、LED 等），是系統的「輸出」端。感測器是輸入端；閘道器負責協定轉換與上雲；雲端平台負責儲存、分析與管理。"}, {"id": "d8q2", "n": 2, "opts": ["工業級大型 PLC 搭配 HMI", "機架式伺服器", "內建 Wi-Fi 與 BLE 的 ESP32 微控制器", "具獨立顯示卡的桌上型電腦"], "exp": "單純的感測上傳節點重視成本、功耗與體積，內建無線模組的 MCU（如 ESP32）最合適。伺服器、桌機成本與功耗過高；大型 PLC 適合產線的即時控制，並非低成本感測節點的最佳選擇。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某專案需要一個便宜、低功耗、開機即可執行、可直接以 Wi-Fi 將溫度資料上傳的感測節點，下列何者最適合作為節點控制器？", "ref": "考科二 1-1", "src": "能力指標 3（系統元件與架構）", "ans": 2, "stemH": "某專案需要一個便宜、低功耗、開機即可執行、可直接以 Wi-Fi 將溫度資料上傳的感測節點，下列何者最適合作為節點控制器？", "optsH": ["工業級大型 PLC 搭配 HMI", "機架式伺服器", "內建 Wi-Fi 與 BLE 的 ESP32 微控制器", "具獨立顯示卡的桌上型電腦"], "expH": "單純的感測上傳節點重視成本、功耗與體積，內建無線模組的 MCU（如 ESP32）最合適。伺服器、桌機成本與功耗過高；大型 PLC 適合產線的即時控制，並非低成本感測節點的最佳選擇。"}, {"id": "d8q3", "n": 3, "opts": ["MCU 通常以裸機程式或 RTOS 執行，即時性佳、耗電低", "單板電腦可執行 Linux 作業系統，適合執行資料庫或 AI 推論等較重的工作", "Raspberry Pi 內建類比數位轉換器（ADC），可直接讀取類比感測器的電壓", "單板電腦突然斷電可能損壞檔案系統，應正常關機"], "exp": "Raspberry Pi 的 GPIO 只有數位輸入輸出，**沒有內建 ADC**，讀類比感測器需外接 ADC 晶片（例如透過 SPI 或 I²C）。A、B、D 皆正確。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "關於微控制器（MCU）與單板電腦（如 Raspberry Pi）的比較，下列敘述何者「不」正確？", "ref": "考科二 1-1", "src": "能力指標 3（系統元件與架構）", "ans": 2, "stemH": "關於微控制器（MCU）與單板電腦（如 Raspberry Pi）的比較，下列敘述何者「不」正確？", "optsH": ["MCU 通常以裸機程式或 RTOS 執行，即時性佳、耗電低", "單板電腦可執行 Linux 作業系統，適合執行資料庫或 AI 推論等較重的工作", "Raspberry Pi 內建類比數位轉換器（ADC），可直接讀取類比感測器的電壓", "單板電腦突然斷電可能損壞檔案系統，應正常關機"], "expH": "Raspberry Pi 的 GPIO 只有數位輸入輸出，<b>沒有內建 ADC<\/b>，讀類比感測器需外接 ADC 晶片（例如透過 SPI 或 I²C）。A、B、D 皆正確。"}, {"id": "d8q4", "n": 4, "opts": ["將現場 Modbus 設備資料轉換成 MQTT 上傳，並在網路中斷時先暫存資料", "以多年的全廠資料訓練大型深度學習模型", "提供跨國各廠區的經營管理報表", "直接把物理量轉換成電訊號"], "exp": "閘道器（邊緣端）的典型工作是協定轉換、資料前處理、即時判斷與斷線暫存（store and forward）。大型模型訓練與跨廠區報表適合雲端；把物理量轉成電訊號是感測器的工作。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "在「端－邊－雲」架構中，下列哪一項工作最適合放在「邊緣閘道器」執行？", "ref": "考科二 1-1", "src": "能力指標 3（系統元件與架構）", "ans": 0, "stemH": "在「端－邊－雲」架構中，下列哪一項工作最適合放在「邊緣閘道器」執行？", "optsH": ["將現場 Modbus 設備資料轉換成 MQTT 上傳，並在網路中斷時先暫存資料", "以多年的全廠資料訓練大型深度學習模型", "提供跨國各廠區的經營管理報表", "直接把物理量轉換成電訊號"], "expH": "閘道器（邊緣端）的典型工作是協定轉換、資料前處理、即時判斷與斷線暫存（store and forward）。大型模型訓練與跨廠區報表適合雲端；把物理量轉成電訊號是感測器的工作。"}, {"id": "d8q5", "n": 5, "opts": ["ERP（企業資源規劃）", "PLC（可程式邏輯控制器）", "HMI（人機介面）", "MES（製造執行系統）"], "exp": "MES 位於企業層（ERP）與控制層（PLC／SCADA）之間，負責製造現場的工單、追蹤、品質與績效。ERP 管訂單、採購、財務；HMI 是操作畫面；PLC 執行即時邏輯控制。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "在工廠的資訊系統分層中，負責「工單派工、生產過程追蹤、品質紀錄與即時生產績效」的系統是下列何者？", "ref": "考科二 1-1", "src": "能力指標 3（系統元件與架構）", "ans": 3, "stemH": "在工廠的資訊系統分層中，負責「工單派工、生產過程追蹤、品質紀錄與即時生產績效」的系統是下列何者？", "optsH": ["ERP（企業資源規劃）", "PLC（可程式邏輯控制器）", "HMI（人機介面）", "MES（製造執行系統）"], "expH": "MES 位於企業層（ERP）與控制層（PLC／SCADA）之間，負責製造現場的工單、追蹤、品質與績效。ERP 管訂單、採購、財務；HMI 是操作畫面；PLC 執行即時邏輯控制。"}, {"id": "d8q6", "n": 6, "opts": ["沒有問題，兩者電壓準位相同", "Raspberry Pi 的 GPIO 為 3.3 V，不耐 5 V，可能損壞；應加電壓準位轉換（如分壓或準位轉換模組）", "訊號會變成類比訊號，需要加 ADC", "只要把程式的鮑率調高即可"], "exp": "Raspberry Pi 與 ESP32 的 GPIO 為 3.3 V 準位，直接輸入 5 V 可能損壞腳位，需要分壓電路或雙向準位轉換模組。鮑率是序列通訊參數，與電壓準位無關。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "將 Arduino Uno（5 V I/O）的數位輸出腳直接接到 Raspberry Pi 的 GPIO 輸入腳，最可能產生什麼問題？應如何處理？", "ref": "考科二 1-1", "src": "能力指標 3（系統元件與架構）", "ans": 1, "stemH": "將 Arduino Uno（5 V I/O）的數位輸出腳直接接到 Raspberry Pi 的 GPIO 輸入腳，最可能產生什麼問題？應如何處理？", "optsH": ["沒有問題，兩者電壓準位相同", "Raspberry Pi 的 GPIO 為 3.3 V，不耐 5 V，可能損壞；應加電壓準位轉換（如分壓或準位轉換模組）", "訊號會變成類比訊號，需要加 ADC", "只要把程式的鮑率調高即可"], "expH": "Raspberry Pi 與 ESP32 的 GPIO 為 3.3 V 準位，直接輸入 5 V 可能損壞腳位，需要分壓電路或雙向準位轉換模組。鮑率是序列通訊參數，與電壓準位無關。"}, {"id": "d8q7", "n": 7, "opts": ["雲端資料庫的資料表索引", "監控端與裝置端的鮑率（Baud Rate）與資料格式設定是否一致", "Wi-Fi 密碼是否正確", "感測器外殼是否防水"], "exp": "序列埠亂碼最常見的原因是兩端鮑率或資料格式（如 8N1）不一致；其次是 TX/RX 接錯或電壓準位不同（RS-232 與 TTL）。資料庫、Wi-Fi、外殼都與序列埠亂碼無直接關係。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "工程師以序列埠監控視窗觀察感測節點輸出，畫面卻全是亂碼。最優先應檢查的是？", "ref": "考科二 1-2", "src": "能力指標 3（系統故障問題判斷與排除）", "ans": 1, "stemH": "工程師以序列埠監控視窗觀察感測節點輸出，畫面卻全是亂碼。最優先應檢查的是？", "optsH": ["雲端資料庫的資料表索引", "監控端與裝置端的鮑率（Baud Rate）與資料格式設定是否一致", "Wi-Fi 密碼是否正確", "感測器外殼是否防水"], "expH": "序列埠亂碼最常見的原因是兩端鮑率或資料格式（如 8N1）不一致；其次是 TX/RX 接錯或電壓準位不同（RS-232 與 TTL）。資料庫、Wi-Fi、外殼都與序列埠亂碼無直接關係。"}, {"id": "d8q8", "n": 8, "opts": ["兩顆感測器的 I²C 位址相同，發生位址衝突", "I²C 需要每顆裝置一條獨立的片選（CS）線", "I²C 屬於非同步通訊，兩顆裝置時脈不同", "感測器的電源電壓太穩定"], "exp": "I²C 以「位址」區分匯流排上的裝置，同型號感測器預設位址相同就會衝突，需用位址選擇腳更改位址或改用 I²C 多工器。片選（CS）線是 SPI 的做法；I²C 是同步通訊（有 SCL 時脈線）。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "以 I²C 匯流排連接兩顆相同型號的感測器，結果只讀得到其中一顆，或兩顆讀值互相干擾。最可能的原因是？", "ref": "考科二 1-2", "src": "能力指標 3（系統故障問題判斷與排除）", "ans": 0, "stemH": "以 I²C 匯流排連接兩顆相同型號的感測器，結果只讀得到其中一顆，或兩顆讀值互相干擾。最可能的原因是？", "optsH": ["兩顆感測器的 I²C 位址相同，發生位址衝突", "I²C 需要每顆裝置一條獨立的片選（CS）線", "I²C 屬於非同步通訊，兩顆裝置時脈不同", "感測器的電源電壓太穩定"], "expH": "I²C 以「位址」區分匯流排上的裝置，同型號感測器預設位址相同就會衝突，需用位址選擇腳更改位址或改用 I²C 多工器。片選（CS）線是 SPI 的做法；I²C 是同步通訊（有 SCL 時脈線）。"}, {"id": "d8q9", "n": 9, "opts": ["MQTT 的 QoS 設太低，應改成 QoS 2", "馬達啟動電流造成電源電壓瞬間下陷，應讓馬達與控制板分開供電並加強電源（並保持共地）", "ESP32 的程式語言不適合，應改用其他語言", "應把 Wi-Fi 頻段改成 5 GHz"], "exp": "「負載啟動就重開機」是典型的電源電壓下陷（brownout）現象。改善：致動器獨立電源、加大電源容量、加電容、繼電器線圈加飛輪二極體並注意共地。QoS、程式語言與 Wi-Fi 頻段都不是原因。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某系統只要繼電器驅動的抽水馬達一啟動，ESP32 就會重新開機。下列哪一項是最合理的推論與改善方向？", "ref": "考科二 1-2", "src": "能力指標 3（系統故障問題判斷與排除）", "ans": 1, "stemH": "某系統只要繼電器驅動的抽水馬達一啟動，ESP32 就會重新開機。下列哪一項是最合理的推論與改善方向？", "optsH": ["MQTT 的 QoS 設太低，應改成 QoS 2", "馬達啟動電流造成電源電壓瞬間下陷，應讓馬達與控制板分開供電並加強電源（並保持共地）", "ESP32 的程式語言不適合，應改用其他語言", "應把 Wi-Fi 頻段改成 5 GHz"], "expH": "「負載啟動就重開機」是典型的電源電壓下陷（brownout）現象。改善：致動器獨立電源、加大電源容量、加電容、繼電器線圈加飛輪二極體並注意共地。QoS、程式語言與 Wi-Fi 頻段都不是原因。"}, {"id": "d8q10", "n": 10, "opts": ["發布端的 Topic 是 `factory/Line1/temp`，訂閱端寫成 `factory/line1/temp`", "儀表板訂閱的 Broker 位址或埠號與發布端不同", "兩個用戶端使用相同的 Client ID，連線互相踢掉", "感測器的量測範圍太大"], "exp": "MQTT 的 Topic 有區分大小寫，A 會導致收不到；B 連到不同 Broker 當然收不到；C 相同 Client ID 會讓前一個連線被斷開。量測範圍與「收不到訊息」無關。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "感測節點的 MQTT 用戶端顯示已連上 Broker 並成功發布，但儀表板程式收不到資料。下列哪一項「最不可能」是原因？", "ref": "考科二 1-2", "src": "能力指標 3（系統故障問題判斷與排除）", "ans": 3, "stemH": "感測節點的 MQTT 用戶端顯示已連上 Broker 並成功發布，但儀表板程式收不到資料。下列哪一項「最不可能」是原因？", "optsH": ["發布端的 Topic 是 <code>factory/Line1/temp<\/code>，訂閱端寫成 <code>factory/line1/temp<\/code>", "儀表板訂閱的 Broker 位址或埠號與發布端不同", "兩個用戶端使用相同的 Client ID，連線互相踢掉", "感測器的量測範圍太大"], "expH": "MQTT 的 Topic 有區分大小寫，A 會導致收不到；B 連到不同 Broker 當然收不到；C 相同 Client ID 會讓前一個連線被斷開。量測範圍與「收不到訊息」無關。"}, {"id": "d8q11", "n": 11, "opts": ["ping", "示波器", "三用電表的電阻檔", "邏輯分析儀"], "exp": "ping 用 ICMP 測試與目標主機是否連通；traceroute 可再看封包路徑在哪裡中斷，nslookup 查 DNS。示波器、三用電表、邏輯分析儀是硬體訊號層級的工具。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "一台裝置已取得 IP，但無法連到雲端伺服器。若要先確認「裝置與目標主機之間網路是否連通」，最適合的基本工具是？", "ref": "考科二 1-2", "src": "能力指標 3（系統故障問題判斷與排除）", "ans": 0, "stemH": "一台裝置已取得 IP，但無法連到雲端伺服器。若要先確認「裝置與目標主機之間網路是否連通」，最適合的基本工具是？", "optsH": ["ping", "示波器", "三用電表的電阻檔", "邏輯分析儀"], "expH": "ping 用 ICMP 測試與目標主機是否連通；traceroute 可再看封包路徑在哪裡中斷，nslookup 查 DNS。示波器、三用電表、邏輯分析儀是硬體訊號層級的工具。"}, {"id": "d8q12", "n": 12, "opts": ["量測電流時，電表應與待測元件並聯", "量測電壓時，電表應與待測元件串聯", "量測電阻時，應先將電路斷電", "三用電表可直接解碼 I²C 封包內容"], "exp": "量電阻需斷電，否則電路中的電壓會影響讀值甚至損壞電表。量電流要串聯、量電壓要並聯。解碼 I²C／SPI／UART 封包要用邏輯分析儀（部分示波器亦有解碼功能）。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "關於三用電表的使用方式，下列敘述何者正確？", "ref": "考科二 1-2", "src": "能力指標 3（系統故障問題判斷與排除）", "ans": 2, "stemH": "關於三用電表的使用方式，下列敘述何者正確？", "optsH": ["量測電流時，電表應與待測元件並聯", "量測電壓時，電表應與待測元件串聯", "量測電阻時，應先將電路斷電", "三用電表可直接解碼 I²C 封包內容"], "expH": "量電阻需斷電，否則電路中的電壓會影響讀值甚至損壞電表。量電流要串聯、量電壓要並聯。解碼 I²C／SPI／UART 封包要用邏輯分析儀（部分示波器亦有解碼功能）。"}]}, {"id": 9, "date": "2026-10-26", "subject": "考科二", "type": "study", "title": "物聯網資訊安全、硬體設計基礎與 I/O、開源授權", "short": "資安＋硬體 I/O＋授權", "lectureChars": 4891, "lecture": "<blockquote>\n<p><strong>📌 考科二說明<\/strong>：本日內容依簡章評鑑內容 1-3（物聯網資訊安全，能力指標 3）、2-1（物聯網硬體設計基礎，能力指標 2：I/O 通訊與控制方式基礎、開源硬體規劃與授權規範）及能力指標 1 的「開源軟體規劃與授權規範」撰寫；考科二無官方學習指引，內容皆為一般技術知識（標「補充」）。<\/p>\n<\/blockquote>\n<h3>今天要搞懂的 5 件事<\/h3>\n<ol>\n<li>IoT 裝置最常見的資安弱點（預設密碼、未加密、不更新、除錯埠外露）與對應防護。<\/li>\n<li>隱私保護的基本原則：資料最小化、告知同意、去識別化、存取控制。<\/li>\n<li>數位 I/O、類比 I/O、PWM、上拉／下拉電阻的觀念與計算。<\/li>\n<li>驅動負載與控制方式：電晶體／繼電器、飛輪二極體、光耦合器、輪詢 vs 中斷、看門狗、4–20 mA、RS-232／RS-485。<\/li>\n<li>開源硬體與開源軟體授權：Copyleft（GPL）與寬鬆型（MIT、BSD、Apache）的差別。<\/li>\n<\/ol>\n<h2>1. IoT 裝置常見的資安弱點 <span class=\"ref\">考科二 1-3<\/span><span class=\"supp\">補充（能力指標 3：物聯網資安與隱私權）<\/span><\/h2>\n<p>OWASP（開放式 Web 應用程式安全計畫）整理的 <strong>IoT Top 10（2018 版）<\/strong> 第一名就是「<strong>弱密碼、可猜測或寫死（hardcoded）的密碼<\/strong>」。常見弱點與攻擊：<\/p>\n<table>\n<thead>\n<tr>\n<th>弱點<\/th>\n<th>可能後果<\/th>\n<th>防護<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>出廠預設帳密、所有裝置同一組密碼<\/td>\n<td>被殭屍網路（如 Mirai）大量入侵，拿來發動 DDoS<\/td>\n<td><strong>每台唯一密碼<\/strong>、首次使用強制修改<\/td>\n<\/tr>\n<tr>\n<td>傳輸未加密（明文 HTTP、MQTT 1883）<\/td>\n<td>竊聽、<strong>中間人攻擊（MITM）<\/strong>、竄改<\/td>\n<td><strong>TLS<\/strong>（HTTPS、MQTT over TLS 常用埠 8883）、CoAP 用 <strong>DTLS<\/strong><\/td>\n<\/tr>\n<tr>\n<td>韌體有漏洞但無法更新<\/td>\n<td>漏洞長期存在<\/td>\n<td><strong>安全 OTA 更新<\/strong>（更新檔需<strong>數位簽章<\/strong>驗證）<\/td>\n<\/tr>\n<tr>\n<td>被植入惡意韌體<\/td>\n<td>裝置被控制<\/td>\n<td><strong>安全開機（Secure Boot）<\/strong>：只執行經簽章驗證的韌體<\/td>\n<\/tr>\n<tr>\n<td>除錯埠（UART、JTAG）開放、裝置可被拆解<\/td>\n<td>讀出韌體與金鑰<\/td>\n<td>量產關閉除錯埠、加密儲存、<strong>安全元件／TPM<\/strong> 保管金鑰<\/td>\n<\/tr>\n<tr>\n<td>開啟不必要的網路服務（Telnet 等）<\/td>\n<td>擴大攻擊面<\/td>\n<td>關閉不用的服務與埠號<\/td>\n<\/tr>\n<tr>\n<td>重放攻擊（Replay）<\/td>\n<td>攻擊者重送截獲的合法指令（例如開門）<\/td>\n<td>加入時間戳、亂數（nonce）、序號<\/td>\n<\/tr>\n<tr>\n<td>物聯網與辦公網路混在一起<\/td>\n<td>一台被入侵就橫向擴散<\/td>\n<td><strong>網路分段<\/strong>（獨立 VLAN、防火牆）、<strong>最小權限<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 記法（裝置資安基本功）<\/strong>：<strong>改密碼、加密傳、能更新、驗開機、關後門、分網段、留紀錄<\/strong>。歐洲 ETSI EN 303 645 消費性 IoT 資安基準也把「不得使用通用預設密碼」「提供漏洞通報管道」「保持軟體更新」列為前三項要求。<\/p>\n<\/blockquote>\n<h2>2. 身分認證、加密與資安三要素 <span class=\"ref\">考科二 1-3<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<ul>\n<li><strong>CIA 三要素<\/strong>：機密性（加密）、完整性（雜湊、數位簽章）、可用性（備援、防 DDoS）。<\/li>\n<li><strong>裝置身分認證<\/strong>：帳號密碼、Token／API Key、<strong>X.509 數位憑證<\/strong>；高安全場合用<strong>雙向 TLS（mTLS）<\/strong>，伺服器與裝置互相驗證。<\/li>\n<li><strong>對稱加密<\/strong>（AES，同一把金鑰，快，適合大量資料）vs <strong>非對稱加密<\/strong>（RSA、ECC，公鑰／私鑰，用於交換金鑰與數位簽章）。TLS 就是先用非對稱交換金鑰，再用對稱加密傳資料。<\/li>\n<li><strong>存取控制<\/strong>：依角色授權（RBAC）、最小權限；MQTT Broker 可設定 ACL 限制每個用戶端能發布或訂閱哪些 Topic。<\/li>\n<li><strong>監控與事件應變<\/strong>：記錄登入與異常流量、設定告警、定期弱點掃描。<\/li>\n<\/ul>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：<strong>加密<\/strong>保護機密性（別人看不懂）；<strong>雜湊<\/strong>保護完整性（看得出被改過），雜湊不可逆、不能「解密」。<strong>數位簽章<\/strong>＝用<strong>私鑰<\/strong>簽、<strong>公鑰<\/strong>驗，可證明來源與不可否認。<\/p>\n<\/blockquote>\n<h2>3. 隱私權保護 <span class=\"ref\">考科二 1-3<\/span><span class=\"supp\">補充（能力指標 3：物聯網資安與隱私權）<\/span><\/h2>\n<p>IoT 會蒐集位置、影像、聲音、健康與行為資料，屬於個人資料時需遵守我國《個人資料保護法》（歐盟則為 GDPR）。設計原則：\n- <strong>資料最小化<\/strong>：只蒐集達成目的所需的資料（例如人流計數只需「人數」，不需保存人臉影像）。\n- <strong>告知與同意<\/strong>：說明蒐集目的、範圍、保存期限與利用方式。\n- <strong>去識別化<\/strong>：在邊緣端先做遮蔽、匿名化或假名化再上傳。\n- <strong>安全保存與限期刪除<\/strong>：加密儲存、存取控制、到期刪除。\n- <strong>隱私設計（Privacy by Design）<\/strong>：從系統設計之初就納入隱私保護，而非事後補救。<\/p>\n<h2>4. 數位與類比 I/O 基礎 <span class=\"ref\">考科二 2-1<\/span><span class=\"supp\">補充（能力指標 2：I/O 通訊與控制方式基礎）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>類型<\/th>\n<th>說明<\/th>\n<th>例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>數位輸入 DI<\/td>\n<td>讀取 HIGH／LOW 兩種狀態<\/td>\n<td>按鈕、極限開關、PIR 輸出<\/td>\n<\/tr>\n<tr>\n<td>數位輸出 DO<\/td>\n<td>輸出 HIGH／LOW<\/td>\n<td>LED、繼電器控制腳<\/td>\n<\/tr>\n<tr>\n<td>類比輸入 AI<\/td>\n<td>經 <strong>ADC<\/strong> 轉成數值<\/td>\n<td>光敏電阻分壓、可變電阻、類比溫度感測器<\/td>\n<\/tr>\n<tr>\n<td>類比輸出 AO<\/td>\n<td>經 <strong>DAC<\/strong> 輸出電壓，或用 <strong>PWM<\/strong> 模擬<\/td>\n<td>調光、馬達調速、音訊<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>浮接（Floating）<\/strong>：輸入腳沒接到確定電位時讀值會亂跳 → 加<strong>上拉電阻<\/strong>（平時 HIGH，按下接地變 LOW）或<strong>下拉電阻<\/strong>（平時 LOW）。許多 MCU 內建上拉電阻（如 Arduino <code>INPUT_PULLUP<\/code>）。<\/li>\n<li><strong>按鍵彈跳（Bounce）<\/strong>：機械開關切換瞬間會抖動多次 → 用軟體延遲或 RC 電路<strong>去彈跳（Debounce）<\/strong>。<\/li>\n<li><strong>ADC<\/strong>：10 位元 ADC 有 2¹⁰＝1024 階（0～1023）；參考電壓 5 V 時，讀值 512 約等於 2.5 V。<\/li>\n<li><strong>PWM（脈波寬度調變）<\/strong>：用固定頻率的方波，改變<strong>占空比（Duty Cycle）<\/strong>＝高電位時間 ÷ 週期。平均電壓 ≈ 電源電壓 × 占空比，例如 5 V × 25 %＝1.25 V。用於 LED 調光、直流馬達調速、伺服馬達定位（伺服機看的是脈波寬度）。<\/li>\n<\/ul>\n<blockquote>\n<p><strong>💡 例子（LED 限流電阻）<\/strong>：電源 5 V、LED 順向電壓 2 V、希望電流 15 mA → R＝(5−2)÷0.015＝200 Ω（實務選相近的標準值，如 220 Ω）。<\/p>\n<\/blockquote>\n<h2>5. 驅動負載與隔離保護 <span class=\"ref\">考科二 2-1<\/span><span class=\"supp\">補充（能力指標 2）<\/span><\/h2>\n<p>MCU 的 GPIO 只能提供很小的電流（每腳約數 mA 至數十 mA，依晶片規格），<strong>不能直接驅動馬達、電磁閥、燈泡<\/strong>。<\/p>\n<table>\n<thead>\n<tr>\n<th>元件<\/th>\n<th>用途<\/th>\n<th>注意<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>電晶體（BJT）／MOSFET<\/td>\n<td>以小訊號控制直流負載的大電流<\/td>\n<td>MOSFET 常用於 PWM 調速<\/td>\n<\/tr>\n<tr>\n<td>繼電器（Relay）<\/td>\n<td>以小電流控制大電流或<strong>交流市電<\/strong>的開關，觸點與控制端電氣隔離<\/td>\n<td>機械觸點有壽命、切換慢、有噪音<\/td>\n<\/tr>\n<tr>\n<td>固態繼電器（SSR）<\/td>\n<td>無機械觸點的半導體開關<\/td>\n<td>無火花、壽命長、可快速切換<\/td>\n<\/tr>\n<tr>\n<td>馬達驅動 IC（H 橋，如 L298N）<\/td>\n<td>控制直流馬達<strong>正反轉<\/strong>與速度<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>飛輪二極體（Flyback Diode）<\/strong><\/td>\n<td>並聯在<strong>繼電器線圈、馬達<\/strong>等<strong>感性負載<\/strong>兩端，吸收斷電時的反電動勢<\/td>\n<td>不加可能燒毀電晶體或 MCU<\/td>\n<\/tr>\n<tr>\n<td><strong>光耦合器（Optocoupler）<\/strong><\/td>\n<td>用光傳遞訊號，使控制端與負載端<strong>電氣隔離<\/strong><\/td>\n<td>抗雜訊、保護 MCU<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>6. 控制方式與工業 I/O 介面 <span class=\"ref\">考科二 2-1<\/span><span class=\"supp\">補充（能力指標 2：I/O 通訊與控制方式基礎）<\/span><\/h2>\n<ul>\n<li><strong>輪詢（Polling）<\/strong>：程式反覆檢查狀態，簡單但浪費 CPU、可能漏掉短暫事件。<\/li>\n<li><strong>中斷（Interrupt）<\/strong>：事件發生時硬體通知 CPU 立即處理，反應快、省電（可配合睡眠模式）。<\/li>\n<li><strong>計時器（Timer）<\/strong>：定時取樣、產生 PWM。<strong>看門狗（Watchdog Timer）<\/strong>：程式當機未按時「餵狗」就自動重置系統。<\/li>\n<li><strong>開迴路<\/strong>（只下命令不看結果）vs <strong>閉迴路<\/strong>（依感測回授調整，如 ON/OFF 溫控、PID 控制）。<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>介面<\/th>\n<th>特性<\/th>\n<th>用途<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>UART／I²C／SPI（D5 已學）<\/td>\n<td>板上或短距離<\/td>\n<td>感測器、模組<\/td>\n<\/tr>\n<tr>\n<td><strong>RS-232<\/strong><\/td>\n<td>單端訊號、點對點、距離短（約 15 m）<\/td>\n<td>舊設備、儀器<\/td>\n<\/tr>\n<tr>\n<td><strong>RS-485<\/strong><\/td>\n<td><strong>差動訊號<\/strong>、抗雜訊、<strong>多點<\/strong>連線（常見 32 個單位負載）、可達約 <strong>1200 m<\/strong>，常用半雙工<\/td>\n<td><strong>Modbus RTU<\/strong>、工業現場<\/td>\n<\/tr>\n<tr>\n<td><strong>CAN Bus<\/strong><\/td>\n<td>差動、多主控、具錯誤偵測<\/td>\n<td>汽車、工業機械<\/td>\n<\/tr>\n<tr>\n<td><strong>4–20 mA 電流迴路<\/strong><\/td>\n<td>長距離抗雜訊、不受線阻影響；<strong>4 mA 代表最小值，0 mA 代表斷線<\/strong><\/td>\n<td>工業感測器、變送器<\/td>\n<\/tr>\n<tr>\n<td>0–10 V 電壓訊號<\/td>\n<td>簡單，但長距離易受壓降影響<\/td>\n<td>變頻器設定<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：4–20 mA 用 <strong>4 mA 而不是 0 mA<\/strong> 當起點，就是為了能分辨「量到最小值」與「線斷了」。<\/p>\n<\/blockquote>\n<h2>7. 開源硬體的規劃與授權 <span class=\"ref\">考科二 2-1<\/span><span class=\"supp\">補充（能力指標 2：開源硬體規劃與授權規範）<\/span><\/h2>\n<ul>\n<li><strong>開源硬體<\/strong>：公開設計檔（<strong>原理圖、PCB 佈線、物料清單 BOM<\/strong>、韌體與文件），讓任何人可研究、修改、製造與販售。開源硬體協會（OSHWA）有定義與認證。<\/li>\n<li><strong>常見授權<\/strong>：<strong>CERN OHL v2<\/strong>（分 -P 寬鬆、-W 弱互惠、-S 強互惠三種）、<strong>TAPR OHL<\/strong>、<strong>CC BY-SA<\/strong>（姓名標示－相同方式分享，Arduino 參考設計即採用）。<\/li>\n<li><strong>商標不在開源範圍內<\/strong>：Arduino 電路可以合法複製販售，但不能用「Arduino」商標，只能稱「相容板（compatible）」。<\/li>\n<li><strong>Raspberry Pi 的定位<\/strong>：軟體生態大多開源，但主板設計並未以開源硬體授權完整公開，一般不視為開源硬體。<\/li>\n<li><strong>規劃時考量<\/strong>：授權是否允許商用、衍生設計是否必須以相同授權公開、需保留的姓名標示、元件是否容易取得。<\/li>\n<\/ul>\n<h2>8. 開源軟體的規劃與授權 <span class=\"ref\">考科二 2-2<\/span><span class=\"supp\">補充（能力指標 1：開源軟體規劃與授權規範）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>授權<\/th>\n<th>類型<\/th>\n<th>散布修改後的程式時<\/th>\n<th>IoT 常見例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>GPL<\/strong>（v2／v3）<\/td>\n<td><strong>強 Copyleft（著作傳染性）<\/strong><\/td>\n<td>衍生作品<strong>必須以 GPL 開放原始碼<\/strong><\/td>\n<td>Linux 核心（GPLv2）<\/td>\n<\/tr>\n<tr>\n<td><strong>LGPL<\/strong><\/td>\n<td>弱 Copyleft<\/td>\n<td>只是<strong>連結使用<\/strong>函式庫，自己的程式可閉源；<strong>修改函式庫本身<\/strong>須開源<\/td>\n<td>Arduino 核心函式庫（LGPL）<\/td>\n<\/tr>\n<tr>\n<td><strong>MPL 2.0<\/strong><\/td>\n<td>檔案層級 Copyleft<\/td>\n<td>修改到的那些檔案需開源<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>MIT<\/strong><\/td>\n<td>寬鬆型<\/td>\n<td>保留版權與授權聲明即可，可閉源商用<\/td>\n<td>FreeRTOS<\/td>\n<\/tr>\n<tr>\n<td><strong>BSD<\/strong><\/td>\n<td>寬鬆型<\/td>\n<td>保留聲明；部分版本禁止用作者名背書<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Apache 2.0<\/strong><\/td>\n<td>寬鬆型<\/td>\n<td>保留聲明與 NOTICE、標示修改；<strong>含明確專利授權<\/strong><\/td>\n<td>Node-RED、Zephyr RTOS<\/td>\n<\/tr>\n<tr>\n<td><strong>AGPL<\/strong><\/td>\n<td>網路 Copyleft<\/td>\n<td>即使只是<strong>透過網路提供服務<\/strong>也要開源<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>規劃重點：\n- <strong>只在內部使用、沒有散布<\/strong>，GPL 不要求公開原始碼（AGPL 例外：網路服務也算）。\n- 產品出貨前做<strong>授權盤點<\/strong>，建立 <strong>SBOM（軟體物料清單）<\/strong>，保留 LICENSE／NOTICE 檔。\n- 注意<strong>授權相容性<\/strong>：例如 Apache 2.0 與 GPLv2 不相容，與 GPLv3 相容。\n- 開源不等於免費放棄權利：仍有著作權，只是依授權條件授權他人使用。<\/p>\n<h3>今日 30 秒回顧<\/h3>\n<p>預設密碼＝第一大弱點（Mirai）｜TLS、MQTT 8883、CoAP 用 DTLS｜簽章 OTA＋Secure Boot｜關除錯埠、分網段、最小權限｜隱私：最小化、同意、去識別、限期刪除、PbD｜浮接→上拉／下拉｜10 位元 ADC＝0～1023｜PWM 平均電壓＝V×占空比｜感性負載加飛輪二極體、光耦隔離｜中斷比輪詢快又省電、看門狗自動重置｜RS-485 差動多點 1200 m｜4 mA 起點、0 mA＝斷線｜開源硬體：CERN OHL、TAPR、CC BY-SA，商標除外｜GPL 傳染、LGPL 連結可閉源、MIT/BSD/Apache 寬鬆（Apache 有專利授權）、AGPL 連網路服務也算。<\/p>", "audi
