排，距離可達約 1200 公尺，是 Modbus RTU 最常用的實體層。RS-232 為點對點且距離短；I²C 與 USB 適合板上或短距離。"}, {"id": "d9q11", "n": 11, "opts": ["電流訊號在長距離傳輸時較不受導線電阻造成的壓降影響", "以 4 mA 代表量測下限，因此讀到 0 mA 可判斷為線路斷線", "4–20 mA 是數位通訊協定，需要設定鮑率", "相較於電壓訊號較能抵抗雜訊干擾"], "exp": "4–20 mA 是類比電流迴路訊號，不需設定鮑率（HART 等協定可在其上疊加數位訊號，但 4–20 mA 本身是類比）。A、B、D 皆是其優點。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "工業感測器常使用 4–20 mA 電流訊號傳送量測值。關於 4–20 mA 的敘述，下列何者「不」正確？", "ref": "考科二 2-1", "src": "能力指標 2（I/O 通訊與控制方式基礎）", "ans": 2, "stemH": "工業感測器常使用 4–20 mA 電流訊號傳送量測值。關於 4–20 mA 的敘述，下列何者「不」正確？", "optsH": ["電流訊號在長距離傳輸時較不受導線電阻造成的壓降影響", "以 4 mA 代表量測下限，因此讀到 0 mA 可判斷為線路斷線", "4–20 mA 是數位通訊協定，需要設定鮑率", "相較於電壓訊號較能抵抗雜訊干擾"], "expH": "4–20 mA 是類比電流迴路訊號，不需設定鮑率（HART 等協定可在其上疊加數位訊號，但 4–20 mA 本身是類比）。A、B、D 皆是其優點。"}, {"id": "d9q12", "n": 12, "opts": ["因為是公司產品，可不提供任何原始碼", "散布時應依 GPL 提供修改後程式的原始碼，並保留授權條款", "只要刪除原作者的版權聲明即可閉源", "改用 MIT 授權重新發布該修改版本"], "exp": "GPL 屬強 Copyleft：散布衍生作品時必須以相同（GPL）授權提供原始碼。不能移除版權聲明，也不能把他人的 GPL 程式改用 MIT 授權。若只在內部使用、未散布，則 GPL 不要求公開。MIT、BSD、Apache 2.0 屬寬鬆型授權，保留聲明即可閉源商用。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某公司開發的閘道器產品要出貨給客戶，韌體中修改了一套以 GPL 授權的開源程式。依 GPL 規範，下列做法何者正確？", "ref": "考科二 2-2", "src": "能力指標 1（開源軟體規劃與授權規範）", "ans": 1, "stemH": "某公司開發的閘道器產品要出貨給客戶，韌體中修改了一套以 GPL 授權的開源程式。依 GPL 規範，下列做法何者正確？", "optsH": ["因為是公司產品，可不提供任何原始碼", "散布時應依 GPL 提供修改後程式的原始碼，並保留授權條款", "只要刪除原作者的版權聲明即可閉源", "改用 MIT 授權重新發布該修改版本"], "expH": "GPL 屬強 Copyleft：散布衍生作品時必須以相同（GPL）授權提供原始碼。不能移除版權聲明，也不能把他人的 GPL 程式改用 MIT 授權。若只在內部使用、未散布，則 GPL 不要求公開。MIT、BSD、Apache 2.0 屬寬鬆型授權，保留聲明即可閉源商用。"}]}, {"id": 10, "date": "2026-10-27", "subject": "考科二", "type": "study", "title": "雲端數據收集與平台設計：資料交換格式、資料庫設計", "short": "雲端資料＋資料庫", "lectureChars": 4162, "lecture": "<blockquote>\n<p><strong>📌 考科二說明<\/strong>：本日內容依簡章評鑑內容 2-2「雲端環境數據收集與平台設計」與能力指標 1「軟體設計基礎（雲端資料交換格式、資料庫設計基礎）」撰寫；考科二無官方學習指引，內容皆為一般技術知識（標「補充」）。<\/p>\n<\/blockquote>\n<h3>今天要搞懂的 5 件事<\/h3>\n<ol>\n<li>雲端數據收集的流程：裝置 → 傳輸 → 接收（Broker／API）→ 處理 → 儲存 → 視覺化與應用。<\/li>\n<li>JSON、XML、CSV 的語法與優缺點，能看懂並找出格式錯誤。<\/li>\n<li>REST API 的 HTTP 方法與狀態碼；MQTT Topic 的命名設計。<\/li>\n<li>關聯式資料庫設計：資料表、主鍵、外鍵、正規化（1NF～3NF）、基本 SQL。<\/li>\n<li>NoSQL 與時序資料庫的特性，以及 IoT 資料該存哪裡。<\/li>\n<\/ol>\n<h2>1. 雲端數據收集與平台架構 <span class=\"ref\">考科二 2-2<\/span><span class=\"supp\">補充（能力指標 1）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>階段<\/th>\n<th>做什麼<\/th>\n<th>常見技術<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>擷取<\/td>\n<td>裝置讀取感測值、加上時間戳與裝置 ID<\/td>\n<td>MCU、閘道器<\/td>\n<\/tr>\n<tr>\n<td>傳輸<\/td>\n<td>送到雲端<\/td>\n<td>MQTT、HTTP/REST、CoAP、WebSocket<\/td>\n<\/tr>\n<tr>\n<td>接收<\/td>\n<td>接入與驗證裝置<\/td>\n<td>MQTT Broker、API Gateway、IoT 平台（如 AWS IoT Core、Azure IoT Hub）<\/td>\n<\/tr>\n<tr>\n<td>處理<\/td>\n<td>清洗、轉換、規則判斷、告警；即時串流或批次<\/td>\n<td>規則引擎、串流處理、Node-RED<\/td>\n<\/tr>\n<tr>\n<td>儲存<\/td>\n<td>依資料特性選資料庫<\/td>\n<td>關聯式、NoSQL、時序資料庫、物件儲存<\/td>\n<\/tr>\n<tr>\n<td>應用<\/td>\n<td>視覺化、分析、AI、對外 API<\/td>\n<td>Grafana 等儀表板、報表、App<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>平台設計考量<\/strong>：<strong>可擴充性<\/strong>（裝置數量成長，水平擴充）、<strong>可靠性<\/strong>（斷線重傳、資料不遺失）、<strong>即時性<\/strong>、<strong>資安<\/strong>（裝置認證、加密、權限）、<strong>成本<\/strong>（傳輸與儲存費用）、<strong>資料保存政策<\/strong>（原始資料保留多久、舊資料降採樣彙總）、<strong>裝置管理<\/strong>（註冊、狀態、OTA）。<\/p>\n<blockquote>\n<p><strong>💡 例子（資料量估算）<\/strong>：1000 台裝置、每 10 秒上傳一筆、每筆 200 bytes → 每天 1000×8640×200 ≈ 1.7 GB。這類估算決定要不要在邊緣先彙整，以及資料庫與費用的規劃。<\/p>\n<\/blockquote>\n<h2>2. 資料交換格式：JSON、XML、CSV <span class=\"ref\">考科二 2-2<\/span><span class=\"supp\">補充（能力指標 1：雲端資料交換格式）<\/span><\/h2>\n<p><strong>JSON（JavaScript Object Notation）<\/strong><\/p>\n<pre><code class=\"language-json\">{\n  &quot;deviceId&quot;: &quot;TH-001&quot;,\n  &quot;ts&quot;: &quot;2026-10-27T08:30:00+08:00&quot;,\n  &quot;temp&quot;: 26.5,\n  &quot;online&quot;: true,\n  &quot;tags&quot;: [&quot;lineA&quot;, &quot;zone3&quot;],\n  &quot;location&quot;: {&quot;lat&quot;: 25.03, &quot;lng&quot;: 121.56}\n}\n<\/code><\/pre>\n<ul>\n<li>物件 <code>{ }<\/code> 由「鍵：值」組成；陣列 <code>[ ]<\/code>；<strong>鍵必須用雙引號<\/strong>；字串用雙引號（不能用單引號）。<\/li>\n<li>值的型別：字串、數字、布林（true／false）、null、物件、陣列。<\/li>\n<li><strong>不允許註解、不允許最後一個元素後面多逗號<\/strong>。<\/li>\n<\/ul>\n<p><strong>XML（eXtensible Markup Language）<\/strong><\/p>\n<pre><code class=\"language-xml\">&lt;reading deviceId=&quot;TH-001&quot;&gt;\n  &lt;ts&gt;2026-10-27T08:30:00+08:00&lt;/ts&gt;\n  &lt;temp unit=&quot;C&quot;&gt;26.5&lt;/temp&gt;\n&lt;/reading&gt;\n<\/code><\/pre>\n<ul>\n<li>標籤成對、<strong>區分大小寫<\/strong>、正確巢狀、<strong>只有一個根元素<\/strong>、屬性值加引號 → 稱為「格式良好（well-formed）」。<\/li>\n<li>可用 XSD／DTD 驗證結構；有命名空間；較冗長。<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>比較<\/th>\n<th>JSON<\/th>\n<th>XML<\/th>\n<th>CSV<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>可讀性<\/td>\n<td>高、簡潔<\/td>\n<td>高但冗長<\/td>\n<td>高（表格）<\/td>\n<\/tr>\n<tr>\n<td>檔案大小<\/td>\n<td>小<\/td>\n<td>大（標籤重複）<\/td>\n<td>最小<\/td>\n<\/tr>\n<tr>\n<td>結構<\/td>\n<td>巢狀物件與陣列<\/td>\n<td>樹狀、屬性、命名空間<\/td>\n<td>只有平面表格<\/td>\n<\/tr>\n<tr>\n<td>結構驗證<\/td>\n<td>JSON Schema<\/td>\n<td>XSD／DTD<\/td>\n<td>無標準<\/td>\n<\/tr>\n<tr>\n<td>典型用途<\/td>\n<td>REST API、MQTT 酬載、NoSQL 文件<\/td>\n<td>舊系統、設定檔、SOAP、OPC UA／MTConnect 資訊模型<\/td>\n<td>匯出報表、批次資料<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：JSON 的 <code>true<\/code>、<code>null<\/code> 不加引號；加了引號就變成字串 <code>\"true\"<\/code>。另有二進位格式（如 <strong>CBOR、Protocol Buffers<\/strong>）比 JSON 更省頻寬，適合資源受限裝置。<\/p>\n<\/blockquote>\n<h2>3. API 與 Topic 設計 <span class=\"ref\">考科二 2-2<\/span><span class=\"supp\">補充（能力指標 1）<\/span><\/h2>\n<p><strong>REST API 的 HTTP 方法<\/strong>（對資源做 CRUD）：<\/p>\n<table>\n<thead>\n<tr>\n<th>方法<\/th>\n<th>動作<\/th>\n<th>例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>GET<\/td>\n<td>讀取（Read）<\/td>\n<td><code>GET /devices/TH-001/readings<\/code><\/td>\n<\/tr>\n<tr>\n<td>POST<\/td>\n<td>新增（Create）<\/td>\n<td><code>POST /devices/TH-001/readings<\/code><\/td>\n<\/tr>\n<tr>\n<td>PUT／PATCH<\/td>\n<td>整筆更新／部分更新（Update）<\/td>\n<td><code>PATCH /devices/TH-001<\/code><\/td>\n<\/tr>\n<tr>\n<td>DELETE<\/td>\n<td>刪除（Delete）<\/td>\n<td><code>DELETE /devices/TH-001<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>狀態碼<\/strong>：2xx 成功（200 OK、201 Created）；4xx 用戶端錯誤（400 格式錯誤、401 未認證、403 無權限、404 找不到）；5xx 伺服器錯誤（500、503）。<\/p>\n<p><strong>MQTT Topic 設計<\/strong>：用 <code>/<\/code> 分層，從大到小，例如 <code>factoryA/line1/machine05/temp<\/code>；<code>+<\/code> 匹配單一層、<code>#<\/code> 匹配其下所有層（只能放最後）；Topic <strong>區分大小寫<\/strong>、不要以 <code>/<\/code> 開頭或含空白；<strong>命令與資料分開<\/strong>（如 <code>.../cmd<\/code> 與 <code>.../data<\/code>）。<\/p>\n<h2>4. 關聯式資料庫設計 <span class=\"ref\">考科二 2-2<\/span><span class=\"supp\">補充（能力指標 1：資料庫設計基礎）<\/span><\/h2>\n<ul>\n<li>**資料表（Table）**由欄位（Column）與資料列（Row／Record）組成。<\/li>\n<li><strong>主鍵（Primary Key, PK）<\/strong>：唯一識別每一列、不可重複、不可為空值。<\/li>\n<li><strong>外鍵（Foreign Key, FK）<\/strong>：參照另一張表的主鍵，建立關聯並維持<strong>參照完整性<\/strong>。<\/li>\n<li><strong>關聯類型<\/strong>：一對一、一對多（一台裝置有多筆讀值）、多對多（需中介表）。<\/li>\n<li><strong>索引（Index）<\/strong>：加快查詢，但會增加寫入成本與空間。<\/li>\n<\/ul>\n<p><strong>IoT 範例設計<\/strong>：<\/p>\n<table>\n<thead>\n<tr>\n<th>devices<\/th>\n<th>readings<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>device_id (PK)<\/strong>、name、location、model<\/td>\n<td><strong>reading_id (PK)<\/strong>、device_id (<strong>FK<\/strong>)、ts、temp、humidity<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>正規化（Normalization）<\/strong>：減少重複資料與更新異常。<\/p>\n<table>\n<thead>\n<tr>\n<th>正規化<\/th>\n<th>要求<\/th>\n<th>反例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1NF<\/strong><\/td>\n<td>每個欄位都是<strong>不可再分的單一值<\/strong>（無重複群組）<\/td>\n<td>一個欄位存 \"26.5,27.0,26.8\"<\/td>\n<\/tr>\n<tr>\n<td><strong>2NF<\/strong><\/td>\n<td>符合 1NF，且非鍵欄位<strong>完全依賴整個主鍵<\/strong>（消除部分相依）<\/td>\n<td>主鍵為（訂單號＋產品號），卻存「客戶名稱」只依賴訂單號<\/td>\n<\/tr>\n<tr>\n<td><strong>3NF<\/strong><\/td>\n<td>符合 2NF，且<strong>消除遞移相依<\/strong>（非鍵欄位不依賴其他非鍵欄位）<\/td>\n<td>readings 表裡存 device 的「安裝地點」<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>基本 SQL<\/strong>：<\/p>\n<pre><code class=\"language-sql\">SELECT device_id, AVG(temp) FROM readings\nWHERE ts &gt;= '2026-10-27' GROUP BY device_id;\nINSERT INTO readings (device_id, ts, temp) VALUES ('TH-001', '2026-10-27 08:30', 26.5);\nUPDATE devices SET location = 'B棟' WHERE device_id = 'TH-001';\nDELETE FROM readings WHERE ts &lt; '2025-01-01';\n<\/code><\/pre>\n<ul>\n<li>SQL 分類：<strong>DDL<\/strong> 定義結構（CREATE、ALTER、DROP）；<strong>DML<\/strong> 操作資料（SELECT、INSERT、UPDATE、DELETE）；<strong>DCL<\/strong> 權限（GRANT、REVOKE）。<\/li>\n<li><strong>交易的 ACID<\/strong>：原子性（全做或全不做）、一致性、隔離性、持久性。<\/li>\n<\/ul>\n<blockquote>\n<p><strong>⚠️ 易混淆<\/strong>：<code>UPDATE<\/code>／<code>DELETE<\/code> 忘記加 <code>WHERE<\/code> 會影響整張表。<code>DROP TABLE<\/code> 是刪掉整張表（結構＋資料），<code>DELETE<\/code> 只刪資料列。<\/p>\n<\/blockquote>\n<h2>5. NoSQL 與時序資料庫 <span class=\"ref\">考科二 2-2<\/span><span class=\"supp\">補充（能力指標 1：資料庫設計基礎）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>類型<\/th>\n<th>特性<\/th>\n<th>例子<\/th>\n<th>IoT 用途<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>關聯式 RDBMS<\/td>\n<td>固定綱要（Schema）、SQL、ACID、JOIN<\/td>\n<td>MySQL、PostgreSQL、SQL Server<\/td>\n<td>裝置清單、使用者、工單等結構化主資料<\/td>\n<\/tr>\n<tr>\n<td>文件型 Document<\/td>\n<td>存 JSON 類文件、綱要彈性<\/td>\n<td>MongoDB<\/td>\n<td>不同型號裝置欄位不一的資料<\/td>\n<\/tr>\n<tr>\n<td>鍵值型 Key-Value<\/td>\n<td>以鍵快速存取<\/td>\n<td>Redis<\/td>\n<td>裝置最新狀態、快取、Session<\/td>\n<\/tr>\n<tr>\n<td>寬欄型 Wide-Column<\/td>\n<td>大量寫入、水平擴充<\/td>\n<td>Cassandra、HBase<\/td>\n<td>海量感測資料<\/td>\n<\/tr>\n<tr>\n<td>圖形 Graph<\/td>\n<td>節點與關係<\/td>\n<td>Neo4j<\/td>\n<td>設備拓樸、關聯分析<\/td>\n<\/tr>\n<tr>\n<td><strong>時序資料庫 TSDB<\/strong><\/td>\n<td>以<strong>時間戳<\/strong>為主軸、高速寫入、時間區間查詢、<strong>降採樣<\/strong>與<strong>保存政策<\/strong>、壓縮<\/td>\n<td>InfluxDB、TimescaleDB<\/td>\n<td><strong>感測讀值、設備監控<\/strong>（最典型）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>NoSQL 多數以<strong>水平擴充<\/strong>與高可用為優先，常採<strong>最終一致性（BASE）<\/strong>；關聯式重視強一致與 ACID。<\/li>\n<li>常見混合設計：<strong>主資料放關聯式、感測讀值放時序資料庫、最新狀態放快取、原始檔案（影像）放物件儲存<\/strong>。<\/li>\n<\/ul>\n<h3>今日 30 秒回顧<\/h3>\n<p>擷取→傳輸→接收→處理→儲存→應用｜JSON：鍵用雙引號、無註解、無尾逗號、true/null 不加引號｜XML：成對、大小寫、單一根＝well-formed｜CSV 只能平面｜GET 讀、POST 新增、PUT/PATCH 改、DELETE 刪；201 Created、401 未認證、403 無權限、404 找不到｜Topic 由大到小、+ 單層、# 多層｜PK 唯一非空、FK 參照｜1NF 單一值、2NF 去部分相依、3NF 去遞移相依｜DDL／DML／DCL｜ACID｜感測讀值→時序資料庫。<\/p>", "audio": {"src": "audio/d10.mp3", "dur": 600}, "questions": [{"id": "d10q1", "n": 1, "opts": ["{'deviceId': 'TH-001', 'temp': 26.5}", "{\"deviceId\": \"TH-001\", \"temp\": 26.5,}", "{deviceId: \"TH-001\", temp: 26.5}", "{\"deviceId\": \"TH-001\", \"temp\": 26.5, \"online\": true}"], "exp": "JSON 的鍵與字串都必須用雙引號，A 用單引號、C 鍵沒加引號都不合法；B 最後多了一個逗號（尾逗號）也不合法。D 的 true 是布林值，不加引號是正確的。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "下列哪一段是「合法」的 JSON 資料？", "ref": "考科二 2-2", "src": "能力指標 1（雲端資料交換格式）", "ans": 3, "stemH": "下列哪一段是「合法」的 JSON 資料？", "optsH": ["{&#x27;deviceId&#x27;: &#x27;TH-001&#x27;, &#x27;temp&#x27;: 26.5}", "{&quot;deviceId&quot;: &quot;TH-001&quot;, &quot;temp&quot;: 26.5,}", "{deviceId: &quot;TH-001&quot;, temp: 26.5}", "{&quot;deviceId&quot;: &quot;TH-001&quot;, &quot;temp&quot;: 26.5, &quot;online&quot;: true}"], "expH": "JSON 的鍵與字串都必須用雙引號，A 用單引號、C 鍵沒加引號都不合法；B 最後多了一個逗號（尾逗號）也不合法。D 的 true 是布林值，不加引號是正確的。"}, {"id": "d10q2", "n": 2, "opts": ["標籤名稱區分大小寫，`<Temp>` 與 `<temp>` 不同", "一份格式良好（well-formed）的 XML 文件可以有多個根元素", "可用 XSD 或 DTD 驗證文件結構", "相同資料以 XML 表示通常比 JSON 冗長"], "exp": "格式良好的 XML 必須只有一個根元素，且標籤成對、正確巢狀、屬性值加引號。A、C、D 皆正確。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "關於 XML 的敘述，下列何者「不」正確？", "ref": "考科二 2-2", "src": "能力指標 1（雲端資料交換格式）", "ans": 1, "stemH": "關於 XML 的敘述，下列何者「不」正確？", "optsH": ["標籤名稱區分大小寫，<code>&lt;Temp&gt;<\/code> 與 <code>&lt;temp&gt;<\/code> 不同", "一份格式良好（well-formed）的 XML 文件可以有多個根元素", "可用 XSD 或 DTD 驗證文件結構", "相同資料以 XML 表示通常比 JSON 冗長"], "expH": "格式良好的 XML 必須只有一個根元素，且標籤成對、正確巢狀、屬性值加引號。A、C、D 皆正確。"}, {"id": "d10q3", "n": 3, "opts": ["帶有完整命名空間的 XML", "以 Base64 編碼的點陣圖片", "CBOR 或 Protocol Buffers 等二進位序列化格式", "加上大量縮排與註解的文字設定檔"], "exp": "CBOR（常與 CoAP 搭配）與 Protocol Buffers 是二進位格式，比 JSON、XML 更精簡，適合低頻寬、低功耗裝置。XML 冗長；圖片與帶註解的文字檔都不符需求。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某資源受限的電池型感測器要經低頻寬網路傳送資料，希望酬載愈小愈好，同時仍保有結構化的鍵值資料。下列哪一種格式最適合？", "ref": "考科二 2-2", "src": "能力指標 1（雲端資料交換格式）", "ans": 2, "stemH": "某資源受限的電池型感測器要經低頻寬網路傳送資料，希望酬載愈小愈好，同時仍保有結構化的鍵值資料。下列哪一種格式最適合？", "optsH": ["帶有完整命名空間的 XML", "以 Base64 編碼的點陣圖片", "CBOR 或 Protocol Buffers 等二進位序列化格式", "加上大量縮排與註解的文字設定檔"], "expH": "CBOR（常與 CoAP 搭配）與 Protocol Buffers 是二進位格式，比 JSON、XML 更精簡，適合低頻寬、低功耗裝置。XML 冗長；圖片與帶註解的文字檔都不符需求。"}, {"id": "d10q4", "n": 4, "opts": ["POST，201 Created", "GET，404 Not Found", "DELETE，200 OK", "PUT，500 Internal Server Error"], "exp": "新增資源慣用 POST，成功建立回 201 Created。GET 用於讀取；404 是找不到資源；DELETE 用於刪除；500 是伺服器端錯誤。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "以 REST API 新增一筆感測資料到 `/devices/TH-001/readings`，伺服器成功建立資源後，最符合慣例的「HTTP 方法」與「回應狀態碼」組合是？", "ref": "考科二 2-2", "src": "能力指標 1", "ans": 0, "stemH": "以 REST API 新增一筆感測資料到 <code>/devices/TH-001/readings<\/code>，伺服器成功建立資源後，最符合慣例的「HTTP 方法」與「回應狀態碼」組合是？", "optsH": ["POST，201 Created", "GET，404 Not Found", "DELETE，200 OK", "PUT，500 Internal Server Error"], "expH": "新增資源慣用 POST，成功建立回 201 Created。GET 用於讀取；404 是找不到資源；DELETE 用於刪除；500 是伺服器端錯誤。"}, {"id": "d10q5", "n": 5, "opts": ["伺服器內部發生錯誤", "請求成功", "請求的資源不存在", "請求缺少有效的身分驗證資訊（例如 Token 錯誤或過期）"], "exp": "401 Unauthorized 表示未通過身分驗證；403 Forbidden 是已驗證但無權限；404 是找不到資源；5xx 是伺服器錯誤；2xx 是成功。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "裝置呼叫雲端 API 時收到 HTTP 狀態碼 401，最可能代表什麼？", "ref": "考科二 2-2", "src": "能力指標 1", "ans": 3, "stemH": "裝置呼叫雲端 API 時收到 HTTP 狀態碼 401，最可能代表什麼？", "optsH": ["伺服器內部發生錯誤", "請求成功", "請求的資源不存在", "請求缺少有效的身分驗證資訊（例如 Token 錯誤或過期）"], "expH": "401 Unauthorized 表示未通過身分驗證；403 Forbidden 是已驗證但無權限；404 是找不到資源；5xx 是伺服器錯誤；2xx 是成功。"}, {"id": "d10q6", "n": 6, "opts": ["`factoryA/#/temp`", "`factoryA/+/+/temp`", "`factoryA/*/*/temp`", "`#/factoryA/temp`"], "exp": "`+` 匹配單一層，兩個 `+` 分別代表產線與機台。`#` 代表其下所有層級，只能放在最後，所以 A、D 不合法；MQTT 沒有 `*` 萬用字元。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某工廠的 MQTT Topic 規劃為 `factoryA/{產線}/{機台}/{量測項目}`。若儀表板要訂閱「factoryA 所有產線、所有機台的溫度（temp）」，應訂閱下列哪一個 Topic？", "ref": "考科二 2-2", "src": "能力指標 1", "ans": 1, "stemH": "某工廠的 MQTT Topic 規劃為 <code>factoryA/{產線}/{機台}/{量測項目}<\/code>。若儀表板要訂閱「factoryA 所有產線、所有機台的溫度（temp）」，應訂閱下列哪一個 Topic？", "optsH": ["<code>factoryA/#/temp<\/code>", "<code>factoryA/+/+/temp<\/code>", "<code>factoryA/*/*/temp<\/code>", "<code>#/factoryA/temp<\/code>"], "expH": "<code>+<\/code> 匹配單一層，兩個 <code>+<\/code> 分別代表產線與機台。<code>#<\/code> 代表其下所有層級，只能放在最後，所以 A、D 不合法；MQTT 沒有 <code>*<\/code> 萬用字元。"}, {"id": "d10q7", "n": 7, "opts": ["主鍵可以重複，但不能為空值", "主鍵可以為空值，但不能重複", "主鍵用來唯一識別資料表中的每一列，不可重複也不可為空值", "一張資料表必須有兩個以上的主鍵"], "exp": "主鍵用來唯一識別每一列資料，必須唯一且非空值（NOT NULL）。主鍵可以由多個欄位組合（複合主鍵），但一張表只有一個主鍵。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "在關聯式資料庫中，關於主鍵（Primary Key）的敘述，下列何者正確？", "ref": "考科二 2-2", "src": "能力指標 1（資料庫設計基礎）", "ans": 2, "stemH": "在關聯式資料庫中，關於主鍵（Primary Key）的敘述，下列何者正確？", "optsH": ["主鍵可以重複，但不能為空值", "主鍵可以為空值，但不能重複", "主鍵用來唯一識別資料表中的每一列，不可重複也不可為空值", "一張資料表必須有兩個以上的主鍵"], "expH": "主鍵用來唯一識別每一列資料，必須唯一且非空值（NOT NULL）。主鍵可以由多個欄位組合（複合主鍵），但一張表只有一個主鍵。"}, {"id": "d10q8", "n": 8, "opts": ["外鍵（Foreign Key）；建立兩表關聯並維持參照完整性", "主鍵；唯一識別每一筆讀值", "索引；只用來加快排序", "檢視表（View）；存放查詢結果"], "exp": "參照另一張表主鍵的欄位稱為外鍵，可確保讀值所屬的裝置一定存在（參照完整性）。一台裝置對多筆讀值，是一對多關聯。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "資料表 `readings`（reading_id, device_id, ts, temp）中的 `device_id` 參照 `devices` 表的主鍵 `device_id`。`readings.device_id` 在此稱為？其主要作用為何？", "ref": "考科二 2-2", "src": "能力指標 1（資料庫設計基礎）", "ans": 0, "stemH": "資料表 <code>readings<\/code>（reading_id, device_id, ts, temp）中的 <code>device_id<\/code> 參照 <code>devices<\/code> 表的主鍵 <code>device_id<\/code>。<code>readings.device_id<\/code> 在此稱為？其主要作用為何？", "optsH": ["外鍵（Foreign Key）；建立兩表關聯並維持參照完整性", "主鍵；唯一識別每一筆讀值", "索引；只用來加快排序", "檢視表（View）；存放查詢結果"], "expH": "參照另一張表主鍵的欄位稱為外鍵，可確保讀值所屬的裝置一定存在（參照完整性）。一台裝置對多筆讀值，是一對多關聯。"}, {"id": "d10q9", "n": 9, "opts": ["第三正規化（存在遞移相依）；把裝置資訊移到 devices 表，readings 只保留 device_id 外鍵", "第一正規化；把地點拆成多個欄位", "第二正規化；刪除主鍵", "不違反任何原則；這是最佳設計"], "exp": "地點與型號依賴的是 device_id（非鍵欄位），而不是 reading_id，形成「reading_id → device_id → 地點」的遞移相依，違反 3NF，會造成更新異常。拆到 devices 表即可。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "資料表 `readings` 中除了 device_id 之外，每一筆讀值都重複存放該裝置的「安裝地點」與「型號」。當裝置搬遷時，需更新成千上萬筆資料。這違反了哪一個正規化原則？應如何改善？", "ref": "考科二 2-2", "src": "能力指標 1（資料庫設計基礎）", "ans": 0, "stemH": "資料表 <code>readings<\/code> 中除了 device_id 之外，每一筆讀值都重複存放該裝置的「安裝地點」與「型號」。當裝置搬遷時，需更新成千上萬筆資料。這違反了哪一個正規化原則？應如何改善？", "optsH": ["第三正規化（存在遞移相依）；把裝置資訊移到 devices 表，readings 只保留 device_id 外鍵", "第一正規化；把地點拆成多個欄位", "第二正規化；刪除主鍵", "不違反任何原則；這是最佳設計"], "expH": "地點與型號依賴的是 device_id（非鍵欄位），而不是 reading_id，形成「reading_id → device_id → 地點」的遞移相依，違反 3NF，會造成更新異常。拆到 devices 表即可。"}, {"id": "d10q10", "n": 10, "opts": ["SELECT", "INSERT", "CREATE TABLE", "GRANT"], "exp": "DDL 定義資料結構：CREATE、ALTER、DROP。SELECT、INSERT、UPDATE、DELETE 屬 DML（資料操作）；GRANT、REVOKE 屬 DCL（權限控制）。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "下列哪一個 SQL 指令屬於資料定義語言（DDL）？", "ref": "考科二 2-2", "src": "能力指標 1（資料庫設計基礎）", "ans": 2, "stemH": "下列哪一個 SQL 指令屬於資料定義語言（DDL）？", "optsH": ["SELECT", "INSERT", "CREATE TABLE", "GRANT"], "expH": "DDL 定義資料結構：CREATE、ALTER、DROP。SELECT、INSERT、UPDATE、DELETE 屬 DML（資料操作）；GRANT、REVOKE 屬 DCL（權限控制）。"}, {"id": "d10q11", "n": 11, "opts": ["圖形資料庫", "時序資料庫（如 InfluxDB、TimescaleDB）", "只用試算表檔案存放", "純鍵值快取，不做持久化"], "exp": "時序資料庫以時間戳為主軸，支援高速寫入、時間區間聚合查詢、降採樣與保存政策，是感測資料的典型選擇。圖形資料庫適合關係分析；試算表無法承受大量寫入；快取不適合長期保存。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某平台要儲存數萬支感測器每秒產生的讀值，查詢多為「某裝置過去 24 小時的平均值」，且舊資料需自動降採樣與到期刪除。最適合的資料庫類型是？", "ref": "考科二 2-2", "src": "能力指標 1（資料庫設計基礎）", "ans": 1, "stemH": "某平台要儲存數萬支感測器每秒產生的讀值，查詢多為「某裝置過去 24 小時的平均值」，且舊資料需自動降採樣與到期刪除。最適合的資料庫類型是？", "optsH": ["圖形資料庫", "時序資料庫（如 InfluxDB、TimescaleDB）", "只用試算表檔案存放", "純鍵值快取，不做持久化"], "expH": "時序資料庫以時間戳為主軸，支援高速寫入、時間區間聚合查詢、降採樣與保存政策，是感測資料的典型選擇。圖形資料庫適合關係分析；試算表無法承受大量寫入；快取不適合長期保存。"}, {"id": "d10q12", "n": 12, "opts": ["關聯式資料庫有固定綱要，支援 SQL 與 JOIN", "文件型資料庫（如 MongoDB）可存放欄位不完全相同的 JSON 類文件", "關聯式資料庫的交易強調 ACID 特性", "所有 NoSQL 資料庫都無法水平擴充，因此不適合大量資料"], "exp": "多數 NoSQL 正是以水平擴充與高可用為設計重點（常採最終一致性），適合大量資料。A、B、C 皆正確。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "關於關聯式資料庫與 NoSQL 的比較，下列敘述何者「不」正確？", "ref": "考科二 2-2", "src": "能力指標 1（資料庫設計基礎）", "ans": 3, "stemH": "關於關聯式資料庫與 NoSQL 的比較，下列敘述何者「不」正確？", "optsH": ["關聯式資料庫有固定綱要，支援 SQL 與 JOIN", "文件型資料庫（如 MongoDB）可存放欄位不完全相同的 JSON 類文件", "關聯式資料庫的交易強調 ACID 特性", "所有 NoSQL 資料庫都無法水平擴充，因此不適合大量資料"], "expH": "多數 NoSQL 正是以水平擴充與高可用為設計重點（常採最終一致性），適合大量資料。A、B、C 皆正確。"}]}, {"id": 11, "date": "2026-10-28", "subject": "考科二", "type": "study", "title": "智慧製造流程優化與成本控制", "short": "智慧製造＋成本", "lectureChars": 3591, "lecture": "<blockquote>\n<p><strong>📌 考科二說明<\/strong>：本日內容依簡章評鑑內容 2-3「智慧製造流程優化與成本控制」撰寫。簡章 3 項能力指標未逐字列出此主題，因此以評鑑內容標題為範圍，聚焦「用 IoT 資料改善製程與控制成本」所需的通用管理與工程知識；考科二無官方學習指引，內容皆標「補充」。<\/p>\n<\/blockquote>\n<h3>今天要搞懂的 5 件事<\/h3>\n<ol>\n<li>OEE＝可用率 × 效能 × 品質，會算、會判斷哪一種損失屬於哪一項。<\/li>\n<li>精實生產：七大浪費、JIT、看板、5S、防呆、SMED、TPM。<\/li>\n<li>製造資訊系統分層（ISA-95）：ERP、MES、SCADA／HMI、PLC 各管什麼。<\/li>\n<li>流程改善工具：PDCA、DMAIC、SPC 管制圖、魚骨圖、柏拉圖、瓶頸與節拍時間。<\/li>\n<li>成本控制：固定／變動成本、CAPEX／OPEX、TCO、ROI 與回收期，以及 AIoT 如何降成本。<\/li>\n<\/ol>\n<h2>1. 智慧製造與 AIoT 的角色 <span class=\"ref\">考科二 2-3<\/span><span class=\"supp\">補充（依簡章評鑑內容 2-3）<\/span><\/h2>\n<ul>\n<li><strong>智慧製造<\/strong>：以設備聯網、資料分析與自動化，讓工廠從「事後處理」走向「即時可視、可預測、可自主調整」。常見概念：工業 4.0、<strong>虛實整合系統（CPS）<\/strong>、<strong>數位雙生（Digital Twin，實體設備在虛擬世界的即時對應模型，可模擬與預測）<\/strong>。<\/li>\n<li><strong>演進階段（記法）<\/strong>：<strong>看得見<\/strong>（設備聯網、即時看板）→ <strong>看得懂<\/strong>（分析原因）→ <strong>預測得到<\/strong>（預測性維護、品質預測）→ <strong>自主調整<\/strong>（自動調參、最佳化排程）。<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>AIoT 應用<\/th>\n<th>改善的對象<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>設備聯網＋即時 OEE 看板<\/td>\n<td>停機、小停機看得見，縮短反應時間<\/td>\n<\/tr>\n<tr>\n<td>預測性維護（震動、電流、溫度）<\/td>\n<td>減少非計畫停機（可用率）與維修成本<\/td>\n<\/tr>\n<tr>\n<td>AI 視覺檢測（AOI）<\/td>\n<td>降低不良與漏檢（品質）、減少人工檢驗成本<\/td>\n<\/tr>\n<tr>\n<td>能耗監控與需量管理<\/td>\n<td>降低電費、碳排<\/td>\n<\/tr>\n<tr>\n<td>製程參數監控與 SPC<\/td>\n<td>及早發現製程偏移，減少報廢<\/td>\n<\/tr>\n<tr>\n<td>排程最佳化、數位雙生模擬<\/td>\n<td>縮短換線與等待，提高產能<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. OEE 設備綜合效率 <span class=\"ref\">考科二 2-3<\/span><span class=\"supp\">補充（依簡章評鑑內容 2-3）<\/span><\/h2>\n<p><strong>OEE＝可用率（Availability）× 效能（Performance）× 品質（Quality，良率）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>指標<\/th>\n<th>公式<\/th>\n<th>對應的「六大損失」<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>可用率<\/td>\n<td>實際運轉時間 ÷ 計畫生產時間<\/td>\n<td>① 故障停機 ② 換線、調整（換模）<\/td>\n<\/tr>\n<tr>\n<td>效能<\/td>\n<td>（理想週期時間 × 總產出數）÷ 實際運轉時間<\/td>\n<td>③ 小停機、空轉 ④ 速度降低<\/td>\n<\/tr>\n<tr>\n<td>品質<\/td>\n<td>良品數 ÷ 總產出數<\/td>\n<td>⑤ 製程不良與重工 ⑥ 開機（啟動）損失<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 計算例<\/strong>：計畫生產 600 分鐘，停機 60 分鐘 → 運轉 540 分鐘，<strong>可用率＝540÷600＝90 %<\/strong>。理想週期時間 0.6 分鐘／件，實際產出 720 件 → 理想需要 432 分鐘，<strong>效能＝432÷540＝80 %<\/strong>。良品 684 件 → <strong>品質＝684÷720＝95 %<\/strong>。<strong>OEE＝0.9×0.8×0.95＝68.4 %<\/strong>。驗算：良品數 × 理想週期時間 ÷ 計畫時間＝684×0.6÷600＝68.4 % ✔。<\/p>\n<p><strong>⚠️ 易混淆<\/strong>：「機台在跑但跑得比標準慢」是<strong>效能<\/strong>損失，不是可用率；「停下來換模」是<strong>可用率<\/strong>損失；「做出不良品」是<strong>品質<\/strong>損失。業界常引用「世界級 OEE 約 85 %」作為參考目標（經驗值，非標準規定）。<\/p>\n<\/blockquote>\n<h2>3. 精實生產（Lean）與現場改善 <span class=\"ref\">考科二 2-3<\/span><span class=\"supp\">補充（依簡章評鑑內容 2-3）<\/span><\/h2>\n<p><strong>七大浪費<\/strong>（源自豐田生產方式）：<\/p>\n<table>\n<thead>\n<tr>\n<th>浪費<\/th>\n<th>例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>過量生產<\/td>\n<td>做得比需求多、比需求早（被視為最嚴重，會引發其他浪費）<\/td>\n<\/tr>\n<tr>\n<td>庫存<\/td>\n<td>原料、在製品（WIP）、成品堆積，占空間與資金<\/td>\n<\/tr>\n<tr>\n<td>搬運<\/td>\n<td>不必要的物料移動<\/td>\n<\/tr>\n<tr>\n<td>等待<\/td>\n<td>人或機器等料、等指令、等維修<\/td>\n<\/tr>\n<tr>\n<td>動作<\/td>\n<td>作業員多餘的走動、彎腰、找工具<\/td>\n<\/tr>\n<tr>\n<td>過度加工<\/td>\n<td>超出客戶需求的加工或檢驗<\/td>\n<\/tr>\n<tr>\n<td>不良（瑕疵）<\/td>\n<td>報廢、重工、客訴<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>（有些教材另加第八種「未善用員工的才能」。）<\/p>\n<table>\n<thead>\n<tr>\n<th>精實工具<\/th>\n<th>意義<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>JIT 及時生產<\/strong><\/td>\n<td>在需要的時候、生產需要的數量<\/td>\n<\/tr>\n<tr>\n<td><strong>看板（Kanban）<\/strong><\/td>\n<td>以卡片或訊號實現<strong>拉式（Pull）生產<\/strong>，由後工序向前工序領料<\/td>\n<\/tr>\n<tr>\n<td><strong>自働化（Jidoka）／安燈（Andon）<\/strong><\/td>\n<td>異常時自動停機並亮燈通知，不讓不良流到下一站<\/td>\n<\/tr>\n<tr>\n<td><strong>防呆（Poka-yoke）<\/strong><\/td>\n<td>設計上讓錯誤不可能發生或立即被發現<\/td>\n<\/tr>\n<tr>\n<td><strong>5S<\/strong><\/td>\n<td>整理（區分要與不要）、整頓（定位）、清掃、清潔（維持制度化）、素養（養成習慣）<\/td>\n<\/tr>\n<tr>\n<td><strong>SMED 快速換模<\/strong><\/td>\n<td>把換線工作盡量改為機台運轉中就能準備（外部作業），縮短換線時間<\/td>\n<\/tr>\n<tr>\n<td><strong>TPM 全員生產保養<\/strong><\/td>\n<td>全員參與、作業員自主保養，目標零故障<\/td>\n<\/tr>\n<tr>\n<td><strong>價值流圖（VSM）<\/strong><\/td>\n<td>畫出從原料到交貨的物流與資訊流，找出浪費<\/td>\n<\/tr>\n<tr>\n<td><strong>改善（Kaizen）<\/strong><\/td>\n<td>持續的小幅改善<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>4. 製造資訊系統分層（ISA-95） <span class=\"ref\">考科二 2-3<\/span><span class=\"supp\">補充（依簡章評鑑內容 2-3）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>ISA-95 層級<\/th>\n<th>系統<\/th>\n<th>時間尺度<\/th>\n<th>負責<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Level 4 企業<\/td>\n<td><strong>ERP<\/strong><\/td>\n<td>月、週、日<\/td>\n<td>訂單、採購、庫存、財務、主生產計畫<\/td>\n<\/tr>\n<tr>\n<td>Level 3 製造營運<\/td>\n<td><strong>MES<\/strong><\/td>\n<td>日、班、時<\/td>\n<td>派工、生產追蹤與履歷、品質、在製品、績效（OEE）<\/td>\n<\/tr>\n<tr>\n<td>Level 2 監控<\/td>\n<td><strong>SCADA、HMI<\/strong><\/td>\n<td>分、秒<\/td>\n<td>監看、警報、操作<\/td>\n<\/tr>\n<tr>\n<td>Level 1 控制與感測<\/td>\n<td><strong>PLC<\/strong>、感測器、致動器<\/td>\n<td>秒、毫秒<\/td>\n<td>即時控制與量測<\/td>\n<\/tr>\n<tr>\n<td>Level 0<\/td>\n<td>實體製程<\/td>\n<td>—<\/td>\n<td>實際生產<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>IoT 資料由下往上整合（例如以 OPC UA 從 PLC 取值送到 MES），讓 ERP 的計畫與現場實績能即時對齊。<\/p>\n<h2>5. 流程優化方法與品質工具 <span class=\"ref\">考科二 2-3<\/span><span class=\"supp\">補充（依簡章評鑑內容 2-3）<\/span><\/h2>\n<ul>\n<li><strong>PDCA<\/strong>：計畫（Plan）→ 執行（Do）→ 檢查（Check）→ 行動（Act），持續循環改善。<\/li>\n<li><strong>DMAIC<\/strong>（六標準差）：定義（Define）→ 量測（Measure）→ 分析（Analyze）→ 改善（Improve）→ 管制（Control）。<\/li>\n<li><strong>SPC 統計製程管制<\/strong>：以<strong>管制圖<\/strong>監控製程，中心線為平均值，<strong>管制上下限常取平均值 ± 3 個標準差<\/strong>；點超出管制界限或出現連續偏向一側等異常樣式時，代表有特殊原因需要處理。<\/li>\n<li><strong>魚骨圖（特性要因圖）<\/strong>：從<strong>人、機、料、法、環<\/strong>（4M1E，有時加「測」）找原因。<\/li>\n<li><strong>柏拉圖（Pareto）<\/strong>：把問題依發生次數由大到小排列，找出造成約 80 % 問題的少數關鍵原因（80／20 法則）。<\/li>\n<li><strong>瓶頸（限制理論 TOC）<\/strong>：整條產線的產出由**最慢的站（瓶頸）**決定，改善非瓶頸站無法提高總產出。<\/li>\n<li><strong>節拍時間（Takt Time）＝可用生產時間 ÷ 客戶需求量<\/strong>：例如每日可用 450 分鐘、需求 900 件 → 每 0.5 分鐘（30 秒）要完成一件。若某站**週期時間（Cycle Time）**大於節拍時間，就跟不上需求。<\/li>\n<\/ul>\n<h2>6. 成本控制與投資評估 <span class=\"ref\">考科二 2-3<\/span><span class=\"supp\">補充（依簡章評鑑內容 2-3）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>概念<\/th>\n<th>說明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>固定成本／變動成本<\/td>\n<td>廠房折舊、租金不隨產量變動；材料、計件工資隨產量變動<\/td>\n<\/tr>\n<tr>\n<td>損益平衡點（數量）<\/td>\n<td>固定成本 ÷（單價 − 單位變動成本）<\/td>\n<\/tr>\n<tr>\n<td><strong>CAPEX 資本支出<\/strong><\/td>\n<td>一次性購置：設備、伺服器、感測器硬體（分年折舊）<\/td>\n<\/tr>\n<tr>\n<td><strong>OPEX 營運支出<\/strong><\/td>\n<td>持續性費用：雲端訂閱、電信費、維護人力、電費<\/td>\n<\/tr>\n<tr>\n<td><strong>TCO 總擁有成本<\/strong><\/td>\n<td>購置＋建置整合＋維運＋能源＋教育訓練＋汰換，<strong>不只看採購價<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>ROI 投資報酬率<\/strong><\/td>\n<td>（效益 − 成本）÷ 成本 × 100 %<\/td>\n<\/tr>\n<tr>\n<td>回收期（Payback）<\/td>\n<td>初始投資 ÷ 每年淨效益<\/td>\n<\/tr>\n<tr>\n<td>品質成本<\/td>\n<td>預防成本、鑑定成本、內部失敗（報廢、重工）、外部失敗（退貨、保固、商譽）；<strong>愈早預防通常總成本愈低<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>💡 計算例<\/strong>：導入預測性維護投資 200 萬元，每年減少停機與維修損失 80 萬元 → <strong>回收期＝200÷80＝2.5 年<\/strong>；三年總效益 240 萬，<strong>三年 ROI＝（240−200）÷200＝20 %<\/strong>。<\/p>\n<p><strong>⚠️ 易混淆<\/strong>：把自建伺服器改成雲端訂閱，是把 <strong>CAPEX 轉成 OPEX<\/strong>，初期投資降低，但長期總成本要用 TCO 比較，不一定比較便宜。<\/p>\n<\/blockquote>\n<h3>今日 30 秒回顧<\/h3>\n<p>OEE＝可用率×效能×品質；停機換模→可用率、變慢小停→效能、不良啟動→品質｜七大浪費：過量、庫存、搬運、等待、動作、過度加工、不良｜JIT、看板＝拉式、Jidoka／安燈、防呆、5S、SMED、TPM｜ISA-95：ERP(L4)→MES(L3)→SCADA/HMI(L2)→PLC(L1)｜PDCA、DMAIC、管制圖 ±3σ、魚骨 4M1E、柏拉圖 80/20、瓶頸決定產出、節拍＝可用時間÷需求｜CAPEX 一次、OPEX 持續、TCO 全生命週期、ROI＝(效益−成本)÷成本、回收期＝投資÷年效益。<\/p>", "audio": {"src": "audio/d11.mp3", "dur": 660}, "questions": [{"id": "d11q1", "n": 1, "opts": ["60.8 %", "64.0 %", "76.0 %", "95.0 %"], "exp": "可用率＝400÷500＝80 %；效能＝（1×320）÷400＝80 %；品質＝304÷320＝95 %。OEE＝0.8×0.8×0.95＝60.8 %。驗算：良品 304 × 1 分 ÷ 500 分＝60.8 %。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某機台計畫生產時間 500 分鐘，停機 100 分鐘；理想週期時間 1 分鐘／件，實際產出 3 /ul>", "audio": {"src": "audio/d12.mp3", "dur": 458}, "questions": [{"id": "d12q1", "n": 1, "opts": ["伺服馬達", "電磁閥", "加速度計（Accelerometer）", "蜂鳴器"], "exp": "加速度計把加速度（震動、傾斜）轉成電訊號，是輸入端的感測器。伺服馬達、電磁閥、蜂鳴器都是把電訊號轉成動作或聲音的致動器。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "下列哪一個元件屬於物聯網系統的「感測器」？", "ref": "考科二 1-1", "src": "能力指標 3（系統元件與架構）", "ans": 2, "stemH": "下列哪一個元件屬於物聯網系統的「感測器」？", "optsH": ["伺服馬達", "電磁閥", "加速度計（Accelerometer）", "蜂鳴器"], "expH": "加速度計把加速度（震動、傾斜）轉成電訊號，是輸入端的感測器。伺服馬達、電磁閥、蜂鳴器都是把電訊號轉成動作或聲音的致動器。"}, {"id": "d12q2", "n": 2, "opts": ["具多協定轉換能力的 IoT 閘道器", "更高解析度的感測器", "更大容量的電池", "更多的 LED 指示燈"], "exp": "閘道器負責整合異質網路與協定轉換（Modbus、Zigbee、BLE → MQTT），並可做資料前處理與斷線暫存。其他選項無法解決協定整合問題。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "某工廠有多種使用 Modbus RTU、Zigbee 與 BLE 的設備，希望統一以 MQTT 上傳雲端。最關鍵、需要新增的元件是？", "ref": "考科二 1-1", "src": "能力指標 3（系統元件與架構）", "ans": 0, "stemH": "某工廠有多種使用 Modbus RTU、Zigbee 與 BLE 的設備，希望統一以 MQTT 上傳雲端。最關鍵、需要新增的元件是？", "optsH": ["具多協定轉換能力的 IoT 閘道器", "更高解析度的感測器", "更大容量的電池", "更多的 LED 指示燈"], "expH": "閘道器負責整合異質網路與協定轉換（Modbus、Zigbee、BLE → MQTT），並可做資料前處理與斷線暫存。其他選項無法解決協定整合問題。"}, {"id": "d12q3", "n": 3, "opts": ["8 位元微控制器（如 ATmega328P）", "純類比電路", "只有 RFID 標籤", "可執行 Linux 的單板電腦或工業電腦（可搭配 AI 加速器）"], "exp": "影像辨識、資料庫、網頁服務需要較大的記憶體與算力及作業系統，適合單板電腦或工業電腦（可加 NPU／GPU 加速）。8 位元 MCU 資源太小；RFID 標籤與類比電路無法執行程式。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "需要在現場執行影像辨識模型、同時跑資料庫與網頁儀表板的邊緣節點，下列哪一類硬體最合適？", "ref": "考科二 1-1", "src": "能力指標 3（系統元件與架構）", "ans": 3, "stemH": "需要在現場執行影像辨識模型、同時跑資料庫與網頁儀表板的邊緣節點，下列哪一類硬體最合適？", "optsH": ["8 位元微控制器（如 ATmega328P）", "純類比電路", "只有 RFID 標籤", "可執行 Linux 的單板電腦或工業電腦（可搭配 AI 加速器）"], "expH": "影像辨識、資料庫、網頁服務需要較大的記憶體與算力及作業系統，適合單板電腦或工業電腦（可加 NPU／GPU 加速）。8 位元 MCU 資源太小；RFID 標籤與類比電路無法執行程式。"}, {"id": "d12q4", "n": 4, "opts": ["感測器大部分時間進入睡眠模式，定時喚醒量測", "採用 LoRa 等低功耗廣域網路傳輸少量資料", "每 0.1 秒以 Wi-Fi 上傳一張高解析度照片", "在閘道器端彙整資料後再上傳雲端"], "exp": "高頻率以 Wi-Fi 傳大量影像非常耗電，與一年電池壽命的需求衝突。睡眠模式、LPWAN、閘道彙整都是常見的低功耗設計。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "在偏遠農地部署以電池供電的土壤感測器，希望電池可用一年以上。下列哪一種系統規劃最不合理？", "ref": "考科二 1-1", "src": 個精實概念？", "optsH": ["自働化（Jidoka）", "過量生產", "推式生產", "批量最大化"], "expH": "自働化（帶人字旁的「働」）指設備具備偵測異常並自動停止的能力，搭配安燈讓問題立即被看見與處理，是豐田生產方式的兩大支柱之一（另一個是 JIT）。"}, {"id": "d12q41", "n": 41, "opts": ["產品出貨後的退貨與保固維修屬於預防成本", "檢驗與測試的費用屬於外部失敗成本", "在設計與製程階段投入預防，通常可降低整體品質成本", "品質成本只包含報廢材料費"], "exp": "品質成本包括預防、鑑定（檢驗測試）、內部失敗（報廢、重工）與外部失敗（退貨、保固、商譽）。愈早預防，通常總成本愈低。", "origin": "原創練習題（依官方評鑑範圍撰寫）", "stem": "關於品質成本的敘述，下列何者最正確？", "ref": "考科二 2-3", "src": "依簡章評鑑內容 2-3", "ans": 2, "stemH": "關於品質成本的敘述，下列何者最正確？", "optsH": ["產品出貨後的退貨與保固維修屬於預防成本", "檢驗與測試的費用屬於外部失敗成本", "在設計與製程階段投入預防，通常可降低整體品質成本", "品質成本只包含報廢材料費"], "expH": "品質成本包括預防、鑑定（檢驗測試）、內部失敗（報廢、重工）與外部失敗（退貨、保固、商譽）。愈早預防，通常總成本愈低。"}]}, {"id": 13, "date": "2026-10-30", "subject": "兩科", "type": "study", "title": "弱點複習、兩科總整理、考前速記", "short": "總複習＋速記", "lectureChars": 2244, "lecture": "<h3>今天怎麼用 30 分鐘<\/h3>\n<ol>\n<li><strong>5 分鐘：看弱點<\/strong>。打開「總覽」的「各評鑑內容正確率」，找出正確率最低的 2 項。<\/li>\n<li><strong>10 分鐘：錯題本重做<\/strong>。到「錯題本」依評鑑內容篩選那 2 項，全部重做；答對會自動移出。<\/li>\n<li><strong>10 分鐘：讀下面的兩科總整理<\/strong>（每個官方評鑑內容各一段）＋「考前速記表」。<\/li>\n<li><strong>5 分鐘：做今日驗證 12 題<\/strong>（兩科混合）。<\/li>\n<\/ol>\n<h3>考場策略<\/h3>\n<ul>\n<li>每科 75 分鐘，題數簡章未載明（舊制為 50 題），以每題約 1 分鐘的節奏作答，先全部做一輪，不會的先標記。<\/li>\n<li>看清楚「何者『不』正確」「最不可能」「最適合」等關鍵字。<\/li>\n<li>計算題（ADC、PWM、OEE、節拍、回收期、限流電阻）先寫公式再代數字。<\/li>\n<li>70 分及格，不必每題都會：先拿穩高頻觀念題。<\/li>\n<\/ul>\n<h2>總整理：AI 基礎概念 <span class=\"ref\">考科一 1.1<\/span><span class=\"pg\">指引 p.3-1～3-13<\/span><\/h2>\n<p>監督式（分類、迴歸）／非監督式（分群、異常偵測）／強化學習｜CNN 影像、RNN/LSTM 時序、GAN 生成｜GPU 力氣大吃電多、NPU 推論專用省電、FPGA 低延遲可客製｜量化（FP32→INT8）、剪枝｜雲端訓練、邊緣推論、聯合學習只傳參數｜AI 是輔助，PbD 在邊緣端去識別化。<\/p>\n<h2>總整理：AIoT 應用案例 <span class=\"ref\">考科一 1.2<\/span><span class=\"pg\">指引 p.3-18～3-22<\/span><\/h2>\n<p>Diagnosis（分類，現況）vs Prognosis（迴歸，RUL）｜感測融合提升強健性｜四位一體：感知、通訊、智慧、安全｜異質 PLC → 閘道器＋OPC UA｜大面積農業 → LoRa＋端雲協作。<\/p>\n<h2>總整理：物聯網架構 <span class=\"ref\">考科一 2.1<\/span><span class=\"pg\">指引 p.4-1～4-21<\/span><\/h2>\n<p>感知層、網路層、應用層｜OSI「應表會傳網鏈實」；TCP/IP 四層｜超音波測距、PIR 測移動、DHT11 溫濕度、MQ 系列測氣體。<\/p>\n<h2>總整理：無線與應用層協定 <span class=\"ref\">考科一 2.2<\/span><span class=\"pg\">指引 p.4-26～4-42<\/span><\/h2>\n<p>RFID／NFC（約 10 cm）／BLE／Zigbee（網狀）／Wi-Fi／LoRa、NB-IoT（LPWAN）／4G、5G（eMBB、URLLC、mMTC）｜MQTT＝TCP＋發布訂閱；CoAP＝UDP＋REST；HTTP 請求回應；WebSocket 雙向。<\/p>\n<h2>總整理：工業通訊與網路 <span class=\"ref\">考科一 2.3<\/span><span class=\"pg\">指引 p.4-47～4-68<\/span><\/h2>\n<p>TCP 可靠、UDP 快｜QoS 0 最多一次、1 至少一次、2 恰好一次｜Modbus 主從、RTU／TCP（502）｜OPC UA 跨平台、資訊模型、內建安全｜MTConnect 唯讀、XML、工具機｜REST 無狀態。<\/p>\n<h2>總整理：中介軟體與平台 <span class=\"ref\">考科一 2.4<\/span><span class=\"pg\">指引 p.4-73～4-79<\/span><\/h2>\n<p>IaaS（硬體）／PaaS（平台＋執行環境＋DB）／SaaS（軟體）｜邊緣運算降延遲、省頻寬｜中介軟體＝裝置與應用之間的抽象層。<\/p>\n<h2>總整理：資安與隱私 <span class=\"ref\">考科一 2.5<\/span><span class=\"pg\">指引 p.4-85～4-90<\/span><\/h2>\n<p>CIA｜對稱／非對稱；私鑰簽、公鑰驗＝不可否認｜雜湊＝完整性｜DDoS（Mirai）｜去識別化、最小權限。<\/p>\n<h2>總整理：感測技術 <span class=\"ref\">考科一 3.1<\/span><span class=\"pg\">指引 p.5-1～5-10<\/span><\/h2>\n<p>靈敏度、解析度、準確度 vs 精密度、遲滯、線性度｜熱電偶（席貝克、冷點補償）、RTD（Pt100）、NTC／PTC｜壓電、應變規、光電｜ADC：2ⁿ 階。<\/p>\n<h2>總整理：訊號與通訊 <span class=\"ref\">考科一 3.2<\/span><span class=\"pg\">指引 p.5-15～5-24<\/span><\/h2>\n<p>類比 vs 數位｜單工、半雙工、全雙工｜串列 vs 並列；同步（有時脈）vs 非同步｜UART（TX/RX）、I²C（SDA/SCL、位址、上拉）、SPI（4 線、CS、全雙工）｜AM／FM／PM（類比調變），ASK／FSK／PSK（數位資料→類比訊號）。<\/p>\n<h2>總整理：系統元件與架構 <span class=\"ref\">考科二 1-1<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<p>感→控→動＋通→雲→用｜MCU／SBC／PLC 選用｜端－邊－雲；閘道器協定轉換與斷線暫存｜HMI、SCADA、MES、ERP。<\/p>\n<h2>總整理：故障判斷與排除 <span class=\"ref\">考科二 1-2<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<p>先現象、由簡入繁、分層、二分、一次改一個、做紀錄｜電表（電流串聯、電壓並聯、電阻斷電）、示波器、邏輯分析儀、ping｜看門狗、NTP、2.4 GHz。<\/p>\n<h2>總整理：物聯網資訊安全 <span class=\"ref\">考科二 1-3<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<p>唯一密碼｜TLS 8883、DTLS｜Secure Boot＋簽章 OTA｜mTLS、X.509｜最小權限 ACL、分網段｜重放攻擊用 nonce／時間戳｜個資：最小化、同意、限期刪除。<\/p>\n<h2>總整理：硬體設計基礎 <span class=\"ref\">考科二 2-1<\/span><span class=\"supp\">補充（能力指標 2）<\/span><\/h2>\n<p>上拉／下拉、去彈跳｜ADC、PWM｜電晶體、MOSFET、繼電器、SSR、H 橋｜飛輪二極體、光耦合器｜中斷、看門狗｜RS-232 vs RS-485、4–20 mA｜開源硬體：CERN OHL、TAPR、CC BY-SA，商標除外。<\/p>\n<h2>總整理：雲端數據收集與平台設計 <span class=\"ref 0 最多一次、1 至少一次、2 恰好一次｜Modbus：主從、無加密、TCP 502 埠｜OPC UA：跨平台、可讀寫、內建安全｜MTConnect：工具機、唯讀、XML、HTTP<\/p>\n<h2>中介軟體與平台 <span class=\"ref\">考科一 2.4<\/span><span class=\"pg\">指引 p.4-73～4-79<\/span><\/h2>\n<p>IaaS 硬體｜PaaS 平台＋執行環境＋資料庫｜SaaS 軟體｜邊緣運算：低延遲、省頻寬｜資安：最小權限<\/p>\n<h2>資安與隱私 <span class=\"ref\">考科一 2.5<\/span><span class=\"pg\">指引 p.4-85～4-90<\/span><\/h2>\n<p>對稱 AES（同一把）｜非對稱：私鑰簽、公鑰驗＝不可否認｜雜湊 SHA256＝完整性、不可逆｜Mirai＝DDoS｜Repeater 無法隔離<\/p>\n<h2>感測技術 <span class=\"ref\">考科一 3.1<\/span><span class=\"pg\">指引 p.5-1～5-10<\/span><\/h2>\n<p>熱電偶：兩種金屬、席貝克效應、冷點補償｜Pt100：0 °C＝100 Ω｜NTC 溫升電阻降｜壓電→電荷｜應變規→電阻＋惠斯登電橋｜遲滯＝上升下降曲線不重合｜ADC 2ⁿ 階<\/p>\n<h2>訊號與通訊 <span class=\"ref\">考科一 3.2<\/span><span class=\"pg\">指引 p.5-15～5-24<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>介面<\/th>\n<th>線數<\/th>\n<th>同步<\/th>\n<th>雙工<\/th>\n<th>選裝置<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>UART<\/td>\n<td>TX、RX<\/td>\n<td>非同步（鮑率）<\/td>\n<td>全雙工<\/td>\n<td>點對點<\/td>\n<\/tr>\n<tr>\n<td>I²C<\/td>\n<td>SDA、SCL<\/td>\n<td>同步<\/td>\n<td>半雙工<\/td>\n<td>位址（需上拉）<\/td>\n<\/tr>\n<tr>\n<td>SPI<\/td>\n<td>SCLK、MOSI、MISO、CS<\/td>\n<td>同步<\/td>\n<td>全雙工<\/td>\n<td>片選 CS<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>sin 與 cos 差 90°｜並列快但貴、易干擾｜對講機半雙工、電話全雙工<\/p>\n<h2>系統元件與架構 <span class=\"ref\">考科二 1-1<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<p>感測器輸入、致動器輸出｜MCU 省電無 OS、SBC 跑 Linux、PLC 工業可靠｜Arduino 5 V、ESP32／Pi 3.3 V、Pi 無 ADC｜閘道器：協定轉換、前處理、斷線暫存｜HMI／SCADA 監控、MES 製造、ERP 企業<\/p>\n<h2>故障判斷與排除 <span class=\"ref\">考科二 1-2<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<table>\n<thead>\n<tr>\n<th>症狀<\/th>\n<th>先查<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>亂碼<\/td>\n<td>鮑率、8N1、TX↔RX、準位<\/td>\n<\/tr>\n<tr>\n<td>I²C 掃不到<\/td>\n<td>位址衝突、上拉電阻、線長<\/td>\n<\/tr>\n<tr>\n<td>負載啟動就重開機<\/td>\n<td>電壓下陷 → 分開供電、共地<\/td>\n<\/tr>\n<tr>\n<td>Wi-Fi 連不上<\/td>\n<td>2.4 GHz、RSSI、DHCP<\/td>\n<\/tr>\n<tr>\n<td>MQTT 收不到<\/td>\n<td>Topic 大小寫、1883／8883、Client ID<\/td>\n<\/tr>\n<tr>\n<td>Modbus 無回應<\/td>\n<td>Slave ID、A/B、鮑率、120 Ω<\/td>\n<\/tr>\n<tr>\n<td>時間錯亂<\/td>\n<td>NTP<\/td>\n<\/tr>\n<tr>\n<td>當機<\/td>\n<td>看門狗<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>電表：電流串聯、電壓並聯、電阻斷電｜邏輯分析儀解碼 UART／I²C／SPI｜ping、traceroute、nslookup<\/p>\n<h2>物聯網資訊安全 <span class=\"ref\">考科二 1-3<\/span><span class=\"supp\">補充（能力指標 3）<\/span><\/h2>\n<p>每台唯一密碼｜TLS（MQTT 8883）、DTLS（CoAP）｜Secure Boot＋簽章 OTA｜mTLS＋X.509｜最小權限 ACL、網路分段｜重放攻擊 → nonce、時間戳｜個資：最小化、告知同意、去識別、限期刪除、PbD<\/p>\n<h2>硬體設計基礎 <span class=\"ref\">考科二 2-1<\/span><span class=\"supp\">補充（能力指標 2）<\/span><\/h2>\n<p>浮接 → 上拉／下拉｜去彈跳｜PWM 平均電壓＝V×占空比｜LED 限流 R＝(V−Vf)÷I｜感性負載加飛輪二極體｜光耦合器隔離｜中斷省電反應快｜RS-485 差動多點約 1200 m｜4–20 mA：0 mA＝斷線｜開源硬體：CERN OHL（P／W／S）、TAPR、CC BY-SA，商標除外<\/p>\n<h2>雲端數據收集與平台設計 <span class=\"ref\">考科二 2-2<\/span><span class=\"supp\">補充（能力指標 1）<\/span><\/h2>\n<p>JSON 雙引號、無尾逗號、無註解｜XML 單一根、大小寫｜GET 讀、POST 新增（201）、401 未認證、403 無權限、404 找不到｜Topic：+ 單層、# 多層（放最後）｜PK 唯一非空、FK 參照｜1NF 單一值、2NF 完全相依、3NF 無遞移｜DDL 定義、DML 操作、DCL 權限｜時序 DB 存讀值｜GPL 傳染、LGPL 連結可閉源、MIT／BSD／Apache（專利授權）寬鬆、AGPL 網路服務也算<\/p>\n<h2>智慧製造流程優化與成本控制 <span class=\"ref\">考科二 2-3<\/span><span class=\"supp\">補充（依簡章評鑑內容 2-3）<\/span><\/h2>\n<p>OEE＝可用率×效能×品質（停機換模／變慢小停／不良啟動）｜七大浪費：過量、庫存、搬運、等待、動作、過度加工、不良｜JIT、看板拉式、Jidoka＋安燈、防呆、5S（整理整頓清掃清潔素養）、SMED、TPM｜ISA-95：ERP L4、MES L3、SCADA L2、PLC L1｜PDCA、DMAIC、管制圖 ±3σ、魚骨 4M1E、柏拉圖 80/20｜節拍＝可用時間÷需求｜瓶頸決定產出｜CAPEX／OPEX／TCO｜ROI＝(效益−成本)÷成本｜回收期＝投資÷年效益<\/p>", "intro": "<h3>這份讀書包怎麼用<\/h3>\n<ul>\n<li><strong>13 天 × 每天 30 分鐘<\/strong>：每天先「今日學習」（約 15～20 分鐘），再做「今日驗證」（10～12 題，作答立刻顯示對錯與解析），最後勾選「今天完成」。<\/li>\n<li>D6、D7（考科一）與 D12（考科二）是<strong>計時模擬考<\/strong>，交卷後才顯示成績與解析；預設 30 分鐘，可切換成正式的 75 分鐘。<\/li>\n<li>答錯的題目自動收進「錯題本」，重做答對就移出；作答紀錄存在這台裝置的瀏覽器（localStorage），可在「設定」匯出／匯入進度。<\/li>\n<\/ul>\n<h3>內容依據與標示規則<\/h3>\n<ul>\n<li>每一段講義與每一題都標註<strong>官方評鑑內容編號<\/strong>（例如「考科一 2.2」「考科二 2-1」），範圍完全依照 115 年簡章公告的評鑑主題與評鑑內容。<\/li>\n<li><strong>考科一<\/strong>以官方《AIoT 應用工程師（初級）學習指引—考科一 AIoT 基礎概論》為主要依據，盡量標出指引頁碼（例如「指引 p.4-62」）；指引沒涵蓋、以一般技術知識補充的部分標示「<strong>補充<\/strong>」。<\/li>\n<li><strong>考科二目前沒有官方學習指引<\/strong>，講義與題目是依簡章的 6 項評鑑內容（1-1～2-3）與 3 項能力指標逐條撰寫，全部屬於一般技術知識（標「補充」）。<\/li>\n<li><strong>所有題目都不是考古題或官方題目。<\/strong> 每日驗證與 D12、D13 題目為原創練習題；D6、D7 模擬考題目<strong>改編自官方學習指引<\/strong>各節練習評量，並標出原題頁碼。指引原題若有答案與解析不一致等問題，已依技術常識修正並以 ⚠️ 標註。<\/li>\n<li>115 年簡章未載明題數（舊制每科 50 題），每科 75 分鐘、70 分及格。<\/li>\n<\/ul>"};
const KEY = 'ipas_aiot_v1';
const L = 'ABCD';
let S = load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');return Object.assign({done:{},answers:{},wrong:{},mock:{}},s)}catch(e){return{done:{},answers:{},wrong:{},mock:{}}}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
const $=s=>document.querySelector(s);
const QI={};DATA.days.forEach(d=>d.questions.forEach(q=>{q.day=d.id;QI[q.id]=q}));
const pad=n=>String(n).padStart(2,'0');
function todayStr(){const t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())}
function todayDay(){const t=todayStr();const d=DATA.days.find(d=>d.date===t);if(d)return d.id;return t<DATA.days[0].date?1:DATA.days.length}
function md(s){return s.slice(5).replace('-','/')}
const WK='日一二三四五六';
function wk(s){const [y,m,d]=s.split('-').map(Number);return WK[new Date(y,m-1,d).getDay()]}
function subjTag(s){return `<span class="tag ${s==='考科一'?'s1':s==='考科二'?'s2':'s3'}">${s}</span>`}
function dayStats(d){let a=0,c=0;d.questions.forEach(q=>{const r=S.answers[q.id];if(r){a++;if(r.ok)c++}});return{a,c,n:d.questions.length}}
function itemStats(code){let n=0,a=0,c=0;Object.values(QI).forEach(q=>{if(q.ref!==code)return;n++;const r=S.answers[q.id];if(r){a++;if(r.ok)c++}});return{n,a,c}}
function pct(c,a){return a?Math.round(c/a*100)+'%':'—'}
function wrapTables(root){root.querySelectorAll('table').forEach(t=>{if(t.parentElement.classList.contains('tw'))return;const w=document.createElement('div');w.className='tw';t.replaceWith(w);w.appendChild(t)})}

function navHtml(r){const td=todayDay();const items=[['#/','總覽','home'],[`#/day/${td}`,`今天 D${td}`,'day'+td],['#/wrong',`錯題本 (${Object.keys(S.wrong).length})`,'wrong'],['#/audio','🎧 有聲教材','audio'],['#/cheat','速記表','cheat'],['#/map','範圍對照','map'],['#/settings','設定','settings']];
 return items.map(([h,t,k])=>`<a href="${h}" class="${r===k?'on':''}">${t}</a>`).join('')}

function route(){const h=location.hash.replace(/^#\/?/,'');const p=h.split('/');let r='home';
 if(p[0]==='day'&&DATA.days[+p[1]-1]){r='day'+(+p[1]);renderDay(+p[1],p[2]||'learn')}
 else if(p[0]==='wrong'){r='wrong';renderWrong()}
 else if(p[0]==='audio'){r='audio';renderAudioList()}
 else if(p[0]==='cheat'){r='cheat';renderCheat()}
 else if(p[0]==='map'){r='map';renderMap()}

 else renderHome();
 $('#nav').innerHTML=navHtml(r);wrapTables($('#app'));bindAudio();}

 DATA.official.forEach(o=>{const st=itemStats(o.code);
  h+=`<tr><td><span class="ref">${o.code}</span></td><td>${o.name}<div class="muted">${o.topic}</div></td><td class="muted">${o.guide}</td><td>${o.days.map(i=>`<a href="#/day/${i}">D${i}</a>`).join('、')}</td><td>${o.qn}</td><td><span class="acc">${pct(st.c,st.a)}</span><div class="muted">${st.a}/${st.n} 已作答</div></td></tr>`});
 return h+'</tbody></table>'}

function renderHome(){
 const ex=new Date(DATA.examDate+'T00:00:00');const now=new Date();const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 const left=Math.round((ex-t0)/864e5);
 const done=DATA.days.filter(d=>S.done[d.id]).length;
 let ta=0,tc=0;Object.values(S.answers).forEach(r=>{ta++;if(r.ok)tc++});
 const td=todayDay();
 let h=`<div class="card"><h1>iPAS AIoT 應用工程師（初級）13 天讀書包</h1><div class="muted">考試日期 2026/10/31（六）｜考科一 AIoT基礎概論、考科二 物聯網系統與應用｜各 75 分鐘、70 分及格</div></div>
 <div class="grid"><div class="stat"><div class="muted">距離考試</div><div class="big">${left>0?left:0}</div><div class="muted">天${left===0?'（今天就是考試日！）':''}</div></div>
 <div class="stat"><div class="muted">完成天數</div><div class="big">${done}<span style="font-size:20px">/13</span></div><div class="bar" style="margin-top:6px"><i style="width:${done/13*100}%"></i></div></div>
 <div class="stat"><div class="muted">總答題正確率</div><div class="big">${pct(tc,ta)}</div><div class="muted">已作答 ${ta} / ${Object.keys(QI).length} 題</div></div>
 <div class="stat"><div class="muted">錯題本</div><div class="big">${Object.keys(S.wrong).length}</div><div class="muted"><a href="#/wrong">去重做 →</a></div></div></div>
 <div class="card"><div class="row" style="justify-content:space-between"><b>13 天進度</b><span class="muted">${done}/13 天</span></div><div class="bar" style="margin:8px 0 14px"><i style="width:${done/13*100}%"></i></div>
 <div class="days">${DATA.days.map(d=>{const s=dayStats(d);return `<a class="day ${S.done[d.id]?'done':''} ${d.id===td?'today':''}" href="#/day/${d.id}"><b>D${d.id}｜${md(d.date)}（${wk(d.date)}）${S.done[d.id]?' ✅':''}</b>${subjTag(d.subject)}${d.type==='mock'?'<span class="tag mk">模擬考</span>':''}<div class="t">${d.short}</div><div class="muted">${s.n} 題｜${s.a?`答對 ${s.c}/${s.a}`:'未作答'}</div></a>`}).join('')}</div></div>
 <div class="card"><h2 style="margin-top:0">官方評鑑內容 ↔ 講義天數 對照表（含各項正確率）</h2><div class="muted" style="margin-bottom:8px">依 115 年簡章評鑑內容。每一項都至少有一天講義與題目涵蓋；「題數」為全部讀書包中標註該項的題目數。</div>${mapTable()}</div>
 <div class="card lec">${DATA.intro}</div>`;
 $('#app').innerHTML=h}

function renderMap(){$('#app').innerHTML=`<div class="card"><h1>官方評鑑內容 ↔ 講義天數</h1><div class="muted">依 115 年簡章。考科一依官方學習指引；考科二無官方學習指引，依簡章評鑑內容與能力指標逐條對應。</div></div><div class="card">${mapTable()}</div>`}

function qHeader(q,i){return `<div class="hd"><span class="n">第 ${i} 題</span><span class="ref">${q.ref}</span>${q.src?`<span class="${/補充|能力指標|依簡章/.test(q.src)?'supp':'pg'}">${q.src}</span>`:''}</div>`}
function fbHtml(q,ok){return `<div class="fb ${ok?'ok':'no'}"><b>${ok?'✅ 答對了！':'❌ 答錯了，正確答案是 '+L[q.ans]}</b><div>${q.expH}</div><span class="o">題目來源：${q.origin}</span></div>`}

function quizCard(q,i,mode){// mode: 'practice' | 'wrong'
 const r=mode==='practice'?S.answers[q.id]:null;
 let h=`<div class="q" id="q_${q.id}">${qHeader(q,i)}<div class="stem">${q.stemH}</div>`;
 q.optsH.forEach((o,k)=>{let cls='';if(r){if(k===q.ans)cls='right';else if(k===r.c)cls='wrong'}
  h+=`<button class="opt ${cls}" data-q="${q.id}" data-k="${k}" data-mode="${mode}" ${r?'disabled':''}>${L[k]}. ${o}</button>`});
 if(r)h+=fbHtml(q,r.ok)+`<div style="margin-top:8px"><button class="btn ghost sm" data-redo="${q.id}">清除重做</button></div>`;
 return h+'</div>'}

function bindQuiz(root,after){
 root.querySelectorAll('.opt[data-mode]').forEach(b=>b.onclick=()=>{const q=QI[b.dataset.q];const k=+b.dataset.k;const ok=k===q.ans;const mode=b.dataset.mode;
  S.answers[q.id]={c:k,ok,t:Date.now()};
  if(mode==='practice'){if(!ok)S.wrong[q.id]=Date.now();}
  else if(mode==='wrong'){if(ok)delete S.wrong[q.id];else S.wrong[q.id]=Date.now();}
  save();
  const card=b.closest('.q');card.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j===q.ans)x.classList.add('right');else if(j===k)x.classList.add('wrong')});
  card.insertAdjacentHTML('beforeend',fbHtml(q,ok)+(mode==='wrong'?`<div class="muted" style="margin-top:6px">${ok?'已移出錯題本。':'仍留在錯題本，下次再挑戰。'}</div>`:`<div style="margin-top:8px"><button class="btn ghost sm" data-redo="${q.id}">清除重做</button></div>`));
  bindRedo(card);$('#nav').innerHTML=navHtml(location.hash.startsWith('#/wrong')?'wrong':'day'+(location.hash.split('/')[2]||''));after&&after()});
 bindRedo(root)}
function bindRedo(root){root.querySelectorAll('[data-redo]').forEach(b=>b.onclick=()=>{delete S.answers[b.dataset.redo];save();route()})}

function renderDay(id,tab){
 const d=DATA.days[id-1];const isMock=d.type==='mock';
 const qtab=isMock?'mock':'quiz';if(tab!=='learn'&&tab!==qtab)tab='learn';
 const s=dayStats(d);
 let h=`<div class="card"><div class="muted">D${d.id}｜${d.date.replace(/-/g,'/')}（${wk(d.date)}）｜第 ${d.id} / 13 天</div><h1>${d.title}</h1>${subjTag(d.subject)}${isMock?`<span class="tag mk">計時模擬考 ${d.questions.length} 題</span>`:`<span class="tag">今日驗證 ${d.questions.length} 題</span>`}
 <div class="row" style="margin-top:8px">${id>1?`<a class="btn ghost sm" href="#/day/${id-1}">← D${id-1}</a>`:''}${id<13?`<a class="btn ghost sm" href="#/day/${id+1}">D${id+1} →</a>`:''}</div></div>
 <div class="tabs"><button class="${tab==='learn'?'on':''}" onclick="location.hash='#/day/${id}/learn'">📖 今日學習</button><button class="${tab!=='learn'?'on':''}" onclick="location.hash='#/day/${id}/${qtab}'">✏️ ${isMock?'模擬考':'今日驗證'}${s.a?` (${s.c}/${s.n})`:''}</button></div>`;
 if(tab==='learn'){h+=audioHtml(d)+`<div class="card lec">${d.lecture}</div><div class="row"><a class="btn" href="#/day/${id}/${qtab}">讀完了，去${isMock?'模擬考':'做今日驗證'} →</a></div>`}
 else if(!isMock){h+=`<div class="card"><b>今日驗證</b>｜作答後立即顯示對錯與解析；答錯的題目自動收進錯題本。<div class="muted" id="qs">已作答 ${s.a}/${s.n}，答對 ${s.c}</div></div>`;
  d.questions.forEach((q,i)=>h+=quizCard(q,i+1,'practice'))}
 else h+=`<div id="mock"></div>`;
 h+=`<label class="done-box" style="margin-top:16px"><input type="checkbox" id="donecb" ${S.done[id]?'checked':''}> 今天完成了（學習＋驗證）${S.done[id]?' 🎉':''}</label>`;
 $('#app').innerHTML=h;
 $('#donecb').onchange=e=>{if(e.target.checked)S.done[id]=Date.now();else delete S.done[id];save();route()};
 if(tab!=='learn'&&!isMock)bindQuiz($('#app'),()=>{const s=dayStats(d);$('#qs').textContent=`已作答 ${s.a}/${s.n}，答對 ${s.c}`});
 if(tab==='mock')renderMock(d)}

let TIMER=null;
function renderMock(d){
 clearInterval(TIMER);const box=$('#mock');let m=S.mock[d.id];
 if(!m){box.innerHTML=`<div class="card"><h2 style="margin-top:0">${d.title}</h2><p>共 <b>${d.questions.length}</b> 題單選題。考試模式：作答中<b>不顯示對錯</b>，交卷（或時間到自動交卷）後才顯示分數、各評鑑內容得分與解析。中途離開頁面，計時與作答會保留。</p>
  <div class="row"><label>作答時間：<select id="mmin"><option value="${d.minutes||30}">${d.minutes||30} 分鐘（每日 30 分鐘版）</option><option value="75">75 分鐘（正式考試時間）</option></select></label><button class="btn" id="mstart">開始模擬考</button></div></div>`;
  $('#mstart').onclick=()=>{S.mock[d.id]={start:Date.now(),minutes:+$('#mmin').value,sel:{},submitted:false};save();renderMock(d)};return}
 if(!m.submitted){
  const end=m.start+m.minutes*60e3;
  let h=`<div class="timer" id="tmr"><span>⏱ 剩餘時間</span><span class="tm" id="tm"></span><span id="mcnt"></span></div>`;
  d.questions.forEach((q,i)=>{h+=`<div class="q">${qHeader(q,i+1)}<div class="stem">${q.stemH}</div>${q.optsH.map((o,k)=>`<button class="opt ${m.sel[q.id]===k?'sel':''}" data-mq="${q.id}" data-k="${k}">${L[k]}. ${o}</button>`).join('')}</div>`});
  h+=`<div class="row"><button class="btn" id="msub">交卷</button><button class="btn ghost" id="mquit">放棄並重來</button></div>`;
  box.innerHTML=h;
  const cnt=()=>{$('#mcnt').textContent=`已答 ${Object.keys(m.sel).length}/${d.questions.length}`};cnt();
  box.querySelectorAll('[data-mq]').forEach(b=>b.onclick=()=>{m.sel[b.dataset.mq]=+b.dataset.k;save();b.parentElement.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');cnt()});
  const tick=()=>{const left=Math.max(0,end-Date.now());const mm=Math.floor(left/60e3),ss=Math.floor(left%60e3/1e3);const el=$('#tm');if(!el){clearInterval(TIMER);return}el.textContent=pad(mm)+':'+pad(ss);$('#tmr').classList.toggle('low',left<5*60e3);if(left<=0){clearInterval(TIMER);alert('時間到，自動交卷！');submitMock(d)}};
  tick();TIMER=setInterval(tick,1000);
  $('#msub').onclick=()=>{const un=d.questions.length-Object.keys(m.sel).length;if(un&&!confirm(`還有 ${un} 題未作答，確定交卷？`))return;submitMock(d)};
  $('#mquit').onclick=()=>{if(confirm('確定放棄這次模擬考？作答會清除。')){delete S.mock[d.id];save();renderMock(d)}};
  return}
 // result
 const by={};let c=0;d.questions.forEach(q=>{const ok=m.sel[q.id]===q.ans;if(ok)c++;by[q.ref]=by[q.ref]||{n:0,c:0};by[q.ref].n++;if(ok)by[q.ref].c++});
 const sc=Math.round(c/d.questions.length*100);const used=Math.round((m.end-m.start)/60e3);
 let h=`<div class="card"><div class="muted">模擬考成績（${m.minutes} 分鐘版，用時約 ${used} 分鐘）</div><div class="score" style="color:${sc>=70?'var(--ok)':'var(--bad)'}">${sc} 分 <span style="font-size:18px">${sc>=70?'✅ 達 70 分及格線':'未達 70 分，加油！'}</span></div><div>答對 ${c} / ${d.questions.length} 題；答錯與未答的題目已加入錯題本。</div>
 <h3>各評鑑內容得分</h3><table><tr><th>評鑑內容</th><th>答對</th><th>正確率</th></tr>${Object.entries(by).sort().map(([k,v])=>`<tr><td><span class="ref">${k}</span></td><td>${v.c}/${v.n}</td><td>${Math.round(v.c/v.n*100)}%</td></tr>`).join('')}</table>
 <div class="row" style="margin-top:10px"><button class="btn ghost" id="mre">重新作答（清除本次成績）</button><a class="btn ghost" href="#/wrong">去錯題本</a></div></div>`;
 d.questions.forEach((q,i)=>{const s=m.sel[q.id];const ok=s===q.ans;
  h+=`<div class="q">${qHeader(q,i+1)} <span class="pill ${s===undefined?'na':ok?'ok':'no'}">${s===undefined?'未作答':ok?'答對':'答錯'}</span><div class="stem">${q.stemH}</div>${q.optsH.map((o,k)=>`<button class="opt ${k===q.ans?'right':k===s?'wrong':''}" disabled>${L[k]}. ${o}</button>`).join('')}${fbHtml(q,ok)}</div>`});
 box.innerHTML=h;wrapTables(box);
 $('#mre').onclick=()=>{if(confirm('清除本次模擬考成績並重新作答？（錯題本與正確率紀錄會保留）')){delete S.mock[d.id];save();renderMock(d)}}}
function submitMock(d){const m=S.mock[d.id];if(!m||m.submitted)return;m.submitted=true;m.end=Math.min(Date.now(),m.start+m.minutes*60e3);
 d.questions.forEach(q=>{const s=m.sel[q.id];const ok=s===q.ans;S.answers[q.id]={c:s===undefined?-1:s,ok,t:Date.now()};if(!ok)S.wrong[q.id]=Date.now()});
 save();clearInterval(TIMER);route();window.scrollTo(0,0)}

let WF='all';
function renderWrong(){
 const ids=Object.keys(S.wrong).filter(id=>QI[id]).sort((a,b)=>QI[a].day-QI[b].day||QI[a].n-QI[b].n);
 const refs=[...new Set(ids.map(i=>QI[i].ref))].sort();
 if(WF!=='all'&&!refs.includes(WF))WF='all';
 const list=ids.filter(i=>WF==='all'||QI[i].ref===WF);
 let h=`<div class="card"><h1>錯題本</h1><div class="muted">共 ${ids.length} 題。重做答對就自動移出；答錯會留著。建議每題用一句話寫下「我錯在哪個觀念」。</div>
 <div class="row" style="margin-top:8px"><label>篩選評鑑內容：<select id="wf"><option value="all">全部（${ids.length}）</option>${refs.map(r=>`<option value="${r}" ${WF===r?'selected':''}>${r}（${ids.filter(i=>QI[i].ref===r).length}）</option>`).join('')}</select></label></div></div>`;
 if(!list.length)h+=`<div class="card">🎉 目前沒有錯題。去做題目吧！</div>`;
 list.forEach((id,i)=>{const q=QI[id];h+=`<div class="muted" style="margin:14px 0 -6px">來自 <a href="#/day/${q.day}">D${q.day}</a> 第 ${q.n} 題</div>`+quizCard(q,i+1,'wrong')});
 $('#app').innerHTML=h;
 $('#wf').onchange=e=>{WF=e.target.value;renderWrong();wrapTables($('#app'))};
 bindQuiz($('#app'))}

function renderCheat(){$('#app').innerHTML=`<div class="card"><h1>考前速記表</h1><div class="muted">兩科各官方評鑑內容的最高頻考點。考前一晚與考場外快速翻閱。</div></div><div class="card lec">${DATA.cheat}</div>`}

function renderSettings(){
 $('#app').innerHTML=`<div class="card"><h1>設定與進度備份</h1><p>進度只存在這個瀏覽器（localStorage）。換手機或電腦前，先匯出進度檔，再到新裝置匯入。</p>
 <div class="row"><button class="btn" id="exp">匯出進度（JSON）</button></div>
 <p style="margin-top:14px">匯入進度檔：<input type="file" id="imp" accept=".json,application/json"></p>
 <p style="margin-top:14px"><button class="btn red" id="rst">清除全部進度</button></p></div>
 <div class="card muted">題庫：共 ${Object.keys(QI).length} 題｜每日驗證為原創練習題；D6、D7 改編自官方學習指引練習評量；皆非考古題或官方題目。</div>`;
 $('#exp').onclick=()=>{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ipas_aiot_progress_'+todayStr()+'.json';a.click()};
 $('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.answers)throw 0;S=Object.assign({done:{},answers:{},wrong:{},mock:{}},o);save();alert('匯入完成');route()}catch(x){alert('檔案格式不正確')}})};
 $('#rst').onclick=()=>{if(confirm('確定清除全部進度、作答與錯題？此動作無法復原。')){S={done:{},answers:{},wrong:{},mock:{}};save();route()}}}

const AKEY='ipas_aiot_audio';
function aLoad(){try{return Object.assign({pos:{},rate:1},JSON.parse(localStorage.getItem(AKEY)||'{}'))}catch(e){return{pos:{},rate:1}}}
function aSave(a){try{localStorage.setItem(AKEY,JSON.stringify(a))}catch(e){}}
function fmtDur(t){t=Math.round(t||0);return Math.floor(t/60)+':'+pad(t%60)}
function audioHtml(d){if(!d.audio)return '';const a=aLoad();const r=a.rate||1;
 return `<div class="card aud"><b>🎧 有聲講義 D${d.id}</b> <span class="muted">（約 ${fmtDur(d.audio.dur)}，台灣華語口語版，可邊通勤邊聽）</span>
 <audio controls preload="metadata" data-ep="d${d.id}" src="${d.audio.src}"></audio>
 <div class="ctl">播放速度 <select class="arate">${[0.75,1,1.25,1.5,1.75,2].map(v=>`<option value="${v}" ${v==r?'selected':''}>${v}x</option>`).join('')}</select>
 <span class="muted apos"></span> <a class="btn ghost sm" href="#/audio">全部集數</a></div></div>`}
function bindAudio(){document.querySelectorAll('audio[data-ep]').forEach(au=>{const ep=au.dataset.ep;const card=au.closest('.aud');
 const sel=card&&card.querySelector('.arate');const info=card&&card.querySelector('.apos');
 const a0=aLoad();au.playbackRate=a0.rate||1;
 au.addEventListener('loadedmetadata',()=>{const p=aLoad().pos[ep];if(p&&p>5&&p<au.duration-5){au.currentTime=p;if(info)info.textContent='已從上次位置 '+fmtDur(p)+' 繼續'}au.playbackRate=aLoad().rate||1});
 au.addEventListener('play',()=>{au.playbackRate=aLoad().rate||1;document.querySelectorAll('audio[data-ep]').forEach(o=>{if(o!==au)o.pause()})});
 let last=0;const store=()=>{const a=aLoad();a.pos[ep]=au.ended?0:au.currentTime;aSave(a)};
 au.addEventListener('timeupdate',()=>{if(Date.now()-last>3000){last=Date.now();store()}});
 au.addEventListener('pause',store);au.addEventListener('ended',store);
 if(sel)sel.onchange=()=>{const a=aLoad();a.rate=+sel.value;aSave(a);document.querySelectorAll('audio[data-ep]').forEach(o=>o.playbackRate=a.rate);document.querySelectorAll('.arate').forEach(s=>s.value=sel.value)}})}
function renderAudioList(){const a=aLoad();let tot=0;const eps=DATA.days.filter(d=>d.audio);eps.forEach(d=>tot+=d.audio.dur);
 let h=`<div class="card"><h1>🎧 有聲教材</h1><div class="muted">共 ${eps.length} 集，總長約 ${Math.round(tot/60)} 分鐘。台灣華語口語講解，內容依各日講義（對應官方評鑑內容）改寫；每集結尾有口頭自測與 30 秒回顧。可調速 0.75x～2x，並自動記住每集上次聽到的位置。</div></div><div class="card alist">`;
 eps.forEach(d=>{const p=a.pos['d'+d.id];h+=`<div class="aud" style="border:0;background:none;padding:0"><div class="it"><div><b>D${d.id}</b> ${subjTag(d.subject)} ${d.short||d.title}<div class="muted">${fmtDur(d.audio.dur)}${p>5?'｜上次聽到 '+fmtDur(p):''}｜<a href="#/day/${d.id}">講義</a>｜<a href="${d.audio.src}" download>下載 MP3</a></div></div></div>
 <audio controls preload="none" data-ep="d${d.id}" src="${d.audio.src}"></audio>${d.id===eps[0].id?`<div class="ctl">播放速度 <select class="arate">${[0.75,1,1.25,1.5,1.75,2].map(v=>`<option value="${v}" ${v==(a.rate||1)?'selected':''}>${v}x</option>`).join('')}</select><span class="muted apos"></span></div>`:''}</div>`});
 $('#app').innerHTML=h+'</div>'}

route();
</script>
